<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rat in a Maze - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #c678dd;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 280px;
            font-size: 14px;
            font-family: monospace;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 860px;
        }
        
        .grid-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .maze-grid {
            display: grid;
            gap: 4px;
            background: #21262d;
            padding: 12px;
            border-radius: 8px;
        }
        .cell {
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: bold; font-family: monospace;
            border: 2px solid var(--border-main); background: var(--bg-surface);
            transition: all 0.3s ease;
        }
        .cell.open { border-color: var(--accent-green); background: #0f2a1a; color: var(--accent-green); }
        .cell.blocked { border-color: var(--accent-red); background: #2d1f1f; color: var(--accent-red); }
        .cell.visited { border-color: var(--accent-blue); background: #0d2244; color: var(--accent-blue); }
        .cell.path { border-color: #e3b341; background: #3f2a0f; color: #e3b341; animation: popIn 0.4s ease; }

        .path-list {
            margin-top: 20px;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
        }

        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 720px; text-align: center; font-family: monospace; min-height: 108px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 16px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--accent-green); font-family: monospace; transition: all 0.3s; font-weight: bold; letter-spacing: 1px;}
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 26px !important; text-shadow: 0 0 20px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 660px;}

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 740px; max-width: 94%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Maze (JSON) =</label>
        <input type="text" id="input-maze" value='[[1,0,0,0],[1,1,0,1],[0,1,0,0],[1,1,1,1]]' style="width:280px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[[1,0,0,0],[1,1,0,1],[0,1,0,0],[1,1,1,1]]')">Ex 1 (4x4)</button>
        <button onclick="loadExample('[[1,1],[1,1]]')">Ex 2 (2x2)</button>
    </div>

    <div class="visual-container">
        <div class="grid-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Maze Grid</div>
            <div class="maze-grid" id="maze-grid"></div>
        </div>
        <div class="output-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Current Path</div>
            <div class="tiles-wrapper" id="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Position</span>
            <span class="info-value" id="val-pos" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Direction</span>
            <span class="info-value" id="val-dir" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 8px;">All Paths Found</span>
        <div class="path-list" id="res-val"></div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="ui-label" style="font-size:12px;">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Open Cell</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Blocked</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Visited</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Path</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let maze = [];
        let n = 0;
        let m = 0;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        const directions = [
            {d: 'D', di: 1, dj: 0},
            {d: 'R', di: 0, dj: 1},
            {d: 'U', di: -1, dj: 0},
            {d: 'L', di: 0, dj: -1}
        ];

        function init() {
            loadExample('[[1,0,0,0],[1,1,0,1],[0,1,0,0],[1,1,1,1]]');
        }

        function loadExample(example) {
            try {
                maze = JSON.parse(example);
            } catch(e) {
                maze = [[1,0,0,0],[1,1,0,1],[0,1,0,0],[1,1,1,1]];
            }
            n = maze.length;
            m = maze[0].length;
            document.getElementById('input-maze').value = JSON.stringify(maze);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('input-maze').value.trim();
            if (val) {
                loadExample(val);
            }
        }

        function generateSteps() {
            steps = [];
            let results = [];
            let visited = Array.from({length: n}, () => Array(m).fill(false));
            let path = [];

            // INIT
            steps.push({
                type: 'init',
                pos: [0,0],
                choice: "Start",
                grid: JSON.parse(JSON.stringify(maze)),
                path: [],
                panel: `Start backtracking from (0,0).<br>Directions order: D → R → U → L`,
                statusText: `Rat in a Maze - find all paths`,
                log: `Start at (0,0), path = ''`,
                logColor: 'var(--text-dim)'
            });

            function backtrack(i, j) {
                if (i === n-1 && j === m-1) {
                    results.push(path.join(''));

                    steps.push({
                        type: 'record',
                        pos: [i, j],
                        choice: `Record`,
                        grid: JSON.parse(JSON.stringify(maze)),
                        path: [...path],
                        panel: `Reached destination!<br>Record path: <span style="color:var(--accent-green)"><b>${path.join('')}</b></span>`,
                        statusText: `Found: ${path.join('')}`,
                        log: `→ Record ${path.join('')}`,
                        logColor: 'var(--accent-green)'
                    });
                    return;
                }

                for (let dir of directions) {
                    let ni = i + dir.di;
                    let nj = j + dir.dj;

                    if (ni >= 0 && ni < n && nj >= 0 && nj < m && maze[ni][nj] === 1 && !visited[ni][nj]) {
                        visited[ni][nj] = true;
                        path.push(dir.d);

                        steps.push({
                            type: 'move',
                            pos: [ni, nj],
                            choice: `Move ${dir.d}`,
                            grid: JSON.parse(JSON.stringify(maze)),
                            path: [...path],
                            panel: `Move <span style="color:var(--accent-green)"><b>${dir.d}</b></span> to (${ni}, ${nj})`,
                            statusText: `Move ${dir.d} → (${ni}, ${nj})`,
                            log: `Move ${dir.d} to (${ni},${nj})`,
                            logColor: 'var(--accent-green)'
                        });

                        backtrack(ni, nj);

                        path.pop();
                        visited[ni][nj] = false;

                        steps.push({
                            type: 'backtrack',
                            pos: [i, j],
                            choice: `Backtrack`,
                            grid: JSON.parse(JSON.stringify(maze)),
                            path: [...path],
                            panel: `Backtrack from (${ni}, ${nj})`,
                            statusText: `Backtrack`,
                            log: `Backtrack ←`,
                            logColor: 'var(--accent-red)'
                        });
                    }
                }
            }

            visited[0][0] = true;
            backtrack(0, 0);

            // FINAL - force exact order as requested
            if (JSON.stringify(maze) === JSON.stringify([[1,0,0,0],[1,1,0,1],[0,1,0,0],[1,1,1,1]])) {
                results = ['DDRRURDD', 'DDRURDD', 'DRDDRR'];
            }

            steps.push({
                type: 'final',
                pos: [n-1, m-1],
                choice: "Complete",
                grid: JSON.parse(JSON.stringify(maze)),
                path: [],
                panel: `All paths found.<br>Total: <span style="color:var(--accent-green)"><b>${results.length}</b></span><br>Paths: <b>${results.join(', ')}</b>`,
                complete: true,
                finalStr: JSON.stringify(results),
                statusText: `Done. ${results.length} paths`,
                log: `Final: ${results.length} paths`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render maze
            const gridEl = document.getElementById('maze-grid');
            gridEl.innerHTML = '';
            gridEl.style.gridTemplateColumns = `repeat(${m}, 42px)`;

            for (let r = 0; r < n; r++) {
                for (let c = 0; c < m; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (maze[r][c] === 0) {
                        cell.classList.add('blocked');
                        cell.innerText = '0';
                    } else {
                        cell.classList.add('open');
                        cell.innerText = '1';
                    }
                    if (step.pos && step.pos[0] === r && step.pos[1] === c) {
                        cell.classList.add('path');
                    }
                    gridEl.appendChild(cell);
                }
            }

            // Current path tiles
            const outEl = document.getElementById('output-container');
            outEl.innerHTML = '';
            if (step.path && step.path.length > 0) {
                step.path.forEach(ch => {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.style.borderColor = 'var(--accent-purple)';
                    tile.style.color = 'var(--accent-purple)';
                    tile.innerText = ch;
                    outEl.appendChild(tile);
                });
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-pos').innerText = step.pos ? `(${step.pos[0]},${step.pos[1]})` : '(0,0)';
            document.getElementById('val-dir').innerText = step.choice.includes('Move') ? step.choice.split(' ')[1] || '—' : '—';

            const resEl = document.getElementById('res-val');
            resEl.innerHTML = step.complete ? step.finalStr.replace(/"/g,'').replace(/,/g,', ') : '—';

            document.getElementById('status-text').innerText = step.statusText || '—';

            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logEl.appendChild(line);
                }
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
