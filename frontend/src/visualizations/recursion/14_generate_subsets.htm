<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Subsets (Backtracking) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 260px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 820px;
        }
        
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 200px;
            height: 320px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 10px;
            background: rgba(22, 27, 34, 0.5);
            overflow-y: auto;
        }
        .stack-frame {
            width: 100%;
            padding: 10px 0;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 13.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-blue);
            font-weight: bold;
            z-index: 2;
        }

        .output-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 320px;
            justify-content: flex-end;
        }
        .tiles-wrapper { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 420px; 
            min-height: 90px; 
            padding: 15px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
        }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 22px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--accent-green); background: #0f2a1a;
            color: var(--accent-green);
            animation: popIn 0.35s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .action-panel {
            margin-top: 22px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 700px; text-align: center; font-family: monospace; min-height: 95px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.55;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 9px 16px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 5px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 26px; color: var(--accent-green); font-family: monospace; transition: all 0.3s; font-weight: bold; letter-spacing: 3px;}
        .pop { animation: popAnim 450ms ease; color: var(--accent-green) !important; font-size: 32px !important; text-shadow: 0 0 18px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.22)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 620px;}

        .controls { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; cursor: pointer; }

        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 2px; margin-right: 7px; display: inline-block; }

        .log-panel {
            margin-top: 14px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 135px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Array =</label>
        <input type="text" id="arr-input" value="[1, 2]" style="width:260px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[1, 2]')">Ex 1 ([1, 2])</button>
        <button onclick="loadExample('[3]')">Ex 2 ([3])</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Call Stack (Decision Path)</div>
            <div class="stack-container" id="stack-container"></div>
        </div>
        <div class="output-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Current Subset</div>
            <div class="tiles-wrapper" id="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Index</span>
            <span class="info-value" id="val-index" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Choice</span>
            <span class="info-value" id="val-choice" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">All Subsets</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:5px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Active Decision</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Include</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Exclude</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let targetArr = [1, 2];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample("[1, 2]"); }

        function parseArray(str) {
            try {
                return JSON.parse(str);
            } catch(e) {
                return [1, 2];
            }
        }

        function loadExample(exampleStr) {
            targetArr = parseArray(exampleStr);
            document.getElementById('arr-input').value = exampleStr;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('arr-input').value.trim();
            if (val) {
                loadExample(val);
            }
        }

        function generateSteps() {
            steps = [];
            let callStack = [];
            let resultSubsets = [];
            let currentSubset = [];

            // INIT
            steps.push({
                type: 'init', curr: targetArr, choice: 'Start', current: [],
                stack: [...callStack], output: [[]],
                panel: `Initialize backtracking to generate all subsets of <code>${JSON.stringify(targetArr)}</code>.<br>Start with empty subset.`,
                statusText: `Generating subsets for ${JSON.stringify(targetArr)}`,
                log: `subsets(${JSON.stringify(targetArr)})`,
                logColor: 'var(--text-dim)'
            });

            function backtrack(start) {
                callStack.push(`backtrack(${start})`);

                // Add current subset to results (copy)
                const subsetCopy = [...currentSubset];
                resultSubsets.push(subsetCopy);

                steps.push({
                    type: 'record', curr: targetArr, choice: `Record subset`, current: subsetCopy,
                    stack: [...callStack], output: [subsetCopy],
                    panel: `Record current subset: <span style="color:var(--accent-green)"><b>${JSON.stringify(subsetCopy)}</b></span>`,
                    statusText: `Record ${JSON.stringify(subsetCopy)}`,
                    log: `Record ${JSON.stringify(subsetCopy)}`,
                    logColor: 'var(--accent-green)'
                });

                for (let i = start; i < targetArr.length; i++) {
                    const elem = targetArr[i];

                    // Include
                    currentSubset.push(elem);
                    steps.push({
                        type: 'include', curr: targetArr, choice: `Include ${elem}`, current: [...currentSubset],
                        stack: [...callStack], output: [...currentSubset],
                        panel: `Include <span style="color:var(--accent-green)"><b>${elem}</b></span> → current = <b>${JSON.stringify(currentSubset)}</b>`,
                        statusText: `Include ${elem}`,
                        log: `  Include ${elem}`,
                        logColor: 'var(--accent-green)'
                    });
                    backtrack(i + 1);

                    // Backtrack (exclude next time)
                    currentSubset.pop();
                    steps.push({
                        type: 'backtrack', curr: targetArr, choice: `Exclude ${elem}`, current: [...currentSubset],
                        stack: [...callStack], output: [...currentSubset],
                        panel: `Backtrack: Remove <span style="color:var(--accent-red)"><b>${elem}</b></span>`,
                        statusText: `Backtrack exclude ${elem}`,
                        log: `  Exclude ${elem}`,
                        logColor: 'var(--accent-red)'
                    });
                }

                callStack.pop();
            }

            backtrack(0);

            // FINAL
            steps.push({
                type: 'final', curr: '—', choice: '—', current: [],
                stack: [], output: resultSubsets,
                panel: `Backtracking complete.<br>All subsets generated: <span style="color:var(--accent-green)"><b>${JSON.stringify(resultSubsets)}</b></span>`,
                complete: true,
                finalStr: JSON.stringify(resultSubsets),
                statusText: `Done. ${resultSubsets.length} subsets`,
                log: `Final: ${resultSubsets.length} subsets`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';

            step.stack.forEach((frameStr, i) => {
                const frame = document.createElement('div');
                const isTop = (i === step.stack.length - 1);
                frame.className = `stack-frame ${isTop ? 'active' : ''}`;
                frame.innerHTML = frameStr;
                stackContainer.appendChild(frame);
            });

            const outContainer = document.getElementById('output-container');
            outContainer.innerHTML = '';
            if (step.output && step.output.length > 0) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = JSON.stringify(step.output[0]);
                outContainer.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-index').innerText = step.curr === targetArr ? '—' : step.choice || '—';
            document.getElementById('val-choice').innerText = step.choice || '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
