<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Digits of a Number (Recursion) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 140px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 50px; 
            width: 100%; 
            max-width: 800px;
        }
        
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 6px;
            width: 180px;
            height: 300px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 10px;
            background: rgba(22, 27, 34, 0.5);
            overflow-y: auto;
        }
        .stack-frame {
            width: 100%;
            padding: 10px 0;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--accent-blue);
            font-weight: bold;
            z-index: 2;
        }

        .output-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 300px;
            justify-content: flex-end;
        }
        .tiles-wrapper { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 400px; 
            min-height: 70px; 
            padding: 15px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
        }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--accent-green); background: #0f2a1a;
            color: var(--accent-green);
            animation: popIn 0.3s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 22px; width: 680px; text-align: center; font-family: monospace; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 9px 16px; display: flex; flex-direction: column; align-items: center; min-width: 115px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 26px; color: var(--accent-green); font-family: monospace; transition: all 0.3s; font-weight: bold; letter-spacing: 3px;}
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 32px !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 620px;}

        .controls { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; cursor: pointer; }

        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 2px; margin-right: 7px; display: inline-block; }

        .log-panel {
            margin-top: 14px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 135px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">N =</label>
        <input type="number" id="num-input" placeholder="12345" min="-999999" max="999999">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(12345)">Ex 1 (12345)</button>
        <button onclick="loadExample(-987)">Ex 2 (-987)</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Call Stack</div>
            <div class="stack-container" id="stack-container"></div>
        </div>
        <div class="output-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Current Sum</div>
            <div class="tiles-wrapper" id="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current n</span>
            <span class="info-value" id="val-curr" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Digit</span>
            <span class="info-value" id="val-digit" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Sum of digits =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:5px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Active Call</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Added Digit</div>
        <div class="legend-item"><span class="dot" style="background:var(--btn-bg); border: 1px solid var(--border-main)"></span> Waiting Call</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let targetN = 12345;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(12345); }

        function loadExample(newN) {
            targetN = parseInt(newN);
            document.getElementById('num-input').value = targetN;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valStr = document.getElementById('num-input').value;
            const parsedN = parseInt(valStr);
            if (!isNaN(parsedN)) {
                loadExample(parsedN);
            } else {
                alert("Please enter a valid integer.");
            }
        }

        function generateSteps() {
            steps = [];
            let callStack = [];
            let currentSum = 0;
            let absN = Math.abs(targetN);

            // STEP 0: INIT
            steps.push({
                type: 'init', curr: targetN, sum: 0,
                stack: [...callStack], output: [0],
                panel: `Computing sum of digits of <code>${targetN}</code>.<br>Using absolute value: ${absN}.<br>Base case: n == 0 returns 0.`,
                statusText: `Starting recursion for ${targetN}`,
                log: `sumDigits(${targetN})`,
                logColor: 'var(--text-dim)'
            });

            function solveRecursively(n) {
                callStack.push(`sumDigits(${n})`);

                steps.push({
                    type: 'call', curr: n, sum: currentSum,
                    stack: [...callStack], output: [currentSum],
                    panel: `Called <code>sumDigits(${n})</code>.<br>Base case check: ${n} == 0?`,
                    statusText: `sumDigits(${n})`,
                    log: `Call sumDigits(${n})`,
                    logColor: 'var(--text-main)'
                });

                if (n === 0) {
                    steps.push({
                        type: 'base', curr: 0, sum: currentSum,
                        stack: [...callStack], output: [currentSum],
                        panel: `<span style="color:var(--accent-red)">Base case</span>: n == 0 → return 0`,
                        statusText: `Base case: return 0`,
                        log: `  Base → 0`,
                        logColor: 'var(--accent-red)'
                    });
                    callStack.pop();
                    return 0;
                }

                const digit = n % 10;
                const remaining = Math.floor(n / 10);

                steps.push({
                    type: 'extract', curr: n, sum: currentSum,
                    stack: [...callStack], output: [currentSum],
                    panel: `Last digit = <span style="color:var(--accent-green)"><b>${digit}</b></span><br>Remaining = ${remaining}`,
                    statusText: `Digit: ${digit}`,
                    log: `  Digit = ${digit}`,
                    logColor: 'var(--accent-green)'
                });

                steps.push({
                    type: 'recurse', curr: n, sum: currentSum,
                    stack: [...callStack], output: [currentSum],
                    panel: `Recurse on remaining number: <code>sumDigits(${remaining})</code>`,
                    statusText: `Calling sumDigits(${remaining})`,
                    log: `  → sumDigits(${remaining})`,
                    logColor: 'var(--accent-blue)'
                });

                const subSum = solveRecursively(remaining);

                const total = digit + subSum;
                currentSum = total;

                steps.push({
                    type: 'add', curr: n, sum: total,
                    stack: [...callStack], output: [total],
                    panel: `Returned ${subSum} from recursion.<br>${digit} + ${subSum} = <b>${total}</b>`,
                    statusText: `${digit} + ${subSum} = ${total}`,
                    log: `  ${digit} + ${subSum} = ${total}`,
                    logColor: 'var(--accent-green)'
                });

                callStack.pop();
                if (callStack.length > 0) {
                    steps.push({
                        type: 'unwind', curr: n, sum: total,
                        stack: [...callStack], output: [total],
                        panel: `Returning <span style="color:var(--accent-green)"><b>${total}</b></span>`,
                        statusText: `Return ${total}`,
                        log: `Unwind → ${total}`,
                        logColor: 'var(--text-dim)'
                    });
                }

                return total;
            }

            const finalSum = solveRecursively(absN);

            // FINAL STEP
            steps.push({
                type: 'final', curr: '—', sum: finalSum,
                stack: [], output: [finalSum],
                panel: `Recursion finished.<br>Sum of digits of ${targetN} = <span style="color:var(--accent-green)"><b>${finalSum}</b></span>`,
                complete: true,
                finalStr: finalSum.toString(),
                statusText: `Done! Sum = ${finalSum}`,
                log: `Final Sum: ${finalSum}`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';

            step.stack.forEach((frame, i) => {
                const div = document.createElement('div');
                div.className = `stack-frame ${i === step.stack.length - 1 ? 'active' : ''}`;
                div.innerHTML = frame;
                stackContainer.appendChild(div);
            });

            const outContainer = document.getElementById('output-container');
            outContainer.innerHTML = '';
            if (step.output && step.output.length) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = step.output[0];
                outContainer.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-curr').innerText = step.curr;
            document.getElementById('val-digit').innerText = (step.type === 'extract' || step.type === 'add') ? (step.curr % 10 || 0) : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
