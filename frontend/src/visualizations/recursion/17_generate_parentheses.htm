<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Parentheses - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 90px;
            font-size: 15px;
            font-family: monospace;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 860px;
        }
        
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 210px;
            height: 340px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 12px;
            background: rgba(22, 27, 34, 0.6);
            overflow-y: auto;
        }
        .stack-frame {
            width: 100%;
            padding: 9px 0;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 13.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-blue);
            font-weight: bold;
        }

        .output-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 340px;
            justify-content: flex-end;
        }
        .tiles-wrapper { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 440px; 
            min-height: 110px; 
            padding: 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
        }
        .tile {
            min-width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 19px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--accent-green); background: #0f2a1a;
            color: var(--accent-green);
            animation: popIn 0.4s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.2); opacity: 0; }
            60% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 720px; text-align: center; font-family: monospace; min-height: 108px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 16px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 23px; color: var(--accent-green); font-family: monospace; transition: all 0.3s; font-weight: bold; letter-spacing: 1px;}
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 27px !important; text-shadow: 0 0 20px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 660px;}

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 740px; max-width: 94%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="input-n" value="2" min="0" max="8" style="width:90px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 (n=1)</button>
        <button onclick="loadExample(2)">Ex 2 (n=2)</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Backtracking Stack</div>
            <div class="stack-container" id="stack-container"></div>
        </div>
        <div class="output-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Current Sequence</div>
            <div class="tiles-wrapper" id="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Open Used</span>
            <span class="info-value" id="val-open" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Close Used</span>
            <span class="info-value" id="val-close" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 8px;">All Valid Parentheses</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="ui-label" style="font-size:12px;">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Active Frame</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Add '(' or ')'</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Backtrack</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let n = 2;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1700, 850, 400];

        function init() {
            loadExample(2);
        }

        function loadExample(val) {
            n = parseInt(val);
            document.getElementById('input-n').value = n;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('input-n').value);
            if (!isNaN(val) && val >= 0 && val <= 8) {
                n = val;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            let callStack = [];
            let result = [];
            let current = "";

            // INIT
            steps.push({
                type: 'init',
                current: "",
                open: 0,
                close: 0,
                choice: "Start",
                stack: [],
                output: "",
                panel: `Start backtracking to generate all valid parentheses for <b>n=${n}</b>.<br>Constraints: open ≤ ${n}, close ≤ open.`,
                statusText: `Generate valid parentheses for n=${n}`,
                log: `backtrack("", open=0, close=0)`,
                logColor: 'var(--text-dim)'
            });

            function backtrack(curr, openCount, closeCount) {
                callStack.push(`backtrack("${curr}", open=${openCount}, close=${closeCount})`);

                // Base case
                if (curr.length === 2 * n) {
                    result.push(curr);
                    steps.push({
                        type: 'record',
                        current: curr,
                        open: openCount,
                        close: closeCount,
                        choice: `Record`,
                        stack: [...callStack],
                        output: curr,
                        panel: `Complete valid sequence found.<br>Record: <span style="color:var(--accent-green)"><b>${curr}</b></span>`,
                        statusText: `Record ${curr}`,
                        log: `  → Record "${curr}"`,
                        logColor: 'var(--accent-green)'
                    });
                } else {
                    // Add '(' if possible
                    if (openCount < n) {
                        steps.push({
                            type: 'include',
                            current: curr + '(',
                            open: openCount + 1,
                            close: closeCount,
                            choice: `Add '('`,
                            stack: [...callStack],
                            output: curr + '(',
                            panel: `Add opening <span style="color:var(--accent-green)"><b>(</b></span><br>open=${openCount+1}, close=${closeCount}`,
                            statusText: `Add '('`,
                            log: `  Add '(' → "${curr}("`,
                            logColor: 'var(--accent-green)'
                        });
                        backtrack(curr + '(', openCount + 1, closeCount);
                    }

                    // Add ')' if possible
                    if (closeCount < openCount) {
                        steps.push({
                            type: 'include',
                            current: curr + ')',
                            open: openCount,
                            close: closeCount + 1,
                            choice: `Add ')'`,
                            stack: [...callStack],
                            output: curr + ')',
                            panel: `Add closing <span style="color:var(--accent-green)"><b>)</b></span><br>open=${openCount}, close=${closeCount+1}`,
                            statusText: `Add ')'`,
                            log: `  Add ')' → "${curr})"`,
                            logColor: 'var(--accent-green)'
                        });
                        backtrack(curr + ')', openCount, closeCount + 1);
                    }
                }

                callStack.pop();
            }

            backtrack("", 0, 0);

            // FINAL
            steps.push({
                type: 'final',
                current: "",
                open: n,
                close: n,
                choice: "Complete",
                stack: [],
                output: result.join(", "),
                panel: `Backtracking complete for n=${n}.<br>All valid combinations: <span style="color:var(--accent-green)"><b>${JSON.stringify(result)}</b></span>`,
                complete: true,
                finalStr: JSON.stringify(result),
                statusText: `Done. ${result.length} valid combinations`,
                log: `Final: ${result.length} valid parentheses`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';

            step.stack.forEach((frameStr, i) => {
                const frame = document.createElement('div');
                frame.className = `stack-frame ${i === step.stack.length - 1 ? 'active' : ''}`;
                frame.innerHTML = frameStr;
                stackContainer.appendChild(frame);
            });

            const outContainer = document.getElementById('output-container');
            outContainer.innerHTML = '';
            if (step.output) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = step.output;
                outContainer.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-open').innerText = step.open !== undefined ? step.open : '—';
            document.getElementById('val-close').innerText = step.close !== undefined ? step.close : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
