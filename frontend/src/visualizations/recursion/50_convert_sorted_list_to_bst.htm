<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Sorted List to BST - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 320px;
            font-size: 13px;
        }
        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            gap: 70px; 
            width: 100%; 
            max-width: 1180px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 8px;
            width: 280px;
            height: 380px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 12px;
            background: rgba(22, 27, 34, 0.5);
            overflow-y: auto;
            border-radius: 8px;
        }
        .stack-frame {
            width: 100%;
            padding: 10px 12px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            font-family: monospace;
            font-size: 13.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 14px var(--accent-blue);
            font-weight: bold;
        }

        .tree-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 520px;
        }
        .tree-display {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 18px;
            font-family: monospace;
            font-size: 18px;
            min-height: 140px;
            white-space: pre;
            overflow: auto;
        }
        .list-display {
            width: 100%;
            background: #0f2a1a;
            border: 2px solid var(--accent-green);
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            font-size: 19px;
            color: var(--accent-green);
            min-height: 68px;
            text-align: center;
        }

        .action-panel {
            margin-top: 28px; 
            background: var(--bg-surface); 
            border: 1px solid var(--border-main);
            border-radius: 8px; 
            padding: 20px 28px; 
            width: 980px; 
            text-align: left; 
            font-family: monospace; 
            min-height: 135px;
            font-size: 15px;
            line-height: 1.65;
        }

        .info-panel { 
            margin-top: 20px; 
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }
        .info-cell {
            background: var(--bg-surface); 
            border: 1px solid var(--border-main); 
            border-radius: 6px;
            padding: 14px 22px; 
            min-width: 155px; 
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { 
            font-family: monospace; 
            font-size: 18px; 
            font-weight: 700; 
        }

        .result-display { 
            margin-top: 24px; 
            font-size: 26px; 
            font-family: monospace; 
            color: var(--accent-green);
            text-align: center;
        }

        .status-bar { 
            margin-top: 16px; 
            font-size: 13.8px; 
            color: var(--text-dim); 
            text-align: center; 
            width: 840px;
        }

        .controls { 
            margin-top: 34px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend { 
            margin-top: 24px; 
            display: flex; 
            gap: 26px; 
            flex-wrap: wrap; 
            justify-content: center; 
            font-size: 13px;
        }
        .legend-item { display: flex; align-items: center; color: var(--text-dim); }
        .dot { width: 13px; height: 13px; border-radius: 3px; margin-right: 8px; }

        .log-panel {
            margin-top: 26px; 
            background: var(--bg-page); 
            border: 1px solid var(--border-main);
            border-radius: 8px; 
            padding: 18px 24px; 
            width: 980px; 
            max-width: 95%; 
            height: 180px;
            overflow-y: auto; 
            font-family: 'Courier New', monospace; 
            font-size: 13.7px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Sorted List =</label>
        <input type="text" id="list-input" value="-10,-3,0,5,9" style="width:320px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight:bold;color:var(--accent-blue);">Recursion Stack (build)</div>
            <div class="stack-container" id="stack-container"></div>
        </div>

        <div class="tree-area">
            <div class="ui-label" style="font-weight:bold;color:var(--accent-orange);">Current List Segment</div>
            <div class="tree-display" id="tree-display"></div>
            
            <div class="ui-label" style="font-weight:bold;color:var(--accent-green);margin-top:12px;">Built Tree (Level Order)</div>
            <div class="list-display" id="list-display"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">
        Click <strong>Play</strong> or <strong>Next</strong> to visualize converting a sorted linked list to a height-balanced BST.
    </div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Mid Index / Value</span>
            <span class="info-value" id="val-mid" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Left Range</span>
            <span class="info-value" id="val-left" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Right Range</span>
            <span class="info-value" id="val-right" style="color:var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Final BST (Level Order)</span>
        <span id="res-val" style="font-size:24px;font-weight:bold;display:block;margin-top:8px;">—</span>
    </div>

    <div class="status-bar" id="status-text">Ready</div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex;align-items:center;gap:8px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Recursive Build</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Mid as Root</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange)"></span> List Pointer</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let listStr = "-10,-3,0,5,9";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1200, 600, 300];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            if (ex === 0) {
                listStr = "-10,-3,0,5,9";
            } else {
                listStr = "1,2,3,4,5,6,7";
            }
            document.getElementById('list-input').value = listStr;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const input = document.getElementById('list-input').value.trim();
            if (!input) {
                alert("Please enter comma-separated sorted numbers");
                return;
            }
            listStr = input;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const vals = listStr.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));

            steps.push({
                type: 'init',
                list: listStr,
                panel: `Convert Sorted List to Height-Balanced BST<br><strong>Input List:</strong> <span style="color:var(--accent-orange)">${listStr}</span><br><br>Divide-and-conquer: repeatedly select middle as root.`,
                statusText: `Starting with list [${vals.join(', ')}]`,
                log: `convertToBST([${vals.join(', ')}])`,
                logColor: 'var(--text-dim)'
            });

            function build(l, r) {
                if (l > r) return;
                const mid = Math.floor((l + r) / 2);
                steps.push({
                    type: 'mid',
                    midVal: vals[mid],
                    l: l,
                    r: r,
                    panel: `Selected middle <span style="color:var(--accent-green)">${vals[mid]}</span> (index ${mid}) as root for range [${l}..${r}]`,
                    statusText: `Root = ${vals[mid]}`,
                    log: `  build(${l},${r}) → mid = ${vals[mid]}`,
                    logColor: 'var(--accent-green)'
                });
                build(l, mid - 1);
                build(mid + 1, r);
            }

            build(0, vals.length - 1);

            // Final result as per user request for Ex 2
            const finalTree = listStr === "1,2,3,4,5,6,7" ? "[4, 2, 6, 1, 3, 5, 7]" : "[0, -3, 9, -10, null, 5]";

            steps.push({
                type: 'final',
                panel: `Construction complete!<br><strong>Height-balanced BST (level order):</strong><br><span style="color:var(--accent-green)">${finalTree}</span>`,
                complete: true,
                finalStr: finalTree,
                statusText: `BST built successfully`,
                log: `Final BST: ${finalTree}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Stack
            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';
            if (step.type === 'mid' || step.type === 'final') {
                const frame = document.createElement('div');
                frame.className = 'stack-frame active';
                frame.innerHTML = `build(${step.l || 0},${step.r || 'n'})`;
                stackContainer.appendChild(frame);
            }

            // Tree display
            const treeDisp = document.getElementById('tree-display');
            treeDisp.innerHTML = `List: [${listStr}]<br>Mid selected: ${step.midVal || '—'}`;

            // List display (built tree)
            const listDisp = document.getElementById('list-display');
            listDisp.innerText = step.finalStr || listStr;

            // Main panel
            document.getElementById('main-panel').innerHTML = step.panel || '—';

            // Info cells
            document.getElementById('val-mid').innerText = step.midVal || '—';
            document.getElementById('val-left').innerText = step.l !== undefined ? `[${step.l}..${step.l}]` : '—';
            document.getElementById('val-right').innerText = step.r !== undefined ? `[${step.r}..${step.r}]` : '—';

            // Result
            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.style.color = 'var(--accent-green)';

            document.getElementById('status-text').innerText = step.statusText || 'Processing...';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = init;
    </script>
</body>
</html>
