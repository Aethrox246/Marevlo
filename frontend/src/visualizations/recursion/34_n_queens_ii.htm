<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Queens II - Solution Count Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #c678dd;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 80px;
            font-size: 14px;
            font-family: monospace;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-start; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 860px;
        }
        
        .board-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .board {
            display: grid;
            gap: 2px;
            background: #21262d;
            padding: 8px;
            border-radius: 8px;
        }
        .cell {
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-family: monospace; border: 1px solid var(--border-main);
            background: var(--bg-surface); transition: all 0.3s ease;
        }
        .cell.queen { background: var(--accent-green); color: #000; animation: popIn 0.4s ease; }
        .cell.current { border-color: var(--accent-orange); box-shadow: 0 0 0 3px var(--accent-orange); }

        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 720px; text-align: center; font-family: monospace; min-height: 108px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 16px; font-size: 28px; color: var(--accent-green); font-family: monospace; font-weight: bold; }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 660px;}

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 740px; max-width: 94%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }

        @keyframes popIn { 0%{transform:scale(0.6)} 100%{transform:scale(1)} }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">N =</label>
        <input type="text" id="input-n" value="4" style="width:80px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">N=4 (2 solutions)</button>
        <button onclick="loadExample(2)">N=1 (1 solution)</button>
    </div>

    <div class="visual-container">
        <div class="board-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Current Board (Row by Row)</div>
            <div class="board" id="board"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to explore backtracking</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Row</span>
            <span class="info-value" id="val-row" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Solutions Found</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="ui-label" style="font-size:12px;">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1" style="width:130px;">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Queen Placed</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange)"></span> Current Row</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let N = 4;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];
        let boardState = []; // for visualization only

        function init() {
            N = 4;
            document.getElementById('input-n').value = N;
            generateSteps();
            reset();
        }

        function loadExample(ex) {
            if (ex === 1) N = 4;
            else N = 1;
            document.getElementById('input-n').value = N;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('input-n').value.trim());
            if (val >= 0 && val <= 12) {
                N = val;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            let solutions = 0;
            let board = new Array(N).fill(-1); // column for each row

            steps.push({
                type: 'init',
                row: 0,
                col: -1,
                board: [...board],
                panel: `Start N-Queens II for N = <b>${N}</b><br>Count distinct solutions`,
                statusText: `N-Queens II - Backtracking`,
                log: `Start backtrack row=0`,
                logColor: 'var(--text-dim)'
            });

            function backtrack(row) {
                if (row === N) {
                    solutions++;
                    steps.push({
                        type: 'solution',
                        row: N,
                        col: -1,
                        board: [...board],
                        panel: `Valid solution found!<br>Total solutions now: <b>${solutions}</b>`,
                        statusText: `Solution #${solutions}`,
                        log: `Row ${N} reached → +1 (total ${solutions})`,
                        logColor: 'var(--accent-green)',
                        bold: true
                    });
                    return;
                }

                for (let col = 0; col < N; col++) {
                    let safe = true;
                    for (let prev = 0; prev < row; prev++) {
                        if (board[prev] === col || 
                            Math.abs(board[prev] - col) === Math.abs(prev - row)) {
                            safe = false;
                            break;
                        }
                    }

                    if (safe) {
                        board[row] = col;

                        steps.push({
                            type: 'place',
                            row: row,
                            col: col,
                            board: [...board],
                            panel: `Place queen at (${row}, ${col}) — safe`,
                            statusText: `Row ${row}, Col ${col}`,
                            log: `Placed at row ${row}, col ${col}`,
                            logColor: 'var(--accent-green)'
                        });

                        backtrack(row + 1);

                        board[row] = -1;

                        steps.push({
                            type: 'backtrack',
                            row: row,
                            col: col,
                            board: [...board],
                            panel: `Backtrack from (${row}, ${col})`,
                            statusText: `Backtrack row ${row}`,
                            log: `Backtracked from row ${row}, col ${col}`,
                            logColor: 'var(--accent-red)'
                        });
                    }
                }
            }

            backtrack(0);

            steps.push({
                type: 'final',
                row: N,
                col: -1,
                board: [...board],
                panel: `All configurations explored.<br>Total distinct solutions: <span style="color:var(--accent-green)"><b>${solutions}</b></span>`,
                complete: true,
                finalStr: solutions.toString(),
                statusText: `Done - ${solutions} solutions`,
                log: `Final count = ${solutions}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render board
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${N}, 42px)`;

            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (step.board[r] === c) {
                        cell.textContent = '♕';
                        cell.classList.add('queen');
                    }
                    if (r === step.row) {
                        cell.classList.add('current');
                    }
                    boardEl.appendChild(cell);
                }
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-row').innerText = step.row !== undefined ? step.row : '—';
            document.getElementById('val-count').innerText = steps.filter(s => s.type === 'solution').length || '0';

            const resEl = document.getElementById('res-val');
            resEl.innerText = step.complete ? step.finalStr : '—';

            document.getElementById('status-text').innerText = step.statusText || '—';

            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logEl.appendChild(line);
                }
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = init;
    </script>
</body>
</html>
