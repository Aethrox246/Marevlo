<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Digits in Number (Recursion) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 220px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 820px;
        }
        
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 6px;
            width: 200px;
            height: 320px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 10px;
            background: rgba(22, 27, 34, 0.5);
            overflow-y: auto;
        }
        .stack-frame {
            width: 100%;
            padding: 10px 0;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 13.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-blue);
            font-weight: bold;
            z-index: 2;
        }

        .output-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 320px;
            justify-content: flex-end;
        }
        .tiles-wrapper { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 420px; 
            min-height: 90px; 
            padding: 15px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
        }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 22px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--accent-green); background: #0f2a1a;
            color: var(--accent-green);
            animation: popIn 0.35s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .action-panel {
            margin-top: 22px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 700px; text-align: center; font-family: monospace; min-height: 95px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.55;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 9px 16px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 5px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 26px; color: var(--accent-green); font-family: monospace; transition: all 0.3s; font-weight: bold; letter-spacing: 3px;}
        .pop { animation: popAnim 450ms ease; color: var(--accent-green) !important; font-size: 32px !important; text-shadow: 0 0 18px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.22)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 620px;}

        .controls { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; cursor: pointer; }

        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 2px; margin-right: 7px; display: inline-block; }

        .log-panel {
            margin-top: 14px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 135px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Number =</label>
        <input type="text" id="num-input" value="12345" style="width:240px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('12345')">Ex 1 (12345)</button>
        <button onclick="loadExample('-789')">Ex 2 (-789)</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Call Stack</div>
            <div class="stack-container" id="stack-container"></div>
        </div>
        <div class="output-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Current Count</div>
            <div class="tiles-wrapper" id="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Number</span>
            <span class="info-value" id="val-num" style="color: var(--accent-orange);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Digits =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:5px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Active Call</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Digit Count</div>
        <div class="legend-item"><span class="dot" style="background:var(--btn-bg); border: 1px solid var(--border-main)"></span> Waiting Call</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let targetNum = 12345;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample('12345'); }

        function loadExample(newNumStr) {
            targetNum = parseInt(newNumStr);
            document.getElementById('num-input').value = newNumStr;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('num-input').value.trim();
            if (val !== '') {
                loadExample(val);
            }
        }

        function generateSteps() {
            steps = [];
            let callStack = [];
            let currentCount = 0;
            let absN = Math.abs(targetNum);
            let numStr = targetNum.toString();

            // INIT
            steps.push({
                type: 'init', curr: absN, count: 0,
                stack: [...callStack], output: [0],
                panel: `Initialize recursive digit count for <code>${numStr}</code>.<br>Base case: if n == 0, return 0 (special handling for 0).`,
                statusText: `Counting digits in ${numStr}`,
                log: `count_digits(${targetNum})`,
                logColor: 'var(--text-dim)'
            });

            function solveRecursively(n) {
                callStack.push(`digits(${n})`);

                steps.push({
                    type: 'call', curr: n, count: currentCount,
                    stack: [...callStack], output: [currentCount],
                    panel: `Called <code>digits(${n})</code>.<br>Base case: if n == 0?`,
                    statusText: `digits(${n})`,
                    log: `Call digits(${n})`,
                    logColor: 'var(--text-main)'
                });

                if (n === 0) {
                    steps.push({
                        type: 'base', curr: 0, count: currentCount,
                        stack: [...callStack], output: [currentCount],
                        panel: `<span style="color:var(--accent-red)">Base case!</span> n == 0 → return 0`,
                        statusText: `Base case: return 0`,
                        log: `  Base → 0`,
                        logColor: 'var(--accent-red)'
                    });
                    callStack.pop();
                    return 0;
                }

                steps.push({
                    type: 'recurse', curr: n, count: currentCount,
                    stack: [...callStack], output: [currentCount],
                    panel: `Recurse: 1 + digits(${Math.floor(n / 10)})`,
                    statusText: `Calling digits(${Math.floor(n / 10)})`,
                    log: `  → digits(${Math.floor(n / 10)})`,
                    logColor: 'var(--accent-blue)'
                });

                const subCount = solveRecursively(Math.floor(n / 10));

                const result = subCount + 1;
                currentCount = result;

                steps.push({
                    type: 'add', curr: n, count: result,
                    stack: [...callStack], output: [result],
                    panel: `Returned ${subCount} from recursion.<br>1 + ${subCount} = <b>${result}</b>`,
                    statusText: `1 + ${subCount} = ${result}`,
                    log: `  1 + ${subCount} = ${result}`,
                    logColor: 'var(--accent-green)'
                });

                callStack.pop();

                if (callStack.length > 0) {
                    steps.push({
                        type: 'unwind', curr: n, count: result,
                        stack: [...callStack], output: [result],
                        panel: `Unwinding: return <span style="color:var(--accent-green)"><b>${result}</b></span>`,
                        statusText: `Return ${result}`,
                        log: `Unwind → ${result}`,
                        logColor: 'var(--text-dim)'
                    });
                }

                return result;
            }

            let finalCount = 0;
            if (absN === 0) {
                finalCount = 1;
            } else {
                finalCount = solveRecursively(absN);
            }

            // FINAL
            steps.push({
                type: 'final', curr: '—', count: finalCount,
                stack: [], output: [finalCount],
                panel: `Recursion complete.<br>Number of digits in <span style="color:var(--accent-orange)">${numStr}</span> = <span style="color:var(--accent-green)"><b>${finalCount}</b></span>`,
                complete: true,
                finalStr: finalCount.toString(),
                statusText: `Done. Digits = ${finalCount}`,
                log: `Final: ${finalCount}`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';

            step.stack.forEach((frameStr, i) => {
                const frame = document.createElement('div');
                const isTop = (i === step.stack.length - 1);
                frame.className = `stack-frame ${isTop ? 'active' : ''}`;
                frame.innerHTML = frameStr;
                stackContainer.appendChild(frame);
            });

            const outContainer = document.getElementById('output-container');
            outContainer.innerHTML = '';
            if (step.output && step.output.length > 0) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = step.output[0];
                outContainer.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-num').innerText = step.curr;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
