<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Common Subsequence - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #c678dd;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 140px;
            font-size: 14px;
            font-family: monospace;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 860px;
        }
        
        .string-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .string-tiles {
            display: flex;
            gap: 4px;
        }
        .tile {
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: bold; font-family: monospace;
            border: 2px solid var(--border-main); background: var(--bg-surface);
            transition: all 0.3s ease;
        }
        .tile.match { border-color: var(--accent-green); background: #0f2a1a; color: var(--accent-green); animation: popIn 0.4s ease; }

        .table-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .dp-table {
            display: grid;
            gap: 2px;
            background: #21262d;
            padding: 8px;
            border-radius: 8px;
        }
        .cell {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; font-family: monospace;
            border: 1px solid var(--border-main); background: var(--bg-surface);
            transition: all 0.3s ease;
        }
        .cell.current { border-color: var(--accent-orange); box-shadow: 0 0 0 2px var(--accent-orange); }
        .cell.match { background: var(--accent-green); color: #000; }

        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 720px; text-align: center; font-family: monospace; min-height: 108px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 16px; font-size: 28px; color: var(--accent-green); font-family: monospace; font-weight: bold; }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 660px;}

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 740px; max-width: 94%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }

        @keyframes popIn { 0%{transform:scale(0.6)} 100%{transform:scale(1)} }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s1 =</label>
        <input type="text" id="input-s1" value="ABC" style="width:120px;">
        <label class="ui-label">s2 =</label>
        <input type="text" id="input-s2" value="AC" style="width:120px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1: ABC, AC</button>
        <button onclick="loadExample(2)">Ex 2: BDCABA, ABCBDAB</button>
    </div>

    <div class="visual-container">
        <div class="string-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">s1</div>
            <div class="string-tiles" id="s1-tiles"></div>
        </div>
        <div class="string-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">s2</div>
            <div class="string-tiles" id="s2-tiles"></div>
        </div>
    </div>

    <div class="table-area">
        <div class="ui-label" style="font-weight: bold; color: var(--accent-purple);">DP Table (LCS lengths)</div>
        <div class="dp-table" id="dp-table"></div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to start the visualization</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Cell (i, j)</span>
            <span class="info-value" id="val-ij" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">LCS Length at Cell</span>
            <span class="info-value" id="val-length" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="ui-label" style="font-size:12px;">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1" style="width:130px;">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Match (diagonal +1)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange)"></span> Current Cell</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let s1 = "";
        let s2 = "";
        let dp = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            s1 = "ABC";
            s2 = "AC";
            document.getElementById('input-s1').value = s1;
            document.getElementById('input-s2').value = s2;
            generateSteps();
            reset();
        }

        function loadExample(ex) {
            if (ex === 1) {
                s1 = "ABC";
                s2 = "AC";
            } else {
                s1 = "BDCABA";
                s2 = "ABCBDAB";
            }
            document.getElementById('input-s1').value = s1;
            document.getElementById('input-s2').value = s2;
            generateSteps();
            reset();
        }

        function loadCustom() {
            s1 = document.getElementById('input-s1').value.trim();
            s2 = document.getElementById('input-s2').value.trim();
            if (s1.length > 0 && s2.length > 0) {
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            const n = s1.length;
            const m = s2.length;
            dp = Array.from({length: n+1}, () => Array(m+1).fill(0));

            // INIT
            steps.push({
                type: 'init',
                i: 0,
                j: 0,
                length: 0,
                panel: `Starting LCS for <span style="color:var(--accent-blue)">s1 = "${s1}"</span> and <span style="color:var(--accent-blue)">s2 = "${s2}"</span>`,
                statusText: `Longest Common Subsequence`,
                log: `Initialize dp table (size ${(n+1)}x${(m+1)})`,
                logColor: 'var(--text-dim)'
            });

            // Fill the DP table row by row
            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= m; j++) {
                    const match = (s1[i-1] === s2[j-1]);
                    const newVal = match ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);

                    steps.push({
                        type: match ? 'match' : 'mismatch',
                        i: i,
                        j: j,
                        length: newVal,
                        panel: match 
                            ? `Match at (${i},${j}): '${s1[i-1]}' == '${s2[j-1]}'<br>dp[${i}][${j}] = dp[${i-1}][${j-1}] + 1 = <b>${newVal}</b>` 
                            : `Mismatch at (${i},${j}): '${s1[i-1]}' != '${s2[j-1]}'<br>dp[${i}][${j}] = max(dp[${i-1}][${j}], dp[${i}][${j-1}]) = <b>${newVal}</b>`,
                        statusText: `Filling cell (${i}, ${j})`,
                        log: `dp[${i}][${j}] = ${newVal} ${match ? '(match)' : '(mismatch)'}`,
                        logColor: match ? 'var(--accent-green)' : 'var(--accent-red)'
                    });

                    dp[i][j] = newVal;   // Update for next steps
                }
            }

            const finalLength = dp[n][m];

            steps.push({
                type: 'final',
                i: n,
                j: m,
                length: finalLength,
                panel: `✅ Final LCS Length: <span style="color:var(--accent-green); font-size:22px"><b>${finalLength}</b></span><br>LCS example: ${findOneLCS()}`,
                complete: true,
                finalStr: finalLength.toString(),
                statusText: `Completed - LCS Length = ${finalLength}`,
                log: `Final result: ${finalLength}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function findOneLCS() {
            // Simple backtrack to show one possible LCS (for display only)
            let i = s1.length, j = s2.length;
            let lcs = '';
            while (i > 0 && j > 0) {
                if (s1[i-1] === s2[j-1]) {
                    lcs = s1[i-1] + lcs;
                    i--; j--;
                } else if (dp[i-1][j] > dp[i][j-1]) {
                    i--;
                } else {
                    j--;
                }
            }
            return lcs || '(none)';
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render s1 tiles
            const s1Tiles = document.getElementById('s1-tiles');
            s1Tiles.innerHTML = '';
            for (let k = 0; k < s1.length; k++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = s1[k];
                if (step.i > 0 && k === step.i - 1) tile.classList.add('match');
                s1Tiles.appendChild(tile);
            }

            // Render s2 tiles
            const s2Tiles = document.getElementById('s2-tiles');
            s2Tiles.innerHTML = '';
            for (let k = 0; k < s2.length; k++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = s2[k];
                if (step.j > 0 && k === step.j - 1) tile.classList.add('match');
                s2Tiles.appendChild(tile);
            }

            // Render DP Table
            const tableEl = document.getElementById('dp-table');
            tableEl.innerHTML = '';
            tableEl.style.gridTemplateColumns = `repeat(${s2.length + 1}, 36px)`;

            // Header row
            let header = document.createElement('div');
            header.className = 'cell';
            header.style.background = '#21262d';
            header.textContent = ' ';
            tableEl.appendChild(header);

            for (let j = 0; j < s2.length; j++) {
                header = document.createElement('div');
                header.className = 'cell';
                header.style.background = '#21262d';
                header.textContent = s2[j];
                tableEl.appendChild(header);
            }

            // Data rows
            for (let i = 0; i <= s1.length; i++) {
                // Row header
                let rowHeader = document.createElement('div');
                rowHeader.className = 'cell';
                rowHeader.style.background = '#21262d';
                rowHeader.textContent = (i === 0) ? ' ' : s1[i-1];
                tableEl.appendChild(rowHeader);

                for (let j = 0; j <= s2.length; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = dp[i][j];

                    if (i === step.i && j === step.j) {
                        cell.classList.add('current');
                    }
                    if (step.type === 'match' && i === step.i && j === step.j) {
                        cell.classList.add('match');
                    }
                    tableEl.appendChild(cell);
                }
            }

            // Update panels
            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-ij').innerText = `(${step.i}, ${step.j})`;
            document.getElementById('val-length').innerText = step.length || '—';

            const resEl = document.getElementById('res-val');
            resEl.innerText = step.complete ? step.finalStr : '—';

            document.getElementById('status-text').innerText = step.statusText || '—';

            // Log
            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logEl.appendChild(line);
                }
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(() => next(), delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') next();
            if (e.key === 'ArrowLeft') back();
            if (e.key === ' ') { e.preventDefault(); togglePlay(); }
        });

        window.onload = init;
    </script>
</body>
</html>
