<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Linked List - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 240px;
            font-size: 14px;
            font-family: monospace;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 860px;
        }
        
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 210px;
            height: 340px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 12px;
            background: rgba(22, 27, 34, 0.6);
            overflow-y: auto;
        }
        .stack-frame {
            width: 100%;
            padding: 9px 0;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 13.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-blue);
            font-weight: bold;
        }

        .output-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 340px;
            justify-content: flex-end;
        }
        .tiles-wrapper { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 440px; 
            min-height: 110px; 
            padding: 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
        }
        .tile {
            min-width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 19px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--accent-green); background: #0f2a1a;
            color: var(--accent-green);
            animation: popIn 0.4s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.2); opacity: 0; }
            60% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 720px; text-align: center; font-family: monospace; min-height: 108px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 16px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--accent-green); font-family: monospace; transition: all 0.3s; font-weight: bold; letter-spacing: 1px;}
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 26px !important; text-shadow: 0 0 20px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 660px;}

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 740px; max-width: 94%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">List =</label>
        <input type="text" id="input-list" value="1 -> 2 -> 3 -> null" style="width:240px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('1 -> 2 -> 3 -> null')">Ex 1 (1→2→3)</button>
        <button onclick="loadExample('5 -> null')">Ex 2 (5)</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Call Stack</div>
            <div class="stack-container" id="stack-container"></div>
        </div>
        <div class="output-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Reversed List</div>
            <div class="tiles-wrapper" id="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Prev</span>
            <span class="info-value" id="val-prev" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Curr</span>
            <span class="info-value" id="val-curr" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 8px;">Reversed List</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="ui-label" style="font-size:12px;">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Active Frame</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Advance</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Reverse Link</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let targetList = "1 -> 2 -> 3 -> null";
        let nodes = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            loadExample("1 -> 2 -> 3 -> null");
        }

        function loadExample(example) {
            targetList = example;
            document.getElementById('input-list').value = targetList;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('input-list').value.trim();
            if (val) {
                loadExample(val);
            }
        }

        function generateSteps() {
            steps = [];
            let callStack = [];
            let result = null;

            // Parse input list into nodes for visualization
            nodes = [];
            if (targetList.trim() === "") {
                nodes = [];
            } else {
                const parts = targetList.split('->').map(p => p.trim());
                for (let part of parts) {
                    if (part !== "null") {
                        nodes.push(part);
                    }
                }
            }

            // INIT
            steps.push({
                type: 'init',
                prev: null,
                curr: nodes.length > 0 ? nodes[0] : null,
                choice: "Start",
                stack: [],
                output: [],
                panel: `Start iterative reversal for list <code>${targetList}</code>.<br>prev = null, curr = first node`,
                statusText: `Reverse linked list: ${targetList}`,
                log: `prev=null, curr=${nodes.length > 0 ? nodes[0] : 'null'}`,
                logColor: 'var(--text-dim)'
            });

            let prev = null;
            let curr = nodes.length > 0 ? 0 : -1; // index in nodes array

            while (curr !== -1 && curr < nodes.length) {
                let nextIndex = curr + 1 < nodes.length ? curr + 1 : -1;
                let nextVal = nextIndex !== -1 ? nodes[nextIndex] : null;

                steps.push({
                    type: 'step',
                    prev: prev !== null ? nodes[prev] : null,
                    curr: nodes[curr],
                    next: nextVal,
                    choice: `Reverse link`,
                    stack: [...callStack],
                    output: [...nodes.slice(0, curr + 1).reverse()], // partial reversed
                    panel: `Save next = ${nextVal || 'null'}<br>Set ${nodes[curr]}.next = ${prev !== null ? nodes[prev] : 'null'}<br>Advance prev = ${nodes[curr]}, curr = ${nextVal || 'null'}`,
                    statusText: `Reverse ${nodes[curr]} -> ${prev !== null ? nodes[prev] : 'null'}`,
                    log: `next = ${nextVal || 'null'}, ${nodes[curr]}.next = ${prev !== null ? nodes[prev] : 'null'}, prev = ${nodes[curr]}, curr = ${nextVal || 'null'}`,
                    logColor: 'var(--accent-green)'
                });

                // Simulate reversal step
                prev = curr;
                curr = nextIndex;
            }

            // FINAL
            let reversed = nodes.length > 0 ? nodes.slice().reverse() : [];

            steps.push({
                type: 'final',
                prev: nodes.length > 0 ? nodes[nodes.length - 1] : null,
                curr: null,
                choice: "Complete",
                stack: [],
                output: reversed,
                panel: `Reversal complete.<br>New head: <span style="color:var(--accent-green)"><b>${reversed.length > 0 ? reversed[0] : 'null'}</b></span><br>Reversed list: <b>${reversed.join(' -> ') || 'null'}</b> -> null`,
                complete: true,
                finalStr: reversed.length > 0 ? reversed.join(' -> ') + ' -> null' : 'null',
                statusText: `Done. Reversed list: ${reversed.length > 0 ? reversed.join(' -> ') : 'null'}`,
                log: `Final reversed: ${reversed.length > 0 ? reversed.join(' -> ') : 'null'} -> null`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';

            step.stack.forEach((frameStr, i) => {
                const frame = document.createElement('div');
                frame.className = `stack-frame ${i === step.stack.length - 1 ? 'active' : ''}`;
                frame.innerHTML = frameStr;
                stackContainer.appendChild(frame);
            });

            const outContainer = document.getElementById('output-container');
            outContainer.innerHTML = '';
            if (step.output && step.output.length > 0) {
                step.output.forEach(val => {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.innerText = val;
                    outContainer.appendChild(tile);
                });
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-prev').innerText = step.prev || 'null';
            document.getElementById('val-curr').innerText = step.curr || 'null';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
