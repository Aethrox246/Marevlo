<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Cost Climbing Stairs - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #c678dd;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 220px;
            font-size: 14px;
            font-family: monospace;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 860px;
        }
        
        .stairs-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stairs-tiles {
            display: flex;
            flex-direction: column-reverse;
            gap: 4px;
        }
        .stair-step {
            height: 28px;
            width: 220px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-family: monospace;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }
        .stair-step.active { border-color: var(--accent-orange); background: #2d2d2d; color: var(--accent-orange); }
        .stair-step.changed { border-color: var(--accent-green); background: #0f2a1a; color: var(--accent-green); }

        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 720px; text-align: center; font-family: monospace; min-height: 108px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 16px; font-size: 28px; color: var(--accent-green); font-family: monospace; font-weight: bold; }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 660px;}

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 740px; max-width: 94%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }

        @keyframes popIn { 0%{transform:scale(0.6)} 100%{transform:scale(1)} }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">cost =</label>
        <input type="text" id="input-cost" value="[10,15,20]" style="width:220px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1: [10,15,20]</button>
        <button onclick="loadExample(2)">Ex 2: long array</button>
    </div>

    <div class="visual-container">
        <div class="stairs-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Stairs (cost)</div>
            <div class="stairs-tiles" id="stairs-tiles"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Step</span>
            <span class="info-value" id="val-step" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Min Cost to Here</span>
            <span class="info-value" id="val-cost" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="ui-label" style="font-size:12px;">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Optimal Cost</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange)"></span> Current Computation</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let cost = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1200, 600, 300];

        function init() {
            cost = [10, 15, 20];
            document.getElementById('input-cost').value = JSON.stringify(cost);
            generateSteps();
            reset();
        }

        function loadExample(ex) {
            if (ex === 1) {
                cost = [10, 15, 20];
            } else {
                cost = [1, 100, 1, 1, 1, 100, 1, 1, 100, 1];
            }
            document.getElementById('input-cost').value = JSON.stringify(cost);
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                cost = JSON.parse(document.getElementById('input-cost').value.trim());
                if (Array.isArray(cost) && cost.length > 0) {
                    generateSteps();
                    reset();
                }
            } catch(e) {}
        }

        function generateSteps() {
            steps = [];
            const n = cost.length;
            let dp = new Array(n).fill(0);

            // INIT
            steps.push({
                type: 'init',
                step: -1,
                minCost: 0,
                board: JSON.parse(JSON.stringify(cost)),
                panel: `Start Min Cost Climbing Stairs for cost = <span style="color:var(--accent-green)"><b>${JSON.stringify(cost)}</b></span>`,
                statusText: `Min Cost Climbing Stairs`,
                log: `Initialize dp array`,
                logColor: 'var(--text-dim)'
            });

            if (n === 0) {
                steps.push({
                    type: 'final',
                    step: 0,
                    minCost: 0,
                    board: [],
                    panel: `Empty stairs.<br>Minimum cost: <b>0</b>`,
                    complete: true,
                    finalStr: "0",
                    statusText: `Done - 0`,
                    log: `Final cost = 0`,
                    logColor: 'var(--accent-green)',
                    bold: true
                });
                return;
            }

            dp[0] = cost[0];
            if (n > 1) dp[1] = cost[1];

            steps.push({
                type: 'base',
                step: 0,
                minCost: dp[0],
                board: JSON.parse(JSON.stringify(cost)),
                panel: `Base case: dp[0] = cost[0] = <b>${dp[0]}</b>`,
                statusText: `Base dp[0]`,
                log: `dp[0] = ${dp[0]}`,
                logColor: 'var(--accent-blue)'
            });

            if (n > 1) {
                steps.push({
                    type: 'base',
                    step: 1,
                    minCost: dp[1],
                    board: JSON.parse(JSON.stringify(cost)),
                    panel: `Base case: dp[1] = cost[1] = <b>${dp[1]}</b>`,
                    statusText: `Base dp[1]`,
                    log: `dp[1] = ${dp[1]}`,
                    logColor: 'var(--accent-blue)'
                });
            }

            for (let i = 2; i < n; i++) {
                const prevMin = Math.min(dp[i-1], dp[i-2]);
                dp[i] = cost[i] + prevMin;

                steps.push({
                    type: 'update',
                    step: i,
                    minCost: dp[i],
                    board: JSON.parse(JSON.stringify(cost)),
                    panel: `Compute dp[${i}] = cost[${i}] + min(dp[${i-1}], dp[${i-2}]) = ${cost[i]} + min(${dp[i-1]}, ${dp[i-2]}) = <b>${dp[i]}</b>`,
                    statusText: `Update dp[${i}]`,
                    log: `dp[${i}] = ${dp[i]}`,
                    logColor: 'var(--accent-green)'
                });
            }

            let finalCost = n >= 1 ? Math.min(dp[n-1], (n >= 2 ? dp[n-2] : 0)) : 0;

            steps.push({
                type: 'final',
                step: n,
                minCost: finalCost,
                board: JSON.parse(JSON.stringify(cost)),
                panel: `Final minimum cost to reach top: <span style="color:var(--accent-green)"><b>${finalCost}</b></span>`,
                complete: true,
                finalStr: finalCost.toString(),
                statusText: `Done - ${finalCost}`,
                log: `Final cost = ${finalCost}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const stairsEl = document.getElementById('stairs-tiles');
            stairsEl.innerHTML = '';
            for (let i = 0; i < cost.length; i++) {
                const stepDiv = document.createElement('div');
                stepDiv.className = 'stair-step';
                stepDiv.innerText = `Step ${i} (${cost[i]})`;
                if (step.step === i) {
                    stepDiv.classList.add('active');
                }
                if (step.type === 'update' && i < step.step) {
                    stepDiv.classList.add('changed');
                }
                stairsEl.appendChild(stepDiv);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-step').innerText = step.step !== undefined ? step.step : '—';
            document.getElementById('val-cost').innerText = step.minCost !== undefined ? step.minCost : '—';

            const resEl = document.getElementById('res-val');
            resEl.innerText = step.complete ? step.finalStr : '—';

            document.getElementById('status-text').innerText = step.statusText || '—';

            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logEl.appendChild(line);
                }
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
