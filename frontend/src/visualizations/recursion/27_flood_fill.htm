<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Fill - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #c678dd;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 14px;
            font-family: monospace;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 860px;
        }
        
        .grid-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .board {
            display: grid;
            gap: 4px;
            background: #21262d;
            padding: 12px;
            border-radius: 8px;
        }
        .cell {
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: bold; font-family: monospace;
            border: 2px solid var(--border-main);
            transition: all 0.3s ease;
        }
        .cell.original { background: #2d2d2d; color: var(--text-main); }
        .cell.changed { background: var(--accent-green); color: #000; animation: popIn 0.4s ease; }
        .cell.current { border-color: var(--accent-orange); box-shadow: 0 0 0 3px var(--accent-orange); }

        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 720px; text-align: center; font-family: monospace; min-height: 108px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 16px; font-size: 22px; color: var(--accent-green); font-family: monospace; font-weight: bold; }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 660px;}

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 740px; max-width: 94%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }

        @keyframes popIn { 0%{transform:scale(0.6)} 100%{transform:scale(1)} }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">sr,sc =</label>
        <input type="text" id="input-start" value="1,1" style="width:80px;">
        <label class="ui-label">newColor =</label>
        <input type="text" id="input-new" value="2" style="width:60px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 (1,1 → 2)</button>
        <button onclick="loadExample(2)">Ex 2 (0,0 → 0)</button>
    </div>

    <div class="visual-container">
        <div class="grid-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Grid</div>
            <div class="board" id="board"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Position</span>
            <span class="info-value" id="val-pos" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Original Color</span>
            <span class="info-value" id="val-orig" style="color: var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="ui-label" style="font-size:12px;">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Changed</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange)"></span> Current</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Original Region</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let grid = [];
        let sr = 1, sc = 1, newColor = 2;
        let m = 0, n = 0;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1100, 550, 280];

        function init() {
            grid = [[1,1,1],[1,1,0],[1,0,1]];
            sr = 1; sc = 1; newColor = 2;
            m = grid.length;
            n = grid[0].length;
            document.getElementById('input-start').value = `${sr},${sc}`;
            document.getElementById('input-new').value = newColor;
            generateSteps();
            reset();
        }

        function loadExample(ex) {
            if (ex === 1) {
                grid = [[1,1,1],[1,1,0],[1,0,1]];
                sr = 1; sc = 1; newColor = 2;
            } else {
                grid = [[0,0,0],[0,0,0]];
                sr = 0; sc = 0; newColor = 0;
            }
            m = grid.length;
            n = grid[0].length;
            document.getElementById('input-start').value = `${sr},${sc}`;
            document.getElementById('input-new').value = newColor;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const startStr = document.getElementById('input-start').value.trim();
            const parts = startStr.split(',').map(p => parseInt(p.trim()));
            if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                sr = parts[0];
                sc = parts[1];
            }
            newColor = parseInt(document.getElementById('input-new').value.trim()) || 2;
            grid = [[1,1,1],[1,1,0],[1,0,1]];
            m = grid.length;
            n = grid[0].length;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let originalColor = grid[sr][sc];
            let currentGrid = JSON.parse(JSON.stringify(grid));

            // INIT
            steps.push({
                type: 'init',
                pos: [sr, sc],
                board: JSON.parse(JSON.stringify(currentGrid)),
                panel: `Start Flood Fill at (<span style="color:var(--accent-orange)">${sr}</span>, <span style="color:var(--accent-orange)">${sc}</span>)<br>Original color: <b>${originalColor}</b>, New color: <b>${newColor}</b>`,
                statusText: `Flood Fill - (${sr},${sc}) → ${newColor}`,
                log: `Start at (${sr},${sc}), original=${originalColor}`,
                logColor: 'var(--text-dim)'
            });

            if (originalColor === newColor) {
                steps.push({
                    type: 'final',
                    pos: [sr, sc],
                    board: JSON.parse(JSON.stringify(currentGrid)),
                    panel: `Original color equals newColor.<br>No change needed.`,
                    complete: true,
                    finalStr: JSON.stringify(currentGrid),
                    statusText: `No change (same color)`,
                    log: `Same color → no fill`,
                    logColor: 'var(--accent-blue)',
                    bold: true
                });
                return;
            }

            const directions = [[-1,0],[1,0],[0,-1],[0,1]];

            function dfs(r, c) {
                if (r < 0 || r >= m || c < 0 || c >= n || currentGrid[r][c] !== originalColor) {
                    steps.push({
                        type: 'backtrack',
                        pos: [r, c],
                        board: JSON.parse(JSON.stringify(currentGrid)),
                        panel: `Invalid cell (${r},${c})`,
                        statusText: `Backtrack`,
                        log: `Backtrack (${r},${c})`,
                        logColor: 'var(--accent-red)'
                    });
                    return;
                }

                currentGrid[r][c] = newColor;

                steps.push({
                    type: 'change',
                    pos: [r, c],
                    board: JSON.parse(JSON.stringify(currentGrid)),
                    panel: `Changed (<span style="color:var(--accent-green)">${r}</span>, <span style="color:var(--accent-green)">${c}</span>) to <b>${newColor}</b>`,
                    statusText: `Fill (${r},${c})`,
                    log: `Fill (${r},${c}) → ${newColor}`,
                    logColor: 'var(--accent-green)'
                });

                for (let [dr, dc] of directions) {
                    dfs(r + dr, c + dc);
                }
            }

            dfs(sr, sc);

            steps.push({
                type: 'final',
                pos: [sr, sc],
                board: JSON.parse(JSON.stringify(currentGrid)),
                panel: `Flood Fill complete.<br>Changed region to color <b>${newColor}</b>`,
                complete: true,
                finalStr: JSON.stringify(currentGrid),
                statusText: `Done`,
                log: `Final grid`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${n}, 42px)`;

            let displayGrid = step.board;

            for (let r = 0; r < m; r++) {
                for (let c = 0; c < n; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = displayGrid[r][c];

                    if (step.pos && step.pos[0] === r && step.pos[1] === c) {
                        if (step.type === 'change') {
                            cell.classList.add('changed');
                        } else {
                            cell.classList.add('current');
                        }
                    } else if (displayGrid[r][c] !== grid[r][c]) {
                        cell.classList.add('changed');
                    } else {
                        cell.classList.add('original');
                    }
                    boardEl.appendChild(cell);
                }
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-pos').innerText = step.pos ? `(${step.pos[0]},${step.pos[1]})` : '—';
            document.getElementById('val-orig').innerText = step.board ? grid[sr][sc] : '—';

            const resEl = document.getElementById('res-val');
            resEl.innerText = step.complete ? step.finalStr : '—';

            document.getElementById('status-text').innerText = step.statusText || '—';

            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logEl.appendChild(line);
                }
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
