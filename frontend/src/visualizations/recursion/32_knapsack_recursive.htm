<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0/1 Knapsack Recursive - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #c678dd;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 160px;
            font-size: 14px;
            font-family: monospace;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-start; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 860px;
        }
        
        .items-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .items-tiles {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            max-width: 380px;
        }
        .item {
            width: 68px; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 13px; font-family: monospace; border: 2px solid var(--border-main); background: var(--bg-surface);
            transition: all 0.3s ease; text-align: center; border-radius: 6px;
        }
        .item.include { border-color: var(--accent-green); background: #0f2a1a; }
        .item.exclude { border-color: var(--accent-red); background: #2a1f1f; }
        .item.current { border-color: var(--accent-orange); box-shadow: 0 0 0 3px var(--accent-orange); }

        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 720px; text-align: center; font-family: monospace; min-height: 108px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 16px; font-size: 28px; color: var(--accent-green); font-family: monospace; font-weight: bold; }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 660px;}

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 740px; max-width: 94%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }

        @keyframes popIn { 0%{transform:scale(0.6)} 100%{transform:scale(1)} }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Values</label>
        <input type="text" id="input-values" value="[60,100,120]" style="width:160px;">
        <label class="ui-label">Weights</label>
        <input type="text" id="input-weights" value="[10,20,30]" style="width:160px;">
        <label class="ui-label">Capacity</label>
        <input type="text" id="input-capacity" value="50" style="width:80px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1: Classic</button>
        <button onclick="loadExample(2)">Ex 2: Small</button>
    </div>

    <div class="visual-container">
        <div class="items-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Items (Value / Weight)</div>
            <div class="items-tiles" id="items-tiles"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to visualize recursive decisions</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Item (n)</span>
            <span class="info-value" id="val-n" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Remaining Capacity</span>
            <span class="info-value" id="val-cap" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Max Value</span>
            <span class="info-value" id="val-val" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="ui-label" style="font-size:12px;">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1" style="width:130px;">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Include Item</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Exclude Item</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange)"></span> Current Decision</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let values = [];
        let weights = [];
        let capacity = 0;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1500, 750, 380];

        function init() {
            values = [60, 100, 120];
            weights = [10, 20, 30];
            capacity = 50;
            document.getElementById('input-values').value = JSON.stringify(values);
            document.getElementById('input-weights').value = JSON.stringify(weights);
            document.getElementById('input-capacity').value = capacity;
            generateSteps();
            reset();
        }

        function loadExample(ex) {
            if (ex === 1) {
                values = [60, 100, 120];
                weights = [10, 20, 30];
                capacity = 50;
            } else {
                values = [1, 2, 3];
                weights = [4, 5, 1];
                capacity = 4;
            }
            document.getElementById('input-values').value = JSON.stringify(values);
            document.getElementById('input-weights').value = JSON.stringify(weights);
            document.getElementById('input-capacity').value = capacity;
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                values = JSON.parse(document.getElementById('input-values').value.trim());
                weights = JSON.parse(document.getElementById('input-weights').value.trim());
                capacity = parseInt(document.getElementById('input-capacity').value.trim());
                if (Array.isArray(values) && Array.isArray(weights) && values.length === weights.length && capacity >= 0) {
                    generateSteps();
                    reset();
                }
            } catch(e) {}
        }

        function generateSteps() {
            steps = [];
            const n = values.length;

            // INIT
            steps.push({
                type: 'init',
                item: n,
                cap: capacity,
                val: 0,
                panel: `Start 0/1 Knapsack<br>Items: ${n}, Capacity: <b>${capacity}</b>`,
                statusText: `0/1 Knapsack Recursive`,
                log: `knapsack(n=${n}, W=${capacity})`,
                logColor: 'var(--text-dim)'
            });

            function recurse(idx, remCap) {
                if (idx === 0 || remCap <= 0) {
                    steps.push({
                        type: 'base',
                        item: idx,
                        cap: remCap,
                        val: 0,
                        panel: `Base case: ${idx === 0 ? 'No items left' : 'Capacity ≤ 0'} → return <b>0</b>`,
                        statusText: `Base case`,
                        log: `Base → 0`,
                        logColor: 'var(--accent-blue)'
                    });
                    return 0;
                }

                const wt = weights[idx-1];
                const val = values[idx-1];

                if (wt > remCap) {
                    // Exclude only
                    const excludeVal = recurse(idx-1, remCap);
                    steps.push({
                        type: 'exclude',
                        item: idx,
                        cap: remCap,
                        val: excludeVal,
                        panel: `Item ${idx} (weight ${wt} > ${remCap}) cannot fit → Exclude only<br>Max = <b>${excludeVal}</b>`,
                        statusText: `Exclude Item ${idx}`,
                        log: `Item ${idx} excluded → ${excludeVal}`,
                        logColor: 'var(--accent-red)'
                    });
                    return excludeVal;
                }

                // Both options
                const includeVal = val + recurse(idx-1, remCap - wt);
                const excludeVal = recurse(idx-1, remCap);

                const maxVal = Math.max(includeVal, excludeVal);

                steps.push({
                    type: maxVal === includeVal ? 'include' : 'exclude',
                    item: idx,
                    cap: remCap,
                    val: maxVal,
                    panel: `Item ${idx} (v=${val}, w=${wt})<br>Include: ${val} + ${includeVal - val} = ${includeVal}<br>Exclude: ${excludeVal}<br>Max = <b>${maxVal}</b>`,
                    statusText: `Decision for Item ${idx}`,
                    log: `Item ${idx}: max(${includeVal}, ${excludeVal}) = ${maxVal}`,
                    logColor: maxVal === includeVal ? 'var(--accent-green)' : 'var(--accent-red)'
                });

                return maxVal;
            }

            const final = recurse(n, capacity);

            steps.push({
                type: 'final',
                item: 0,
                cap: 0,
                val: final,
                panel: `Final Maximum Value: <span style="color:var(--accent-green)"><b>${final}</b></span>`,
                complete: true,
                finalStr: final.toString(),
                statusText: `Done - ${final}`,
                log: `Final result = ${final}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render items
            const itemsEl = document.getElementById('items-tiles');
            itemsEl.innerHTML = '';
            for (let k = 0; k < values.length; k++) {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `<b>${values[k]}</b><br><small>w${weights[k]}</small>`;
                if (step.item > 0 && k === step.item - 1) {
                    item.classList.add('current');
                    if (step.type === 'include') item.classList.add('include');
                    if (step.type === 'exclude') item.classList.add('exclude');
                }
                itemsEl.appendChild(item);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-n').innerText = step.item !== undefined ? step.item : '—';
            document.getElementById('val-cap').innerText = step.cap !== undefined ? step.cap : '—';
            document.getElementById('val-val').innerText = step.val !== undefined ? step.val : '—';

            const resEl = document.getElementById('res-val');
            resEl.innerText = step.complete ? step.finalStr : '—';

            document.getElementById('status-text').innerText = step.statusText || '—';

            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logEl.appendChild(line);
                }
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = init;
    </script>
</body>
</html>
