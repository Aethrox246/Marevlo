<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subsets II - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 220px;
            font-size: 14px;
            font-family: monospace;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 860px;
        }
        
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 210px;
            height: 340px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 12px;
            background: rgba(22, 27, 34, 0.6);
            overflow-y: auto;
        }
        .stack-frame {
            width: 100%;
            padding: 9px 0;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 13.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-blue);
            font-weight: bold;
        }

        .output-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 340px;
            justify-content: flex-end;
        }
        .tiles-wrapper { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 440px; 
            min-height: 110px; 
            padding: 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
        }
        .tile {
            min-width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 18px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--accent-green); background: #0f2a1a;
            color: var(--accent-green);
            animation: popIn 0.4s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.2); opacity: 0; }
            60% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 720px; text-align: center; font-family: monospace; min-height: 108px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 16px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--accent-green); font-family: monospace; transition: all 0.3s; font-weight: bold; letter-spacing: 1px;}
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 26px !important; text-shadow: 0 0 20px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 660px;}

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 740px; max-width: 94%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Array =</label>
        <input type="text" id="input-arr" value="[1,2,2]" style="width:220px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[1,2,2]')">Ex 1 ([1,2,2])</button>
        <button onclick="loadExample('[0]')">Ex 2 ([0])</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Backtracking Stack</div>
            <div class="stack-container" id="stack-container"></div>
        </div>
        <div class="output-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Current Subset</div>
            <div class="tiles-wrapper" id="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Index</span>
            <span class="info-value" id="val-index" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Decision</span>
            <span class="info-value" id="val-choice" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 8px;">All Unique Subsets</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="ui-label" style="font-size:12px;">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Active Frame</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Include Element</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Skip / Backtrack</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let targetArr = [1, 2, 2];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1650, 820, 380];

        function init() {
            loadExample("[1,2,2]");
        }

        function loadExample(example) {
            try {
                targetArr = JSON.parse(example);
            } catch(e) {
                targetArr = [1,2,2];
            }
            document.getElementById('input-arr').value = example;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('input-arr').value.trim();
            if (val) {
                loadExample(val);
            }
        }

        function generateSteps() {
            steps = [];
            let callStack = [];
            let result = [];
            let current = [];

            // Sort for duplicate skipping
            const sortedNums = [...targetArr].sort((a,b) => a - b);

            // INIT
            steps.push({
                type: 'init',
                current: [],
                index: 0,
                choice: "Start",
                stack: [],
                output: [],
                panel: `Start backtracking for sorted array <code>${JSON.stringify(sortedNums)}</code>.<br>Build subsets while skipping duplicates.`,
                statusText: `Generate unique subsets for ${JSON.stringify(targetArr)}`,
                log: `backtrack(index=0, current=[])`,
                logColor: 'var(--text-dim)'
            });

            function backtrack(start, curr) {
                callStack.push(`backtrack(start=${start}, curr=${JSON.stringify(curr)})`);

                // Add current subset to result at every call
                result.push([...curr]);

                steps.push({
                    type: 'record',
                    current: [...curr],
                    index: start,
                    choice: `Record`,
                    stack: [...callStack],
                    output: [...curr],
                    panel: `Record current subset: <span style="color:var(--accent-green)"><b>${JSON.stringify(curr)}</b></span>`,
                    statusText: `Record ${JSON.stringify(curr)}`,
                    log: `  Record ${JSON.stringify(curr)}`,
                    logColor: 'var(--accent-green)'
                });

                for (let i = start; i < sortedNums.length; i++) {
                    // Skip duplicates at the same level
                    if (i > start && sortedNums[i] === sortedNums[i-1]) {
                        continue;
                    }

                    // Include current element
                    curr.push(sortedNums[i]);

                    steps.push({
                        type: 'include',
                        current: [...curr],
                        index: i,
                        choice: `Include ${sortedNums[i]}`,
                        stack: [...callStack],
                        output: [...curr],
                        panel: `Include <span style="color:var(--accent-green)"><b>${sortedNums[i]}</b></span> → current = <b>${JSON.stringify(curr)}</b>`,
                        statusText: `Include ${sortedNums[i]}`,
                        log: `  Include ${sortedNums[i]} → ${JSON.stringify(curr)}`,
                        logColor: 'var(--accent-green)'
                    });

                    backtrack(i + 1, curr);

                    // Backtrack
                    curr.pop();

                    steps.push({
                        type: 'backtrack',
                        current: [...curr],
                        index: i,
                        choice: `Backtrack`,
                        stack: [...callStack],
                        output: [...curr],
                        panel: `Backtrack: remove <span style="color:var(--accent-red)"><b>${sortedNums[i]}</b></span>`,
                        statusText: `Backtrack remove ${sortedNums[i]}`,
                        log: `  Backtrack → ${JSON.stringify(curr)}`,
                        logColor: 'var(--accent-red)'
                    });
                }

                callStack.pop();
            }

            backtrack(0, []);

            // FINAL (sort result for consistent display)
            result.sort((a, b) => {
                const lenDiff = a.length - b.length;
                if (lenDiff !== 0) return lenDiff;
                return JSON.stringify(a).localeCompare(JSON.stringify(b));
            });

            steps.push({
                type: 'final',
                current: [],
                index: sortedNums.length,
                choice: "Complete",
                stack: [],
                output: result,
                panel: `Backtracking complete.<br>All unique subsets: <span style="color:var(--accent-green)"><b>${JSON.stringify(result)}</b></span>`,
                complete: true,
                finalStr: JSON.stringify(result),
                statusText: `Done. ${result.length} unique subsets`,
                log: `Final: ${result.length} unique subsets`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';

            step.stack.forEach((frameStr, i) => {
                const frame = document.createElement('div');
                frame.className = `stack-frame ${i === step.stack.length - 1 ? 'active' : ''}`;
                frame.innerHTML = frameStr;
                stackContainer.appendChild(frame);
            });

            const outContainer = document.getElementById('output-container');
            outContainer.innerHTML = '';
            if (step.output && step.output.length > 0) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = JSON.stringify(step.output);
                outContainer.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-index').innerText = step.index !== undefined ? step.index : '—';
            document.getElementById('val-choice').innerText = step.choice || '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
