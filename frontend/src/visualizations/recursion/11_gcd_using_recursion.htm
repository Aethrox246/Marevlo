<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCD using Recursion (Euclidean) - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 90px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 820px;
        }
        
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 6px;
            width: 200px;
            height: 320px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 10px;
            background: rgba(22, 27, 34, 0.5);
            overflow-y: auto;
        }
        .stack-frame {
            width: 100%;
            padding: 10px 0;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 13.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-blue);
            font-weight: bold;
            z-index: 2;
        }

        .output-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 320px;
            justify-content: flex-end;
        }
        .tiles-wrapper { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 420px; 
            min-height: 90px; 
            padding: 15px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
        }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 22px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--accent-green); background: #0f2a1a;
            color: var(--accent-green);
            animation: popIn 0.35s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .action-panel {
            margin-top: 22px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 700px; text-align: center; font-family: monospace; min-height: 95px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.55;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 9px 16px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 5px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 26px; color: var(--accent-green); font-family: monospace; transition: all 0.3s; font-weight: bold; letter-spacing: 3px;}
        .pop { animation: popAnim 450ms ease; color: var(--accent-green) !important; font-size: 32px !important; text-shadow: 0 0 18px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.22)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 620px;}

        .controls { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; cursor: pointer; }

        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 2px; margin-right: 7px; display: inline-block; }

        .log-panel {
            margin-top: 14px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 135px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">a =</label>
        <input type="number" id="a-input" value="12" min="0">
        <label class="ui-label">b =</label>
        <input type="number" id="b-input" value="18" min="0">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(12,18)">Ex 1 (12,18)</button>
        <button onclick="loadExample(17,13)">Ex 2 (17,13)</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Call Stack</div>
            <div class="stack-container" id="stack-container"></div>
        </div>
        <div class="output-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Current Remainder</div>
            <div class="tiles-wrapper" id="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current a</span>
            <span class="info-value" id="val-a" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current b</span>
            <span class="info-value" id="val-b" style="color: var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">GCD(a, b) =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:5px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Active Call</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Remainder</div>
        <div class="legend-item"><span class="dot" style="background:var(--btn-bg); border: 1px solid var(--border-main)"></span> Waiting Call</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let targetA = 12;
        let targetB = 18;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(12, 18); }

        function loadExample(newA, newB) {
            targetA = parseInt(newA);
            targetB = parseInt(newB);
            document.getElementById('a-input').value = targetA;
            document.getElementById('b-input').value = targetB;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const aVal = parseInt(document.getElementById('a-input').value);
            const bVal = parseInt(document.getElementById('b-input').value);
            if (!isNaN(aVal) && !isNaN(bVal) && aVal >= 0 && bVal >= 0) {
                loadExample(aVal, bVal);
            } else {
                alert("Please enter valid non-negative integers for a and b.");
            }
        }

        function generateSteps() {
            steps = [];
            let callStack = [];
            let currentA = Math.abs(targetA);
            let currentB = Math.abs(targetB);

            // INIT
            steps.push({
                type: 'init', a: currentA, b: currentB, rem: 0,
                stack: [...callStack], output: [currentA],
                panel: `Initialize recursive GCD computation.<br>gcd(${currentA}, ${currentB}) using Euclidean algorithm.`,
                statusText: `Computing gcd(${currentA}, ${currentB})`,
                log: `gcd(${currentA}, ${currentB})`,
                logColor: 'var(--text-dim)'
            });

            function solveRecursively(a, b) {
                callStack.push(`gcd(${a}, ${b})`);

                steps.push({
                    type: 'call', a: a, b: b, rem: 0,
                    stack: [...callStack], output: [a],
                    panel: `Called <code>gcd(${a}, ${b})</code>.<br>Base case: if b == 0?`,
                    statusText: `gcd(${a}, ${b})`,
                    log: `Call gcd(${a}, ${b})`,
                    logColor: 'var(--text-main)'
                });

                if (b === 0) {
                    steps.push({
                        type: 'base', a: a, b: 0, rem: 0,
                        stack: [...callStack], output: [a],
                        panel: `<span style="color:var(--accent-red)">Base case!</span> b == 0 → return a = <span style="color:var(--accent-green)"><b>${a}</b></span>`,
                        statusText: `Base case: return ${a}`,
                        log: `  Base → ${a}`,
                        logColor: 'var(--accent-red)'
                    });
                    callStack.pop();
                    return a;
                }

                const rem = a % b;

                steps.push({
                    type: 'modulo', a: a, b: b, rem: rem,
                    stack: [...callStack], output: [rem],
                    panel: `Compute remainder: <span style="color:var(--accent-orange)"><b>${a} % ${b} = ${rem}</b></span>`,
                    statusText: `Remainder = ${rem}`,
                    log: `  ${a} % ${b} = ${rem}`,
                    logColor: 'var(--accent-orange)'
                });

                steps.push({
                    type: 'recurse', a: a, b: b, rem: rem,
                    stack: [...callStack], output: [rem],
                    panel: `Recurse: <code>gcd(${b}, ${rem})</code>`,
                    statusText: `Calling gcd(${b}, ${rem})`,
                    log: `  → gcd(${b}, ${rem})`,
                    logColor: 'var(--accent-blue)'
                });

                const result = solveRecursively(b, rem);

                steps.push({
                    type: 'unwind', a: a, b: b, rem: rem,
                    stack: [...callStack], output: [result],
                    panel: `Unwinding: return <span style="color:var(--accent-green)"><b>${result}</b></span> from recursion`,
                    statusText: `Return ${result}`,
                    log: `Unwind → ${result}`,
                    logColor: 'var(--text-dim)'
                });

                callStack.pop();
                return result;
            }

            const finalGCD = solveRecursively(currentA, currentB);

            // FINAL
            steps.push({
                type: 'final', a: finalGCD, b: 0, rem: 0,
                stack: [], output: [finalGCD],
                panel: `Recursion complete.<br>GCD(${targetA}, ${targetB}) = <span style="color:var(--accent-green)"><b>${finalGCD}</b></span>`,
                complete: true,
                finalStr: finalGCD.toString(),
                statusText: `Done. GCD = ${finalGCD}`,
                log: `Final GCD: ${finalGCD}`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';

            step.stack.forEach((frameStr, i) => {
                const frame = document.createElement('div');
                const isTop = (i === step.stack.length - 1);
                frame.className = `stack-frame ${isTop ? 'active' : ''}`;
                frame.innerHTML = frameStr;
                stackContainer.appendChild(frame);
            });

            const outContainer = document.getElementById('output-container');
            outContainer.innerHTML = '';
            if (step.output && step.output.length > 0) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = step.output[0];
                outContainer.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-a').innerText = step.a;
            document.getElementById('val-b').innerText = step.b;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
