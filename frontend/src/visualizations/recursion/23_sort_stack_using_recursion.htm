<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Stack Using Recursion - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 240px;
            font-size: 14px;
            font-family: monospace;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 860px;
        }
        
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 210px;
            height: 340px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 12px;
            background: rgba(22, 27, 34, 0.6);
            overflow-y: auto;
        }
        .stack-frame {
            width: 100%;
            padding: 9px 0;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 13.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-blue);
            font-weight: bold;
        }

        .output-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 340px;
            justify-content: flex-end;
        }
        .tiles-wrapper { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 440px; 
            min-height: 110px; 
            padding: 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
        }
        .tile {
            min-width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 19px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--accent-green); background: #0f2a1a;
            color: var(--accent-green);
            animation: popIn 0.4s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.2); opacity: 0; }
            60% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 720px; text-align: center; font-family: monospace; min-height: 108px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 16px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--accent-green); font-family: monospace; transition: all 0.3s; font-weight: bold; letter-spacing: 1px;}
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 26px !important; text-shadow: 0 0 20px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 660px;}

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 740px; max-width: 94%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Stack (bottom → top) =</label>
        <input type="text" id="input-stack" value="[5, 1, 4, 2, 3]" style="width:240px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[5, 1, 4, 2, 3]')">Ex 1 ([5,1,4,2,3])</button>
        <button onclick="loadExample('[10, -5, 0, 7, 3]')">Ex 2 ([10,-5,0,7,3])</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Call Stack</div>
            <div class="stack-container" id="stack-container"></div>
        </div>
        <div class="output-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Current Stack (bottom → top)</div>
            <div class="tiles-wrapper" id="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Popped</span>
            <span class="info-value" id="val-popped" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Action</span>
            <span class="info-value" id="val-action" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 8px;">Final Sorted Stack</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="ui-label" style="font-size:12px;">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Active Frame</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Insert</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Shift</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let targetStack = [5, 1, 4, 2, 3]; // bottom to top
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1700, 850, 400];

        function init() {
            loadExample("[5, 1, 4, 2, 3]");
        }

        function loadExample(example) {
            try {
                targetStack = JSON.parse(example);
            } catch(e) {
                targetStack = [5, 1, 4, 2, 3];
            }
            document.getElementById('input-stack').value = JSON.stringify(targetStack);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('input-stack').value.trim();
            if (val) {
                loadExample(val);
            }
        }

        function generateSteps() {
            steps = [];
            let callStack = [];
            let tempStack = []; // for sorted elements during insertion

            // INIT
            steps.push({
                type: 'init',
                choice: "Start",
                stack: [...targetStack],
                output: [...targetStack],
                panel: `Start sorting stack <code>${JSON.stringify(targetStack)}</code> (bottom → top).<br>Using recursive sort + insert_sorted.`,
                statusText: `Sort stack: ${JSON.stringify(targetStack)}`,
                log: `Original stack (bottom→top): ${JSON.stringify(targetStack)}`,
                logColor: 'var(--text-dim)'
            });

            // Simulate recursive sort + insertion
            let original = [...targetStack];
            let sorted = [];

            // Recursive sort simulation - pop all, then insert one by one
            let poppedElements = [...original].reverse(); // simulate popping order (top first)

            for (let i = 0; i < poppedElements.length; i++) {
                let elem = poppedElements[i];

                steps.push({
                    type: 'pop',
                    choice: `Pop ${elem}`,
                    stack: [...sorted],
                    output: [...sorted],
                    panel: `Pop <span style="color:var(--accent-orange)">${elem}</span> from original stack.<br>Now insert it into sorted stack.`,
                    statusText: `Pop ${elem}`,
                    log: `Pop ${elem}`,
                    logColor: 'var(--accent-orange)'
                });

                // Insert into sorted stack
                let insertStack = [...sorted];
                let shifted = [];

                // Simulate recursive insert
                while (insertStack.length > 0 && insertStack[insertStack.length - 1] > elem) {
                    let larger = insertStack.pop();
                    shifted.push(larger);

                    steps.push({
                        type: 'shift',
                        choice: `Shift ${larger}`,
                        stack: [...insertStack],
                        output: [...insertStack],
                        panel: `Shift larger element <span style="color:var(--accent-red)">${larger}</span> to make space for ${elem}`,
                        statusText: `Shift ${larger}`,
                        log: `Shift ${larger}`,
                        logColor: 'var(--accent-red)'
                    });
                }

                // Push the element
                insertStack.push(elem);

                steps.push({
                    type: 'insert',
                    choice: `Insert ${elem}`,
                    stack: [...insertStack],
                    output: [...insertStack],
                    panel: `Insert <span style="color:var(--accent-green)">${elem}</span> at correct position.`,
                    statusText: `Insert ${elem}`,
                    log: `Insert ${elem}`,
                    logColor: 'var(--accent-green)'
                });

                // Push back shifted elements
                for (let j = shifted.length - 1; j >= 0; j--) {
                    insertStack.push(shifted[j]);

                    steps.push({
                        type: 'restore',
                        choice: `Restore ${shifted[j]}`,
                        stack: [...insertStack],
                        output: [...insertStack],
                        panel: `Restore shifted <span style="color:var(--accent-orange)">${shifted[j]}</span>`,
                        statusText: `Restore ${shifted[j]}`,
                        log: `Restore ${shifted[j]}`,
                        logColor: 'var(--accent-orange)'
                    });
                }

                sorted = insertStack;
            }

            // FINAL
            steps.push({
                type: 'final',
                choice: "Complete",
                stack: [],
                output: [...sorted],
                panel: `Sorting complete.<br>Final sorted stack (bottom → top): <span style="color:var(--accent-green)"><b>${JSON.stringify(sorted)}</b></span>`,
                complete: true,
                finalStr: JSON.stringify(sorted),
                statusText: `Done. Sorted stack: ${JSON.stringify(sorted)}`,
                log: `Final sorted: ${JSON.stringify(sorted)}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';

            step.stack.forEach((val, i) => {
                const frame = document.createElement('div');
                frame.className = `stack-frame ${i === step.stack.length - 1 ? 'active' : ''}`;
                frame.innerHTML = val;
                stackContainer.appendChild(frame);
            });

            const outContainer = document.getElementById('output-container');
            outContainer.innerHTML = '';
            if (step.output && step.output.length > 0) {
                step.output.forEach(val => {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.innerText = val;
                    outContainer.appendChild(tile);
                });
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-popped').innerText = step.choice.includes('Pop') ? step.choice.split(' ')[1] || '—' : '—';
            document.getElementById('val-action').innerText = step.choice || '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
