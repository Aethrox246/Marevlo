<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check if String is Palindrome (Recursion) - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Input Bar */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 220px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* Visualization Area */
        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 820px;
        }
        
        /* Stack */
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 6px;
            width: 200px;
            height: 320px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 10px;
            background: rgba(22, 27, 34, 0.5);
            overflow-y: auto;
        }
        .stack-frame {
            width: 100%;
            padding: 10px 0;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 13.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-blue);
            font-weight: bold;
            z-index: 2;
        }

        /* Output Area - Current Comparison */
        .output-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 320px;
            justify-content: flex-end;
        }
        .tiles-wrapper { 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 420px; 
            min-height: 90px; 
            padding: 15px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
        }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 22px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--accent-green); background: #0f2a1a;
            color: var(--accent-green);
            animation: popIn 0.35s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Action Panel */
        .action-panel {
            margin-top: 22px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 700px; text-align: center; font-family: monospace; min-height: 95px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.55;
        }

        /* Info Panel */
        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 9px 16px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 5px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; text-align: center; }

        /* Result */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 26px; color: var(--accent-green); font-family: monospace; transition: all 0.3s; font-weight: bold; letter-spacing: 3px;}
        .pop { animation: popAnim 450ms ease; color: var(--accent-green) !important; font-size: 32px !important; text-shadow: 0 0 18px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.22)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 620px;}

        /* Controls */
        .controls { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; cursor: pointer; }

        /* Legend */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 2px; margin-right: 7px; display: inline-block; }

        /* Log */
        .log-panel {
            margin-top: 14px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 135px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">String =</label>
        <input type="text" id="str-input" value="racecar" style="width:260px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('racecar')">Ex 1 ("racecar")</button>
        <button onclick="loadExample('hello')">Ex 2 ("hello")</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Call Stack</div>
            <div class="stack-container" id="stack-container"></div>
        </div>
        <div class="output-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Current Comparison</div>
            <div class="tiles-wrapper" id="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Left Index</span>
            <span class="info-value" id="val-left" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Right Index</span>
            <span class="info-value" id="val-right" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Match?</span>
            <span class="info-value" id="val-match" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Is Palindrome?</span>
        <span id="res-val" style="font-size:28px;">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:5px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Active Call</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Matched Pair</div>
        <div class="legend-item"><span class="dot" style="background:var(--btn-bg); border: 1px solid var(--border-main)"></span> Waiting Call</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let targetStr = "racecar";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample("racecar"); }

        function loadExample(newStr) {
            targetStr = newStr;
            document.getElementById('str-input').value = targetStr;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('str-input').value.trim();
            if (val !== "") {
                loadExample(val);
            } else {
                alert("Please enter a non-empty string.");
            }
        }

        function generateSteps() {
            steps = [];
            let callStack = [];
            let currentResult = null;

            // STEP 0: INIT
            steps.push({
                type: 'init', left: 0, right: targetStr.length - 1, match: '—',
                stack: [...callStack], output: [],
                panel: `Initialize recursive palindrome check for <code>"${targetStr}"</code>.<br>Base case: if left ≥ right, return true.`,
                statusText: `Checking if "${targetStr}" is palindrome`,
                log: `isPalindrome("${targetStr}", 0, ${targetStr.length-1})`,
                logColor: 'var(--text-dim)'
            });

            function solveRecursively(s, left, right) {
                callStack.push(`isPal(${left},${right})`);

                steps.push({
                    type: 'call', left: left, right: right, match: '—',
                    stack: [...callStack], output: currentResult !== null ? [currentResult] : [],
                    panel: `Called <code>isPal(${left}, ${right})</code>.<br>Base case check: ${left} ≥ ${right}?`,
                    statusText: `isPal(${left}, ${right})`,
                    log: `Call isPal(${left}, ${right})`,
                    logColor: 'var(--text-main)'
                });

                if (left >= right) {
                    steps.push({
                        type: 'base', left: left, right: right, match: true,
                        stack: [...callStack], output: [true],
                        panel: `<span style="color:var(--accent-red)">Base case!</span> left ≥ right → return <b>true</b>`,
                        statusText: `Base case: true`,
                        log: `  Base → true`,
                        logColor: 'var(--accent-red)'
                    });
                    callStack.pop();
                    return true;
                }

                const charLeft = s[left];
                const charRight = s[right];
                const charsMatch = charLeft === charRight;

                steps.push({
                    type: 'compare', left: left, right: right, match: charsMatch,
                    stack: [...callStack], output: [charsMatch],
                    panel: `Compare s[${left}] = '<span style="color:var(--accent-orange)">${charLeft}</span>' and s[${right}] = '<span style="color:var(--accent-orange)">${charRight}</span>'<br>Match? <b>${charsMatch}</b>`,
                    statusText: `Compare '${charLeft}' and '${charRight}' → ${charsMatch}`,
                    log: `  Compare '${charLeft}' == '${charRight}' → ${charsMatch}`,
                    logColor: charsMatch ? 'var(--accent-green)' : 'var(--accent-red)'
                });

                if (!charsMatch) {
                    steps.push({
                        type: 'mismatch', left: left, right: right, match: false,
                        stack: [...callStack], output: [false],
                        panel: `<span style="color:var(--accent-red)">Mismatch!</span> Characters don't match → return <b>false</b>`,
                        statusText: `Mismatch → false`,
                        log: `  Mismatch → false`,
                        logColor: 'var(--accent-red)'
                    });
                    callStack.pop();
                    return false;
                }

                steps.push({
                    type: 'recurse', left: left, right: right, match: true,
                    stack: [...callStack], output: [true],
                    panel: `Characters match. Recurse with left+1 and right-1: <code>isPal(${left+1}, ${right-1})</code>`,
                    statusText: `Recurse → isPal(${left+1}, ${right-1})`,
                    log: `  → isPal(${left+1}, ${right-1})`,
                    logColor: 'var(--accent-blue)'
                });

                const subResult = solveRecursively(s, left + 1, right - 1);
                currentResult = subResult;

                callStack.pop();
                if (callStack.length > 0) {
                    steps.push({
                        type: 'unwind', left: left, right: right, match: subResult,
                        stack: [...callStack], output: [subResult],
                        panel: `Unwinding: return <span style="color:var(--accent-green)"><b>${subResult}</b></span>`,
                        statusText: `Return ${subResult}`,
                        log: `Unwind → ${subResult}`,
                        logColor: 'var(--text-dim)'
                    });
                }

                return subResult;
            }

            const finalResult = solveRecursively(targetStr, 0, targetStr.length - 1);

            // FINAL STEP
            steps.push({
                type: 'final', left: '—', right: '—', match: finalResult,
                stack: [], output: [finalResult],
                panel: `Recursion complete.<br>"${targetStr}" is palindrome: <span style="color:var(--accent-green)"><b>${finalResult}</b></span>`,
                complete: true,
                finalStr: finalResult ? "true" : "false",
                statusText: `Done. Result = ${finalResult}`,
                log: `Final Result: ${finalResult}`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';

            step.stack.forEach((frameStr, i) => {
                const frame = document.createElement('div');
                const isTop = (i === step.stack.length - 1);
                frame.className = `stack-frame ${isTop ? 'active' : ''}`;
                frame.innerHTML = frameStr;
                stackContainer.appendChild(frame);
            });

            const outContainer = document.getElementById('output-container');
            outContainer.innerHTML = '';
            if (step.output && step.output.length > 0) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = step.output[0] === true ? "✓" : (step.output[0] === false ? "✗" : step.output[0]);
                outContainer.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-left').innerText = step.left !== undefined ? step.left : '—';
            document.getElementById('val-right').innerText = step.right !== undefined ? step.right : '—';
            document.getElementById('val-match').innerText = step.match !== undefined ? (step.match === true ? "Yes" : step.match === false ? "No" : step.match) : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
