<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serialize & Deserialize Binary Tree - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 320px;
            font-size: 13px;
        }
        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            gap: 70px; 
            width: 100%; 
            max-width: 1180px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 8px;
            width: 280px;
            height: 380px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 12px;
            background: rgba(22, 27, 34, 0.5);
            overflow-y: auto;
            border-radius: 8px;
        }
        .stack-frame {
            width: 100%;
            padding: 10px 12px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            font-family: monospace;
            font-size: 13.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 14px var(--accent-blue);
            font-weight: bold;
        }

        .tree-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 520px;
        }
        .tree-display {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 18px;
            font-family: monospace;
            font-size: 18px;
            min-height: 120px;
            white-space: pre;
            overflow: auto;
        }
        .serialized-string {
            width: 100%;
            background: #0f2a1a;
            border: 2px solid var(--accent-green);
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            font-size: 20px;
            color: var(--accent-green);
            min-height: 68px;
            text-align: center;
            word-break: break-all;
        }

        .action-panel {
            margin-top: 28px; 
            background: var(--bg-surface); 
            border: 1px solid var(--border-main);
            border-radius: 8px; 
            padding: 20px 28px; 
            width: 980px; 
            text-align: left; 
            font-family: monospace; 
            min-height: 135px;
            font-size: 15px;
            line-height: 1.65;
        }

        .info-panel { 
            margin-top: 20px; 
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }
        .info-cell {
            background: var(--bg-surface); 
            border: 1px solid var(--border-main); 
            border-radius: 6px;
            padding: 14px 22px; 
            min-width: 155px; 
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { 
            font-family: monospace; 
            font-size: 18px; 
            font-weight: 700; 
        }

        .result-display { 
            margin-top: 24px; 
            font-size: 26px; 
            font-family: monospace; 
            color: var(--accent-green);
            text-align: center;
        }

        .status-bar { 
            margin-top: 16px; 
            font-size: 13.8px; 
            color: var(--text-dim); 
            text-align: center; 
            width: 840px;
        }

        .controls { 
            margin-top: 34px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend { 
            margin-top: 24px; 
            display: flex; 
            gap: 26px; 
            flex-wrap: wrap; 
            justify-content: center; 
            font-size: 13px;
        }
        .legend-item { display: flex; align-items: center; color: var(--text-dim); }
        .dot { width: 13px; height: 13px; border-radius: 3px; margin-right: 8px; }

        .log-panel {
            margin-top: 26px; 
            background: var(--bg-page); 
            border: 1px solid var(--border-main);
            border-radius: 8px; 
            padding: 18px 24px; 
            width: 980px; 
            max-width: 95%; 
            height: 180px;
            overflow-y: auto; 
            font-family: 'Courier New', monospace; 
            font-size: 13.7px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Preorder with nulls =</label>
        <input type="text" id="tree-input" value="1,2,4,null,null,5,null,null,3,null,null" style="width:320px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2 (null)</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight:bold;color:var(--accent-blue);">Recursion Stack (dfs)</div>
            <div class="stack-container" id="stack-container"></div>
        </div>

        <div class="tree-area">
            <div class="ui-label" style="font-weight:bold;color:var(--accent-orange);">Current Tree</div>
            <div class="tree-display" id="tree-display"></div>
            
            <div class="ui-label" style="font-weight:bold;color:var(--accent-green);margin-top:12px;">Serialized String</div>
            <div class="serialized-string" id="serialized-string"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">
        Click <strong>Play</strong> or <strong>Next</strong> to step through preorder serialization &amp; deserialization with null markers.
    </div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Node</span>
            <span class="info-value" id="val-node" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Next Value</span>
            <span class="info-value" id="val-next" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Action</span>
            <span class="info-value" id="val-action" style="color:var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Serialized String</span>
        <span id="res-val" style="font-size:24px;font-weight:bold;display:block;margin-top:8px;">—</span>
    </div>

    <div class="status-bar" id="status-text">Ready</div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex;align-items:center;gap:8px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> DFS Call</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Append Value / null</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Reconstruct Node</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let preorderStr = "1,2,4,null,null,5,null,null,3,null,null";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            if (ex === 0) {
                preorderStr = "1,2,4,null,null,5,null,null,3,null,null";
            } else {
                preorderStr = "null";
            }
            document.getElementById('tree-input').value = preorderStr;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const input = document.getElementById('tree-input').value.trim();
            if (!input) {
                alert("Please enter a preorder string (e.g. 1,2,4,null,null,5,null,null,3,null,null)");
                return;
            }
            preorderStr = input;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];

            // 1. Initialize
            steps.push({
                type: 'init',
                serialized: '',
                panel: `Serialize & Deserialize Binary Tree<br><strong>Input:</strong> <span style="color:var(--accent-orange)">${preorderStr}</span><br><br>Preorder with <span style="color:var(--accent-purple)">null</span> markers preserves full tree structure.`,
                statusText: `Starting with preorder string "${preorderStr}"`,
                log: `serializeDeserialize("${preorderStr}")`,
                logColor: 'var(--text-dim)'
            });

            // 2. Serialization steps (simulated granular)
            const tokens = preorderStr.split(',');
            let serialized = '';

            steps.push({
                type: 'serialize',
                serialized: '',
                panel: `Serialization: Preorder DFS traversal<br>Visit root, left, right and record nulls.`,
                statusText: `Starting serialization...`,
                log: `serialize() started`,
                logColor: 'var(--accent-orange)'
            });

            tokens.forEach((token, i) => {
                steps.push({
                    type: 'append',
                    token: token,
                    serialized: tokens.slice(0, i+1).join(','),
                    panel: token === 'null' 
                        ? `Encountered <span style="color:var(--accent-purple)">null</span> → end of subtree`
                        : `Visited node <span style="color:var(--accent-orange)">${token}</span> → append to result`,
                    statusText: token === 'null' ? `null marker` : `node ${token}`,
                    log: token === 'null' ? `    null` : `    ${token}`,
                    logColor: token === 'null' ? 'var(--accent-purple)' : 'var(--accent-green)'
                });
            });

            serialized = preorderStr;

            steps.push({
                type: 'serialize_done',
                serialized: serialized,
                panel: `Serialization complete!<br><strong>Serialized string:</strong><br><span style="color:var(--accent-green)">${serialized}</span>`,
                statusText: `Serialization done`,
                log: `Serialized: ${serialized}`,
                logColor: 'var(--accent-green)'
            });

            // 3. Deserialization steps
            steps.push({
                type: 'deserialize_start',
                serialized: serialized,
                panel: `Deserialization: Split string into list and reconstruct recursively using iterator.`,
                statusText: `Starting deserialization...`,
                log: `deserialize("${serialized}")`,
                logColor: 'var(--accent-orange)'
            });

            let i = 0;
            tokens.forEach((token, idx) => {
                steps.push({
                    type: 'read',
                    token: token,
                    index: i++,
                    panel: token === 'null' 
                        ? `Read <span style="color:var(--accent-purple)">null</span> → return None (end subtree)`
                        : `Read value <span style="color:var(--accent-orange)">${token}</span> → create node, then build left & right`,
                    statusText: token === 'null' ? `null → None` : `node ${token}`,
                    log: token === 'null' ? `    null → None` : `    ${token} → new node`,
                    logColor: token === 'null' ? 'var(--accent-purple)' : 'var(--accent-green)'
                });
            });

            steps.push({
                type: 'final',
                serialized: serialized,
                panel: `Round-trip successful!<br>Original input and reconstructed tree match.<br><strong>Serialized:</strong> <span style="color:var(--accent-green)">${serialized}</span>`,
                complete: true,
                finalStr: serialized,
                statusText: `Serialization + Deserialization complete`,
                log: `Final serialized string: ${serialized}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Stack visualization (simplified for clarity)
            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';
            if (step.type === 'append' || step.type === 'read') {
                const frame = document.createElement('div');
                frame.className = 'stack-frame active';
                frame.innerHTML = step.type === 'append' ? `dfs() - append` : `dfs() - read`;
                stackContainer.appendChild(frame);
            }

            // Tree display (simple representation)
            const treeDisp = document.getElementById('tree-display');
            treeDisp.innerHTML = step.serialized ? 
                `Preorder: ${step.serialized}` : 
                'Tree structure preserved via null markers';

            // Serialized string
            const serDisp = document.getElementById('serialized-string');
            serDisp.innerText = step.serialized || '—';

            // Main panel
            document.getElementById('main-panel').innerHTML = step.panel || '—';

            // Info cells
            document.getElementById('val-node').innerText = step.token && step.token !== 'null' ? step.token : '—';
            document.getElementById('val-next').innerText = step.token || '—';
            document.getElementById('val-action').innerText = step.type === 'append' ? 'Append' : 
                                                           step.type === 'read' ? 'Read' : '—';

            // Result
            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : (step.serialized || '—');
            if (step.complete) resVal.style.color = 'var(--accent-green)';

            document.getElementById('status-text').innerText = step.statusText || 'Processing...';

            // Log panel
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = init;
    </script>
</body>
</html>
