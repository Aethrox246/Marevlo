<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climbing Stairs - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #c678dd;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 80px;
            font-size: 14px;
            font-family: monospace;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 60px; 
            width: 100%; 
            max-width: 860px;
        }
        
        .stair-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stair-tiles {
            display: flex;
            flex-direction: column-reverse;
            gap: 4px;
        }
        .stair-step {
            height: 28px;
            width: 180px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-family: monospace;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }
        .stair-step.active { border-color: var(--accent-orange); background: #2d2d2d; color: var(--accent-orange); }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; text-align: center; }

        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 720px; text-align: center; font-family: monospace; min-height: 108px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .result-display { margin-top: 16px; font-size: 28px; color: var(--accent-green); font-family: monospace; font-weight: bold; }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 660px;}

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 740px; max-width: 94%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }

        @keyframes popIn { 0%{transform:scale(0.6)} 100%{transform:scale(1)} }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="text" id="input-n" value="4" style="width:80px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(3)">Ex 1: n=3</button>
        <button onclick="loadExample(4)">Ex 2: n=4</button>
    </div>

    <div class="visual-container">
        <div class="stair-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Stair Tree</div>
            <div class="stair-tiles" id="stair-tiles"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current n</span>
            <span class="info-value" id="val-n" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Ways</span>
            <span class="info-value" id="val-ways" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="ui-label" style="font-size:12px;">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Computed Value</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange)"></span> Current Call</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let n = 4;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1300, 650, 320];

        function init() {
            n = 4;
            document.getElementById('input-n').value = n;
            generateSteps();
            reset();
        }

        function loadExample(val) {
            n = val;
            document.getElementById('input-n').value = n;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const inputVal = parseInt(document.getElementById('input-n').value.trim());
            if (!isNaN(inputVal) && inputVal >= 0 && inputVal <= 30) {
                n = inputVal;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];

            // INIT
            steps.push({
                type: 'init',
                currentN: n,
                ways: -1,
                panel: `Start computing ways to climb <span style="color:var(--accent-green)"><b>${n}</b></span> stairs.<br>Using recursion with memoization.`,
                statusText: `Climbing Stairs - n=${n}`,
                log: `climb(${n})`,
                logColor: 'var(--text-dim)'
            });

            const memo = new Array(n + 1).fill(-1);

            function helper(i) {
                if (i < 0) {
                    steps.push({
                        type: 'base',
                        currentN: i,
                        ways: 0,
                        panel: `Base case: i = ${i} &lt; 0 → return <b>0</b>`,
                        statusText: `Base (invalid)`,
                        log: `helper(${i}) = 0`,
                        logColor: 'var(--accent-red)'
                    });
                    return 0;
                }
                if (i === 0) {
                    steps.push({
                        type: 'base',
                        currentN: i,
                        ways: 1,
                        panel: `Base case: i = 0 → return <b>1</b>`,
                        statusText: `Base (ground)`,
                        log: `helper(0) = 1`,
                        logColor: 'var(--accent-green)'
                    });
                    return 1;
                }
                if (memo[i] !== -1) {
                    steps.push({
                        type: 'memo',
                        currentN: i,
                        ways: memo[i],
                        panel: `Memo hit for i = ${i} → return cached value <b>${memo[i]}</b>`,
                        statusText: `Memo hit`,
                        log: `helper(${i}) = ${memo[i]} (cached)`,
                        logColor: 'var(--accent-purple)'
                    });
                    return memo[i];
                }

                steps.push({
                    type: 'call',
                    currentN: i,
                    ways: -1,
                    panel: `Compute helper(${i}) = helper(${i-1}) + helper(${i-2})`,
                    statusText: `Compute helper(${i})`,
                    log: `helper(${i}) = helper(${i-1}) + helper(${i-2})`,
                    logColor: 'var(--accent-blue)'
                });

                const left = helper(i - 1);
                const right = helper(i - 2);
                const res = left + right;

                memo[i] = res;

                steps.push({
                    type: 'result',
                    currentN: i,
                    ways: res,
                    panel: `helper(${i}) = ${left} + ${right} = <span style="color:var(--accent-green)"><b>${res}</b></span>`,
                    statusText: `Result for ${i}`,
                    log: `helper(${i}) = ${res}`,
                    logColor: 'var(--accent-green)'
                });

                return res;
            }

            const finalWays = helper(n);

            // FINAL
            steps.push({
                type: 'final',
                currentN: n,
                ways: finalWays,
                panel: `All computations done.<br>Number of ways to climb ${n} stairs = <span style="color:var(--accent-green)"><b>${finalWays}</b></span>`,
                complete: true,
                finalStr: finalWays.toString(),
                statusText: `Done - ${finalWays} ways`,
                log: `Final ways = ${finalWays}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render stair tree
            const stairEl = document.getElementById('stair-tiles');
            stairEl.innerHTML = '';
            for (let i = n; i >= 0; i--) {
                const stepDiv = document.createElement('div');
                stepDiv.className = 'stair-step';
                stepDiv.innerText = `Step ${i}`;
                if (step.currentN === i) {
                    stepDiv.classList.add('active');
                }
                stairEl.appendChild(stepDiv);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-n').innerText = step.currentN !== undefined ? step.currentN : '—';
            document.getElementById('val-ways').innerText = step.ways !== -1 ? step.ways : '—';

            const resEl = document.getElementById('res-val');
            resEl.innerText = step.complete ? step.finalStr : '—';

            document.getElementById('status-text').innerText = step.statusText || '—';

            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logEl.appendChild(line);
                }
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
