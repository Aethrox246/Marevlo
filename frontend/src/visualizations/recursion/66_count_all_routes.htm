<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count All Routes - Visualization (Fixed)</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-purple: #a371f7;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-bar {
            width: 100%;
            background: var(--bg-surface);
            padding: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-main);
        }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            padding: 0 12px;
            height: 34px;
            border-radius: 6px;
            width: 520px;
            font-family: monospace;
        }
        button {
            height: 34px;
            padding: 0 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container {
            margin-top: 30px;
            display: flex;
            gap: 80px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stack-area {
            text-align: center;
        }
        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            width: 300px;
            height: 420px;
            border: 2px dashed var(--border-main);
            border-bottom: 6px solid var(--accent-blue);
            padding: 12px;
            background: rgba(22,27,34,0.6);
            overflow-y: auto;
            border-radius: 8px;
        }
        .stack-frame {
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            transition: all 0.25s;
        }
        .stack-frame.active {
            background: #0a1f3d;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.08);
            box-shadow: 0 0 15px var(--accent-blue);
        }

        .cities-area {
            text-align: center;
        }
        .cities-list {
            display: flex;
            gap: 12px;
            background: var(--bg-surface);
            padding: 14px;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            min-width: 320px;
            justify-content: center;
        }
        .city-item {
            padding: 10px 14px;
            background: #21262d;
            border-radius: 6px;
            font-family: monospace;
            font-size: 15px;
            transition: all 0.3s;
            min-width: 60px;
            text-align: center;
        }
        .city-item.start { border: 2px solid var(--accent-orange); }
        .city-item.dest { border: 2px solid var(--accent-purple); }

        .fuel-bar {
            margin-top: 20px;
            height: 24px;
            background: #21262d;
            border-radius: 12px;
            overflow: hidden;
            width: 300px;
            position: relative;
        }
        .fuel-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-green), #3fb950);
            transition: width 0.4s ease;
        }
        .fuel-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: monospace;
            font-size: 13px;
            color: #111;
            font-weight: bold;
        }

        .action-panel {
            margin: 30px 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 22px 30px;
            width: 960px;
            max-width: 96%;
            min-height: 140px;
            font-family: monospace;
            font-size: 15.5px;
            line-height: 1.6;
        }

        .info-panel {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
        .info-cell {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 16px 24px;
            min-width: 170px;
        }
        .info-label { font-size: 12px; color: var(--text-dim); }
        .info-value { font-size: 22px; font-family: monospace; font-weight: bold; }

        .result-display {
            font-size: 28px;
            margin: 20px 0;
        }
        #res-val { color: var(--accent-green); font-size: 38px; font-weight: bold; }

        .controls {
            margin: 30px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend {
            margin-top: 20px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 13.5px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 30px;
            width: 960px;
            max-width: 96%;
            height: 190px;
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 18px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13.8px;
            line-height: 1.55;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label>Locations =</label>
        <input type="text" id="locations-input" value="2,3,6,8,4" style="width:520px;">
        <label>Start =</label>
        <input type="text" id="start-input" value="1" style="width:60px;">
        <label>Dest =</label>
        <input type="text" id="dest-input" value="3" style="width:60px;">
        <label>Fuel =</label>
        <input type="text" id="fuel-input" value="5" style="width:80px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div style="margin-bottom:8px;color:var(--accent-blue);font-weight:bold;">DP STATE</div>
            <div class="stack-container" id="stack-container"></div>
        </div>

        <div class="cities-area">
            <div style="margin-bottom:8px;color:var(--accent-orange);font-weight:bold;">CITIES</div>
            <div class="cities-list" id="cities-list"></div>
            
            <div style="margin-top:24px;">
                <div style="margin-bottom:8px;color:var(--accent-purple);font-weight:bold;">CURRENT FUEL</div>
                <div class="fuel-bar">
                    <div class="fuel-fill" id="fuel-fill" style="width:100%;"></div>
                    <div class="fuel-label" id="fuel-label">5</div>
                </div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">
        Count All Routes — Bottom-Up DP<br>
        dp[city][fuel] = ways to reach destination from city with remaining fuel.<br>
        We fill from high fuel to low fuel.
    </div>

    <div class="info-panel">
        <div class="info-cell">
            <div class="info-label">City</div>
            <div class="info-value" id="val-city" style="color:var(--accent-orange);">—</div>
        </div>
        <div class="info-cell">
            <div class="info-label">Fuel</div>
            <div class="info-value" id="val-fuel" style="color:var(--accent-blue);">—</div>
        </div>
        <div class="info-cell">
            <div class="info-label">Ways</div>
            <div class="info-value" id="val-ways" style="color:var(--accent-green);">—</div>
        </div>
    </div>

    <div class="result-display">
        Total Routes = <span id="res-val" style="color:var(--accent-green);">—</span>
    </div>

    <div class="controls">
        <button onclick="reset()">Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <label>Speed: <input type="range" id="speed-slider" min="0" max="2" value="1"></label>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-green);border-radius:4px;"></span> Destination</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-orange);border-radius:4px;"></span> Start</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let locations = [];
        let start_idx = 0;
        let dest_idx = 0;
        let max_fuel = 0;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1050, 520, 250];
        const MOD = 1000000007;

        let dp = [];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            if (ex === 0) {
                locations = [2,3,6,8,4];
                start_idx = 1;
                dest_idx = 3;
                max_fuel = 5;
            } else {
                locations = [4,3,1];
                start_idx = 1;
                dest_idx = 0;
                max_fuel = 2;
            }
            document.getElementById('locations-input').value = locations.join(',');
            document.getElementById('start-input').value = start_idx;
            document.getElementById('dest-input').value = dest_idx;
            document.getElementById('fuel-input').value = max_fuel;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('locations-input').value.trim();
            if (!val) return;
            locations = val.split(',').map(s => parseInt(s.trim()));
            start_idx = parseInt(document.getElementById('start-input').value) || 0;
            dest_idx = parseInt(document.getElementById('dest-input').value) || 0;
            max_fuel = parseInt(document.getElementById('fuel-input').value) || 5;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = locations.length;

            // Initialize DP
            dp = Array.from({length: n}, () => Array(max_fuel + 1).fill(0));
            for (let f = 0; f <= max_fuel; f++) {
                dp[dest_idx][f] = 1;
            }

            steps.push({
                type: 'init',
                panel: `Count All Routes<br>Locations: [${locations.join(',')}]<br>Start=${start_idx}, Dest=${dest_idx}, Fuel=${max_fuel}<br>dp[${dest_idx}][*] = 1 (base case)`,
                statusText: `Init dp`,
                log: `Initialize dp[${dest_idx}][0..${max_fuel}] = 1`,
                logColor: '#8b949e'
            });

            for (let f = max_fuel; f >= 0; f--) {
                for (let city = 0; city < n; city++) {
                    if (city === dest_idx) continue; // already initialized

                    let ways = 0;
                    for (let next = 0; next < n; next++) {
                        if (next === city) continue;
                        const cost = Math.abs(locations[city] - locations[next]);
                        if (f >= cost) {
                            ways = (ways + dp[next][f - cost]) % MOD;
                        }
                    }
                    dp[city][f] = ways;

                    steps.push({
                        type: 'update',
                        city: city,
                        fuel: f,
                        ways: ways,
                        panel: `dp[${city}][${f}] = ${ways} (sum from valid next cities)`,
                        statusText: `city=${city}, f=${f}`,
                        log: `  dp[${city}][${f}] = ${ways}`,
                        logColor: '#58a6ff'
                    });
                }
            }

            const result = dp[start_idx][max_fuel];

            steps.push({
                type: 'final',
                panel: `Computation finished.<br><strong>Total valid routes = ${result}</strong>`,
                complete: true,
                finalStr: result.toString(),
                statusText: `Result = ${result}`,
                log: `Final answer: ${result}`,
                logColor: '#3fb950',
                bold: true
            });
        }

        function createCitiesList() {
            const list = document.getElementById('cities-list');
            list.innerHTML = '';
            for (let i = 0; i < locations.length; i++) {
                const item = document.createElement('div');
                item.className = 'city-item';
                if (i === start_idx) item.classList.add('start');
                if (i === dest_idx) item.classList.add('dest');
                item.textContent = `${i} (${locations[i]})`;
                list.appendChild(item);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const stackCont = document.getElementById('stack-container');
            stackCont.innerHTML = '';

            if (step.city !== undefined) {
                const frame = document.createElement('div');
                frame.className = 'stack-frame active';
                frame.innerHTML = `city=${step.city}<br>fuel=${step.fuel}<br>ways=${step.ways}`;
                stackCont.appendChild(frame);
            }

            createCitiesList();

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-city').innerText = step.city !== undefined ? step.city : '—';
            document.getElementById('val-fuel').innerText = step.fuel !== undefined ? step.fuel : '—';
            document.getElementById('val-ways').innerText = step.ways !== undefined ? step.ways : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.color = steps[i].logColor || '#c9d1d9';
                    if (steps[i].bold) line.style.fontWeight = 'bold';
                    line.textContent = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.textContent = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        window.onload = init;
    </script>
</body>
</html>
