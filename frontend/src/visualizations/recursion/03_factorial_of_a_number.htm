<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial of a Number (Recursion) - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 100px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: VISUALIZATION AREA */
        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            gap: 50px; 
            width: 100%; 
            max-width: 800px;
        }
        
        /* Stack Representation */
        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 6px;
            width: 180px;
            height: 300px;
            border-bottom: 4px solid var(--border-main);
            border-left: 2px dashed var(--border-main);
            border-right: 2px dashed var(--border-main);
            padding: 10px;
            background: rgba(22, 27, 34, 0.5);
            overflow-y: auto;
        }
        .stack-frame {
            width: 100%;
            padding: 10px 0;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            border-radius: 4px;
            text-align: center;
            font-family: monospace;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--accent-blue);
            font-weight: bold;
            z-index: 2;
        }

        /* Output Representation - Now shows current result */
        .output-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 300px;
            justify-content: flex-end;
        }
        .tiles-wrapper { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 400px; 
            min-height: 80px; 
            padding: 15px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            align-content: flex-start;
        }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--accent-green); background: #0f2a1a;
            color: var(--accent-green);
            animation: popIn 0.3s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 26px; color: var(--accent-green); font-family: monospace; transition: all 0.3s; font-weight: bold; letter-spacing: 3px;}
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 32px !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">N =</label>
        <input type="number" id="num-input" placeholder="5" min="0" max="12">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(5)">Ex 1 (N=5)</button>
        <button onclick="loadExample(3)">Ex 2 (N=3)</button>
    </div>

    <div class="visual-container">
        <div class="stack-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Call Stack</div>
            <div class="stack-container" id="stack-container"></div>
        </div>
        <div class="output-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Current Result</div>
            <div class="tiles-wrapper" id="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current (n)</span>
            <span class="info-value" id="val-curr" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Return Value</span>
            <span class="info-value" id="val-return" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">factorial(N) =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Active Function Call</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Computed Result</div>
        <div class="legend-item"><span class="dot" style="background:var(--btn-bg); border: 1px solid var(--border-main)"></span> Suspended Call</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let targetN = 5;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample(5); }

        function loadExample(newN) {
            targetN = parseInt(newN);
            document.getElementById('num-input').value = targetN;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valStr = document.getElementById('num-input').value;
            const parsedN = parseInt(valStr);
            
            if (!isNaN(parsedN) && parsedN >= 0 && parsedN <= 12) {
                loadExample(parsedN);
            } else {
                alert("Please enter a valid non-negative integer (max 12 for visualization).");
            }
        }

        function generateSteps() {
            steps = [];
            let callStack = [];
            let currentResult = null;   // Current return value being built

            // STEP 0: INIT
            steps.push({
                type: 'init', curr: '—', ret: '—',
                stack: [...callStack], output: [],
                panel: `Initialize recursive computation of <code>factorial(${targetN})</code>.<br>Base case: if n ≤ 1, return 1.`,
                statusText: `Computing factorial(${targetN}). Click Play to start.`,
                log: `Starting factorial(${targetN})`,
                logColor: 'var(--text-dim)'
            });

            function solveRecursively(n) {
                callStack.push(`factorial(${n})`);
                
                steps.push({
                    type: 'call', curr: n, ret: '—',
                    stack: [...callStack], output: currentResult !== null ? [currentResult] : [],
                    panel: `Called <code>factorial(${n})</code>.<br>Check base case: Is <code>${n} ≤ 1</code>?`,
                    statusText: `Executing factorial(${n})...`,
                    log: `Call factorial(${n})`,
                    logColor: 'var(--text-main)'
                });

                if (n <= 1) {
                    steps.push({
                        type: 'base', curr: n, ret: 1,
                        stack: [...callStack], output: [1],
                        panel: `<span style="color:var(--accent-red)">Base case triggered!</span> <code>${n} ≤ 1</code>.<br>Return <span style="color:var(--accent-green)"><b>1</b></span>.`,
                        statusText: `Base case: returning 1`,
                        log: `  Base case: return 1`,
                        logColor: 'var(--accent-red)'
                    });
                    
                    callStack.pop();
                    return 1;
                }

                // RECURSIVE CALL
                steps.push({
                    type: 'recurse', curr: n, ret: '—',
                    stack: [...callStack], output: currentResult !== null ? [currentResult] : [],
                    panel: `Recursive call: Compute <code>factorial(${n-1})</code> first.`,
                    statusText: `Calling factorial(${n-1})...`,
                    log: `  Recurse → factorial(${n-1})`,
                    logColor: 'var(--accent-blue)'
                });

                const subResult = solveRecursively(n - 1);

                // MULTIPLICATION (unwinding)
                const finalResult = n * subResult;
                currentResult = finalResult;

                steps.push({
                    type: 'multiply', curr: n, ret: finalResult,
                    stack: [...callStack], output: [finalResult],
                    panel: `Returned from <code>factorial(${n-1})</code> = <span style="color:var(--accent-green)">${subResult}</span>.<br>Compute <code>${n} × ${subResult} = ${finalResult}</code>.`,
                    statusText: `${n} × ${subResult} = ${finalResult}`,
                    log: `  Return ${n} * ${subResult} = ${finalResult}`,
                    logColor: 'var(--accent-green)'
                });

                callStack.pop();
                if (callStack.length > 0) {
                    steps.push({
                        type: 'unwind', curr: n, ret: finalResult,
                        stack: [...callStack], output: [finalResult],
                        panel: `Unwinding: Returning <span style="color:var(--accent-green)"><b>${finalResult}</b></span> to previous call.`,
                        statusText: `Returning ${finalResult} to factorial(${callStack[callStack.length-1] ? callStack[callStack.length-1].match(/\d+/)[0] : ''})`,
                        log: `Unwind → return ${finalResult}`,
                        logColor: 'var(--text-dim)'
                    });
                }

                return finalResult;
            }

            // Start recursion
            const finalAnswer = solveRecursively(targetN);

            // FINAL STEP
            steps.push({
                type: 'final', curr: '—', ret: finalAnswer,
                stack: [], output: [finalAnswer],
                panel: `Recursion complete.<br><code>factorial(${targetN}) = ${finalAnswer}</code>`,
                complete: true,
                finalStr: finalAnswer.toString(),
                statusText: `Done. factorial(${targetN}) = ${finalAnswer}`,
                log: `Final Result: ${finalAnswer}`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render Stack
            const stackContainer = document.getElementById('stack-container');
            stackContainer.innerHTML = '';
            
            step.stack.forEach((frameStr, i) => {
                const frame = document.createElement('div');
                const isTop = (i === step.stack.length - 1);
                frame.className = `stack-frame ${isTop ? 'active' : ''}`;
                frame.innerHTML = frameStr;
                stackContainer.appendChild(frame);
            });

            // Render Current Result (single tile)
            const outContainer = document.getElementById('output-container');
            outContainer.innerHTML = '';
            
            if (step.output && step.output.length > 0) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = step.output[0];
                outContainer.appendChild(tile);
            }

            // Update Panels
            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-curr').innerText = step.curr;
            document.getElementById('val-return').innerText = step.ret || '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            
            if (step.complete) {
                resVal.classList.add('pop');
            } else {
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            // Update Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
