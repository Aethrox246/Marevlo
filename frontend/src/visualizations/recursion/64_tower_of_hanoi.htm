<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower of Hanoi - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-orange: #e3b341;
            --accent-blue: #58a6ff;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: #c9d1d9;
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-bar {
            background: var(--bg-surface);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        input, button {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-main);
            background: #0d1117;
            color: #c9d1d9;
        }
        button {
            background: #21262d;
            cursor: pointer;
        }
        button:hover { background: #2d333b; }

        .pegs-container {
            display: flex;
            gap: 60px;
            margin-bottom: 30px;
        }
        .peg-column {
            text-align: center;
        }
        .peg {
            width: 20px;
            height: 300px;
            background: #30363d;
            margin: 0 auto 10px;
            position: relative;
            border-radius: 4px;
        }
        .peg-label {
            font-family: monospace;
            color: var(--accent-orange);
            margin-top: 8px;
        }
        .disk-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .disk {
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            font-weight: bold;
            color: #111;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
        }
        .disk-1 { width: 70px; background: #ff7b72; }
        .disk-2 { width: 100px; background: #f0883e; }
        .disk-3 { width: 130px; background: #e3b341; }
        .disk-4 { width: 160px; background: #3fb950; }
        .disk-5 { width: 190px; background: #58a6ff; }

        .move-log {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 16px;
            width: 620px;
            min-height: 140px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 10px 18px;
        }

        .legend {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label>n = </label>
        <input type="number" id="n-input" value="3" min="1" max="7" style="width:80px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(2)">n=2</button>
        <button onclick="loadExample(3)">n=3</button>
    </div>

    <div class="pegs-container">
        <div class="peg-column">
            <div class="peg" id="peg-A"><div class="disk-container" id="disks-A"></div></div>
            <div class="peg-label">A (Source)</div>
        </div>
        <div class="peg-column">
            <div class="peg" id="peg-B"><div class="disk-container" id="disks-B"></div></div>
            <div class="peg-label">B (Aux)</div>
        </div>
        <div class="peg-column">
            <div class="peg" id="peg-C"><div class="disk-container" id="disks-C"></div></div>
            <div class="peg-label">C (Dest)</div>
        </div>
    </div>

    <div class="move-log" id="move-log">Click Play to start...</div>

    <div class="controls">
        <button onclick="resetViz()">Reset</button>
        <button onclick="prevStep()">← Prev</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed: 
            <input type="range" id="speed" min="0" max="2" value="1" style="width:120px;">
        </label>
    </div>

    <div class="legend">
        <span style="color:#3fb950">●</span> Disk moving
    </div>

    <script>
        let n = 3;
        let src = 'A', auxi = 'B', dest = 'C';
        let steps = [];
        let stepIdx = 0;
        let isPlaying = false;
        let timer = null;
        let delays = [1200, 600, 300];

        let pegState = { A: [], B: [], C: [] };
        let moveList = [];

        function initPegs() {
            pegState = { A: [], B: [], C: [] };
            for (let i = n; i >= 1; i--) {
                pegState[src].push(i);
            }
        }

        function generateSteps() {
            steps = [];
            moveList = [];

            function hanoi(k, from, temp, to) {
                if (k === 1) {
                    moveList.push(`Move disk 1 from ${from} to ${to}`);
                    steps.push({ type: 'move', disk: 1, from, to });
                    return;
                }
                hanoi(k-1, from, to, temp);
                moveList.push(`Move disk ${k} from ${from} to ${to}`);
                steps.push({ type: 'move', disk: k, from, to });
                hanoi(k-1, temp, from, to);
            }

            steps.push({ type: 'start', text: `Starting Tower of Hanoi with ${n} disks` });
            hanoi(n, src, auxi, dest);
            steps.push({ type: 'end', text: `Completed in ${moveList.length} moves` });
        }

        function renderPegs() {
            ['A','B','C'].forEach(p => {
                const cont = document.getElementById(`disks-${p}`);
                cont.innerHTML = '';
                pegState[p].forEach(diskNum => {
                    const d = document.createElement('div');
                    d.className = `disk disk-${diskNum}`;
                    d.textContent = diskNum;
                    cont.appendChild(d);
                });
            });
        }

        function renderStep(i) {
            const step = steps[i];
            if (!step) return;

            document.getElementById('move-log').textContent = moveList.slice(0, i).join('\n') || 'Starting...';

            if (step.type === 'move') {
                // Simulate the move on pegs for visualization
                // For simplicity, we re-init and apply all moves up to this step
                initPegs();
                for (let m = 0; m < i; m++) {
                    if (steps[m].type === 'move') {
                        const mv = steps[m];
                        const fromPeg = pegState[mv.from];
                        const toPeg = pegState[mv.to];
                        if (fromPeg.length > 0) {
                            const disk = fromPeg.pop();
                            toPeg.push(disk);
                        }
                    }
                }
            }

            renderPegs();
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) {
                stepIdx++;
                renderStep(stepIdx);
            }
        }

        function prevStep() {
            if (stepIdx > 0) {
                stepIdx--;
                renderStep(stepIdx);
            }
        }

        function resetViz() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
            stepIdx = 0;
            initPegs();
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                clearInterval(timer);
                isPlaying = false;
                btn.textContent = '▶ Play';
            } else {
                isPlaying = true;
                btn.textContent = 'Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) {
                        nextStep();
                    } else {
                        clearInterval(timer);
                        isPlaying = false;
                        btn.textContent = '▶ Play';
                    }
                }, delays[parseInt(document.getElementById('speed').value)]);
            }
        }

        function loadCustom() {
            n = parseInt(document.getElementById('n-input').value) || 3;
            generateSteps();
            resetViz();
        }

        function loadExample(val) {
            n = val;
            document.getElementById('n-input').value = n;
            generateSteps();
            resetViz();
        }

        window.onload = () => {
            generateSteps();
            initPegs();
            renderStep(0);
        };
    </script>
</body>
</html>
