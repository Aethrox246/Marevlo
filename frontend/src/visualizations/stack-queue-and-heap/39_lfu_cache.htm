<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFU Cache - Brute Force Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 { margin: 0; color: var(--accent-purple); }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        label.ui-label { font-family: monospace; font-size: 13px; color: var(--text-dim); }

        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 100px;
        }

        button {
            height: 32px;
            border-radius: 6px;
            padding: 0 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            font-size: 13px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .cache-box {
            background: var(--bg-surface);
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
        }
        .cache-label {
            color: var(--accent-purple);
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            font-size: 18px;
        }
        .entries {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            min-height: 140px;
            padding: 16px;
            background: #21262d;
            border-radius: 10px;
        }
        .entry {
            background: #2d333b;
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            padding: 12px 16px;
            width: 110px;
            text-align: center;
            font-family: monospace;
            font-size: 13px;
            transition: all 0.3s;
        }
        .entry.current {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 4px rgba(227, 179, 65, 0.3);
            transform: scale(1.08);
        }
        .entry.evicted {
            border-color: var(--accent-red);
            opacity: 0.6;
        }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 20px 24px;
            width: 100%;
            max-width: 900px;
            min-height: 140px;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 16px 20px;
            width: 100%;
            max-width: 900px;
            height: 220px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13.5px;
            line-height: 1.55;
        }

        .legend {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 13px;
            margin-top: 10px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>LFU Cache (Brute Force)</h1>
        <p style="color:var(--text-dim);margin:8px 0 0;">Array-based simulation • O(n) per operation</p>
    </div>

    <div class="input-bar">
        <label class="ui-label">Capacity:</label>
        <input type="text" id="cap-input" value="2">
        <button onclick="initCache()">Initialize</button>
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
    </div>

    <div class="visual-container">
        <div class="cache-box">
            <div class="cache-label">Cache Entries (Key | Value | Freq | Time)</div>
            <div class="entries" id="entries"></div>
        </div>

        <div class="action-panel" id="action-panel">Ready. Click Initialize or load an example.</div>

        <div class="controls">
            <button onclick="resetSim()">↺ Reset</button>
            <button onclick="prevStep()">← Back</button>
            <button onclick="togglePlay()" id="play-btn">▶ Play</button>
            <button onclick="nextStep()">Next →</button>
            <label style="display:flex;align-items:center;gap:8px;">
                <span class="ui-label">Speed</span>
                <input type="range" id="speed" min="0" max="2" value="1" style="width:160px;">
            </label>
        </div>

        <div class="log-panel" id="log"></div>
    </div>

    <script>
        let capacity = 2;
        let entries = []; // [{key, value, freq, time}]
        let timeCounter = 0;
        let steps = [];
        let currentStep = 0;
        let isPlaying = false;
        let timer = null;
        const delays = [1800, 950, 450];

        const examples = [
            [
                {op:'put', key:1, val:10},
                {op:'put', key:2, val:20},
                {op:'get', key:1},
                {op:'put', key:3, val:30},
                {op:'get', key:2},
                {op:'get', key:3}
            ],
            [
                {op:'put', key:1, val:100},
                {op:'put', key:2, val:200},
                {op:'get', key:1},
                {op:'get', key:1},
                {op:'put', key:3, val:300},
                {op:'put', key:4, val:400},
                {op:'get', key:2}
            ]
        ];

        function findEntry(key) {
            return entries.findIndex(e => e.key === key);
        }

        function findMinFreqIndex() {
            if (entries.length === 0) return -1;
            let minIdx = 0;
            let minFreq = entries[0].freq;
            let minTime = entries[0].time;

            for (let i = 1; i < entries.length; i++) {
                const e = entries[i];
                if (e.freq < minFreq || (e.freq === minFreq && e.time < minTime)) {
                    minFreq = e.freq;
                    minTime = e.time;
                    minIdx = i;
                }
            }
            return minIdx;
        }

        function generateSteps(ops) {
            capacity = parseInt(document.getElementById('cap-input').value) || 2;
            entries = [];
            timeCounter = 0;
            steps = [];

            steps.push({
                type: 'init',
                panel: `<b>LFU Cache (capacity = ${capacity})</b><br>Entries: []`,
                log: `Initialize LFU Cache (capacity=${capacity})`,
                highlight: []
            });

            ops.forEach(op => {
                const step = { op: op, panel: '', log: '', highlight: [] };

                if (op.op === 'put') {
                    step.panel = `put(${op.key}, ${op.val})`;
                    step.log = `→ put(${op.key}, ${op.val})`;

                    const idx = findEntry(op.key);
                    if (idx !== -1) {
                        entries[idx].value = op.val;
                        entries[idx].freq++;
                        step.highlight = [idx];
                    } else {
                        if (entries.length >= capacity) {
                            const evictIdx = findMinFreqIndex();
                            step.log += ` | Evict key=${entries[evictIdx].key} (freq=${entries[evictIdx].freq})`;
                            step.highlight = [evictIdx];
                            entries.splice(evictIdx, 1);
                        }
                        const newEntry = {key: op.key, value: op.val, freq: 1, time: timeCounter++};
                        entries.push(newEntry);
                        step.highlight = [entries.length - 1];
                    }
                } else if (op.op === 'get') {
                    step.panel = `get(${op.key})`;
                    step.log = `→ get(${op.key})`;

                    const idx = findEntry(op.key);
                    if (idx !== -1) {
                        entries[idx].freq++;
                        step.highlight = [idx];
                        step.panel += ` → <b>${entries[idx].value}</b>`;
                        step.log += ` → ${entries[idx].value}`;
                    } else {
                        step.panel += ` → <b>-1</b>`;
                        step.log += ` → -1`;
                    }
                }

                steps.push(step);
            });
        }

        function renderEntries(highlight = []) {
            const container = document.getElementById('entries');
            container.innerHTML = '';

            if (entries.length === 0) {
                container.innerHTML = `<div style="color:var(--text-dim);padding:40px 20px;">Cache is empty</div>`;
                return;
            }

            entries.forEach((e, i) => {
                const div = document.createElement('div');
                div.className = 'entry';
                if (highlight.includes(i)) div.classList.add('current');
                div.innerHTML = `
                    <b>${e.key}</b><br>
                    ${e.value}<br>
                    freq: <b>${e.freq}</b><br>
                    t: ${e.time}
                `;
                container.appendChild(div);
            });
        }

        function renderStep(idx) {
            if (idx < 0 || idx >= steps.length) return;
            currentStep = idx;

            const step = steps[idx];
            document.getElementById('action-panel').innerHTML = step.panel || '—';

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx+1).map(s => {
                return `<div style="margin:4px 0;white-space:pre-wrap;">${s.log}</div>`;
            }).join('');

            renderEntries(step.highlight || []);
        }

        function nextStep() {
            if (currentStep < steps.length - 1) {
                renderStep(currentStep + 1);
            } else {
                pause();
            }
        }

        function prevStep() {
            if (currentStep > 0) renderStep(currentStep - 1);
        }

        function resetSim() {
            pause();
            currentStep = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                if (currentStep >= steps.length - 1) currentStep = 0;
                timer = setInterval(() => {
                    if (currentStep < steps.length - 1) {
                        nextStep();
                    } else {
                        pause();
                    }
                }, delays[document.getElementById('speed').value]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            generateSteps(examples[n]);
            resetSim();
        }

        function initCache() {
            loadExample(0);
        }

        // Auto start with example 1
        window.onload = () => {
            loadExample(0);
        };
    </script>
</body>
</html>
