<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge k Sorted Lists - Min-Heap Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 10px 0; }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visuals {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .list-column {
            background: var(--bg-surface);
            border: 2px solid var(--accent-blue);
            border-radius: 12px;
            padding: 16px;
            width: 180px;
        }
        .list-label { color: var(--accent-blue); text-align: center; margin-bottom: 10px; font-weight: bold; }
        .list-nodes {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .node {
            background: #21262d;
            border: 2px solid var(--accent-green);
            padding: 10px 14px;
            border-radius: 8px;
            font-family: monospace;
            text-align: center;
        }
        .node.current { border-color: var(--accent-orange); box-shadow: 0 0 0 3px rgba(227,179,65,0.4); }

        .heap-container {
            background: var(--bg-surface);
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 16px;
            width: 260px;
        }
        .heap-label { color: var(--accent-purple); text-align: center; margin-bottom: 12px; font-weight: bold; }
        .heap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 140px;
        }
        .heap-node {
            background: #2d333b;
            border: 2px solid var(--accent-purple);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 15px;
        }

        .merged-container {
            background: var(--bg-surface);
            border: 3px solid var(--accent-green);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 900px;
        }
        .merged-label { color: var(--accent-green); text-align: center; margin-bottom: 12px; font-weight: bold; }
        .merged {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            min-height: 130px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.65;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px 20px;
            width: 100%;
            max-width: 900px;
            height: 220px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Merge k Sorted Lists</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">Min-Heap (Priority Queue) • O(n log k)</p>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetSim()">Reset</button>
    </div>

    <div class="visuals">
        <!-- Lists -->
        <div id="lists-container" style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center;"></div>

        <!-- Heap -->
        <div class="heap-container">
            <div class="heap-label">Min-Heap (value, listIdx)</div>
            <div class="heap" id="heap-vis"></div>
        </div>

        <!-- Merged -->
        <div class="merged-container">
            <div class="merged-label">Merged Result</div>
            <div class="merged" id="merged-vis"></div>
        </div>
    </div>

    <div class="action-panel" id="action-panel">Click an example to begin simulation</div>

    <div class="controls">
        <button onclick="prevStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let lists = [];
        let heap = []; // array of {val, listIdx, nodeIdx}
        let merged = [];
        let pointers = []; // current index in each list
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1550, 820, 380];

        const examples = [
            [[1,4,5], [1,3,4], [2,6]],
            [[], [1,2,3], [4,5]]
        ];

        function generateSteps(inputLists) {
            lists = inputLists.map(l => [...l]);
            pointers = new Array(lists.length).fill(0);
            heap = [];
            merged = [];
            steps = [];

            // Initial step
            steps.push({
                panel: `<b>Initialize</b><br>Heap: empty | Merged: []`,
                heap: [],
                merged: [],
                log: `Start with ${lists.length} lists`
            });

            // Push first nodes
            for (let i = 0; i < lists.length; i++) {
                if (lists[i].length > 0) {
                    heap.push({val: lists[i][0], listIdx: i, nodeIdx: 0});
                }
            }
            // Simple sort for visualization (heap property not strictly enforced in JS demo)
            heap.sort((a,b) => a.val - b.val);

            steps.push({
                panel: `Initial heap populated with first nodes`,
                heap: [...heap],
                merged: [],
                log: `Pushed ${heap.length} initial nodes to min-heap`
            });

            while (heap.length > 0) {
                // Pop smallest
                const smallest = heap.shift(); // for demo we keep sorted
                const {val, listIdx, nodeIdx} = smallest;
                merged.push(val);

                steps.push({
                    panel: `Extract min <b>${val}</b> from list ${listIdx}`,
                    heap: [...heap],
                    merged: [...merged],
                    log: `Popped ${val} from list ${listIdx} → merged = [${merged}]`
                });

                // Push next from same list
                const nextIdx = nodeIdx + 1;
                if (nextIdx < lists[listIdx].length) {
                    const nextVal = lists[listIdx][nextIdx];
                    heap.push({val: nextVal, listIdx: listIdx, nodeIdx: nextIdx});
                    heap.sort((a,b) => a.val - b.val);

                    steps.push({
                        panel: `Push next node <b>${nextVal}</b> from list ${listIdx}`,
                        heap: [...heap],
                        merged: [...merged],
                        log: `Pushed next from list ${listIdx}: ${nextVal}`
                    });
                }
            }

            steps.push({
                panel: `<b>Final Merged:</b> [${merged}]`,
                heap: [],
                merged: [...merged],
                log: `All nodes processed. Final sorted list ready.`
            });
        }

        function renderLists() {
            const container = document.getElementById('lists-container');
            container.innerHTML = '';
            lists.forEach((lst, idx) => {
                const col = document.createElement('div');
                col.className = 'list-column';
                col.innerHTML = `<div class="list-label">List ${idx}</div><div class="list-nodes" id="list-${idx}"></div>`;
                container.appendChild(col);

                const nodesDiv = col.querySelector(`#list-${idx}`);
                lst.forEach((val, nidx) => {
                    const nodeEl = document.createElement('div');
                    nodeEl.className = 'node';
                    nodeEl.textContent = val;
                    nodesDiv.appendChild(nodeEl);
                });
            });
        }

        function renderHeap(h) {
            const container = document.getElementById('heap-vis');
            container.innerHTML = '';
            h.forEach(item => {
                const el = document.createElement('div');
                el.className = 'heap-node';
                el.textContent = `${item.val} (L${item.listIdx})`;
                container.appendChild(el);
            });
            if (h.length === 0) {
                container.innerHTML = `<div style="color:var(--text-dim);padding:30px;">Heap empty</div>`;
            }
        }

        function renderMerged(m) {
            const container = document.getElementById('merged-vis');
            container.innerHTML = '';
            m.forEach(val => {
                const el = document.createElement('div');
                el.className = 'node';
                el.style.borderColor = 'var(--accent-green)';
                el.textContent = val;
                container.appendChild(el);
            });
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('action-panel').innerHTML = step.panel || '—';
            renderHeap(step.heap || []);
            renderMerged(step.merged || []);

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx+1).map(s => 
                `<div style="margin:4px 0;">${s.log}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            generateSteps(examples[n]);
            renderLists();
            resetSim();
        }

        window.onload = () => {
            loadExample(0);
        };
    </script>
</body>
</html>
