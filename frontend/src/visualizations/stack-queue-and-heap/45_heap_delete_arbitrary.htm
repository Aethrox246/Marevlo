<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heap Delete Arbitrary - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 10px 0; }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .heap-container {
            background: var(--bg-surface);
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
        }
        .heap-label { color: var(--accent-purple); text-align: center; margin-bottom: 12px; font-weight: bold; }
        .heap {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 16px;
            background: #21262d;
            border-radius: 10px;
        }
        .tile {
            background: #2d333b;
            border: 2px solid var(--accent-blue);
            padding: 12px 18px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            min-width: 50px;
            text-align: center;
        }
        .tile.target { border-color: var(--accent-red); }
        .tile.replaced { border-color: var(--accent-orange); }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            min-height: 140px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.65;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px 20px;
            width: 100%;
            max-width: 900px;
            height: 220px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Heap Delete Arbitrary</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">Linear Search + Replace + Reheapify</p>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetSim()">Reset</button>
    </div>

    <div class="heap-container">
        <div class="heap-label">Min-Heap (Array Representation)</div>
        <div class="heap" id="heap-vis"></div>
    </div>

    <div class="action-panel" id="action">Click an example to begin</div>

    <div class="controls">
        <button onclick="prevStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let heap = [];
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1650, 900, 420];

        const examples = [
            [[2,5,3,7,8,6,4], 5],
            [[1,3,2,6,5,4], 3]
        ];

        function heapifyDown(heap, i, n) {
            let smallest = i;
            const left = 2 * i + 1;
            const right = 2 * i + 2;

            if (left < n && heap[left] < heap[smallest]) smallest = left;
            if (right < n && heap[right] < heap[smallest]) smallest = right;

            if (smallest !== i) {
                [heap[i], heap[smallest]] = [heap[smallest], heap[i]];
                heapifyDown(heap, smallest, n);
            }
        }

        function heapifyUp(heap, i) {
            while (i > 0) {
                const parent = Math.floor((i - 1) / 2);
                if (heap[i] >= heap[parent]) break;
                [heap[i], heap[parent]] = [heap[parent], heap[i]];
                i = parent;
            }
        }

        function deleteArbitrary(heap, target) {
            const idx = heap.indexOf(target);
            if (idx === -1) return false;

            const last = heap.pop();
            if (idx < heap.length) {
                heap[idx] = last;
                // Reheapify
                const parent = Math.floor((idx - 1) / 2);
                if (idx > 0 && heap[idx] < heap[parent]) {
                    heapifyUp(heap, idx);
                } else {
                    heapifyDown(heap, idx, heap.length);
                }
            }
            return true;
        }

        function generateSteps(initialHeap, target) {
            heap = [...initialHeap];
            steps = [];

            steps.push({
                panel: `<b>Initial Heap</b><br>[${heap}]`,
                log: `Initial min-heap: [${heap}]`,
                array: [...heap],
                highlight: []
            });

            const idx = heap.indexOf(target);
            if (idx !== -1) {
                steps.push({
                    panel: `Found target <b>${target}</b> at index ${idx}`,
                    log: `Target ${target} found at index ${idx}`,
                    array: [...heap],
                    highlight: [idx]
                });

                const last = heap[heap.length - 1];
                heap[idx] = last;
                heap.pop();

                steps.push({
                    panel: `Replaced index ${idx} with last element <b>${last}</b>`,
                    log: `Replaced with last element ${last}`,
                    array: [...heap],
                    highlight: [idx]
                });

                steps.push({
                    panel: `Reheapifying from index ${idx}`,
                    log: `Starting reheapify`,
                    array: [...heap],
                    highlight: [idx]
                });

                // Simulate heapify
                heapifyUp(heap, idx);
                heapifyDown(heap, idx, heap.length);
            } else {
                steps.push({
                    panel: `Target <b>${target}</b> not found`,
                    log: `Target not found`,
                    array: [...heap],
                    highlight: []
                });
            }

            steps.push({
                panel: `<b>Final Heap</b><br>[${heap}]`,
                log: `Final heap after deletion`,
                array: [...heap],
                highlight: []
            });
        }

        function renderHeap(arr, highlight = []) {
            const container = document.getElementById('heap-vis');
            container.innerHTML = '';
            arr.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                if (highlight.includes(i)) tile.classList.add('current');
                tile.textContent = val;
                container.appendChild(tile);
            });
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('action').innerHTML = step.panel || '—';
            renderHeap(step.array, step.highlight || []);

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx+1).map(s => 
                `<div style="margin:5px 0;">${s.log}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            const [initialHeap, target] = examples[n];
            generateSteps(initialHeap, target);
            resetSim();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
