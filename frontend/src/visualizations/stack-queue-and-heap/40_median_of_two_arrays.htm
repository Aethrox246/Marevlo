<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Median of Two Sorted Arrays - Merge Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 10px 0; }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-surface);
            padding: 14px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        input { background: #000000; border: 1px solid var(--border-main); color: white; padding: 6px 10px; border-radius: 6px; width: 180px; }

        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visuals {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
        }

        .array-container {
            background: var(--bg-surface);
            border: 2px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px;
        }
        .array-label { color: var(--accent-purple); font-weight: bold; margin-bottom: 10px; }
        .array {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tile {
            background: #21262d;
            border: 2px solid var(--accent-blue);
            padding: 12px 18px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            min-width: 50px;
            text-align: center;
            transition: all 0.3s;
        }
        .tile.current { border-color: var(--accent-orange); transform: scale(1.12); box-shadow: 0 0 0 4px rgba(227,179,65,0.4); }

        .merged-container {
            background: var(--bg-surface);
            border: 3px solid var(--accent-green);
            border-radius: 12px;
            padding: 20px;
        }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            min-height: 110px;
            font-family: monospace;
            font-size: 15.5px;
            line-height: 1.65;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px 20px;
            width: 100%;
            max-width: 900px;
            height: 240px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.55;
        }

        .legend { display: flex; gap: 24px; justify-content: center; margin-top: 12px; font-size: 13px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <h1>Median of Two Sorted Arrays</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">Brute Force Merge (Two Pointers) • O(m+n)</p>

    <div class="input-bar">
        <input id="arr1" value="[1, 3]" placeholder="nums1 e.g. [1,3]">
        <input id="arr2" value="[2]" placeholder="nums2 e.g. [2]">
        <button onclick="customRun()">Run Custom</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visuals">
        <div class="array-container">
            <div class="array-label">nums1 (i = <span id="i-val">0</span>)</div>
            <div class="array" id="nums1"></div>
        </div>

        <div class="array-container">
            <div class="array-label">nums2 (j = <span id="j-val">0</span>)</div>
            <div class="array" id="nums2"></div>
        </div>

        <div class="merged-container">
            <div class="array-label">Merged Array</div>
            <div class="array" id="merged"></div>
        </div>
    </div>

    <div class="action-panel" id="action">Ready — click an example or custom run</div>

    <div class="controls">
        <button onclick="resetSim()">↺ Reset</button>
        <button onclick="prevStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nums1 = [], nums2 = [];
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1650, 900, 420];

        const examples = [
            {a: [1,3], b: [2]},
            {a: [1,2], b: [3,4]}
        ];

        function parseArray(str) {
            try {
                return JSON.parse(str.replace(/'/g,'"'));
            } catch(e) { return []; }
        }

        function generateSteps(a, b) {
            nums1 = [...a];
            nums2 = [...b];
            steps = [];

            let merged = [];
            let i = 0, j = 0;
            let total = nums1.length + nums2.length;

            steps.push({
                panel: `<b>Start</b><br>nums1 = [${nums1}], nums2 = [${nums2}]`,
                i: 0, j: 0,
                merged: [],
                log: `Initialize merge. Total elements = ${total}`
            });

            while (i < nums1.length && j < nums2.length) {
                steps.push({
                    panel: `Compare <b>${nums1[i]}</b> (nums1) and <b>${nums2[j]}</b> (nums2)`,
                    i: i, j: j,
                    merged: [...merged],
                    log: `nums1[${i}]=${nums1[i]} ${nums1[i] <= nums2[j] ? '≤' : '>'} nums2[${j}]=${nums2[j]}`
                });

                if (nums1[i] <= nums2[j]) {
                    merged.push(nums1[i]);
                    i++;
                } else {
                    merged.push(nums2[j]);
                    j++;
                }
            }

            // Remaining nums1
            while (i < nums1.length) {
                steps.push({
                    panel: `Append remaining from nums1: <b>${nums1[i]}</b>`,
                    i: i, j: j,
                    merged: [...merged],
                    log: `nums2 exhausted → append nums1[${i}] = ${nums1[i]}`
                });
                merged.push(nums1[i]);
                i++;
            }

            // Remaining nums2
            while (j < nums2.length) {
                steps.push({
                    panel: `Append remaining from nums2: <b>${nums2[j]}</b>`,
                    i: i, j: j,
                    merged: [...merged],
                    log: `nums1 exhausted → append nums2[${j}] = ${nums2[j]}`
                });
                merged.push(nums2[j]);
                j++;
            }

            // Final median
            const n = merged.length;
            let median;
            if (n % 2 === 1) {
                median = merged[Math.floor(n/2)];
            } else {
                median = (merged[n/2 - 1] + merged[n/2]) / 2;
            }

            steps.push({
                panel: `<b>Final Merged:</b> [${merged}]<br><b>Median = ${median}</b>`,
                i: i, j: j,
                merged: [...merged],
                log: `Total = ${n} → Median = ${median}`
            });
        }

        function renderArrays(i, j, merged) {
            // nums1
            let html1 = '';
            for (let k = 0; k < nums1.length; k++) {
                const cls = (k === i) ? 'tile current' : 'tile';
                html1 += `<div class="${cls}">${nums1[k]}</div>`;
            }
            document.getElementById('nums1').innerHTML = html1 || '<div class="tile" style="opacity:0.4">—</div>';

            // nums2
            let html2 = '';
            for (let k = 0; k < nums2.length; k++) {
                const cls = (k === j) ? 'tile current' : 'tile';
                html2 += `<div class="${cls}">${nums2[k]}</div>`;
            }
            document.getElementById('nums2').innerHTML = html2 || '<div class="tile" style="opacity:0.4">—</div>';

            // merged
            let htmlM = '';
            for (let val of merged) {
                htmlM += `<div class="tile" style="border-color:var(--accent-green)">${val}</div>`;
            }
            document.getElementById('merged').innerHTML = htmlM || '<div class="tile" style="opacity:0.4">—</div>';

            document.getElementById('i-val').textContent = i;
            document.getElementById('j-val').textContent = j;
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('action').innerHTML = step.panel;
            renderArrays(step.i, step.j, step.merged);

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx+1).map(s => 
                `<div style="margin:5px 0;">${s.log}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[parseInt(document.getElementById('speed').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            const ex = examples[n];
            generateSteps(ex.a, ex.b);
            resetSim();
        }

        function customRun() {
            const a = parseArray(document.getElementById('arr1').value);
            const b = parseArray(document.getElementById('arr2').value);
            generateSteps(a, b);
            resetSim();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
