<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge K Sorted Arrays - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 380px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; max-width: 1100px; }

        .arrays-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .single-array {
            background: #161b22;
            border: 2px solid var(--accent-purple);
            border-radius: 10px;
            padding: 12px;
            min-width: 140px;
        }
        .array-label { color: var(--accent-purple); font-size: 12px; margin-bottom: 6px; }
        .array-tiles {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tile {
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 16px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 1px solid var(--border-main); background: #21262d; color: var(--text-main);
        }

        .heap-container {
            background: #161b22;
            border: 3px solid var(--accent-green);
            border-radius: 12px;
            padding: 20px;
            min-width: 400px;
        }
        .heap-label { color: var(--accent-green); font-weight: bold; margin-bottom: 10px; }
        .heap-tiles {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .heap-tile {
            width: 52px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 2px solid var(--accent-green); background: #0f2a1a; color: var(--accent-green);
        }

        .result-tiles {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: #161b22;
            border: 3px solid var(--accent-blue);
            border-radius: 12px;
            flex-wrap: wrap;
            max-width: 800px;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 26px; width: 760px; min-height: 140px;
            font-family: monospace; font-size: 15px; line-height: 1.65;
        }

        .info-panel { margin: 15px 0; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 8px;
            padding: 12px 22px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .status-bar { margin-top: 8px; font-size: 14px; color: var(--text-dim); min-height: 28px; }

        .controls { margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 15px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 14px 18px; width: 760px; max-width: 95%; height: 180px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Arrays:</label>
        <input type="text" id="arrays-input" value="[[1,4,7],[2,5,8],[3,6,9]]" style="width: 420px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="arrays-container" id="arrays-container"></div>

        <div class="heap-container">
            <div class="heap-label">Min-Heap (Current Candidates)</div>
            <div class="heap-tiles" id="heap-tiles"></div>
        </div>

        <div>
            <div class="ui-label">Merged Result</div>
            <div class="result-tiles" id="result-tiles"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Extracted Min</span>
            <span class="info-value" id="val-min" style="color:var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">From Array</span>
            <span class="info-value" id="val-from" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Heap Size</span>
            <span class="info-value" id="val-size" style="color:var(--accent-purple);">0</span>
        </div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#0f2a1a;border:2px solid #3fb950;border-radius:8px;"></span> Extracted Min</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arrays = [];
        let heap = [];
        let result = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 850, 400];

        const examples = [
            [[[1,4,7], [2,5,8], [3,6,9]]],
            [[[10,20,30], [5,15,25]]]
        ];

        function generateSteps(inputArrays) {
            arrays = inputArrays.map(a => [...a]);
            const k = arrays.length;
            result = [];
            steps = [];
            heap = [];

            steps.push({
                type: 'init',
                heap: [],
                result: [],
                panel: `<b>Merge ${k} Sorted Arrays</b><br>Using Min-Heap`,
                statusText: `Initializing heap with first elements`,
                log: `Arrays: ${JSON.stringify(arrays)}`,
                logColor: 'var(--text-dim)'
            });

            // Initialize heap with first element from each array
            for (let arrIdx = 0; arrIdx < k; arrIdx++) {
                if (arrays[arrIdx].length > 0) {
                    const val = arrays[arrIdx][0];
                    heap.push({val: val, arrIdx: arrIdx, elemIdx: 0});
                }
            }
            // Sort heap by value to simulate min-heap (for visualization)
            heap.sort((a, b) => a.val - b.val);

            steps.push({
                type: 'init-heap',
                heap: [...heap],
                result: [],
                panel: `Initialized heap with first elements from each array`,
                statusText: `Heap ready`,
                log: `Initial heap: ${heap.map(h => h.val).join(', ')}`,
                logColor: 'var(--accent-purple)'
            });

            let totalElements = arrays.reduce((sum, arr) => sum + arr.length, 0);
            let processed = 0;

            while (heap.length > 0) {
                const minItem = heap.shift();
                result.push(minItem.val);
                processed++;

                steps.push({
                    type: 'extract',
                    heap: [...heap],
                    result: [...result],
                    panel: `Extracted min <b>${minItem.val}</b> from array ${minItem.arrIdx}`,
                    statusText: `Extracted ${minItem.val}`,
                    log: `  Extracted ${minItem.val} from array ${minItem.arrIdx}`,
                    logColor: 'var(--accent-green)'
                });

                // Add next element from same array if available
                const nextIdx = minItem.elemIdx + 1;
                if (nextIdx < arrays[minItem.arrIdx].length) {
                    const nextVal = arrays[minItem.arrIdx][nextIdx];
                    heap.push({val: nextVal, arrIdx: minItem.arrIdx, elemIdx: nextIdx});
                    heap.sort((a, b) => a.val - b.val); // re-sort for visualization
                    steps.push({
                        type: 'add',
                        heap: [...heap],
                        result: [...result],
                        panel: `Added next element <b>${nextVal}</b> from array ${minItem.arrIdx}`,
                        statusText: `Added ${nextVal}`,
                        log: `  Added ${nextVal} from array ${minItem.arrIdx}`,
                        logColor: 'var(--accent-blue)'
                    });
                }
            }

            steps.push({
                type: 'final',
                heap: [],
                result: [...result],
                panel: `<b>Final Merged Array:</b> [${result.join(', ')}]`,
                statusText: `Done`,
                log: `\nFinal Result: [${result.join(', ')}]`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderArrays() {
            const container = document.getElementById('arrays-container');
            container.innerHTML = '';
            arrays.forEach((arr, idx) => {
                const arrayDiv = document.createElement('div');
                arrayDiv.className = 'single-array';
                arrayDiv.innerHTML = `<div class="array-label">Array ${idx}</div>`;
                const tilesDiv = document.createElement('div');
                tilesDiv.className = 'array-tiles';
                arr.forEach(val => {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.textContent = val;
                    tilesDiv.appendChild(tile);
                });
                arrayDiv.appendChild(tilesDiv);
                container.appendChild(arrayDiv);
            });
        }

        function renderHeap() {
            const container = document.getElementById('heap-tiles');
            container.innerHTML = '';
            heap.forEach(item => {
                const tile = document.createElement('div');
                tile.className = 'heap-tile';
                tile.innerHTML = `${item.val}<div style="font-size:10px;color:#666;">A${item.arrIdx}</div>`;
                container.appendChild(tile);
            });
        }

        function renderResult() {
            const container = document.getElementById('result-tiles');
            container.innerHTML = '';
            result.forEach(val => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = val;
                container.appendChild(tile);
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            heap = [...step.heap];
            renderArrays();
            renderHeap();
            renderResult();

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-min').innerText = step.type === 'extract' ? step.result[step.result.length - 1] : '—';
            document.getElementById('val-from').innerText = step.type === 'extract' ? `Array ${step.heap.length > 0 ? '...' : '—'}` : '—';
            document.getElementById('val-size').innerText = heap.length;

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const s = steps[k];
                if (s.log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (s.logColor) line.style.color = s.logColor;
                    if (s.bold) line.style.fontWeight = 'bold';
                    line.innerText = s.log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            try {
                const input = document.getElementById('arrays-input').value;
                const parsed = JSON.parse(input);
                if (Array.isArray(parsed)) {
                    generateSteps(parsed);
                    reset();
                }
            } catch(e) {
                alert("Please enter valid arrays like [[1,4,7],[2,5,8],[3,6,9]]");
            }
        }

        function loadExample(idx) {
            document.getElementById('arrays-input').value = JSON.stringify(examples[idx][0]);
            generateSteps(examples[idx][0]);
            reset();
        }

        function init() {
            loadExample(0);
        }

        window.onload = init;
    </script>
</body>
</html>
