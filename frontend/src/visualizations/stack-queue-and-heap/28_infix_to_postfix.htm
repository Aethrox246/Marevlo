<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infix to Postfix - Shunting Yard Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 380px;
            font-size: 15px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 30px; 
            width: 100%; 
            max-width: 980px; 
        }

        .expr-tiles {
            display: flex;
            gap: 6px;
            padding: 20px;
            background: #161b22;
            border: 2px solid var(--accent-blue);
            border-radius: 12px;
            flex-wrap: wrap;
            min-height: 80px;
            align-items: center;
        }
        .tile {
            width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 2px solid var(--border-main); background: #21262d; color: var(--text-main);
        }
        .tile.current { border-color: var(--accent-orange); background: #2a1600; animation: pulse 1.2s infinite; }
        .tile.operand { border-color: var(--accent-green); background: #0f2a1a; }
        .tile.operator { border-color: var(--accent-red); background: #2a0f0f; }

        .stack-container {
            background: #161b22;
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 16px;
            min-width: 280px;
        }
        .stack-label { color: var(--accent-purple); font-weight: bold; margin-bottom: 10px; }
        .stack-box {
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 12px;
            min-height: 260px;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            align-items: center;
        }
        .stack-tile {
            width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 22px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 2px solid var(--accent-purple); background: #1a1f2e; color: var(--accent-purple);
        }

        .postfix-tiles {
            display: flex;
            gap: 6px;
            padding: 20px;
            background: #161b22;
            border: 3px solid var(--accent-green);
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 26px; width: 760px; min-height: 140px;
            font-family: monospace; font-size: 15px; line-height: 1.65;
        }

        .info-panel { margin: 15px 0; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 8px;
            padding: 12px 22px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .status-bar { margin-top: 8px; font-size: 14px; color: var(--text-dim); min-height: 28px; }

        .controls { margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 15px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 14px 18px; width: 760px; max-width: 95%; height: 180px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Infix:</label>
        <input type="text" id="expr-input" value="A+B*C" style="width: 380px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div>
            <div class="ui-label">Infix Expression (Current Token Highlighted)</div>
            <div class="expr-tiles" id="expr-tiles"></div>
        </div>

        <div style="display: flex; gap: 60px; align-items: flex-start;">
            <div class="stack-container">
                <div class="stack-label">Operator Stack</div>
                <div class="stack-box" id="stack-box"></div>
            </div>

            <div>
                <div class="ui-label">Postfix Output (Building)</div>
                <div class="postfix-tiles" id="postfix-tiles"></div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Token</span>
            <span class="info-value" id="val-token" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Stack Top</span>
            <span class="info-value" id="val-stack-top" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Postfix Length</span>
            <span class="info-value" id="val-postfix-len" style="color:var(--accent-green);">0</span>
        </div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#2a1600;border:2px solid #e3b341;border-radius:8px;"></span> Current</div>
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#0f2a1a;border:2px solid #3fb950;border-radius:8px;"></span> Operand</div>
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#2a0f0f;border:2px solid #f85149;border-radius:8px;"></span> Operator</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let expr = "";
        let tokens = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 850, 400];

        const examples = [
            "A+B*C",
            "(A+B)*(C-D)"
        ];

        function generateSteps(inputExpr) {
            expr = inputExpr.replace(/\s+/g, '');
            tokens = expr.split('');
            let stack = [];
            let output = [];
            steps = [];

            steps.push({
                type: 'init',
                stack: [],
                output: [],
                i: 0,
                panel: `<b>Infix → Postfix (Shunting Yard)</b><br>Expression: <b>${expr}</b>`,
                statusText: `Starting conversion`,
                log: `Start: expr = ${expr}`,
                logColor: 'var(--text-dim)'
            });

            let i = 0;
            while (i < tokens.length) {
                const token = tokens[i];
                steps.push({
                    type: 'current',
                    stack: [...stack],
                    output: [...output],
                    i: i,
                    token: token,
                    panel: `Current token: <b>${token}</b>`,
                    statusText: `Processing ${token}`,
                    log: `  Token: ${token}`,
                    logColor: 'var(--accent-orange)'
                });

                if (/[A-Za-z0-9]/.test(token)) {
                    // Operand
                    output.push(token);
                    steps.push({
                        type: 'operand',
                        stack: [...stack],
                        output: [...output],
                        i: i,
                        panel: `Operand <b>${token}</b> → Output`,
                        statusText: `Added operand ${token}`,
                        log: `    Operand → output: ${output.join('')}`,
                        logColor: 'var(--accent-green)'
                    });
                } 
                else if (token === '(') {
                    stack.push(token);
                    steps.push({
                        type: 'push',
                        stack: [...stack],
                        output: [...output],
                        i: i,
                        panel: `Push <b>(</b> to stack`,
                        statusText: `Pushed (`,
                        log: `    Push (`,
                        logColor: 'var(--accent-purple)'
                    });
                } 
                else if (token === ')') {
                    while (stack.length && stack[stack.length-1] !== '(') {
                        output.push(stack.pop());
                        steps.push({
                            type: 'pop',
                            stack: [...stack],
                            output: [...output],
                            i: i,
                            panel: `Pop operator to output`,
                            statusText: `Popped operator`,
                            log: `    Pop → output: ${output.join('')}`,
                            logColor: 'var(--accent-red)'
                        });
                    }
                    if (stack.length) stack.pop(); // discard (
                    steps.push({
                        type: 'paren',
                        stack: [...stack],
                        output: [...output],
                        i: i,
                        panel: `Closing parenthesis - popped until (`,
                        statusText: `Handled )`,
                        log: `    ) processed`,
                        logColor: 'var(--accent-purple)'
                    });
                } 
                else if ('+-*/^'.includes(token)) {
                    while (stack.length && '+-*/^'.includes(stack[stack.length-1])) {
                        const top = stack[stack.length-1];
                        const prec = (op) => op === '^' ? 3 : '*/'.includes(op) ? 2 : 1;
                        const leftAssoc = token !== '^';
                        if (prec(top) > prec(token) || (prec(top) === prec(token) && leftAssoc)) {
                            output.push(stack.pop());
                            steps.push({
                                type: 'pop',
                                stack: [...stack],
                                output: [...output],
                                i: i,
                                panel: `Pop <b>${top}</b> (higher/equal precedence)`,
                                statusText: `Popped ${top}`,
                                log: `    Pop ${top} → ${output.join('')}`,
                                logColor: 'var(--accent-red)'
                            });
                        } else break;
                    }
                    stack.push(token);
                    steps.push({
                        type: 'push',
                        stack: [...stack],
                        output: [...output],
                        i: i,
                        panel: `Push operator <b>${token}</b>`,
                        statusText: `Pushed ${token}`,
                        log: `    Push ${token}`,
                        logColor: 'var(--accent-purple)'
                    });
                }

                i++;
            }

            // Empty remaining stack
            while (stack.length) {
                if (stack[stack.length-1] !== '(') {
                    output.push(stack.pop());
                    steps.push({
                        type: 'pop',
                        stack: [...stack],
                        output: [...output],
                        i: tokens.length,
                        panel: `Pop remaining operator`,
                        statusText: `Final pop`,
                        log: `    Pop remaining → ${output.join('')}`,
                        logColor: 'var(--accent-red)'
                    });
                } else {
                    stack.pop();
                }
            }

            steps.push({
                type: 'final',
                stack: [],
                output: [...output],
                i: tokens.length,
                panel: `<b>Final Postfix: <span style="color:var(--accent-green)">${output.join('')}</span></b>`,
                statusText: `Conversion complete`,
                log: `\nFinal Postfix: ${output.join('')}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderExpr(currentI) {
            const container = document.getElementById('expr-tiles');
            container.innerHTML = '';
            tokens.forEach((ch, idx) => {
                const tile = document.createElement('div');
                tile.className = `tile ${idx === currentI ? 'current' : ''} ${/[A-Za-z0-9]/.test(ch) ? 'operand' : (ch === '(' || ch === ')' ? '' : 'operator')}`;
                tile.textContent = ch;
                container.appendChild(tile);
            });
        }

        function renderStack(stack) {
            const container = document.getElementById('stack-box');
            container.innerHTML = '';
            for (let i = stack.length - 1; i >= 0; i--) {
                const tile = document.createElement('div');
                tile.className = 'stack-tile';
                tile.textContent = stack[i];
                container.appendChild(tile);
            }
        }

        function renderPostfix(output) {
            const container = document.getElementById('postfix-tiles');
            container.innerHTML = '';
            output.forEach(ch => {
                const tile = document.createElement('div');
                tile.className = `tile ${/[A-Za-z0-9]/.test(ch) ? 'operand' : 'operator'}`;
                tile.textContent = ch;
                container.appendChild(tile);
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderExpr(step.i);
            renderStack(step.stack);
            renderPostfix(step.output);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-token').innerText = step.token || '—';
            document.getElementById('val-stack-top').innerText = step.stack.length ? step.stack[step.stack.length-1] : '—';
            document.getElementById('val-postfix-len').innerText = step.output.length;

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const s = steps[k];
                if (s.log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (s.logColor) line.style.color = s.logColor;
                    if (s.bold) line.style.fontWeight = 'bold';
                    line.innerText = s.log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            const input = document.getElementById('expr-input').value.trim();
            if (input) {
                generateSteps(input);
                reset();
            }
        }

        function loadExample(idx) {
            document.getElementById('expr-input').value = examples[idx];
            generateSteps(examples[idx]);
            reset();
        }

        function init() {
            loadExample(0);
        }

        window.onload = init;
    </script>
</body>
</html>
