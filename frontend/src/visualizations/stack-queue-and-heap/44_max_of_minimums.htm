<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max of Minimums - Monotonic Stack Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 10px 0; }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .array-container {
            background: var(--bg-surface);
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
        }
        .array-label { color: var(--accent-purple); text-align: center; margin-bottom: 12px; font-weight: bold; }
        .array {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 16px;
            background: #21262d;
            border-radius: 10px;
        }
        .tile {
            background: #2d333b;
            border: 2px solid var(--accent-blue);
            padding: 12px 18px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            min-width: 50px;
            text-align: center;
        }
        .tile.current { border-color: var(--accent-orange); box-shadow: 0 0 0 4px rgba(227,179,65,0.4); }

        .result-container {
            background: var(--bg-surface);
            border: 3px solid var(--accent-green);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
        }
        .result-label { color: var(--accent-green); text-align: center; margin-bottom: 12px; font-weight: bold; }
        .result {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            min-height: 140px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.65;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px 20px;
            width: 100%;
            max-width: 900px;
            height: 220px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Max of Minimums for All Window Sizes</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">Monotonic Stack O(n) • Next Smaller Element</p>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetSim()">Reset</button>
    </div>

    <div class="array-container">
        <div class="array-label">Input Array</div>
        <div class="array" id="array-vis"></div>
    </div>

    <div class="result-container">
        <div class="result-label">Result [max of mins for k=1 to n]</div>
        <div class="result" id="result-vis"></div>
    </div>

    <div class="action-panel" id="action">Click an example to start</div>

    <div class="controls">
        <button onclick="prevStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [];
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1600, 850, 420];

        const examples = [
            [3, 1, 2, 4],
            [5, 3, 2, 6, 1]
        ];

        function nextSmallerLeft(arr) {
            const n = arr.length;
            const left = new Array(n).fill(-1);
            const stack = [];
            for (let i = 0; i < n; i++) {
                while (stack.length && arr[stack[stack.length-1]] >= arr[i]) {
                    stack.pop();
                }
                left[i] = stack.length ? stack[stack.length-1] : -1;
                stack.push(i);
            }
            return left;
        }

        function nextSmallerRight(arr) {
            const n = arr.length;
            const right = new Array(n).fill(n);
            const stack = [];
            for (let i = n-1; i >= 0; i--) {
                while (stack.length && arr[stack[stack.length-1]] >= arr[i]) {
                    stack.pop();
                }
                right[i] = stack.length ? stack[stack.length-1] : n;
                stack.push(i);
            }
            return right;
        }

        function generateSteps(inputArr) {
            arr = [...inputArr];
            const n = arr.length;
            steps = [];

            steps.push({
                panel: `<b>Start</b><br>Array = [${arr}]`,
                log: `Initialize with array of length ${n}`,
                array: [...arr],
                result: new Array(n).fill(0),
                highlight: []
            });

            const left = nextSmallerLeft(arr);
            const right = nextSmallerRight(arr);

            steps.push({
                panel: `Computed left boundaries: [${left}]<br>right boundaries: [${right}]`,
                log: `Next smaller left and right computed`,
                array: [...arr],
                result: new Array(n).fill(0),
                highlight: []
            });

            const ans = new Array(n+1).fill(0);
            for (let i = 0; i < n; i++) {
                const windowSize = right[i] - left[i] - 1;
                ans[windowSize] = Math.max(ans[windowSize], arr[i]);
            }

            steps.push({
                panel: `Raw ans before propagation: [${ans.slice(1)}]`,
                log: `Updated ans for window sizes`,
                array: [...arr],
                result: [...ans.slice(1)],
                highlight: []
            });

            // Propagation
            for (let i = n-1; i >= 1; i--) {
                ans[i] = Math.max(ans[i], ans[i+1]);
            }

            steps.push({
                panel: `<b>Final Result:</b> [${ans.slice(1)}]`,
                log: `Propagation complete`,
                array: [...arr],
                result: [...ans.slice(1)],
                highlight: []
            });
        }

        function renderArray(highlight = []) {
            const container = document.getElementById('array-vis');
            container.innerHTML = '';
            arr.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                if (highlight.includes(i)) tile.classList.add('current');
                tile.textContent = val;
                container.appendChild(tile);
            });
        }

        function renderResult(res) {
            const container = document.getElementById('result-vis');
            container.innerHTML = '';
            res.forEach((val, k) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.style.borderColor = 'var(--accent-green)';
                tile.textContent = `${k+1}: ${val}`;
                container.appendChild(tile);
            });
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('action').innerHTML = step.panel || '—';
            renderArray(step.highlight || []);
            renderResult(step.result || []);

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx+1).map(s => 
                `<div style="margin:5px 0;">${s.log}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            generateSteps(examples[n]);
            resetSim();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
