<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Greater Element - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 260px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; max-width: 1000px; }
        
        .array-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .array-tiles {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 15px;
            background: #161b22;
            border: 2px solid var(--border-main);
            border-radius: 10px;
        }
        .tile {
            width: 58px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 18px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.4s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
            position: relative;
        }
        .tile .index { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
        .tile.current { border-color: var(--accent-orange); background: #2a1600; transform: scale(1.12); box-shadow: 0 0 15px rgba(227,179,65,0.5); }
        .tile.greater { border-color: var(--accent-green); background: #0f2a1a; }
        .tile.processed { opacity: 0.7; }

        .stack-container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
        }
        .stack-box {
            background: #161b22;
            border: 2px solid var(--accent-purple);
            border-radius: 8px;
            padding: 12px 8px;
            min-width: 80px;
            text-align: center;
        }
        .stack-label { color: var(--accent-purple); font-size: 13px; margin-bottom: 8px; }
        .stack-tiles { display: flex; flex-direction: column; gap: 6px; align-items: center; }
        .stack-tile {
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            background: #21262d; border: 2px solid var(--accent-purple); border-radius: 6px;
            font-size: 16px; font-weight: bold; color: var(--accent-purple);
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 24px; width: 780px; min-height: 130px;
            font-family: monospace; font-size: 15px; line-height: 1.6;
        }

        .result-wrapper {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .result-tiles { display: flex; gap: 10px; }

        .info-panel { margin: 15px 0; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .status-bar { margin-top: 8px; font-size: 13.5px; color: var(--text-dim); min-height: 24px; text-align: center; }

        .controls { margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 15px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 14px 18px; width: 780px; max-width: 95%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Array:</label>
        <input type="text" id="arr-input" placeholder="[4, 5, 2, 25]" value="[4, 5, 2, 25]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="array-wrapper">
            <div class="ui-label">Input Array</div>
            <div class="array-tiles" id="input-tiles"></div>
        </div>

        <div class="stack-container">
            <div>
                <div class="stack-label">Monotonic Stack (Decreasing)</div>
                <div class="stack-box" id="stack-box">
                    <div class="stack-tiles" id="stack-tiles"></div>
                </div>
            </div>
            <div class="result-wrapper">
                <div class="ui-label">Result</div>
                <div class="result-tiles" id="result-tiles"></div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Index</span>
            <span class="info-value" id="val-i" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Value</span>
            <span class="info-value" id="val-val" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Stack Top</span>
            <span class="info-value" id="val-top" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Next Greater</span>
            <span class="info-value" id="val-ng" style="color:var(--accent-green);">—</span>
        </div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:#2a1600;border:2px solid #e3b341;border-radius:6px;"></span> Current</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:#0f2a1a;border:2px solid #3fb950;border-radius:6px;"></span> Found Greater</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:#21262d;border:2px solid #a371f7;border-radius:6px;"></span> Stack</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [];
        let result = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        const examples = [
            [4, 5, 2, 25],
            [13, 7, 6, 12]
        ];

        function generateSteps(inputArr) {
            arr = [...inputArr];
            const n = arr.length;
            result = new Array(n).fill(-1);
            steps = [];

            let stack = []; // stores indices

            // Initial step
            steps.push({
                type: 'init',
                i: -1,
                stack: [],
                result: [...result],
                panel: `<b>Next Greater Element</b><br>Using Monotonic Decreasing Stack (O(n))`,
                statusText: `Processing array: [${arr.join(', ')}]`,
                log: `Start: arr = [${arr.join(', ')}]\nresult = [${result.join(', ')}]\nstack = []`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n; i++) {
                const current = arr[i];

                steps.push({
                    type: 'current',
                    i: i,
                    stack: [...stack],
                    result: [...result],
                    panel: `Processing index <b>${i}</b> (value = <b>${current}</b>)`,
                    statusText: `Current = ${current}`,
                    log: `\n--- i = ${i}, val = ${current} ---`,
                    logColor: 'var(--accent-orange)'
                });

                // While loop pops
                while (stack.length > 0 && arr[stack[stack.length-1]] < current) {
                    const topIdx = stack.pop();
                    result[topIdx] = current;

                    steps.push({
                        type: 'pop',
                        i: i,
                        stack: [...stack],
                        result: [...result],
                        panel: `Pop index <b>${topIdx}</b> (val=${arr[topIdx]}) ← ${current} is greater`,
                        statusText: `Assigned result[${topIdx}] = ${current}`,
                        log: `  Pop ${topIdx} (${arr[topIdx]}) → result[${topIdx}] = ${current}`,
                        logColor: 'var(--accent-green)'
                    });
                }

                // Push current index
                stack.push(i);
                steps.push({
                    type: 'push',
                    i: i,
                    stack: [...stack],
                    result: [...result],
                    panel: `Push index <b>${i}</b> onto stack`,
                    statusText: `Pushed ${i}`,
                    log: `  Push index ${i}`,
                    logColor: 'var(--accent-purple)'
                });
            }

            // Remaining in stack have no greater element
            steps.push({
                type: 'final',
                i: n,
                stack: [...stack],
                result: [...result],
                panel: `Processing complete.<br>Elements left in stack have no next greater element.`,
                statusText: `Finalizing remaining elements`,
                log: `\nFinal cleanup: remaining stack indices get -1`,
                logColor: 'var(--text-dim)'
            });

            for (let idx of stack) {
                result[idx] = -1;
            }

            steps[steps.length-1].result = [...result];

            steps.push({
                type: 'done',
                i: n,
                stack: [],
                result: [...result],
                panel: `<b>Result:</b> [${result.join(', ')}]`,
                statusText: `Done!`,
                log: `\nFinal Result: [${result.join(', ')}]`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderTiles(containerId, values, highlightIdx = -1, resultMode = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            values.forEach((val, idx) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `${val}<div class="index">${idx}</div>`;
                
                if (idx === highlightIdx) tile.classList.add('current');
                if (resultMode && val !== -1) tile.classList.add('greater');
                
                container.appendChild(tile);
            });
        }

        function renderStack(stackIndices) {
            const container = document.getElementById('stack-tiles');
            container.innerHTML = '';
            // Show from bottom to top (top of stack last)
            for (let i = stackIndices.length - 1; i >= 0; i--) {
                const idx = stackIndices[i];
                const tile = document.createElement('div');
                tile.className = 'stack-tile';
                tile.textContent = arr[idx];
                container.appendChild(tile);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Input array
            renderTiles('input-tiles', arr, step.i);

            // Result
            renderTiles('result-tiles', step.result, -1, true);

            // Stack
            renderStack(step.stack);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-i').innerText = step.i >= 0 ? step.i : '—';
            document.getElementById('val-val').innerText = step.i >= 0 ? arr[step.i] : '—';
            document.getElementById('val-top').innerText = step.stack.length ? arr[step.stack[step.stack.length-1]] : '—';
            document.getElementById('val-ng').innerText = step.result && step.i >= 0 && step.i < step.result.length ? step.result[step.i] : '—';

            document.getElementById('status-text').innerText = step.statusText || '';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const s = steps[k];
                if (s.log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (s.logColor) line.style.color = s.logColor;
                    if (s.bold) line.style.fontWeight = 'bold';
                    line.innerText = s.log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            const inputStr = document.getElementById('arr-input').value;
            try {
                const parsed = JSON.parse(inputStr.replace(/'/g, '"'));
                if (Array.isArray(parsed)) {
                    generateSteps(parsed);
                    reset();
                }
            } catch(e) {
                alert("Please enter a valid array like [4, 5, 2, 25]");
            }
        }

        function loadExample(exIdx) {
            document.getElementById('arr-input').value = JSON.stringify(examples[exIdx]);
            generateSteps(examples[exIdx]);
            reset();
        }

        function init() {
            loadExample(0);
        }

        window.onload = init;
    </script>
</body>
</html>
