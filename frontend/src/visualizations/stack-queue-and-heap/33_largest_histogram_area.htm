<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest Rectangle in Histogram - Stack Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 380px;
            font-size: 14px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 30px; 
            width: 100%; 
            max-width: 1100px; 
        }

        .histogram {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            padding: 20px;
            background: #161b22;
            border: 3px solid var(--accent-blue);
            border-radius: 12px;
            min-height: 300px;
        }
        .bar {
            width: 42px;
            background: linear-gradient(#58a6ff, #1f6feb);
            border-radius: 4px 4px 0 0;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .bar.current { background: var(--accent-orange); }

        .stack-container {
            background: #161b22;
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 16px;
            min-width: 380px;
        }
        .stack-label { color: var(--accent-purple); font-weight: bold; margin-bottom: 10px; text-align: center; }
        .stack-box {
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 12px;
            min-height: 240px;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            align-items: center;
        }
        .stack-tile {
            width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 2px solid var(--accent-purple); background: #1a1f2e; color: var(--accent-purple);
        }

        .area-display {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-green);
            background: #161b22;
            border: 3px solid var(--accent-green);
            border-radius: 12px;
            padding: 20px 50px;
            min-width: 200px;
            text-align: center;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 26px; width: 780px; min-height: 150px;
            font-family: monospace; font-size: 15px; line-height: 1.65;
        }

        .info-panel { margin: 15px 0; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 8px;
            padding: 12px 22px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .status-bar { margin-top: 8px; font-size: 14px; color: var(--text-dim); min-height: 28px; }

        .controls { margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 160px; }

        .legend { margin-top: 15px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 14px 18px; width: 780px; max-width: 95%; height: 190px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }

        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Heights:</label>
        <input type="text" id="heights-input" value="[2,1,5,6,2,3]" style="width: 380px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div>
            <div class="ui-label">Histogram Bars</div>
            <div class="histogram" id="histogram"></div>
        </div>

        <div style="display: flex; gap: 60px; align-items: flex-start;">
            <div class="stack-container">
                <div class="stack-label">Monotonic Stack (Indices)</div>
                <div class="stack-box" id="stack-box"></div>
            </div>
        </div>

        <div class="area-display" id="area-display">Max Area: 0</div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Bar</span>
            <span class="info-value" id="current-bar" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max Area</span>
            <span class="info-value" id="max-area" style="color:var(--accent-green);">0</span>
        </div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#2a1600;border:2px solid #e3b341;border-radius:8px;"></span> Current Bar</div>
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#1a1f2e;border:2px solid #a371f7;border-radius:8px;"></span> Stack Bar</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let heights = [];
        let stack = [];
        let maxArea = 0;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 850, 400];

        const examples = [
            [2,1,5,6,2,3],
            [1,2,3,4,5]
        ];

        function generateSteps(inputHeights) {
            heights = [...inputHeights];
            stack = [];
            maxArea = 0;
            steps = [];

            steps.push({
                type: 'init',
                heights: [...heights],
                stack: [],
                maxArea: 0,
                panel: `<b>Largest Rectangle in Histogram</b><br>Input: [${heights.join(', ')}]`,
                statusText: `Start`,
                log: `Start`,
                logColor: 'var(--text-dim)'
            });

            const n = heights.length;
            const tempStack = [];

            for (let i = 0; i <= n; i++) {
                const currHeight = (i === n) ? 0 : heights[i];

                steps.push({
                    type: 'current',
                    heights: [...heights],
                    stack: [...tempStack],
                    i: i,
                    currHeight: currHeight,
                    panel: `Processing bar <b>${i < n ? i : 'end'}</b> height <b>${currHeight}</b>`,
                    statusText: `Bar ${i}`,
                    log: `  i=${i}, height=${currHeight}`,
                    logColor: 'var(--accent-orange)'
                });

                while (tempStack.length && currHeight < heights[tempStack[tempStack.length-1]]) {
                    const top = tempStack.pop();
                    const h = heights[top];
                    const left = tempStack.length ? tempStack[tempStack.length-1] : -1;
                    const width = i - left - 1;
                    const area = h * width;
                    if (area > maxArea) maxArea = area;

                    steps.push({
                        type: 'pop',
                        heights: [...heights],
                        stack: [...tempStack],
                        i: i,
                        popped: top,
                        area: area,
                        maxArea: maxArea,
                        panel: `Popped bar <b>${top}</b> (height ${h}), area = ${area}`,
                        statusText: `Area ${area}`,
                        log: `    Pop ${top} (h=${h}), width=${width}, area=${area}`,
                        logColor: 'var(--accent-red)'
                    });
                }

                tempStack.push(i);
                steps.push({
                    type: 'push',
                    heights: [...heights],
                    stack: [...tempStack],
                    i: i,
                    panel: `Pushed bar <b>${i}</b>`,
                    statusText: `Push ${i}`,
                    log: `  Push ${i}`,
                    logColor: 'var(--accent-purple)'
                });
            }

            steps.push({
                type: 'final',
                heights: [...heights],
                stack: [],
                maxArea: maxArea,
                panel: `<b>Final Max Area: <span style="color:var(--accent-green)">${maxArea}</span></b>`,
                statusText: `Done`,
                log: `\nFinal Max Area: ${maxArea}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderHistogram(currentI) {
            const container = document.getElementById('histogram');
            container.innerHTML = '';
            const maxH = Math.max(...heights);
            heights.forEach((h, idx) => {
                const bar = document.createElement('div');
                bar.className = `bar ${idx === currentI ? 'current' : ''}`;
                bar.style.height = `${(h / maxH) * 250 + 30}px`;
                bar.textContent = h;
                container.appendChild(bar);
            });
        }

        function renderStack() {
            const container = document.getElementById('stack-box');
            container.innerHTML = '';
            for (let i = stack.length - 1; i >= 0; i--) {
                const idx = stack[i];
                const tile = document.createElement('div');
                tile.className = 'stack-tile';
                tile.textContent = idx;
                container.appendChild(tile);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            stack = [...step.stack];
            renderHistogram(step.i !== undefined ? step.i : -1);
            renderStack();

            document.getElementById('area-display').innerText = `Max Area: ${step.maxArea}`;
            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const s = steps[k];
                if (s.log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (s.logColor) line.style.color = s.logColor;
                    if (s.bold) line.style.fontWeight = 'bold';
                    line.innerText = s.log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            try {
                const input = document.getElementById('heights-input').value;
                const parsed = JSON.parse(input);
                if (Array.isArray(parsed)) {
                    generateSteps(parsed);
                    reset();
                }
            } catch(e) {
                alert("Please enter valid array like [2,1,5,6,2,3]");
            }
        }

        function loadExample(idx) {
            document.getElementById('heights-input').value = JSON.stringify(examples[idx]);
            generateSteps(examples[idx]);
            reset();
        }

        function init() {
            loadExample(0);
        }

        window.onload = init;
    </script>
</body>
</html>
