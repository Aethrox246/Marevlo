<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Smaller Element - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 280px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; max-width: 1000px; }

        .array-tiles {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            background: #161b22;
            border: 2px solid var(--border-main);
            border-radius: 12px;
        }
        .tile {
            width: 62px; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 2px solid var(--border-main); background: #21262d; color: var(--text-main);
            transition: all 0.4s ease;
        }
        .tile.current { border-color: var(--accent-orange); background: #2a1600; transform: scale(1.12); }
        .tile.smaller { border-color: var(--accent-green); background: #0f2a1a; }

        .stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-label { color: var(--accent-purple); font-weight: bold; }
        .stack-box {
            background: #161b22;
            border: 2px solid var(--accent-purple);
            border-radius: 10px;
            padding: 12px;
            min-height: 260px;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            align-items: center;
        }
        .stack-tile {
            width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
            background: #21262d; border: 2px solid var(--accent-purple); border-radius: 8px;
            font-size: 18px; font-weight: bold; color: var(--accent-purple);
        }

        .result-tiles {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #161b22;
            border: 2px solid var(--accent-green);
            border-radius: 10px;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 26px; width: 760px; min-height: 130px;
            font-family: monospace; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin: 15px 0; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 8px;
            padding: 12px 22px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .status-bar { margin-top: 8px; font-size: 14px; color: var(--text-dim); min-height: 28px; }

        .controls { margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 15px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 14px 18px; width: 760px; max-width: 95%; height: 180px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Array:</label>
        <input type="text" id="arr-input" value="[4, 5, 2, 10, 8]" style="width: 280px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div>
            <div class="ui-label">Input Array</div>
            <div class="array-tiles" id="input-tiles"></div>
        </div>

        <div style="display:flex; gap:60px; align-items:flex-start;">
            <div class="stack-container">
                <div class="stack-label">Monotonic Stack</div>
                <div class="stack-box" id="stack-box"></div>
            </div>

            <div>
                <div class="ui-label">Result</div>
                <div class="result-tiles" id="result-tiles"></div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Index</span>
            <span class="info-value" id="val-i" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Value</span>
            <span class="info-value" id="val-val" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Previous Smaller</span>
            <span class="info-value" id="val-ps" style="color:var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Stack Top</span>
            <span class="info-value" id="val-top" style="color:var(--accent-purple);">—</span>
        </div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#2a1600;border:2px solid #e3b341;border-radius:8px;"></span> Current</div>
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#0f2a1a;border:2px solid #3fb950;border-radius:8px;"></span> Found Smaller</div>
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#21262d;border:2px solid #a371f7;border-radius:8px;"></span> Stack</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [];
        let result = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1450, 750, 350];

        const examples = [
            [4, 5, 2, 10, 8],
            [1, 3, 0, 2, 5]
        ];

        function generateSteps(inputArr) {
            arr = [...inputArr];
            const n = arr.length;
            result = new Array(n).fill(-1);
            steps = [];
            let stack = []; // stores indices

            steps.push({
                type: 'init',
                i: -1,
                stack: [],
                result: [...result],
                panel: `<b>Previous Smaller Element</b><br>Using Monotonic Stack (O(n))`,
                statusText: `Processing array [${arr.join(', ')}]`,
                log: `Start: arr = [${arr.join(', ')}]`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n; i++) {
                const current = arr[i];

                steps.push({
                    type: 'current',
                    i: i,
                    stack: [...stack],
                    result: [...result],
                    panel: `Processing index <b>${i}</b> (value = <b>${current}</b>)`,
                    statusText: `Current = ${current}`,
                    log: `\n→ i = ${i}, val = ${current}`,
                    logColor: 'var(--accent-orange)'
                });

                // Pop elements that are >= current
                while (stack.length > 0 && arr[stack[stack.length - 1]] >= current) {
                    const popped = stack.pop();
                    steps.push({
                        type: 'pop',
                        i: i,
                        stack: [...stack],
                        result: [...result],
                        panel: `Pop index <b>${popped}</b> (val=${arr[popped]}) ≥ ${current}`,
                        statusText: `Popped ${arr[popped]}`,
                        log: `  Pop ${arr[popped]} (≥ ${current})`,
                        logColor: 'var(--accent-red)'
                    });
                }

                // Set result
                if (stack.length > 0) {
                    result[i] = arr[stack[stack.length - 1]];
                    steps.push({
                        type: 'assign',
                        i: i,
                        stack: [...stack],
                        result: [...result],
                        panel: `Previous smaller = <b>${result[i]}</b> (index ${stack[stack.length-1]})`,
                        statusText: `Previous smaller = ${result[i]}`,
                        log: `  Previous smaller = ${result[i]}`,
                        logColor: 'var(--accent-green)'
                    });
                } else {
                    steps.push({
                        type: 'assign',
                        i: i,
                        stack: [...stack],
                        result: [...result],
                        panel: `No previous smaller element → <b>-1</b>`,
                        statusText: `No smaller`,
                        log: `  No previous smaller → -1`,
                        logColor: 'var(--accent-red)'
                    });
                }

                // Push current index
                stack.push(i);
                steps.push({
                    type: 'push',
                    i: i,
                    stack: [...stack],
                    result: [...result],
                    panel: `Push index <b>${i}</b> (val=${current}) to stack`,
                    statusText: `Pushed ${i}`,
                    log: `  Push index ${i}`,
                    logColor: 'var(--accent-purple)'
                });
            }

            steps.push({
                type: 'final',
                i: n,
                stack: [...stack],
                result: [...result],
                panel: `<b>Final Result:</b> [${result.join(', ')}]`,
                statusText: `Done`,
                log: `\nFinal Result: [${result.join(', ')}]`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderArray(containerId, values, highlightIdx = -1, isResult = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            values.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = `tile ${i === highlightIdx ? 'current' : ''} ${isResult && val !== -1 ? 'smaller' : ''}`;
                tile.innerHTML = `${val}<div style="font-size:10px;color:#666;margin-top:4px">${i}</div>`;
                container.appendChild(tile);
            });
        }

        function renderStack(stackIndices) {
            const container = document.getElementById('stack-box');
            container.innerHTML = '';
            // Show from bottom to top
            for (let i = stackIndices.length - 1; i >= 0; i--) {
                const idx = stackIndices[i];
                const tile = document.createElement('div');
                tile.className = 'stack-tile';
                tile.textContent = arr[idx];
                container.appendChild(tile);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderArray('input-tiles', arr, step.i);
            renderArray('result-tiles', step.result, -1, true);
            renderStack(step.stack);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-i').innerText = step.i >= 0 ? step.i : '—';
            document.getElementById('val-val').innerText = step.i >= 0 ? arr[step.i] : '—';
            document.getElementById('val-ps').innerText = step.i >= 0 && step.result[step.i] !== undefined ? step.result[step.i] : '—';
            document.getElementById('val-top').innerText = step.stack.length ? arr[step.stack[step.stack.length-1]] : '—';

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const s = steps[k];
                if (s.log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (s.logColor) line.style.color = s.logColor;
                    if (s.bold) line.style.fontWeight = 'bold';
                    line.innerText = s.log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            try {
                const input = document.getElementById('arr-input').value;
                const parsed = JSON.parse(input.replace(/'/g, '"'));
                if (Array.isArray(parsed)) {
                    generateSteps(parsed);
                    reset();
                }
            } catch(e) {
                alert("Please enter valid array like [4, 5, 2, 10, 8]");
            }
        }

        function loadExample(idx) {
            document.getElementById('arr-input').value = JSON.stringify(examples[idx]);
            generateSteps(examples[idx]);
            reset();
        }

        function init() {
            loadExample(0);
        }

        window.onload = init;
    </script>
</body>
</html>
