<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smallest Range from K Lists</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-orange: #e3b341;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 8px 0; }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .viz {
            background: var(--bg-surface);
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .merged {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 20px;
            background: #21262d;
            border-radius: 10px;
            min-height: 110px;
        }

        .tile {
            padding: 12px 18px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 17px;
            min-width: 52px;
            text-align: center;
            position: relative;
            transition: all 0.25s;
            border: 2px solid #555;
        }

        .tile.list0 { border-color: #ff7b72; background: #3b1f1f; }
        .tile.list1 { border-color: #79c0ff; background: #1f2a3b; }
        .tile.list2 { border-color: #a5d6ff; background: #1f2a3b; }
        .tile.list3 { border-color: #ffdd6b; background: #3b2f1f; }

        .tile.current { 
            border-color: var(--accent-green); 
            transform: scale(1.12); 
            box-shadow: 0 0 12px var(--accent-green); 
        }

        .window {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: var(--accent-orange);
            white-space: nowrap;
        }

        .info {
            text-align: center;
            margin: 16px 0;
            font-family: monospace;
            line-height: 1.6;
        }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 18px;
            width: 100%;
            max-width: 1000px;
            min-height: 130px;
            margin: 20px 0;
            font-family: monospace;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px;
            width: 100%;
            max-width: 1000px;
            height: 240px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        .best {
            color: var(--accent-green);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Smallest Range Covering K Lists</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">Merge + Sliding Window Approach</p>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetSim()">Reset</button>
    </div>

    <div class="viz">
        <div style="text-align:center;margin-bottom:8px;color:var(--accent-purple);font-weight:bold;">Merged &amp; Sorted Array (color = list index)</div>
        <div class="merged" id="merged-vis"></div>
        
        <div class="info" id="info">
            Best Range: <span id="best-range" class="best">[∞, -∞]</span> | 
            Current Window: <span id="curr-range">[?, ?]</span> | 
            Covered Lists: <span id="covered">0</span>/<span id="total-lists">3</span>
        </div>
    </div>

    <div class="action-panel" id="action">Click an example to start</div>

    <div class="controls">
        <button onclick="prevStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1" style="width:140px"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let lists = [];
        let merged = [];
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1600, 850, 380];

        const examples = [
            [[4,10,15,24,26], [0,9,12,20], [5,18,22,30]],
            [[1,2,3], [1,2,3]]
        ];

        function generateSteps(inputLists) {
            lists = inputLists.map(l => [...l]);
            const k = lists.length;
            
            // Merge with indices
            merged = [];
            for (let i = 0; i < k; i++) {
                for (let val of lists[i]) {
                    merged.push({val: val, list: i});
                }
            }
            merged.sort((a,b) => a.val - b.val);

            steps = [];
            let left = 0;
            let freq = new Array(k).fill(0);
            let count = 0;
            let bestL = Infinity, bestR = -Infinity;
            let bestRange = Infinity;

            steps.push({
                panel: `<b>Step 0: Merged &amp; Sorted</b><br>${merged.map(m=>m.val).join(', ')}`,
                log: `Merged ${merged.length} elements`,
                merged: [...merged],
                left: 0,
                right: -1,
                best: [bestL, bestR],
                covered: 0
            });

            for (let right = 0; right < merged.length; right++) {
                const idx = merged[right].list;
                freq[idx]++;
                if (freq[idx] === 1) count++;

                while (count === k && left <= right) {
                    const currMin = merged[left].val;
                    const currMax = merged[right].val;
                    const currRange = currMax - currMin;

                    if (currRange < bestRange) {
                        bestRange = currRange;
                        bestL = currMin;
                        bestR = currMax;
                    }

                    // Record step
                    steps.push({
                        panel: `<b>Window [${left},${right}]</b><br>Range [${currMin},${currMax}] = ${currRange}<br><span class="best">Best so far: [${bestL},${bestR}]</span>`,
                        log: `Valid window [${currMin},${currMax}] → range ${currRange}`,
                        merged: [...merged],
                        left: left,
                        right: right,
                        best: [bestL, bestR],
                        covered: count
                    });

                    // Shrink from left
                    const leftIdx = merged[left].list;
                    freq[leftIdx]--;
                    if (freq[leftIdx] === 0) count--;
                    left++;
                }

                // Also record every right expansion
                if (count < k) {
                    steps.push({
                        panel: `Right = ${right} (val=${merged[right].val}, list=${merged[right].list})<br>Covered: ${count}/${k}`,
                        log: `Added ${merged[right].val} from list ${merged[right].list}`,
                        merged: [...merged],
                        left: left,
                        right: right,
                        best: [bestL, bestR],
                        covered: count
                    });
                }
            }

            // Final step
            steps.push({
                panel: `<b>FINAL RESULT</b><br>Smallest Range = <span class="best">[${bestL}, ${bestR}]</span>`,
                log: `Answer: [${bestL}, ${bestR}]`,
                merged: [...merged],
                left: left,
                right: merged.length-1,
                best: [bestL, bestR],
                covered: k
            });
        }

        function renderMerged(m, left, right, best) {
            const container = document.getElementById('merged-vis');
            container.innerHTML = '';
            
            m.forEach((item, i) => {
                const tile = document.createElement('div');
                tile.className = `tile list${item.list}`;
                tile.textContent = item.val;
                
                if (i >= left && i <= right) {
                    tile.classList.add('current');
                }
                container.appendChild(tile);
            });

            document.getElementById('best-range').textContent = best[0] === Infinity ? '[∞, -∞]' : `[${best[0]}, ${best[1]}]`;
            document.getElementById('curr-range').textContent = left <= right ? `[${m[left].val}, ${m[right].val}]` : '[?, ?]';
            document.getElementById('covered').textContent = '—';
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('action').innerHTML = step.panel || '—';
            renderMerged(step.merged, step.left, step.right, step.best);

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx+1).map((s, i) => 
                `<div style="margin:4px 0;opacity:${i===idx?1:0.7}">${s.log}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[parseInt(document.getElementById('speed').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            generateSteps(examples[n]);
            resetSim();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
