<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Median of Data Stream</title>

<style>

:root{
    --bg-page:#000000;
    --bg-surface:#161b22;
    --border-main:#30363d;

    --btn-bg:#21262d;
    --btn-hover:#2d333b;

    --text-main:#c9d1d9;
    --text-dim:#8b949e;

    --accent-purple:#a371f7;
    --accent-blue:#388bfd;
    --accent-green:#3fb950;
    --accent-orange:#e3b341;
}

*{
    box-sizing:border-box;
}

body{
    background-color:var(--bg-page);

    color:var(--text-main);

    font-family:system-ui,-apple-system,sans-serif;

    margin:0;

    padding:20px 0;

    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:var(--accent-purple);

    margin:0 0 8px 0;
}

.input-bar{

    width:100%;

    max-width:1100px;

    background:var(--bg-surface);

    padding:12px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    justify-content:center;

    border-bottom:1px solid var(--border-main);

    margin-bottom:20px;
}

button{

    padding:8px 16px;

    background:var(--btn-bg);

    border:1px solid var(--border-main);

    color:var(--text-main);

    border-radius:6px;

    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.viz{

    display:flex;

    gap:40px;

    width:100%;

    max-width:1100px;

    flex-wrap:wrap;

    justify-content:center;
}

.stream{

    text-align:center;
}

.label{

    color:var(--accent-purple);

    font-weight:bold;

    margin-bottom:8px;
}

.stream-list{

    display:flex;

    gap:6px;

    padding:12px;

    background:#21262d;

    border-radius:10px;
}

.tile{

    padding:12px 18px;

    border-radius:8px;

    font-family:monospace;

    font-size:17px;

    min-width:52px;

    text-align:center;

    border:2px solid var(--accent-orange);

    transition:all 0.3s;
}

.heap-container{

    text-align:center;
}

.heap-label{

    margin-bottom:8px;

    color:var(--accent-purple);

    font-weight:bold;
}

.heap{

    background:#21262d;

    border:3px solid var(--accent-blue);

    border-radius:12px;

    padding:16px;

    min-height:320px;

    width:150px;

    display:flex;

    flex-direction:column-reverse;

    gap:6px;

    align-items:center;
}

.info{

    margin:20px 0;

    text-align:center;

    font-family:monospace;

    font-size:18px;

    line-height:1.6;
}

.action-panel{

    background:var(--bg-surface);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:18px;

    width:100%;

    max-width:1000px;

    min-height:140px;

    margin:20px 0;

    font-family:monospace;
}

.controls{

    margin:20px 0;

    display:flex;

    align-items:center;

    gap:16px;

    flex-wrap:wrap;

    justify-content:center;
}

.log-panel{

    background:var(--bg-page);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:16px;

    width:100%;

    max-width:1000px;

    height:260px;

    overflow-y:auto;

    font-family:'Courier New', monospace;

    font-size:14px;
}

</style>
</head>

<body>

<h1>Median of Data Stream</h1>

<p style="
color:var(--text-dim);
margin-bottom:20px;
">
Two Heaps Approach
</p>

<div class="input-bar">

    <button onclick="loadExample(0)">
        Example 1
    </button>

    <button onclick="loadExample(1)">
        Example 2
    </button>

    <button onclick="resetSim()">
        Reset
    </button>

</div>

<div class="viz">

    <div class="stream">

        <div class="label">
            Stream
        </div>

        <div class="stream-list"
             id="stream-vis"></div>

    </div>

    <div class="heap-container">

        <div class="heap-label">
            Lower (Max Heap)
        </div>

        <div class="heap"
             id="lower-heap"></div>

    </div>

    <div class="heap-container">

        <div class="heap-label">
            Upper (Min Heap)
        </div>

        <div class="heap"
             id="upper-heap"></div>

    </div>

</div>

<div class="info">

    Median:
    <span id="median-val"
          style="
          color:var(--accent-green);
          font-size:22px;
          ">
          —
    </span>

</div>

<div class="action-panel"
     id="action">

Click an example to start

</div>

<div class="controls">

    <button onclick="prevStep()">
        ← Prev
    </button>

    <button onclick="togglePlay()"
            id="play-btn">

        ▶ Play

    </button>

    <button onclick="nextStep()">
        Next →
    </button>

    <label>

        Speed

        <input type="range"
               id="speed"
               min="0"
               max="2"
               value="1"
               step="1">

    </label>

</div>

<div class="log-panel"
     id="log"></div>

<script>

let numbers = [];

let lower = [];

let upper = [];

let steps = [];

let currentStep = 0;

let timer = null;

let isPlaying = false;

const delays = [1600,850,380];

// =========================
// HEAP FUNCTIONS
// =========================

function heapPush(heap,val,isMax=false){

    heap.push(val);

    let i = heap.length - 1;

    while(i > 0){

        const parent =
            Math.floor(
                (i - 1) / 2
            );

        const cmp =
            isMax
            ? heap[i] > heap[parent]
            : heap[i] < heap[parent];

        if(cmp){

            [heap[i],heap[parent]] =
            [heap[parent],heap[i]];

            i = parent;

        }else{

            break;
        }
    }
}

function heapPop(heap,isMax=false){

    if(!heap.length){

        return null;
    }

    const top = heap[0];

    heap[0] =
        heap[heap.length - 1];

    heap.pop();

    let i = 0;

    while(true){

        let child = i;

        const l = 2 * i + 1;

        const r = 2 * i + 2;

        if(l < heap.length){

            const cmpL =
                isMax
                ? heap[l] > heap[child]
                : heap[l] < heap[child];

            if(cmpL){

                child = l;
            }
        }

        if(r < heap.length){

            const cmpR =
                isMax
                ? heap[r] > heap[child]
                : heap[r] < heap[child];

            if(cmpR){

                child = r;
            }
        }

        if(child === i){

            break;
        }

        [heap[i],heap[child]] =
        [heap[child],heap[i]];

        i = child;
    }

    return top;
}

// =========================
// CORRECT MEDIAN FUNCTION
// =========================

function getMedian(){

    // ODD

    if(lower.length > upper.length){

        return Math.abs(lower[0]);
    }

    // EVEN

    return (
        Math.abs(lower[0]) +
        upper[0]
    ) / 2;
}

// =========================

function generateSteps(stream){

    numbers = [];

    lower = [];

    upper = [];

    steps = [];

    let medians = [];

    steps.push({

        action:'Initialize',

        panel:
            `Empty heaps<br>
            Median: —`,

        log:'Start',

        stream:[],

        lower:[],

        upper:[],

        median:null
    });

    for(let num of stream){

        numbers.push(num);

        // =====================
        // CORRECT INSERT LOGIC
        // =====================

        if(
            lower.length === 0 ||
            num <= Math.abs(lower[0])
        ){

            heapPush(
                lower,
                -num,
                false
            );

        }else{

            heapPush(
                upper,
                num,
                false
            );
        }

        // =====================
        // REBALANCE
        // =====================

        if(
            lower.length >
            upper.length + 1
        ){

            heapPush(
                upper,
                Math.abs(
                    heapPop(
                        lower,
                        false
                    )
                ),
                false
            );

        }else if(
            upper.length >
            lower.length
        ){

            heapPush(
                lower,
                -heapPop(
                    upper,
                    false
                ),
                false
            );
        }

        const median =
            getMedian();

        medians.push(median);

        steps.push({

            action:
                `Add ${num}`,

            panel:
                `Added ${num}<br>
                Lower:
                [${lower.map(x=>Math.abs(x)).join(', ')}]
                <br>
                Upper:
                [${upper.join(', ')}]
                <br>
                Median:
                ${median}`,

            log:
                `Added ${num}
                 → median ${median}`,

            stream:[...numbers],

            lower:[...lower],

            upper:[...upper],

            median
        });
    }

    // FINAL OUTPUT

    steps.push({

        action:'Final',

        panel:
            `<b>FINAL OUTPUT</b><br>
            [${medians.join(', ')}]`,

        log:
            `Final output:
             [${medians.join(', ')}]`,

        stream:[...numbers],

        lower:[...lower],

        upper:[...upper],

        median:null
    });
}

function renderStream(arr){

    const cont =
        document.getElementById(
            'stream-vis'
        );

    cont.innerHTML = '';

    arr.forEach(v=>{

        const t =
            document.createElement(
                'div'
            );

        t.className = 'tile';

        t.textContent = v;

        cont.appendChild(t);
    });
}

function renderHeap(
    heapId,
    heapArr,
    isLower
){

    const cont =
        document.getElementById(
            heapId
        );

    cont.innerHTML = '';

    const display =
        isLower
        ? heapArr.map(x=>Math.abs(x))
        : heapArr;

    display.forEach((v,i)=>{

        const tile =
            document.createElement(
                'div'
            );

        tile.className = 'tile';

        if(i === 0){

            tile.style.borderColor =
                '#3fb950';
        }

        tile.textContent = v;

        cont.appendChild(tile);
    });
}

function renderStep(idx){

    currentStep = idx;

    const step = steps[idx];

    if(!step) return;

    document.getElementById(
        'action'
    ).innerHTML =
        step.panel;

    renderStream(step.stream);

    renderHeap(
        'lower-heap',
        step.lower,
        true
    );

    renderHeap(
        'upper-heap',
        step.upper,
        false
    );

    const medEl =
        document.getElementById(
            'median-val'
        );

    medEl.textContent =
        step.median !== null
        ? (
            Number.isInteger(
                step.median
            )
            ? step.median
            : step.median.toFixed(1)
        )
        : '—';

    const logEl =
        document.getElementById(
            'log'
        );

    logEl.innerHTML =
        steps
        .slice(0,idx+1)
        .map(
            s=>`<div>${s.log}</div>`
        )
        .join('');

    logEl.scrollTop =
        logEl.scrollHeight;
}

function nextStep(){

    if(
        currentStep <
        steps.length - 1
    ){

        renderStep(
            currentStep + 1
        );

    }else{

        pause();
    }
}

function prevStep(){

    if(currentStep > 0){

        renderStep(
            currentStep - 1
        );
    }
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(isPlaying){

        pause();

    }else{

        isPlaying = true;

        btn.textContent =
            '❚❚ Pause';

        timer =
            setInterval(()=>{

                if(
                    currentStep <
                    steps.length - 1
                ){

                    nextStep();

                }else{

                    pause();
                }

            },delays[
                parseInt(
                    document.getElementById(
                        'speed'
                    ).value
                )
            ]);
    }
}

function pause(){

    clearInterval(timer);

    isPlaying = false;

    document.getElementById(
        'play-btn'
    ).textContent =
        '▶ Play';
}

function resetSim(){

    pause();

    currentStep = 0;

    renderStep(0);
}

function loadExample(n){

    const ex = [

        [5,3,8,2],

        [1,2,3,4,5]

    ][n];

    generateSteps(ex);

    resetSim();
}

window.onload = ()=>{

    loadExample(0);
};

</script>

</body>
</html>
