<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min in Stack (Extra Space) - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            gap: 60px; 
            width: 100%; 
            max-width: 1100px;
            justify-content: center;
        }

        .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            width: 160px;
            height: 340px;
            border: 2px solid var(--border-main);
            border-radius: 12px;
            padding: 15px;
            background: rgba(22, 27, 34, 0.6);
            overflow-y: auto;
        }

        .stack-frame {
            width: 100%;
            padding: 12px 0;
            background: var(--btn-bg);
            border: 2px solid var(--border-main);
            border-radius: 6px;
            text-align: center;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-blue);
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 780px; text-align: center; 
            font-family: monospace; min-height: 85px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { 
            margin-top: 12px; display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; 
        }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .log-panel {
            margin-top: 15px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 780px; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="reset()">Reset</button>
    </div>

    <div class="visual-container">
        <!-- Main Stack -->
        <div class="stack-area">
            <div class="ui-label" style="color:var(--accent-blue); font-weight:bold;">Main Stack</div>
            <div id="main-stack" class="stack-container"></div>
        </div>

        <!-- Min Stack -->
        <div class="stack-area">
            <div class="ui-label" style="color:var(--accent-orange); font-weight:bold;">Min Stack (Auxiliary)</div>
            <div id="min-stack" class="stack-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">Click Play to start automatic demonstration</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Min</span>
            <span class="info-value" id="current-min" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Main Stack Size</span>
            <span class="info-value" id="main-size" style="color:var(--accent-blue);">0</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:15px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let mainStack = [];
        let minStack = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() { loadExample(0); }

        function loadExample(ex) {
            mainStack = [];
            minStack = [];
            steps = [];
            document.getElementById('log').innerHTML = '';

            if (ex === 0) {
                // Example 1
                addStep("Initialize empty stack", [], []);
                pushStep(5);
                pushStep(3);
                pushStep(7);
                getMinStep();
                popStep();
                getMinStep();
            } else {
                // Example 2
                addStep("Initialize empty stack", [], []);
                pushStep(10);
                pushStep(20);
                pushStep(5);
                pushStep(15);
                getMinStep();
                popStep();
                getMinStep();
                popStep();
                getMinStep();
            }

            stepIndex = 0;
            renderStep(0);
        }

        function addStep(text, main, min) {
            steps.push({
                panel: text,
                main: [...main],
                min: [...min],
                log: text
            });
        }

        function pushStep(val) {
            mainStack.push(val);
            if (minStack.length === 0 || val <= minStack[minStack.length - 1]) {
                minStack.push(val);
            } else {
                minStack.push(minStack[minStack.length - 1]);
            }
            addStep(`Push ${val} → Update Min Stack`, mainStack, minStack);
        }

        function popStep() {
            if (mainStack.length === 0) {
                addStep("Pop: Stack is empty!", mainStack, minStack);
                return;
            }
            const popped = mainStack.pop();
            minStack.pop();
            addStep(`Pop ${popped} → Update Min Stack`, mainStack, minStack);
        }

        function getMinStep() {
            const minVal = minStack.length > 0 ? minStack[minStack.length - 1] : "None (empty)";
            addStep(`getMin() → <span style="color:var(--accent-orange)">${minVal}</span>`, mainStack, minStack);
        }

        function renderStack(containerId, arr, isMin = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            arr.forEach((val, i) => {
                const frame = document.createElement('div');
                frame.className = `stack-frame ${i === arr.length - 1 ? 'active' : ''}`;
                frame.textContent = val;
                container.appendChild(frame);
            });
            if (arr.length === 0) {
                container.innerHTML = `<div style="color:#555; padding:60px 0; text-align:center;">(empty)</div>`;
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderStack('main-stack', step.main);
            renderStack('min-stack', step.min, true);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('main-size').innerText = step.main.length;
            document.getElementById('current-min').innerHTML = step.min.length ? 
                `<span style="color:var(--accent-orange)">${step.min[step.min.length-1]}</span>` : '—';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                const line = document.createElement('div');
                line.style.marginBottom = '4px';
                line.innerHTML = steps[i].log;
                logPanel.appendChild(line);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
