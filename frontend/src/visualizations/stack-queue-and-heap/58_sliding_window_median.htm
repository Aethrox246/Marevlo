<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sliding Window Median</title>

<style>

:root{
    --bg-page:#000000;
    --bg-surface:#161b22;
    --border-main:#30363d;

    --btn-bg:#21262d;
    --btn-hover:#2d333b;

    --text-main:#c9d1d9;
    --text-dim:#8b949e;

    --accent-purple:#a371f7;
    --accent-blue:#388bfd;
    --accent-green:#3fb950;
    --accent-orange:#e3b341;
}

*{
    box-sizing:border-box;
}

body{
    background-color:var(--bg-page);

    color:var(--text-main);

    font-family:system-ui,-apple-system,sans-serif;

    margin:0;

    padding:20px 0;

    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:var(--accent-purple);

    margin:0 0 8px 0;
}

.input-bar{

    width:100%;

    max-width:1100px;

    background:var(--bg-surface);

    padding:12px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    justify-content:center;

    border-bottom:1px solid var(--border-main);

    margin-bottom:20px;
}

button{

    padding:8px 16px;

    background:var(--btn-bg);

    border:1px solid var(--border-main);

    color:var(--text-main);

    border-radius:6px;

    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.viz{

    display:flex;

    gap:40px;

    width:100%;

    max-width:1100px;

    flex-wrap:wrap;

    justify-content:center;
}

.window-container{

    text-align:center;
}

.label{

    color:var(--accent-purple);

    font-weight:bold;

    margin-bottom:8px;
}

.window{

    display:flex;

    gap:6px;

    padding:16px;

    background:#21262d;

    border-radius:10px;
}

.heaps{

    display:flex;

    gap:30px;
}

.heap{

    background:#21262d;

    border:3px solid var(--accent-blue);

    border-radius:12px;

    padding:12px;

    min-height:280px;

    width:110px;

    display:flex;

    flex-direction:column-reverse;

    gap:6px;

    align-items:center;
}

.tile{

    width:90px;

    padding:10px 0;

    background:#2d333b;

    border:2px solid var(--accent-orange);

    border-radius:6px;

    font-family:monospace;

    font-size:16px;

    text-align:center;
}

.tile.top{

    border-color:var(--accent-green);

    box-shadow:0 0 12px var(--accent-green);
}

.info{

    margin:20px 0;

    text-align:center;

    font-family:monospace;

    line-height:1.6;

    font-size:18px;
}

.action-panel{

    background:var(--bg-surface);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:18px;

    width:100%;

    max-width:1000px;

    min-height:140px;

    margin:20px 0;

    font-family:monospace;
}

.controls{

    margin:20px 0;

    display:flex;

    align-items:center;

    gap:16px;

    flex-wrap:wrap;

    justify-content:center;
}

.log-panel{

    background:var(--bg-page);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:16px;

    width:100%;

    max-width:1000px;

    height:240px;

    overflow-y:auto;

    font-family:'Courier New', monospace;

    font-size:14px;
}

</style>
</head>

<body>

<h1>Sliding Window Median</h1>

<p style="
color:var(--text-dim);
margin-bottom:20px;
">
Two Heaps + Sliding Window
</p>

<div class="input-bar">

    <button onclick="loadExample(0)">
        Example 1
    </button>

    <button onclick="loadExample(1)">
        Example 2
    </button>

    <button onclick="resetSim()">
        Reset
    </button>

</div>

<div class="viz">

    <div class="window-container">

        <div class="label">
            Current Window
        </div>

        <div class="window"
             id="window-vis"></div>

    </div>

    <div class="heaps">

        <div>

            <div class="label">
                Max Heap
            </div>

            <div class="heap"
                 id="max-heap"></div>

        </div>

        <div>

            <div class="label">
                Min Heap
            </div>

            <div class="heap"
                 id="min-heap"></div>

        </div>

    </div>

</div>

<div class="info">

    Median:
    <span id="median-val"
          style="
          color:var(--accent-green)
          ">
          —
    </span>

</div>

<div class="action-panel"
     id="action">

Click an example to begin

</div>

<div class="controls">

    <button onclick="prevStep()">
        ← Back
    </button>

    <button onclick="togglePlay()"
            id="play-btn">

        ▶ Play

    </button>

    <button onclick="nextStep()">
        Next →
    </button>

    <label>

        Speed

        <input type="range"
               id="speed"
               min="0"
               max="2"
               value="1">

    </label>

</div>

<div class="log-panel"
     id="log"></div>

<script>

let steps = [];

let stepIdx = 0;

let timer = null;

let isPlaying = false;

const delays = [1650,850,380];

const examples = [

    {
        nums:[1,3,-1,-3,5,3,6,7],
        k:3
    },

    {
        nums:[1,2,3,4,5],
        k:4
    }
];

// ==========================
// CORRECT HEAP FUNCTIONS
// ==========================

function heapPush(heap,val,isMax=false){

    heap.push(
        isMax ? -val : val
    );

    let i = heap.length - 1;

    while(i > 0){

        const p =
            Math.floor(
                (i - 1) / 2
            );

        // MIN HEAP PROPERTY

        if(heap[i] < heap[p]){

            [heap[i],heap[p]] =
            [heap[p],heap[i]];

            i = p;

        }else{

            break;
        }
    }
}

function heapPop(heap,isMax=false){

    if(!heap.length){

        return null;
    }

    const top = heap[0];

    heap[0] =
        heap[heap.length - 1];

    heap.pop();

    let i = 0;

    while(true){

        let smallest = i;

        const l = 2 * i + 1;

        const r = 2 * i + 2;

        if(
            l < heap.length &&
            heap[l] < heap[smallest]
        ){

            smallest = l;
        }

        if(
            r < heap.length &&
            heap[r] < heap[smallest]
        ){

            smallest = r;
        }

        if(smallest === i){

            break;
        }

        [heap[i],heap[smallest]] =
        [heap[smallest],heap[i]];

        i = smallest;
    }

    return isMax ? -top : top;
}

// ==========================

function rebalance(maxHeap,minHeap){

    while(
        maxHeap.length >
        minHeap.length + 1
    ){

        const val =
            heapPop(maxHeap,true);

        heapPush(minHeap,val);
    }

    while(
        minHeap.length >
        maxHeap.length
    ){

        const val =
            heapPop(minHeap);

        heapPush(
            maxHeap,
            val,
            true
        );
    }
}

function getMedian(maxHeap,minHeap,k){

    if(k % 2 === 1){

        return Number(
            (-maxHeap[0]).toFixed(1)
        );
    }

    return Number(
        (
            (
                -maxHeap[0]
                +
                minHeap[0]
            ) / 2
        ).toFixed(1)
    );
}

function buildHeaps(window){

    let maxHeap = [];

    let minHeap = [];

    for(let val of window){

        if(
            !maxHeap.length ||
            val <= -maxHeap[0]
        ){

            heapPush(
                maxHeap,
                val,
                true
            );

        }else{

            heapPush(
                minHeap,
                val
            );
        }

        rebalance(
            maxHeap,
            minHeap
        );
    }

    return {
        maxHeap,
        minHeap
    };
}

function generateSteps(nums,k){

    steps = [];

    let medians = [];

    steps.push({

        panel:
            `<b>Initialize</b><br>
            nums=[${nums.join(', ')}],
            k=${k}`,

        log:
            `Initialize sliding window median`,

        window:[],

        maxHeap:[],

        minHeap:[],

        median:null
    });

    for(
        let i = 0;
        i <= nums.length - k;
        i++
    ){

        const window =
            nums.slice(i,i+k);

        const {
            maxHeap,
            minHeap
        } =
            buildHeaps(window);

        const median =
            getMedian(
                maxHeap,
                minHeap,
                k
            );

        medians.push(median);

        steps.push({

            panel:
                `<b>Window ${i}-${i+k-1}</b><br>
                Window:
                [${window.join(', ')}]
                <br>
                Median:
                ${median}`,

            log:
                `Window [${window.join(', ')}]
                 → median ${median}`,

            window:[...window],

            maxHeap:[...maxHeap],

            minHeap:[...minHeap],

            median
        });
    }

    // FINAL OUTPUT

    steps.push({

        panel:
            `<b>FINAL OUTPUT</b><br>
            [${medians.join(', ')}]`,

        log:
            `Final medians:
             [${medians.join(', ')}]`,

        window:[],

        maxHeap:[],

        minHeap:[],

        median:null
    });
}

function renderWindow(win){

    const container =
        document.getElementById(
            'window-vis'
        );

    container.innerHTML = '';

    win.forEach(val=>{

        const tile =
            document.createElement('div');

        tile.className =
            'tile';

        tile.textContent = val;

        container.appendChild(tile);
    });
}

function renderHeap(id,heap,isMax){

    const container =
        document.getElementById(id);

    container.innerHTML = '';

    const display =
        isMax
        ? heap.map(v=>-v)
        : heap;

    display.forEach((v,idx)=>{

        const tile =
            document.createElement('div');

        tile.className =
            'tile';

        if(idx === 0){

            tile.classList.add(
                'top'
            );
        }

        tile.textContent = v;

        container.appendChild(tile);
    });
}

function renderStep(idx){

    stepIdx = idx;

    const step =
        steps[idx];

    if(!step) return;

    document.getElementById(
        'action'
    ).innerHTML =
        step.panel || '—';

    renderWindow(
        step.window || []
    );

    renderHeap(
        'max-heap',
        step.maxHeap || [],
        true
    );

    renderHeap(
        'min-heap',
        step.minHeap || [],
        false
    );

    document.getElementById(
        'median-val'
    ).textContent =
        step.median !== null
        ? step.median
        : '—';

    const logEl =
        document.getElementById(
            'log'
        );

    logEl.innerHTML =
        steps
        .slice(0,idx+1)
        .map(
            s=>`
            <div style="
            margin:5px 0;
            ">
            ${s.log}
            </div>`
        )
        .join('');

    logEl.scrollTop =
        logEl.scrollHeight;
}

function nextStep(){

    if(
        stepIdx <
        steps.length - 1
    ){

        renderStep(stepIdx + 1);

    }else{

        pause();
    }
}

function prevStep(){

    if(stepIdx > 0){

        renderStep(stepIdx - 1);
    }
}

function resetSim(){

    pause();

    stepIdx = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(isPlaying){

        pause();

    }else{

        isPlaying = true;

        btn.textContent =
            '❚❚ Pause';

        timer =
            setInterval(()=>{

                if(
                    stepIdx <
                    steps.length - 1
                ){

                    nextStep();

                }else{

                    pause();
                }

            },delays[
                document.getElementById(
                    'speed'
                ).value
            ]);
    }
}

function pause(){

    clearInterval(timer);

    isPlaying = false;

    document.getElementById(
        'play-btn'
    ).textContent =
        '▶ Play';
}

function loadExample(n){

    const ex =
        examples[n];

    generateSteps(
        ex.nums,
        ex.k
    );

    resetSim();
}

window.onload = ()=>{

    loadExample(0);
};

</script>

</body>
</html>
