<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valid Stack Sequence - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 260px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 30px; 
            width: 100%; 
            max-width: 960px; 
        }

        .sequences {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .seq-box {
            background: #161b22;
            border: 2px solid var(--accent-blue);
            border-radius: 10px;
            padding: 16px;
            min-width: 220px;
        }
        .seq-label { color: var(--accent-blue); font-weight: bold; margin-bottom: 8px; }
        .seq-tiles {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tile {
            width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 18px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 2px solid var(--border-main); background: #21262d; color: var(--text-main);
        }
        .tile.current { border-color: var(--accent-orange); background: #2a1600; }

        .stack-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .stack-label { color: var(--accent-purple); font-weight: bold; }
        .stack-box {
            background: #161b22;
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 16px 12px;
            min-height: 260px;
            min-width: 80px;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            align-items: center;
        }
        .stack-tile {
            width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
            background: #21262d; border: 2px solid var(--accent-purple); border-radius: 8px;
            font-size: 20px; font-weight: bold; color: var(--accent-purple);
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 26px; width: 760px; min-height: 130px;
            font-family: monospace; font-size: 15px; line-height: 1.65;
        }

        .result-display {
            margin-top: 15px;
            font-size: 32px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .info-panel { margin: 15px 0; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 8px;
            padding: 12px 22px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .status-bar { margin-top: 8px; font-size: 14px; color: var(--text-dim); min-height: 28px; }

        .controls { margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 15px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 14px 18px; width: 760px; max-width: 95%; height: 180px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Pushed:</label>
        <input type="text" id="pushed-input" value="[1,2,3,4,5]" style="width: 260px;">
        <label class="ui-label">Popped:</label>
        <input type="text" id="popped-input" value="[4,5,3,2,1]" style="width: 260px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="sequences">
            <div class="seq-box">
                <div class="seq-label">Pushed Sequence</div>
                <div class="seq-tiles" id="pushed-tiles"></div>
            </div>
            <div class="seq-box">
                <div class="seq-label">Popped Sequence</div>
                <div class="seq-tiles" id="popped-tiles"></div>
            </div>
        </div>

        <div class="stack-container">
            <div class="stack-label">STACK</div>
            <div class="stack-box" id="stack-box"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Pushed Pointer</span>
            <span class="info-value" id="val-i" style="color:var(--accent-blue);">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Popped Pointer</span>
            <span class="info-value" id="val-j" style="color:var(--accent-blue);">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Stack Top</span>
            <span class="info-value" id="val-top" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Result</span>
            <span class="info-value" id="val-result" style="color:var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display" id="final-result">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#2a1600;border:2px solid #e3b341;border-radius:8px;"></span> Current Processing</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let pushed = [];
        let popped = [];
        let stack = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1450, 750, 350];

        const examples = [
            [[1,2,3,4,5], [4,5,3,2,1]],
            [[1,2,3], [3,1,2]]
        ];

        function generateSteps(inputPushed, inputPopped) {
            pushed = [...inputPushed];
            popped = [...inputPopped];
            steps = [];
            stack = [];

            steps.push({
                type: 'init',
                stack: [],
                i: 0,
                j: 0,
                panel: `<b>Valid Stack Sequence</b><br>Pushed: [${pushed.join(', ')}]<br>Popped: [${popped.join(', ')}]`,
                statusText: `Starting simulation`,
                log: `Start: pushed = [${pushed.join(', ')}], popped = [${popped.join(', ')}]`,
                logColor: 'var(--text-dim)'
            });

            let i = 0; // pushed pointer
            let j = 0; // popped pointer

            for (let step = 0; step < pushed.length + popped.length; step++) {
                steps.push({
                    type: 'step',
                    stack: [...stack],
                    i: i,
                    j: j,
                    panel: `Step: i=${i}, j=${j}`,
                    statusText: `i=${i}, j=${j}`,
                    log: `\n→ i=${i}, j=${j}`,
                    logColor: 'var(--accent-orange)'
                });

                // Try to push if possible
                if (i < pushed.length) {
                    stack.push(pushed[i]);
                    steps.push({
                        type: 'push',
                        stack: [...stack],
                        i: i + 1,
                        j: j,
                        panel: `Push <b>${pushed[i]}</b>`,
                        statusText: `Pushed ${pushed[i]}`,
                        log: `  Push ${pushed[i]} → stack = [${stack.join(', ')}]`,
                        logColor: 'var(--accent-blue)'
                    });
                    i++;
                }

                // Try to pop while possible
                while (stack.length > 0 && j < popped.length && stack[stack.length - 1] === popped[j]) {
                    const val = stack.pop();
                    steps.push({
                        type: 'pop',
                        stack: [...stack],
                        i: i,
                        j: j + 1,
                        panel: `Pop <b>${val}</b> (matches popped[${j}])`,
                        statusText: `Popped ${val}`,
                        log: `  Pop ${val} (matches ${popped[j]}) → stack = [${stack.join(', ')}]`,
                        logColor: 'var(--accent-green)'
                    });
                    j++;
                }
            }

            const isValid = j === popped.length && stack.length === 0;
            steps.push({
                type: 'final',
                stack: [...stack],
                i: i,
                j: j,
                panel: `<b>Final Result: ${isValid ? '✅ Valid' : '❌ Invalid'}</b>`,
                statusText: isValid ? 'Valid Stack Sequence' : 'Invalid Stack Sequence',
                log: `\nFinal: j=${j}/${popped.length}, stack empty = ${stack.length === 0}\nResult: ${isValid ? 'True' : 'False'}`,
                logColor: isValid ? 'var(--accent-green)' : 'var(--accent-red)',
                bold: true
            });
        }

        function renderSequences() {
            // Pushed
            const pushedContainer = document.getElementById('pushed-tiles');
            pushedContainer.innerHTML = '';
            pushed.forEach((val, idx) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = val;
                pushedContainer.appendChild(tile);
            });

            // Popped
            const poppedContainer = document.getElementById('popped-tiles');
            poppedContainer.innerHTML = '';
            popped.forEach((val, idx) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = val;
                poppedContainer.appendChild(tile);
            });
        }

        function renderStack() {
            const container = document.getElementById('stack-box');
            container.innerHTML = '';
            for (let i = stack.length - 1; i >= 0; i--) {
                const tile = document.createElement('div');
                tile.className = 'stack-tile';
                tile.textContent = stack[i];
                container.appendChild(tile);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            stack = [...step.stack];
            renderStack();
            renderSequences();

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-i').innerText = step.i;
            document.getElementById('val-j').innerText = step.j;
            document.getElementById('val-top').innerText = stack.length > 0 ? stack[stack.length - 1] : '—';
            document.getElementById('val-result').innerText = step.type === 'final' ? (step.j === popped.length && stack.length === 0 ? '✅ Valid' : '❌ Invalid') : '—';
            document.getElementById('final-result').innerHTML = step.type === 'final' ? 
                `<span style="color:${step.logColor}">${step.j === popped.length && stack.length === 0 ? '✅ VALID' : '❌ INVALID'}</span>` : '—';
            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const s = steps[k];
                if (s.log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (s.logColor) line.style.color = s.logColor;
                    if (s.bold) line.style.fontWeight = 'bold';
                    line.innerText = s.log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            try {
                const pushedStr = document.getElementById('pushed-input').value;
                const poppedStr = document.getElementById('popped-input').value;
                const parsedPushed = JSON.parse(pushedStr);
                const parsedPopped = JSON.parse(poppedStr);
                generateSteps(parsedPushed, parsedPopped);
                reset();
            } catch(e) {
                alert("Please enter valid arrays like [1,2,3] and [2,1,3]");
            }
        }

        function loadExample(idx) {
            document.getElementById('pushed-input').value = JSON.stringify(examples[idx][0]);
            document.getElementById('popped-input').value = JSON.stringify(examples[idx][1]);
            generateSteps(examples[idx][0], examples[idx][1]);
            reset();
        }

        function init() {
            loadExample(0);
        }

        window.onload = init;
    </script>
</body>
</html>
