<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Stack (O(n²))</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 8px 0; }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .stacks {
            display: flex;
            gap: 80px;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
        }

        .stack-container {
            text-align: center;
        }

        .stack-label {
            color: var(--accent-purple);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stack {
            background: #21262d;
            border: 3px solid var(--accent-blue);
            border-radius: 12px;
            padding: 12px 8px;
            min-height: 320px;
            width: 80px;
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            align-items: center;
        }

        .tile {
            width: 60px;
            padding: 12px 0;
            background: #2d333b;
            border: 2px solid var(--accent-orange);
            border-radius: 6px;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .tile.top {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
        }

        .info {
            margin: 20px 0;
            font-family: monospace;
            text-align: center;
            line-height: 1.6;
        }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 18px;
            width: 100%;
            max-width: 1000px;
            min-height: 140px;
            margin: 20px 0;
            font-family: monospace;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px;
            width: 100%;
            max-width: 1000px;
            height: 240px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Sort Stack (O(n²))</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">Insertion Sort using Temporary Stack</p>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetSim()">Reset</button>
    </div>

    <div class="stacks">
        <div class="stack-container">
            <div class="stack-label">Original Stack (top at bottom)</div>
            <div class="stack" id="orig-stack"></div>
        </div>
        <div class="stack-container">
            <div class="stack-label">Temp Stack (sorted)</div>
            <div class="stack" id="temp-stack"></div>
        </div>
    </div>

    <div class="info" id="info">
        Current element: <span id="curr-val" style="color:var(--accent-orange)">—</span><br>
        Status: <span id="status">Ready</span>
    </div>

    <div class="action-panel" id="action">Click an example to begin simulation</div>

    <div class="controls">
        <button onclick="prevStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let original = [];
        let temp = [];
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1600, 850, 380];

        const examples = [
            [3, 1, 4, 2],  // top is last element
            [5]
        ];

        function renderStack(containerId, stack, highlight = null) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            // Show from bottom to top (index 0 = bottom)
            for (let i = 0; i < stack.length; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = stack[i];
                if (highlight !== null && i === highlight) tile.classList.add('top');
                container.appendChild(tile);
            }
        }

        function generateSteps(inputStack) {
            // Stack representation: last element = top
            original = [...inputStack];
            temp = [];
            steps = [];

            steps.push({
                panel: `<b>Initialize</b><br>Original: [${original.join(', ')}] (top = ${original[original.length-1] || '—'})`,
                log: `Start with input stack`,
                orig: [...original],
                tempStack: [],
                curr: null,
                action: 'Initialize'
            });

            while (original.length > 0) {
                const curr = original.pop();
                
                steps.push({
                    panel: `<b>Pop ${curr} from Original</b>`,
                    log: `Popped ${curr} from original`,
                    orig: [...original],
                    tempStack: [...temp],
                    curr: curr,
                    action: `Popped ${curr}`
                });

                // Insert into temp (sorted descending from top)
                while (temp.length > 0 && temp[temp.length - 1] > curr) {
                    const moved = temp.pop();
                    original.push(moved);
                    
                    steps.push({
                        panel: `Move ${moved} back to Original (larger than ${curr})`,
                        log: `Moved ${moved} → Original`,
                        orig: [...original],
                        tempStack: [...temp],
                        curr: curr,
                        action: `Moved ${moved}`
                    });
                }

                temp.push(curr);
                
                steps.push({
                    panel: `Push ${curr} to Temp`,
                    log: `Inserted ${curr} into Temp`,
                    orig: [...original],
                    tempStack: [...temp],
                    curr: curr,
                    action: `Inserted ${curr}`
                });
            }

            // Transfer back to original (this reverses to ascending with smallest at top)
            while (temp.length > 0) {
                const val = temp.pop();
                original.push(val);
                
                steps.push({
                    panel: `Transfer ${val} back to Original`,
                    log: `Transferred ${val}`,
                    orig: [...original],
                    tempStack: [...temp],
                    curr: val,
                    action: `Final transfer ${val}`
                });
            }

            steps.push({
                panel: `<b>FINAL RESULT</b><br>Sorted stack: [${original.join(', ')}] (top = ${original[original.length-1] || '—'})`,
                log: `Sorted: [${original.join(', ')}]`,
                orig: [...original],
                tempStack: [],
                curr: null,
                action: 'Complete'
            });
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('action').innerHTML = step.panel || '—';
            renderStack('orig-stack', step.orig);
            renderStack('temp-stack', step.tempStack);

            document.getElementById('curr-val').textContent = step.curr !== null ? step.curr : '—';
            document.getElementById('status').textContent = step.action || '—';

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx + 1).map(s => 
                `<div style="margin:5px 0;">${s.log}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            generateSteps(examples[n]);
            resetSim();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
