<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue with Max Front - Monotonic Deque Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 520px;
            font-size: 14px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 30px; 
            width: 100%; 
            max-width: 1100px; 
        }

        .queue-tiles {
            display: flex;
            gap: 8px;
            padding: 20px;
            background: #161b22;
            border: 2px solid var(--accent-blue);
            border-radius: 12px;
            flex-wrap: wrap;
        }
        .tile {
            width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 2px solid var(--border-main); background: #21262d; color: var(--text-main);
        }
        .tile.current { border-color: var(--accent-orange); background: #2a1600; animation: pulse 1.2s infinite; }

        .deque-tiles {
            display: flex;
            gap: 8px;
            padding: 20px;
            background: #161b22;
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .max-display {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-green);
            background: #161b22;
            border: 3px solid var(--accent-green);
            border-radius: 12px;
            padding: 20px 50px;
            min-width: 200px;
            text-align: center;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 26px; width: 780px; min-height: 150px;
            font-family: monospace; font-size: 15px; line-height: 1.65;
        }

        .info-panel { margin: 15px 0; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 8px;
            padding: 12px 22px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .status-bar { margin-top: 8px; font-size: 14px; color: var(--text-dim); min-height: 28px; }

        .controls { margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 160px; }

        .legend { margin-top: 15px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 14px 18px; width: 780px; max-width: 95%; height: 190px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }

        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Operations:</label>
        <input type="text" id="ops-input" value="enqueue(3), enqueue(1), enqueue(4), getFrontMax(), dequeue(), getFrontMax()" style="width: 520px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div>
            <div class="ui-label">Queue (FIFO - Front Left)</div>
            <div class="queue-tiles" id="queue-tiles"></div>
        </div>

        <div>
            <div class="ui-label">Monotonic Decreasing Deque (Max Candidates)</div>
            <div class="deque-tiles" id="deque-tiles"></div>
        </div>

        <div class="max-display" id="max-display">—</div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Queue Size</span>
            <span class="info-value" id="q-size" style="color:var(--accent-blue);">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Deque Size</span>
            <span class="info-value" id="d-size" style="color:var(--accent-purple);">0</span>
        </div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#2a1600;border:2px solid #e3b341;border-radius:8px;"></span> Current</div>
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#0f2a1a;border:2px solid #3fb950;border-radius:8px;"></span> Max Candidate</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let queue = [];
        let deque = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 850, 400];

        const examples = [
            ["enqueue(3)", "enqueue(1)", "enqueue(4)", "getFrontMax()", "dequeue()", "getFrontMax()"],
            ["enqueue(5)", "enqueue(2)", "dequeue()", "enqueue(7)", "getFrontMax()", "dequeue()", "getFrontMax()"]
        ];

        function generateSteps(ops) {
            queue = [];
            deque = [];
            steps = [];

            steps.push({
                type: 'init',
                queue: [],
                deque: [],
                max: '—',
                panel: `<b>Queue with Max Front (Monotonic Deque)</b><br>Start empty`,
                statusText: `Initialized`,
                log: `Start`,
                logColor: 'var(--text-dim)'
            });

            ops.forEach(opStr => {
                steps.push({
                    type: 'op',
                    op: opStr,
                    queue: [...queue],
                    deque: [...deque],
                    max: deque.length ? deque[0] : '—',
                    panel: `Operation: <b>${opStr}</b>`,
                    statusText: opStr,
                    log: `\n→ ${opStr}`,
                    logColor: 'var(--accent-orange)'
                });

                const match = opStr.match(/(\w+)\((.*)\)/);
                if (!match) return;
                const cmd = match[1];
                const arg = match[2] ? parseInt(match[2]) : null;

                if (cmd === 'enqueue') {
                    const val = arg;
                    queue.push(val);

                    // Maintain monotonic decreasing deque
                    while (deque.length && deque[deque.length - 1] < val) {
                        deque.pop();
                    }
                    deque.push(val);

                    steps.push({
                        type: 'enqueue',
                        queue: [...queue],
                        deque: [...deque],
                        max: deque[0],
                        panel: `Enqueued <b>${val}</b>`,
                        statusText: `Enqueued ${val}`,
                        log: `  Enqueue ${val}`,
                        logColor: 'var(--accent-blue)'
                    });
                } 
                else if (cmd === 'dequeue') {
                    if (queue.length === 0) return;
                    const val = queue.shift();
                    if (deque.length && deque[0] === val) {
                        deque.shift();
                    }
                    steps.push({
                        type: 'dequeue',
                        queue: [...queue],
                        deque: [...deque],
                        max: deque.length ? deque[0] : '—',
                        panel: `Dequeued <b>${val}</b>`,
                        statusText: `Dequeued ${val}`,
                        log: `  Dequeue ${val}`,
                        logColor: 'var(--accent-red)'
                    });
                } 
                else if (cmd === 'getFrontMax') {
                    const curMax = deque.length ? deque[0] : '—';
                    steps.push({
                        type: 'query',
                        queue: [...queue],
                        deque: [...deque],
                        max: curMax,
                        panel: `getFrontMax() = <b>${curMax}</b>`,
                        statusText: `Max = ${curMax}`,
                        log: `  getFrontMax → ${curMax}`,
                        logColor: 'var(--accent-green)'
                    });
                }
            });

            steps.push({
                type: 'final',
                queue: [...queue],
                deque: [...deque],
                max: deque.length ? deque[0] : '—',
                panel: `<b>Final Max: <span style="color:var(--accent-green)">${deque.length ? deque[0] : '—'}</span></b>`,
                statusText: `Done`,
                log: `\nFinal Max: ${deque.length ? deque[0] : '—'}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderQueue() {
            const container = document.getElementById('queue-tiles');
            container.innerHTML = '';
            queue.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = `tile`;
                tile.textContent = val;
                container.appendChild(tile);
            });
        }

        function renderDeque() {
            const container = document.getElementById('deque-tiles');
            container.innerHTML = '';
            deque.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = `tile ${i === 0 ? 'max' : ''}`;
                tile.textContent = val;
                container.appendChild(tile);
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            queue = [...step.queue];
            deque = [...step.deque];

            renderQueue();
            renderDeque();

            document.getElementById('max-display').innerText = step.max;
            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('q-size').innerText = queue.length;
            document.getElementById('d-size').innerText = deque.length;

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const s = steps[k];
                if (s.log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (s.logColor) line.style.color = s.logColor;
                    if (s.bold) line.style.fontWeight = 'bold';
                    line.innerText = s.log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            const opsStr = document.getElementById('ops-input').value;
            const ops = opsStr.split(',').map(s => s.trim()).filter(Boolean);
            generateSteps(ops);
            reset();
        }

        function loadExample(idx) {
            document.getElementById('ops-input').value = examples[idx].join(', ');
            generateSteps(examples[idx]);
            reset();
        }

        function init() {
            loadExample(0);
        }

        window.onload = init;
    </script>
</body>
</html>
