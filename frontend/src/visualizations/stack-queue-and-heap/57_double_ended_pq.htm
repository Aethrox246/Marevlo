<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Double Ended Priority Queue</title>

<style>

:root{
    --bg-page:#000000;
    --bg-surface:#161b22;
    --border-main:#30363d;

    --btn-bg:#21262d;
    --btn-hover:#2d333b;

    --text-main:#c9d1d9;
    --text-dim:#8b949e;

    --accent-purple:#a371f7;
    --accent-blue:#388bfd;
    --accent-green:#3fb950;
    --accent-orange:#e3b341;
    --accent-red:#f85149;
}

*{
    box-sizing:border-box;
}

body{
    background-color:var(--bg-page);

    color:var(--text-main);

    font-family:system-ui,-apple-system,sans-serif;

    margin:0;

    padding:20px 0;

    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:var(--accent-purple);

    margin:0 0 8px 0;
}

.input-bar{

    width:100%;

    max-width:1100px;

    background:var(--bg-surface);

    padding:12px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    justify-content:center;

    border-bottom:1px solid var(--border-main);

    margin-bottom:20px;
}

button{

    padding:8px 16px;

    background:var(--btn-bg);

    border:1px solid var(--border-main);

    color:var(--text-main);

    border-radius:6px;

    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.main{

    display:flex;

    gap:20px;

    flex-wrap:wrap;

    justify-content:center;

    width:100%;
}

.heap-box{

    background:var(--bg-surface);

    border:2px solid var(--accent-purple);

    border-radius:12px;

    padding:20px;

    width:420px;
}

.heap-title{

    text-align:center;

    color:var(--accent-purple);

    margin-bottom:14px;

    font-weight:bold;
}

.heap{

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    background:#21262d;

    padding:16px;

    border-radius:10px;

    min-height:100px;
}

.tile{

    padding:12px 18px;

    border-radius:8px;

    border:2px solid var(--accent-blue);

    font-family:monospace;

    font-size:16px;

    min-width:62px;

    text-align:center;
}

.tile.min{
    border-color:var(--accent-green);
}

.tile.max{
    border-color:var(--accent-orange);
}

.action-panel{

    background:var(--bg-surface);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:18px;

    width:100%;

    max-width:900px;

    min-height:150px;

    margin:20px 0;

    font-family:monospace;

    line-height:1.7;
}

.controls{

    margin:20px 0;

    display:flex;

    align-items:center;

    gap:16px;

    flex-wrap:wrap;

    justify-content:center;
}

.log-panel{

    background:var(--bg-page);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:16px;

    width:100%;

    max-width:900px;

    height:240px;

    overflow-y:auto;

    font-family:'Courier New', monospace;

    font-size:14px;
}

</style>
</head>

<body>

<h1>Double Ended Priority Queue</h1>

<p style="
color:var(--text-dim);
margin-bottom:20px;
">
Min Heap + Max Heap + Active IDs
</p>

<div class="input-bar">

    <button onclick="loadExample(0)">
        Example 1
    </button>

    <button onclick="loadExample(1)">
        Example 2
    </button>

    <button onclick="resetSim()">
        Reset
    </button>

</div>

<div class="main">

    <div class="heap-box">

        <div class="heap-title">
            Min Heap
        </div>

        <div class="heap"
             id="min-heap"></div>

    </div>

    <div class="heap-box">

        <div class="heap-title">
            Max Heap
        </div>

        <div class="heap"
             id="max-heap"></div>

    </div>

</div>

<div class="action-panel"
     id="action">

Click an example to begin

</div>

<div class="controls">

    <button onclick="prevStep()">
        ← Back
    </button>

    <button onclick="togglePlay()"
            id="play-btn">

        ▶ Play

    </button>

    <button onclick="nextStep()">
        Next →
    </button>

    <label>

        Speed

        <input type="range"
               id="speed"
               min="0"
               max="2"
               value="1">

    </label>

</div>

<div class="log-panel"
     id="log"></div>

<script>

let steps = [];

let stepIdx = 0;

let timer = null;

let isPlaying = false;

let nextId = 1;

const delays = [1650,850,380];

const examples = [

    [
        "insert(5)",
        "insert(3)",
        "insert(8)",
        "deleteMin()",
        "deleteMax()",
        "insert(1)",
        "deleteMin()"
    ],

    [
        "insert(10)",
        "insert(20)",
        "deleteMin()",
        "insert(5)",
        "deleteMax()",
        "deleteMin()"
    ]
];

function sortMinHeap(a){

    return [...a].sort(
        (x,y)=>x.val - y.val
    );
}

function sortMaxHeap(a){

    return [...a].sort(
        (x,y)=>y.val - x.val
    );
}

function generateSteps(ops){

    steps = [];

    nextId = 1;

    let active = {};

    let minHeap = [];

    let maxHeap = [];

    let outputs = [];

    steps.push({

        panel:
            `<b>Initialize</b><br>
            Empty DEPQ`,

        log:
            `Initialized`,

        minHeap:[],

        maxHeap:[]
    });

    for(let op of ops){

        let action = op;

        // INSERT

        if(op.startsWith("insert")){

            const val =
                parseInt(
                    op.match(/\d+/)[0]
                );

            const id = nextId++;

            const node = {val,id};

            active[id] = true;

            minHeap.push(node);

            maxHeap.push(node);

            action =
                `Inserted ${val}
                 with ID ${id}`;

            steps.push({

                panel:
                    `<b>${op}</b><br>
                    ${action}`,

                log:action,

                minHeap:
                    sortMinHeap(
                        minHeap.filter(
                            n=>active[n.id]
                        )
                    ),

                maxHeap:
                    sortMaxHeap(
                        maxHeap.filter(
                            n=>active[n.id]
                        )
                    )
            });
        }

        // DELETE MIN

        else if(op === "deleteMin()"){

            let sorted =
                sortMinHeap(
                    minHeap.filter(
                        n=>active[n.id]
                    )
                );

            if(sorted.length === 0){

                outputs.push("None");

                action =
                    `deleteMin → None`;

            }else{

                const node =
                    sorted[0];

                active[node.id] = false;

                outputs.push(
                    String(node.val)
                );

                action =
                    `deleteMin → ${node.val}`;
            }

            steps.push({

                panel:
                    `<b>deleteMin()</b><br>
                    ${action}`,

                log:action,

                minHeap:
                    sortMinHeap(
                        minHeap.filter(
                            n=>active[n.id]
                        )
                    ),

                maxHeap:
                    sortMaxHeap(
                        maxHeap.filter(
                            n=>active[n.id]
                        )
                    )
            });
        }

        // DELETE MAX

        else if(op === "deleteMax()"){

            let sorted =
                sortMaxHeap(
                    maxHeap.filter(
                        n=>active[n.id]
                    )
                );

            if(sorted.length === 0){

                outputs.push("None");

                action =
                    `deleteMax → None`;

            }else{

                const node =
                    sorted[0];

                active[node.id] = false;

                outputs.push(
                    String(node.val)
                );

                action =
                    `deleteMax → ${node.val}`;
            }

            steps.push({

                panel:
                    `<b>deleteMax()</b><br>
                    ${action}`,

                log:action,

                minHeap:
                    sortMinHeap(
                        minHeap.filter(
                            n=>active[n.id]
                        )
                    ),

                maxHeap:
                    sortMaxHeap(
                        maxHeap.filter(
                            n=>active[n.id]
                        )
                    )
            });
        }
    }

    // FINAL

    steps.push({

        panel:
            `<b>FINAL OUTPUT</b><br>
            ${outputs.join(', ')}`,

        log:
            `Final output:
             ${outputs.join(', ')}`,

        minHeap:
            sortMinHeap(
                minHeap.filter(
                    n=>active[n.id]
                )
            ),

        maxHeap:
            sortMaxHeap(
                maxHeap.filter(
                    n=>active[n.id]
                )
            )
    });
}

function renderHeap(id,data,type){

    const container =
        document.getElementById(id);

    container.innerHTML = '';

    data.forEach(node=>{

        const tile =
            document.createElement('div');

        tile.className =
            `tile ${type}`;

        tile.textContent =
            `${node.val}
             (#${node.id})`;

        container.appendChild(tile);
    });
}

function renderStep(idx){

    stepIdx = idx;

    const step =
        steps[idx];

    if(!step) return;

    document.getElementById(
        'action'
    ).innerHTML =
        step.panel || '—';

    renderHeap(
        'min-heap',
        step.minHeap,
        'min'
    );

    renderHeap(
        'max-heap',
        step.maxHeap,
        'max'
    );

    const logEl =
        document.getElementById(
            'log'
        );

    logEl.innerHTML =
        steps
        .slice(0,idx+1)
        .map(
            s=>`
            <div style="
            margin:5px 0;
            ">
            ${s.log}
            </div>`
        )
        .join('');

    logEl.scrollTop =
        logEl.scrollHeight;
}

function nextStep(){

    if(
        stepIdx <
        steps.length - 1
    ){

        renderStep(stepIdx + 1);

    }else{

        pause();
    }
}

function prevStep(){

    if(stepIdx > 0){

        renderStep(stepIdx - 1);
    }
}

function resetSim(){

    pause();

    stepIdx = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(isPlaying){

        pause();

    }else{

        isPlaying = true;

        btn.textContent =
            '❚❚ Pause';

        timer =
            setInterval(()=>{

                if(
                    stepIdx <
                    steps.length - 1
                ){

                    nextStep();

                }else{

                    pause();
                }

            },delays[
                document.getElementById(
                    'speed'
                ).value
            ]);
    }
}

function pause(){

    clearInterval(timer);

    isPlaying = false;

    document.getElementById(
        'play-btn'
    ).textContent =
        '▶ Play';
}

function loadExample(n){

    generateSteps(
        examples[n]
    );

    resetSim();
}

window.onload = ()=>{

    loadExample(0);
};

</script>

</body>
</html>
