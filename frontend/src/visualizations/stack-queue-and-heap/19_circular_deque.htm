<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circular Deque Visualization</title>

<style>

:root{
    --bg:#000000;
    --surface:#161b22;
    --border:#30363d;
    --text:#c9d1d9;

    --orange:#e3b341;
    --blue:#58a6ff;
    --green:#3fb950;
    --red:#f85149;
    --purple:#a371f7;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui;

    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    margin-bottom:20px;
}

.controls{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
    justify-content:center;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#21262d;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#30363d;
}

.array-box{
    background:var(--surface);
    border:2px solid var(--purple);
    border-radius:14px;

    padding:25px;

    display:flex;
    gap:12px;

    margin-top:20px;
}

.tile{
    width:78px;
    height:90px;

    border-radius:10px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    font-size:24px;
    font-weight:bold;

    background:#21262d;

    border:2px solid var(--border);

    transition:0.4s;

    position:relative;
}

.index{
    font-size:11px;
    color:#888;
    margin-top:6px;
}

.front{
    border-color:var(--orange);
    box-shadow:0 0 18px var(--orange);
}

.rear{
    border-color:var(--blue);
    box-shadow:0 0 18px var(--blue);
}

.highlight{
    transform:scale(1.1);
    box-shadow:0 0 22px white;
}

.info-panel{
    display:flex;
    gap:18px;
    margin-top:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.info-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;

    padding:15px 24px;

    min-width:140px;

    text-align:center;
}

.label{
    font-size:12px;
    color:#888;
}

.value{
    font-size:22px;
    font-weight:bold;
    margin-top:5px;
}

.action-panel{
    width:950px;

    margin-top:25px;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:12px;

    padding:22px;

    text-align:center;
}

.panel-title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.panel-action{
    color:var(--orange);
    font-size:20px;
    font-weight:bold;
}

.result{
    margin-top:20px;

    font-size:34px;
    font-weight:bold;

    color:var(--green);
}

.log-box{
    width:950px;

    margin-top:20px;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:12px;

    padding:16px;

    height:260px;

    overflow-y:auto;

    font-family:monospace;
}

.log-line{
    margin:6px 0;
}

</style>
</head>

<body>

<h1>Circular Deque Visualization</h1>

<div class="controls">

    <button onclick="loadExample(0)">
        Example 1
    </button>

    <button onclick="loadExample(1)">
        Example 2
    </button>

    <button onclick="resetVisualization()">
        Reset
    </button>

    <button onclick="backStep()">
        ← Back
    </button>

    <button onclick="togglePlay()" id="playBtn">
        ▶ Play
    </button>

    <button onclick="nextStep()">
        Next →
    </button>

</div>

<!-- ARRAY -->

<div class="array-box"
     id="arrayBox"></div>

<!-- INFO -->

<div class="info-panel">

    <div class="info-card">
        <div class="label">Front</div>
        <div class="value"
             id="frontVal"
             style="color:var(--orange)">
             0
        </div>
    </div>

    <div class="info-card">
        <div class="label">Rear</div>
        <div class="value"
             id="rearVal"
             style="color:var(--blue)">
             0
        </div>
    </div>

    <div class="info-card">
        <div class="label">Size</div>
        <div class="value"
             id="sizeVal"
             style="color:var(--green)">
             0
        </div>
    </div>

    <div class="info-card">
        <div class="label">Capacity</div>
        <div class="value"
             id="capVal"
             style="color:var(--purple)">
             3
        </div>
    </div>

</div>

<!-- PANEL -->

<div class="action-panel">

    <div class="panel-title"
         id="panelTitle">

        Circular Deque

    </div>

    <div class="panel-action"
         id="panelAction">

        Click Play to Start

    </div>

    <div class="result"
         id="resultBox">

        —
    </div>

</div>

<!-- LOGS -->

<div class="log-box"
     id="logBox"></div>

<script>

let arr = [];

let front = 0;

let rear = 0;

let size = 0;

let capacity = 3;

let result = '—';

let steps = [];

let stepIndex = 0;

let timer = null;

const delays = [1800,1000,500];

function snapshot(title,action,highlight=-1){

    steps.push({

        title,
        action,
        highlight,

        arr:[...arr],

        front,
        rear,
        size,
        capacity,
        result
    });
}

function init(cap){

    capacity = cap;

    arr = new Array(capacity).fill(null);

    front = 0;
    rear = 0;
    size = 0;

    result = '—';
}

function insertLast(x){

    arr[rear] = x;

    snapshot(
        `insertLast(${x})`,
        `arr[${rear}] = ${x}`,
        rear
    );

    rear = (rear + 1) % capacity;

    size++;

    snapshot(
        `Update Rear`,
        `rear = ${rear}, size = ${size}`
    );
}

function insertFront(x){

    front =
        (front - 1 + capacity)
        % capacity;

    snapshot(
        `Move Front`,
        `front = ${front}`
    );

    arr[front] = x;

    size++;

    snapshot(
        `insertFront(${x})`,
        `arr[${front}] = ${x}`,
        front
    );
}

function deleteFront(){

    const val = arr[front];

    snapshot(
        `deleteFront()`,
        `Remove ${val} from front`,
        front
    );

    front =
        (front + 1)
        % capacity;

    size--;

    snapshot(
        `Update Front`,
        `front = ${front}, size = ${size}`
    );
}

function deleteLast(){

    rear =
        (rear - 1 + capacity)
        % capacity;

    snapshot(
        `Move Rear`,
        `rear = ${rear}`,
        rear
    );

    const val = arr[rear];

    size--;

    snapshot(
        `deleteLast()`,
        `Remove ${val} from rear`,
        rear
    );
}

function getRear(){

    const idx =
        (rear - 1 + capacity)
        % capacity;

    result = arr[idx];

    snapshot(
        `getRear()`,
        `arr[${idx}] = ${result}`,
        idx
    );
}

function getFront(){

    result = arr[front];

    snapshot(
        `getFront()`,
        `arr[${front}] = ${result}`,
        front
    );
}

function loadExample(ex){

    pause();

    steps = [];

    if(ex === 0){

        init(3);

        snapshot(
            "Initialize",
            "arr=[None,None,None]"
        );

        insertLast(1);

        insertFront(2);

        insertLast(3);

        deleteFront();

        insertFront(4);

        getRear();

    }else{

        init(4);

        snapshot(
            "Initialize",
            "arr=[None,None,None,None]"
        );

        insertLast(5);

        insertFront(6);

        insertLast(7);

        deleteLast();

        getFront();
    }

    stepIndex = 0;

    renderStep(0);
}

function renderArray(data,highlight){

    const box =
        document.getElementById(
            "arrayBox"
        );

    box.innerHTML = '';

    data.forEach((val,i)=>{

        const tile =
            document.createElement('div');

        tile.className = 'tile';

        if(i === front){

            tile.classList.add('front');
        }

        if(
            i ===
            ((rear - 1 + capacity)
            % capacity)
            && size > 0
        ){

            tile.classList.add('rear');
        }

        if(i === highlight){

            tile.classList.add('highlight');
        }

        tile.innerHTML = `
            ${val !== null ? val : '_'}
            <div class="index">
                ${i}
            </div>
        `;

        box.appendChild(tile);
    });
}

function renderStep(i){

    const step = steps[i];

    if(!step) return;

    arr = [...step.arr];

    front = step.front;
    rear = step.rear;
    size = step.size;
    capacity = step.capacity;

    result = step.result;

    renderArray(
        step.arr,
        step.highlight
    );

    document.getElementById(
        "frontVal"
    ).textContent = front;

    document.getElementById(
        "rearVal"
    ).textContent = rear;

    document.getElementById(
        "sizeVal"
    ).textContent = size;

    document.getElementById(
        "capVal"
    ).textContent = capacity;

    document.getElementById(
        "panelTitle"
    ).textContent = step.title;

    document.getElementById(
        "panelAction"
    ).textContent = step.action;

    document.getElementById(
        "resultBox"
    ).textContent = result;

    const logBox =
        document.getElementById(
            "logBox"
        );

    logBox.innerHTML = '';

    for(let j=0;j<=i;j++){

        const line =
            document.createElement('div');

        line.className =
            'log-line';

        line.innerHTML =
            `<span style="color:#58a6ff">
                Step ${j}
             </span>
             : ${steps[j].action}`;

        logBox.appendChild(line);
    }

    logBox.scrollTop =
        logBox.scrollHeight;
}

function nextStep(){

    if(stepIndex < steps.length - 1){

        stepIndex++;

        renderStep(stepIndex);

    }else{

        pause();
    }
}

function backStep(){

    if(stepIndex > 0){

        stepIndex--;

        renderStep(stepIndex);
    }
}

function resetVisualization(){

    pause();

    stepIndex = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            "playBtn"
        );

    if(timer){

        pause();

    }else{

        btn.textContent = "Pause";

        timer = setInterval(()=>{

            if(stepIndex < steps.length - 1){

                nextStep();

            }else{

                pause();
            }

        },1000);
    }
}

function pause(){

    clearInterval(timer);

    timer = null;

    document.getElementById(
        "playBtn"
    ).textContent = "Play";
}

window.onload = () => {

    loadExample(0);
};

</script>

</body>
</html>
