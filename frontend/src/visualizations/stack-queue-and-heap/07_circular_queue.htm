<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Queue Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-bar {
            background: var(--bg-surface);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container {
            display: flex;
            gap: 60px;
            margin-top: 20px;
            align-items: flex-start;
        }

        .queue-area {
            text-align: center;
        }

        .queue-container {
            display: flex;
            gap: 12px;
            padding: 25px 30px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 12px;
            min-height: 140px;
            align-items: center;
            position: relative;
        }

        .queue-slot {
            width: 62px;
            height: 82px;
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            position: relative;
            transition: all 0.4s ease;
        }

        .queue-slot.front {
            border-color: var(--accent-orange);
            box-shadow: 0 0 18px var(--accent-orange);
        }

        .queue-slot.rear {
            border-color: var(--accent-blue);
            box-shadow: 0 0 18px var(--accent-blue);
        }

        .pointer {
            position: absolute;
            font-size: 11px;
            font-weight: bold;
        }

        .action-panel {
            margin: 25px 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 18px;
            width: 780px;
            text-align: center;
            min-height: 90px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .log-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            height: 220px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 13.5px;
            width: 780px;
            margin-top: 15px;
        }

        .info-panel {
            margin-top: 15px;
            display: flex;
            gap: 30px;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1 (Capacity 3)</button>
        <button onclick="loadExample(1)">Example 2 (Capacity 5)</button>
        <button onclick="resetQueue()">Reset</button>
    </div>

    <div class="queue-area">
        <div style="color:var(--accent-green); font-weight:bold; margin-bottom:10px;">Circular Queue (Fixed Size)</div>
        <div id="queue-container" class="queue-container"></div>
    </div>

    <div class="action-panel" id="main-panel">Click Play to start automatic demonstration</div>

    <div class="info-panel">
        <div style="background:var(--bg-surface); padding:10px 18px; border:1px solid var(--border-main); border-radius:6px;">
            <span style="color:var(--text-dim); font-size:12px;">Front</span><br>
            <span id="front-val" style="color:var(--accent-orange); font-size:18px; font-weight:bold;">0</span>
        </div>
        <div style="background:var(--bg-surface); padding:10px 18px; border:1px solid var(--border-main); border-radius:6px;">
            <span style="color:var(--text-dim); font-size:12px;">Rear</span><br>
            <span id="rear-val" style="color:var(--accent-blue); font-size:18px; font-weight:bold;">0</span>
        </div>
        <div style="background:var(--bg-surface); padding:10px 18px; border:1px solid var(--border-main); border-radius:6px;">
            <span style="color:var(--text-dim); font-size:12px;">Size</span><br>
            <span id="size-val" style="color:var(--accent-green); font-size:18px; font-weight:bold;">0</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="resetQueue()">↺ Reset</button>
        <button onclick="backStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <span style="margin-left:20px">Speed:</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="log-container" id="log-container"></div>

    <script>
        let capacity = 3;
        let queue = [];
        let front = 0;
        let rear = 0;
        let size = 0;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            if (ex === 0) capacity = 3;
            else capacity = 5;

            queue = new Array(capacity).fill(null);
            front = 0;
            rear = 0;
            size = 0;
            steps = [];
            document.getElementById('log-container').innerHTML = '';

            if (ex === 0) {
                addStep("Initialize Circular Queue (capacity = 3)", []);
                enqueueStep(1);
                enqueueStep(2);
                enqueueStep(3);
                dequeueStep();
                enqueueStep(4);
                peekStep();
                dequeueStep();
                dequeueStep();
            } else {
                addStep("Initialize Circular Queue (capacity = 5)", []);
                enqueueStep(10);
                enqueueStep(20);
                enqueueStep(30);
                dequeueStep();
                enqueueStep(40);
                enqueueStep(50);
                enqueueStep(60);
                isFullStep();
                dequeueStep();
                dequeueStep();
                dequeueStep();
            }

            stepIndex = 0;
            renderStep(0);
        }

        function addStep(text) {
            steps.push({
                panel: text,
                queue: [...queue],
                front: front,
                rear: rear,
                size: size,
                log: text
            });
        }

        function enqueueStep(val) {
            if (size === capacity) {
                addStep(`Enqueue ${val} → <span style="color:var(--accent-red)">Queue Full!</span>`);
                return;
            }
            queue[rear] = val;
            rear = (rear + 1) % capacity;
            size++;
            addStep(`Enqueue ${val} → rear = ${(rear)}`);
        }

        function dequeueStep() {
            if (size === 0) {
                addStep(`Dequeue → <span style="color:var(--accent-red)">Queue Empty!</span>`);
                return;
            }
            const val = queue[front];
            queue[front] = null;
            front = (front + 1) % capacity;
            size--;
            addStep(`Dequeue → ${val}`);
        }

        function peekStep() {
            if (size === 0) {
                addStep(`Peek → <span style="color:var(--accent-red)">Queue Empty!</span>`);
                return;
            }
            addStep(`Peek → ${queue[front]}`);
        }

        function isFullStep() {
            addStep(`isFull() → ${size === capacity ? 'True' : 'False'}`);
        }

        function renderQueue() {
            const container = document.getElementById('queue-container');
            container.innerHTML = '';

            for (let i = 0; i < capacity; i++) {
                const slot = document.createElement('div');
                slot.className = `queue-slot ${i === front ? 'front' : ''} ${i === rear ? 'rear' : ''}`;
                
                const val = queue[i] !== null ? queue[i] : '—';
                slot.innerHTML = `
                    <div style="font-size:11px; color:#666; position:absolute; top:4px;">${i}</div>
                    <div>${val}</div>
                `;
                container.appendChild(slot);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderQueue();
            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('front-val').innerText = step.front;
            document.getElementById('rear-val').innerText = step.rear;
            document.getElementById('size-val').innerText = step.size;

            const logDiv = document.getElementById('log-container');
            logDiv.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                const line = document.createElement('div');
                line.style.margin = '4px 0';
                line.innerHTML = steps[i].log;
                logDiv.appendChild(line);
            }
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function nextStep() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function backStep() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function resetQueue() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(nextStep, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
