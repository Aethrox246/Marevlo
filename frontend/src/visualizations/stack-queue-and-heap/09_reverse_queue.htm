<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Queue Using Stack - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-bar {
            background: var(--bg-surface);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container {
            display: flex;
            gap: 60px;
            margin-top: 20px;
            align-items: flex-start;
        }

        .queue-area, .stack-area {
            text-align: center;
        }

        .queue-container {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 12px;
            min-height: 100px;
            align-items: center;
        }

        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            width: 160px;
            height: 320px;
            border: 2px solid var(--border-main);
            border-radius: 12px;
            padding: 15px;
            background: rgba(22, 27, 34, 0.6);
            overflow-y: auto;
        }

        .queue-slot, .stack-frame {
            padding: 12px 18px;
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
            transition: all 0.4s ease;
        }

        .queue-slot.front {
            border-color: var(--accent-orange);
            box-shadow: 0 0 12px var(--accent-orange);
        }

        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            transform: scale(1.05);
        }

        .action-panel {
            margin: 25px 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 18px;
            width: 780px;
            text-align: center;
            min-height: 95px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .log-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            height: 220px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 13.5px;
            width: 780px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1 [1,2,3,4,5]</button>
        <button onclick="loadExample(1)">Example 2 [10,20,30]</button>
        <button onclick="resetAll()">Reset</button>
    </div>

    <div class="visual-container">
        <!-- Queue -->
        <div class="queue-area">
            <div style="color:var(--accent-orange); font-weight:bold;">Queue (FIFO)</div>
            <div id="queue-container" class="queue-container"></div>
        </div>

        <!-- Stack -->
        <div class="stack-area">
            <div style="color:var(--accent-blue); font-weight:bold;">Stack (LIFO)</div>
            <div id="stack-container" class="stack-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">Click Play to start automatic demonstration</div>

    <div class="controls">
        <button onclick="resetAll()">↺ Reset</button>
        <button onclick="backStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <span style="margin-left:20px">Speed:</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="log-container" id="log-container"></div>

    <script>
        let queue = [];
        let stack = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            queue = [];
            stack = [];
            steps = [];
            document.getElementById('log-container').innerHTML = '';

            if (ex === 0) {
                queue = [1, 2, 3, 4, 5];
            } else {
                queue = [10, 20, 30];
            }

            addStep("Initial Queue", [...queue], []);
            reverseQueue();

            stepIndex = 0;
            renderStep(0);
        }

        function addStep(text, qState, sState) {
            steps.push({
                panel: text,
                queue: [...qState],
                stack: [...sState],
                log: text
            });
        }

        function reverseQueue() {
            // Phase 1: Queue → Stack
            while (queue.length > 0) {
                const val = queue.shift();
                stack.push(val);
                addStep(`Dequeue ${val} from Queue → Push to Stack`, queue, stack);
            }

            // Phase 2: Stack → Queue (reverses again)
            while (stack.length > 0) {
                const val = stack.pop();
                queue.push(val);
                addStep(`Pop ${val} from Stack → Enqueue to Queue`, queue, stack);
            }
        }

        function renderQueue(q) {
            const container = document.getElementById('queue-container');
            container.innerHTML = '';
            q.forEach((val, i) => {
                const slot = document.createElement('div');
                slot.className = `queue-slot ${i === 0 ? 'front' : ''}`;
                slot.textContent = val;
                container.appendChild(slot);
            });
            if (q.length === 0) {
                container.innerHTML = '<div style="color:#555; padding:20px;">(empty)</div>';
            }
        }

        function renderStack(s) {
            const container = document.getElementById('stack-container');
            container.innerHTML = '';
            s.forEach((val, i) => {
                const frame = document.createElement('div');
                frame.className = `stack-frame ${i === s.length-1 ? 'active' : ''}`;
                frame.textContent = val;
                container.appendChild(frame);
            });
            if (s.length === 0) {
                container.innerHTML = '<div style="color:#555; padding:40px 0; text-align:center;">(empty)</div>';
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderQueue(step.queue);
            renderStack(step.stack);
            document.getElementById('main-panel').innerHTML = step.panel;

            const logDiv = document.getElementById('log-container');
            logDiv.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                const line = document.createElement('div');
                line.style.margin = '4px 0';
                line.innerHTML = steps[i].log;
                logDiv.appendChild(line);
            }
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function nextStep() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function backStep() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function resetAll() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(nextStep, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
