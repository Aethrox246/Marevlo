<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Fibonacci Heap (Naive Array PQ)</title>

<style>

:root{
    --bg-page:#0d1117;
    --bg-surface:#161b22;
    --border-main:#30363d;

    --btn-bg:#21262d;
    --btn-hover:#2d333b;

    --text-main:#c9d1d9;
    --text-dim:#8b949e;

    --accent-purple:#a371f7;
    --accent-blue:#388bfd;
    --accent-green:#3fb950;
    --accent-orange:#e3b341;
}

*{
    box-sizing:border-box;
}

body{
    background-color:var(--bg-page);

    color:var(--text-main);

    font-family:system-ui,-apple-system,sans-serif;

    margin:0;

    padding:20px 0;

    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:var(--accent-purple);

    margin:0 0 8px 0;
}

.input-bar{

    width:100%;

    max-width:1100px;

    background:var(--bg-surface);

    padding:12px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    justify-content:center;

    border-bottom:1px solid var(--border-main);

    margin-bottom:20px;
}

button{

    padding:8px 16px;

    background:var(--btn-bg);

    border:1px solid var(--border-main);

    color:var(--text-main);

    border-radius:6px;

    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.array{

    display:flex;

    gap:8px;

    padding:20px;

    background:#21262d;

    border-radius:10px;

    min-height:90px;

    flex-wrap:wrap;

    width:100%;

    max-width:900px;
}

.tile{

    padding:14px 22px;

    border-radius:8px;

    font-family:monospace;

    font-size:18px;

    min-width:58px;

    text-align:center;

    transition:all 0.3s;

    border:2px solid var(--accent-blue);
}

.tile.min{

    border-color:var(--accent-green);

    box-shadow:0 0 15px var(--accent-green);
}

.info{

    text-align:center;

    margin:16px 0;

    font-family:monospace;

    line-height:1.6;
}

.action-panel{

    background:var(--bg-surface);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:18px;

    width:100%;

    max-width:900px;

    min-height:140px;

    margin:20px 0;

    font-family:monospace;

    line-height:1.7;
}

.controls{

    margin:20px 0;

    display:flex;

    align-items:center;

    gap:16px;

    flex-wrap:wrap;

    justify-content:center;
}

.log-panel{

    background:var(--bg-page);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:16px;

    width:100%;

    max-width:900px;

    height:240px;

    overflow-y:auto;

    font-family:'Courier New', monospace;

    font-size:14px;
}

</style>
</head>

<body>

<h1>Fibonacci Heap (Naive Array PQ)</h1>

<p style="
color:var(--text-dim);
margin-bottom:20px;
">
Linear Scan for extract-min
</p>

<div class="input-bar">

    <button onclick="loadExample(0)">
        Example 1
    </button>

    <button onclick="loadExample(1)">
        Example 2
    </button>

    <button onclick="resetSim()">
        Reset
    </button>

</div>

<div class="array"
     id="array-vis"></div>

<div class="info">

    Size:
    <span id="size-val">0</span>

    |

    Min:
    <span id="min-val"
          style="
          color:var(--accent-green)
          ">
          —
    </span>

</div>

<div class="action-panel"
     id="action">

Click an example to begin

</div>

<div class="controls">

    <button onclick="prevStep()">
        ← Back
    </button>

    <button onclick="togglePlay()"
            id="play-btn">

        ▶ Play

    </button>

    <button onclick="nextStep()">
        Next →
    </button>

    <label>

        Speed

        <input type="range"
               id="speed"
               min="0"
               max="2"
               value="1">

    </label>

</div>

<div class="log-panel"
     id="log"></div>

<script>

let arr = [];

let steps = [];

let stepIdx = 0;

let timer = null;

let isPlaying = false;

const delays = [1650,850,380];

const examples = [

    [
        "insert(5)",
        "insert(2)",
        "insert(8)",
        "insert(1)",
        "extractMin()",
        "extractMin()",
        "insert(3)",
        "extractMin()"
    ],

    [
        "insert(10)",
        "extractMin()",
        "insert(7)",
        "insert(4)",
        "extractMin()",
        "extractMin()",
        "extractMin()"
    ]
];

function findMinIndex(a){

    if(a.length === 0){

        return -1;
    }

    let minIdx = 0;

    for(let i = 1; i < a.length; i++){

        if(a[i] < a[minIdx]){

            minIdx = i;
        }
    }

    return minIdx;
}

function generateSteps(ops){

    arr = [];

    steps = [];

    let outputs = [];

    steps.push({

        panel:
            `<b>Initialize</b><br>
            arr = []`,

        log:
            `Empty priority queue`,

        array:[],

        action:'Initialize'
    });

    for(let op of ops){

        // INSERT

        if(op.startsWith("insert")){

            const val =
                parseInt(
                    op.match(/\d+/)[0]
                );

            arr.push(val);

            steps.push({

                panel:
                    `Insert ${val}<br>
                    arr = [${arr.join(', ')}]`,

                log:
                    `Inserted ${val}`,

                array:[...arr],

                action:
                    `Insert ${val}`
            });
        }

        // EXTRACT MIN

        else if(op === "extractMin()"){

            if(arr.length === 0){

                outputs.push("None");

                steps.push({

                    panel:
                        `Extract-min<br>
                        Queue empty → None`,

                    log:
                        `Extract-min: None`,

                    array:[],

                    action:'Empty'
                });

                continue;
            }

            // FIND MIN

            const minIdx =
                findMinIndex(arr);

            const minVal =
                arr[minIdx];

            outputs.push(
                String(minVal)
            );

            // CORRECT SWAP

            [
                arr[minIdx],
                arr[arr.length - 1]
            ] = [
                arr[arr.length - 1],
                arr[minIdx]
            ];

            // REMOVE LAST

            arr.pop();

            steps.push({

                panel:
                    `Extract-min:
                    ${minVal}<br>
                    Array after removal:
                    [${arr.join(', ')}]`,

                log:
                    `Extracted ${minVal}`,

                array:[...arr],

                action:
                    `Extracted ${minVal}`
            });
        }
    }

    // FINAL OUTPUT

    steps.push({

        panel:
            `<b>FINAL OUTPUT</b><br>
            ${outputs.join(', ')}`,

        log:
            `Final Output:
            ${outputs.join(', ')}`,

        array:[...arr],

        action:'Final'
    });
}

function renderArray(a){

    const container =
        document.getElementById(
            'array-vis'
        );

    container.innerHTML = '';

    const minIdx =
        findMinIndex(a);

    a.forEach((val,i)=>{

        const tile =
            document.createElement('div');

        tile.className =
            'tile';

        if(i === minIdx){

            tile.classList.add(
                'min'
            );
        }

        tile.textContent = val;

        container.appendChild(tile);
    });

    document.getElementById(
        'size-val'
    ).textContent =
        a.length;

    if(minIdx !== -1){

        document.getElementById(
            'min-val'
        ).textContent =
            a[minIdx];

    }else{

        document.getElementById(
            'min-val'
        ).textContent =
            '—';
    }
}

function renderStep(idx){

    stepIdx = idx;

    const step =
        steps[idx];

    if(!step) return;

    document.getElementById(
        'action'
    ).innerHTML =
        step.panel || '—';

    renderArray(step.array);

    const logEl =
        document.getElementById(
            'log'
        );

    logEl.innerHTML =
        steps
        .slice(0,idx+1)
        .map(
            s=>`
            <div style="
            margin:5px 0;
            ">
            ${s.log}
            </div>`
        )
        .join('');

    logEl.scrollTop =
        logEl.scrollHeight;
}

function nextStep(){

    if(
        stepIdx <
        steps.length - 1
    ){

        renderStep(stepIdx + 1);

    }else{

        pause();
    }
}

function prevStep(){

    if(stepIdx > 0){

        renderStep(stepIdx - 1);
    }
}

function resetSim(){

    pause();

    stepIdx = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(isPlaying){

        pause();

    }else{

        isPlaying = true;

        btn.textContent =
            '❚❚ Pause';

        timer =
            setInterval(()=>{

                if(
                    stepIdx <
                    steps.length - 1
                ){

                    nextStep();

                }else{

                    pause();
                }

            },delays[
                document.getElementById(
                    'speed'
                ).value
            ]);
    }
}

function pause(){

    clearInterval(timer);

    isPlaying = false;

    document.getElementById(
        'play-btn'
    ).textContent =
        '▶ Play';
}

function loadExample(n){

    generateSteps(
        examples[n]
    );

    resetSim();
}

window.onload = ()=>{

    loadExample(0);
};

</script>

</body>
</html>
