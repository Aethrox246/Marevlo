<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expression Add Operators</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 8px 0; }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .viz {
            display: flex;
            gap: 60px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .current-expr {
            background: #21262d;
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px;
            font-family: monospace;
            font-size: 24px;
            min-width: 300px;
            text-align: center;
        }

        .state {
            margin: 20px 0;
            font-family: monospace;
            text-align: center;
        }

        .info {
            margin: 20px 0;
            text-align: center;
            font-family: monospace;
            line-height: 1.6;
        }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 18px;
            width: 100%;
            max-width: 1000px;
            min-height: 140px;
            margin: 20px 0;
            font-family: monospace;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px;
            width: 100%;
            max-width: 1000px;
            height: 240px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .found {
            margin-top: 20px;
            width: 100%;
            max-width: 1000px;
        }
    </style>
</head>
<body>

    <h1>Expression Add Operators</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">Backtracking with On-the-Fly Evaluation</p>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetSim()">Reset</button>
    </div>

    <div class="viz">
        <div>
            <div class="label">Current Expression</div>
            <div class="current-expr" id="current-expr">—</div>
        </div>

        <div class="state">
            <div>Total: <span id="total-val" style="color:var(--accent-green)">—</span></div>
            <div>Last: <span id="last-val" style="color:var(--accent-orange)">—</span></div>
            <div>Index: <span id="idx-val" style="color:var(--accent-blue)">—</span></div>
        </div>
    </div>

    <div class="info" id="info">
        Found Solutions: <span id="found-count" style="color:var(--accent-green)">0</span>
    </div>

    <div class="action-panel" id="action">Click an example to begin</div>

    <div class="controls">
        <button onclick="prevStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <div class="found">
        <div class="label">Found Expressions</div>
        <div id="found-list" style="font-family:monospace; background:#21262d; padding:12px; border-radius:8px;"></div>
    </div>

    <script>
        let numStr = "";
        let target = 0;
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1650, 850, 380];
        let found = [];

        const examples = [
            {num: "123", target: 6},
            {num: "232", target: 8}
        ];

        function backtrackSimulation() {
            // Simplified step generation for visualization
            steps = [];
            found = [];

            // Example 1: "123" -> 6
            if (numStr === "123") {
                steps.push({expr: "1", total: 1, last: 1, idx: 1, action: "Start with 1"});
                steps.push({expr: "1+2", total: 3, last: 2, idx: 2, action: "Add +2"});
                steps.push({expr: "1+2+3", total: 6, last: 3, idx: 3, action: "Add +3 → Match!"});
                found.push("1+2+3");

                steps.push({expr: "1*2", total: 2, last: 2, idx: 2, action: "1*2"});
                steps.push({expr: "1*2*3", total: 6, last: 6, idx: 3, action: "1*2*3 → Match!"});
                found.push("1*2*3");
            } else if (numStr === "232") {
                steps.push({expr: "2", total: 2, last: 2, idx: 1, action: "Start with 2"});
                steps.push({expr: "2+3", total: 5, last: 3, idx: 2, action: "2+3"});
                steps.push({expr: "2+3*2", total: 8, last: 6, idx: 3, action: "2+3*2 → Match!"});
                found.push("2+3*2");

                steps.push({expr: "2*3", total: 6, last: 6, idx: 2, action: "2*3"});
                steps.push({expr: "2*3+2", total: 8, last: 2, idx: 3, action: "2*3+2 → Match!"});
                found.push("2*3+2");
            }

            // Add final step
            steps.push({
                expr: "Done",
                total: target,
                last: 0,
                idx: numStr.length,
                action: `Found ${found.length} expressions`
            });
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('current-expr').textContent = step.expr || '—';
            document.getElementById('total-val').textContent = step.total !== undefined ? step.total : '—';
            document.getElementById('last-val').textContent = step.last !== undefined ? step.last : '—';
            document.getElementById('idx-val').textContent = step.idx !== undefined ? step.idx : '—';

            document.getElementById('action').innerHTML = `<b>${step.action}</b>`;

            // Update found list
            const foundList = document.getElementById('found-list');
            foundList.innerHTML = found.map(f => `<div style="margin:4px 0;">${f}</div>`).join('');

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx + 1).map(s => 
                `<div style="margin:5px 0;">${s.action} → ${s.expr} (total=${s.total})</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            const ex = examples[n];
            numStr = ex.num;
            target = ex.target;
            backtrackSimulation();
            resetSim();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
