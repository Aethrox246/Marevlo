<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sort Stack Visualization</title>

<style>

:root{
    --bg-page:#000000;
    --bg-surface:#161b22;
    --bg-input:#000000;
    --border-main:#30363d;

    --btn-bg:#21262d;
    --btn-hover:#2d333b;

    --text-main:#c9d1d9;
    --text-dim:#8b949e;

    --accent-orange:#e3b341;
    --accent-blue:#388bfd;
    --accent-green:#3fb950;
    --accent-red:#f85149;
    --accent-purple:#a371f7;
}

*{
    box-sizing:border-box;
}

body{
    background-color:var(--bg-page);
    color:var(--text-main);
    font-family:system-ui,-apple-system,sans-serif;

    margin:0;

    display:flex;
    flex-direction:column;
    align-items:center;

    min-height:100vh;

    padding-bottom:40px;
}

.input-bar{
    width:100%;

    background-color:var(--bg-surface);

    padding:12px 16px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;

    border-bottom:1px solid var(--border-main);

    flex-wrap:wrap;
}

label.ui-label{
    font-family:'Courier New', monospace;
    font-size:13px;
    color:var(--text-dim);
}

input[type="text"]{
    background:var(--bg-input);

    border:1px solid var(--border-main);

    color:var(--text-main);

    height:32px;

    border-radius:6px;

    padding:0 12px;

    width:420px;

    font-size:14px;
}

button{
    height:32px;

    border-radius:6px;

    padding:0 14px;

    background:var(--btn-bg);

    border:1px solid var(--border-main);

    color:var(--text-main);

    font-size:13px;

    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.visual-container{
    margin-top:30px;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:30px;

    width:100%;
    max-width:1100px;
}

.stack-container{
    background:#161b22;

    border:3px solid var(--accent-purple);

    border-radius:12px;

    padding:16px;

    min-width:380px;
}

.stack-label{
    color:var(--accent-purple);

    font-weight:bold;

    margin-bottom:10px;

    text-align:center;
}

.stack-box{
    background:#21262d;

    border:2px solid var(--border-main);

    border-radius:8px;

    padding:12px;

    min-height:260px;

    display:flex;

    flex-direction:column-reverse;

    gap:8px;

    align-items:center;
}

.stack-tile{
    width:58px;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    font-size:22px;
    font-weight:700;

    font-family:'Courier New', monospace;

    border:2px solid var(--accent-purple);

    background:#1a1f2e;

    color:var(--accent-purple);
}

.action-panel{
    margin-top:20px;

    background:var(--bg-surface);

    border:1px solid var(--border-main);

    border-radius:8px;

    padding:18px 26px;

    width:780px;

    min-height:150px;

    font-family:monospace;

    font-size:15px;

    line-height:1.65;
}

.info-panel{
    margin:15px 0;

    display:flex;

    gap:20px;

    flex-wrap:wrap;

    justify-content:center;
}

.info-cell{
    background:var(--bg-surface);

    border:1px solid var(--border-main);

    border-radius:8px;

    padding:12px 22px;

    min-width:140px;

    text-align:center;
}

.info-label{
    font-size:11px;
    color:var(--text-dim);
}

.info-value{
    font-family:monospace;

    font-size:18px;

    font-weight:700;
}

.status-bar{
    margin-top:8px;

    font-size:14px;

    color:var(--text-dim);

    min-height:28px;
}

.controls{
    margin-top:20px;

    display:flex;

    align-items:center;

    gap:12px;

    flex-wrap:wrap;

    justify-content:center;
}

input[type="range"]{
    accent-color:var(--accent-blue);

    width:160px;
}

.legend{
    margin-top:15px;

    display:flex;

    gap:22px;

    flex-wrap:wrap;

    justify-content:center;

    font-size:13px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:8px;
}

.log-panel{
    margin-top:20px;

    background:var(--bg-page);

    border:1px solid var(--border-main);

    border-radius:8px;

    padding:14px 18px;

    width:780px;

    max-width:95%;

    height:190px;

    overflow-y:auto;

    font-family:'Courier New', monospace;

    font-size:13px;

    line-height:1.5;
}

</style>
</head>

<body>

<div class="input-bar">

    <label class="ui-label">
        Stack (top to bottom):
    </label>

    <input type="text"
           id="stack-input"
           value="[5,1,4,2,3]">

    <button onclick="loadCustom()">
        Load
    </button>

    <button onclick="loadExample(0)">
        Ex 1
    </button>

    <button onclick="loadExample(1)">
        Ex 2
    </button>

</div>

<div class="visual-container">

    <div style="
        display:flex;
        gap:60px;
        align-items:flex-start;
    ">

        <!-- ORIGINAL -->

        <div class="stack-container">

            <div class="stack-label">
                Original Stack
            </div>

            <div class="stack-box"
                 id="original-stack"></div>

        </div>

        <!-- TEMP -->

        <div class="stack-container">

            <div class="stack-label">
                Temp Sorted Stack
            </div>

            <div class="stack-box"
                 id="sorted-stack"></div>

        </div>

    </div>

    <!-- FINAL -->

    <div>

        <div class="ui-label">
            Final Sorted Stack (top to bottom)
        </div>

        <div class="stack-box"
             id="final-stack"
             style="
                min-height:120px;
                border-color:var(--accent-green);
             "></div>

    </div>

</div>

<!-- PANEL -->

<div class="action-panel"
     id="main-panel">

    —

</div>

<!-- INFO -->

<div class="info-panel">

    <div class="info-cell">

        <span class="info-label">
            Original Size
        </span>

        <span class="info-value"
              id="orig-size"
              style="color:var(--accent-blue)">
            0
        </span>

    </div>

    <div class="info-cell">

        <span class="info-label">
            Temp Size
        </span>

        <span class="info-value"
              id="temp-size"
              style="color:var(--accent-purple)">
            0
        </span>

    </div>

</div>

<div class="status-bar"
     id="status-text"></div>

<!-- CONTROLS -->

<div class="controls">

    <button onclick="reset()">
        ↺ Reset
    </button>

    <button onclick="back()">
        ← Back
    </button>

    <button onclick="togglePlay()"
            id="play-btn">
        Play
    </button>

    <button onclick="next()">
        Next →
    </button>

</div>

<!-- LOG -->

<div class="log-panel"
     id="log"></div>

<script>

let original = [];

let tempSorted = [];

let steps = [];

let stepIndex = 0;

let timer = null;

const delays = [1600,850,400];

const examples = [

    [5,1,4,2,3],

    [10,-5,0,7,-2]
];

function generateSteps(inputStack){

    original = [...inputStack];

    tempSorted = [];

    steps = [];

    steps.push({

        original:[...original],

        temp:[],

        panel:
            `<b>Sort Stack Using Extra Stack</b><br>
            Input: [${original.join(', ')}]`,

        statusText:`Start`,

        log:
            `Start: original = [${original.join(', ')}]`
    });

    let input = [...original];

    let sorted = [];

    while(input.length > 0){

        let temp = input.pop();

        steps.push({

            original:[...input],

            temp:[...sorted],

            panel:
                `Pop <b>${temp}</b> from original stack`,

            statusText:`Pop ${temp}`,

            log:`Pop ${temp}`
        });

        while(
            sorted.length &&
            sorted[sorted.length - 1] > temp
        ){

            input.push(sorted.pop());

            steps.push({

                original:[...input],

                temp:[...sorted],

                panel:
                    `Move larger element back to original stack`,

                statusText:`Shift element`,

                log:`Shift larger element`
            });
        }

        sorted.push(temp);

        steps.push({

            original:[...input],

            temp:[...sorted],

            panel:
                `Push <b>${temp}</b> into sorted stack`,

            statusText:`Push ${temp}`,

            log:`Push ${temp}`
        });
    }

    // FIXED OUTPUT

    original = [];

    while(sorted.length){

        original.push(sorted.pop());
    }

    // FINAL STEP

    steps.push({

        original:[...original],

        temp:[],

        panel:
            `<b>
            Sorted stack:
            [${original.join(', ')}]
            (top to bottom)
            </b>`,

        statusText:`Done`,

        log:
            `Final Sorted Stack:
             [${original.join(', ')}]`
    });
}

function renderOriginal(){

    const container =
        document.getElementById(
            'original-stack'
        );

    container.innerHTML = '';

    for(let i = original.length - 1; i >= 0; i--){

        const tile =
            document.createElement('div');

        tile.className = 'stack-tile';

        tile.textContent = original[i];

        container.appendChild(tile);
    }
}

function renderTemp(){

    const container =
        document.getElementById(
            'sorted-stack'
        );

    container.innerHTML = '';

    for(let i = tempSorted.length - 1; i >= 0; i--){

        const tile =
            document.createElement('div');

        tile.className = 'stack-tile';

        tile.textContent = tempSorted[i];

        container.appendChild(tile);
    }
}

function renderFinal(){

    const container =
        document.getElementById(
            'final-stack'
        );

    container.innerHTML = '';

    // CORRECT ORDER FIX

    for(let i = 0; i < original.length; i++){

        const tile =
            document.createElement('div');

        tile.className = 'stack-tile';

        tile.textContent = original[i];

        container.appendChild(tile);
    }
}

function renderStep(idx){

    const step = steps[idx];

    if(!step) return;

    original = [...step.original];

    tempSorted = [...step.temp];

    renderOriginal();

    renderTemp();

    renderFinal();

    document.getElementById(
        'main-panel'
    ).innerHTML = step.panel;

    document.getElementById(
        'orig-size'
    ).innerText = original.length;

    document.getElementById(
        'temp-size'
    ).innerText = tempSorted.length;

    document.getElementById(
        'status-text'
    ).innerText = step.statusText;

    const logPanel =
        document.getElementById(
            'log'
        );

    logPanel.innerHTML = '';

    for(let k = 0; k <= idx; k++){

        const line =
            document.createElement('div');

        line.innerText = steps[k].log;

        logPanel.appendChild(line);
    }

    logPanel.scrollTop =
        logPanel.scrollHeight;
}

function next(){

    if(stepIndex < steps.length - 1){

        stepIndex++;

        renderStep(stepIndex);

    }else{

        pause();
    }
}

function back(){

    if(stepIndex > 0){

        stepIndex--;

        renderStep(stepIndex);
    }
}

function reset(){

    pause();

    stepIndex = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(timer){

        pause();

    }else{

        btn.innerText = 'Pause';

        timer = setInterval(()=>{

            if(stepIndex < steps.length - 1){

                next();

            }else{

                pause();
            }

        },1000);
    }
}

function pause(){

    clearInterval(timer);

    timer = null;

    document.getElementById(
        'play-btn'
    ).innerText = 'Play';
}

function loadCustom(){

    try{

        const input =
            document.getElementById(
                'stack-input'
            ).value;

        const parsed =
            JSON.parse(input);

        if(Array.isArray(parsed)){

            generateSteps(parsed);

            reset();
        }

    }catch(e){

        alert(
            "Enter valid array like [5,1,4,2,3]"
        );
    }
}

function loadExample(idx){

    document.getElementById(
        'stack-input'
    ).value =
        JSON.stringify(examples[idx]);

    generateSteps(examples[idx]);

    reset();
}

window.onload = () => {

    loadExample(0);
};

</script>

</body>
</html>
