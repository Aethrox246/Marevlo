<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Stacks in One Array - Full Visualization</title>

    <style>

        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-bar {
            background: var(--bg-surface);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: var(--btn-hover);
        }

        .visual-container {
            display: flex;
            gap: 40px;
            margin-top: 20px;
            align-items: flex-start;
        }

        .array-area {
            text-align: center;
        }

        .array-container {
            display: flex;
            gap: 8px;
            padding: 25px 30px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 12px;
            min-height: 130px;
            align-items: center;
        }

        .array-slot {
            width: 62px;
            height: 82px;
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            transition: all 0.4s ease;
        }

        .array-slot.stack1 {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px var(--accent-blue);
        }

        .array-slot.stack2 {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-green);
        }

        .array-slot.highlight {
            transform: scale(1.15);
            background: #2d3748;
            box-shadow: 0 0 25px var(--accent-orange);
        }

        .stack-area {
            text-align: center;
        }

        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            width: 160px;
            height: 320px;
            border: 2px solid var(--border-main);
            border-radius: 12px;
            padding: 15px;
            background: rgba(22, 27, 34, 0.8);
            overflow-y: auto;
        }

        .stack-frame {
            padding: 12px;
            background: #21262d;
            border: 1px solid var(--border-main);
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .action-panel {
            margin: 25px 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 20px;
            width: 900px;
            min-height: 140px;
            text-align: center;
            line-height: 1.6;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .log-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            height: 240px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            width: 900px;
            margin-top: 15px;
        }

    </style>
</head>

<body>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1 (n=6)</button>
        <button onclick="loadExample(1)">Example 2 (n=4)</button>
        <button onclick="resetAll()">Reset</button>
    </div>

    <div class="visual-container">

        <!-- STACK 1 -->

        <div class="stack-area">

            <div style="
                color:var(--accent-blue);
                font-weight:bold;
                margin-bottom:8px;
            ">
                Stack 1 (Left → Right)
            </div>

            <div id="stack1-container" class="stack-container"></div>

        </div>

        <!-- SHARED ARRAY -->

        <div class="array-area">

            <div style="
                color:var(--accent-orange);
                font-weight:bold;
                margin-bottom:8px;
            ">
                Shared Array
            </div>

            <div id="array-container" class="array-container"></div>

        </div>

        <!-- STACK 2 -->

        <div class="stack-area">

            <div style="
                color:var(--accent-green);
                font-weight:bold;
                margin-bottom:8px;
            ">
                Stack 2 (Right ← Left)
            </div>

            <div id="stack2-container" class="stack-container"></div>

        </div>

    </div>

    <!-- MAIN PANEL -->

    <div class="action-panel" id="main-panel">

        Click Play to start demonstration

    </div>

    <!-- CONTROLS -->

    <div class="controls">

        <button onclick="resetAll()">↺ Reset</button>

        <button onclick="backStep()">← Back</button>

        <button onclick="togglePlay()" id="play-btn">
            ▶ Play
        </button>

        <button onclick="nextStep()">Next →</button>

        <span style="margin-left:20px">Speed:</span>

        <input type="range" id="speed-slider"
               min="0" max="2" value="1">

    </div>

    <!-- LOGS -->

    <div class="log-container" id="log-container"></div>

    <script>

        let arr = [];
        let top1 = -1;
        let top2 = 0;
        let capacity = 6;

        let steps = [];
        let stepIndex = 0;

        let timer = null;

        const delays = [1800, 1100, 550];

        function init() {

            loadExample(0);
        }

        function loadExample(ex) {

            pause();

            capacity = ex === 0 ? 6 : 4;

            arr = new Array(capacity).fill(null);

            top1 = -1;
            top2 = capacity;

            steps = [];

            document.getElementById(
                'log-container'
            ).innerHTML = '';

            if (ex === 0) {

                addStep(
                    "Initialize array of size 6",
                    "top1 = -1 , top2 = 6",
                    -1
                );

                push1Step(10);

                push2Step(20);

                push1Step(30);

                pop1Step();

                push2Step(40);

                pop2Step();

            } else {

                addStep(
                    "Initialize array of size 4",
                    "top1 = -1 , top2 = 4",
                    -1
                );

                push1Step(1);

                push1Step(2);

                push2Step(3);

                push2Step(4);

                pop1Step();

                pop2Step();
            }

            stepIndex = 0;

            renderStep(0);
        }

        // STORE STEP

        function addStep(text, action = "", highlightIndex = -1) {

            steps.push({

                panel: text,

                action: action,

                highlightIndex: highlightIndex,

                arr: [...arr],

                top1: top1,

                top2: top2,

                log: text
            });
        }

        // PUSH STACK 1

        function push1Step(val) {

            if (top1 + 1 < top2) {

                top1++;

                arr[top1] = val;

                addStep(
                    `Push <b>${val}</b> into 
                    <span style="color:var(--accent-blue)">
                    Stack 1
                    </span>`,

                    `Stack 1 PUSH → arr[${top1}] = ${val}`,

                    top1
                );

            } else {

                addStep(
                    `Push ${val} into Stack 1`,
                    `Stack 1 Overflow`,
                    -1
                );
            }
        }

        // PUSH STACK 2

        function push2Step(val) {

            if (top2 - 1 > top1) {

                top2--;

                arr[top2] = val;

                addStep(
                    `Push <b>${val}</b> into 
                    <span style="color:var(--accent-green)">
                    Stack 2
                    </span>`,

                    `Stack 2 PUSH → arr[${top2}] = ${val}`,

                    top2
                );

            } else {

                addStep(
                    `Push ${val} into Stack 2`,
                    `Stack 2 Overflow`,
                    -1
                );
            }
        }

        // POP STACK 1

        function pop1Step() {

            if (top1 >= 0) {

                const val = arr[top1];

                addStep(
                    `Pop from 
                    <span style="color:var(--accent-blue)">
                    Stack 1
                    </span>`,

                    `Stack 1 POP → remove ${val} from arr[${top1}]`,

                    top1
                );

                arr[top1] = null;

                top1--;

            } else {

                addStep(
                    `Pop from Stack 1`,
                    `Stack 1 Underflow`,
                    -1
                );
            }
        }

        // POP STACK 2

        function pop2Step() {

            if (top2 < capacity) {

                const val = arr[top2];

                addStep(
                    `Pop from 
                    <span style="color:var(--accent-green)">
                    Stack 2
                    </span>`,

                    `Stack 2 POP → remove ${val} from arr[${top2}]`,

                    top2
                );

                arr[top2] = null;

                top2++;

            } else {

                addStep(
                    `Pop from Stack 2`,
                    `Stack 2 Underflow`,
                    -1
                );
            }
        }

        // RENDER ARRAY

        function renderArray(highlightIdx = -1) {

            const container =
                document.getElementById('array-container');

            container.innerHTML = '';

            arr.forEach((val, i) => {

                const slot = document.createElement('div');

                slot.className =
                    `array-slot
                    ${i <= top1 ? 'stack1' : ''}
                    ${i >= top2 ? 'stack2' : ''}`;

                if (i === highlightIdx) {

                    slot.classList.add('highlight');
                }

                slot.innerHTML =
                    val !== null ? `<b>${val}</b>` : '—';

                container.appendChild(slot);
            });
        }

        // RENDER STACK 1

        function renderStack1() {

            const container =
                document.getElementById('stack1-container');

            container.innerHTML = '';

            for (let i = top1; i >= 0; i--) {

                const frame =
                    document.createElement('div');

                frame.className = 'stack-frame';

                frame.style.borderColor = '#58a6ff';

                frame.textContent = arr[i];

                container.appendChild(frame);
            }

            if (top1 < 0) {

                container.innerHTML =
                    '<div style="color:#555;padding:30px 0;">(Stack 1 Empty)</div>';
            }
        }

        // RENDER STACK 2

        function renderStack2() {

            const container =
                document.getElementById('stack2-container');

            container.innerHTML = '';

            for (let i = top2; i < capacity; i++) {

                const frame =
                    document.createElement('div');

                frame.className = 'stack-frame';

                frame.style.borderColor = '#3fb950';

                frame.textContent = arr[i];

                container.appendChild(frame);
            }

            if (top2 >= capacity) {

                container.innerHTML =
                    '<div style="color:#555;padding:30px 0;">(Stack 2 Empty)</div>';
            }
        }

        // RENDER STEP

        function renderStep(idx) {

            const step = steps[idx];

            if (!step) return;

            arr = [...step.arr];

            top1 = step.top1;

            top2 = step.top2;

            renderArray(step.highlightIndex);

            renderStack1();

            renderStack2();

            document.getElementById(
                'main-panel'
            ).innerHTML = `

                <div style="
                    font-size:24px;
                    margin-bottom:10px;
                    font-weight:bold;
                ">
                    ${step.panel}
                </div>

                <div style="
                    color: var(--accent-orange);
                    font-size:19px;
                    font-weight:bold;
                    margin-top:10px;
                ">
                    ${step.action}
                </div>

                <div style="
                    margin-top:18px;
                    font-size:17px;
                    color:#8b949e;
                ">
                    top1 = ${step.top1}
                    &nbsp;&nbsp;&nbsp;&nbsp;

                    top2 = ${step.top2}
                </div>
            `;

            const logDiv =
                document.getElementById('log-container');

            logDiv.innerHTML = '';

            for (let i = 0; i <= idx; i++) {

                const line =
                    document.createElement('div');

                line.style.margin = '6px 0';

                line.innerHTML = `
                    <span style="color:#58a6ff">
                        Step ${i}
                    </span>

                    : ${steps[i].action || steps[i].log}
                `;

                logDiv.appendChild(line);
            }

            logDiv.scrollTop =
                logDiv.scrollHeight;
        }

        // NEXT STEP

        function nextStep() {

            if (stepIndex < steps.length - 1) {

                stepIndex++;

                renderStep(stepIndex);

            } else {

                pause();
            }
        }

        // BACK STEP

        function backStep() {

            if (stepIndex > 0) {

                stepIndex--;

                renderStep(stepIndex);
            }
        }

        // RESET

        function resetAll() {

            pause();

            stepIndex = 0;

            renderStep(0);
        }

        // PLAY

        function togglePlay() {

            const btn =
                document.getElementById('play-btn');

            if (timer) {

                pause();

            } else {

                btn.textContent = 'Pause';

                if (stepIndex >= steps.length - 1) {

                    stepIndex = 0;
                }

                timer = setInterval(

                    nextStep,

                    delays[
                        document.getElementById(
                            'speed-slider'
                        ).value
                    ]
                );
            }
        }

        // PAUSE

        function pause() {

            clearInterval(timer);

            timer = null;

            document.getElementById(
                'play-btn'
            ).textContent = 'Play';
        }

        window.onload = init;

    </script>

</body>
</html>
