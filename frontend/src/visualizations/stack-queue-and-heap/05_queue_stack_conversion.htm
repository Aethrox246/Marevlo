<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue to Stack Conversion - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            gap: 60px; 
            width: 100%; 
            max-width: 1200px;
            justify-content: center;
            align-items: flex-start;
        }

        .queue-area, .stack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .queue-container {
            display: flex;
            gap: 8px;
            padding: 20px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 12px;
            min-height: 100px;
            align-items: center;
        }

        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            width: 160px;
            height: 320px;
            border: 2px solid var(--border-main);
            border-radius: 12px;
            padding: 15px;
            background: rgba(22, 27, 34, 0.6);
            overflow-y: auto;
        }

        .queue-slot, .stack-frame {
            padding: 12px 18px;
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
            transition: all 0.4s ease;
        }

        .queue-slot.front {
            border-color: var(--accent-orange);
            box-shadow: 0 0 12px var(--accent-orange);
        }

        .stack-frame.active {
            background: #0d2244;
            border-color: var(--accent-blue);
            transform: scale(1.05);
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 780px; text-align: center; 
            font-family: monospace; min-height: 85px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .log-panel {
            margin-top: 15px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 780px; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1 (1,2,3)</button>
        <button onclick="loadExample(1)">Example 2 (10,20)</button>
        <button onclick="reset()">Reset</button>
    </div>

    <div class="visual-container">
        <!-- Queue -->
        <div class="queue-area">
            <div class="ui-label" style="color:var(--accent-orange);font-weight:bold;">Queue (FIFO)</div>
            <div id="queue-container" class="queue-container"></div>
        </div>

        <!-- Stack -->
        <div class="stack-area">
            <div class="ui-label" style="color:var(--accent-blue);font-weight:bold;">Stack (LIFO)</div>
            <div id="stack-container" class="stack-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell" style="background:var(--bg-surface);padding:10px 16px;border-radius:6px;border:1px solid var(--border-main);">
            <span class="info-label">Queue Size</span>
            <span class="info-value" id="q-size" style="color:var(--accent-orange);">0</span>
        </div>
        <div class="info-cell" style="background:var(--bg-surface);padding:10px 16px;border-radius:6px;border:1px solid var(--border-main);">
            <span class="info-label">Stack Size</span>
            <span class="info-value" id="s-size" style="color:var(--accent-blue);">0</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:15px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let queue = [];
        let stack = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() { loadExample(0); }

        function loadExample(ex) {
            queue = [];
            stack = [];
            steps = [];
            document.getElementById('log').innerHTML = '';

            if (ex === 0) {
                // Example 1: [1,2,3] → Stack [3,2,1]
                addStep("Initialize Queue = [1, 2, 3]", [1,2,3], []);
                transferToStack1([1,2,3]);
                transferToStack2();
            } else {
                // Example 2: [10,20] → Stack [20,10]
                addStep("Initialize Queue = [10, 20]", [10,20], []);
                transferToStack1([10,20]);
                transferToStack2();
            }

            stepIndex = 0;
            renderStep(0);
        }

        function addStep(text, qState, sState) {
            steps.push({
                panel: text,
                queue: [...qState],
                stack: [...sState],
                log: text
            });
        }

        function transferToStack1(initialQueue) {
            let tempStack = [];
            let q = [...initialQueue];

            while (q.length > 0) {
                const val = q.shift();
                tempStack.push(val);
                addStep(`Dequeue ${val} from Queue → Push to Stack1`, q, tempStack);
            }
            // Now transfer from tempStack to main stack (second reversal)
            while (tempStack.length > 0) {
                const val = tempStack.pop();
                stack.push(val);
                addStep(`Pop ${val} from Stack1 → Push to Final Stack`, q, stack);
            }
        }

        function transferToStack2() {
            // Already handled in transferToStack1 for simplicity
        }

        function renderQueue(q) {
            const container = document.getElementById('queue-container');
            container.innerHTML = '';
            q.forEach((val, i) => {
                const slot = document.createElement('div');
                slot.className = `queue-slot ${i === 0 ? 'front' : ''}`;
                slot.textContent = val;
                container.appendChild(slot);
            });
            if (q.length === 0) {
                container.innerHTML = '<div style="color:#555;padding:20px;">(empty)</div>';
            }
        }

        function renderStack(s) {
            const container = document.getElementById('stack-container');
            container.innerHTML = '';
            s.forEach((val, i) => {
                const frame = document.createElement('div');
                frame.className = `stack-frame ${i === s.length-1 ? 'active' : ''}`;
                frame.textContent = val;
                container.appendChild(frame);
            });
            if (s.length === 0) {
                container.innerHTML = '<div style="color:#555;padding:40px 0;">(empty)</div>';
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderQueue(step.queue);
            renderStack(step.stack);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('q-size').innerText = step.queue.length;
            document.getElementById('s-size').innerText = step.stack.length;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                const line = document.createElement('div');
                line.style.marginBottom = '4px';
                line.innerHTML = steps[i].log;
                logPanel.appendChild(line);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
