<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove K Digits - Stack Greedy Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 380px;
            font-size: 14px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 30px; 
            width: 100%; 
            max-width: 1100px; 
        }

        .num-string {
            background: #161b22;
            border: 3px solid var(--accent-blue);
            border-radius: 12px;
            padding: 20px;
            font-family: monospace;
            font-size: 22px;
            letter-spacing: 6px;
        }
        .char {
            display: inline-block;
            padding: 6px 10px;
            margin: 0 3px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .char.current { background: var(--accent-orange); color: black; font-weight: bold; }

        .stack-container {
            background: #161b22;
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px;
            width: 420px;
        }
        .stack-label { color: var(--accent-purple); font-weight: bold; text-align: center; margin-bottom: 12px; }
        .stack-box {
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 10px;
            padding: 16px;
            min-height: 260px;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            align-items: center;
        }
        .stack-tile {
            width: 62px; height: 62px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 24px; font-weight: 700; font-family: monospace;
            border: 3px solid var(--accent-purple); background: #1a1f2e; color: var(--accent-purple);
        }

        .info-panel {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }
        .info-box {
            background: #161b22;
            border: 2px solid var(--accent-green);
            border-radius: 10px;
            padding: 12px 24px;
            text-align: center;
            min-width: 160px;
        }
        .info-label { font-size: 12px; color: var(--text-dim); }
        .info-value { font-size: 28px; font-weight: bold; font-family: monospace; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 26px; width: 780px; min-height: 160px;
            font-family: monospace; font-size: 15px; line-height: 1.65;
        }

        .controls { margin-top: 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 180px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 16px 20px; width: 780px; height: 210px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.55;
        }

        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">num (string), k:</label>
        <input type="text" id="input-data" value='{"num":"1432219","k":3}' style="width:380px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div>
            <div class="ui-label">Number String</div>
            <div class="num-string" id="num-display"></div>
        </div>

        <div class="stack-container">
            <div class="stack-label">Stack (Keeping smallest prefix)</div>
            <div class="stack-box" id="stack-box"></div>
        </div>

        <div class="info-panel">
            <div class="info-box">
                <div class="info-label">Remaining k</div>
                <div class="info-value" id="k-remaining" style="color:var(--accent-red);">3</div>
            </div>
            <div class="info-box">
                <div class="info-label">Current Result</div>
                <div class="info-value" id="curr-result" style="color:var(--accent-green);">—</div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:6px;font-size:12px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let num = "";
        let k = 0;
        let stack = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1650, 900, 420];

        const examples = [
            { num: "1432219", k: 3 },
            { num: "10200", k: 1 }
        ];

        function generateSteps(inputNum, inputK) {
            num = inputNum;
            k = inputK;
            stack = [];
            steps = [];

            let i = 0;
            let remainingK = k;

            steps.push({
                type: 'init',
                i: 0,
                stack: [],
                remainingK: remainingK,
                panel: `<b>Remove K Digits</b><br>num = "<b>${num}</b>", k = <b>${k}</b>`,
                statusText: `Start`,
                log: `Start`,
                logColor: 'var(--text-dim)'
            });

            while (i < num.length) {
                steps.push({
                    type: 'process',
                    i: i,
                    stack: [...stack],
                    remainingK: remainingK,
                    panel: `Processing digit <b>${num[i]}</b> at position ${i}`,
                    statusText: `Digit ${num[i]}`,
                    log: `  i=${i}, digit=${num[i]}, k=${remainingK}`,
                    logColor: 'var(--accent-orange)'
                });

                while (stack.length > 0 && remainingK > 0 && parseInt(stack[stack.length-1]) > parseInt(num[i])) {
                    stack.pop();
                    remainingK--;
                    steps.push({
                        type: 'remove',
                        i: i,
                        stack: [...stack],
                        remainingK: remainingK,
                        panel: `Removed larger digit <b>${stack[stack.length]}</b> (greedy)`,
                        statusText: `Remove`,
                        log: `    Pop larger digit`,
                        logColor: 'var(--accent-red)'
                    });
                }

                stack.push(num[i]);

                steps.push({
                    type: 'push',
                    i: i,
                    stack: [...stack],
                    remainingK: remainingK,
                    panel: `Pushed <b>${num[i]}</b>`,
                    statusText: `Push`,
                    log: `    Push ${num[i]}`,
                    logColor: 'var(--accent-green)'
                });

                i++;
            }

            // Remove remaining k from end
            while (remainingK > 0 && stack.length > 0) {
                stack.pop();
                remainingK--;
                steps.push({
                    type: 'trim',
                    i: i,
                    stack: [...stack],
                    remainingK: remainingK,
                    panel: `Trim remaining k from end`,
                    statusText: `Trim`,
                    log: `    Trim from end`,
                    logColor: 'var(--accent-red)'
                });
            }

            // Build final result, remove leading zeros
            let result = stack.join('');
            result = result.replace(/^0+/, '') || '0';

            steps.push({
                type: 'final',
                i: i,
                stack: [...stack],
                remainingK: remainingK,
                result: result,
                panel: `<b>Final Result: <span style="color:var(--accent-green)">${result}</span></b>`,
                statusText: `Done`,
                log: `\nFinal: ${result}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderNum(pos) {
            const container = document.getElementById('num-display');
            container.innerHTML = '';
            for (let j = 0; j < num.length; j++) {
                const span = document.createElement('span');
                span.className = 'char';
                if (j === pos) span.classList.add('current');
                span.textContent = num[j];
                container.appendChild(span);
            }
        }

        function renderStack() {
            const container = document.getElementById('stack-box');
            container.innerHTML = '';
            for (let i = stack.length - 1; i >= 0; i--) {
                const tile = document.createElement('div');
                tile.className = 'stack-tile';
                tile.textContent = stack[i];
                container.appendChild(tile);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            stack = [...(step.stack || [])];
            renderNum(step.i !== undefined ? step.i : num.length);
            renderStack();

            document.getElementById('k-remaining').innerText = step.remainingK !== undefined ? step.remainingK : 0;
            document.getElementById('curr-result').innerText = step.result || step.stack ? step.stack.join('') : '—';

            document.getElementById('main-panel').innerHTML = step.panel || '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const s = steps[k];
                if (s.log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (s.logColor) line.style.color = s.logColor;
                    if (s.bold) line.style.fontWeight = 'bold';
                    line.innerText = s.log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        function loadCustom() {
            try {
                const data = JSON.parse(document.getElementById('input-data').value);
                generateSteps(data.num, data.k);
                reset();
            } catch(e) {
                alert("Invalid JSON. Use {\"num\":\"1432219\",\"k\":3}");
            }
        }

        function loadExample(idx) {
            document.getElementById('input-data').value = JSON.stringify(examples[idx]);
            generateSteps(examples[idx].num, examples[idx].k);
            reset();
        }

        function init() {
            loadExample(0);
        }

        window.onload = init;
    </script>
</body>
</html>
