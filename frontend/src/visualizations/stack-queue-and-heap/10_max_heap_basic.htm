<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Heap Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-bar {
            background: var(--bg-surface);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container {
            display: flex;
            gap: 60px;
            margin-top: 20px;
            align-items: flex-start;
        }

        .heap-area, .output-area {
            text-align: center;
        }

        .heap-container, .output-container {
            display: flex;
            gap: 12px;
            padding: 25px 30px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 12px;
            min-height: 160px;
            align-items: flex-end;
            min-width: 380px;
        }

        .heap-slot, .output-tile {
            width: 68px;
            height: 88px;
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            position: relative;
            transition: all 0.4s ease;
        }

        .heap-slot.root {
            border-color: var(--accent-orange);
            box-shadow: 0 0 20px var(--accent-orange);
        }

        .heap-slot.current {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px var(--accent-blue);
            transform: scale(1.08);
        }

        .output-tile {
            border-color: var(--accent-green);
            background: #0f2a1a;
            color: var(--accent-green);
        }

        .action-panel {
            margin: 25px 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 18px;
            width: 820px;
            text-align: center;
            min-height: 110px;
            line-height: 1.5;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .log-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            height: 240px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 13.5px;
            width: 820px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetHeap()">Reset</button>
    </div>

    <div class="visual-container">
        <!-- Main Max Heap -->
        <div class="heap-area">
            <div style="color:var(--accent-orange); font-weight:bold;">Max Heap Array</div>
            <div id="heap-container" class="heap-container"></div>
        </div>

        <!-- Extracted Values -->
        <div class="output-area">
            <div style="color:var(--accent-green); font-weight:bold;">Extracted Max Values</div>
            <div id="output-container" class="output-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">Click Play to start automatic demonstration</div>

    <div class="controls">
        <button onclick="resetHeap()">↺ Reset</button>
        <button onclick="backStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <span style="margin-left:20px">Speed:</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="log-container" id="log-container"></div>

    <script>
        let heap = [];
        let extracted = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            heap = [];
            extracted = [];
            steps = [];
            document.getElementById('log-container').innerHTML = '';

            if (ex === 0) {
                addStep("Initialize empty Max-Heap", [], []);
                insertStep(5);
                insertStep(10);
                insertStep(3);
                extractMaxStep();
                insertStep(7);
                extractMaxStep();
            } else {
                addStep("Initialize empty Max-Heap", [], []);
                insertStep(1);
                extractMaxStep();
                insertStep(2);
                insertStep(4);
                extractMaxStep();
                extractMaxStep();
            }

            stepIndex = 0;
            renderStep(0);
        }

        function addStep(text, currentHeap, currentExtracted) {
            steps.push({
                panel: text,
                heap: [...currentHeap],
                extracted: [...currentExtracted],
                log: text
            });
        }

        function insertStep(val) {
            heap.push(val);
            bubbleUp(heap.length - 1);
            addStep(`Insert ${val} → Bubble Up`, heap, extracted);
        }

        function extractMaxStep() {
            if (heap.length === 0) {
                addStep(`ExtractMax → <span style="color:var(--accent-red)">None (Empty)</span>`, heap, extracted);
                return;
            }
            const max = heap[0];
            heap[0] = heap.pop();
            if (heap.length > 0) bubbleDown(0);
            extracted.push(max);
            addStep(`ExtractMax → ${max} → Bubble Down`, heap, extracted);
        }

        function bubbleUp(idx) {
            while (idx > 0) {
                const parent = Math.floor((idx - 1) / 2);
                if (heap[idx] > heap[parent]) {
                    [heap[idx], heap[parent]] = [heap[parent], heap[idx]];
                    idx = parent;
                } else break;
            }
        }

        function bubbleDown(idx) {
            const n = heap.length;
            while (true) {
                let largest = idx;
                const left = 2 * idx + 1;
                const right = 2 * idx + 2;
                if (left < n && heap[left] > heap[largest]) largest = left;
                if (right < n && heap[right] > heap[largest]) largest = right;
                if (largest !== idx) {
                    [heap[idx], heap[largest]] = [heap[largest], heap[idx]];
                    idx = largest;
                } else break;
            }
        }

        function renderHeap(currentHeap) {
            const container = document.getElementById('heap-container');
            container.innerHTML = '';

            currentHeap.forEach((val, i) => {
                const slot = document.createElement('div');
                slot.className = `heap-slot ${i === 0 ? 'root' : ''}`;
                const idxDiv = document.createElement('div');
                idxDiv.className = 'index';
                idxDiv.textContent = i;
                slot.appendChild(idxDiv);
                slot.innerHTML += `<div>${val}</div>`;
                container.appendChild(slot);
            });

            if (currentHeap.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = '#555';
                empty.style.padding = '40px';
                empty.textContent = '(empty)';
                container.appendChild(empty);
            }
        }

        function renderOutput(ext) {
            const container = document.getElementById('output-container');
            container.innerHTML = '';
            ext.forEach(val => {
                const tile = document.createElement('div');
                tile.className = 'output-tile';
                tile.textContent = val;
                container.appendChild(tile);
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderHeap(step.heap);
            renderOutput(step.extracted);
            document.getElementById('main-panel').innerHTML = step.panel;

            const logDiv = document.getElementById('log-container');
            logDiv.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                const line = document.createElement('div');
                line.style.margin = '4px 0';
                line.innerHTML = steps[i].log;
                logDiv.appendChild(line);
            }
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function nextStep() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function backStep() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function resetHeap() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(nextStep, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
