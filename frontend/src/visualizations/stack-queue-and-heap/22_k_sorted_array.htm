<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Sorted Array - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 320px;
            font-size: 13px;
        }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 80px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; max-width: 1000px; }

        .array-tiles {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            background: #161b22;
            border: 2px solid var(--border-main);
            border-radius: 12px;
        }
        .tile {
            width: 62px; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 2px solid var(--border-main); background: #21262d; color: var(--text-main);
            transition: all 0.4s ease;
        }
        .tile.current { border-color: var(--accent-orange); background: #2a1600; transform: scale(1.15); }
        .tile.extracted { border-color: var(--accent-green); background: #0f2a1a; }

        .heap-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .heap-label { color: var(--accent-purple); font-weight: bold; }
        .heap-box {
            background: #161b22;
            border: 2px solid var(--accent-purple);
            border-radius: 10px;
            padding: 12px;
            min-height: 180px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            max-width: 400px;
        }
        .heap-tile {
            width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            background: #21262d; border: 2px solid var(--accent-purple); border-radius: 8px;
            font-size: 18px; font-weight: bold; color: var(--accent-purple);
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 26px; width: 760px; min-height: 140px;
            font-family: monospace; font-size: 15px; line-height: 1.65;
        }

        .result-tiles {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #161b22;
            border: 2px solid var(--accent-green);
            border-radius: 10px;
        }

        .info-panel { margin: 15px 0; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 8px;
            padding: 12px 22px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .status-bar { margin-top: 8px; font-size: 14px; color: var(--text-dim); min-height: 28px; }

        .controls { margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 15px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 14px 18px; width: 760px; max-width: 95%; height: 180px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Array:</label>
        <input type="text" id="arr-input" value="[6, 5, 3, 2, 8, 10, 9]" style="width: 320px;">
        <label class="ui-label">k =</label>
        <input type="number" id="k-input" value="3" style="width: 80px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div>
            <div class="ui-label">Input Array</div>
            <div class="array-tiles" id="input-tiles"></div>
        </div>

        <div class="heap-container">
            <div class="heap-label">Min-Heap (size ≤ k+1)</div>
            <div class="heap-box" id="heap-box"></div>
        </div>

        <div>
            <div class="ui-label">Sorted Result</div>
            <div class="result-tiles" id="result-tiles"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Index</span>
            <span class="info-value" id="val-i" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Extracted Min</span>
            <span class="info-value" id="val-min" style="color:var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Heap Size</span>
            <span class="info-value" id="val-size" style="color:var(--accent-purple);">0</span>
        </div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#2a1600;border:2px solid #e3b341;border-radius:8px;"></span> Current</div>
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#0f2a1a;border:2px solid #3fb950;border-radius:8px;"></span> Extracted</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [];
        let k = 3;
        let heap = [];
        let result = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 350];

        const examples = [
            [[6, 5, 3, 2, 8, 10, 9], 3],
            [[1, 4, 5, 2, 3, 7, 8, 6, 10, 9], 2]
        ];

        function generateSteps(inputArr, inputK) {
            arr = [...inputArr];
            k = inputK;
            const n = arr.length;
            result = [];
            steps = [];
            heap = [];

            steps.push({
                type: 'init',
                heap: [],
                result: [],
                panel: `<b>K-Sorted Array Sort</b><br>arr = [${arr.join(', ')}], k = ${k}`,
                statusText: `Initializing min-heap with first ${Math.min(k+1, n)} elements`,
                log: `Start: arr = [${arr.join(', ')}], k = ${k}`,
                logColor: 'var(--text-dim)'
            });

            // Initial heap with first k+1 elements
            const initSize = Math.min(k + 1, n);
            heap = arr.slice(0, initSize);
            heap.sort((a, b) => a - b); // min-heap simulation

            steps.push({
                type: 'init-heap',
                heap: [...heap],
                result: [],
                panel: `Initialized min-heap with first ${initSize} elements: [${heap.join(', ')}]`,
                statusText: `Heap ready`,
                log: `Initial heap: [${heap.join(', ')}]`,
                logColor: 'var(--accent-purple)'
            });

            let idx = initSize;
            for (let i = 0; i < n; i++) {
                // Extract min
                const minVal = heap.shift();
                result.push(minVal);

                steps.push({
                    type: 'extract',
                    heap: [...heap],
                    result: [...result],
                    panel: `Extract min <b>${minVal}</b> → result[${i}]`,
                    statusText: `Extracted ${minVal}`,
                    log: `  Extract min = ${minVal}`,
                    logColor: 'var(--accent-green)'
                });

                // Add next element if available
                if (idx < n) {
                    heap.push(arr[idx]);
                    heap.sort((a, b) => a - b); // re-heapify
                    steps.push({
                        type: 'add',
                        heap: [...heap],
                        result: [...result],
                        panel: `Add next element <b>${arr[idx]}</b> to heap`,
                        statusText: `Added ${arr[idx]}`,
                        log: `  Add ${arr[idx]}, heap = [${heap.join(', ')}]`,
                        logColor: 'var(--accent-blue)'
                    });
                    idx++;
                }
            }

            steps.push({
                type: 'final',
                heap: [],
                result: [...result],
                panel: `<b>Final Sorted Array:</b> [${result.join(', ')}]`,
                statusText: `Done`,
                log: `\nFinal Result: [${result.join(', ')}]`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderArray(containerId, values, highlightIdx = -1) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            values.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = `tile ${i === highlightIdx ? 'current' : ''}`;
                tile.textContent = val;
                container.appendChild(tile);
            });
        }

        function renderHeap() {
            const container = document.getElementById('heap-box');
            container.innerHTML = '';
            heap.forEach(val => {
                const tile = document.createElement('div');
                tile.className = 'heap-tile';
                tile.textContent = val;
                container.appendChild(tile);
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            heap = [...step.heap];
            renderArray('input-tiles', arr, step.type === 'extract' ? idx - 1 : -1);
            renderHeap();
            renderArray('result-tiles', step.result);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-i').innerText = step.type === 'extract' ? (idx - 1) : '—';
            document.getElementById('val-min').innerText = step.type === 'extract' ? step.result[step.result.length - 1] : '—';
            document.getElementById('val-size').innerText = heap.length;

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const s = steps[k];
                if (s.log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (s.logColor) line.style.color = s.logColor;
                    if (s.bold) line.style.fontWeight = 'bold';
                    line.innerText = s.log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            try {
                const input = document.getElementById('arr-input').value;
                const parsed = JSON.parse(input.replace(/'/g, '"'));
                const inputK = parseInt(document.getElementById('k-input').value) || 3;
                if (Array.isArray(parsed)) {
                    generateSteps(parsed, inputK);
                    reset();
                }
            } catch(e) {
                alert("Please enter valid array like [6, 5, 3, 2, 8, 10, 9]");
            }
        }

        function loadExample(idx) {
            document.getElementById('arr-input').value = JSON.stringify(examples[idx][0]);
            document.getElementById('k-input').value = examples[idx][1];
            generateSteps(examples[idx][0], examples[idx][1]);
            reset();
        }

        function init() {
            loadExample(0);
        }

        window.onload = init;
    </script>
</body>
</html>
