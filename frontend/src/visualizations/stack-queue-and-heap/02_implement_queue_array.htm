<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implement Queue (Array) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 110px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            gap: 60px; 
            width: 100%; 
            max-width: 1100px;
            justify-content: center;
        }
        
        /* Array Visualization */
        .array-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .array-container {
            display: flex;
            gap: 8px;
            padding: 20px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 12px;
            min-height: 140px;
            align-items: flex-end;
        }
        .array-slot {
            width: 58px;
            height: 78px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            transition: all 0.4s ease;
            position: relative;
        }
        .array-slot.filled {
            background: #0f2a1a;
            border-color: var(--accent-green);
            color: var(--accent-green);
        }
        .array-slot.front {
            border-color: var(--accent-purple);
            box-shadow: 0 0 12px var(--accent-purple);
        }
        .array-slot.rear {
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px var(--accent-blue);
        }
        .array-slot .index {
            font-size: 10px;
            color: var(--text-dim);
            position: absolute;
            top: -20px;
        }
        .pointer-front, .pointer-rear {
            position: absolute;
            font-size: 13px;
            font-weight: bold;
        }
        .pointer-front { top: -38px; color: var(--accent-purple); }
        .pointer-rear { bottom: -32px; color: var(--accent-blue); }

        /* Log Area */
        .log-area {
            width: 420px;
        }
        .log-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            height: 340px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.4;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 760px; text-align: center; font-family: monospace;
            min-height: 85px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); text-align: center; width: 700px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 160px; }

        .legend { margin-top: 16px; display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; color: var(--text-dim); }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Capacity =</label>
        <input type="number" id="capacity-input" value="4" min="1" max="8">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (Cap=3)</button>
        <button onclick="loadExample(1)">Ex 2 (Cap=4)</button>
    </div>

    <div class="visual-container">
        <div class="array-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Fixed Array Queue (Shifting)</div>
            <div id="array-container" class="array-container"></div>
            <div class="info-panel">
                <div class="info-cell">
                    <span class="info-label">FRONT</span>
                    <span class="info-value" id="val-front" style="color: var(--accent-purple);">0</span>
                </div>
                <div class="info-cell">
                    <span class="info-label">REAR / SIZE</span>
                    <span class="info-value" id="val-size" style="color: var(--accent-green);">0</span>
                </div>
            </div>
        </div>

        <div class="log-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Operation Log</div>
            <div class="log-container" id="log-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">Click <b>Play</b> or <b>Next</b> to start visualization of Queue using fixed-size array with shifting on dequeue.</div>

    <div class="status-bar" id="status-text">Ready — Fixed Array Queue (O(n) dequeue due to shifting)</div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:var(--accent-green);border-radius:6px;"></span> Filled Element</div>
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;border:2px solid var(--accent-purple);border-radius:6px;"></span> FRONT</div>
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;border:2px solid var(--accent-blue);border-radius:6px;"></span> REAR</div>
    </div>

    <script>
        let capacity = 4;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 850, 380];

        function init() {
            loadExample(0);
        }

        function loadExample(exIndex) {
            capacity = exIndex === 0 ? 3 : 4;
            document.getElementById('capacity-input').value = capacity;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('capacity-input').value);
            if (!isNaN(val) && val > 0 && val <= 8) {
                capacity = val;
                generateSteps();
                reset();
            } else {
                alert("Capacity must be 1–8 for clear visualization");
            }
        }

        function generateSteps() {
            steps = [];
            let arr = new Array(capacity).fill(null);
            let size = 0;

            // Example 1
            if (capacity === 3) {
                steps.push(createStep('init', arr, size, `Initialize Queue (capacity = ${capacity})<br>Array = [${arr.map(v=>v===null?'None':v).join(', ')}], size=0`));

                // enqueue 1
                arr[0] = 1; size = 1;
                steps.push(createStep('enqueue', arr, size, `enqueue(1)<br>Placed at index ${size-1}`, 1));

                // enqueue 2
                arr[1] = 2; size = 2;
                steps.push(createStep('enqueue', arr, size, `enqueue(2)<br>Placed at index ${size-1}`, 2));

                // dequeue() → 1 + shift
                const deq1 = arr[0];
                for (let i = 1; i < size; i++) arr[i-1] = arr[i];
                arr[size-1] = null; size--;
                steps.push(createStep('dequeue', arr, size, `dequeue() → <b>${deq1}</b><br>Shifted remaining elements left`, deq1));

                // enqueue 3
                arr[size] = 3; size++;
                steps.push(createStep('enqueue', arr, size, `enqueue(3)<br>Placed at index ${size-1}`, 3));

                // peek
                steps.push(createStep('peek', arr, size, `peek() → <b>${arr[0]}</b>`, arr[0]));

                // dequeue → 2
                const deq2 = arr[0];
                for (let i = 1; i < size; i++) arr[i-1] = arr[i];
                arr[size-1] = null; size--;
                steps.push(createStep('dequeue', arr, size, `dequeue() → <b>${deq2}</b>`, deq2));

                // dequeue → 3
                const deq3 = arr[0];
                for (let i = 1; i < size; i++) arr[i-1] = arr[i];
                arr[size-1] = null; size--;
                steps.push(createStep('dequeue', arr, size, `dequeue() → <b>${deq3}</b>`, deq3));
            } 
            // Example 2
            else {
                steps.push(createStep('init', arr, size, `Initialize Queue (capacity = ${capacity})`));

                [5,10,15].forEach(val => {
                    arr[size] = val; size++;
                    steps.push(createStep('enqueue', arr, size, `enqueue(${val})`, val));
                });

                let d = arr[0];
                for (let i = 1; i < size; i++) arr[i-1] = arr[i];
                arr[size-1] = null; size--;
                steps.push(createStep('dequeue', arr, size, `dequeue() → ${d}`, d));

                arr[size] = 20; size++;
                steps.push(createStep('enqueue', arr, size, `enqueue(20)`, 20));

                for (let k = 0; k < 2; k++) {
                    d = arr[0];
                    for (let i = 1; i < size; i++) arr[i-1] = arr[i];
                    arr[size-1] = null; size--;
                    steps.push(createStep('dequeue', arr, size, `dequeue() → ${d}`, d));
                }

                steps.push(createStep('peek', arr, size, `peek() → ${arr[0]}`, arr[0]));
                steps.push(createStep('info', arr, size, `isEmpty() → ${size === 0}`));
            }

            // Final
            steps.push({
                type: 'final',
                array: [...arr],
                size: size,
                panel: `Queue implementation complete using fixed-size array.<br><b>Dequeue is O(n)</b> due to shifting elements.`,
                status: `Visualization finished`,
                log: `End of Queue demonstration`
            });
        }

        function createStep(type, arr, size, panelText, value = null) {
            return {
                type: type,
                array: [...arr],
                size: size,
                panel: panelText,
                status: `${type.toUpperCase()} ${value !== null ? value : ''}`,
                log: `${type} ${value !== null ? '(' + value + ')' : ''}`
            };
        }

        function renderArray(arr, size) {
            const container = document.getElementById('array-container');
            container.innerHTML = '';

            for (let i = 0; i < capacity; i++) {
                const slot = document.createElement('div');
                slot.className = `array-slot ${i < size ? 'filled' : ''}`;
                
                const idxDiv = document.createElement('div');
                idxDiv.className = 'index';
                idxDiv.textContent = i;
                slot.appendChild(idxDiv);

                if (i < size) {
                    slot.innerHTML += `<div style="font-size:24px;font-weight:bold;">${arr[i]}</div>`;
                } else {
                    slot.innerHTML += `<div style="color:#555;font-size:13px;">—</div>`;
                }

                // Front pointer
                if (i === 0 && size > 0) {
                    const frontPtr = document.createElement('div');
                    frontPtr.className = 'pointer-front';
                    frontPtr.textContent = '↑ FRONT';
                    slot.appendChild(frontPtr);
                    slot.classList.add('front');
                }

                // Rear pointer
                if (i === size - 1 && size > 0) {
                    const rearPtr = document.createElement('div');
                    rearPtr.className = 'pointer-rear';
                    rearPtr.textContent = 'REAR ↓';
                    slot.appendChild(rearPtr);
                    slot.classList.add('rear');
                }

                container.appendChild(slot);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderArray(step.array, step.size);

            document.getElementById('val-front').innerText = step.size > 0 ? 0 : '—';
            document.getElementById('val-size').innerText = step.size;

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('status-text').innerText = step.status || '';

            // Log
            const logCont = document.getElementById('log-container');
            logCont.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                const line = document.createElement('div');
                line.style.margin = '4px 0';
                line.style.padding = '5px 8px';
                line.style.borderRadius = '4px';
                if (steps[i].type === 'enqueue') line.style.background = 'rgba(63,185,80,0.15)';
                if (steps[i].type === 'dequeue') line.style.background = 'rgba(248,81,73,0.15)';
                line.innerHTML = `<span style="color:#8b949e">${(i+1).toString().padStart(2,'0')}.</span> ${steps[i].log}`;
                logCont.appendChild(line);
            }
            logCont.scrollTop = logCont.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
