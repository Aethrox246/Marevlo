<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Span (Monotonic Stack)</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 8px 0; }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .viz {
            display: flex;
            gap: 80px;
            width: 100%;
            max-width: 1000px;
        }

        .prices-container, .stack-container {
            text-align: center;
        }

        .label {
            color: var(--accent-purple);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .prices {
            display: flex;
            gap: 6px;
            padding: 16px;
            background: #21262d;
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .stack {
            background: #21262d;
            border: 3px solid var(--accent-blue);
            border-radius: 12px;
            padding: 12px 8px;
            min-height: 320px;
            width: 90px;
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            align-items: center;
        }

        .tile {
            padding: 12px 18px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 17px;
            min-width: 52px;
            text-align: center;
            border: 2px solid var(--accent-orange);
            transition: all 0.3s;
        }

        .tile.top {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
        }

        .info {
            margin: 20px 0;
            text-align: center;
            font-family: monospace;
            line-height: 1.6;
        }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 18px;
            width: 100%;
            max-width: 1000px;
            min-height: 140px;
            margin: 20px 0;
            font-family: monospace;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px;
            width: 100%;
            max-width: 1000px;
            height: 240px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Stock Span (Monotonic Stack)</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">O(n) Stack Solution</p>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetSim()">Reset</button>
    </div>

    <div class="viz">
        <div class="prices-container">
            <div class="label">Prices</div>
            <div class="prices" id="prices-vis"></div>
        </div>
        <div class="stack-container">
            <div class="label">Monotonic Stack (Indices)</div>
            <div class="stack" id="stack-vis"></div>
        </div>
    </div>

    <div class="info" id="info">
        Day: <span id="day-val" style="color:var(--accent-orange)">—</span> | 
        Span: <span id="span-val" style="color:var(--accent-green)">—</span>
    </div>

    <div class="action-panel" id="action">Click an example to begin</div>

    <div class="controls">
        <button onclick="prevStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let prices = [];
        let spans = [];
        let stack = [];
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1650, 850, 380];

        const examples = [
            [100, 80, 60, 70, 60, 75, 85],
            [10, 4, 5, 90, 120, 80]
        ];

        function generateSteps(inputPrices) {
            prices = [...inputPrices];
            spans = new Array(prices.length).fill(0);
            stack = [];
            steps = [];

            steps.push({
                panel: `<b>Initialize</b><br>Stack = []`,
                log: `Start processing prices`,
                prices: [...prices],
                stack: [],
                currentSpan: null,
                day: -1,
                action: 'Initialize'
            });

            for (let i = 0; i < prices.length; i++) {
                let currSpan = 1;
                let tempStack = [...stack];

                // Pop from stack
                while (stack.length > 0 && prices[stack[stack.length - 1]] <= prices[i]) {
                    stack.pop();
                }

                // Compute span
                if (stack.length === 0) {
                    currSpan = i + 1;
                } else {
                    currSpan = i - stack[stack.length - 1];
                }

                // Push current index
                stack.push(i);

                spans[i] = currSpan;

                steps.push({
                    panel: `Day ${i} (price=${prices[i]})<br>Span = ${currSpan}<br>Stack after: [${stack.join(', ')}]`,
                    log: `Day ${i}: span = ${currSpan}`,
                    prices: [...prices],
                    stack: [...stack],
                    currentSpan: currSpan,
                    day: i,
                    action: `Processed day ${i}`
                });
            }

            steps.push({
                panel: `<b>FINAL RESULT</b><br>Spans: [${spans.join(', ')}]`,
                log: `Completed. Spans = [${spans.join(', ')}]`,
                prices: [...prices],
                stack: [...stack],
                currentSpan: null,
                day: prices.length,
                action: 'Complete'
            });
        }

        function renderPrices(pricesArr, highlight = -1) {
            const container = document.getElementById('prices-vis');
            container.innerHTML = '';
            pricesArr.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = val;
                if (i === highlight) tile.style.borderColor = 'var(--accent-green)';
                container.appendChild(tile);
            });
        }

        function renderStack(stk) {
            const container = document.getElementById('stack-vis');
            container.innerHTML = '';
            // Show from bottom to top
            for (let i = 0; i < stk.length; i++) {
                const idx = stk[i];
                const tile = document.createElement('div');
                tile.className = 'tile';
                if (i === stk.length - 1) tile.classList.add('top');
                tile.textContent = `${idx}(${prices[idx]})`;
                container.appendChild(tile);
            }
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('action').innerHTML = step.panel || '—';
            renderPrices(step.prices, step.day);
            renderStack(step.stack);

            const info = document.getElementById('info');
            document.getElementById('day-val').textContent = step.day >= 0 ? step.day : '—';
            document.getElementById('span-val').textContent = step.currentSpan !== null ? step.currentSpan : '—';

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx + 1).map(s => 
                `<div style="margin:5px 0;">${s.log}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            generateSteps(examples[n]);
            resetSim();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
