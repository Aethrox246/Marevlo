<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Delete GetRandom GetMin - Brute Force Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 10px 0; }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
        }

        .list-box {
            background: var(--bg-surface);
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px;
            width: 420px;
        }
        .label { color: var(--accent-purple); text-align: center; margin-bottom: 12px; font-weight: bold; }
        .array {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 80px;
            padding: 16px;
            background: #21262d;
            border-radius: 10px;
        }
        .tile {
            background: #2d333b;
            border: 2px solid var(--accent-blue);
            padding: 12px 18px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            min-width: 50px;
            text-align: center;
        }
        .tile.current { border-color: var(--accent-orange); box-shadow: 0 0 0 4px rgba(227,179,65,0.4); }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            min-height: 140px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.65;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px 20px;
            width: 100%;
            max-width: 900px;
            height: 220px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Insert • Delete • GetRandom • GetMin</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">Brute Force Array (Linear Scan) • O(n) for delete/getMin</p>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="addCustom()">+ Add Random</button>
        <button onclick="resetSim()">Reset</button>
    </div>

    <div class="container">
        <div class="list-box">
            <div class="label">Data Array</div>
            <div class="array" id="array-vis"></div>
        </div>
    </div>

    <div class="action-panel" id="action">Ready. Load an example.</div>

    <div class="controls">
        <button onclick="prevStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let data = [];
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1450, 780, 350];

        const examples = [
            [
                {op: 'insert', val: 5},
                {op: 'insert', val: 3},
                {op: 'insert', val: 7},
                {op: 'getMin'},
                {op: 'getRandom'},
                {op: 'delete', val: 3},
                {op: 'getMin'}
            ],
            [
                {op: 'insert', val: 10},
                {op: 'insert', val: 10},
                {op: 'delete', val: 5},
                {op: 'getMin'},
                {op: 'delete', val: 10},
                {op: 'getRandom'}
            ]
        ];

        function generateSteps(ops) {
            data = [];
            steps = [];

            steps.push({
                panel: `<b>Initialize</b><br>Array = []`,
                log: `Start with empty data array`,
                array: [],
                highlight: []
            });

            ops.forEach(op => {
                let panel = '', log = '', highlight = [];

                if (op.op === 'insert') {
                    const exists = data.includes(op.val);
                    if (!exists) {
                        data.push(op.val);
                    }
                    panel = `insert(<b>${op.val}</b>) → ${exists ? 'duplicate, false' : 'true'}`;
                    log = `insert(${op.val}) → ${exists ? 'already exists' : 'added'}`;
                    highlight = [data.length - 1];
                } else if (op.op === 'delete') {
                    const idx = data.indexOf(op.val);
                    const success = idx !== -1;
                    if (success) {
                        data[idx] = data[data.length - 1];
                        data.pop();
                        highlight = [idx];
                    }
                    panel = `delete(<b>${op.val}</b>) → ${success ? 'true' : 'false'}`;
                    log = `delete(${op.val}) → ${success ? 'swapped & removed' : 'not found'}`;
                } else if (op.op === 'getMin') {
                    const minVal = data.length ? Math.min(...data) : 'None';
                    panel = `getMin() = <b>${minVal}</b>`;
                    log = `getMin() → ${minVal}`;
                    if (data.length) highlight = [data.indexOf(minVal)];
                } else if (op.op === 'getRandom') {
                    let randVal = 'None';
                    if (data.length) {
                        const randIdx = Math.floor(Math.random() * data.length);
                        randVal = data[randIdx];
                        highlight = [randIdx];
                    }
                    panel = `getRandom() → <b>${randVal}</b>`;
                    log = `getRandom() → ${randVal}`;
                }

                steps.push({
                    panel: panel,
                    log: log,
                    array: [...data],
                    highlight: highlight
                });
            });
        }

        function renderArray(arr, highlight = []) {
            const container = document.getElementById('array-vis');
            container.innerHTML = '';
            if (arr.length === 0) {
                container.innerHTML = `<div style="color:var(--text-dim);padding:40px 0;">Empty Array</div>`;
                return;
            }
            arr.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                if (highlight.includes(i)) tile.classList.add('current');
                tile.textContent = val;
                container.appendChild(tile);
            });
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('action').innerHTML = step.panel || '—';
            renderArray(step.array, step.highlight || []);

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx+1).map(s => 
                `<div style="margin:5px 0;">${s.log}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            generateSteps(examples[n]);
            resetSim();
        }

        function addCustom() {
            const val = Math.floor(Math.random() * 20) + 1;
            if (steps.length === 0) {
                generateSteps([{op: 'insert', val}]);
            } else {
                const newOps = [...examples[0].slice(0, 3), {op: 'insert', val}];
                generateSteps(newOps);
            }
            resetSim();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
