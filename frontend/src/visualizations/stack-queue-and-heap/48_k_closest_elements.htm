<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K Closest Elements - Correct Visualization</title>

<style>

:root{
    --bg-page:#0d1117;
    --bg-surface:#161b22;
    --border-main:#30363d;

    --btn-bg:#21262d;
    --btn-hover:#2d333b;

    --text-main:#c9d1d9;
    --text-dim:#8b949e;

    --accent-orange:#e3b341;
    --accent-blue:#388bfd;
    --accent-green:#3fb950;
    --accent-red:#f85149;
    --accent-purple:#a371f7;
}

*{
    box-sizing:border-box;
}

body{
    background-color:var(--bg-page);

    color:var(--text-main);

    font-family:system-ui,-apple-system,sans-serif;

    margin:0;

    padding:20px 0;

    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:var(--accent-purple);

    margin:0 0 10px 0;
}

.input-bar{
    width:100%;

    max-width:1100px;

    background:var(--bg-surface);

    padding:12px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    justify-content:center;

    border-bottom:1px solid var(--border-main);

    margin-bottom:20px;
}

button{
    padding:8px 16px;

    background:var(--btn-bg);

    border:1px solid var(--border-main);

    color:var(--text-main);

    border-radius:6px;

    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.main{
    display:flex;

    gap:30px;

    width:100%;

    max-width:1100px;
}

.array-container,
.heap-container{

    background:var(--bg-surface);

    border:3px solid var(--accent-purple);

    border-radius:12px;

    padding:20px;

    width:480px;
}

.label{
    color:var(--accent-purple);

    text-align:center;

    margin-bottom:12px;

    font-weight:bold;
}

.array,
.heap{

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    padding:16px;

    background:#21262d;

    border-radius:10px;

    min-height:80px;
}

.tile{

    background:#2d333b;

    border:2px solid var(--accent-blue);

    padding:12px 18px;

    border-radius:8px;

    font-family:monospace;

    font-size:18px;

    text-align:center;

    min-width:50px;
}

.tile.selected{

    border-color:var(--accent-green);

    background:#1f2a1f;
}

.action-panel{

    background:var(--bg-surface);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:20px;

    width:100%;

    max-width:900px;

    min-height:140px;

    margin:20px 0;

    font-family:monospace;

    font-size:15px;

    line-height:1.65;
}

.controls{

    margin:20px 0;

    display:flex;

    align-items:center;

    gap:16px;

    flex-wrap:wrap;

    justify-content:center;
}

.log-panel{

    background:var(--bg-page);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:16px 20px;

    width:100%;

    max-width:900px;

    height:220px;

    overflow-y:auto;

    font-family:'Courier New', monospace;

    font-size:14px;
}

</style>
</head>

<body>

<h1>K Closest Elements</h1>

<p style="
    color:var(--text-dim);
    margin-bottom:20px;
">
    Max Heap O(n log k) Approach
</p>

<div class="input-bar">

    <button onclick="loadExample(0)">
        Example 1
    </button>

    <button onclick="loadExample(1)">
        Example 2
    </button>

    <button onclick="resetSim()">
        Reset
    </button>

</div>

<div class="main">

    <!-- ARRAY -->

    <div class="array-container">

        <div class="label">
            Input Array
        </div>

        <div class="array"
             id="array-vis"></div>

    </div>

    <!-- HEAP -->

    <div class="heap-container">

        <div class="label">
            Max Heap (distance)
        </div>

        <div class="heap"
             id="heap-vis"></div>

    </div>

</div>

<div class="action-panel"
     id="action">

    Click an example to begin

</div>

<div class="controls">

    <button onclick="prevStep()">
        ← Back
    </button>

    <button onclick="togglePlay()"
            id="play-btn">

        ▶ Play

    </button>

    <button onclick="nextStep()">
        Next →
    </button>

</div>

<div class="log-panel"
     id="log"></div>

<script>

let arr = [];

let k = 0;

let x = 0;

let steps = [];

let stepIdx = 0;

let timer = null;

let isPlaying = false;

const delays = [1600,850,400];

const examples = [

    [[1,2,3,4,5],4,3],

    [[1,2,3,4,5],2,-1]
];

function generateSteps(inputArr,inputK,inputX){

    arr = [...inputArr];

    k = inputK;

    x = inputX;

    steps = [];

    let heap = [];

    steps.push({

        panel:
            `<b>Initialize</b><br>
            Array: [${arr}]<br>
            k=${k}, x=${x}`,

        log:
            `Initialize empty max heap`,

        array:[...arr],

        heap:[],

        highlight:[]
    });

    for(let i = 0; i < arr.length; i++){

        const val = arr[i];

        const dist =
            Math.abs(val - x);

        // FIXED HEAP

        heap.push([dist,val]);

        // SORT:
        // Larger distance first
        // If tie -> larger value first

        heap.sort((a,b)=>{

            if(b[0] !== a[0]){

                return b[0] - a[0];
            }

            return b[1] - a[1];
        });

        let action =
            `Added ${val}
             (dist=${dist})`;

        // REMOVE FARTHEST

        if(heap.length > k){

            const removed =
                heap.shift();

            action +=
                ` → Removed ${removed[1]}
                 (dist=${removed[0]})`;
        }

        steps.push({

            panel:
                `Process <b>${val}</b><br>
                 ${action}<br>
                 Heap Size:
                 ${Math.min(heap.length,k)}`,

            log:action,

            array:[...arr],

            // FIXED DISPLAY

            heap:
                heap.map(h=>[
                    h[1],
                    h[0]
                ]),

            highlight:[i]
        });
    }

    // FINAL RESULT

    let result =
        heap
        .map(h=>h[1])
        .sort((a,b)=>a-b);

    steps.push({

        panel:
            `<b>
             FINAL RESULT
             </b><br>
             [${result.join(', ')}]`,

        log:
            `✅ Final k closest:
             [${result.join(', ')}]`,

        array:[...arr],

        heap:
            heap.map(h=>[
                h[1],
                h[0]
            ]),

        highlight:[]
    });
}

function renderArray(a,highlight=[]){

    const container =
        document.getElementById(
            'array-vis'
        );

    container.innerHTML = '';

    a.forEach((val,i)=>{

        const tile =
            document.createElement('div');

        tile.className = 'tile';

        if(highlight.includes(i)){

            tile.classList.add(
                'selected'
            );
        }

        tile.textContent = val;

        container.appendChild(tile);
    });
}

function renderHeap(h){

    const container =
        document.getElementById(
            'heap-vis'
        );

    container.innerHTML = '';

    h.forEach(([val,dist])=>{

        const tile =
            document.createElement('div');

        tile.className = 'tile';

        tile.textContent =
            `${val} (d=${dist})`;

        container.appendChild(tile);
    });
}

function renderStep(idx){

    stepIdx = idx;

    const step = steps[idx];

    if(!step) return;

    document.getElementById(
        'action'
    ).innerHTML =
        step.panel || '—';

    renderArray(
        step.array,
        step.highlight
    );

    renderHeap(step.heap);

    const logEl =
        document.getElementById(
            'log'
        );

    logEl.innerHTML =
        steps
        .slice(0,idx+1)
        .map(
            s=>`
            <div style="
                margin:5px 0;
            ">
            ${s.log}
            </div>`
        )
        .join('');

    logEl.scrollTop =
        logEl.scrollHeight;
}

function nextStep(){

    if(stepIdx < steps.length - 1){

        renderStep(stepIdx + 1);

    }else{

        pause();
    }
}

function prevStep(){

    if(stepIdx > 0){

        renderStep(stepIdx - 1);
    }
}

function resetSim(){

    pause();

    stepIdx = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(isPlaying){

        pause();

    }else{

        isPlaying = true;

        btn.textContent =
            '❚❚ Pause';

        timer =
            setInterval(()=>{

                if(
                    stepIdx <
                    steps.length - 1
                ){

                    nextStep();

                }else{

                    pause();
                }

            },1000);
    }
}

function pause(){

    clearInterval(timer);

    isPlaying = false;

    document.getElementById(
        'play-btn'
    ).textContent =
        '▶ Play';
}

function loadExample(n){

    const [
        inputArr,
        inputK,
        inputX
    ] = examples[n];

    generateSteps(
        inputArr,
        inputK,
        inputX
    );

    resetSim();
}

window.onload = () => {

    loadExample(0);
};

</script>

</body>
</html>
