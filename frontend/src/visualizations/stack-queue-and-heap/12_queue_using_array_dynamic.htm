<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue using Array - Full Visualization</title>

<style>

:root{
    --bg-page:#0d1117;
    --bg-surface:#161b22;
    --border-main:#30363d;
    --btn-bg:#21262d;
    --btn-hover:#2d333b;
    --text-main:#c9d1d9;
    --accent-orange:#e3b341;
    --accent-blue:#58a6ff;
    --accent-green:#3fb950;
    --accent-red:#f85149;
}

*{
    box-sizing:border-box;
}

body{
    background:var(--bg-page);
    color:var(--text-main);
    font-family:system-ui,sans-serif;
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.input-bar{
    background:var(--bg-surface);
    padding:12px 20px;
    border-radius:8px;
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

button{
    padding:8px 16px;
    background:var(--btn-bg);
    border:1px solid var(--border-main);
    color:white;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.visual-container{
    display:flex;
    gap:50px;
    margin-top:20px;
    align-items:flex-start;
}

.queue-area{
    text-align:center;
}

.queue-container{
    display:flex;
    gap:10px;
    padding:25px 30px;
    background:var(--bg-surface);
    border:2px solid var(--border-main);
    border-radius:12px;
    min-height:140px;
    align-items:center;
}

.queue-slot{
    width:68px;
    height:88px;
    background:#21262d;
    border:2px solid var(--border-main);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    transition:0.4s;
}

.queue-slot.front{
    border-color:var(--accent-blue);
    box-shadow:0 0 20px var(--accent-blue);
}

.queue-slot.highlight{
    transform:scale(1.12);
    background:#2d3748;
    box-shadow:0 0 25px var(--accent-orange);
}

.output-area{
    text-align:center;
}

.output-container{
    display:flex;
    gap:12px;
    padding:25px 30px;
    background:var(--bg-surface);
    border:2px solid var(--border-main);
    border-radius:12px;
    min-height:140px;
    align-items:center;
}

.output-tile{
    width:68px;
    height:88px;
    background:#0f2a1a;
    border:2px solid var(--accent-green);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    color:var(--accent-green);
}

.action-panel{
    margin:25px 0;
    background:var(--bg-surface);
    border:1px solid var(--border-main);
    border-radius:8px;
    padding:20px;
    width:900px;
    min-height:140px;
    text-align:center;
    line-height:1.6;
}

.controls{
    margin-top:20px;
    display:flex;
    gap:12px;
    align-items:center;
}

.log-container{
    background:var(--bg-surface);
    border:1px solid var(--border-main);
    border-radius:8px;
    height:240px;
    overflow-y:auto;
    padding:12px;
    font-family:monospace;
    font-size:14px;
    width:900px;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="input-bar">
    <button onclick="loadExample(0)">Example 1</button>
    <button onclick="loadExample(1)">Example 2</button>
    <button onclick="resetQueue()">Reset</button>
</div>

<div class="visual-container">

    <!-- Queue -->

    <div class="queue-area">

        <div style="
            color:var(--accent-blue);
            font-weight:bold;
            margin-bottom:10px;
        ">
            Queue Array (Front ←)
        </div>

        <div id="queue-container"
             class="queue-container">
        </div>

    </div>

    <!-- Output -->

    <div class="output-area">

        <div style="
            color:var(--accent-green);
            font-weight:bold;
            margin-bottom:10px;
        ">
            Dequeued Values
        </div>

        <div id="output-container"
             class="output-container">
        </div>

    </div>

</div>

<!-- ACTION PANEL -->

<div class="action-panel" id="main-panel">

    Click Play to start demonstration

</div>

<!-- CONTROLS -->

<div class="controls">

    <button onclick="resetQueue()">↺ Reset</button>

    <button onclick="backStep()">← Back</button>

    <button onclick="togglePlay()" id="play-btn">
        ▶ Play
    </button>

    <button onclick="nextStep()">Next →</button>

    <span style="margin-left:20px">
        Speed:
    </span>

    <input type="range"
           id="speed-slider"
           min="0"
           max="2"
           value="1">

</div>

<!-- LOGS -->

<div class="log-container" id="log-container"></div>

<script>

let queue = [];
let capacity = 3;
let size = 0;

let dequeued = [];

let steps = [];
let stepIndex = 0;

let timer = null;

const delays = [1800,1000,500];

function init(){

    loadExample(0);
}

function loadExample(ex){

    pause();

    capacity = ex === 0 ? 3 : 2;

    queue = new Array(capacity).fill(null);

    size = 0;

    dequeued = [];

    steps = [];

    if(ex === 0){

        addStep(
            "Initialize Queue",
            "capacity = 3",
            -1
        );

        enqueueStep(1);

        enqueueStep(2);

        dequeueStep();

        enqueueStep(3);

        dequeueStep();

        dequeueStep();

    }else{

        addStep(
            "Initialize Queue",
            "capacity = 2",
            -1
        );

        enqueueStep(5);

        enqueueStep(6);

        enqueueStep(7);

        dequeueStep();

        dequeueStep();

        dequeueStep();
    }

    stepIndex = 0;

    renderStep(0);
}

function addStep(panel,action,highlightIndex){

    steps.push({

        panel:panel,

        action:action,

        highlightIndex:highlightIndex,

        queue:[...queue],

        size:size,

        dequeued:[...dequeued]
    });
}

function enqueueStep(val){

    if(size < capacity){

        queue[size] = val;

        addStep(
            `Enqueue ${val}`,
            `queue[${size}] = ${val}`,
            size
        );

        size++;

    }else{

        addStep(
            "Queue Full",
            `Cannot insert ${val}`,
            -1
        );
    }
}

function dequeueStep(){

    if(size > 0){

        const front = queue[0];

        dequeued.push(front);

        addStep(
            `Dequeue ${front}`,
            `Remove front element ${front}`,
            0
        );

        for(let i=0;i<size-1;i++){

            queue[i] = queue[i+1];
        }

        queue[size-1] = null;

        size--;

    }else{

        addStep(
            "Queue Empty",
            "Nothing to dequeue",
            -1
        );
    }
}

function renderQueue(highlightIdx){

    const container =
        document.getElementById(
            'queue-container'
        );

    container.innerHTML = '';

    for(let i=0;i<capacity;i++){

        const slot =
            document.createElement('div');

        slot.className =
            `queue-slot
            ${i===0 && size>0 ? 'front':''}`;

        if(i === highlightIdx){

            slot.classList.add('highlight');
        }

        slot.innerHTML =
            queue[i] !== null
            ? queue[i]
            : '—';

        container.appendChild(slot);
    }
}

function renderOutput(){

    const container =
        document.getElementById(
            'output-container'
        );

    container.innerHTML = '';

    dequeued.forEach(val=>{

        const tile =
            document.createElement('div');

        tile.className = 'output-tile';

        tile.textContent = val;

        container.appendChild(tile);
    });
}

function renderStep(idx){

    const step = steps[idx];

    if(!step) return;

    queue = [...step.queue];

    size = step.size;

    dequeued = [...step.dequeued];

    renderQueue(step.highlightIndex);

    renderOutput();

    document.getElementById(
        'main-panel'
    ).innerHTML = `

        <div style="
            font-size:24px;
            font-weight:bold;
            margin-bottom:10px;
        ">
            ${step.panel}
        </div>

        <div style="
            color:var(--accent-orange);
            font-size:20px;
            font-weight:bold;
        ">
            ${step.action}
        </div>

        <div style="
            margin-top:15px;
            color:#8b949e;
            font-size:17px;
        ">
            Current Size = ${step.size}
        </div>
    `;

    const logDiv =
        document.getElementById(
            'log-container'
        );

    logDiv.innerHTML = '';

    for(let i=0;i<=idx;i++){

        const line =
            document.createElement('div');

        line.style.margin = '6px 0';

        line.innerHTML = `
            <span style="color:#58a6ff">
                Step ${i}
            </span>

            : ${steps[i].action}
        `;

        logDiv.appendChild(line);
    }

    logDiv.scrollTop =
        logDiv.scrollHeight;
}

function nextStep(){

    if(stepIndex < steps.length - 1){

        stepIndex++;

        renderStep(stepIndex);

    }else{

        pause();
    }
}

function backStep(){

    if(stepIndex > 0){

        stepIndex--;

        renderStep(stepIndex);
    }
}

function resetQueue(){

    pause();

    stepIndex = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(timer){

        pause();

    }else{

        btn.textContent = 'Pause';

        if(stepIndex >= steps.length - 1){

            stepIndex = 0;
        }

        timer = setInterval(

            nextStep,

            delays[
                document.getElementById(
                    'speed-slider'
                ).value
            ]
        );
    }
}

function pause(){

    clearInterval(timer);

    timer = null;

    document.getElementById(
        'play-btn'
    ).textContent = 'Play';
}

window.onload = init;

</script>

</body>
</html>
