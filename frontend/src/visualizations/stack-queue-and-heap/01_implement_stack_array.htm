<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implement Stack (Array) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 110px;
            font-size: 13px;
        }
        select {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            gap: 60px; 
            width: 100%; 
            max-width: 1100px;
            justify-content: center;
        }
        
        /* Array Visualization */
        .array-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .array-container {
            display: flex;
            gap: 8px;
            padding: 20px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 12px;
            min-height: 120px;
            align-items: flex-end;
        }
        .array-slot {
            width: 52px;
            height: 68px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            transition: all 0.3s ease;
            position: relative;
        }
        .array-slot.filled {
            background: #0f2a1a;
            border-color: var(--accent-green);
            color: var(--accent-green);
        }
        .array-slot.top {
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px var(--accent-blue);
        }
        .array-slot .index {
            font-size: 10px;
            color: var(--text-dim);
            position: absolute;
            top: -18px;
        }
        .pointer {
            position: absolute;
            top: -28px;
            font-size: 14px;
            color: var(--accent-blue);
            font-weight: bold;
        }

        /* Operation Log */
        .log-area {
            width: 380px;
        }
        .log-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            height: 320px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; text-align: center; font-family: monospace;
            min-height: 80px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 16px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--accent-orange); }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); text-align: center; width: 700px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 12px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 800px; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-dim); }

        .result-display {
            margin-top: 15px;
            font-size: 18px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Capacity =</label>
        <input type="number" id="capacity-input" value="5" min="1" max="10">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (Cap=3)</button>
        <button onclick="loadExample(1)">Ex 2 (Cap=2)</button>
    </div>

    <div class="visual-container">
        <!-- Array Visualization -->
        <div class="array-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-blue);">Array + Top Pointer</div>
            <div id="array-container" class="array-container"></div>
            <div class="info-panel" style="margin-top: 8px;">
                <div class="info-cell">
                    <span class="info-label">TOP</span>
                    <span class="info-value" id="val-top">-1</span>
                </div>
                <div class="info-cell">
                    <span class="info-label">SIZE</span>
                    <span class="info-value" id="val-size">0</span>
                </div>
            </div>
        </div>

        <!-- Operation Log -->
        <div class="log-area">
            <div class="ui-label" style="font-weight: bold; color: var(--accent-green);">Operation History</div>
            <div class="log-container" id="log-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to start visualization</div>

    <div class="result-display">
        <span id="result-text" style="color: var(--accent-green); font-weight: bold;"></span>
    </div>

    <div class="status-bar" id="status-text">Ready</div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left: 20px;">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px;"></span> Filled Slot</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;border:2px solid var(--accent-blue);border-radius:6px;"></span> Top Pointer</div>
        <div class="legend-item"><span style="color:var(--accent-red)">Overflow / Underflow</span></div>
    </div>

    <script>
        let capacity = 5;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 400];

        let currentArray = [];
        let currentTop = -1;

        function init() {
            loadExample(0);
        }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                capacity = 3;
                document.getElementById('capacity-input').value = 3;
            } else {
                capacity = 2;
                document.getElementById('capacity-input').value = 2;
            }
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('capacity-input').value);
            if (!isNaN(val) && val > 0 && val <= 10) {
                capacity = val;
                generateSteps();
                reset();
            } else {
                alert("Capacity must be between 1 and 10");
            }
        }

        function generateSteps() {
            steps = [];
            currentArray = new Array(capacity).fill(null);
            currentTop = -1;

            // Example 1: Capacity 3
            if (capacity === 3) {
                steps.push({
                    type: 'init',
                    array: [...currentArray],
                    top: currentTop,
                    panel: `Initialize Fixed-Size Array Stack with capacity = <b>${capacity}</b><br>Array = [${currentArray.map(v => v===null?'None':v).join(', ')}], top = -1`,
                    status: `Stack initialized (empty)`,
                    log: `Initialize stack (capacity=${capacity})`,
                    highlight: 'init'
                });

                // push(5)
                currentArray[0] = 5;
                currentTop = 0;
                steps.push({
                    type: 'push',
                    value: 5,
                    array: [...currentArray],
                    top: currentTop,
                    panel: `push(5)<br>top != ${capacity-1} → top++ → array[0] = 5`,
                    status: `Pushed 5`,
                    log: `push(5) → top=0`,
                    highlight: 'push'
                });

                // push(10)
                currentArray[1] = 10;
                currentTop = 1;
                steps.push({
                    type: 'push',
                    value: 10,
                    array: [...currentArray],
                    top: currentTop,
                    panel: `push(10)<br>top != ${capacity-1} → top++ → array[1] = 10`,
                    status: `Pushed 10`,
                    log: `push(10) → top=1`,
                    highlight: 'push'
                });

                // pop()
                const popped = currentArray[1];
                currentArray[1] = null;
                currentTop = 0;
                steps.push({
                    type: 'pop',
                    value: popped,
                    array: [...currentArray],
                    top: currentTop,
                    panel: `pop()<br>top != -1 → return array[1] = 10, top--`,
                    status: `Popped 10`,
                    log: `pop() → 10`,
                    highlight: 'pop'
                });

                // push(15)
                currentArray[1] = 15;
                currentTop = 1;
                steps.push({
                    type: 'push',
                    value: 15,
                    array: [...currentArray],
                    top: currentTop,
                    panel: `push(15)<br>top != ${capacity-1} → top++ → array[1] = 15`,
                    status: `Pushed 15`,
                    log: `push(15) → top=1`,
                    highlight: 'push'
                });

                // peek()
                steps.push({
                    type: 'peek',
                    value: currentArray[1],
                    array: [...currentArray],
                    top: currentTop,
                    panel: `peek()<br>top != -1 → return array[1] = 15`,
                    status: `Peeked 15`,
                    log: `peek() → 15`,
                    highlight: 'peek'
                });

                // size()
                steps.push({
                    type: 'size',
                    value: currentTop + 1,
                    array: [...currentArray],
                    top: currentTop,
                    panel: `size() = top + 1 = ${currentTop + 1}`,
                    status: `Size = ${currentTop + 1}`,
                    log: `size() → ${currentTop + 1}`,
                    highlight: 'info'
                });

                // isEmpty()
                steps.push({
                    type: 'isEmpty',
                    value: false,
                    array: [...currentArray],
                    top: currentTop,
                    panel: `isEmpty() → top == -1 ? False`,
                    status: `Not empty`,
                    log: `isEmpty() → false`,
                    highlight: 'info'
                });
            } 
            // Example 2: Capacity 2 with overflow
            else {
                steps.push({
                    type: 'init',
                    array: [...currentArray],
                    top: currentTop,
                    panel: `Initialize Fixed-Size Array Stack with capacity = <b>${capacity}</b>`,
                    status: `Stack initialized`,
                    log: `Initialize stack (capacity=${capacity})`,
                    highlight: 'init'
                });

                currentArray[0] = 1;
                currentTop = 0;
                steps.push({ type: 'push', value: 1, array: [...currentArray], top: currentTop, panel: `push(1)`, status: `Pushed 1`, log: `push(1) → top=0`, highlight: 'push' });

                currentArray[1] = 2;
                currentTop = 1;
                steps.push({ type: 'push', value: 2, array: [...currentArray], top: currentTop, panel: `push(2)`, status: `Pushed 2`, log: `push(2) → top=1`, highlight: 'push' });

                // Overflow
                steps.push({
                    type: 'overflow',
                    array: [...currentArray],
                    top: currentTop,
                    panel: `<span style="color:var(--accent-red)">push(3)</span><br>top == ${capacity-1} → <b>Overflow Error</b>`,
                    status: `Overflow!`,
                    log: `push(3) → Overflow`,
                    highlight: 'error'
                });

                // pop 2
                const p1 = currentArray[1];
                currentArray[1] = null;
                currentTop = 0;
                steps.push({ type: 'pop', value: p1, array: [...currentArray], top: currentTop, panel: `pop() → 2`, status: `Popped 2`, log: `pop() → 2`, highlight: 'pop' });

                // pop 1
                const p2 = currentArray[0];
                currentArray[0] = null;
                currentTop = -1;
                steps.push({ type: 'pop', value: p2, array: [...currentArray], top: currentTop, panel: `pop() → 1`, status: `Popped 1`, log: `pop() → 1`, highlight: 'pop' });

                steps.push({
                    type: 'isEmpty',
                    value: true,
                    array: [...currentArray],
                    top: currentTop,
                    panel: `isEmpty() → True`,
                    status: `Stack is empty`,
                    log: `isEmpty() → true`,
                    highlight: 'info'
                });
            }

            // Final step
            steps.push({
                type: 'final',
                array: [...currentArray],
                top: currentTop,
                panel: `Visualization complete.<br>Stack implemented using fixed-size array with top pointer.`,
                status: `Demo finished`,
                log: `End of demonstration`,
                highlight: 'final'
            });
        }

        function renderArray(arr, top) {
            const container = document.getElementById('array-container');
            container.innerHTML = '';

            for (let i = 0; i < capacity; i++) {
                const slot = document.createElement('div');
                slot.className = `array-slot ${arr[i] !== null ? 'filled' : ''} ${i === top ? 'top' : ''}`;
                
                const indexLabel = document.createElement('div');
                indexLabel.className = 'index';
                indexLabel.textContent = i;
                slot.appendChild(indexLabel);

                if (arr[i] !== null) {
                    slot.innerHTML += `<div style="font-size:22px; font-weight:bold;">${arr[i]}</div>`;
                } else {
                    slot.innerHTML += `<div style="color:#555; font-size:13px;">—</div>`;
                }

                if (i === top) {
                    const ptr = document.createElement('div');
                    ptr.className = 'pointer';
                    ptr.textContent = '↑ TOP';
                    slot.appendChild(ptr);
                }

                container.appendChild(slot);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderArray(step.array, step.top);

            document.getElementById('val-top').innerText = step.top;
            document.getElementById('val-size').innerText = step.top + 1;

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('status-text').innerText = step.status;

            // Render log
            const logCont = document.getElementById('log-container');
            logCont.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                const line = document.createElement('div');
                line.style.marginBottom = '6px';
                line.style.padding = '4px 8px';
                line.style.borderRadius = '4px';
                if (steps[i].highlight === 'push') line.style.background = 'rgba(63, 185, 80, 0.15)';
                if (steps[i].highlight === 'pop') line.style.background = 'rgba(248, 81, 73, 0.15)';
                if (steps[i].highlight === 'error') line.style.background = 'rgba(248, 81, 73, 0.3)';
                line.innerHTML = `<span style="color:#8b949e">${(i+1).toString().padStart(2,'0')}.</span> ${steps[i].log}`;
                logCont.appendChild(line);
            }
            logCont.scrollTop = logCont.scrollHeight;

            const res = document.getElementById('result-text');
            if (step.type === 'final') {
                res.textContent = `Stack operations completed successfully!`;
            } else {
                res.textContent = '';
            }
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
