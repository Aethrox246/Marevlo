<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max-Heap with Decrease-Key - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 420px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; max-width: 920px; }

        .heap-tiles {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            background: #161b22;
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
        }
        .tile {
            width: 68px; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 2px solid var(--border-main); background: #21262d; color: var(--text-main);
            transition: all 0.4s ease;
            position: relative;
        }
        .tile.current { border-color: var(--accent-orange); background: #2a1600; transform: scale(1.15); }
        .tile.updated { border-color: var(--accent-green); background: #0f2a1a; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 26px; width: 760px; min-height: 140px;
            font-family: monospace; font-size: 15px; line-height: 1.65;
        }

        .result-display {
            margin-top: 15px;
            font-size: 32px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: var(--accent-green);
        }

        .info-panel { margin: 15px 0; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 8px;
            padding: 12px 22px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .status-bar { margin-top: 8px; font-size: 14px; color: var(--text-dim); min-height: 28px; }

        .controls { margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 15px; display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 14px 18px; width: 760px; max-width: 95%; height: 180px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Operations:</label>
        <input type="text" id="ops-input" value="insert(10), insert(20), insert(15), decreaseKey(1,5), insert(25), findMax()" style="width: 520px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div>
            <div class="ui-label">Max-Heap Array</div>
            <div class="heap-tiles" id="heap-tiles"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Op</span>
            <span class="info-value" id="val-op" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max Element</span>
            <span class="info-value" id="val-max" style="color:var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Heap Size</span>
            <span class="info-value" id="val-size" style="color:var(--accent-blue);">0</span>
        </div>
    </div>

    <div class="result-display" id="final-result">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#2a1600;border:2px solid #e3b341;border-radius:8px;"></span> Current / Updated</div>
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#0f2a1a;border:2px solid #3fb950;border-radius:8px;"></span> Max Element</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let heap = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 850, 400];

        const examples = [
            ["insert(10)", "insert(20)", "insert(15)", "decreaseKey(1,5)", "insert(25)", "findMax()"],
            ["insert(30)", "insert(20)", "insert(10)", "insert(5)", "decreaseKey(0,8)", "insert(25)", "findMax()"]
        ];

        function generateSteps(ops) {
            heap = [];
            steps = [];

            steps.push({
                type: 'init',
                heap: [],
                panel: `<b>Max-Heap with Decrease-Key</b><br>Start with empty heap`,
                statusText: `Initialized`,
                log: `Start: heap = []`,
                logColor: 'var(--text-dim)'
            });

            ops.forEach((opStr, idx) => {
                steps.push({
                    type: 'op',
                    op: opStr,
                    heap: [...heap],
                    panel: `Operation: <b>${opStr}</b>`,
                    statusText: opStr,
                    log: `\n→ ${opStr}`,
                    logColor: 'var(--accent-orange)'
                });

                const match = opStr.match(/(\w+)\((.*)\)/);
                if (!match) return;
                const cmd = match[1];
                let arg = match[2];

                if (cmd === 'insert') {
                    const val = parseInt(arg);
                    heap.push(val);
                    // Simple bubble up simulation (for visualization)
                    let i = heap.length - 1;
                    while (i > 0) {
                        const parent = Math.floor((i - 1) / 2);
                        if (heap[parent] < heap[i]) {
                            [heap[parent], heap[i]] = [heap[i], heap[parent]];
                            i = parent;
                        } else break;
                    }
                    steps.push({
                        type: 'insert',
                        heap: [...heap],
                        panel: `Inserted <b>${val}</b>`,
                        statusText: `Inserted ${val}`,
                        log: `  Inserted ${val}, heap = [${heap.join(', ')}]`,
                        logColor: 'var(--accent-blue)'
                    });
                } 
                else if (cmd === 'decreaseKey') {
                    const parts = arg.split(',');
                    const index = parseInt(parts[0]);
                    const newVal = parseInt(parts[1]);
                    if (index >= 0 && index < heap.length) {
                        const oldVal = heap[index];
                        heap[index] = newVal;
                        // Rebuild heap (naive for visualization)
                        for (let i = Math.floor(heap.length / 2) - 1; i >= 0; i--) {
                            heapifyDown(i);
                        }
                        steps.push({
                            type: 'decrease',
                            heap: [...heap],
                            panel: `Decreased index <b>${index}</b> from ${oldVal} to <b>${newVal}</b>`,
                            statusText: `Decreased to ${newVal}`,
                            log: `  Decreased index ${index} to ${newVal}`,
                            logColor: 'var(--accent-green)'
                        });
                    }
                } 
                else if (cmd === 'findMax') {
                    const max = heap.length > 0 ? Math.max(...heap) : '—';
                    steps.push({
                        type: 'query',
                        heap: [...heap],
                        panel: `findMax() = <b>${max}</b>`,
                        statusText: `Max = ${max}`,
                        log: `  findMax → ${max}`,
                        logColor: 'var(--accent-green)'
                    });
                }
            });

            const finalMax = heap.length > 0 ? Math.max(...heap) : '—';
            steps.push({
                type: 'final',
                heap: [...heap],
                panel: `<b>Final Max Element: ${finalMax}</b>`,
                statusText: `Done`,
                log: `\nFinal heap: [${heap.join(', ')}]\nMax = ${finalMax}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function heapifyDown(i) {
            const n = heap.length;
            while (true) {
                let largest = i;
                const left = 2 * i + 1;
                const right = 2 * i + 2;
                if (left < n && heap[left] > heap[largest]) largest = left;
                if (right < n && heap[right] > heap[largest]) largest = right;
                if (largest === i) break;
                [heap[i], heap[largest]] = [heap[largest], heap[i]];
                i = largest;
            }
        }

        function renderHeap() {
            const container = document.getElementById('heap-tiles');
            container.innerHTML = '';
            heap.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = val;
                container.appendChild(tile);
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            heap = [...step.heap];
            renderHeap();

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-op').innerText = step.op || '—';
            document.getElementById('val-max').innerText = step.heap.length > 0 ? Math.max(...step.heap) : '—';
            document.getElementById('val-size').innerText = step.heap.length;

            document.getElementById('status-text').innerText = step.statusText || '';
            document.getElementById('final-result').innerText = step.type === 'final' ? `Final Max: ${step.heap.length > 0 ? Math.max(...step.heap) : '—'}` : '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const s = steps[k];
                if (s.log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (s.logColor) line.style.color = s.logColor;
                    if (s.bold) line.style.fontWeight = 'bold';
                    line.innerText = s.log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            const opsStr = document.getElementById('ops-input').value;
            const ops = opsStr.split(',').map(s => s.trim()).filter(Boolean);
            generateSteps(ops);
            reset();
        }

        function loadExample(idx) {
            document.getElementById('ops-input').value = examples[idx].join(', ');
            generateSteps(examples[idx]);
            reset();
        }

        function init() {
            loadExample(0);
        }

        window.onload = init;
    </script>
</body>
</html>
