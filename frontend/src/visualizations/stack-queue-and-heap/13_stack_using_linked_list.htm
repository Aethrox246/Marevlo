<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stack using Linked List - Full Visualization</title>

<style>

:root{
    --bg-page:#000000;
    --bg-surface:#161b22;
    --border-main:#30363d;
    --btn-bg:#21262d;
    --btn-hover:#2d333b;
    --text-main:#c9d1d9;
    --accent-orange:#e3b341;
    --accent-blue:#58a6ff;
    --accent-green:#3fb950;
    --accent-red:#f85149;
}

*{
    box-sizing:border-box;
}

body{
    background:var(--bg-page);
    color:var(--text-main);
    font-family:system-ui,sans-serif;
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.input-bar{
    background:var(--bg-surface);
    padding:12px 20px;
    border-radius:8px;
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

button{
    padding:8px 16px;
    background:var(--btn-bg);
    border:1px solid var(--border-main);
    color:white;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.visual-container{
    display:flex;
    gap:60px;
    margin-top:20px;
    align-items:flex-start;
}

.stack-area{
    text-align:center;
}

.linked-list-container{
    display:flex;
    align-items:center;
    gap:12px;
    padding:25px 30px;
    background:var(--bg-surface);
    border:2px solid var(--border-main);
    border-radius:12px;
    min-height:160px;
}

.node{
    width:78px;
    height:78px;
    background:#21262d;
    border:3px solid var(--accent-blue);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    position:relative;
    transition:0.4s;
}

.node.top{
    border-color:var(--accent-orange);
    box-shadow:0 0 25px var(--accent-orange);
    transform:scale(1.08);
}

.node.highlight{
    background:#2d3748;
    box-shadow:0 0 25px var(--accent-green);
}

.node::after{
    content:'→';
    position:absolute;
    right:-20px;
    color:var(--accent-blue);
    font-size:22px;
}

.node:last-child::after{
    display:none;
}

.output-area{
    text-align:center;
}

.output-container{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:25px 30px;
    background:var(--bg-surface);
    border:2px solid var(--border-main);
    border-radius:12px;
    min-height:160px;
    width:180px;
}

.output-tile{
    padding:14px;
    background:#0f2a1a;
    border:2px solid var(--accent-green);
    border-radius:8px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:var(--accent-green);
}

.action-panel{
    margin:25px 0;
    background:var(--bg-surface);
    border:1px solid var(--border-main);
    border-radius:8px;
    padding:20px;
    width:900px;
    min-height:140px;
    text-align:center;
    line-height:1.6;
}

.controls{
    margin-top:20px;
    display:flex;
    gap:12px;
    align-items:center;
}

.log-container{
    background:var(--bg-surface);
    border:1px solid var(--border-main);
    border-radius:8px;
    height:260px;
    overflow-y:auto;
    padding:12px;
    font-family:monospace;
    font-size:14px;
    width:900px;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="input-bar">
    <button onclick="loadExample(0)">Example 1</button>
    <button onclick="loadExample(1)">Example 2</button>
    <button onclick="resetStack()">Reset</button>
</div>

<div class="visual-container">

    <!-- STACK -->

    <div class="stack-area">

        <div style="
            color:var(--accent-orange);
            font-weight:bold;
            margin-bottom:10px;
        ">
            Stack using Linked List
        </div>

        <div id="list-container"
             class="linked-list-container">
        </div>

    </div>

    <!-- OUTPUT -->

    <div class="output-area">

        <div style="
            color:var(--accent-green);
            font-weight:bold;
            margin-bottom:10px;
        ">
            Popped Values
        </div>

        <div id="output-container"
             class="output-container">
        </div>

    </div>

</div>

<!-- PANEL -->

<div class="action-panel" id="main-panel">

    Click Play to start demonstration

</div>

<!-- CONTROLS -->

<div class="controls">

    <button onclick="resetStack()">↺ Reset</button>

    <button onclick="backStep()">← Back</button>

    <button onclick="togglePlay()" id="play-btn">
        ▶ Play
    </button>

    <button onclick="nextStep()">Next →</button>

    <span style="margin-left:20px">
        Speed:
    </span>

    <input type="range"
           id="speed-slider"
           min="0"
           max="2"
           value="1">

</div>

<!-- LOGS -->

<div class="log-container" id="log-container"></div>

<script>

class Node{

    constructor(data){

        this.data = data;

        this.next = null;
    }
}

let head = null;

let size = 0;

let popped = [];

let steps = [];

let stepIndex = 0;

let timer = null;

const delays = [1800,1000,500];

function init(){

    loadExample(0);
}

function snapshotList(){

    let arr = [];

    let current = head;

    while(current){

        arr.push(current.data);

        current = current.next;
    }

    return arr;
}

function addStep(panel,action,highlight=null){

    steps.push({

        panel:panel,

        action:action,

        highlight:highlight,

        stack:snapshotList(),

        size:size,

        popped:[...popped]
    });
}

function loadExample(ex){

    pause();

    head = null;

    size = 0;

    popped = [];

    steps = [];

    if(ex === 0){

        addStep(
            "Initialize Stack",
            "head = null , size = 0"
        );

        pushStep(10);

        pushStep(20);

        popStep();

        peekStep();

    }else{

        addStep(
            "Initialize Stack",
            "head = null , size = 0"
        );

        pushStep(5);

        pushStep(15);

        pushStep(25);

        popStep();

        popStep();

        isEmptyStep();
    }

    stepIndex = 0;

    renderStep(0);
}

function pushStep(val){

    const newNode = new Node(val);

    newNode.next = head;

    head = newNode;

    size++;

    addStep(
        `Push ${val}`,
        `New node ${val} inserted at HEAD`,
        val
    );
}

function popStep(){

    if(!head){

        addStep(
            "POP Failed",
            "Stack Empty"
        );

        return;
    }

    const val = head.data;

    popped.push(val);

    head = head.next;

    size--;

    addStep(
        `Pop ${val}`,
        `Remove TOP node ${val}`,
        val
    );
}

function peekStep(){

    if(!head){

        addStep(
            "Peek Failed",
            "Stack Empty"
        );

    }else{

        addStep(
            `Peek TOP`,
            `Top Value = ${head.data}`,
            head.data
        );
    }
}

function isEmptyStep(){

    addStep(
        "Check isEmpty()",
        size === 0
        ? "Stack is Empty"
        : "Stack is NOT Empty"
    );
}

function renderList(highlight){

    const container =
        document.getElementById(
            'list-container'
        );

    container.innerHTML = '';

    const step = steps[stepIndex];

    if(step.stack.length === 0){

        const empty =
            document.createElement('div');

        empty.style.color = '#555';

        empty.style.padding = '40px';

        empty.textContent = '(empty stack)';

        container.appendChild(empty);

        return;
    }

    step.stack.forEach((val,index)=>{

        const node =
            document.createElement('div');

        node.className =
            `node ${index===0 ? 'top':''}`;

        if(val === highlight){

            node.classList.add('highlight');
        }

        node.textContent = val;

        container.appendChild(node);
    });
}

function renderOutput(){

    const container =
        document.getElementById(
            'output-container'
        );

    container.innerHTML = '';

    const step = steps[stepIndex];

    step.popped.forEach(val=>{

        const tile =
            document.createElement('div');

        tile.className = 'output-tile';

        tile.textContent = val;

        container.appendChild(tile);
    });
}

function renderStep(idx){

    const step = steps[idx];

    if(!step) return;

    renderList(step.highlight);

    renderOutput();

    document.getElementById(
        'main-panel'
    ).innerHTML = `

        <div style="
            font-size:24px;
            font-weight:bold;
            margin-bottom:10px;
        ">
            ${step.panel}
        </div>

        <div style="
            color:var(--accent-orange);
            font-size:20px;
            font-weight:bold;
        ">
            ${step.action}
        </div>

        <div style="
            margin-top:15px;
            color:#8b949e;
            font-size:17px;
        ">
            Stack Size = ${step.size}
        </div>
    `;

    const logDiv =
        document.getElementById(
            'log-container'
        );

    logDiv.innerHTML = '';

    for(let i=0;i<=idx;i++){

        const line =
            document.createElement('div');

        line.style.margin = '6px 0';

        line.innerHTML = `
            <span style="color:#58a6ff">
                Step ${i}
            </span>

            : ${steps[i].action}
        `;

        logDiv.appendChild(line);
    }

    logDiv.scrollTop =
        logDiv.scrollHeight;
}

function nextStep(){

    if(stepIndex < steps.length - 1){

        stepIndex++;

        renderStep(stepIndex);

    }else{

        pause();
    }
}

function backStep(){

    if(stepIndex > 0){

        stepIndex--;

        renderStep(stepIndex);
    }
}

function resetStack(){

    pause();

    stepIndex = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(timer){

        pause();

    }else{

        btn.textContent = 'Pause';

        if(stepIndex >= steps.length - 1){

            stepIndex = 0;
        }

        timer = setInterval(

            nextStep,

            delays[
                document.getElementById(
                    'speed-slider'
                ).value
            ]
        );
    }
}

function pause(){

    clearInterval(timer);

    timer = null;

    document.getElementById(
        'play-btn'
    ).textContent = 'Play';
}

window.onload = init;

</script>

</body>
</html>
