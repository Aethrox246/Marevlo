<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack + Heap DS - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 12px;
            width: 420px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { 
            margin-top: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 30px; 
            width: 100%; 
            max-width: 1000px; 
        }

        .stack-container, .minstack-container {
            background: #161b22;
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 16px;
            min-width: 200px;
        }
        .stack-label, .minstack-label { 
            color: var(--accent-purple); 
            font-weight: bold; 
            margin-bottom: 10px; 
        }
        .stack-box, .minstack-box {
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 12px;
            min-height: 220px;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            align-items: center;
        }
        .stack-tile, .minstack-tile {
            width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 2px solid var(--accent-purple); background: #0f2a1a; color: var(--accent-purple);
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 26px; width: 760px; min-height: 140px;
            font-family: monospace; font-size: 15px; line-height: 1.65;
        }

        .info-panel { margin: 15px 0; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 8px;
            padding: 12px 22px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .status-bar { margin-top: 8px; font-size: 14px; color: var(--text-dim); min-height: 28px; }

        .controls { margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 15px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 14px 18px; width: 760px; max-width: 95%; height: 180px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Operations:</label>
        <input type="text" id="ops-input" value="insert(5), insert(3), insert(7), getMin(), delete(), getMin()" style="width: 520px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div style="display: flex; gap: 40px;">
            <div class="stack-container">
                <div class="stack-label">Main Stack</div>
                <div class="stack-box" id="main-stack"></div>
            </div>
            <div class="minstack-container">
                <div class="minstack-label">Min Stack</div>
                <div class="stack-box" id="min-stack"></div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Min</span>
            <span class="info-value" id="val-min" style="color:var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Main Stack Size</span>
            <span class="info-value" id="val-main-size" style="color:var(--accent-blue);">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Min Stack Size</span>
            <span class="info-value" id="val-min-size" style="color:var(--accent-purple);">0</span>
        </div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:18px;height:18px;background:#2a1600;border:2px solid #e3b341;border-radius:8px;"></span> Current Operation</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let mainStack = [];
        let minStack = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 850, 400];

        const examples = [
            ["insert(5)", "insert(3)", "insert(7)", "getMin()", "delete()", "getMin()"],
            ["insert(2)", "insert(2)", "insert(1)", "getMin()", "delete()", "getMin()", "delete()", "getMin()"]
        ];

        function generateSteps(ops) {
            mainStack = [];
            minStack = [];
            steps = [];

            steps.push({
                type: 'init',
                mainStack: [],
                minStack: [],
                panel: `<b>Stack + Heap DS (Two Stacks)</b><br>Start empty`,
                statusText: `Initialized`,
                log: `Start: mainStack = [], minStack = []`,
                logColor: 'var(--text-dim)'
            });

            ops.forEach(opStr => {
                steps.push({
                    type: 'op',
                    op: opStr,
                    mainStack: [...mainStack],
                    minStack: [...minStack],
                    panel: `Operation: <b>${opStr}</b>`,
                    statusText: opStr,
                    log: `\n→ ${opStr}`,
                    logColor: 'var(--accent-orange)'
                });

                const match = opStr.match(/(\w+)\((.*)\)/);
                if (!match) return;
                const cmd = match[1];
                let arg = match[2];

                if (cmd === 'insert') {
                    const val = parseInt(arg);
                    mainStack.push(val);
                    if (minStack.length === 0 || val <= minStack[minStack.length - 1]) {
                        minStack.push(val);
                    }
                    steps.push({
                        type: 'insert',
                        mainStack: [...mainStack],
                        minStack: [...minStack],
                        panel: `Inserted <b>${val}</b>`,
                        statusText: `Inserted ${val}`,
                        log: `  Inserted ${val}, main=[${mainStack.join(', ')}], min=[${minStack.join(', ')}]`,
                        logColor: 'var(--accent-blue)'
                    });
                } 
                else if (cmd === 'delete') {
                    if (mainStack.length > 0) {
                        const val = mainStack.pop();
                        if (minStack.length > 0 && val === minStack[minStack.length - 1]) {
                            minStack.pop();
                        }
                        steps.push({
                            type: 'delete',
                            mainStack: [...mainStack],
                            minStack: [...minStack],
                            panel: `Deleted <b>${val}</b>`,
                            statusText: `Deleted ${val}`,
                            log: `  Deleted ${val}, main=[${mainStack.join(', ')}], min=[${minStack.join(', ')}]`,
                            logColor: 'var(--accent-red)'
                        });
                    }
                } 
                else if (cmd === 'getMin') {
                    const minVal = minStack.length > 0 ? minStack[minStack.length - 1] : '—';
                    steps.push({
                        type: 'query',
                        mainStack: [...mainStack],
                        minStack: [...minStack],
                        panel: `getMin() = <b>${minVal}</b>`,
                        statusText: `Min = ${minVal}`,
                        log: `  getMin → ${minVal}`,
                        logColor: 'var(--accent-green)'
                    });
                }
            });

            steps.push({
                type: 'final',
                mainStack: [...mainStack],
                minStack: [...minStack],
                panel: `<b>Final State</b><br>mainStack = [${mainStack.join(', ')}]<br>minStack = [${minStack.join(', ')}]`,
                statusText: `Done`,
                log: `\nFinal mainStack: [${mainStack.join(', ')}]\nFinal minStack: [${minStack.join(', ')}]`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderMainStack() {
            const container = document.getElementById('main-stack');
            container.innerHTML = '';
            for (let i = mainStack.length - 1; i >= 0; i--) {
                const tile = document.createElement('div');
                tile.className = 'stack-tile';
                tile.textContent = mainStack[i];
                container.appendChild(tile);
            }
        }

        function renderMinStack() {
            const container = document.getElementById('min-stack');
            container.innerHTML = '';
            for (let i = minStack.length - 1; i >= 0; i--) {
                const tile = document.createElement('div');
                tile.className = 'minstack-tile';
                tile.textContent = minStack[i];
                container.appendChild(tile);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            mainStack = [...step.mainStack];
            minStack = [...step.minStack];

            renderMainStack();
            renderMinStack();

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-min').innerText = step.type === 'query' || step.type === 'final' ? (step.minStack.length > 0 ? step.minStack[step.minStack.length - 1] : '—') : '—';
            document.getElementById('val-main-size').innerText = mainStack.length;
            document.getElementById('val-min-size').innerText = minStack.length;

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const s = steps[k];
                if (s.log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (s.logColor) line.style.color = s.logColor;
                    if (s.bold) line.style.fontWeight = 'bold';
                    line.innerText = s.log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            const opsStr = document.getElementById('ops-input').value;
            const ops = opsStr.split(',').map(s => s.trim()).filter(Boolean);
            generateSteps(ops);
            reset();
        }

        function loadExample(idx) {
            document.getElementById('ops-input').value = examples[idx].join(', ');
            generateSteps(examples[idx]);
            reset();
        }

        function init() {
            loadExample(0);
        }

        window.onload = init;
    </script>
</body>
</html>
