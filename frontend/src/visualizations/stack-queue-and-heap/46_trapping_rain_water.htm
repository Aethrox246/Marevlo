<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trapping Rain Water - Correct Visualization</title>

<style>

:root{
    --bg-page:#0d1117;
    --bg-surface:#161b22;
    --border-main:#30363d;

    --btn-bg:#21262d;
    --btn-hover:#2d333b;

    --text-main:#c9d1d9;
    --text-dim:#8b949e;

    --accent-orange:#e3b341;
    --accent-blue:#388bfd;
    --accent-green:#3fb950;
    --accent-red:#f85149;
    --accent-purple:#a371f7;
}

*{
    box-sizing:border-box;
}

body{
    background-color:var(--bg-page);

    color:var(--text-main);

    font-family:system-ui,-apple-system,sans-serif;

    margin:0;

    padding:20px 0;

    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:var(--accent-purple);

    margin:0 0 10px 0;
}

.input-bar{
    width:100%;

    max-width:1100px;

    background:var(--bg-surface);

    padding:12px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    justify-content:center;

    border-bottom:1px solid var(--border-main);

    margin-bottom:20px;
}

button{
    padding:8px 16px;

    background:var(--btn-bg);

    border:1px solid var(--border-main);

    color:var(--text-main);

    border-radius:6px;

    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.visual-container{
    background:var(--bg-surface);

    border:3px solid var(--accent-purple);

    border-radius:12px;

    padding:20px;

    width:100%;

    max-width:1000px;

    position:relative;
}

.bars{
    display:flex;

    align-items:flex-end;

    height:280px;

    gap:6px;

    justify-content:center;

    padding:20px 0;

    background:#0d1117;

    border-radius:8px;

    margin-bottom:20px;
}

.bar-container{
    display:flex;

    flex-direction:column;

    align-items:center;

    position:relative;
}

.bar{
    width:28px;

    background:var(--accent-blue);

    border-radius:4px 4px 0 0;

    transition:height 0.3s ease;
}

.bar-label{
    color:var(--text-dim);

    font-size:12px;

    margin-top:4px;
}

.pointers{
    position:absolute;

    bottom:20px;

    width:100%;

    display:flex;

    justify-content:space-between;

    padding:0 40px;

    pointer-events:none;
}

.pointer{
    color:var(--accent-orange);

    font-weight:bold;

    font-size:18px;
}

.action-panel{
    background:var(--bg-surface);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:20px;

    width:100%;

    max-width:900px;

    min-height:130px;

    margin-top:20px;

    font-family:monospace;

    font-size:15px;

    line-height:1.65;
}

.controls{
    margin:20px 0;

    display:flex;

    align-items:center;

    gap:16px;

    flex-wrap:wrap;

    justify-content:center;
}

.log-panel{
    background:var(--bg-page);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:16px 20px;

    width:100%;

    max-width:900px;

    height:220px;

    overflow-y:auto;

    font-family:'Courier New', monospace;

    font-size:14px;
}

</style>
</head>

<body>

<h1>Trapping Rain Water</h1>

<p style="
    color:var(--text-dim);
    margin-bottom:20px;
">
    Two Pointer Optimal Solution
</p>

<div class="input-bar">

    <button onclick="loadExample(0)">
        Example 1
    </button>

    <button onclick="loadExample(1)">
        Example 2
    </button>

    <button onclick="resetSim()">
        Reset
    </button>

</div>

<div class="visual-container">

    <div class="bars"
         id="bars"></div>

</div>

<div class="action-panel"
     id="action">

    Click an example

</div>

<div class="controls">

    <button onclick="prevStep()">
        ← Back
    </button>

    <button onclick="togglePlay()"
            id="play-btn">

        ▶ Play

    </button>

    <button onclick="nextStep()">
        Next →
    </button>

</div>

<div class="log-panel"
     id="log"></div>

<script>

let height = [];

let steps = [];

let stepIdx = 0;

let timer = null;

let isPlaying = false;

const delays = [1450,780,380];

const examples = [

    [0,1,0,2,1,0,1,3,2,1,2,1],

    [4,2,0,3,2,5]
];

function generateSteps(inputHeight){

    height = [...inputHeight];

    steps = [];

    const n = height.length;

    let left = 0;

    let right = n - 1;

    let leftMax = 0;

    let rightMax = 0;

    let water = 0;

    steps.push({

        panel:
            `<b>Initialize</b><br>
            left=0,
            right=${n-1},
            water=0`,

        log:
            `Initialize pointers`,

        height:[...height],

        left:left,

        right:right,

        water:water
    });

    while(left < right){

        if(height[left] <= height[right]){

            leftMax =
                Math.max(
                    leftMax,
                    height[left]
                );

            const add =
                leftMax -
                height[left];

            water += add;

            steps.push({

                panel:
                    `Process LEFT<br>
                    left=${left},
                    height=${height[left]}<br>
                    leftMax=${leftMax}<br>
                    added=${add}<br>
                    total=${water}`,

                log:
                    `LEFT ${left}
                     | add=${add}
                     | total=${water}`,

                height:[...height],

                left:left,

                right:right,

                water:water
            });

            left++;

        }else{

            rightMax =
                Math.max(
                    rightMax,
                    height[right]
                );

            const add =
                rightMax -
                height[right];

            water += add;

            steps.push({

                panel:
                    `Process RIGHT<br>
                    right=${right},
                    height=${height[right]}<br>
                    rightMax=${rightMax}<br>
                    added=${add}<br>
                    total=${water}`,

                log:
                    `RIGHT ${right}
                     | add=${add}
                     | total=${water}`,

                height:[...height],

                left:left,

                right:right,

                water:water
            });

            right--;
        }
    }

    steps.push({

        panel:
            `<b>
            FINAL RESULT
            </b><br>
            Water Trapped =
            <span style="
                color:var(--accent-green)
            ">
            ${water}
            </span>`,

        log:
            `FINAL WATER = ${water}`,

        height:[...height],

        left:left,

        right:right,

        water:water
    });
}

function renderBars(h,left,right){

    const container =
        document.getElementById(
            'bars'
        );

    container.innerHTML = '';

    h.forEach((val,i)=>{

        const barContainer =
            document.createElement('div');

        barContainer.className =
            'bar-container';

        const bar =
            document.createElement('div');

        bar.className = 'bar';

        bar.style.height =
            `${val * 25}px`;

        if(i === left){

            bar.style.background =
                '#f85149';
        }

        if(i === right){

            bar.style.background =
                '#e3b341';
        }

        const label =
            document.createElement('div');

        label.className =
            'bar-label';

        label.textContent = val;

        barContainer.appendChild(bar);

        barContainer.appendChild(label);

        container.appendChild(barContainer);
    });
}

function renderStep(idx){

    stepIdx = idx;

    const step = steps[idx];

    if(!step) return;

    document.getElementById(
        'action'
    ).innerHTML = step.panel;

    renderBars(
        step.height,
        step.left,
        step.right
    );

    const logEl =
        document.getElementById(
            'log'
        );

    logEl.innerHTML =
        steps
        .slice(0,idx+1)
        .map(
            s=>`<div style="
                margin:5px 0;
            ">
            ${s.log}
            </div>`
        )
        .join('');

    logEl.scrollTop =
        logEl.scrollHeight;
}

function nextStep(){

    if(stepIdx < steps.length - 1){

        renderStep(stepIdx + 1);

    }else{

        pause();
    }
}

function prevStep(){

    if(stepIdx > 0){

        renderStep(stepIdx - 1);
    }
}

function resetSim(){

    pause();

    stepIdx = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(isPlaying){

        pause();

    }else{

        isPlaying = true;

        btn.textContent =
            '❚❚ Pause';

        timer =
            setInterval(()=>{

                if(
                    stepIdx <
                    steps.length - 1
                ){

                    nextStep();

                }else{

                    pause();
                }

            },1000);
    }
}

function pause(){

    clearInterval(timer);

    isPlaying = false;

    document.getElementById(
        'play-btn'
    ).textContent =
        '▶ Play';
}

function loadExample(n){

    generateSteps(
        examples[n]
    );

    resetSim();
}

window.onload = () => {

    loadExample(0);
};

</script>

</body>
</html>
