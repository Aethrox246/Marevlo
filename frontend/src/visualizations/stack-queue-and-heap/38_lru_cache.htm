<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LRU Cache Visualization</title>

<style>

:root{
    --bg-page:#0d1117;
    --bg-surface:#161b22;
    --bg-input:#0d1117;

    --border-main:#30363d;

    --btn-bg:#21262d;
    --btn-hover:#2d333b;

    --text-main:#c9d1d9;
    --text-dim:#8b949e;

    --accent-orange:#e3b341;
    --accent-blue:#388bfd;
    --accent-green:#3fb950;
    --accent-red:#f85149;
    --accent-purple:#a371f7;
}

*{
    box-sizing:border-box;
}

body{
    background-color:var(--bg-page);

    color:var(--text-main);

    font-family:system-ui,-apple-system,sans-serif;

    margin:0;

    display:flex;
    flex-direction:column;
    align-items:center;

    min-height:100vh;

    padding-bottom:40px;
}

.input-bar{
    width:100%;

    background-color:var(--bg-surface);

    padding:12px 16px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:12px;

    border-bottom:1px solid var(--border-main);

    flex-wrap:wrap;
}

label.ui-label{
    font-family:'Courier New', monospace;

    font-size:13px;

    color:var(--text-dim);
}

input[type="text"]{
    background:var(--bg-input);

    border:1px solid var(--border-main);

    color:var(--text-main);

    height:32px;

    border-radius:6px;

    padding:0 12px;

    width:320px;

    font-size:14px;
}

button{
    height:32px;

    border-radius:6px;

    padding:0 14px;

    background:var(--btn-bg);

    border:1px solid var(--border-main);

    color:var(--text-main);

    font-size:13px;

    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.visual-container{
    margin-top:30px;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:30px;

    width:100%;

    max-width:1100px;
}

.cache-container{
    display:flex;

    gap:40px;

    align-items:flex-start;
}

.list-container{
    background:#161b22;

    border:3px solid var(--accent-purple);

    border-radius:12px;

    padding:20px;

    width:520px;
}

.list-label{
    color:var(--accent-purple);

    font-weight:bold;

    text-align:center;

    margin-bottom:12px;
}

.doubly-list{
    display:flex;

    align-items:center;

    gap:12px;

    padding:16px;

    background:#21262d;

    border-radius:10px;

    overflow-x:auto;
}

.node{
    background:#2d333b;

    border:3px solid var(--accent-purple);

    border-radius:8px;

    padding:12px 16px;

    text-align:center;

    min-width:90px;

    font-family:monospace;
}

.node.head{
    border-color:var(--accent-green);
}

.node.tail{
    border-color:var(--accent-red);
}

.hashmap-container{
    background:#161b22;

    border:3px solid var(--accent-blue);

    border-radius:12px;

    padding:20px;

    width:320px;
}

.hashmap-table{
    width:100%;

    border-collapse:collapse;
}

.hashmap-table td,
.hashmap-table th{
    border:1px solid var(--border-main);

    padding:8px 12px;

    text-align:left;
}

.action-panel{
    margin-top:20px;

    background:var(--bg-surface);

    border:1px solid var(--border-main);

    border-radius:8px;

    padding:20px 28px;

    width:820px;

    min-height:160px;

    font-family:monospace;

    font-size:15px;

    line-height:1.65;
}

.controls{
    margin-top:20px;

    display:flex;

    align-items:center;

    gap:14px;

    flex-wrap:wrap;

    justify-content:center;
}

input[type="range"]{
    accent-color:var(--accent-blue);

    width:180px;
}

.log-panel{
    margin-top:20px;

    background:var(--bg-page);

    border:1px solid var(--border-main);

    border-radius:8px;

    padding:16px 20px;

    width:820px;

    height:210px;

    overflow-y:auto;

    font-family:'Courier New', monospace;

    font-size:13.5px;

    line-height:1.55;
}

</style>
</head>

<body>

<div class="input-bar">

    <label class="ui-label">
        Capacity:
    </label>

    <input type="text"
           id="capacity-input"
           value="2"
           style="width:80px;">

    <button onclick="loadExample(0)">
        Ex 1
    </button>

    <button onclick="loadExample(1)">
        Ex 2
    </button>

</div>

<div class="visual-container">

    <div class="cache-container">

        <!-- DLL -->

        <div class="list-container">

            <div class="list-label">
                Doubly Linked List (MRU → LRU)
            </div>

            <div class="doubly-list"
                 id="dlist"></div>

        </div>

        <!-- HASHMAP -->

        <div class="hashmap-container">

            <div class="list-label">
                HashMap
            </div>

            <table class="hashmap-table"
                   id="hash-table">

                <tr>
                    <th>Key</th>
                    <th>Value</th>
                </tr>

            </table>

        </div>

    </div>

</div>

<!-- PANEL -->

<div class="action-panel"
     id="main-panel">

    —

</div>

<!-- CONTROLS -->

<div class="controls">

    <button onclick="reset()">
        ↺ Reset
    </button>

    <button onclick="back()">
        ← Back
    </button>

    <button onclick="togglePlay()"
            id="play-btn">

        ▶ Play

    </button>

    <button onclick="next()">
        Next →
    </button>

</div>

<!-- LOG -->

<div class="log-panel"
     id="log"></div>

<script>

let capacity = 2;

let cache = new Map();

let head = null;

let tail = null;

let steps = [];

let stepIndex = 0;

let timer = null;

class Node{

    constructor(key,value){

        this.key = key;

        this.value = value;

        this.prev = null;

        this.next = null;
    }
}

const examples = [

    [
        {op:'put',key:1,val:1},
        {op:'put',key:2,val:2},
        {op:'get',key:1},
        {op:'put',key:3,val:3},
        {op:'get',key:2},
        {op:'put',key:4,val:4},
        {op:'get',key:1},
        {op:'get',key:3},
        {op:'get',key:4}
    ],

    [
        {op:'put',key:2,val:1},
        {op:'get',key:2},
        {op:'put',key:3,val:2},
        {op:'get',key:2},
        {op:'get',key:3}
    ]
];

function addNode(node){

    if(!head){

        head = tail = node;

        return;
    }

    node.prev = null;

    node.next = head;

    head.prev = node;

    head = node;
}

function removeNode(node){

    if(node.prev){

        node.prev.next = node.next;
    }

    if(node.next){

        node.next.prev = node.prev;
    }

    if(node === head){

        head = node.next;
    }

    if(node === tail){

        tail = node.prev;
    }
}

function moveToHead(node){

    if(node === head) return;

    removeNode(node);

    addNode(node);
}

function generateSteps(ops){

    capacity =
        parseInt(
            document.getElementById(
                'capacity-input'
            ).value
        ) || 2;

    cache = new Map();

    head = null;

    tail = null;

    steps = [];

    function snapshot(panel,status,log,color){

        let list = [];

        let curr = head;

        while(curr){

            list.push({

                key:curr.key,

                value:curr.value
            });

            curr = curr.next;
        }

        let mapArr = [];

        cache.forEach((node,key)=>{

            mapArr.push({

                key:key,

                value:node.value
            });
        });

        steps.push({

            panel,
            status,
            log,
            color,

            cacheState:list,

            mapState:mapArr
        });
    }

    snapshot(
        `LRU Cache Capacity = ${capacity}`,
        `Initialized`,
        `Start Cache`,
        'var(--accent-blue)'
    );

    ops.forEach(op=>{

        snapshot(
            `Operation: <b>${op.op}(${op.key}${op.val !== undefined ? ',' + op.val : ''})</b>`,
            `${op.op}`,
            `${op.op}(${op.key}${op.val !== undefined ? ',' + op.val : ''})`,
            'var(--accent-orange)'
        );

        if(op.op === 'put'){

            const key = op.key;

            const val = op.val;

            if(cache.has(key)){

                const node =
                    cache.get(key);

                node.value = val;

                moveToHead(node);

                snapshot(
                    `Update Key ${key}`,
                    `Updated`,
                    `Move key ${key} to head`,
                    'var(--accent-green)'
                );

            }else{

                const node =
                    new Node(key,val);

                cache.set(key,node);

                addNode(node);

                snapshot(
                    `Insert (${key},${val})`,
                    `Inserted`,
                    `Added key ${key}`,
                    'var(--accent-green)'
                );

                if(cache.size > capacity){

                    const lru = tail;

                    snapshot(
                        `Evict LRU Key ${lru.key}`,
                        `Evict`,
                        `Remove key ${lru.key}`,
                        'var(--accent-red)'
                    );

                    removeNode(lru);

                    cache.delete(lru.key);

                    snapshot(
                        `Key ${lru.key} Removed`,
                        `Removed`,
                        `Deleted ${lru.key}`,
                        'var(--accent-red)'
                    );
                }
            }

        }else if(op.op === 'get'){

            const key = op.key;

            let result = -1;

            if(cache.has(key)){

                const node =
                    cache.get(key);

                result = node.value;

                moveToHead(node);

                snapshot(
                    `get(${key}) = ${result}`,
                    `Found`,
                    `Move key ${key} to head`,
                    'var(--accent-green)'
                );

            }else{

                snapshot(
                    `get(${key}) = -1`,
                    `Not Found`,
                    `Key ${key} missing`,
                    'var(--accent-red)'
                );
            }

            snapshot(
                `Return ${result}`,
                `Returned`,
                `Output → ${result}`,
                'var(--accent-orange)'
            );
        }
    });
}

function renderList(step){

    const container =
        document.getElementById(
            'dlist'
        );

    container.innerHTML = '';

    if(!step.cacheState.length){

        container.innerHTML =
            '<div style="padding:20px;color:gray;">Empty Cache</div>';

        return;
    }

    step.cacheState.forEach((node,index)=>{

        const div =
            document.createElement('div');

        div.className = 'node';

        if(index === 0){

            div.classList.add('head');
        }

        if(index === step.cacheState.length - 1){

            div.classList.add('tail');
        }

        div.innerHTML =
            `<b>${node.key}</b><br>${node.value}`;

        container.appendChild(div);
    });
}

function renderHashmap(step){

    const table =
        document.getElementById(
            'hash-table'
        );

    table.innerHTML =
        `<tr>
            <th>Key</th>
            <th>Value</th>
         </tr>`;

    step.mapState.forEach(item=>{

        const row =
            document.createElement('tr');

        row.innerHTML =
            `<td>${item.key}</td>
             <td>${item.value}</td>`;

        table.appendChild(row);
    });
}

function renderStep(idx){

    const step = steps[idx];

    if(!step) return;

    renderList(step);

    renderHashmap(step);

    document.getElementById(
        'main-panel'
    ).innerHTML = step.panel;

    const logPanel =
        document.getElementById(
            'log'
        );

    logPanel.innerHTML = '';

    for(let i = 0; i <= idx; i++){

        const s = steps[i];

        const line =
            document.createElement('div');

        line.innerText = s.log;

        line.style.color = s.color;

        line.style.marginBottom = '6px';

        logPanel.appendChild(line);
    }

    logPanel.scrollTop =
        logPanel.scrollHeight;
}

function next(){

    if(stepIndex < steps.length - 1){

        stepIndex++;

        renderStep(stepIndex);

    }else{

        pause();
    }
}

function back(){

    if(stepIndex > 0){

        stepIndex--;

        renderStep(stepIndex);
    }
}

function reset(){

    pause();

    stepIndex = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(timer){

        pause();

    }else{

        btn.innerText = 'Pause';

        timer = setInterval(()=>{

            if(stepIndex < steps.length - 1){

                next();

            }else{

                pause();
            }

        },1000);
    }
}

function pause(){

    clearInterval(timer);

    timer = null;

    document.getElementById(
        'play-btn'
    ).innerText = '▶ Play';
}

function loadExample(idx){

    if(idx === 0){

        document.getElementById(
            'capacity-input'
        ).value = 2;

    }else{

        document.getElementById(
            'capacity-input'
        ).value = 1;
    }

    generateSteps(examples[idx]);

    reset();
}

window.onload = () => {

    loadExample(0);
};

</script>

</body>
</html>
