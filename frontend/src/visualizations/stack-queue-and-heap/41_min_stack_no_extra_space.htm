<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Stack (No Extra Space) - Difference Encoding</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 8px 0; }

        .input-bar {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .stack-container {
            background: var(--bg-surface);
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
        }
        .stack-label {
            color: var(--accent-purple);
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
        }
        .stack {
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            min-height: 260px;
            padding: 20px;
            background: #21262d;
            border-radius: 10px;
            align-items: center;
        }
        .stack-tile {
            background: #2d333b;
            border: 2px solid var(--accent-blue);
            padding: 12px 24px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            min-width: 80px;
            text-align: center;
        }
        .stack-tile.min { border-color: var(--accent-green); }

        .info {
            margin-top: 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 18px;
            width: 100%;
            max-width: 900px;
            font-family: monospace;
            line-height: 1.7;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px 20px;
            width: 100%;
            max-width: 900px;
            height: 220px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Min Stack (No Extra Space)</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">Difference Encoding • O(1) time & extra space</p>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="customPush()">Push Random</button>
        <button onclick="resetSim()">Reset</button>
    </div>

    <div class="stack-container">
        <div class="stack-label">Stack (stored diff) — Current min: <span id="cur-min" style="color:var(--accent-green)">—</span></div>
        <div class="stack" id="stack-vis"></div>
    </div>

    <div class="info" id="action-info">
        Click an example to start
    </div>

    <div class="controls">
        <button onclick="prevStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1" style="width:140px;"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let stack = [];        // stores encoded diffs
        let minVal = null;
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1600, 850, 420];

        const examples = [
            [
                {op: 'push', val: 5},
                {op: 'push', val: 3},
                {op: 'push', val: 7},
                {op: 'getMin'},
                {op: 'pop'},
                {op: 'getMin'}
            ],
            [
                {op: 'push', val: 10},
                {op: 'push', val: 20},
                {op: 'getMin'},
                {op: 'push', val: 5},
                {op: 'getMin'},
                {op: 'pop'},
                {op: 'getMin'}
            ]
        ];

        function push(val) {
            if (minVal === null) {
                stack.push(0);
                minVal = val;
            } else {
                const diff = val - minVal;
                stack.push(diff);
                if (diff < 0) minVal = val;
            }
        }

        function pop() {
            if (stack.length === 0) return null;
            const diff = stack.pop();
            if (diff < 0) {
                const prevMin = minVal - diff;
                minVal = prevMin;
            }
            if (stack.length === 0) minVal = null;
            return true;
        }

        function getTop() {
            if (stack.length === 0) return null;
            const diff = stack[stack.length - 1];
            return diff < 0 ? minVal : minVal + diff;
        }

        function generateSteps(ops) {
            stack = [];
            minVal = null;
            steps = [];

            steps.push({
                panel: `<b>Min Stack initialized</b><br>stack = [] | min = —`,
                log: `Initialize stack`,
                stackSnapshot: [],
                minSnapshot: null
            });

            ops.forEach(op => {
                let panel = '', log = '';

                if (op.op === 'push') {
                    const beforeMin = minVal;
                    push(op.val);
                    panel = `push(<b>${op.val}</b>) → diff stored`;
                    log = `push(${op.val}) | new min = ${minVal}`;
                } else if (op.op === 'pop') {
                    const topBefore = getTop();
                    pop();
                    panel = `pop() → removed ${topBefore}`;
                    log = `pop() → ${topBefore}`;
                } else if (op.op === 'getMin') {
                    panel = `getMin() = <b>${minVal}</b>`;
                    log = `getMin() → ${minVal}`;
                }

                steps.push({
                    panel: panel,
                    log: log,
                    stackSnapshot: [...stack],
                    minSnapshot: minVal
                });
            });
        }

        function renderStack() {
            const container = document.getElementById('stack-vis');
            container.innerHTML = '';
            if (stack.length === 0) {
                container.innerHTML = `<div style="color:var(--text-dim);padding:60px 0;">Empty Stack</div>`;
                return;
            }
            stack.forEach((diff, idx) => {
                const tile = document.createElement('div');
                tile.className = 'stack-tile';
                if (diff < 0) tile.classList.add('min');
                tile.innerHTML = `${diff} <span style="font-size:12px;color:var(--text-dim)">(${idx === stack.length-1 ? 'top' : ''})</span>`;
                container.appendChild(tile);
            });
            document.getElementById('cur-min').textContent = minVal !== null ? minVal : '—';
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('action-info').innerHTML = step.panel || '—';
            renderStack();

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx+1).map(s => 
                `<div style="margin:4px 0;white-space:pre-wrap;">${s.log}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            generateSteps(examples[n]);
            resetSim();
        }

        function customPush() {
            const val = Math.floor(Math.random() * 21) - 5; // -5 to 15
            if (steps.length === 0) {
                generateSteps([{op:'push', val}]);
            } else {
                // add one more push to current simulation
                const lastStep = steps[steps.length-1];
                generateSteps([...examples[0].slice(0,3), {op:'push', val}]); // simplistic
                resetSim();
            }
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
