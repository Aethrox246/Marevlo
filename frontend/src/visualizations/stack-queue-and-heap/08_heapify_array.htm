<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heapify Array - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-bar {
            background: var(--bg-surface);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .heap-container {
            display: flex;
            gap: 12px;
            padding: 25px 30px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 12px;
            min-height: 160px;
            align-items: flex-end;
        }

        .heap-slot {
            width: 68px;
            height: 88px;
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            position: relative;
            transition: all 0.4s ease;
        }

        .heap-slot.root {
            border-color: var(--accent-orange);
            box-shadow: 0 0 20px var(--accent-orange);
        }

        .heap-slot.current {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px var(--accent-blue);
            transform: scale(1.08);
        }

        .heap-slot .index {
            position: absolute;
            top: -22px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .action-panel {
            margin: 25px 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 18px;
            width: 820px;
            text-align: center;
            min-height: 110px;
            line-height: 1.5;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .log-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            height: 240px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 13.5px;
            width: 820px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1 [3,1,4,1,5]</button>
        <button onclick="loadExample(1)">Example 2 [5,4,3,2,1]</button>
        <button onclick="resetHeap()">Reset</button>
    </div>

    <div class="heap-area">
        <div style="color:var(--accent-orange); font-weight:bold; margin-bottom:12px;">Min-Heap Array (Heapify)</div>
        <div id="heap-container" class="heap-container"></div>
    </div>

    <div class="action-panel" id="main-panel">Click Play to start automatic demonstration</div>

    <div class="controls">
        <button onclick="resetHeap()">↺ Reset</button>
        <button onclick="backStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <span style="margin-left:20px">Speed:</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="log-container" id="log-container"></div>

    <script>
        let arr = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            steps = [];
            document.getElementById('log-container').innerHTML = '';

            if (ex === 0) {
                // Example 1
                arr = [3, 1, 4, 1, 5];
                addStep("Initial Array", [3,1,4,1,5], -1, "Starting Heapify");
                addStep("Heapify at index 1 (value=1)", [1,3,4,1,5], 1, "1 < 3 → Swap");
                addStep("Heapify at index 2 (value=4)", [1,3,4,1,5], 2, "No Swap");
                addStep("Heapify at index 3 (value=1)", [1,1,4,3,5], 3, "1 < 3 → Swap");
                addStep("Heapify at index 4 (value=5)", [1,1,4,3,5], 4, "No Swap");
                addStep("Final Min-Heap", [1,1,4,3,5], -1, "Heap Complete");
            } else {
                // Example 2 - Final result changed to [1,2,4,5,3]
                arr = [5, 4, 3, 2, 1];
                addStep("Initial Array", [5,4,3,2,1], -1, "Starting Heapify");
                addStep("Heapify at index 1 (value=4)", [4,5,3,2,1], 1, "4 < 5 → Swap");
                addStep("Heapify at index 2 (value=3)", [3,5,4,2,1], 2, "3 < 5 → Swap");
                addStep("Heapify at index 3 (value=2)", [2,3,4,5,1], 3, "2 < 5 → Swap → 2 < 3 → Swap");
                addStep("Heapify at index 4 (value=1)", [1,2,4,5,3], 4, "1 < 3 → Swap → 1 < 2 → Swap");
                addStep("Final Min-Heap", [1,2,4,5,3], -1, "Heap Complete");
            }

            stepIndex = 0;
            renderStep(0);
        }

        function addStep(text, currentArr, currentIdx = -1, detail = "") {
            steps.push({
                panel: text + (detail ? `<br><small style="color:var(--text-dim)">${detail}</small>` : ""),
                arr: [...currentArr],
                currentIdx: currentIdx,
                log: text
            });
        }

        function renderHeap(currentArr, currentIdx) {
            const container = document.getElementById('heap-container');
            container.innerHTML = '';

            currentArr.forEach((val, i) => {
                const slot = document.createElement('div');
                slot.className = `heap-slot ${i === 0 ? 'root' : ''} ${i === currentIdx ? 'current' : ''}`;
                
                const idxDiv = document.createElement('div');
                idxDiv.className = 'index';
                idxDiv.textContent = i;
                slot.appendChild(idxDiv);
                
                slot.innerHTML += `<div>${val}</div>`;
                container.appendChild(slot);
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderHeap(step.arr, step.currentIdx);
            document.getElementById('main-panel').innerHTML = step.panel;

            const logDiv = document.getElementById('log-container');
            logDiv.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                const line = document.createElement('div');
                line.style.margin = '4px 0';
                line.innerHTML = steps[i].log;
                logDiv.appendChild(line);
            }
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function nextStep() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function backStep() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function resetHeap() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(nextStep, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
