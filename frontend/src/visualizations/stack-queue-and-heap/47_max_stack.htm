<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Stack - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 10px 0; }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .main {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            justify-content: center;
        }

        .stack-container, .max-container {
            background: var(--bg-surface);
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px;
            width: 320px;
        }

        .stack-label { color: var(--accent-purple); text-align: center; margin-bottom: 12px; font-weight: bold; }
        .stack {
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            min-height: 300px;
            padding: 16px;
            background: #21262d;
            border-radius: 10px;
        }
        .tile {
            background: #2d333b;
            border: 2px solid var(--accent-blue);
            padding: 12px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
        }
        .tile.max { border-color: var(--accent-orange); }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            min-height: 140px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.65;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px 20px;
            width: 100%;
            max-width: 900px;
            height: 220px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Max Stack</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">Two Stacks Approach • O(1) peekMax • O(n) popMax worst case</p>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetSim()">Reset</button>
    </div>

    <div class="main">
        <div class="stack-container">
            <div class="stack-label">Main Stack</div>
            <div class="stack" id="main-stack"></div>
        </div>
        <div class="stack-container">
            <div class="stack-label">Max Tracker Stack</div>
            <div class="stack" id="max-stack"></div>
        </div>
    </div>

    <div class="action-panel" id="action">Click an example to begin</div>

    <div class="controls">
        <button onclick="prevStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let mainStack = [];
        let maxStack = [];
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1600, 850, 400];

        const examples = [
            // Example 1
            ["push(5)", "push(1)", "push(5)", "peekMax()", "popMax()", "pop()", "peekMax()"],
            // Example 2
            ["push(3)", "push(2)", "push(4)", "push(1)", "popMax()", "popMax()", "peekMax()"]
        ];

        function generateSteps(ops) {
            mainStack = [];
            maxStack = [];
            steps = [];

            steps.push({
                panel: `<b>Initialize</b><br>Main Stack: []<br>Max Stack: []`,
                log: `Start with empty stacks`,
                main: [],
                max: [],
                highlightMain: [],
                highlightMax: []
            });

            let output = [];

            for (let op of ops) {
                let action = "";
                if (op.startsWith("push")) {
                    const val = parseInt(op.match(/\d+/)[0]);
                    mainStack.push(val);
                    const newMax = maxStack.length === 0 ? val : Math.max(val, maxStack[maxStack.length - 1]);
                    maxStack.push(newMax);
                    action = `push(${val}) → Main: [${mainStack}], Max: [${maxStack}]`;
                } 
                else if (op === "peekMax()") {
                    const mx = maxStack.length ? maxStack[maxStack.length - 1] : null;
                    output.push(mx);
                    action = `peekMax() → ${mx}`;
                } 
                else if (op === "popMax()") {
                    if (mainStack.length === 0) {
                        action = `popMax() → empty`;
                    } else {
                        const maxVal = maxStack[maxStack.length - 1];
                        // Find topmost occurrence of maxVal
                        let idx = mainStack.length - 1;
                        while (idx >= 0 && mainStack[idx] !== maxVal) idx--;
                        const removed = mainStack.splice(idx, 1)[0];
                        maxStack.pop(); // remove corresponding max
                        // Rebuild maxStack from remaining mainStack
                        maxStack = [];
                        let curMax = -Infinity;
                        for (let v of mainStack) {
                            curMax = Math.max(curMax, v);
                            maxStack.push(curMax);
                        }
                        output.push(removed);
                        action = `popMax() → removed ${removed}`;
                    }
                } 
                else if (op === "pop()") {
                    if (mainStack.length > 0) {
                        const val = mainStack.pop();
                        maxStack.pop();
                        output.push(val);
                        action = `pop() → ${val}`;
                    } else {
                        action = `pop() → empty`;
                    }
                }

                steps.push({
                    panel: `<b>${op}</b><br>${action}`,
                    log: action,
                    main: [...mainStack],
                    max: [...maxStack],
                    highlightMain: mainStack.length ? [mainStack.length - 1] : [],
                    highlightMax: maxStack.length ? [maxStack.length - 1] : []
                });
            }

            steps.push({
                panel: `<b>FINAL OUTPUT</b><br>${output.join(", ")}`,
                log: `Final output: ${output.join(", ")}`,
                main: [...mainStack],
                max: [...maxStack],
                highlightMain: [],
                highlightMax: []
            });
        }

        function renderStack(containerId, arr, highlight = []) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            arr.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                if (highlight.includes(i)) tile.classList.add('max');
                tile.textContent = val;
                container.appendChild(tile);
            });
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('action').innerHTML = step.panel || '—';
            renderStack('main-stack', step.main, step.highlightMain);
            renderStack('max-stack', step.max, step.highlightMax);

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx + 1).map(s => 
                `<div style="margin:5px 0;">${s.log}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(n) {
            generateSteps(examples[n]);
            resetSim();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
