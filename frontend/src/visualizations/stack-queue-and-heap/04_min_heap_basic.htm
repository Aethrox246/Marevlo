<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Min Heap Visualization</title>

    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-bar {
            background: var(--bg-surface);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: var(--btn-hover);
        }

        .visual-container {
            margin-top: 20px;
            display: flex;
            gap: 60px;
            width: 100%;
            max-width: 1100px;
            justify-content: center;
        }

        .heap-area,
        .output-area {
            text-align: center;
        }

        .heap-container,
        .output-container {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 12px;
            min-height: 140px;
            align-items: flex-end;
            min-width: 380px;
        }

        .heap-slot,
        .output-tile {
            width: 62px;
            height: 82px;
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            position: relative;
            transition: all 0.4s ease;
        }

        .heap-slot.root {
            border-color: var(--accent-orange);
            box-shadow: 0 0 18px var(--accent-orange);
        }

        .output-tile {
            border-color: var(--accent-green);
            background: #0f2a1a;
            color: var(--accent-green);
        }

        .action-panel {
            margin: 20px 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 18px;
            width: 780px;
            text-align: center;
            min-height: 90px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .log-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 13.5px;
            width: 780px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetHeap()">Reset</button>
    </div>

    <div class="visual-container">

        <div class="heap-area">
            <div style="color:var(--accent-orange); font-weight:bold;">
                Min Heap Array
            </div>

            <div id="heap-container" class="heap-container"></div>
        </div>

        <div class="output-area">
            <div style="color:var(--accent-green); font-weight:bold;">
                Final Output (Extracted Mins)
            </div>

            <div id="output-container" class="output-container"></div>
        </div>

    </div>

    <div class="action-panel" id="main-panel">
        Click Play to start automatic demonstration
    </div>

    <div class="controls">
        <button onclick="resetHeap()">↺ Reset</button>
        <button onclick="backStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>

        <span style="margin-left:20px">Speed:</span>

        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="log-container" id="log-container"></div>

    <script>

        let heap = [];
        let extracted = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;

        const delays = [1600, 900, 450];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {

            pause();

            heap = [];
            extracted = [];
            steps = [];

            document.getElementById('log-container').innerHTML = '';

            if (ex === 0) {

                // Example 1

                addStep("Initialize empty heap", [], []);

                insertStep(5);
                insertStep(3);
                insertStep(8);

                extractStep();

                insertStep(1);

                extractStep();

            } else {

                // Example 2

                addStep("Initialize empty heap", [], []);

                insertStep(10);
                insertStep(20);

                extractStep(); // 10
                extractStep(); // 20
                extractStep(); // none
            }

            stepIndex = 0;

            renderStep(stepIndex);
        }

        function addStep(text, currentHeap, currentExtracted) {

            steps.push({
                panel: text,
                heap: [...currentHeap],
                extracted: [...currentExtracted],
                log: text
            });
        }

        function insertStep(val) {

            heap.push(val);

            heapifyUp(heap.length - 1);

            addStep(
                `Insert ${val} → Heapify Up`,
                heap,
                extracted
            );
        }

        // FIXED VERSION
        function extractStep() {

            if (heap.length === 0) {

                addStep(
                    `ExtractMin → <span style="color:var(--accent-red)">none</span>`,
                    heap,
                    extracted
                );

                return;
            }

            const min = heap[0];

            // If only one element exists
            if (heap.length === 1) {

                heap.pop();

            } else {

                heap[0] = heap.pop();

                heapifyDown(0);
            }

            extracted.push(min);

            addStep(
                `ExtractMin → ${min} → Heapify Down`,
                heap,
                extracted
            );
        }

        function heapifyUp(idx) {

            while (idx > 0) {

                const p = Math.floor((idx - 1) / 2);

                if (heap[p] > heap[idx]) {

                    [heap[p], heap[idx]] =
                    [heap[idx], heap[p]];

                    idx = p;

                } else {

                    break;
                }
            }
        }

        function heapifyDown(idx) {

            const n = heap.length;

            while (true) {

                let smallest = idx;

                const l = 2 * idx + 1;
                const r = 2 * idx + 2;

                if (l < n && heap[l] < heap[smallest]) {
                    smallest = l;
                }

                if (r < n && heap[r] < heap[smallest]) {
                    smallest = r;
                }

                if (smallest !== idx) {

                    [heap[idx], heap[smallest]] =
                    [heap[smallest], heap[idx]];

                    idx = smallest;

                } else {

                    break;
                }
            }
        }

        function renderHeap(arr) {

            const container =
                document.getElementById('heap-container');

            container.innerHTML = '';

            arr.forEach((val, index) => {

                const slot = document.createElement('div');

                slot.className =
                    `heap-slot ${index === 0 ? 'root' : ''}`;

                slot.innerHTML = `<div>${val}</div>`;

                container.appendChild(slot);
            });

            if (arr.length === 0) {

                const empty = document.createElement('div');

                empty.style.color = '#555';
                empty.style.padding = '40px';

                empty.textContent = '(empty)';

                container.appendChild(empty);
            }
        }

        function renderOutput(ext) {

            const container =
                document.getElementById('output-container');

            container.innerHTML = '';

            ext.forEach(val => {

                const tile = document.createElement('div');

                tile.className = 'output-tile';

                tile.textContent = val;

                container.appendChild(tile);
            });
        }

        function renderStep(idx) {

            const step = steps[idx];

            if (!step) return;

            renderHeap(step.heap);

            renderOutput(step.extracted);

            document.getElementById('main-panel').innerHTML =
                step.panel;

            const logDiv =
                document.getElementById('log-container');

            logDiv.innerHTML = '';

            for (let i = 0; i <= idx; i++) {

                const line = document.createElement('div');

                line.style.margin = '4px 0';

                line.innerHTML = steps[i].log;

                logDiv.appendChild(line);
            }

            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function nextStep() {

            if (stepIndex < steps.length - 1) {

                stepIndex++;

                renderStep(stepIndex);

            } else {

                pause();
            }
        }

        function backStep() {

            if (stepIndex > 0) {

                stepIndex--;

                renderStep(stepIndex);
            }
        }

        function resetHeap() {

            pause();

            stepIndex = 0;

            renderStep(0);
        }

        function togglePlay() {

            const btn =
                document.getElementById('play-btn');

            if (timer) {

                pause();

            } else {

                btn.textContent = 'Pause';

                if (stepIndex >= steps.length - 1) {
                    stepIndex = 0;
                }

                timer = setInterval(
                    nextStep,
                    delays[
                        document.getElementById('speed-slider').value
                    ]
                );
            }
        }

        function pause() {

            clearInterval(timer);

            timer = null;

            document.getElementById('play-btn').textContent =
                'Play';
        }

        window.onload = init;

    </script>

</body>
</html>
