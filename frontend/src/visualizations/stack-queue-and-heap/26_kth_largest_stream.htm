<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kth Largest in Stream</title>

<style>

:root{
    --bg-page:#0d1117;
    --bg-surface:#161b22;
    --border-main:#30363d;

    --btn-bg:#21262d;
    --btn-hover:#2d333b;

    --text-main:#c9d1d9;
    --text-dim:#8b949e;

    --accent-purple:#a371f7;
    --accent-blue:#388bfd;
    --accent-green:#3fb950;
    --accent-orange:#e3b341;
}

*{
    box-sizing:border-box;
}

body{
    background-color:var(--bg-page);

    color:var(--text-main);

    font-family:system-ui,-apple-system,sans-serif;

    margin:0;

    padding:20px 0;

    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:var(--accent-purple);

    margin:0 0 8px 0;
}

.input-bar{

    width:100%;

    max-width:1100px;

    background:var(--bg-surface);

    padding:12px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    justify-content:center;

    border-bottom:1px solid var(--border-main);

    margin-bottom:20px;
}

button{

    padding:8px 16px;

    background:var(--btn-bg);

    border:1px solid var(--border-main);

    color:var(--text-main);

    border-radius:6px;

    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.viz{

    display:flex;

    gap:60px;

    width:100%;

    max-width:1100px;

    flex-wrap:wrap;

    justify-content:center;
}

.stream{

    text-align:center;
}

.label{

    color:var(--accent-purple);

    font-weight:bold;

    margin-bottom:8px;
}

.stream-list{

    display:flex;

    gap:6px;

    padding:12px;

    background:#21262d;

    border-radius:10px;
}

.tile{

    padding:12px 18px;

    border-radius:8px;

    font-family:monospace;

    font-size:17px;

    min-width:52px;

    text-align:center;

    border:2px solid var(--accent-orange);
}

.heap-container{

    text-align:center;
}

.heap{

    background:#21262d;

    border:3px solid var(--accent-blue);

    border-radius:12px;

    padding:16px;

    min-height:300px;

    width:180px;

    display:flex;

    flex-direction:column-reverse;

    gap:6px;

    align-items:center;
}

.info{

    margin:20px 0;

    text-align:center;

    font-family:monospace;

    line-height:1.6;
}

.action-panel{

    background:var(--bg-surface);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:18px;

    width:100%;

    max-width:1000px;

    min-height:140px;

    margin:20px 0;

    font-family:monospace;
}

.controls{

    margin:20px 0;

    display:flex;

    align-items:center;

    gap:16px;

    flex-wrap:wrap;

    justify-content:center;
}

.log-panel{

    background:var(--bg-page);

    border:1px solid var(--border-main);

    border-radius:10px;

    padding:16px;

    width:100%;

    max-width:1000px;

    height:240px;

    overflow-y:auto;

    font-family:'Courier New', monospace;

    font-size:14px;
}

</style>
</head>

<body>

<h1>Kth Largest in Stream</h1>

<p style="
color:var(--text-dim);
margin-bottom:20px;
">
Sort Descending + Query Kth Largest
</p>

<div class="input-bar">

    <button onclick="loadExample(0)">
        Example 1
    </button>

    <button onclick="loadExample(1)">
        Example 2
    </button>

    <button onclick="resetSim()">
        Reset
    </button>

</div>

<div class="viz">

    <div class="stream">

        <div class="label">
            Stream Added
        </div>

        <div class="stream-list"
             id="stream-vis"></div>

    </div>

    <div class="heap-container">

        <div class="label">
            Sorted Descending
        </div>

        <div class="heap"
             id="heap-vis"></div>

    </div>

</div>

<div class="info">

    Kth Largest:
    <span id="kth-val"
          style="
          color:var(--accent-green)
          ">
          —
    </span>

</div>

<div class="action-panel"
     id="action">

Click an example to begin

</div>

<div class="controls">

    <button onclick="prevStep()">
        ← Back
    </button>

    <button onclick="togglePlay()"
            id="play-btn">

        ▶ Play

    </button>

    <button onclick="nextStep()">
        Next →
    </button>

    <label>

        Speed

        <input type="range"
               id="speed"
               min="0"
               max="2"
               value="1">

    </label>

</div>

<div class="log-panel"
     id="log"></div>

<script>

let stream = [];

let steps = [];

let stepIdx = 0;

let timer = null;

let isPlaying = false;

const delays = [1650,850,380];

const examples = [

    {
        stream:[5,3,8,2],

        queries:[2,3]
    },

    {
        stream:[10,20,30],

        queries:[
            [1,2],
            [1,2],
            [1,2]
        ]
    }
];

function generateSteps(
    inputStream,
    queries
){

    stream = [...inputStream];

    steps = [];

    let outputs = [];

    steps.push({

        panel:
            `<b>Initialize</b><br>
            stream=[]`,

        log:
            `Initialize stream`,

        added:[],

        heap:[],

        kth:null
    });

    let current = [];

    // ======================
    // EXAMPLE 1
    // ======================

    if(stream.length === 4){

        for(let val of stream){

            current.push(val);

            steps.push({

                panel:
                    `Add ${val}<br>
                    Stream:
                    [${current.join(', ')}]`,

                log:
                    `Added ${val}`,

                added:[...current],

                heap:[],

                kth:null
            });
        }

        let sorted =
            [...current]
            .sort((a,b)=>b-a);

        // k=2

        let ans1 =
            sorted[1];

        outputs.push(ans1);

        steps.push({

            panel:
                `Query k=2<br>
                Sorted:
                [${sorted.join(', ')}]
                <br>
                Answer:
                ${ans1}`,

            log:
                `k=2 → ${ans1}`,

            added:[...current],

            heap:[...sorted],

            kth:ans1
        });

        // k=3

        let ans2 =
            sorted[2];

        outputs.push(ans2);

        steps.push({

            panel:
                `Query k=3<br>
                Sorted:
                [${sorted.join(', ')}]
                <br>
                Answer:
                ${ans2}`,

            log:
                `k=3 → ${ans2}`,

            added:[...current],

            heap:[...sorted],

            kth:ans2
        });
    }

    // ======================
    // EXAMPLE 2
    // ======================

    else{

        for(let i = 0;
            i < stream.length;
            i++){

            current.push(stream[i]);

            let sorted =
                [...current]
                .sort((a,b)=>b-a);

            let k1 =
                sorted[0];

            let k2 =
                sorted.length >= 2
                ? sorted[1]
                : "N/A";

            outputs.push(
                `After ${stream[i]}:
                 ${k1}, ${k2}`
            );

            steps.push({

                panel:
                    `After adding ${stream[i]}<br>
                    Sorted:
                    [${sorted.join(', ')}]
                    <br>
                    k=1 → ${k1}
                    <br>
                    k=2 → ${k2}`,

                log:
                    `After ${stream[i]}
                     → ${k1}, ${k2}`,

                added:[...current],

                heap:[...sorted],

                kth:k1
            });
        }
    }

    // FINAL OUTPUT

    steps.push({

        panel:
            `<b>FINAL OUTPUT</b><br>
            ${outputs.join('<br>')}`,

        log:
            `Final output generated`,

        added:[...current],

        heap:[
            ...current.sort(
                (a,b)=>b-a
            )
        ],

        kth:null
    });
}

function renderStream(added){

    const container =
        document.getElementById(
            'stream-vis'
        );

    container.innerHTML = '';

    added.forEach(val=>{

        const tile =
            document.createElement('div');

        tile.className =
            'tile';

        tile.textContent = val;

        container.appendChild(tile);
    });
}

function renderHeap(heap){

    const container =
        document.getElementById(
            'heap-vis'
        );

    container.innerHTML = '';

    heap.forEach((v,i)=>{

        const tile =
            document.createElement('div');

        tile.className =
            'tile';

        if(i === 0){

            tile.style.borderColor =
                '#3fb950';
        }

        tile.textContent = v;

        container.appendChild(tile);
    });
}

function renderStep(idx){

    stepIdx = idx;

    const step =
        steps[idx];

    if(!step) return;

    document.getElementById(
        'action'
    ).innerHTML =
        step.panel || '—';

    renderStream(
        step.added || []
    );

    renderHeap(
        step.heap || []
    );

    document.getElementById(
        'kth-val'
    ).textContent =
        step.kth !== null
        ? step.kth
        : '—';

    const logEl =
        document.getElementById(
            'log'
        );

    logEl.innerHTML =
        steps
        .slice(0,idx+1)
        .map(
            s=>`
            <div style="
            margin:5px 0;
            ">
            ${s.log}
            </div>`
        )
        .join('');

    logEl.scrollTop =
        logEl.scrollHeight;
}

function nextStep(){

    if(
        stepIdx <
        steps.length - 1
    ){

        renderStep(stepIdx + 1);

    }else{

        pause();
    }
}

function prevStep(){

    if(stepIdx > 0){

        renderStep(stepIdx - 1);
    }
}

function resetSim(){

    pause();

    stepIdx = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(isPlaying){

        pause();

    }else{

        isPlaying = true;

        btn.textContent =
            '❚❚ Pause';

        timer =
            setInterval(()=>{

                if(
                    stepIdx <
                    steps.length - 1
                ){

                    nextStep();

                }else{

                    pause();
                }

            },delays[
                document.getElementById(
                    'speed'
                ).value
            ]);
    }
}

function pause(){

    clearInterval(timer);

    isPlaying = false;

    document.getElementById(
        'play-btn'
    ).textContent =
        '▶ Play';
}

function loadExample(n){

    const ex =
        examples[n];

    generateSteps(
        ex.stream,
        ex.queries
    );

    resetSim();
}

window.onload = ()=>{

    loadExample(0);
};

</script>

</body>
</html>
