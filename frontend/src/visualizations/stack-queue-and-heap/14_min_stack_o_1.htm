<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min Stack O(1) - Full Visualization</title>

<style>

:root{
    --bg-page:#000000;
    --bg-surface:#161b22;
    --border-main:#30363d;
    --btn-bg:#21262d;
    --btn-hover:#2d333b;
    --text-main:#c9d1d9;
    --accent-orange:#e3b341;
    --accent-blue:#58a6ff;
    --accent-green:#3fb950;
    --accent-red:#f85149;
}

*{
    box-sizing:border-box;
}

body{
    background:var(--bg-page);
    color:var(--text-main);
    font-family:system-ui,sans-serif;
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.input-bar{
    background:var(--bg-surface);
    padding:12px 20px;
    border-radius:8px;
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

button{
    padding:8px 16px;
    background:var(--btn-bg);
    border:1px solid var(--border-main);
    color:white;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:var(--btn-hover);
}

.visual-container{
    display:flex;
    gap:60px;
    margin-top:20px;
    align-items:flex-start;
}

.stack-area{
    text-align:center;
}

.stack-container{
    display:flex;
    flex-direction:column-reverse;
    gap:10px;
    width:180px;
    min-height:350px;
    padding:20px;
    background:var(--bg-surface);
    border:2px solid var(--border-main);
    border-radius:12px;
}

.stack-node{
    padding:14px;
    border-radius:10px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    transition:0.4s;
}

.main-node{
    background:#1f2937;
    border:2px solid var(--accent-blue);
}

.min-node{
    background:#10261a;
    border:2px solid var(--accent-green);
    color:var(--accent-green);
}

.highlight{
    transform:scale(1.1);
    box-shadow:0 0 20px var(--accent-orange);
}

.output-area{
    text-align:center;
}

.output-container{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:180px;
    min-height:350px;
    padding:20px;
    background:var(--bg-surface);
    border:2px solid var(--border-main);
    border-radius:12px;
}

.output-tile{
    padding:14px;
    background:#3a1a1a;
    border:2px solid var(--accent-red);
    border-radius:10px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:var(--accent-red);
}

.action-panel{
    margin:25px 0;
    background:var(--bg-surface);
    border:1px solid var(--border-main);
    border-radius:8px;
    padding:20px;
    width:1000px;
    min-height:150px;
    text-align:center;
}

.controls{
    margin-top:20px;
    display:flex;
    gap:12px;
    align-items:center;
}

.log-container{
    background:var(--bg-surface);
    border:1px solid var(--border-main);
    border-radius:8px;
    height:260px;
    overflow-y:auto;
    padding:12px;
    font-family:monospace;
    font-size:14px;
    width:1000px;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="input-bar">

    <button onclick="loadExample(0)">
        Example 1
    </button>

    <button onclick="loadExample(1)">
        Example 2
    </button>

    <button onclick="resetVisualization()">
        Reset
    </button>

</div>

<div class="visual-container">

    <!-- MAIN STACK -->

    <div class="stack-area">

        <div style="
            color:var(--accent-blue);
            font-weight:bold;
            margin-bottom:10px;
        ">
            Main Stack
        </div>

        <div id="main-stack"
             class="stack-container">
        </div>

    </div>

    <!-- MIN STACK -->

    <div class="stack-area">

        <div style="
            color:var(--accent-green);
            font-weight:bold;
            margin-bottom:10px;
        ">
            Min Stack
        </div>

        <div id="min-stack"
             class="stack-container">
        </div>

    </div>

    <!-- OUTPUT -->

    <div class="output-area">

        <div style="
            color:var(--accent-red);
            font-weight:bold;
            margin-bottom:10px;
        ">
            Output
        </div>

        <div id="output-container"
             class="output-container">
        </div>

    </div>

</div>

<!-- ACTION PANEL -->

<div class="action-panel" id="main-panel">

    Click Play to start visualization

</div>

<!-- CONTROLS -->

<div class="controls">

    <button onclick="resetVisualization()">
        ↺ Reset
    </button>

    <button onclick="backStep()">
        ← Back
    </button>

    <button onclick="togglePlay()" id="play-btn">
        ▶ Play
    </button>

    <button onclick="nextStep()">
        Next →
    </button>

    <span style="margin-left:20px">
        Speed:
    </span>

    <input type="range"
           id="speed-slider"
           min="0"
           max="2"
           value="1">

</div>

<!-- LOGS -->

<div class="log-container"
     id="log-container">
</div>

<script>

let mainStack = [];

let minStack = [];

let outputs = [];

let steps = [];

let stepIndex = 0;

let timer = null;

const delays = [1800,1000,500];

function addStep(panel,action,highlight){

    steps.push({

        panel:panel,

        action:action,

        highlight:highlight,

        main:[...mainStack],

        min:[...minStack],

        outputs:[...outputs]
    });
}

function pushStep(val){

    mainStack.push(val);

    let text =
        `Push ${val} into Main Stack`;

    if(
        minStack.length === 0 ||
        val <= minStack[minStack.length - 1]
    ){

        minStack.push(val);

        text +=
            ` → ${val} also pushed into Min Stack`;
    }

    addStep(
        `Push(${val})`,
        text,
        val
    );
}

function popStep(){

    if(mainStack.length === 0){

        addStep(
            "POP Failed",
            "Stack Empty",
            null
        );

        return;
    }

    const popped =
        mainStack.pop();

    outputs.push(popped);

    let text =
        `Pop ${popped} from Main Stack`;

    if(
        popped ===
        minStack[minStack.length - 1]
    ){

        minStack.pop();

        text +=
            ` → ${popped} removed from Min Stack`;
    }

    addStep(
        `Pop() → ${popped}`,
        text,
        popped
    );
}

function getMinStep(){

    if(minStack.length === 0){

        addStep(
            "getMin()",
            "Stack Empty",
            null
        );

        return;
    }

    const min =
        minStack[minStack.length - 1];

    outputs.push(min);

    addStep(
        `getMin() → ${min}`,
        `Current Minimum = ${min}`,
        min
    );
}

function loadExample(ex){

    pause();

    mainStack = [];

    minStack = [];

    outputs = [];

    steps = [];

    if(ex === 0){

        addStep(
            "Initialize Empty Stacks",
            "mainStack=[] , minStack=[]",
            null
        );

        pushStep(5);

        pushStep(3);

        pushStep(7);

        getMinStep();

        popStep();

        getMinStep();

    }else{

        addStep(
            "Initialize Empty Stacks",
            "mainStack=[] , minStack=[]",
            null
        );

        pushStep(10);

        pushStep(20);

        getMinStep();

        pushStep(5);

        getMinStep();

        popStep();

        getMinStep();
    }

    stepIndex = 0;

    renderStep(0);
}

function renderStack(containerId,data,type,highlight){

    const container =
        document.getElementById(containerId);

    container.innerHTML = '';

    if(data.length === 0){

        container.innerHTML =
            `<div style="
                color:#555;
                padding-top:120px;
                text-align:center;
            ">
                Empty Stack
            </div>`;

        return;
    }

    data.forEach(val=>{

        const node =
            document.createElement('div');

        node.className =
            `stack-node
             ${type}`;

        if(val === highlight){

            node.classList.add('highlight');
        }

        node.textContent = val;

        container.appendChild(node);
    });
}

function renderOutput(data){

    const container =
        document.getElementById(
            'output-container'
        );

    container.innerHTML = '';

    data.forEach(val=>{

        const tile =
            document.createElement('div');

        tile.className =
            'output-tile';

        tile.textContent = val;

        container.appendChild(tile);
    });
}

function renderStep(idx){

    const step = steps[idx];

    if(!step) return;

    renderStack(
        'main-stack',
        step.main,
        'main-node',
        step.highlight
    );

    renderStack(
        'min-stack',
        step.min,
        'min-node',
        step.highlight
    );

    renderOutput(step.outputs);

    document.getElementById(
        'main-panel'
    ).innerHTML = `

        <div style="
            font-size:26px;
            font-weight:bold;
            margin-bottom:12px;
        ">
            ${step.panel}
        </div>

        <div style="
            color:var(--accent-orange);
            font-size:20px;
            font-weight:bold;
        ">
            ${step.action}
        </div>

        <div style="
            margin-top:18px;
            color:#8b949e;
            font-size:17px;
        ">
            Main Stack Size:
            ${step.main.length}

            &nbsp;&nbsp;&nbsp;&nbsp;

            Min Stack Size:
            ${step.min.length}
        </div>
    `;

    const logDiv =
        document.getElementById(
            'log-container'
        );

    logDiv.innerHTML = '';

    for(let i=0;i<=idx;i++){

        const line =
            document.createElement('div');

        line.style.margin = '6px 0';

        line.innerHTML = `
            <span style="color:#58a6ff">
                Step ${i}
            </span>

            : ${steps[i].action}
        `;

        logDiv.appendChild(line);
    }

    logDiv.scrollTop =
        logDiv.scrollHeight;
}

function nextStep(){

    if(stepIndex < steps.length - 1){

        stepIndex++;

        renderStep(stepIndex);

    }else{

        pause();
    }
}

function backStep(){

    if(stepIndex > 0){

        stepIndex--;

        renderStep(stepIndex);
    }
}

function resetVisualization(){

    pause();

    stepIndex = 0;

    renderStep(0);
}

function togglePlay(){

    const btn =
        document.getElementById(
            'play-btn'
        );

    if(timer){

        pause();

    }else{

        btn.textContent = 'Pause';

        if(stepIndex >= steps.length - 1){

            stepIndex = 0;
        }

        timer = setInterval(

            nextStep,

            delays[
                document.getElementById(
                    'speed-slider'
                ).value
            ]
        );
    }
}

function pause(){

    clearInterval(timer);

    timer = null;

    document.getElementById(
        'play-btn'
    ).textContent = 'Play';
}

window.onload = () => {

    loadExample(0);
};

</script>

</body>
</html>
