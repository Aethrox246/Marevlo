<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extended Euclid Inverse - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 100px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 900px; min-height: 110px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 62px; height: 62px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 20px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.current { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.coefficient { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.12); z-index: 2; }
        .tile.success { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 12px var(--accent-green); z-index: 3; }
        .tile.past { opacity: 0.35; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 22px; width: 740px; text-align: center; font-family: monospace; min-height: 85px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        /* RESULT */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 28px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* STATUS */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px;}

        /* CONTROLS */
        .controls { margin-top: 26px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 14px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 740px; max-width: 92%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">a =</label>
        <input type="number" id="a-input" value="3">
        <label class="ui-label">m =</label>
        <input type="number" id="m-input" value="7">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(3,7)">Ex 1 (3⁻¹ mod 7)</button>
        <button onclick="loadExample(4,5)">Ex 2 (4⁻¹ mod 5)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Extended Euclidean Algorithm → Find x such that a·x + m·y = 1</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current a</span>
            <span class="info-value" id="val-a" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current b</span>
            <span class="info-value" id="val-b" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">x (coeff for a)</span>
            <span class="info-value" id="val-x" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">y (coeff for m)</span>
            <span class="info-value" id="val-y" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">gcd</span>
            <span class="info-value" id="val-gcd" style="color: var(--text-main);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Modular Inverse (x mod m) =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Current a</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-purple)"></span> Current b</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-blue)"></span> Coefficient x</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Inverse Found</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let aInput = 3, mInput = 7;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            loadExample(3, 7);
        }

        function loadExample(newA, newM) {
            aInput = parseInt(newA);
            mInput = parseInt(newM);
            document.getElementById('a-input').value = aInput;
            document.getElementById('m-input').value = mInput;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valA = parseInt(document.getElementById('a-input').value);
            const valM = parseInt(document.getElementById('m-input').value);
            if (!isNaN(valA) && !isNaN(valM) && valM > 1) {
                loadExample(valA, valM);
            } else {
                alert("Please enter valid integers (m > 1).");
            }
        }

        function generateSteps() {
            steps = [];
            let a = aInput;
            let b = mInput;
            let x0 = 1, y0 = 0;   // coefficients for original a
            let x1 = 0, y1 = 1;   // coefficients for original m

            // STEP 0: INIT
            steps.push({
                type: 'init',
                a: a,
                b: b,
                x: x0,
                y: y0,
                gcd: '—',
                panel: `Computing modular inverse of <b>${a}</b> modulo <b>${mInput}</b> using Extended Euclidean Algorithm.<br>Solving: <b>${a}</b>·x + <b>${mInput}</b>·y = 1`,
                statusText: `Starting EEA for inverse of ${a} mod ${mInput}`,
                log: `Extended Euclidean Algorithm\nInput: a=${a}, m=${mInput}\nGoal: find x such that (${a} * x) % ${mInput} == 1`,
                logColor: 'var(--text-dim)'
            });

            const stepsLog = [];
            while (b !== 0) {
                let q = Math.floor(a / b);
                let r = a % b;

                // Record current step
                steps.push({
                    type: 'step',
                    a: a,
                    b: b,
                    x: x0,
                    y: y0,
                    q: q,
                    r: r,
                    panel: `Division step: ${a} = ${q} × ${b} + ${r}<br>Update coefficients`,
                    statusText: `Quotient = ${q}, Remainder = ${r}`,
                    log: `a=${a}, b=${b}, q=${q}, r=${r}\nCoefficients: x=${x0}, y=${y0}`,
                    logColor: 'var(--accent-orange)'
                });

                // Update coefficients
                let x2 = x1;
                let y2 = y1;
                x1 = x0 - q * x1;
                y1 = y0 - q * y1;
                x0 = x2;
                y0 = y2;

                // Update a, b
                a = b;
                b = r;

                steps.push({
                    type: 'update',
                    a: a,
                    b: b,
                    x: x0,
                    y: y0,
                    panel: `Updated: a = ${a}, b = ${b}<br>New coefficients: x = ${x0}, y = ${y0}`,
                    statusText: `Coefficients updated`,
                    log: `Updated coefficients → x=${x0}, y=${y0}`,
                    logColor: 'var(--accent-purple)'
                });
            }

            // Final gcd
            const gcd = a;
            let inverse = (x0 % mInput + mInput) % mInput;

            steps.push({
                type: 'final',
                a: a,
                b: 0,
                x: x0,
                y: y0,
                gcd: gcd,
                inverse: inverse,
                panel: `EEA complete.<br>gcd(${aInput}, ${mInput}) = <b>${gcd}</b><br>Coefficient x = ${x0}<br>Modular inverse = <b>${inverse}</b> (x mod ${mInput})`,
                complete: true,
                statusText: `Done. Inverse = ${inverse}`,
                log: `\nFinal: gcd = ${gcd}\nx = ${x0}\nModular Inverse = ${inverse}\nVerification: (${aInput} * ${inverse}) % ${mInput} = 1`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show current a and b as main tiles
            const tileA = document.createElement('div');
            tileA.className = `tile ${step.type === 'step' || step.type === 'init' ? 'current' : ''}`;
            tileA.innerText = step.a;
            const labelA = document.createElement('div');
            labelA.className = 'tile-index';
            labelA.innerText = 'a';
            const unitA = document.createElement('div');
            unitA.className = 'tile-unit';
            unitA.append(tileA, labelA);
            container.appendChild(unitA);

            const tileB = document.createElement('div');
            tileB.className = `tile ${step.type === 'step' || step.type === 'init' ? 'current' : ''}`;
            tileB.innerText = step.b !== undefined ? step.b : '—';
            const labelB = document.createElement('div');
            labelB.className = 'tile-index';
            labelB.innerText = 'b';
            const unitB = document.createElement('div');
            unitB.className = 'tile-unit';
            unitB.append(tileB, labelB);
            container.appendChild(unitB);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-a').innerText = step.a;
            document.getElementById('val-b').innerText = step.b !== undefined ? step.b : '—';
            document.getElementById('val-x').innerText = step.x !== undefined ? step.x : '—';
            document.getElementById('val-y').innerText = step.y !== undefined ? step.y : '—';
            document.getElementById('val-gcd').innerText = step.gcd !== undefined ? step.gcd : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.inverse : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
