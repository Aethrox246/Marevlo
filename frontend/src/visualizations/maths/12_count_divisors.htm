<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Divisors - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 140px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 820px; }
        .tiles-wrapper { 
            display: flex; gap: 20px; justify-content: center; align-items: center; 
            flex-wrap: wrap; min-height: 160px;
        }

        .number-box {
            background: #21262d;
            border: 3px solid var(--accent-orange);
            border-radius: 12px;
            padding: 20px 40px;
            font-size: 42px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 160px;
            text-align: center;
        }

        .count-box {
            background: #21262d;
            border: 3px solid var(--accent-green);
            border-radius: 12px;
            padding: 20px 40px;
            font-size: 42px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 160px;
            text-align: center;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 18px 24px; width: 720px; min-height: 92px;
            font-family: monospace; font-size: 15px; line-height: 1.6; text-align: center;
        }

        .info-panel { margin-top: 15px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 20px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 20px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 20px; font-size: 28px; font-family: monospace; }
        #res-val { color: var(--accent-green); font-weight: bold; transition: all 0.4s; }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.5em; text-align: center; width: 720px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; cursor: pointer; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }

        .pop { animation: popAnim 600ms ease; }
        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" value="6">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(6)">Ex 1 (6)</button>
        <button onclick="loadExample(13)">Ex 2 (13)</button>
    </div>

    <div class="visual-container">
        <div class="tiles-wrapper" id="visual"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Count</span>
            <span class="info-value" id="val-count" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display">
        Total Divisors = <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputNumber = 6;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(6); }

        function loadExample(n) {
            inputNumber = Math.max(1, parseInt(n));
            document.getElementById('num-input').value = inputNumber;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val) && val >= 1) loadExample(val);
            else alert("Please enter a positive integer >= 1.");
        }

        function generateSteps() {
            steps = [];
            let n = inputNumber;
            let count = 0;

            steps.push({
                type: 'init',
                i: '—',
                currentCount: 0,
                panel: `Counting divisors of <b>${n}</b>`,
                statusText: `n = ${n}`,
                log: `Start: count divisors of ${n}`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 1; i <= n; i++) {
                const isDivisor = (n % i === 0);
                const prevCount = count;

                if (isDivisor) count++;

                steps.push({
                    type: 'check',
                    i: i,
                    currentCount: count,
                    panel: `i = ${i}: ${n} % ${i} = ${n % i} ${isDivisor ? '→ divisor found' : ''}`,
                    statusText: `Checked ${i}, count = ${count}`,
                    log: `${i}: ${isDivisor ? '✓' : '✗'} count = ${count}`,
                    logColor: isDivisor ? 'var(--accent-green)' : 'var(--text-dim)'
                });
            }

            steps.push({
                type: 'final',
                i: '—',
                currentCount: count,
                panel: `All checked.<br><span style="color:var(--accent-green)"><b>Total divisors = ${count}</b></span>`,
                statusText: `Done`,
                log: `Final: ${count}`,
                logColor: 'var(--accent-green)',
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('visual');
            container.innerHTML = `
                <div class="number-box">${inputNumber}</div>
                <div class="count-box">${step.currentCount}</div>
            `;

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i;
            document.getElementById('val-count').innerText = step.currentCount;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.currentCount;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
