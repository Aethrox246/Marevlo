<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFT with Mod Splitting - Large Integer Multiplication</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 180px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 900px; min-height: 110px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 18px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); box-shadow: 0 0 12px rgba(227, 179, 65, 0.5); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.1); box-shadow: 0 0 12px var(--accent-green); }
        .tile.current { background: #1e2a1e; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.08); }
        .tile.done { opacity: 0.55; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* PANEL */
        .action-panel {
            margin-top: 25px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 22px; width: 740px; text-align: center; font-family: monospace; min-height: 85px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 9px 16px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        /* RESULT */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 30px !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px; }

        /* CONTROLS */
        .controls { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 740px; max-width: 95%; height: 150px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">num1 =</label>
        <input type="text" id="num1-input" placeholder="123" value="123">
        <label class="ui-label">num2 =</label>
        <input type="text" id="num2-input" placeholder="456" value="456">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1: 123 × 456</button>
        <button onclick="loadExample(1)">Ex 2: 999 × 999</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Naive Schoolbook Multiplication</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i (digit in num1)</span>
            <span class="info-value" id="val-i" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current j (digit in num2)</span>
            <span class="info-value" id="val-j" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Result</span>
            <span class="info-value" id="val-result" style="color: var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Product =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex;align-items:center;gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Processing digit pair</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple);border:1px solid var(--accent-purple)"></span> Current partial product</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green);border:1px solid var(--accent-green)"></span> Final product</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface);border:1px solid var(--border-main);opacity:0.5"></span> Done</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let num1 = "123";
        let num2 = "456";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        const examples = [
            { num1: "123", num2: "456", result: "56088" },
            { num1: "999", num2: "999", result: "998001" }
        ];

        function addStrings(a, b) {
            let i = a.length - 1, j = b.length - 1;
            let carry = 0;
            let result = [];
            while (i >= 0 || j >= 0 || carry) {
                let sum = carry;
                if (i >= 0) sum += parseInt(a[i--]);
                if (j >= 0) sum += parseInt(b[j--]);
                result.push((sum % 10).toString());
                carry = Math.floor(sum / 10);
            }
            return result.reverse().join('');
        }

        function multiplyDigit(digit, num) {
            if (digit === 0) return "0";
            let carry = 0;
            let result = [];
            for (let i = num.length - 1; i >= 0; i--) {
                let total = parseInt(num[i]) * digit + carry;
                result.push((total % 10).toString());
                carry = Math.floor(total / 10);
            }
            while (carry > 0) {
                result.push((carry % 10).toString());
                carry = Math.floor(carry / 10);
            }
            return result.reverse().join('');
        }

        function generateSteps() {
            steps = [];

            steps.push({
                type: 'init',
                num1: num1,
                num2: num2,
                panel: `Large Integer Multiplication (Schoolbook)<br>num1 = <b>${num1}</b>, num2 = <b>${num2}</b>`,
                statusText: `Multiplying ${num1} × ${num2} using schoolbook method...`,
                log: `num1 = ${num1}\nnum2 = ${num2}\nStarting schoolbook multiplication...`,
                logColor: 'var(--text-dim)'
            });

            let result = new Array(num1.length + num2.length).fill(0);
            let currentResult = "";

            for (let i = num1.length - 1; i >= 0; i--) {
                let digit1 = parseInt(num1[i]);
                let partial = multiplyDigit(digit1, num2);
                let shiftedPartial = partial + "0".repeat(num1.length - 1 - i);

                steps.push({
                    type: 'partial',
                    i: num1.length - 1 - i,
                    digit1: digit1,
                    partial: partial,
                    shifted: shiftedPartial,
                    panel: `Multiplying digit ${digit1} (position ${num1.length-1-i}) with ${num2}<br>Partial product = <b>${partial}</b>`,
                    statusText: `Digit ${digit1} × ${num2}`,
                    log: `Digit ${digit1} × ${num2} = ${partial}`,
                    logColor: 'var(--accent-orange)'
                });

                currentResult = addStrings(currentResult, shiftedPartial);

                steps.push({
                    type: 'add',
                    currentResult: currentResult,
                    panel: `Adding partial to running total<br>Current result = <b>${currentResult}</b>`,
                    statusText: `Adding partial → ${currentResult}`,
                    log: `Add ${shiftedPartial} → ${currentResult}`,
                    logColor: 'var(--accent-blue)'
                });
            }

            steps.push({
                type: 'final',
                result: currentResult,
                panel: `Multiplication complete.<br>${num1} × ${num2} = <b>${currentResult}</b>`,
                statusText: `Final result: ${currentResult}`,
                log: `\nFinal product = ${currentResult}`,
                logColor: 'var(--accent-green)',
                bold: true,
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show current partial product as tile
            if (step.partial) {
                const pTile = document.createElement('div');
                pTile.className = 'tile-unit';
                const bigTile = document.createElement('div');
                bigTile.className = `tile ${step.type === 'final' ? 'winning' : 'candidate'}`;
                bigTile.innerText = step.partial;
                const pLabel = document.createElement('div');
                pLabel.className = 'tile-index';
                pLabel.innerText = 'Partial';
                pTile.append(bigTile, pLabel);
                container.appendChild(pTile);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-j').innerText = step.digit1 !== undefined ? step.digit1 : '—';
            document.getElementById('val-result').innerText = step.currentResult || (step.result || '—');

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.result;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadExample(idx) {
            num1 = examples[idx].num1;
            num2 = examples[idx].num2;
            document.getElementById('num1-input').value = num1;
            document.getElementById('num2-input').value = num2;
            generateSteps();
            reset();
        }

        function loadCustom() {
            num1 = document.getElementById('num1-input').value.trim();
            num2 = document.getElementById('num2-input').value.trim();
            if (num1 && num2) {
                generateSteps();
                reset();
            } else {
                alert("Please enter both numbers.");
            }
        }

        window.onload = () => {
            loadExample(0);
        };
    </script>
</body>
</html>
