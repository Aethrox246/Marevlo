<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCM Sum - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 220px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 100px; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; font-size: 26px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.4s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.active { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.18); box-shadow: 0 0 18px rgba(227, 179, 65, 0.6); }
        .tile.pair { border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.12); }

        /* PAIR INDICATOR */
        .pair-info {
            margin: 12px 0;
            font-family: 'Courier New', monospace;
            font-size: 17px;
            color: var(--accent-orange);
        }

        /* PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 22px; width: 720px; text-align: center; font-family: monospace;
            min-height: 92px; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 15px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 115px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 19px; font-weight: 700; }

        /* RESULT */
        .result-display { margin-top: 18px; text-align: center; }
        #res-val { font-size: 32px; font-weight: bold; font-family: monospace; transition: all 0.4s; }
        .pop { animation: popAnim 600ms ease; color: var(--accent-green) !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(0.7)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        /* STATUS & CONTROLS */
        .status-bar { margin-top: 10px; font-size: 13.5px; color: var(--text-dim); height: 1.5em; text-align: center; width: 700px; }
        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 150px; }

        .legend { margin-top: 18px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; max-width: 95%; height: 145px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="num-input" placeholder="[2, 3]" value="[2, 3]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[2,3]')">Ex 1</button>
        <button onclick="loadExample('[1,2,3]')">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Array Elements</div>
        <div class="tiles-wrapper" id="tiles-container"></div>

        <div class="pair-info" id="pair-info">—</div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">j</span>
            <span class="info-value" id="val-j" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">gcd(a[i],a[j])</span>
            <span class="info-value" id="val-gcd" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">lcm</span>
            <span class="info-value" id="val-lcm" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Sum</span>
            <span class="info-value" id="val-sum" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Sum of LCM(i,j) for all i ≤ j</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:6px; font-size:12px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-orange);border-radius:4px;margin-right:8px;"></span>Current i</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-blue);border-radius:4px;margin-right:8px;"></span>Current j</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-green);border-radius:4px;margin-right:8px;"></span>LCM added</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [2, 3];
        let n = 0;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() {
            loadExample('[2,3]');
        }

        function loadExample(str) {
            try {
                arr = JSON.parse(str);
            } catch(e) {
                arr = [2, 3];
            }
            document.getElementById('num-input').value = JSON.stringify(arr);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('num-input').value.trim();
            if (val) loadExample(val);
        }

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b !== 0) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function generateSteps() {
            steps = [];
            n = arr.length;
            let runningSum = 0;

            // INIT
            steps.push({
                type: 'init',
                i: -1, j: -1,
                a: 0, b: 0,
                g: 0, l: 0,
                sum: 0,
                panel: `Compute sum of <b>LCM(arr[i], arr[j])</b> for all <b>i ≤ j</b>.<br>Array: <b>[${arr.join(', ')}]</b><br>Total pairs = ${n * (n + 1) / 2}`,
                statusText: `Starting LCM Sum calculation...`,
                log: `Array = [${arr.join(', ')}]\nPairs to process: ${n*(n+1)/2}\nSum = 0`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n; i++) {
                for (let j = i; j < n; j++) {
                    const a = arr[i];
                    const b = arr[j];

                    // Select pair
                    steps.push({
                        type: 'pair',
                        i: i, j: j,
                        a: a, b: b,
                        g: 0, l: 0,
                        sum: runningSum,
                        panel: `Processing pair (<b>${i}</b>, <b>${j}</b>) → <b>${a}</b> and <b>${b}</b>`,
                        statusText: `i=${i}, j=${j}`,
                        log: `\nPair (${i},${j}) : ${a}, ${b}`,
                        logColor: 'var(--text-main)'
                    });

                    // Compute GCD
                    let g = gcd(a, b);
                    steps.push({
                        type: 'gcd',
                        i: i, j: j,
                        a: a, b: b,
                        g: g, l: 0,
                        sum: runningSum,
                        panel: `gcd(${a}, ${b}) = <b>${g}</b>`,
                        statusText: `GCD = ${g}`,
                        log: `  gcd(${a}, ${b}) = ${g}`,
                        logColor: 'var(--accent-purple)'
                    });

                    // Compute LCM
                    let l = (a / g) * b;   // safe integer division first
                    steps.push({
                        type: 'lcm',
                        i: i, j: j,
                        a: a, b: b,
                        g: g, l: l,
                        sum: runningSum,
                        panel: `LCM(${a}, ${b}) = <b>${a} * ${b} / ${g} = ${l}</b>`,
                        statusText: `LCM = ${l}`,
                        log: `  LCM = ${a} * ${b} / ${g} = ${l}`,
                        logColor: 'var(--accent-orange)'
                    });

                    // Add to sum
                    runningSum += l;
                    steps.push({
                        type: 'add',
                        i: i, j: j,
                        a: a, b: b,
                        g: g, l: l,
                        sum: runningSum,
                        panel: `<span style="color:var(--accent-green)">Sum += ${l} → New Sum = ${runningSum}</span>`,
                        statusText: `Running sum updated`,
                        log: `  Sum += ${l} → ${runningSum}`,
                        logColor: 'var(--accent-green)'
                    });
                }
            }

            // FINAL
            steps.push({
                type: 'final',
                i: -1, j: -1,
                a: 0, b: 0,
                g: 0, l: 0,
                sum: runningSum,
                panel: `Calculation complete!<br><b>Final Sum of LCMs = ${runningSum}</b>`,
                statusText: `Done! Final Answer = ${runningSum}`,
                log: `\nFinal Result: ${runningSum}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            for (let k = 0; k < n; k++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = arr[k];

                if (step.i === k) tile.classList.add('active');
                if (step.j === k) tile.classList.add('pair');
                if (step.type === 'final') tile.classList.add('winning');

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${k}]`;

                wrapper.appendChild(tile);
                wrapper.appendChild(idxLabel);
                container.appendChild(wrapper);
            }

            // Pair info
            const pairInfo = document.getElementById('pair-info');
            if (step.i >= 0 && step.j >= 0) {
                pairInfo.innerHTML = `Pair (<b>${step.i}</b>, <b>${step.j}</b>) &nbsp;&nbsp; ${step.a} &nbsp;↔&nbsp; ${step.b}`;
            } else {
                pairInfo.innerHTML = '—';
            }

            // Main panel
            document.getElementById('main-panel').innerHTML = step.panel;

            // Info cells
            document.getElementById('val-i').innerText = step.i >= 0 ? step.i : '—';
            document.getElementById('val-j').innerText = step.j >= 0 ? step.j : '—';
            document.getElementById('val-gcd').innerText = step.g || '—';
            document.getElementById('val-lcm').innerText = step.l || '—';
            document.getElementById('val-sum').innerText = step.sum;

            // Result
            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.sum;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
