<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRT with Large Constraints - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 280px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 900px; min-height: 80px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 18px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main); text-align: center; line-height: 1.2;
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.1); box-shadow: 0 0 12px var(--accent-green); }
        .tile.failed { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-red); }
        .tile.done { opacity: 0.5; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }
        .tile.idle { opacity: 0.9; }

        /* PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        /* RESULT */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 28px !important; text-shadow: 0 0 12px var(--accent-green); }
        .pop-false { animation: popAnim 400ms ease; color: var(--accent-red) !important; font-size: 28px !important; text-shadow: 0 0 12px var(--accent-red); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 700px;}

        /* CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Congruences =</label>
        <input type="text" id="num-input" placeholder="[(2, 3), (3, 5), (2, 7)]" value="[(2, 3), (3, 5), (2, 7)]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1: [(2,3),(3,5),(2,7)]</button>
        <button onclick="loadExample(1)">Ex 2: [(1,2),(2,3),(3,5)]</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Current Candidate x and Congruences</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current x</span>
            <span class="info-value" id="val-x" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Product M</span>
            <span class="info-value" id="val-m" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Checked</span>
            <span class="info-value" id="val-checked" style="color: var(--accent-blue);">0 / 0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Status</span>
            <span class="info-value" id="val-status" style="color: var(--text-main);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Solution x =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600; border:1px solid var(--accent-orange)"></span> Checking x</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Match</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red); border:1px solid var(--accent-red)"></span> Mismatch</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--border-main); opacity:0.5"></span> Processed</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let congruences = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        const examples = [
            [[2,3], [3,5], [2,7]],   // Example 1 → 23
            [[1,2], [2,3], [3,5]]    // Example 2 → 23
        ];

        function init() {
            loadExample(0);
        }

        function loadExample(idx) {
            congruences = examples[idx];
            document.getElementById('num-input').value = JSON.stringify(congruences);
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const val = document.getElementById('num-input').value.trim();
                congruences = JSON.parse(val);
                if (!Array.isArray(congruences) || congruences.length === 0) throw "";
                generateSteps();
                reset();
            } catch(e) {
                alert("Invalid format. Use [[a1,m1],[a2,m2],...] ");
            }
        }

        function generateSteps() {
            steps = [];
            let M = 1;
            for (let [, m] of congruences) M *= m;

            steps.push({
                type: 'init',
                x: 0,
                M: M,
                checked: 0,
                panel: `Chinese Remainder Theorem (Brute Force)<br>Congruences: ${congruences.map(([a,m]) => `x ≡ ${a} (mod ${m})`).join(', ')}<br>M = ${M}`,
                statusText: `M = ${M}. Starting search from x = 0...`,
                log: `Input: ${JSON.stringify(congruences)}\nM = ${M}`,
                logColor: 'var(--text-dim)'
            });

            let solution = null;
            for (let x = 0; x < M; x++) {
                let allMatch = true;

                steps.push({
                    type: 'candidate',
                    x: x,
                    M: M,
                    checked: x + 1,
                    panel: `Testing candidate <b>x = ${x}</b>`,
                    statusText: `Checking x = ${x}`,
                    log: `\nCandidate x = ${x}`,
                    logColor: 'var(--accent-orange)'
                });

                for (let i = 0; i < congruences.length; i++) {
                    let [a, m] = congruences[i];
                    let rem = x % m;
                    let matches = (rem === a);

                    steps.push({
                        type: matches ? 'match' : 'fail',
                        x: x,
                        M: M,
                        checked: x + 1,
                        panel: `Congruence ${i+1}: x ≡ ${a} (mod ${m})<br>${x} % ${m} = ${rem} ${matches ? '✓' : '✗'}`,
                        statusText: `Checking congruence ${i+1}`,
                        log: `  ${x} % ${m} = ${rem} ${matches ? '✓' : '✗'}`,
                        logColor: matches ? 'var(--accent-green)' : 'var(--accent-red)'
                    });

                    if (!matches) {
                        allMatch = false;
                        break;
                    }
                }

                if (allMatch) {
                    solution = x;
                    steps.push({
                        type: 'final',
                        x: x,
                        M: M,
                        checked: x + 1,
                        panel: `Solution Found!<br><b>x = ${x}</b> satisfies all congruences.`,
                        statusText: `Solution is ${x}`,
                        log: `\nSolution found: x = ${x}`,
                        logColor: 'var(--accent-green)',
                        bold: true,
                        complete: true
                    });
                    break;
                }
            }

            if (!solution) {
                steps.push({
                    type: 'final',
                    x: -1,
                    M: M,
                    checked: M,
                    panel: `No solution found.`,
                    statusText: `No solution exists.`,
                    log: `\nNo solution found.`,
                    logColor: 'var(--accent-red)',
                    bold: true,
                    complete: true
                });
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Current x tile
            const unit = document.createElement('div');
            unit.className = 'tile-unit';
            const tile = document.createElement('div');
            tile.className = `tile ${step.complete && step.x >= 0 ? 'winning' : 'candidate'}`;
            tile.innerHTML = `x<br><span style="font-size:14px">${step.x >= 0 ? step.x : '?'}</span>`;
            const label = document.createElement('div');
            label.className = 'tile-index';
            label.innerText = 'CURRENT';
            unit.append(tile, label);
            container.appendChild(unit);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-x').innerText = step.x >= 0 ? step.x : '—';
            document.getElementById('val-m').innerText = step.M || '—';
            document.getElementById('val-checked').innerText = `${step.checked || 0} / ${step.M || 0}`;
            document.getElementById('val-status').innerText = step.statusText || '—';

            const resVal = document.getElementById('res-val');
            if (step.complete && step.x >= 0) {
                resVal.innerText = step.x;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
