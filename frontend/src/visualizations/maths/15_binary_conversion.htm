<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Conversion - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 160px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 100px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); }
        .tile.remainder { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.1); }
        .tile.added { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-green); }
        .tile.done { opacity: 0.6; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        .action-panel {
            margin-top: 30px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 700px; text-align: center; font-family: monospace;
            min-height: 80px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 15px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .result-display { margin-top: 15px; text-align: center; }
        #res-val { font-size: 28px; font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { color: var(--accent-green) !important; text-shadow: 0 0 15px var(--accent-green); animation: popAnim 500ms; }

        @keyframes popAnim { 0%{transform:scale(0.8)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; width: 600px; text-align: center; }

        .controls { margin-top: 25px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        .legend { margin-top: 15px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; }

        .log-panel {
            margin-top: 15px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 95%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" placeholder="13" value="13">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(13)">Ex 1 (13)</button>
        <button onclick="loadExample(42)">Ex 2 (42)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Remainders (LSB first) → Final Binary (MSB first)</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current n</span>
            <span class="info-value" id="val-n" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Remainder</span>
            <span class="info-value" id="val-rem" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">n // 2</span>
            <span class="info-value" id="val-next" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Binary</span>
            <span class="info-value" id="val-binary" style="color:var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Binary Representation =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Current Step</div>
        <div class="legend-item"><span class="dot" style="background:#1e1030;border:1px solid var(--accent-purple)"></span> Remainder</div>
        <div class="legend-item"><span class="dot" style="background:#0d2244;border:1px solid var(--accent-blue)"></span> Next n</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:1px solid var(--accent-green)"></span> Final Binary</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputNumber = 13;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(13); }

        function loadExample(newNum) {
            inputNumber = parseInt(newNum);
            document.getElementById('num-input').value = inputNumber;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val) && val >= 0) {
                loadExample(val);
            } else {
                alert("Please enter a valid non-negative integer.");
            }
        }

        function generateSteps() {
            steps = [];
            let n = inputNumber;
            let remainders = [];

            // Step 0: Init
            steps.push({
                type: 'init',
                currentN: n,
                remainder: '—',
                nextN: '—',
                binary: '—',
                remaindersList: [],
                panel: `Convert <b>${inputNumber}</b> (decimal) to binary.<br>Using repeated division by 2 and collecting remainders.`,
                status: `Starting conversion for n = ${inputNumber}`,
                log: `Input: n = ${inputNumber}\nInitialize remainders = []`
            });

            if (n === 0) {
                steps.push({
                    type: 'final',
                    currentN: 0,
                    remainder: 0,
                    nextN: 0,
                    binary: '0',
                    remaindersList: [0],
                    panel: `Special case: n = 0 → Binary is <b>0</b>`,
                    status: `Done. Binary = 0`,
                    log: `n = 0 → Return "0"`,
                    isTrue: true
                });
                return;
            }

            while (n > 0) {
                const rem = n % 2;
                remainders.push(rem);

                steps.push({
                    type: 'divide',
                    currentN: n,
                    remainder: rem,
                    nextN: Math.floor(n / 2),
                    binary: '—',
                    remaindersList: [...remainders],
                    panel: `n = <b>${n}</b><br>Remainder = <b>${n} % 2 = ${rem}</b><br>Next n = <b>${n} // 2 = ${Math.floor(n/2)}</b>`,
                    status: `Dividing ${n} by 2 → remainder ${rem}`,
                    log: `n = ${n} → remainder = ${rem}, n = ${Math.floor(n/2)}`
                });

                n = Math.floor(n / 2);
            }

            // Reverse remainders to get correct binary
            const finalBinary = remainders.slice().reverse().join('');

            steps.push({
                type: 'reverse',
                currentN: 0,
                remainder: '—',
                nextN: '—',
                binary: finalBinary,
                remaindersList: remainders,
                panel: `Loop ended.<br>Reverse remainders: <b>${remainders.join('')}</b> → <b>${finalBinary}</b>`,
                status: `Reversing to get correct binary order`,
                log: `Reverse remainders → ${finalBinary}`
            });

            steps.push({
                type: 'final',
                currentN: 0,
                remainder: '—',
                nextN: '—',
                binary: finalBinary,
                remaindersList: remainders,
                panel: `Conversion complete!<br><b>${inputNumber}<sub>10</sub> = ${finalBinary}<sub>2</sub></b>`,
                status: `Final Binary: ${finalBinary}`,
                log: `Final Result: ${finalBinary}`,
                isTrue: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Render remainders collected so far
            step.remaindersList.forEach((bit, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile ${step.type === 'final' || step.type === 'reverse' ? 'winning' : (i === step.remaindersList.length-1 ? 'remainder' : 'done')}`;
                tile.innerText = bit;

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `r${i}`;

                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-n').innerText = step.currentN;
            document.getElementById('val-rem').innerText = step.remainder;
            document.getElementById('val-next').innerText = step.nextN;
            document.getElementById('val-binary').innerText = step.binary;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.binary !== '—' ? step.binary : '—';
            if (step.type === 'final') resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.status;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    line.innerText = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
