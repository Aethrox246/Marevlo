<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number of Divisors of n! - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 120px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 820px; min-height: 90px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 62px; height: 62px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 19px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main); text-align: center;
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.1); box-shadow: 0 0 12px var(--accent-green); }
        .tile.current { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.08); }
        .tile.done { opacity: 0.55; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* PANEL */
        .action-panel {
            margin-top: 25px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 22px; width: 740px; text-align: center; font-family: monospace; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 9px 16px; display: flex; flex-direction: column; align-items: center; min-width: 115px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        /* RESULT */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 26px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 32px !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px; }

        /* CONTROLS */
        .controls { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 740px; max-width: 95%; height: 155px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" placeholder="5" value="5">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(5)">Ex 1 (n=5)</button>
        <button onclick="loadExample(3)">Ex 2 (n=3)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Computing n! and counting divisors</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current n!</span>
            <span class="info-value" id="val-fact" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">i (divisor check)</span>
            <span class="info-value" id="val-i" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Count</span>
            <span class="info-value" id="val-count" style="color: var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Number of divisors of n! =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex;align-items:center;gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Checking divisor</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple);border:1px solid var(--accent-purple)"></span> n! value</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green);border:1px solid var(--accent-green)"></span> Final count</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface);border:1px solid var(--border-main);opacity:0.5"></span> Processed</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputN = 5;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function loadExample(newN) {
            inputN = parseInt(newN);
            document.getElementById('num-input').value = inputN;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val) && val >= 0) {
                inputN = val;
                generateSteps();
                reset();
            } else {
                alert("Please enter a valid non-negative integer.");
            }
        }

        function factorial(n) {
            let fact = 1;
            for (let i = 2; i <= n; i++) {
                fact *= i;
            }
            return fact;
        }

        function countDivisors(m) {
            if (m === 0) return 0;
            let count = 0;
            const sqrtM = Math.floor(Math.sqrt(m));
            for (let i = 1; i <= sqrtM; i++) {
                if (m % i === 0) {
                    count++;
                    if (i !== m / i) count++;
                }
            }
            return count;
        }

        function generateSteps() {
            steps = [];
            const fact = factorial(inputN);

            // STEP 0: Init
            steps.push({
                type: 'init',
                n: inputN,
                fact: fact,
                panel: `Compute number of divisors of <b>${inputN}!</b><br>First compute factorial: ${inputN}! = <b>${fact}</b>`,
                statusText: `n = ${inputN}. Computing ${inputN}! ...`,
                log: `n = ${inputN}\nComputing factorial: ${inputN}! = ${fact}`,
                logColor: 'var(--text-dim)'
            });

            // STEP 1: Computing factorial (show step by step)
            let currentFact = 1;
            for (let i = 1; i <= inputN; i++) {
                const prev = currentFact;
                currentFact *= i;
                steps.push({
                    type: 'fact-step',
                    i: i,
                    currentFact: currentFact,
                    panel: `Multiplying: ${prev} × ${i} = <b>${currentFact}</b>`,
                    statusText: `Building factorial... ×${i}`,
                    log: `  × ${i} → ${currentFact}`,
                    logColor: 'var(--accent-purple)'
                });
            }

            // STEP 2: Counting divisors
            const sqrtFact = Math.floor(Math.sqrt(fact));
            let divisorCount = 0;
            let pairs = [];

            for (let i = 1; i <= sqrtFact; i++) {
                if (fact % i === 0) {
                    const comp = fact / i;
                    divisorCount += (i === comp ? 1 : 2);
                    pairs.push([i, comp]);

                    steps.push({
                        type: 'divisor-step',
                        i: i,
                        comp: comp,
                        currentCount: divisorCount,
                        panel: `i = <b>${i}</b>: ${fact} % ${i} == 0<br>Complementary = ${comp}<br>Added ${i === comp ? 1 : 2} divisor(s)`,
                        statusText: `Checking i=${i} → +${i === comp ? 1 : 2}`,
                        log: `  i=${i}: divisible → pair (${i}, ${comp}) → count = ${divisorCount}`,
                        logColor: 'var(--accent-green)'
                    });
                } else {
                    steps.push({
                        type: 'divisor-step',
                        i: i,
                        comp: null,
                        currentCount: divisorCount,
                        panel: `i = <b>${i}</b>: ${fact} % ${i} != 0 → skip`,
                        statusText: `i=${i} not divisor`,
                        log: `  i=${i}: not divisible`,
                        logColor: 'var(--text-main)'
                    });
                }
            }

            // Final step
            steps.push({
                type: 'final',
                count: divisorCount,
                fact: fact,
                panel: `Counting complete.<br>${fact} has <b>${divisorCount}</b> positive divisors.`,
                statusText: `Done. Number of divisors = ${divisorCount}`,
                log: `\nFinal Result: ${divisorCount}`,
                logColor: 'var(--accent-green)',
                bold: true,
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show factorial as a big number tile
            const factTile = document.createElement('div');
            factTile.className = 'tile-unit';
            const fTile = document.createElement('div');
            fTile.className = `tile ${step.type === 'final' ? 'winning' : 'current'}`;
            fTile.style.fontSize = '15px';
            fTile.innerHTML = `n! =<br>${step.fact || '—'}`;
            const fLabel = document.createElement('div');
            fLabel.className = 'tile-index';
            fLabel.innerText = 'Factorial';
            factTile.append(fTile, fLabel);
            container.appendChild(factTile);

            // If divisor step, show current i
            if (step.type === 'divisor-step' && step.i) {
                const iTile = document.createElement('div');
                iTile.className = 'tile-unit';
                const dTile = document.createElement('div');
                dTile.className = `tile candidate`;
                dTile.innerText = step.i;
                const dLabel = document.createElement('div');
                dLabel.className = 'tile-index';
                dLabel.innerText = 'Checking';
                iTile.append(dTile, dLabel);
                container.appendChild(iTile);

                if (step.comp) {
                    const cTile = document.createElement('div');
                    cTile.className = 'tile-unit';
                    const compDiv = document.createElement('div');
                    compDiv.className = `tile winning`;
                    compDiv.innerText = step.comp;
                    const cLabel = document.createElement('div');
                    cLabel.className = 'tile-index';
                    cLabel.innerText = 'Pair';
                    cTile.append(compDiv, cLabel);
                    container.appendChild(cTile);
                }
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-fact').innerText = step.fact || '—';
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-count').innerText = step.currentCount !== undefined ? step.currentCount : (step.count || '—');

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.count;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = () => {
            loadExample(5);
        };
    </script>
</body>
</html>
