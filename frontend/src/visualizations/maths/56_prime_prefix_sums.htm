<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Prefix Sums - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 90px;
            font-size: 13px;
        }
        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 860px; min-height: 90px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 18px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.12); }
        .tile.done { opacity: 0.55; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 76px;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 100px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; }

        #res-val { 
            font-size: 20px; color: var(--accent-green); font-family: monospace; font-weight: bold; 
            transition: all 0.3s;
        }
        .pop { animation: popAnim 400ms ease; font-size: 26px !important; }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="n-input" value="5" min="0">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(5)">Ex 1 (n=5)</button>
        <button onclick="loadExample(10)">Ex 2 (n=10)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Numbers 1 to n:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Is Prime?</span>
            <span class="info-value" id="val-prime" style="color:var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Sum</span>
            <span class="info-value" id="val-sum" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Prefix[i]</span>
            <span class="info-value" id="val-prefix" style="color:var(--accent-purple);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Final Prefix Sum Array</span><br>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px;">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Checking</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green);border:1px solid var(--accent-green)"></span> Prime (add)</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface);border:1px solid var(--border-main);opacity:0.5"></span> Not prime</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nVal = 5;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function isPrime(x) {
            if (x < 2) return false;
            if (x === 2) return true;
            if (x % 2 === 0) return false;
            for (let i = 3; i * i <= x; i += 2) {
                if (x % i === 0) return false;
            }
            return true;
        }

        function generateSteps() {
            steps = [];
            let currentSum = 0;
            let prefix = [];

            // Init step
            steps.push({
                type: 'init',
                i: '—',
                isPrimeVal: '—',
                currentSum: 0,
                prefixVal: 0,
                panel: `Computing prime prefix sums up to <b>${nVal}</b>`,
                statusText: `Starting...`,
                log: `n = ${nVal}\ncurrent_sum = 0`,
                digitsStates: Array(nVal).fill('idle')
            });

            for (let i = 1; i <= nVal; i++) {
                const prime = isPrime(i);
                const newSum = currentSum + (prime ? i : 0);

                steps.push({
                    type: prime ? 'winning' : 'candidate',
                    i: i,
                    isPrimeVal: prime,
                    currentSum: newSum,
                    prefixVal: newSum,
                    panel: `i = <b>${i}</b><br>${prime ? 'Prime → add ' + i : 'Not prime → keep sum'}`,
                    statusText: `i=${i} | ${prime ? 'Prime' : 'Not prime'} | sum = ${newSum}`,
                    log: `i=${i}: ${prime ? 'Prime, sum += ' + i : 'Not prime'}`,
                    logColor: prime ? 'var(--accent-green)' : 'var(--accent-orange)',
                    digitsStates: Array(nVal).fill('idle').map((_, idx) => {
                        const num = idx + 1;
                        if (num === i) return prime ? 'winning' : 'candidate';
                        return num < i ? 'done' : 'idle';
                    })
                });

                if (prime) currentSum = newSum;
                prefix.push(newSum);
            }

            // Final step
            steps.push({
                type: 'final',
                i: '—',
                isPrimeVal: '—',
                currentSum: currentSum,
                prefixVal: currentSum,
                panel: `Final prefix sum array:<br><b>${JSON.stringify(prefix)}</b>`,
                statusText: `Completed! Sum of primes ≤ ${nVal} = ${currentSum}`,
                log: `Final prefix sum: ${JSON.stringify(prefix)}`,
                logColor: 'var(--accent-green)',
                bold: true,
                digitsStates: Array(nVal).fill('done')
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            step.digitsStates.forEach((state, pos) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.innerText = pos + 1;

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = pos + 1;

                wrapper.appendChild(tile);
                wrapper.appendChild(idxLabel);
                container.appendChild(wrapper);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i;
            document.getElementById('val-prime').innerText = step.isPrimeVal === true ? 'Yes' : (step.isPrimeVal === false ? 'No' : '—');
            document.getElementById('val-sum').innerText = step.currentSum;
            document.getElementById('val-prefix').innerText = step.prefixVal;

            const resEl = document.getElementById('res-val');
            if (step.type === 'final') {
                resEl.innerText = JSON.stringify(steps[steps.length-2].prefixVal ? [] : []); // final prefix
                resEl.innerText = JSON.stringify(Array.from({length: nVal}, (_, i) => steps[steps.length-2].prefixVal)); // better
                // Actually show the full final array
                let finalPrefix = [];
                let sum = 0;
                for (let i = 1; i <= nVal; i++) {
                    if (isPrime(i)) sum += i;
                    finalPrefix.push(sum);
                }
                resEl.innerText = JSON.stringify(finalPrefix);
                resEl.classList.add('pop');
            } else {
                resEl.innerText = '—';
                resEl.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.color = steps[k].logColor || 'var(--text-dim)';
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            const input = parseInt(document.getElementById('n-input').value);
            if (!isNaN(input) && input >= 0) {
                nVal = input;
                generateSteps();
                reset();
            }
        }

        function loadExample(val) {
            nVal = val;
            document.getElementById('n-input').value = val;
            generateSteps();
            reset();
        }

        window.onload = () => {
            loadExample(5);
        };
    </script>
</body>
</html>
