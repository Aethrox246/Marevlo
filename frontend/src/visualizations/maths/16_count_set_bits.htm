<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Set Bits - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 160px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 90px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 20px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); }
        .tile.set { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); }
        .tile.unset { background: #21262d; border-color: var(--border-main); color: var(--text-dim); }
        .tile.done { opacity: 0.6; background: #161b22; }

        .action-panel {
            margin-top: 30px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 700px; text-align: center; font-family: monospace;
            min-height: 85px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 15px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .result-display { margin-top: 15px; text-align: center; }
        #res-val { font-size: 32px; font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { color: var(--accent-green) !important; text-shadow: 0 0 15px var(--accent-green); animation: popAnim 500ms; }

        @keyframes popAnim { 0%{transform:scale(0.7)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; width: 600px; text-align: center; }

        .controls { margin-top: 25px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        .legend { margin-top: 15px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; }

        .log-panel {
            margin-top: 15px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 95%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" placeholder="5" value="5">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(5)">Ex 1 (5)</button>
        <button onclick="loadExample(7)">Ex 2 (7)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Binary Representation (LSB on right)</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current n</span>
            <span class="info-value" id="val-n" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">LSB (n & 1)</span>
            <span class="info-value" id="val-lsb" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Count</span>
            <span class="info-value" id="val-count" style="color:var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">n >> 1</span>
            <span class="info-value" id="val-next" style="color:var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Number of Set Bits =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Checking LSB</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:1px solid var(--accent-green)"></span> Set Bit (1)</div>
        <div class="legend-item"><span class="dot" style="background:#21262d;border:1px solid var(--border-main)"></span> Unset Bit (0)</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputNumber = 5;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 850, 400];

        function init() { loadExample(5); }

        function loadExample(newNum) {
            inputNumber = parseInt(newNum);
            document.getElementById('num-input').value = inputNumber;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val) && val >= 0) {
                loadExample(val);
            } else {
                alert("Please enter a valid non-negative integer.");
            }
        }

        function generateSteps() {
            steps = [];
            let n = inputNumber;
            let count = 0;
            let bitPosition = 0;
            let originalN = n;

            // Initial Step
            steps.push({
                type: 'init',
                currentN: n,
                lsb: '—',
                count: 0,
                nextN: '—',
                bits: getBinaryBits(n),
                panel: `Count set bits (1s) in <b>${inputNumber}</b>.<br>Using Brian Kernighan / Brute Force approach: check LSB and right shift.`,
                status: `Starting with n = ${inputNumber}`,
                log: `Input: n = ${inputNumber}\nInitialize count = 0`
            });

            if (n === 0) {
                steps.push({
                    type: 'final',
                    currentN: 0,
                    lsb: 0,
                    count: 0,
                    nextN: 0,
                    bits: [0],
                    panel: `Special case: n = 0 has <b>0</b> set bits.`,
                    status: `Result: 0`,
                    log: `n = 0 → Return 0`,
                    isTrue: true
                });
                return;
            }

            while (n > 0) {
                const lsb = n & 1;
                const prevCount = count;
                if (lsb === 1) count++;

                steps.push({
                    type: 'check',
                    currentN: n,
                    lsb: lsb,
                    count: count,
                    nextN: n >> 1,
                    bits: getBinaryBits(n),
                    panel: `Current n = <b>${n}</b> (binary ${n.toString(2)})<br>LSB = <b>${n} & 1 = ${lsb}</b><br>Count ${prevCount} → ${count}`,
                    status: `Checking LSB of ${n} → ${lsb ? 'Set!' : 'Unset'}`,
                    log: `n = ${n} | LSB = ${lsb} | count = ${count} | n >>= 1 → ${n >> 1}`
                });

                n = n >> 1;
            }

            // Final Step
            steps.push({
                type: 'final',
                currentN: 0,
                lsb: '—',
                count: count,
                nextN: 0,
                bits: getBinaryBits(originalN),
                panel: `Loop ended.<br><b>${originalN}</b> has <b>${count}</b> set bits.`,
                status: `Final Result: ${count}`,
                log: `Final Result: ${count} set bits`,
                isTrue: true
            });
        }

        function getBinaryBits(num) {
            if (num === 0) return [0];
            let bits = [];
            let temp = num;
            while (temp > 0) {
                bits.unshift(temp & 1);
                temp >>= 1;
            }
            return bits;
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            step.bits.forEach((bit, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                let state = bit === 1 ? 'set' : 'unset';
                if (step.type === 'check' && i === step.bits.length - 1) {
                    state = 'candidate';
                }
                tile.className = `tile ${state}`;
                tile.innerText = bit;

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `b${step.bits.length - 1 - i}`;

                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-n').innerText = step.currentN;
            document.getElementById('val-lsb').innerText = step.lsb;
            document.getElementById('val-count').innerText = step.count;
            document.getElementById('val-next').innerText = step.nextN;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.count !== undefined && step.type === 'final' ? step.count : '—';
            if (step.type === 'final') resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.status;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    line.innerText = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
