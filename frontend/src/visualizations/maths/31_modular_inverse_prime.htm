<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Inverse (Prime) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 90px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 920px; min-height: 110px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 19px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.checking { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.12); z-index: 2; }
        .tile.success { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 12px var(--accent-green); z-index: 3; }
        .tile.failed { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-red); z-index: 3; }
        .tile.past { opacity: 0.35; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 22px; width: 740px; text-align: center; font-family: monospace; min-height: 82px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 115px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        /* RESULT */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 28px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* STATUS */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px;}

        /* CONTROLS */
        .controls { margin-top: 26px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 14px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 740px; max-width: 92%; height: 135px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">a =</label>
        <input type="number" id="a-input" value="3">
        <label class="ui-label">p =</label>
        <input type="number" id="p-input" value="7">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(3,7)">Ex 1 (3⁻¹ mod 7)</button>
        <button onclick="loadExample(5,11)">Ex 2 (5⁻¹ mod 11)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute-force search for x where (a × x) % p = 1</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current x</span>
            <span class="info-value" id="val-x" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">a × x</span>
            <span class="info-value" id="val-product" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">(a × x) % p</span>
            <span class="info-value" id="val-mod" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Target</span>
            <span class="info-value" id="val-target" style="color: var(--accent-green);">1</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Modular Inverse =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Testing x</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-purple)"></span> Product</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-blue)"></span> Modulo Result</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Found Inverse</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let a = 3, p = 7;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() {
            loadExample(3, 7);
        }

        function loadExample(newA, newP) {
            a = parseInt(newA);
            p = parseInt(newP);
            document.getElementById('a-input').value = a;
            document.getElementById('p-input').value = p;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valA = parseInt(document.getElementById('a-input').value);
            const valP = parseInt(document.getElementById('p-input').value);

            if (!isNaN(valA) && !isNaN(valP) && valP > 1 && valA >= 0) {
                loadExample(valA, valP);
            } else {
                alert("Please enter valid integers (p > 1).");
            }
        }

        function generateSteps() {
            steps = [];
            let inverse = -1;

            // STEP 0: INIT
            steps.push({
                type: 'init',
                x: '—',
                product: '—',
                modResult: '—',
                panel: `Finding modular inverse of <b>${a}</b> modulo prime <b>${p}</b>.<br>We search for x (1 to ${p-1}) such that (<b>${a}</b> × x) % ${p} = 1`,
                statusText: `Starting search for inverse of ${a} mod ${p}`,
                log: `Computing modular inverse of ${a} modulo ${p}\nSince p is prime and a not divisible by p, inverse exists.`,
                logColor: 'var(--text-dim)'
            });

            for (let x = 1; x < p; x++) {
                let product = a * x;
                let modResult = product % p;

                // Test candidate
                steps.push({
                    type: 'test',
                    x: x,
                    product: product,
                    modResult: modResult,
                    panel: `Testing x = <b>${x}</b><br><code>(${a} * ${x}) % ${p} = ${modResult}</code>`,
                    statusText: `Checking x = ${x}`,
                    log: `x = ${x}\n  ${a} * ${x} = ${product}\n  ${product} % ${p} = ${modResult}`,
                    logColor: 'var(--accent-orange)'
                });

                if (modResult === 1) {
                    inverse = x;
                    // Success step
                    steps.push({
                        type: 'success',
                        x: x,
                        product: product,
                        modResult: 1,
                        panel: `<span style="color:var(--accent-green)">Found!</span><br><b>${a} * ${x} ≡ 1 (mod ${p})</b><br>Modular inverse is <b>${x}</b>`,
                        statusText: `Inverse found at x = ${x}`,
                        log: `✓ Found! (${a} * ${x}) % ${p} = 1\nModular inverse = ${x}`,
                        logColor: 'var(--accent-green)',
                        bold: true
                    });
                    break;
                } else {
                    // Failed check
                    steps.push({
                        type: 'fail',
                        x: x,
                        product: product,
                        modResult: modResult,
                        panel: `Not equal to 1. Continue searching...`,
                        statusText: `No match at x=${x}`,
                        log: `  Not 1. Continue...`,
                        logColor: 'var(--text-dim)'
                    });
                }
            }

            // FINAL STEP
            steps.push({
                type: 'final',
                x: inverse,
                product: '—',
                modResult: '—',
                panel: `Search complete.<br>The modular inverse of <b>${a}</b> modulo <b>${p}</b> is <b>${inverse}</b>.<br>Verification: (${a} * ${inverse}) % ${p} = 1`,
                complete: true,
                statusText: `Done. Inverse = ${inverse}`,
                log: `\nFinal Result → Modular Inverse = ${inverse}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Create tiles for x = 1 to p-1
            for (let i = 1; i < p; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = 'tile';

                if (step.type === 'test' && i === step.x) {
                    tile.classList.add('candidate');
                } else if (step.type === 'success' && i === step.x) {
                    tile.classList.add('success');
                } else if (step.x && i < step.x) {
                    tile.classList.add('past');
                } else if (step.type === 'final' && i === step.x) {
                    tile.classList.add('success');
                }

                tile.innerText = i;
                wrapper.appendChild(tile);

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `x=${i}`;
                wrapper.appendChild(idxLabel);

                container.appendChild(wrapper);
            }

            // Update main panel and info
            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-x').innerText = step.x;
            document.getElementById('val-product').innerText = step.product;
            document.getElementById('val-mod').innerText = step.modResult;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.x : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText;

            // Log panel
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
