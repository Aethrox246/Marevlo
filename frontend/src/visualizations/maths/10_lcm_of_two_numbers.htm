<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCM of Two Numbers - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 110px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 820px; }
        .tiles-wrapper { 
            display: flex; gap: 20px; justify-content: center; align-items: center; 
            flex-wrap: wrap; min-height: 140px;
        }

        .number-box {
            background: #21262d;
            border: 3px solid var(--accent-orange);
            border-radius: 12px;
            padding: 20px 40px;
            font-size: 42px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 160px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .operation { font-size: 32px; color: var(--accent-purple); margin: 0 15px; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 18px 24px; width: 720px; min-height: 92px;
            font-family: monospace; font-size: 15px; line-height: 1.6; text-align: center;
        }

        .info-panel { margin-top: 15px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 20px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 20px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 20px; font-size: 28px; font-family: monospace; }
        #res-val { color: var(--accent-green); font-weight: bold; transition: all 0.4s; }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.5em; text-align: center; width: 720px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; cursor: pointer; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }

        .pop { animation: popAnim 600ms ease; }
        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">a =</label>
        <input type="number" id="a-input" value="4">
        <label class="ui-label">b =</label>
        <input type="number" id="b-input" value="6">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(4,6)">Ex 1 (4,6)</button>
        <button onclick="loadExample(5,7)">Ex 2 (5,7)</button>
    </div>

    <div class="visual-container">
        <div class="tiles-wrapper" id="visual"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">GCD</span>
            <span class="info-value" id="val-gcd" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">LCM</span>
            <span class="info-value" id="val-lcm" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display">
        LCM(a, b) = <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentA = 4, currentB = 6;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 850, 420];

        function init() { loadExample(4, 6); }

        function loadExample(a, b) {
            currentA = Math.abs(parseInt(a) || 4);
            currentB = Math.abs(parseInt(b) || 6);
            document.getElementById('a-input').value = currentA;
            document.getElementById('b-input').value = currentB;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const a = parseInt(document.getElementById('a-input').value);
            const b = parseInt(document.getElementById('b-input').value);
            if (!isNaN(a) && !isNaN(b)) loadExample(a, b);
            else alert("Please enter valid integers for a and b.");
        }

        function gcd(a, b) {
            a = Math.abs(a); b = Math.abs(b);
            while (b !== 0) {
                const t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function generateSteps() {
            steps = [];
            let a = currentA, b = currentB;

            steps.push({
                type: 'init',
                a: a, b: b, gcd: '—', lcm: '—',
                panel: `Computing LCM(<b>${a}</b>, <b>${b}</b>) using LCM = |a × b| / GCD(a, b)`,
                statusText: `a = ${a}, b = ${b}`,
                log: `Start LCM(${a}, ${b})`,
                logColor: 'var(--text-dim)'
            });

            // GCD steps
            let x = a, y = b;
            while (y !== 0) {
                const rem = x % y;
                steps.push({
                    type: 'gcd',
                    a: x, b: y, rem: rem, gcd: '—', lcm: '—',
                    panel: `<code>${x} % ${y} = ${rem}</code><br>Now GCD(${y}, ${rem})`,
                    statusText: `GCD step: ${y}, ${rem}`,
                    log: `${x} % ${y} = ${rem}`,
                    logColor: 'var(--accent-blue)'
                });
                x = y;
                y = rem;
            }

            const finalGCD = x;
            const finalLCM = (a === 0 || b === 0) ? 0 : Math.abs(a) / finalGCD * Math.abs(b);

            steps.push({
                type: 'final',
                a: a, b: b, gcd: finalGCD, lcm: finalLCM,
                panel: `GCD = <b>${finalGCD}</b><br>LCM = (${a} × ${b}) / ${finalGCD} = <span style="color:var(--accent-green)"><b>${finalLCM}</b></span>`,
                statusText: `LCM = ${finalLCM}`,
                log: `Final LCM = ${finalLCM}`,
                logColor: 'var(--accent-green)',
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('visual');
            container.innerHTML = `
                <div class="number-box" style="border-color:var(--accent-orange)">${step.a}</div>
                <div class="operation">×</div>
                <div class="number-box" style="border-color:var(--accent-blue)">${step.b}</div>
                ${step.gcd !== '—' ? `<div class="operation">→</div><div class="number-box" style="border-color:var(--accent-purple);font-size:32px">${step.gcd}</div>` : ''}
            `;

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-gcd').innerText = step.gcd;
            document.getElementById('val-lcm').innerText = step.lcm || '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.lcm;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
