<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integer Partitions - Recursive Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 90px;
            font-size: 14px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 920px; }
        .tiles-wrapper { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; min-height: 120px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 19px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); box-shadow: 0 0 14px rgba(227,179,65,0.5); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.1); box-shadow: 0 0 14px var(--accent-green); }
        .tile.current { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.08); }

        .action-panel {
            margin-top: 25px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 16px 24px; width: 740px; text-align: center; font-family: monospace;
            min-height: 92px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 18px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 16px; }
        #res-val { font-size: 26px; font-weight: bold; font-family: monospace; transition: all 0.4s; }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 34px !important; }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.4em; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; }

        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 16px 20px; width: 740px; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="n-input" min="1" max="30" value="4">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1: n=4</button>
        <button onclick="loadExample(1)">Ex 2: n=5</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Integer Partitions p(n) — Recursive Decomposition</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Remaining Sum</span>
            <span class="info-value" id="val-sum" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max Part Allowed</span>
            <span class="info-value" id="val-max" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Count</span>
            <span class="info-value" id="val-count" style="color: var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 8px;">p(n) = Number of Partitions</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex;align-items:center;gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Trying part</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple);border:1px solid var(--accent-purple)"></span> Recursive call</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green);border:1px solid var(--accent-green)"></span> Valid partition</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let n = 4;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        const examples = [
            { n: 4, result: 5 },
            { n: 5, result: 7 }
        ];

        function generateSteps() {
            steps = [];

            steps.push({
                type: 'init',
                remaining: n,
                maxPart: n,
                count: 0,
                panel: `Counting partitions of <b>${n}</b><br>partition(${n}, ${n})`,
                statusText: `Starting partition(${n}, ${n})`,
                log: `Computing p(${n}) = number of ways to write ${n} as sum of positive integers (order doesn't matter)`,
                logColor: 'var(--text-dim)'
            });

            function recurse(remain, maxP, depth = 0) {
                if (remain === 0) {
                    steps.push({
                        type: 'base',
                        remaining: 0,
                        maxPart: maxP,
                        count: 1,
                        panel: `Base case: remainder = 0 → <b>1 valid partition</b>`,
                        statusText: `Valid partition found`,
                        log: `Remainder 0 → +1 (valid)`,
                        logColor: 'var(--accent-green)',
                        depth: depth
                    });
                    return 1;
                }

                let total = 0;
                const start = Math.min(remain, maxP);

                for (let p = start; p >= 1; p--) {
                    steps.push({
                        type: 'try',
                        remaining: remain,
                        maxPart: maxP,
                        chosen: p,
                        panel: `Trying part = <b>${p}</b> (max allowed = ${maxP})<br>Remainder becomes ${remain - p}`,
                        statusText: `Trying part ${p}`,
                        log: `Try part=${p} → recurse(${remain-p}, ${p})`,
                        logColor: 'var(--accent-orange)',
                        depth: depth
                    });

                    const sub = recurse(remain - p, p, depth + 1);
                    total += sub;
                }

                steps.push({
                    type: 'return',
                    remaining: remain,
                    maxPart: maxP,
                    count: total,
                    panel: `partition(${remain}, ${maxP}) = <b>${total}</b>`,
                    statusText: `Return count = ${total}`,
                    log: `partition(${remain}, ${maxP}) returned ${total}`,
                    logColor: 'var(--accent-blue)',
                    depth: depth
                });

                return total;
            }

            const finalCount = recurse(n, n);

            steps.push({
                type: 'final',
                count: finalCount,
                panel: `All partitions counted.<br>p(${n}) = <b>${finalCount}</b>`,
                statusText: `Final result: p(${n}) = ${finalCount}`,
                log: `\nFinal p(${n}) = ${finalCount}`,
                logColor: 'var(--accent-green)',
                bold: true,
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show current remaining and max part
            const remainTile = document.createElement('div');
            remainTile.className = 'tile-unit';
            const rTile = document.createElement('div');
            rTile.className = `tile ${step.type === 'base' || step.type === 'final' ? 'winning' : 'candidate'}`;
            rTile.innerText = step.remaining !== undefined ? step.remaining : '—';
            const rLabel = document.createElement('div');
            rLabel.className = 'tile-index';
            rLabel.innerText = 'Remaining';
            remainTile.append(rTile, rLabel);
            container.appendChild(remainTile);

            const maxTile = document.createElement('div');
            maxTile.className = 'tile-unit';
            const mTile = document.createElement('div');
            mTile.className = `tile current`;
            mTile.innerText = step.maxPart !== undefined ? step.maxPart : '—';
            const mLabel = document.createElement('div');
            mLabel.className = 'tile-index';
            mLabel.innerText = 'Max Part';
            maxTile.append(mTile, mLabel);
            container.appendChild(maxTile);

            if (step.chosen !== undefined) {
                const chosenTile = document.createElement('div');
                chosenTile.className = 'tile-unit';
                const cTile = document.createElement('div');
                cTile.className = `tile candidate`;
                cTile.innerText = step.chosen;
                const cLabel = document.createElement('div');
                cLabel.className = 'tile-index';
                cLabel.innerText = 'Chosen Part';
                chosenTile.append(cTile, cLabel);
                container.appendChild(chosenTile);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-sum').innerText = step.remaining !== undefined ? step.remaining : '—';
            document.getElementById('val-max').innerText = step.maxPart !== undefined ? step.maxPart : '—';
            document.getElementById('val-count').innerText = step.count !== undefined ? step.count : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.count;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
                btn.innerText = '▶ Play';
            } else {
                btn.innerText = '❚❚ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        function loadExample(idx) {
            n = examples[idx].n;
            document.getElementById('n-input').value = n;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('n-input').value);
            if (val >= 1 && val <= 30) {
                n = val;
                generateSteps();
                reset();
            } else {
                alert("Please enter n between 1 and 30.");
            }
        }

        window.onload = () => {
            loadExample(0);
        };
    </script>
</body>
</html>
