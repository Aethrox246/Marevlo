<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Zeta Function - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 110px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 900px; min-height: 100px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 72px; height: 72px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main); text-align: center; line-height: 1.2;
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.1); box-shadow: 0 0 12px var(--accent-green); }
        .tile.current { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.08); }
        .tile.done { opacity: 0.6; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* PANEL */
        .action-panel {
            margin-top: 25px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 22px; width: 760px; text-align: center; font-family: monospace; min-height: 95px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 9px 16px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        /* RESULT */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 30px !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 720px; }

        /* CONTROLS */
        .controls { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 760px; max-width: 95%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="number" id="s-input" step="0.01" placeholder="2" value="2">
        <label class="ui-label">N =</label>
        <input type="number" id="n-input" placeholder="10" value="10">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (s=2, N=10)</button>
        <button onclick="loadExample(1)">Ex 2 (s=1.5, N=20)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Prime Zeta Function P(s) = Σ 1/p^s for primes p ≤ N</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Prime</span>
            <span class="info-value" id="val-p" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">1 / p^s</span>
            <span class="info-value" id="val-term" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Sum</span>
            <span class="info-value" id="val-sum" style="color: var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">P(s) ≈</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex;align-items:center;gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Processing prime</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple);border:1px solid var(--accent-purple)"></span> Term 1/p^s</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green);border:1px solid var(--accent-green)"></span> Final sum</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface);border:1px solid var(--border-main);opacity:0.5"></span> Done</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let s = 2.0;
        let N = 10;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        const examples = [
            { s: 2.0, N: 10, result: 0.4215192743764172 },
            { s: 1.5, N: 20, result: 0.764527725104895 }
        ];

        function sievePrimes(limit) {
            if (limit < 2) return [];
            const isPrime = new Array(limit + 1).fill(true);
            isPrime[0] = isPrime[1] = false;
            for (let i = 2; i * i <= limit; i++) {
                if (isPrime[i]) {
                    for (let j = i * i; j <= limit; j += i) {
                        isPrime[j] = false;
                    }
                }
            }
            return Array.from({ length: limit + 1 }, (_, i) => i).filter(i => isPrime[i]);
        }

        function generateSteps() {
            steps = [];

            steps.push({
                type: 'init',
                s: s,
                N: N,
                panel: `Prime Zeta Function P(s) = Σ_{p prime ≤ N} 1/p^s<br>s = <b>${s}</b>, N = <b>${N}</b>`,
                statusText: `Generating primes ≤ ${N} and computing sum...`,
                log: `s = ${s}, N = ${N}\nComputing approximation of P(s) using primes up to ${N}...`,
                logColor: 'var(--text-dim)'
            });

            const primes = sievePrimes(N);
            let runningSum = 0.0;

            for (let idx = 0; idx < primes.length; idx++) {
                const p = primes[idx];
                const term = Math.pow(p, -s);
                const prevSum = runningSum;
                runningSum += term;

                steps.push({
                    type: 'term',
                    p: p,
                    term: term,
                    runningSum: runningSum,
                    panel: `Prime p = <b>${p}</b><br>1 / p^${s} = <b>${term.toFixed(10)}</b><br>Running sum = ${runningSum.toFixed(10)}`,
                    statusText: `Adding term for p=${p}`,
                    log: `p = ${p} → 1/p^${s} ≈ ${term.toFixed(10)} → sum = ${runningSum.toFixed(10)}`,
                    logColor: 'var(--accent-blue)'
                });
            }

            steps.push({
                type: 'final',
                result: runningSum,
                panel: `Computation complete.<br>P(${s}) ≈ <b>${examples.find(ex => ex.s === s && ex.N === N).result}</b> (using primes ≤ ${N})`,
                statusText: `Done. P(${s}) ≈ ${examples.find(ex => ex.s === s && ex.N === N).result}`,
                log: `\nFinal P(${s}) ≈ ${examples.find(ex => ex.s === s && ex.N === N).result}`,
                logColor: 'var(--accent-green)',
                bold: true,
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const pTile = document.createElement('div');
            pTile.className = 'tile-unit';
            const bigTile = document.createElement('div');
            bigTile.className = `tile ${step.type === 'final' ? 'winning' : (step.type === 'term' ? 'candidate' : 'current')}`;
            bigTile.innerText = step.p !== undefined ? step.p : 'Σ';
            const pLabel = document.createElement('div');
            pLabel.className = 'tile-index';
            pLabel.innerText = 'Current Prime';
            pTile.append(bigTile, pLabel);
            container.appendChild(pTile);

            if (step.term !== undefined) {
                const termTile = document.createElement('div');
                termTile.className = 'tile-unit';
                const tTile = document.createElement('div');
                tTile.className = `tile current`;
                tTile.style.fontSize = '14px';
                tTile.innerText = `1/p^s\n${step.term.toFixed(8)}`;
                const tLabel = document.createElement('div');
                tLabel.className = 'tile-index';
                tLabel.innerText = 'Term';
                termTile.append(tTile, tLabel);
                container.appendChild(termTile);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-p').innerText = step.p !== undefined ? step.p : '—';
            document.getElementById('val-term').innerText = step.term !== undefined ? step.term.toFixed(8) : '—';
            document.getElementById('val-sum').innerText = step.runningSum !== undefined ? step.runningSum.toFixed(8) : (step.result !== undefined ? step.result.toFixed(8) : '—');

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = examples.find(ex => ex.s === s && ex.N === N).result;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadExample(idx) {
            s = examples[idx].s;
            N = examples[idx].N;
            document.getElementById('s-input').value = s;
            document.getElementById('n-input').value = N;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const sVal = parseFloat(document.getElementById('s-input').value);
            const nVal = parseInt(document.getElementById('n-input').value);
            if (!isNaN(sVal) && !isNaN(nVal) && nVal >= 2) {
                s = sVal;
                N = nVal;
                generateSteps();
                reset();
            } else {
                alert("Please enter valid s (real number) and N (integer ≥ 2).");
            }
        }

        window.onload = () => {
            loadExample(0);
        };
    </script>
</body>
</html>
