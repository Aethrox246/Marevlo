<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polynomial Congruence Solver - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"], input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; 
            max-width: 900px; min-height: 110px; position: relative; 
        }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 20px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227,179,65,0.4); }
        .tile.evaluating { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 15px var(--accent-green); }
        .tile.failed { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }
        .tile.past { opacity: 0.35; background: #161b22; }

        /* PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; text-align: center; 
            font-family: monospace; min-height: 85px; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; }

        /* RESULT */
        .result-display { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 28px !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

        /* STATUS & CONTROLS */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px;}
        .controls { margin-top: 25px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        /* LEGEND */
        .legend { margin-top: 15px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 15px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 95%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Coefficients [a_n, ..., a0]</label>
        <input type="text" id="coeff-input" placeholder="[2, -3, 1]" value="[2, -3, 1]">
        <label class="ui-label">m =</label>
        <input type="number" id="mod-input" placeholder="5" value="5" style="width:80px">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (2x²-3x+1 mod 5)</button>
        <button onclick="loadExample(1)">Ex 2 (x³+2 mod 3)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Testing residue x = <span id="current-x" style="color:var(--accent-orange)">—</span></div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Polynomial</span>
            <span class="info-value" id="val-poly" style="color: var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current x</span>
            <span class="info-value" id="val-x" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">P(x)</span>
            <span class="info-value" id="val-eval" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">P(x) mod m</span>
            <span class="info-value" id="val-mod" style="color: var(--accent-purple);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Solutions (residues) =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Testing x</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue); border:1px solid var(--accent-blue)"></span> Evaluating P(x)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Solution Found</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let coeffs = [2, -3, 1];
        let m = 5;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            if (ex === 0) {
                coeffs = [2, -3, 1];
                m = 5;
                document.getElementById('coeff-input').value = "[2, -3, 1]";
                document.getElementById('mod-input').value = "5";
            } else {
                coeffs = [1, 0, 0, 2];
                m = 3;
                document.getElementById('coeff-input').value = "[1, 0, 0, 2]";
                document.getElementById('mod-input').value = "3";
            }
            generateSteps();
            reset();
        }

        function loadCustom() {
            const coeffStr = document.getElementById('coeff-input').value.trim();
            try {
                coeffs = JSON.parse(coeffStr);
                if (!Array.isArray(coeffs)) throw new Error();
            } catch(e) {
                alert("Invalid coefficients. Use format like [2, -3, 1]");
                return;
            }
            m = parseInt(document.getElementById('mod-input').value) || 5;
            if (m < 2) m = 5;
            generateSteps();
            reset();
        }

        function polyToString(coeffs) {
            let s = "";
            for (let i = coeffs.length - 1; i >= 0; i--) {
                let c = coeffs[i];
                if (c === 0) continue;
                let term = "";
                if (i === 0) term = c.toString();
                else if (i === 1) term = (Math.abs(c) === 1 ? "" : Math.abs(c)) + "x";
                else term = (Math.abs(c) === 1 ? "" : Math.abs(c)) + "x^" + i;

                if (s === "") s = (c < 0 ? "-" : "") + term;
                else s += (c > 0 ? " + " : " - ") + term.replace(/^-/, "");
            }
            return s || "0";
        }

        function evaluatePoly(coeffs, x, mod) {
            let result = 0;
            for (let a of coeffs) {
                result = (result * x + a) % mod;
            }
            return ((result % mod) + mod) % mod; // ensure non-negative
        }

        function generateSteps() {
            steps = [];
            const polyStr = polyToString(coeffs);
            let solutions = [];

            steps.push({
                type: 'init',
                x: '—',
                evalVal: '—',
                modVal: '—',
                panel: `Solving <b>${polyStr}</b> ≡ 0 (mod ${m})<br>Testing all residues x = 0 to ${m-1}`,
                status: "Starting brute-force search over residues...",
                log: `Polynomial: ${polyStr}\nModulus m = ${m}\nTesting x from 0 to ${m-1}...`,
                logColor: 'var(--text-dim)'
            });

            for (let x = 0; x < m; x++) {
                // Candidate step
                steps.push({
                    type: 'candidate',
                    x: x,
                    evalVal: '—',
                    modVal: '—',
                    panel: `Testing residue <b>x = ${x}</b>`,
                    status: `x = ${x}`,
                    log: `Testing x = ${x}`,
                    logColor: 'var(--accent-orange)'
                });

                // Evaluation
                const val = evaluatePoly(coeffs, x, m);
                const isSolution = val === 0;

                steps.push({
                    type: isSolution ? 'winning' : 'evaluate',
                    x: x,
                    evalVal: val,
                    modVal: val,
                    panel: `P(${x}) ≡ <span style="color:${isSolution ? 'var(--accent-green)' : 'var(--accent-blue)'}">${val}</span> (mod ${m})`,
                    status: `P(${x}) mod ${m} = ${val}`,
                    log: `  P(${x}) ≡ ${val} (mod ${m}) ${isSolution ? '→ SOLUTION' : ''}`,
                    logColor: isSolution ? 'var(--accent-green)' : 'var(--accent-blue)'
                });

                if (isSolution) {
                    solutions.push(x);
                }
            }

            // Final step
            const solStr = solutions.length ? solutions.join(', ') : "No solutions";
            steps.push({
                type: 'final',
                x: '—',
                evalVal: '—',
                modVal: '—',
                panel: `Search complete.<br>Solutions: <b>${solStr}</b>`,
                status: `Found ${solutions.length} solution(s): ${solStr}`,
                log: `Final solutions: [${solutions.join(', ')}]`,
                logColor: 'var(--accent-green)',
                complete: true,
                solutions: solutions
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show only current x as a big tile
            const wrapper = document.createElement('div');
            wrapper.className = 'tile-unit';

            const tile = document.createElement('div');
            let cls = 'idle';
            if (step.type === 'candidate') cls = 'candidate';
            if (step.type === 'evaluate') cls = 'evaluating';
            if (step.type === 'winning') cls = 'winning';

            tile.className = `tile ${cls}`;
            tile.innerText = step.x !== '—' ? step.x : '?';

            const idxLabel = document.createElement('div');
            idxLabel.className = 'tile-index';
            idxLabel.innerText = 'residue';

            wrapper.append(tile, idxLabel);
            container.appendChild(wrapper);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-poly').innerText = polyToString(coeffs);
            document.getElementById('val-x').innerText = step.x;
            document.getElementById('val-eval').innerText = step.evalVal !== '—' ? step.evalVal : '—';
            document.getElementById('val-mod').innerText = step.modVal !== '—' ? step.modVal : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.solutions && step.solutions.length ? `[${step.solutions.join(', ')}]` : "[]";
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.status || '';
            document.getElementById('current-x').innerText = step.x;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
