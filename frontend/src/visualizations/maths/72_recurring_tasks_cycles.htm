<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recurring Tasks Cycles - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 200px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; 
            max-width: 900px; min-height: 90px; position: relative;
        }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); box-shadow: 0 0 12px rgba(227, 179, 65, 0.5); z-index: 2; }
        .tile.divisor { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-red); z-index: 3; }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.1); box-shadow: 0 0 12px var(--accent-green); z-index: 3; }
        .tile.failed { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }
        .tile.done { opacity: 0.5; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }
        .tile.idle { opacity: 0.9; }

        /* PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 22px; width: 720px; text-align: center; 
            font-family: monospace; min-height: 85px; display: flex; flex-direction: column; 
            justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 9px 16px; display: flex; flex-direction: column; align-items: center; 
            min-width: 120px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; text-align: center; }

        /* RESULT */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 28px !important; text-shadow: 0 0 14px var(--accent-green); }
        .pop-false { animation: popAnim 400ms ease; color: var(--accent-red) !important; font-size: 28px !important; text-shadow: 0 0 14px var(--accent-red); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 680px;}

        /* CONTROLS */
        .controls { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 14px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 740px; max-width: 94%; height: 135px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">cycles =</label>
        <input type="text" id="num-input" placeholder="[2, 3, 4]" value="[2, 3, 4]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[2, 3, 4]')">Ex 1 [2,3,4]</button>
        <button onclick="loadExample('[5, 10]')">Ex 2 [5,10]</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Task Cycles:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Time</span>
            <span class="info-value" id="val-time" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max Cycle</span>
            <span class="info-value" id="val-max" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Sync Found?</span>
            <span class="info-value" id="val-sync" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Earliest Sync Time =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:5px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Current Time</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red); border:1px solid var(--accent-red)"></span> Not Aligned</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> All Tasks Sync</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--border-main); opacity:0.5"></span> Checked</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let cycles = [2, 3, 4];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample('[2, 3, 4]'); }

        function parseCycles(str) {
            try {
                return JSON.parse(str.replace(/'/g, '"'));
            } catch(e) {
                return [2, 3, 4];
            }
        }

        function loadExample(exampleStr) {
            document.getElementById('num-input').value = exampleStr;
            cycles = parseCycles(exampleStr);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('num-input').value.trim();
            if (val) {
                cycles = parseCycles(val);
                generateSteps();
                reset();
            } else {
                alert("Please enter cycles like [2, 3, 4]");
            }
        }

        function generateSteps() {
            steps = [];
            if (cycles.length === 0) return;

            const maxCycle = Math.max(...cycles);
            let time = maxCycle;
            let syncTime = null;

            // INIT STEP
            steps.push({
                type: 'init',
                time: maxCycle,
                maxCycle: maxCycle,
                panel: `Task cycles: <b>[${cycles.join(', ')}]</b><br>Max cycle = <b>${maxCycle}</b><br>Starting search from time = ${maxCycle}`,
                statusText: `Finding earliest time when all tasks align...`,
                log: `Cycles: [${cycles.join(', ')}]\nMax cycle = ${maxCycle}\nStarting brute-force search from t = ${maxCycle}`,
                logColor: 'var(--text-dim)',
                complete: false
            });

            while (true) {
                let allAlign = true;
                let remainders = [];

                for (let c of cycles) {
                    const rem = time % c;
                    remainders.push(rem);
                    if (rem !== 0) allAlign = false;
                }

                steps.push({
                    type: allAlign ? 'sync' : 'check',
                    time: time,
                    maxCycle: maxCycle,
                    panel: `At time <b>${time}</b>:<br>Checking divisibility for all cycles...`,
                    statusText: `Testing t = ${time}`,
                    log: `t = ${time} → remainders: [${remainders.join(', ')}]`,
                    logColor: allAlign ? 'var(--accent-green)' : 'var(--text-main)',
                    complete: false
                });

                if (allAlign) {
                    syncTime = time;
                    steps.push({
                        type: 'final',
                        time: time,
                        maxCycle: maxCycle,
                        panel: `<span style="color:var(--accent-green)">All tasks align at time <b>${time}</b>!</span><br>This is the least common multiple (LCM) of the cycles.`,
                        statusText: `Sync found at ${time}!`,
                        log: `✓ All cycles divide ${time} evenly → Earliest sync time = ${time}`,
                        logColor: 'var(--accent-green)',
                        bold: true,
                        complete: true,
                        syncTime: time
                    });
                    break;
                }

                if (time > 10000) break; // safety
                time++;
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            cycles.forEach((cycle, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile`;
                tile.innerText = cycle;

                if (step.type === 'sync' || step.complete) {
                    tile.classList.add('winning');
                } else if (step.time) {
                    const rem = step.time % cycle;
                    if (rem === 0) {
                        tile.classList.add('winning');
                    } else if (step.type === 'check') {
                        tile.classList.add('candidate');
                    }
                } else {
                    tile.classList.add('idle');
                }

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `c${i}`;

                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-time').innerText = step.time || '—';
            document.getElementById('val-max').innerText = step.maxCycle || '—';
            document.getElementById('val-sync').innerText = step.complete && step.syncTime ? 'YES' : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.syncTime ? step.syncTime : '—';
            if (step.complete) {
                resVal.className = 'pop';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            // Log panel
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
