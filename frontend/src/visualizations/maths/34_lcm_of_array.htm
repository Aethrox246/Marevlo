<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCM of Array - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 180px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 920px; min-height: 130px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 19px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.success { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 12px var(--accent-green); z-index: 3; }
        .tile.failed { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-red); z-index: 3; }
        .tile.past { opacity: 0.35; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 22px; width: 760px; text-align: center; font-family: monospace; min-height: 92px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        /* RESULT */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 28px !important; text-shadow: 0 0 12px var(--accent-green); }
        .pop-false { animation: popAnim 400ms ease; color: var(--accent-red) !important; font-size: 28px !important; text-shadow: 0 0 12px var(--accent-red); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* STATUS */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 720px;}

        /* CONTROLS */
        .controls { margin-top: 26px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 14px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 760px; max-width: 92%; height: 150px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Array =</label>
        <input type="text" id="arr-input" value="[2, 3, 4]" placeholder="[2,3,4]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[2,3,4]')">Ex 1 ([2,3,4])</button>
        <button onclick="loadExample('[5,10]')">Ex 2 ([5,10])</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute-force search: Start from max and find smallest number divisible by all elements</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Candidate</span>
            <span class="info-value" id="val-candidate" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max in Array</span>
            <span class="info-value" id="val-max" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Checks Passed</span>
            <span class="info-value" id="val-checks" style="color: var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">LCM =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Testing Candidate</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> LCM Found</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let array = [2, 3, 4];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            loadExample('[2,3,4]');
        }

        function loadExample(arrStr) {
            try {
                array = JSON.parse(arrStr);
                if (!Array.isArray(array)) array = [];
            } catch(e) {
                array = [2,3,4];
            }
            document.getElementById('arr-input').value = JSON.stringify(array);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('arr-input').value.trim();
            if (val) {
                loadExample(val);
            } else {
                alert("Please enter array like [2,3,4]");
            }
        }

        function generateSteps() {
            steps = [];
            if (array.length === 0) {
                steps.push({type:'final', candidate:0, panel:'Empty array', statusText:'Empty array', log:'Empty array', logColor:'var(--accent-red)'});
                return;
            }

            let maxVal = Math.max(...array);
            let candidate = maxVal;

            // STEP 0: INIT
            steps.push({
                type: 'init',
                candidate: maxVal,
                panel: `Computing LCM of array <b>${JSON.stringify(array)}</b><br>Start candidate from max = <b>${maxVal}</b>`,
                statusText: `Max = ${maxVal}, searching from ${maxVal} upwards`,
                log: `Array: ${JSON.stringify(array)}\nMax = ${maxVal}\nStarting candidate search...`,
                logColor: 'var(--text-dim)'
            });

            let found = false;
            let maxChecks = 10000; // safety limit

            while (!found && candidate < maxVal + maxChecks) {
                let passed = 0;
                let allPass = true;

                steps.push({
                    type: 'check',
                    candidate: candidate,
                    panel: `Testing candidate <b>${candidate}</b>`,
                    statusText: `Checking candidate = ${candidate}`,
                    log: `Candidate = ${candidate}`,
                    logColor: 'var(--accent-orange)'
                });

                for (let num of array) {
                    if (num === 0) {
                        allPass = false;
                        steps.push({
                            type: 'fail',
                            candidate: candidate,
                            panel: `0 in array → LCM undefined`,
                            statusText: `Invalid (0 in array)`,
                            log: `0 found → LCM undefined`,
                            logColor: 'var(--accent-red)'
                        });
                        found = true;
                        break;
                    }
                    if (candidate % num !== 0) {
                        allPass = false;
                        steps.push({
                            type: 'fail',
                            candidate: candidate,
                            panel: `${candidate} % ${num} = ${candidate % num} ≠ 0`,
                            statusText: `Not divisible by ${num}`,
                            log: `  ${candidate} % ${num} = ${candidate % num} ✗`,
                            logColor: 'var(--accent-red)'
                        });
                        break;
                    } else {
                        passed++;
                        steps.push({
                            type: 'pass',
                            candidate: candidate,
                            panel: `✓ ${candidate} % ${num} = 0`,
                            statusText: `Divisible by ${num}`,
                            log: `  ${candidate} % ${num} = 0 ✓`,
                            logColor: 'var(--accent-green)'
                        });
                    }
                }

                if (allPass) {
                    found = true;
                    steps.push({
                        type: 'success',
                        candidate: candidate,
                        panel: `<span style="color:var(--accent-green)">LCM Found!</span><br><b>${candidate}</b> is divisible by all elements`,
                        statusText: `LCM = ${candidate}`,
                        log: `✓ LCM = ${candidate}`,
                        logColor: 'var(--accent-green)',
                        bold: true
                    });
                } else if (!found) {
                    candidate++;
                }
            }

            if (!found) {
                steps.push({
                    type: 'final',
                    candidate: -1,
                    panel: `<span style="color:var(--accent-red)">No LCM found within reasonable range</span>`,
                    complete: true,
                    isTrue: false,
                    statusText: `Search limit reached`,
                    log: `Search limit reached`,
                    logColor: 'var(--accent-red)'
                });
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.className = 'tile-unit';

            const tile = document.createElement('div');
            tile.className = `tile ${step.type === 'success' ? 'success' : (step.type === 'check' ? 'candidate' : '')}`;
            tile.innerText = step.candidate;
            wrapper.appendChild(tile);

            const idxLabel = document.createElement('div');
            idxLabel.className = 'tile-index';
            idxLabel.innerText = `candidate`;
            wrapper.appendChild(idxLabel);

            container.appendChild(wrapper);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-candidate').innerText = step.candidate;
            document.getElementById('val-max').innerText = array.length ? Math.max(...array) : '—';
            document.getElementById('val-checks').innerText = step.checks || '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.candidate === -1 ? "No solution" : step.candidate;
                resVal.className = step.candidate === -1 ? 'pop-false' : 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
