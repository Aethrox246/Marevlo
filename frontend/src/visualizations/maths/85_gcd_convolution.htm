<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCD Convolution - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 220px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; 
            max-width: 900px; min-height: 110px; position: relative; 
        }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 20px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227,179,65,0.4); }
        .tile.evaluating { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 15px var(--accent-green); }
        .tile.past { opacity: 0.35; background: #161b22; border-color: var(--border-main); }

        /* PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; text-align: center; 
            font-family: monospace; min-height: 90px; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; }

        /* RESULT */
        .result-display { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 30px !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

        /* STATUS & CONTROLS */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px;}
        .controls { margin-top: 25px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        /* LEGEND */
        .legend { margin-top: 15px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 15px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 95%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Array =</label>
        <input type="text" id="arr-input" value="[2, 4, 6]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ([2,4,6])</button>
        <button onclick="loadExample(1)">Ex 2 ([1,2,3,4])</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Current pair (i ≤ j) → GCD(A[i], A[j])</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">j</span>
            <span class="info-value" id="val-j" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">A[i]</span>
            <span class="info-value" id="val-ai" style="color: var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">A[j]</span>
            <span class="info-value" id="val-aj" style="color: var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">GCD</span>
            <span class="info-value" id="val-gcd" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Sum</span>
            <span class="info-value" id="val-sum" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Sum of GCDs (i ≤ j) =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> i</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-blue)"></span> j (i≤j)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Add GCD</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [2, 4, 6];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 350];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            if (ex === 0) {
                arr = [2, 4, 6];
                document.getElementById('arr-input').value = "[2, 4, 6]";
            } else {
                arr = [1, 2, 3, 4];
                document.getElementById('arr-input').value = "[1, 2, 3, 4]";
            }
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                arr = JSON.parse(document.getElementById('arr-input').value.trim());
            } catch(e) {
                alert("Invalid array. Use format like [2, 4, 6]");
                return;
            }
            if (!Array.isArray(arr) || arr.length === 0) {
                alert("Array must be non-empty");
                return;
            }
            generateSteps();
            reset();
        }

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b !== 0) {
                let temp = b;
                b = a % b;
                a = temp;
            }
            return a;
        }

        function generateSteps() {
            steps = [];
            let n = arr.length;
            let total = 0;
            let currentSum = 0;

            steps.push({
                type: 'init',
                i: '—', j: '—', gcdVal: '—', sum: 0,
                panel: `Computing sum of GCD(A[i], A[j]) for all 0 ≤ i ≤ j < ${n}<br>Array = [${arr}]`,
                status: `n = ${n}. Starting pairwise GCD summation...`,
                log: `Array: [${arr}]\nComputing sum_{i≤j} GCD(A[i], A[j])`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n; i++) {
                for (let j = i; j < n; j++) {
                    const g = gcd(arr[i], arr[j]);
                    const oldSum = currentSum;
                    currentSum += g;

                    steps.push({
                        type: 'pair',
                        i: i,
                        j: j,
                        gcdVal: g,
                        sum: currentSum,
                        panel: `Pair (i=${i}, j=${j}): GCD(${arr[i]}, ${arr[j]}) = <b>${g}</b><br>Sum so far: ${oldSum} + ${g} = ${currentSum}`,
                        status: `GCD(${arr[i]}, ${arr[j]}) = ${g}`,
                        log: `i=${i}, j=${j} → GCD=${g}  (sum: ${oldSum} → ${currentSum})`,
                        logColor: 'var(--accent-green)'
                    });
                }
            }

            steps.push({
                type: 'final',
                i: '—', j: '—', gcdVal: '—', sum: currentSum,
                panel: `Computation complete.<br>Total sum of GCDs (i ≤ j) = <b>${currentSum}</b>`,
                status: `Final result: ${currentSum}`,
                log: `Final Sum = ${currentSum}`,
                logColor: 'var(--accent-green)',
                complete: true,
                result: currentSum
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            if (step.i !== '—') {
                // Tile for A[i]
                const w1 = document.createElement('div');
                w1.className = 'tile-unit';
                const t1 = document.createElement('div');
                t1.className = `tile ${step.type === 'pair' ? 'candidate' : 'idle'}`;
                t1.innerText = arr[step.i];
                const l1 = document.createElement('div');
                l1.className = 'tile-index';
                l1.innerText = `A[${step.i}]`;
                w1.append(t1, l1);
                container.appendChild(w1);

                // Tile for A[j]
                const w2 = document.createElement('div');
                w2.className = 'tile-unit';
                const t2 = document.createElement('div');
                t2.className = `tile ${step.type === 'pair' ? 'candidate' : 'idle'}`;
                t2.innerText = arr[step.j];
                const l2 = document.createElement('div');
                l2.className = 'tile-index';
                l2.innerText = `A[${step.j}]`;
                w2.append(t2, l2);
                container.appendChild(w2);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-i').innerText = step.i;
            document.getElementById('val-j').innerText = step.j;
            document.getElementById('val-ai').innerText = step.i !== '—' ? arr[step.i] : '—';
            document.getElementById('val-aj').innerText = step.j !== '—' ? arr[step.j] : '—';
            document.getElementById('val-gcd').innerText = step.gcdVal;
            document.getElementById('val-sum').innerText = step.sum;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.result;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.status || '';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
