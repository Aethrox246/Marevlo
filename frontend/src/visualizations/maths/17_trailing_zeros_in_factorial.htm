<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trailing Zeros in Factorial - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 160px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 820px; min-height: 110px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 62px; height: 62px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 24px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 12px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.18); box-shadow: 0 0 15px rgba(227,179,65,0.5); }
        .tile.contribution { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 15px var(--accent-green); }
        .tile.done { opacity: 0.5; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        .action-panel {
            margin-top: 30px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 22px; width: 720px; text-align: center; font-family: monospace;
            min-height: 110px; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 16px; display: flex; flex-direction: column; align-items: center; min-width: 120px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .result-display { margin-top: 18px; text-align: center; }
        #res-val { font-size: 36px; font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { color: var(--accent-green) !important; text-shadow: 0 0 18px var(--accent-green); animation: popAnim 600ms; }

        @keyframes popAnim { 0%{transform:scale(0.6)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; width: 620px; text-align: center; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 14px; height: 14px; border-radius: 3px; margin-right: 7px; }

        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 740px; max-width: 95%; height: 155px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" placeholder="25" value="25">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(5)">Ex 1 (5)</button>
        <button onclick="loadExample(10)">Ex 2 (10)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Step-by-step: Counting factors of 5 in n!</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current n</span>
            <span class="info-value" id="val-n" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Power of 5</span>
            <span class="info-value" id="val-power" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Quotient (multiples)</span>
            <span class="info-value" id="val-quot" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Add to total</span>
            <span class="info-value" id="val-add" style="color:var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Count</span>
            <span class="info-value" id="val-count" style="color:var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="font-size:18px;">Trailing zeros in n! = </span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:2px solid var(--accent-orange)"></span> Current n</div>
        <div class="legend-item"><span class="dot" style="background:#1e1030;border:2px solid var(--accent-purple)"></span> Quotient (×5^k)</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:2px solid var(--accent-green)"></span> Added to total</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputNumber = 25;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 950, 450];

        function init() { loadExample(25); }

        function loadExample(newNum) {
            inputNumber = parseInt(newNum);
            document.getElementById('num-input').value = inputNumber;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val) && val >= 0) loadExample(val);
            else alert("Please enter a valid non-negative integer.");
        }

        function generateSteps() {
            steps = [];
            let n = inputNumber;
            let count = 0;
            let power = 5;
            let stepNum = 1;

            steps.push({
                type: 'init',
                currentN: n,
                power: 5,
                quot: '—',
                add: 0,
                total: 0,
                panel: `<b>Problem:</b> How many trailing zeros in ${inputNumber}!<br><br>Trailing zeros = number of times 10 divides n!.<br>Since 10 = 2 × 5 and there are always more 2s than 5s, we only count factors of 5.`,
                status: `Starting with n = ${inputNumber}`,
                log: `n = ${inputNumber}\nWe will count factors of 5 by repeated division by 5`
            });

            if (n < 5) {
                steps.push({
                    type: 'final',
                    currentN: n,
                    power: 5,
                    quot: 0,
                    add: 0,
                    total: 0,
                    panel: `n < 5 → No multiples of 5.<br><b>Trailing zeros = 0</b>`,
                    status: `Done → 0 trailing zeros`,
                    log: `Final Result: 0`,
                    isTrue: true
                });
                return;
            }

            while (n >= 5) {
                const quot = Math.floor(n / 5);
                const prevCount = count;
                count += quot;

                steps.push({
                    type: 'divide',
                    currentN: n,
                    power: power,
                    quot: quot,
                    add: quot,
                    total: count,
                    panel: `Step ${stepNum}: Current n = <b>${n}</b><br>floor(n / ${power}) = <b>${quot}</b><br>This counts multiples of ${power} (each contributes at least one extra factor of 5)<br>Count becomes ${prevCount} + ${quot} = <b>${count}</b>`,
                    status: `Adding ${quot} from multiples of ${power}`,
                    log: `n = ${n}  →  ${n}//${power} = ${quot}  →  count += ${quot}  →  total = ${count}`
                });

                n = Math.floor(n / 5);
                power *= 5;
                stepNum++;
            }

            steps.push({
                type: 'final',
                currentN: 0,
                power: power,
                quot: '—',
                add: '—',
                total: count,
                panel: `All powers of 5 counted.<br><b>${inputNumber}! has exactly ${count} factors of 5.</b><br>Therefore, trailing zeros = <b>${count}</b>`,
                status: `Final Result: ${count} trailing zeros`,
                log: `Final Result: ${count}`,
                isTrue: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const nTile = document.createElement('div');
            nTile.className = 'tile-unit';
            const nDiv = document.createElement('div');
            nDiv.className = `tile ${step.type === 'divide' ? 'candidate' : (step.type === 'final' ? 'winning' : '')}`;
            nDiv.innerText = step.currentN;
            const nLabel = document.createElement('div');
            nLabel.className = 'tile-index';
            nLabel.innerText = 'Current n';
            nTile.append(nDiv, nLabel);
            container.appendChild(nTile);

            if (step.quot !== '—') {
                const qTile = document.createElement('div');
                qTile.className = 'tile-unit';
                const qDiv = document.createElement('div');
                qDiv.className = `tile contribution`;
                qDiv.innerText = step.quot;
                const qLabel = document.createElement('div');
                qLabel.className = 'tile-index';
                qLabel.innerText = `÷${step.power}`;
                qTile.append(qDiv, qLabel);
                container.appendChild(qTile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;

            document.getElementById('val-n').innerText = step.currentN;
            document.getElementById('val-power').innerText = step.power;
            document.getElementById('val-quot').innerText = step.quot;
            document.getElementById('val-add').innerText = step.add;
            document.getElementById('val-count').innerText = step.total;

            const resVal = document.getElementById('res-val');
            resVal.innerText = (step.type === 'final') ? step.total : '—';
            resVal.className = (step.type === 'final') ? 'pop' : '';

            document.getElementById('status-text').innerText = step.status;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    line.innerText = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
