<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nth Fibonacci - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 110px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 820px; min-height: 110px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 26px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 12px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.prev { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); }
        .tile.result { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.22); box-shadow: 0 0 18px var(--accent-green); }

        .action-panel {
            margin-top: 30px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 22px; width: 720px; text-align: center; font-family: monospace;
            min-height: 125px; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 16px; display: flex; flex-direction: column; align-items: center; min-width: 115px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .result-display { margin-top: 18px; text-align: center; }
        #res-val { font-size: 38px; font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { color: var(--accent-green) !important; text-shadow: 0 0 20px var(--accent-green); animation: popAnim 600ms; }

        @keyframes popAnim { 0%{transform:scale(0.6)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; width: 620px; text-align: center; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 14px; height: 14px; border-radius: 3px; margin-right: 7px; }

        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 740px; max-width: 95%; height: 155px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-n" value="5">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(5)">Ex 1 (n=5)</button>
        <button onclick="loadExample(3)">Ex 2 (n=3)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Iterative Fibonacci (O(n) time, O(1) space)</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Prev (F<sub>i-1</sub>)</span>
            <span class="info-value" id="val-prev" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Curr (F<sub>i</sub>)</span>
            <span class="info-value" id="val-curr" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Next</span>
            <span class="info-value" id="val-next" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">i</span>
            <span class="info-value" id="val-i" style="color:var(--text-main);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="font-size:18px;">F(n) = </span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:2px solid var(--accent-orange)"></span> Current</div>
        <div class="legend-item"><span class="dot" style="background:#1e1030;border:2px solid var(--accent-purple)"></span> Previous</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:2px solid var(--accent-green)"></span> Final Result</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentN = 5;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() { loadExample(5); }

        function loadExample(n) {
            currentN = n;
            document.getElementById('num-n').value = currentN;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-n').value);
            if (!isNaN(val) && val >= 0) {
                loadExample(val);
            } else {
                alert("Please enter a valid non-negative integer.");
            }
        }

        function generateSteps() {
            steps = [];
            let n = currentN;
            let prev = 0;
            let curr = 1;

            steps.push({
                type: 'init',
                prev: 0,
                curr: 1,
                i: 0,
                n: n,
                panel: `Compute <b>F(${n})</b> using Iterative DP.<br>Initialize: prev = F(0) = 0, curr = F(1) = 1`,
                statusText: `n = ${n}, prev=0, curr=1`,
                log: `n = ${n}\nprev = 0 (F0)\ncurr = 1 (F1)`
            });

            if (n === 0) {
                steps.push({
                    type: 'final',
                    prev: 0,
                    curr: 0,
                    i: 0,
                    n: n,
                    panel: `Special case n=0 → F(0) = 0`,
                    statusText: `Result = 0`,
                    log: `n=0 → return 0`,
                    isTrue: true
                });
                return;
            }
            if (n === 1) {
                steps.push({
                    type: 'final',
                    prev: 0,
                    curr: 1,
                    i: 1,
                    n: n,
                    panel: `Special case n=1 → F(1) = 1`,
                    statusText: `Result = 1`,
                    log: `n=1 → return 1`,
                    isTrue: true
                });
                return;
            }

            for (let i = 2; i <= n; i++) {
                let next = prev + curr;
                let oldPrev = prev;
                let oldCurr = curr;

                steps.push({
                    type: 'update',
                    prev: oldPrev,
                    curr: oldCurr,
                    next: next,
                    i: i,
                    n: n,
                    panel: `Iteration i=${i}:<br>next = ${oldPrev} + ${oldCurr} = ${next}`,
                    statusText: `i = ${i}, next = ${next}`,
                    log: `i=${i} → next = ${oldPrev} + ${oldCurr} = ${next}`
                });

                prev = oldCurr;
                curr = next;
            }

            steps.push({
                type: 'final',
                prev: prev,
                curr: curr,
                i: n,
                n: n,
                panel: `Loop finished.<br><b>F(${n}) = ${curr}</b>`,
                statusText: `Done → F(${n}) = ${curr}`,
                log: `Final Result: ${curr}`,
                isTrue: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Prev tile
            const tilePrev = document.createElement('div');
            tilePrev.className = 'tile-unit';
            const divPrev = document.createElement('div');
            divPrev.className = `tile ${step.type === 'final' ? 'result' : 'prev'}`;
            divPrev.innerText = step.prev;
            const labelPrev = document.createElement('div');
            labelPrev.className = 'tile-index';
            labelPrev.innerText = 'prev';
            tilePrev.append(divPrev, labelPrev);
            container.appendChild(tilePrev);

            // Curr tile
            const tileCurr = document.createElement('div');
            tileCurr.className = 'tile-unit';
            const divCurr = document.createElement('div');
            divCurr.className = `tile ${step.type === 'final' ? 'result' : 'candidate'}`;
            divCurr.innerText = step.curr;
            const labelCurr = document.createElement('div');
            labelCurr.className = 'tile-index';
            labelCurr.innerText = 'curr';
            tileCurr.append(divCurr, labelCurr);
            container.appendChild(tileCurr);

            // Next tile (if available)
            if (step.next !== undefined) {
                const tileNext = document.createElement('div');
                tileNext.className = 'tile-unit';
                const divNext = document.createElement('div');
                divNext.className = `tile candidate`;
                divNext.innerText = step.next;
                const labelNext = document.createElement('div');
                labelNext.className = 'tile-index';
                labelNext.innerText = 'next';
                tileNext.append(divNext, labelNext);
                container.appendChild(tileNext);
            }

            document.getElementById('main-panel').innerHTML = step.panel;

            document.getElementById('val-prev').innerText = step.prev;
            document.getElementById('val-curr').innerText = step.curr;
            document.getElementById('val-next').innerText = step.next !== undefined ? step.next : '—';
            document.getElementById('val-i').innerText = step.i;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.curr;
            if (step.type === 'final') resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    line.innerText = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
