<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Exponentiation - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 110px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 820px; min-height: 120px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 26px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 12px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.base { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); }
        .tile.result { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.22); box-shadow: 0 0 18px var(--accent-green); }

        .action-panel {
            margin-top: 30px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 22px; width: 720px; text-align: center; font-family: monospace;
            min-height: 130px; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 16px; display: flex; flex-direction: column; align-items: center; min-width: 115px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .result-display { margin-top: 18px; text-align: center; }
        #res-val { font-size: 38px; font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { color: var(--accent-green) !important; text-shadow: 0 0 20px var(--accent-green); animation: popAnim 600ms; }

        @keyframes popAnim { 0%{transform:scale(0.6)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; width: 620px; text-align: center; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 14px; height: 14px; border-radius: 3px; margin-right: 7px; }

        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 740px; max-width: 95%; height: 155px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">a =</label>
        <input type="number" id="num-a" value="2">
        <label class="ui-label">b =</label>
        <input type="number" id="num-b" value="3">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(2,3)">Ex 1 (2^3)</button>
        <button onclick="loadExample(5,0)">Ex 2 (5^0)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Binary Exponentiation: Processing bits of exponent</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Base (a)</span>
            <span class="info-value" id="val-a" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Base</span>
            <span class="info-value" id="val-current" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Exponent (b)</span>
            <span class="info-value" id="val-exp" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Result</span>
            <span class="info-value" id="val-result" style="color:var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="font-size:18px;">a^b = </span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:2px solid var(--accent-orange)"></span> Current Step</div>
        <div class="legend-item"><span class="dot" style="background:#1e1030;border:2px solid var(--accent-purple)"></span> Squaring Base</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:2px solid var(--accent-green)"></span> Final Result</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let numA = 2, numB = 3;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() { loadExample(2, 3); }

        function loadExample(a, b) {
            numA = a; numB = b;
            document.getElementById('num-a').value = numA;
            document.getElementById('num-b').value = numB;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const a = parseInt(document.getElementById('num-a').value);
            const b = parseInt(document.getElementById('num-b').value);
            if (!isNaN(a) && !isNaN(b) && b >= 0) {
                loadExample(a, b);
            } else {
                alert("Please enter valid non-negative integers.");
            }
        }

        function generateSteps() {
            steps = [];
            let a = numA, b = numB;
            let result = 1;
            let base = a;
            let exp = b;
            let stepNum = 1;

            steps.push({
                type: 'init',
                a: a, b: b, result: 1, base: a, exp: b,
                panel: `Compute <b>${a}<sup>${b}</sup></b> using Fast Exponentiation.<br>Process binary bits of exponent for O(log b) efficiency.`,
                status: `Starting: a=${a}, b=${b}`,
                log: `a = ${a}\nb = ${b} (binary ${b.toString(2)})\nresult = 1`
            });

            while (exp > 0) {
                let isOdd = (exp & 1) === 1;
                let prevResult = result;

                steps.push({
                    type: 'check',
                    a: a, b: b, result: result, base: base, exp: exp,
                    panel: `Step ${stepNum}: Exponent = <b>${exp}</b> (binary ends with ${isOdd ? '1' : '0'})<br>Current base = <b>${base}</b>`,
                    status: isOdd ? `Bit is 1 → Multiply result by base` : `Bit is 0 → Skip multiplication`,
                    log: `exp = ${exp} | LSB = ${isOdd ? '1' : '0'}`
                });

                if (isOdd) {
                    result = result * base;
                    steps.push({
                        type: 'multiply',
                        a: a, b: b, result: result, base: base, exp: exp,
                        panel: `Multiply: <b>${prevResult} * ${base} = ${result}</b>`,
                        status: `Result updated to ${result}`,
                        log: `result = ${prevResult} * ${base} = ${result}`
                    });
                }

                let prevBase = base;
                base = base * base;
                exp = Math.floor(exp / 2);

                steps.push({
                    type: 'square',
                    a: a, b: b, result: result, base: base, exp: exp,
                    panel: `Square base: <b>${prevBase}² = ${base}</b><br>Exponent right-shift: <b>${exp}</b>`,
                    status: `Base squared, exponent halved`,
                    log: `base = ${prevBase} * ${prevBase} = ${base} | exp >>= 1 → ${exp}`
                });

                stepNum++;
            }

            steps.push({
                type: 'final',
                a: a, b: b, result: result, base: base, exp: 0,
                panel: `Computation complete.<br><b>${a}<sup>${b}</sup> = ${result}</b>`,
                status: `Final Result: ${result}`,
                log: `Final Result: ${result}`,
                isTrue: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Tile for base
            const tileBase = document.createElement('div');
            tileBase.className = 'tile-unit';
            const divBase = document.createElement('div');
            divBase.className = `tile ${step.type === 'square' ? 'base' : 'candidate'}`;
            divBase.innerText = step.base;
            const labelBase = document.createElement('div');
            labelBase.className = 'tile-index';
            labelBase.innerText = 'base';
            tileBase.append(divBase, labelBase);
            container.appendChild(tileBase);

            // Tile for result
            const tileResult = document.createElement('div');
            tileResult.className = 'tile-unit';
            const divResult = document.createElement('div');
            divResult.className = `tile ${step.type === 'final' ? 'result' : 'candidate'}`;
            divResult.innerText = step.result;
            const labelResult = document.createElement('div');
            labelResult.className = 'tile-index';
            labelResult.innerText = 'result';
            tileResult.append(divResult, labelResult);
            container.appendChild(tileResult);

            // Exponent
            if (step.exp !== undefined) {
                const tileExp = document.createElement('div');
                tileExp.className = 'tile-unit';
                const divExp = document.createElement('div');
                divExp.className = `tile candidate`;
                divExp.innerText = step.exp;
                const labelExp = document.createElement('div');
                labelExp.className = 'tile-index';
                labelExp.innerText = 'exp';
                tileExp.append(divExp, labelExp);
                container.appendChild(tileExp);
            }

            document.getElementById('main-panel').innerHTML = step.panel;

            document.getElementById('val-a').innerText = step.a;
            document.getElementById('val-current').innerText = step.base;
            document.getElementById('val-exp').innerText = step.exp;
            document.getElementById('val-result').innerText = step.result;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.result;
            if (step.type === 'final') resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.status;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    line.innerText = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
