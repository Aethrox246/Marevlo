<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor Sum - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 80px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .equation-box {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: 600;
            background: var(--bg-surface);
            padding: 14px 28px;
            border-radius: 8px;
            border: 1px solid var(--border-main);
        }

        .terms-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-width: 920px;
            min-height: 160px;
        }

        .term-tile {
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 12px 18px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            min-width: 110px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .term-tile.candidate { 
            border-color: var(--accent-orange); 
            color: var(--accent-orange); 
            transform: scale(1.08); 
            box-shadow: 0 0 15px rgba(227,179,65,0.5); 
        }
        .term-tile.winning { 
            border-color: var(--accent-green); 
            color: var(--accent-green); 
            transform: scale(1.15); 
            box-shadow: 0 0 18px var(--accent-green); 
        }

        /* PANEL */
        .action-panel {
            margin-top: 30px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 16px 24px;
            width: 740px;
            text-align: center;
            font-family: monospace;
            min-height: 100px;
            font-size: 15px;
            line-height: 1.6;
        }

        /* INFO PANEL */
        .info-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info-cell {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 10px 18px;
            min-width: 130px;
            text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        /* RESULT */
        .result-display {
            margin-top: 20px;
            text-align: center;
        }
        #res-val {
            font-size: 24px;
            font-family: monospace;
            font-weight: bold;
            transition: all 0.4s;
        }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 30px !important; }
        .pop-false { animation: popAnim 500ms ease; color: var(--accent-red) !important; font-size: 30px !important; }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; }
        .controls {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: var(--text-dim);
        }

        .log-panel {
            margin-top: 20px;
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 14px 18px;
            width: 740px;
            max-width: 95%;
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">a =</label>
        <input type="number" id="a-input" value="2">
        <label class="ui-label">b =</label>
        <input type="number" id="b-input" value="3">
        <label class="ui-label">m =</label>
        <input type="number" id="m-input" value="5">
        <label class="ui-label">n =</label>
        <input type="number" id="n-input" value="4">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(2,3,5,4)">Ex 1 (a=2,b=3,m=5,n=4 → 3)</button>
        <button onclick="loadExample(1,0,2,5)">Ex 2 (a=1,b=0,m=2,n=5 → 4)</button>
    </div>

    <div class="visual-container">
        <div class="equation-box" id="equation-display">Σ floor((2*i + 3)/5) for i=0 to 3</div>
        <div class="terms-wrapper" id="terms-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">a*i + b</span>
            <span class="info-value" id="val-num" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">floor(/m)</span>
            <span class="info-value" id="val-floor" style="color:var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Sum</span>
            <span class="info-value" id="val-sum" style="color:var(--text-main);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Final Floor Sum =</span><br>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px; font-size:11px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#2a1600;border:1px solid var(--accent-orange);border-radius:3px;"></span> Current i</div>
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#0f2a1a;border:1px solid var(--accent-green);border-radius:3px;"></span> Term Added</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let a = 2, b = 3, m = 5, n = 4;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            loadExample(2, 3, 5, 4);
        }

        function loadExample(newA, newB, newM, newN) {
            a = parseInt(newA);
            b = parseInt(newB);
            m = parseInt(newM);
            n = parseInt(newN);
            document.getElementById('a-input').value = a;
            document.getElementById('b-input').value = b;
            document.getElementById('m-input').value = m;
            document.getElementById('n-input').value = n;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const na = parseInt(document.getElementById('a-input').value);
            const nb = parseInt(document.getElementById('b-input').value);
            const nm = parseInt(document.getElementById('m-input').value);
            const nn = parseInt(document.getElementById('n-input').value);
            if (!isNaN(na) && !isNaN(nb) && !isNaN(nm) && !isNaN(nn) && nm > 0) {
                loadExample(na, nb, nm, nn);
            } else {
                alert("Please enter valid integers (m > 0).");
            }
        }

        function generateSteps() {
            steps = [];
            document.getElementById('equation-display').innerText = `Σ floor((${a}*i + ${b}) / ${m}) for i=0 to ${n-1}`;

            let currentSum = 0;

            // Init step
            steps.push({
                type: 'init',
                i: '—',
                num: '—',
                floorVal: '—',
                sum: 0,
                panel: `Compute sum of floor((${a}*i + ${b}) / ${m}) for i = 0 to ${n-1}`,
                statusText: `Starting floor sum calculation...`,
                log: `a=${a}, b=${b}, m=${m}, n=${n}\nInitialize sum = 0`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n; i++) {
                const numerator = a * i + b;
                const floorVal = Math.floor(numerator / m);
                currentSum += floorVal;

                steps.push({
                    type: 'term',
                    i: i,
                    num: numerator,
                    floorVal: floorVal,
                    sum: currentSum,
                    panel: `i = <b>${i}</b><br>numerator = ${a}*${i} + ${b} = ${numerator}<br>floor(${numerator}/${m}) = <b>${floorVal}</b>`,
                    statusText: `i=${i} → floor = ${floorVal}, sum = ${currentSum}`,
                    log: `i=${i} : (${a}*${i} + ${b}) = ${numerator}, floor(/${m}) = ${floorVal}, running sum = ${currentSum}`,
                    logColor: 'var(--accent-orange)'
                });
            }

            // Final step
            steps.push({
                type: 'final',
                i: '—',
                num: '—',
                floorVal: '—',
                sum: currentSum,
                panel: `Computation complete.<br>Final floor sum = <b>${currentSum}</b>`,
                statusText: `Done. Total sum = ${currentSum}`,
                log: `Final Result: ${currentSum}`,
                logColor: 'var(--accent-green)',
                isTrue: true,
                result: currentSum
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('terms-container');
            container.innerHTML = '';

            // Render terms up to current step
            for (let i = 0; i < idx; i++) {
                const s = steps[i + 1]; // skip init
                if (!s || s.type !== 'term') continue;

                const tile = document.createElement('div');
                tile.className = `term-tile ${i === idx - 1 ? 'candidate' : ''}`;
                tile.innerHTML = `i=${s.i}<br>${s.floorVal}`;
                container.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-num').innerText = step.num !== undefined ? step.num : '—';
            document.getElementById('val-floor').innerText = step.floorVal !== undefined ? step.floorVal : '—';
            document.getElementById('val-sum').innerText = step.sum !== undefined ? step.sum : '—';

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.result;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
