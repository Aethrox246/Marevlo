<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Attack Simulation - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 300px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; 
            max-width: 920px; min-height: 110px; position: relative;
        }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
        .tile {
            min-width: 62px; height: 62px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 14px rgba(227,179,65,0.5); z-index: 2; }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.1); box-shadow: 0 0 12px var(--accent-green); z-index: 3; }
        .tile.failed { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(1.12); box-shadow: 0 0 12px var(--accent-red); }
        .tile.done { opacity: 0.55; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 760px; text-align: center; 
            font-family: monospace; min-height: 100px; line-height: 1.55;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 16px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 11px 20px; display: flex; flex-direction: column; align-items: center; 
            min-width: 135px; gap: 6px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        /* RESULT */
        .result-display { margin-top: 16px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 23px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 420ms ease; color: var(--accent-green) !important; font-size: 29px !important; text-shadow: 0 0 16px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.5em; text-align: center; width: 720px; }

        /* CONTROLS */
        .controls { margin-top: 30px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 18px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 13px; height: 13px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 22px; width: 780px; max-width: 95%; height: 150px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="text" id="n-input" value="15">
        <label class="ui-label">e =</label>
        <input type="text" id="e-input" value="3" style="width:80px;">
        <label class="ui-label">c =</label>
        <input type="text" id="c-input" value="11" style="width:80px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(15,3,11)">Ex 1 (15,3,11)</button>
        <button onclick="loadExample(21,5,10)">Ex 2 (21,5,10)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">RSA Attack: Factoring n → Finding d → Decrypting</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i (divisor)</span>
            <span class="info-value" id="val-i" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">p, q</span>
            <span class="info-value" id="val-pq" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">φ(n)</span>
            <span class="info-value" id="val-phi" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Private d</span>
            <span class="info-value" id="val-d" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Decrypted Message m =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:5px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Testing Divisor</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Factor Found</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red); border:1px solid var(--accent-red)"></span> Not Divisible</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let n = 15;
        let e = 3;
        let c = 11;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(15, 3, 11); }

        function loadExample(newN, newE, newC) {
            n = parseInt(newN);
            e = parseInt(newE);
            c = parseInt(newC);
            document.getElementById('n-input').value = n;
            document.getElementById('e-input').value = e;
            document.getElementById('c-input').value = c;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const nVal = parseInt(document.getElementById('n-input').value);
            const eVal = parseInt(document.getElementById('e-input').value);
            const cVal = parseInt(document.getElementById('c-input').value);
            if (!isNaN(nVal) && !isNaN(eVal) && !isNaN(cVal) && nVal > 1) {
                n = nVal;
                e = eVal;
                c = cVal;
                generateSteps();
                reset();
            } else {
                alert("Please enter valid n, e, c (n > 1)");
            }
        }

        function generateSteps() {
            steps = [];
            let factorsFound = false;
            let p = -1, q = -1;

            // INIT
            steps.push({
                type: 'init',
                panel: `RSA Attack Simulation<br>n = <b>${n}</b>, e = <b>${e}</b>, c = <b>${c}</b><br>Factoring n using brute force trial division`,
                statusText: `Starting brute force factoring of n=${n}`,
                log: `n=${n}, e=${e}, c=${c}\nTrying to factor n...`,
                logColor: 'var(--text-dim)',
                i: '—',
                pq: '—',
                phi: '—',
                d: '—',
                m: '—'
            });

            // Brute force factoring
            let limit = Math.floor(Math.sqrt(n)) + 1;
            for (let i = 2; i <= limit; i++) {
                if (n % i === 0) {
                    p = i;
                    q = n / i;
                    factorsFound = true;

                    steps.push({
                        type: 'factor',
                        panel: `Found factors!<br>i = <b>${i}</b> divides n → p = ${p}, q = ${q}`,
                        statusText: `Factor found: p=${p}, q=${q}`,
                        log: `i=${i} divides ${n} → p=${p}, q=${q}`,
                        logColor: 'var(--accent-green)',
                        i: i,
                        pq: `${p}, ${q}`,
                        phi: '—',
                        d: '—',
                        m: '—'
                    });
                    break;
                } else {
                    steps.push({
                        type: 'test',
                        panel: `Testing divisor i = <b>${i}</b> (not divisible)`,
                        statusText: `Testing i=${i}`,
                        log: `i=${i} does not divide ${n}`,
                        logColor: 'var(--accent-red)',
                        i: i,
                        pq: '—',
                        phi: '—',
                        d: '—',
                        m: '—'
                    });
                }
            }

            if (!factorsFound) {
                steps.push({
                    type: 'final',
                    panel: `<span style="color:var(--accent-red)">Could not factor n = ${n} (prime or too large for brute force)</span>`,
                    statusText: `Factoring failed`,
                    log: `No factor found up to √n → n is likely prime`,
                    logColor: 'var(--accent-red)',
                    i: '—',
                    pq: '—',
                    phi: '—',
                    d: '—',
                    m: '—'
                });
                return;
            }

            // Compute φ(n)
            const phi = (p - 1) * (q - 1);
            steps.push({
                type: 'phi',
                panel: `Compute Euler's totient φ(n) = (p-1)(q-1) = <b>${phi}</b>`,
                statusText: `φ(n) = ${phi}`,
                log: `φ(n) = (${p}-1) * (${q}-1) = ${phi}`,
                logColor: 'var(--accent-blue)',
                i: '—',
                pq: `${p}, ${q}`,
                phi: phi,
                d: '—',
                m: '—'
            });

            // Compute d = modular inverse of e mod φ(n)
            // Simple brute force inverse for visualization (since φ is small in examples)
            let d = -1;
            for (let i = 1; i < phi; i++) {
                if ((e * i) % phi === 1) {
                    d = i;
                    break;
                }
            }

            steps.push({
                type: 'inverse',
                panel: `Find private exponent d such that e * d ≡ 1 (mod φ(n))<br>d = <b>${d}</b>`,
                statusText: `d = ${d}`,
                log: `Found d = ${d} where ${e} * ${d} ≡ 1 mod ${phi}`,
                logColor: 'var(--accent-green)',
                i: '—',
                pq: `${p}, ${q}`,
                phi: phi,
                d: d,
                m: '—'
            });

            // Decrypt m = c^d mod n
            let m = 1;
            let base = c % n;
            let exp = d;
            while (exp > 0) {
                if (exp % 2 === 1) {
                    m = (m * base) % n;
                }
                base = (base * base) % n;
                exp = Math.floor(exp / 2);
            }

            steps.push({
                type: 'decrypt',
                panel: `Decrypt ciphertext: m = c<sup>d</sup> mod n = <b>${m}</b>`,
                statusText: `Decrypted m = ${m}`,
                log: `m = pow(${c}, ${d}, ${n}) = ${m}`,
                logColor: 'var(--accent-green)',
                i: '—',
                pq: `${p}, ${q}`,
                phi: phi,
                d: d,
                m: m
            });

            // FINAL
            steps.push({
                type: 'final',
                panel: `RSA Attack Successful!<br>p = ${p}, q = ${q}, d = ${d}, decrypted message = <b>${m}</b>`,
                statusText: `Attack complete`,
                log: `Final result: p=${p}, q=${q}, d=${d}, m=${m}`,
                logColor: 'var(--accent-green)',
                bold: true,
                i: '—',
                pq: `${p}, ${q}`,
                phi: phi,
                d: d,
                m: m
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show n as main tile
            const wrapper = document.createElement('div');
            wrapper.className = 'tile-unit';

            const tile = document.createElement('div');
            tile.className = `tile ${step.type === 'final' ? 'winning' : (step.type === 'factor' ? 'winning' : 'candidate')}`;
            tile.innerText = n;

            const idxLabel = document.createElement('div');
            idxLabel.className = 'tile-index';
            idxLabel.innerText = `n = ${n}`;

            wrapper.append(tile, idxLabel);
            container.appendChild(wrapper);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i || '—';
            document.getElementById('val-pq').innerText = step.pq || '—';
            document.getElementById('val-phi').innerText = step.phi || '—';
            document.getElementById('val-d').innerText = step.d || '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.m !== undefined ? step.m : '—';
            if (step.type === 'final') {
                resVal.className = 'pop';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
