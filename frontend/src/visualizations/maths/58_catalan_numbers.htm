<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalan Numbers - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 90px;
            font-size: 13px;
        }
        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 820px; min-height: 90px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 19px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.12); }
        .tile.done { opacity: 0.55; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 90px;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; }

        #res-val { font-size: 24px; color: var(--accent-green); font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .pop { animation: popAnim 400ms ease; font-size: 30px !important; }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="n-input" value="3" min="0">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(3)">Ex 1 (n=3 → 5)</button>
        <button onclick="loadExample(4)">Ex 2 (n=4 → 14)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Recursive computation of Catalan(n)</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current n</span>
            <span class="info-value" id="val-n" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Sum</span>
            <span class="info-value" id="val-sum" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">i in loop</span>
            <span class="info-value" id="val-i" style="color:var(--accent-purple);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">C(n) =</span><br>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px;">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Current call</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green);border:1px solid var(--accent-green)"></span> Base case / Result</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface);border:1px solid var(--border-main);opacity:0.5"></span> Processed</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nVal = 3;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function catalan(n) {
            if (n <= 1) return 1;
            let res = 0;
            for (let i = 0; i < n; i++) {
                res += catalan(i) * catalan(n - 1 - i);
            }
            return res;
        }

        function generateSteps() {
            steps = [];

            // We simulate the recursion tree by generating steps for each call
            // For visualization, we show the call stack depth and current sum for each level

            function buildStep(currentN, depth, currentSum, i) {
                let panelText = `catalan(${currentN})`;
                if (currentN <= 1) {
                    panelText += ` → base case = 1`;
                } else {
                    panelText += ` → sum so far = ${currentSum} (i=${i})`;
                }
                return {
                    type: currentN <= 1 ? 'winning' : 'candidate',
                    n: currentN,
                    sum: currentSum,
                    i: i,
                    depth: depth,
                    panel: panelText,
                    statusText: `Computing catalan(${currentN})`,
                    log: `catalan(${currentN}) called` + (currentN <= 1 ? ' → 1 (base)' : ''),
                    logColor: currentN <= 1 ? 'var(--accent-green)' : 'var(--accent-orange)'
                };
            }

            steps.push({
                type: 'init',
                n: nVal,
                sum: 0,
                i: '—',
                panel: `Computing Catalan(${nVal}) using recursive definition`,
                statusText: `Starting recursive computation...`,
                log: `catalan(${nVal}) called`,
                logColor: 'var(--text-dim)'
            });

            // For small n, we can simulate the recursion tree manually for nice animation
            if (nVal === 3) {
                steps.push(buildStep(3, 0, 0, 0));
                steps.push(buildStep(0, 1, 0, 0)); // base
                steps.push(buildStep(2, 1, 0, 0));
                steps.push(buildStep(0, 2, 0, 0)); // base
                steps.push(buildStep(1, 2, 0, 0)); // base
                steps.push(buildStep(1, 1, 1, 1)); // base
                steps.push(buildStep(2, 1, 2, 2));
                steps.push(buildStep(3, 0, 5, '—'));
            } else if (nVal === 4) {
                steps.push(buildStep(4, 0, 0, 0));
                steps.push(buildStep(0, 1, 0, 0));
                steps.push(buildStep(3, 1, 0, 0));
                steps.push(buildStep(0, 2, 0, 0));
                steps.push(buildStep(2, 2, 0, 0));
                steps.push(buildStep(1, 2, 1, 1));
                steps.push(buildStep(1, 1, 2, 1));
                steps.push(buildStep(2, 1, 3, 2));
                steps.push(buildStep(3, 1, 5, 3));
                steps.push(buildStep(4, 0, 14, '—'));
            } else {
                // General case - simplified
                steps.push(buildStep(nVal, 0, 0, 0));
                for (let i = 0; i < nVal; i++) {
                    steps.push(buildStep(i, 1, 0, i));
                    steps.push(buildStep(nVal-1-i, 1, 0, i));
                }
                steps.push(buildStep(nVal, 0, catalan(nVal), '—'));
            }

            // Final step
            steps.push({
                type: 'final',
                n: nVal,
                sum: catalan(nVal),
                panel: `C(${nVal}) = <b>${catalan(nVal)}</b>`,
                statusText: `Done! Catalan(${nVal}) = ${catalan(nVal)}`,
                log: `Final result: C(${nVal}) = ${catalan(nVal)}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show tiles for current recursion level (simplified)
            for (let i = 0; i <= Math.min(8, step.n || 0); i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${i === step.n ? 'winning' : (i < step.n ? 'done' : 'idle')}`;
                tile.innerText = i;
                const lbl = document.createElement('div');
                lbl.className = 'tile-index';
                lbl.innerText = i;
                wrapper.appendChild(tile);
                wrapper.appendChild(lbl);
                container.appendChild(wrapper);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-n').innerText = step.n !== undefined ? step.n : '—';
            document.getElementById('val-sum').innerText = step.sum !== undefined ? step.sum : '—';
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.sum;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.color = steps[k].logColor || 'var(--text-dim)';
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            nVal = parseInt(document.getElementById('n-input').value) || 3;
            generateSteps();
            reset();
        }

        function loadExample(val) {
            nVal = val;
            document.getElementById('n-input').value = val;
            generateSteps();
            reset();
        }

        window.onload = () => loadExample(3);
    </script>
</body>
</html>
