<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCD of Array - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 180px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 920px; min-height: 130px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 19px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.current { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.success { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 12px var(--accent-green); z-index: 3; }
        .tile.past { opacity: 0.35; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 22px; width: 760px; text-align: center; font-family: monospace; min-height: 92px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        /* RESULT */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 28px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* STATUS */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 720px;}

        /* CONTROLS */
        .controls { margin-top: 26px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 14px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 760px; max-width: 92%; height: 150px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Array =</label>
        <input type="text" id="arr-input" value="[12, 18, 24]" placeholder="[12,18,24]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[12,18,24]')">Ex 1 ([12,18,24])</button>
        <button onclick="loadExample('[7,14,21,35]')">Ex 2 ([7,14,21,35])</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Pairwise GCD computation: gcd(gcd(gcd(...), next))</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Running GCD</span>
            <span class="info-value" id="val-current" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Next Element</span>
            <span class="info-value" id="val-next" style="color: var(--accent-orange);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Final GCD =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-purple)"></span> Running GCD</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Next Element</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Final GCD</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let array = [12, 18, 24];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            loadExample('[12,18,24]');
        }

        function loadExample(arrStr) {
            try {
                array = JSON.parse(arrStr);
                if (!Array.isArray(array)) array = [];
            } catch(e) {
                array = [12,18,24];
            }
            document.getElementById('arr-input').value = JSON.stringify(array);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('arr-input').value.trim();
            if (val) {
                loadExample(val);
            } else {
                alert("Please enter array like [12,18,24]");
            }
        }

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b !== 0) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function generateSteps() {
            steps = [];
            if (array.length === 0) {
                steps.push({
                    type: 'final',
                    current: 0,
                    next: '—',
                    panel: 'Empty array',
                    statusText: 'Empty array → GCD undefined',
                    log: 'Empty array',
                    logColor: 'var(--accent-red)'
                });
                return;
            }

            let current = array[0];

            // STEP 0: INIT
            steps.push({
                type: 'init',
                current: current,
                next: array[1] || '—',
                panel: `Computing GCD of array <b>${JSON.stringify(array)}</b><br>Start with result = <b>${current}</b>`,
                statusText: `Initialize result = ${current}`,
                log: `Array: ${JSON.stringify(array)}\nStart with GCD = ${current}`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 1; i < array.length; i++) {
                let nextVal = array[i];

                // Process next element
                steps.push({
                    type: 'process',
                    current: current,
                    next: nextVal,
                    panel: `Process next element <b>${nextVal}</b><br>Compute gcd(<b>${current}</b>, <b>${nextVal}</b>)`,
                    statusText: `Computing gcd(${current}, ${nextVal})`,
                    log: `\ngcd(${current}, ${nextVal})`,
                    logColor: 'var(--accent-orange)'
                });

                // Euclidean steps for this GCD
                let a = Math.abs(current);
                let b = Math.abs(nextVal);
                while (b !== 0) {
                    let remainder = a % b;
                    steps.push({
                        type: 'euclid',
                        current: current,
                        next: nextVal,
                        panel: `Euclidean step: ${a} mod ${b} = <b>${remainder}</b>`,
                        statusText: `Step: ${a} % ${b} = ${remainder}`,
                        log: `  ${a} % ${b} = ${remainder}`,
                        logColor: 'var(--accent-blue)'
                    });
                    a = b;
                    b = remainder;
                }

                current = a; // new GCD

                steps.push({
                    type: 'update',
                    current: current,
                    next: nextVal,
                    panel: `Updated running GCD = <b>${current}</b>`,
                    statusText: `New GCD = ${current}`,
                    log: `→ Updated GCD = ${current}`,
                    logColor: 'var(--accent-green)'
                });
            }

            // FINAL STEP
            steps.push({
                type: 'final',
                current: current,
                next: '—',
                panel: `Computation complete.<br>Final GCD of the array is <b>${current}</b>`,
                complete: true,
                statusText: `Final GCD = ${current}`,
                log: `\nFinal GCD = ${current}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Array tiles
            array.forEach((num, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile ${step.current === num && step.type !== 'final' ? 'current' : ''}`;
                tile.innerText = num;
                wrapper.appendChild(tile);

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                wrapper.appendChild(idxLabel);

                container.appendChild(wrapper);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-current').innerText = step.current;
            document.getElementById('val-next').innerText = step.next !== undefined ? step.next : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.current;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
