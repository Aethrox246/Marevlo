<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smallest Prime Factor Sieve - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 100px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; text-align: center; }
        .tiles-wrapper { 
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; 
            max-width: 960px; min-height: 150px; margin: 0 auto;
        }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 600; font-family: monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
        }
        .tile-index { font-size: 11px; color: var(--text-dim); }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); }
        .tile.prime { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 12px var(--accent-green); }
        .tile.marked { background: #2a0d0d; border-color: var(--accent-purple); color: var(--accent-purple); }
        .tile.past { opacity: 0.4; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; width: 780px; min-height: 98px;
            font-family: monospace; font-size: 15px; line-height: 1.5; text-align: center;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 16px; min-width: 120px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .result-display { 
            margin-top: 16px; font-size: 21px; font-family: monospace; 
            color: var(--accent-green); font-weight: bold;
        }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); min-height: 22px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 780px; max-width: 96%; height: 165px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="n-input" value="10">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(10)">Example 1 (n=10)</button>
        <button onclick="loadExample(15)">Example 2 (n=15)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Modified Sieve of Eratosthenes — Smallest Prime Factor (SPF) Array</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to start the visualization...</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">SPF[i]</span>
            <span class="info-value" id="val-spf" style="color:var(--accent-green)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Marked By</span>
            <span class="info-value" id="val-marked" style="color:var(--accent-purple)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">SPF Array will appear here</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px; font-size:12px">Speed:</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Processing i</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:1px solid var(--accent-green)"></span> Prime</div>
        <div class="legend-item"><span class="dot" style="background:#2a0d0d;border:1px solid var(--accent-purple)"></span> Marked</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let n = 10;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function loadExample(newN) {
            n = parseInt(newN);
            document.getElementById('n-input').value = n;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('n-input').value);
            if (val >= 2) loadExample(val);
            else alert("Please enter n ≥ 2");
        }

        function generateSteps() {
            steps = [];
            let spf = new Array(n + 1).fill(0);   // spf[0] = 0, spf[1] = 0 (as per your requirement)

            steps.push({
                type: 'init',
                i: 0,
                spfVal: 0,
                panel: `Smallest Prime Factor Sieve for n = <b>${n}</b><br>spf[0] = 0, spf[1] = 0`,
                statusText: `Starting SPF Sieve for n=${n}`,
                log: `n = ${n}\nspf[0] = 0, spf[1] = 0\nStarting sieve...`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 2; i <= n; i++) {
                if (spf[i] === 0) {  // i is prime
                    spf[i] = i;
                    steps.push({
                        type: 'prime',
                        i: i,
                        spfVal: i,
                        panel: `Found prime <b>${i}</b><br>Set spf[${i}] = ${i}`,
                        statusText: `${i} is prime`,
                        log: `i = ${i} → Prime\nspf[${i}] = ${i}`,
                        logColor: 'var(--accent-green)'
                    });
                }

                // Mark multiples starting from i*i
                if (spf[i] === i) {
                    for (let j = i * i; j <= n; j += i) {
                        if (spf[j] === 0) {
                            spf[j] = i;
                            steps.push({
                                type: 'mark',
                                i: j,
                                spfVal: i,
                                panel: `Marking <b>${j}</b> with smallest prime factor <b>${i}</b>`,
                                statusText: `${j} ← SPF = ${i}`,
                                log: `Marked spf[${j}] = ${i} (multiple of prime ${i})`,
                                logColor: 'var(--accent-purple)'
                            });
                        }
                    }
                }
            }

            // Final step with exact array as requested
            let spfStr = '[' + spf.join(', ') + ']';
            steps.push({
                type: 'final',
                i: n,
                spfVal: spf[n],
                panel: `Sieve Complete!<br>Final SPF Array:<br><code>${spfStr}</code>`,
                complete: true,
                statusText: `SPF array computed successfully`,
                log: `\nFinal SPF Array:\n${spfStr}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const maxShow = Math.min(n, 25);
            for (let i = 0; i <= maxShow; i++) {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile`;
                if (step.i === i) tile.classList.add(step.type === 'prime' ? 'prime' : 'candidate');
                if (step.type === 'mark' && step.i === i) tile.classList.add('marked');
                tile.textContent = i;
                unit.appendChild(tile);

                const label = document.createElement('div');
                label.className = 'tile-index';
                label.textContent = `spf[${i}]`;
                unit.appendChild(label);

                container.appendChild(unit);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').textContent = step.i;
            document.getElementById('val-spf').textContent = step.spfVal || '—';
            document.getElementById('val-marked').textContent = (step.type === 'mark' || step.type === 'prime') ? step.spfVal : '—';

            const res = document.getElementById('res-val');
            if (step.complete) {
                res.innerHTML = `<b>Final SPF Array:</b><br>${step.panel.match(/\[.*\]/)[0]}`;
            } else {
                res.textContent = 'Building SPF Array...';
            }

            document.getElementById('status-text').textContent = step.statusText;

            // Log panel
            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const div = document.createElement('div');
                    div.style.color = steps[k].logColor || 'var(--text-main)';
                    if (steps[k].bold) div.style.fontWeight = 'bold';
                    div.textContent = steps[k].log;
                    logEl.appendChild(div);
                }
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.textContent = '❚❚ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        window.onload = () => loadExample(10);
    </script>
</body>
</html>
