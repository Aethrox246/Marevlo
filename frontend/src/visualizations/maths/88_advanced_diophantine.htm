<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Diophantine Equations - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; font-size: 13px; width: 240px;
        }
        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; 
            max-width: 900px; min-height: 130px; 
        }
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 20px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 15px var(--accent-green); }
        .tile.failed { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; text-align: center; 
            font-family: monospace; min-height: 90px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; }

        .result-display { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 28px !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px;}
        .controls { margin-top: 25px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        .legend { margin-top: 15px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        .log-panel {
            margin-top: 15px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 95%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Variables & Bounds</label>
        <input type="text" id="vars-input" value="x:[0,2], y:[0,2]">
        <label class="ui-label">Equation(s)</label>
        <input type="text" id="eq-input" value="2x + 3y = 7">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (2x+3y=7)</button>
        <button onclick="loadExample(1)">Ex 2 (a+b=0, a-b=2)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Current combination: <span id="current-comb" style="color:var(--accent-orange)">—</span></div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Combination</span>
            <span class="info-value" id="val-comb" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Left side</span>
            <span class="info-value" id="val-left" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Satisfies?</span>
            <span class="info-value" id="val-check" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Valid Solutions =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Valid Solution</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let variables = ["x", "y"];
        let bounds = [[0, 2], [0, 2]];
        let equations = [[[2,3]], [7]]; // coefficients and constants
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            if (ex === 0) {
                variables = ["x", "y"];
                bounds = [[0, 2], [0, 2]];
                equations = [[[2,3]], [7]];
                document.getElementById('vars-input').value = "x:[0,2], y:[0,2]";
                document.getElementById('eq-input').value = "2x + 3y = 7";
            } else {
                variables = ["a", "b"];
                bounds = [[-1, 1], [-1, 1]];
                equations = [[[1,1], [1,-1]], [0, 2]];
                document.getElementById('vars-input').value = "a:[-1,1], b:[-1,1]";
                document.getElementById('eq-input').value = "a + b = 0, a - b = 2";
            }
            generateSteps();
            reset();
        }

        function loadCustom() {
            alert("Custom parsing is limited in demo. Please use the example buttons.");
        }

        function evaluateCombination(vals) {
            for (let eq = 0; eq < equations[0].length; eq++) {
                let left = 0;
                const coeffs = equations[0][eq];
                for (let i = 0; i < coeffs.length; i++) {
                    left += coeffs[i] * vals[i];
                }
                if (left !== equations[1][eq]) return false;
            }
            return true;
        }

        function generateSteps() {
            steps = [];
            let solutions = [];

            steps.push({
                type: 'init',
                comb: '—',
                left: '—',
                check: '—',
                panel: `Advanced Diophantine Solver<br>Variables: ${variables}<br>Bounds: ${bounds}<br>Equations: ${document.getElementById('eq-input').value}`,
                status: `Generating all combinations within bounds...`,
                log: `Variables: ${variables}\nBounds: ${bounds}\nEquations: ${document.getElementById('eq-input').value}\nStarting brute-force search...`,
                logColor: 'var(--text-dim)'
            });

            function recurse(index, currentVals) {
                if (index === variables.length) {
                    const isValid = evaluateCombination(currentVals);
                    const combStr = `(${currentVals.join(',')})`;

                    steps.push({
                        type: isValid ? 'winning' : 'failed',
                        comb: combStr,
                        left: '—',
                        check: isValid ? 'Valid' : 'Invalid',
                        panel: `Combination ${combStr} → ${isValid ? '<span style="color:var(--accent-green)">Valid Solution</span>' : '<span style="color:var(--accent-red)">Invalid</span>'}`,
                        status: `${combStr} → ${isValid ? 'Valid ✓' : 'Invalid ✗'}`,
                        log: `Combination ${combStr} → ${isValid ? 'Valid ✓' : 'Invalid ✗'}`,
                        logColor: isValid ? 'var(--accent-green)' : 'var(--accent-red)'
                    });

                    if (isValid) solutions.push([...currentVals]);
                    return;
                }

                const [minV, maxV] = bounds[index];
                for (let val = minV; val <= maxV; val++) {
                    currentVals[index] = val;
                    recurse(index + 1, currentVals);
                }
            }

            recurse(0, new Array(variables.length));

            steps.push({
                type: 'final',
                comb: '—',
                left: '—',
                check: '—',
                panel: `Search complete.<br>Found ${solutions.length} solution(s): <b>${solutions.length ? solutions.map(s => `(${s})`).join(', ') : 'None'}</b>`,
                status: `Done. Solutions: ${solutions.length}`,
                log: `Final Solutions: ${solutions.length ? solutions.map(s => `(${s})`).join(', ') : 'None'}`,
                logColor: 'var(--accent-green)',
                complete: true,
                result: solutions
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            if (step.comb !== '—') {
                const vals = step.comb.slice(1, -1).split(',').map(Number);
                for (let i = 0; i < vals.length; i++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'tile-unit';
                    const tile = document.createElement('div');
                    tile.className = `tile ${step.type === 'winning' ? 'winning' : step.type === 'failed' ? 'failed' : 'candidate'}`;
                    tile.innerText = vals[i];
                    const idxLabel = document.createElement('div');
                    idxLabel.className = 'tile-index';
                    idxLabel.innerText = variables[i];
                    wrapper.append(tile, idxLabel);
                    container.appendChild(wrapper);
                }
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-comb').innerText = step.comb || '—';
            document.getElementById('val-left').innerText = step.left || '—';
            document.getElementById('val-check').innerText = step.check || '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.result.length ? step.result.map(s => `(${s})`).join(', ') : "[]";
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.status || '';
            document.getElementById('current-comb').innerText = step.comb || '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
