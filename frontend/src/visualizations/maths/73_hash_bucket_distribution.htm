<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Bucket Distribution - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] { width: 240px; }
        input[type="number"] { width: 80px; }

        input[type="text"], input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; 
            max-width: 920px; min-height: 100px; position: relative;
        }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .tile {
            min-width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 21px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); box-shadow: 0 0 14px rgba(227,179,65,0.5); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.1); box-shadow: 0 0 12px var(--accent-green); }
        .tile.done { opacity: 0.55; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 740px; text-align: center; 
            font-family: monospace; min-height: 90px; line-height: 1.55;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .result-display { margin-top: 14px; text-align: center; }
        #res-val { font-size: 23px; font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .pop { animation: popAnim 420ms ease; color: var(--accent-green) !important; font-size: 29px !important; text-shadow: 0 0 16px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); text-align: center; width: 700px; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 760px; max-width: 95%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">nums =</label>
        <input type="text" id="num-input" value="[5, 10, 15]">
        <label class="ui-label">m =</label>
        <input type="number" id="m-input" value="3" min="1">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[1, 2, 3]', 2)">Ex 1</button>
        <button onclick="loadExample('[5, 10, 15]', 3)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Numbers (processing pairs)</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Pair</span>
            <span class="info-value" id="val-pair" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Sum % m</span>
            <span class="info-value" id="val-bucket" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Counts</span>
            <span class="info-value" id="val-counts" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Final Distribution =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-top:0">
            <span class="ui-label" style="margin-right:5px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Current Pair</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Bucket Updated</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red); border:1px solid var(--accent-red)"></span> Collision</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nums = [5, 10, 15];
        let m = 3;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() {
            loadExample('[5, 10, 15]', 3);
        }

        function parseNums(str) {
            try {
                return JSON.parse(str.replace(/'/g, '"'));
            } catch(e) {
                return [5, 10, 15];
            }
        }

        function loadExample(numsStr, mod) {
            document.getElementById('num-input').value = numsStr;
            document.getElementById('m-input').value = mod;
            nums = parseNums(numsStr);
            m = parseInt(mod);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const nStr = document.getElementById('num-input').value.trim();
            const mod = parseInt(document.getElementById('m-input').value);
            if (nStr && !isNaN(mod) && mod > 0) {
                nums = parseNums(nStr);
                m = mod;
                generateSteps();
                reset();
            } else {
                alert("Please enter valid nums array and m > 0");
            }
        }

        function generateSteps() {
            steps = [];
            const counts = new Array(m).fill(0);

            // INIT
            steps.push({
                type: 'init',
                panel: `Hash Bucket Distribution Analysis<br>nums = <b>[${nums.join(', ')}]</b>, m = <b>${m}</b><br>Counting (a + b) % m for all unique pairs`,
                statusText: `Starting pair-wise analysis...`,
                log: `nums = [${nums.join(', ')}]\nm = ${m}\ncounts = [${counts.join(', ')}]`,
                logColor: 'var(--text-dim)',
                pair: '—',
                bucket: '—',
                countsStr: counts.join(', ')
            });

            for (let i = 0; i < nums.length; i++) {
                for (let j = i + 1; j < nums.length; j++) {
                    const a = nums[i];
                    const b = nums[j];
                    const sum = a + b;
                    const bucket = ((sum % m) + m) % m;   // safe modulo
                    const prev = counts[bucket];

                    // Pair step
                    steps.push({
                        type: 'pair',
                        panel: `Pair (<b>${a}</b>, <b>${b}</b>)<br>sum = ${sum}, bucket = <b>${bucket}</b>`,
                        statusText: `Processing pair (${a}, ${b})`,
                        log: `Pair (${a}, ${b}) → ${sum} % ${m} = ${bucket}`,
                        logColor: 'var(--accent-orange)',
                        pair: `(${a},${b})`,
                        bucket: bucket,
                        countsStr: counts.join(', ')
                    });

                    counts[bucket]++;

                    // Update step
                    steps.push({
                        type: 'update',
                        panel: `Bucket <b>${bucket}</b> updated<br>${prev} → <b>${counts[bucket]}</b>`,
                        statusText: `Bucket ${bucket} count increased`,
                        log: `  counts[${bucket}] = ${counts[bucket]}`,
                        logColor: 'var(--accent-green)',
                        pair: `(${a},${b})`,
                        bucket: bucket,
                        countsStr: counts.join(', ')
                    });
                }
            }

            // FINAL
            steps.push({
                type: 'final',
                panel: `Analysis Complete!<br>Final distribution: <b>[${counts.join(', ')}]</b>`,
                statusText: `Final bucket counts: [${counts.join(', ')}]`,
                log: `Final Result: [${counts.join(', ')}]`,
                logColor: 'var(--accent-green)',
                bold: true,
                pair: '—',
                bucket: '—',
                countsStr: counts.join(', ')
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            nums.forEach((num, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile ${step.type === 'final' ? 'winning' : ''}`;
                tile.innerText = num;

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;

                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-pair').innerText = step.pair || '—';
            document.getElementById('val-bucket').innerText = step.bucket !== undefined ? step.bucket : '—';
            document.getElementById('val-counts').innerText = `[${step.countsStr}]`;

            const resVal = document.getElementById('res-val');
            resVal.innerText = `[${step.countsStr}]`;
            resVal.className = (step.type === 'final') ? 'pop' : '';

            document.getElementById('status-text').innerText = step.statusText || '';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
