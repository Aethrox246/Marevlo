<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit DP Mod - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 90px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .number-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            min-height: 80px;
        }
        .num-tile {
            width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; font-size: 24px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 3px solid var(--border-main); background: #21262d; color: var(--text-main);
            transition: all 0.3s ease;
        }
        .num-tile.valid { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); }
        .num-tile.invalid { opacity: 0.4; }
        .num-tile.current { border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; width: 720px; text-align: center; font-family: monospace;
            min-height: 95px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 15px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 110px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 19px; font-weight: 700; }

        .result-display { margin-top: 18px; text-align: center; }
        #res-val { font-size: 36px; font-weight: bold; font-family: monospace; transition: all 0.4s; }
        .pop { animation: popAnim 600ms ease; color: var(--accent-green) !important; }

        @keyframes popAnim { 0%{transform:scale(0.7)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13.5px; color: var(--text-dim); height: 1.5em; text-align: center; width: 700px; }
        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 150px; }

        .legend { margin-top: 18px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; max-width: 95%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">L =</label>
        <input type="number" id="l-input" value="10">
        <label class="ui-label">R =</label>
        <input type="number" id="r-input" value="20">
        <label class="ui-label">M =</label>
        <input type="number" id="m-input" value="3">
        <label class="ui-label">K =</label>
        <input type="number" id="k-input" value="1">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(10,20,3,1)">Ex 1 (10-20, M=3, K=1 → 4)</button>
        <button onclick="loadExample(1,5,2,0)">Ex 2 (1-5, M=2, K=0 → 2)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Numbers in Range [L, R]</div>
        <div class="number-bar" id="number-bar"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Number</span>
            <span class="info-value" id="val-num" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Digit Sum</span>
            <span class="info-value" id="val-sum" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Sum % M</span>
            <span class="info-value" id="val-mod" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Matches K?</span>
            <span class="info-value" id="val-match" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Total Count</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Final Count =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:6px; font-size:12px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-green);border-radius:4px;margin-right:8px;"></span>Valid (Sum % M == K)</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-red);border-radius:4px;margin-right:8px;"></span>Invalid</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let L = 10, R = 20, M = 3, K = 1;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [900, 450, 220];

        function init() {
            loadExample(10, 20, 3, 1);
        }

        function loadExample(lVal, rVal, mVal, kVal) {
            L = lVal;
            R = rVal;
            M = mVal;
            K = kVal;
            document.getElementById('l-input').value = L;
            document.getElementById('r-input').value = R;
            document.getElementById('m-input').value = M;
            document.getElementById('k-input').value = K;
            generateSteps();
            reset();
        }

        function loadCustom() {
            L = parseInt(document.getElementById('l-input').value);
            R = parseInt(document.getElementById('r-input').value);
            M = parseInt(document.getElementById('m-input').value);
            K = parseInt(document.getElementById('k-input').value);
            if (!isNaN(L) && !isNaN(R) && !isNaN(M) && !isNaN(K)) {
                generateSteps();
                reset();
            }
        }

        function digitSum(num) {
            let sum = 0;
            while (num > 0) {
                sum += num % 10;
                num = Math.floor(num / 10);
            }
            return sum;
        }

        function generateSteps() {
            steps = [];
            let count = 0;

            steps.push({
                type: 'init',
                num: -1,
                dsum: 0,
                modVal: 0,
                isValid: false,
                totalCount: 0,
                panel: `Count numbers in [<b>${L}</b>, <b>${R}</b>] where (digit sum) % <b>${M}</b> == <b>${K}</b>`,
                statusText: `Starting range enumeration...`,
                log: `Range: [${L}, ${R}]\nM = ${M}, K = ${K}\nCount = 0`,
                logColor: 'var(--text-dim)'
            });

            for (let num = L; num <= R; num++) {
                let dsum = digitSum(num);
                let modVal = dsum % M;
                let isValid = (modVal === K);

                steps.push({
                    type: 'check',
                    num: num,
                    dsum: dsum,
                    modVal: modVal,
                    isValid: isValid,
                    totalCount: count,
                    panel: `Number <b>${num}</b><br>Digit Sum = <b>${dsum}</b><br>${dsum} % ${M} = <b>${modVal}</b>`,
                    statusText: `Checking ${num}`,
                    log: `\nNumber ${num}: sum=${dsum}, sum%${M}=${modVal}`,
                    logColor: 'var(--text-main)'
                });

                if (isValid) {
                    count++;
                    steps.push({
                        type: 'valid',
                        num: num,
                        dsum: dsum,
                        modVal: modVal,
                        isValid: true,
                        totalCount: count,
                        panel: `<span style="color:var(--accent-green)">✓ Valid! Count increased to ${count}</span>`,
                        statusText: `Valid number found`,
                        log: `  → Valid! Count = ${count}`,
                        logColor: 'var(--accent-green)'
                    });
                } else {
                    steps.push({
                        type: 'invalid',
                        num: num,
                        dsum: dsum,
                        modVal: modVal,
                        isValid: false,
                        totalCount: count,
                        panel: `<span style="color:var(--accent-red)">✗ Does not satisfy condition</span>`,
                        statusText: `Invalid`,
                        log: `  → Invalid`,
                        logColor: 'var(--accent-red)'
                    });
                }
            }

            steps.push({
                type: 'final',
                num: -1,
                dsum: 0,
                modVal: 0,
                isValid: false,
                totalCount: count,
                panel: `Range enumeration complete.<br><b>Final Count = ${count}</b>`,
                statusText: `Done! Answer = ${count}`,
                log: `\nFinal Count = ${count}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('number-bar');
            container.innerHTML = '';

            for (let num = L; num <= R; num++) {
                const tile = document.createElement('div');
                tile.className = 'num-tile';
                tile.innerText = num;

                if (step.num === num) {
                    tile.classList.add('current');
                } else if (step.totalCount > 0) {
                    // Highlight previously validated ones (simplified)
                    let wasValid = false;
                    for (let k = 0; k < idx; k++) {
                        if (steps[k].num === num && steps[k].isValid) {
                            wasValid = true;
                            break;
                        }
                    }
                    if (wasValid) tile.classList.add('valid');
                }

                container.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-num').innerText = step.num >= 0 ? step.num : '—';
            document.getElementById('val-sum').innerText = step.dsum || '—';
            document.getElementById('val-mod').innerText = step.modVal || '—';
            document.getElementById('val-match').innerText = step.isValid ? 'Yes ✓' : (step.num >= 0 ? 'No ✗' : '—');
            document.getElementById('val-count').innerText = step.totalCount;

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.totalCount;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
