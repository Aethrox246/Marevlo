<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euler Totient φ(n) - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 100px;
            font-size: 14px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 16px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 920px; min-height: 140px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.1); }
        .tile.coprime { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 12px var(--accent-green); }
        .tile.not-coprime { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); opacity: 0.8; }

        .action-panel {
            margin-top: 30px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 18px 24px; width: 760px; text-align: center; font-family: monospace;
            min-height: 130px; font-size: 15px; line-height: 1.65;
        }

        .info-panel { margin-top: 20px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 12px 18px; display: flex; flex-direction: column; align-items: center; min-width: 130px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 19px; font-weight: 700; }

        .result-display { margin-top: 20px; text-align: center; font-size: 42px; font-family: monospace; font-weight: bold; }
        .pop { animation: popAnim 600ms; color: var(--accent-green) !important; }

        @keyframes popAnim { 0%{transform:scale(0.5)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.5em; }

        .controls { margin-top: 25px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 20px; display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 780px; max-width: 96%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n = </label>
        <input type="number" id="num-n" value="6">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(6)">Ex 1 (n=6 → 2)</button>
        <button onclick="loadExample(9)">Ex 2 (n=9 → 6)</button>
    </div>

    <div class="visual-container">
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current k</span>
            <span class="info-value" id="val-k" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">gcd(k, n)</span>
            <span class="info-value" id="val-gcd" style="color:var(--accent-red);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Coprime Count</span>
            <span class="info-value" id="val-count" style="color:var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        φ(<span id="n-val">6</span>) = <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex;align-items:center;gap:8px;">
            <span class="ui-label" style="font-size:12px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:#2a1600;border:2px solid var(--accent-orange);border-radius:4px;"></span> Current k</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:#0f2a1a;border:2px solid var(--accent-green);border-radius:4px;"></span> Coprime (gcd=1)</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:#2a0d0d;border:2px solid var(--accent-red);border-radius:4px;"></span> Not Coprime</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentN = 6;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() { loadExample(6); }

        function loadExample(n) {
            currentN = n;
            document.getElementById('num-n').value = n;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const n = parseInt(document.getElementById('num-n').value);
            if (!isNaN(n) && n >= 1) loadExample(n);
        }

        function gcd(a, b) {
            while (b !== 0) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function generateSteps() {
            steps = [];
            let count = 0;
            let coprimes = [];

            // Init
            steps.push({
                type: 'init',
                k: 0,
                gcdVal: 0,
                count: 0,
                panel: `Computing φ(${currentN}) = count of numbers 1 to ${currentN} where gcd(k, ${currentN}) = 1`,
                statusText: `Starting Euler Totient for n = ${currentN}`,
                log: `n = ${currentN}\nCounting coprimes...`
            });

            for (let k = 1; k <= currentN; k++) {
                const g = gcd(k, currentN);
                const isCoprime = g === 1;
                if (isCoprime) {
                    count++;
                    coprimes.push(k);
                }

                steps.push({
                    type: isCoprime ? 'coprime' : 'not',
                    k: k,
                    gcdVal: g,
                    count: count,
                    panel: `k = <b>${k}</b> | gcd(${k}, ${currentN}) = <b>${g}</b> → ${isCoprime ? 'Coprime ✓' : 'Not coprime ✗'}`,
                    statusText: `k = ${k} | gcd = ${g} | Count = ${count}`,
                    log: `k=${k}  gcd=${g}  ${isCoprime ? '✓ Coprime' : '✗'}`
                });
            }

            // Final
            steps.push({
                type: 'final',
                k: currentN,
                gcdVal: currentN,
                count: count,
                panel: `φ(${currentN}) = <b>${count}</b><br>Coprime numbers: ${coprimes.join(', ')}`,
                statusText: `Result: φ(${currentN}) = ${count}`,
                log: `Final Result → φ(${currentN}) = ${count}`
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            for (let i = 1; i <= currentN; i++) {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';

                const tile = document.createElement('div');
                let cls = 'candidate';
                if (step.type === 'final') {
                    cls = (steps.some(s => s.k === i && s.type === 'coprime')) ? 'coprime' : 'not-coprime';
                } else if (step.k === i) {
                    cls = step.type === 'coprime' ? 'coprime' : 'not-coprime';
                }

                tile.className = `tile ${cls}`;
                tile.innerText = i;

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = i;

                unit.append(tile, idxLabel);
                container.appendChild(unit);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-k').innerText = step.k || '—';
            document.getElementById('val-gcd').innerText = step.gcdVal || '—';
            document.getElementById('val-count').innerText = step.count;

            document.getElementById('n-val').innerText = currentN;
            const resVal = document.getElementById('res-val');
            resVal.innerText = step.type === 'final' ? step.count : '—';
            if (step.type === 'final') resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.innerText = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = init;
    </script>
</body>
</html>
