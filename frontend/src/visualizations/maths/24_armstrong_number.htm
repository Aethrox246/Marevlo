<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong Number Check - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 140px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 820px; min-height: 110px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 62px; height: 62px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 24px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 12px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.power { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); }
        .tile.added { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.22); box-shadow: 0 0 18px var(--accent-green); }
        .tile.failed { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }

        .action-panel {
            margin-top: 30px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 22px; width: 720px; text-align: center; font-family: monospace;
            min-height: 125px; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 16px; display: flex; flex-direction: column; align-items: center; min-width: 115px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .result-display { margin-top: 18px; text-align: center; }
        #res-val { font-size: 38px; font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { color: var(--accent-green) !important; text-shadow: 0 0 20px var(--accent-green); animation: popAnim 600ms; }
        .pop-false { color: var(--accent-red) !important; text-shadow: 0 0 20px var(--accent-red); animation: popAnim 600ms; }

        @keyframes popAnim { 0%{transform:scale(0.6)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; width: 620px; text-align: center; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 14px; height: 14px; border-radius: 3px; margin-right: 7px; }

        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 740px; max-width: 95%; height: 155px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-n" value="153">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(153)">Ex 1 (153)</button>
        <button onclick="loadExample(123)">Ex 2 (123)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Armstrong Number Check</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Digits (d)</span>
            <span class="info-value" id="val-d" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Digit</span>
            <span class="info-value" id="val-digit" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Digit^d</span>
            <span class="info-value" id="val-power" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Sum</span>
            <span class="info-value" id="val-sum" style="color:var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="font-size:18px;">is Armstrong? = </span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:2px solid var(--accent-orange)"></span> Processing Digit</div>
        <div class="legend-item"><span class="dot" style="background:#1e1030;border:2px solid var(--accent-purple)"></span> Power Calculation</div>
        <div class="legend-item"><span class="dot" style="background:#0d2244;border:2px solid var(--accent-blue)"></span> Added to Sum</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:2px solid var(--accent-green)"></span> Final Result</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentN = 153;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() { loadExample(153); }

        function loadExample(n) {
            currentN = n;
            document.getElementById('num-n').value = currentN;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-n').value);
            if (!isNaN(val) && val >= 0) {
                loadExample(val);
            } else {
                alert("Please enter a valid non-negative integer.");
            }
        }

        function generateSteps() {
            steps = [];
            let n = currentN;
            let digits = [];
            let temp = n;
            while (temp > 0) {
                digits.unshift(temp % 10);
                temp = Math.floor(temp / 10);
            }
            if (n === 0) digits = [0];
            const d = digits.length;

            // Init
            steps.push({
                type: 'init',
                n: n,
                d: d,
                digit: '—',
                power: '—',
                sum: 0,
                panel: `Check if <b>${n}</b> is an Armstrong number.<br>Number of digits (d) = <b>${d}</b>`,
                statusText: `n = ${n}, d = ${d}`,
                log: `n = ${n}\ndigits = ${d}`
            });

            let sum = 0;
            for (let i = 0; i < d; i++) {
                let digit = digits[i];
                let powerVal = Math.pow(digit, d);
                let prevSum = sum;
                sum += powerVal;

                steps.push({
                    type: 'select',
                    n: n,
                    d: d,
                    digit: digit,
                    power: powerVal,
                    sum: prevSum,
                    panel: `Digit at position ${i}: <b>${digit}</b>`,
                    statusText: `Processing digit ${digit}`,
                    log: `Digit: ${digit}`
                });

                steps.push({
                    type: 'power',
                    n: n,
                    d: d,
                    digit: digit,
                    power: powerVal,
                    sum: prevSum,
                    panel: `Compute <b>${digit}<sup>${d}</sup> = ${powerVal}</b>`,
                    statusText: `${digit}^${d} = ${powerVal}`,
                    log: `${digit}^${d} = ${powerVal}`
                });

                steps.push({
                    type: 'add',
                    n: n,
                    d: d,
                    digit: digit,
                    power: powerVal,
                    sum: sum,
                    panel: `Add to sum: <b>${prevSum} + ${powerVal} = ${sum}</b>`,
                    statusText: `Running sum = ${sum}`,
                    log: `sum = ${prevSum} + ${powerVal} = ${sum}`
                });
            }

            const isArmstrong = (sum === n);

            steps.push({
                type: 'final',
                n: n,
                d: d,
                digit: '—',
                power: '—',
                sum: sum,
                panel: `Final comparison:<br>Sum = <b>${sum}</b>, Original = <b>${n}</b><br>${isArmstrong ? 'They match → Armstrong Number' : 'They do not match → Not Armstrong'}`,
                statusText: isArmstrong ? `Yes, ${n} is an Armstrong number` : `No, ${n} is not an Armstrong number`,
                log: `Final Result: ${isArmstrong ? 'True' : 'False'}`,
                isTrue: isArmstrong
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Render digit tiles
            const digits = step.n.toString().split('').map(Number);
            digits.forEach((dig, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${step.type === 'final' ? (step.isTrue ? 'winning' : 'failed') : (step.digit === dig ? 'candidate' : 'candidate')}`;
                tile.innerText = dig;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            document.getElementById('main-panel').innerHTML = step.panel;

            document.getElementById('val-d').innerText = step.d;
            document.getElementById('val-digit').innerText = step.digit;
            document.getElementById('val-power').innerText = step.power;
            document.getElementById('val-sum').innerText = step.sum;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.isTrue !== undefined ? (step.isTrue ? 'True' : 'False') : '—';
            resVal.className = step.isTrue !== undefined ? (step.isTrue ? 'pop' : 'pop-false') : '';

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    line.innerText = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
