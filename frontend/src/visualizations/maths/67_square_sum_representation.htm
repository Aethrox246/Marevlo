<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Sum Representation - Visualization</title>
    <style>
        :root{--bg-page:#000000;--bg-surface:#161b22;--bg-input:#000000;--border-main:#30363d;
            --btn-bg:#21262d;--btn-hover:#2d333b;--text-main:#c9d1d9;--text-dim:#8b949e;
            --accent-orange:#e3b341;--accent-blue:#388bfd;--accent-green:#3fb950;
            --accent-red:#f85149;--accent-purple:#a371f7;}
        *{box-sizing:border-box;}
        body{background:var(--bg-page);color:var(--text-main);font-family:system-ui,sans-serif;
            margin:0;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding-bottom:40px;}
        .input-bar{width:100%;background:var(--bg-surface);padding:12px 16px;display:flex;
            justify-content:center;align-items:center;gap:8px;border-bottom:1px solid var(--border-main);flex-wrap:wrap;}
        label.ui-label{font-family:monospace;font-size:13px;color:var(--text-dim);}
        input[type="number"]{background:var(--bg-input);border:1px solid var(--border-main);color:var(--text-main);
            height:32px;border-radius:6px;padding:0 10px;font-size:13px;width:90px;}
        button{height:32px;padding:0 14px;background:var(--btn-bg);border:1px solid var(--border-main);
            color:var(--text-main);border-radius:6px;cursor:pointer;font-size:13px;}
        button:hover{background:var(--btn-hover);}
        .visual-container{margin-top:28px;width:100%;text-align:center;}
        .tiles-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
        .tile{min-width:54px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;
            border-radius:8px;font-size:16px;font-weight:700;font-family:monospace;
            border:2px solid var(--border-main);background:var(--btn-bg);transition:all 0.3s;}
        .tile-idx{font-size:10px;color:var(--text-dim);}
        .tile.candidate{background:#2a1600;border-color:var(--accent-orange);color:var(--accent-orange);transform:scale(1.1);}
        .tile.used{background:#0f2a1a;border-color:var(--accent-green);color:var(--accent-green);}
        .tile.checked{background:#161b22;border-color:var(--accent-blue);color:var(--accent-blue);}
        .info-panel{margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
        .info-cell{background:var(--bg-surface);border:1px solid var(--border-main);border-radius:6px;
            padding:8px 16px;min-width:130px;}
        .info-label{font-size:11px;color:var(--text-dim);}
        .info-value{font-family:monospace;font-size:18px;font-weight:700;}
        .result-display{margin-top:16px;font-size:22px;font-family:monospace;font-weight:bold;}
        .action-panel{margin-top:20px;background:var(--bg-surface);border:1px solid var(--border-main);
            border-radius:6px;padding:14px 22px;width:820px;max-width:96%;min-height:90px;
            font-family:monospace;font-size:14px;line-height:1.6;text-align:center;}
        .controls{margin-top:20px;display:flex;align-items:center;gap:10px;}
        .log-panel{margin-top:12px;background:var(--bg-page);border:1px solid var(--border-main);
            border-radius:6px;padding:12px 16px;width:820px;max-width:96%;height:130px;overflow-y:auto;
            font-family:monospace;font-size:13px;}
        .combos-box{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;}
        .combo-chip{background:var(--btn-bg);border:1px solid var(--border-main);border-radius:20px;
            padding:5px 14px;font-family:monospace;font-size:13px;}
        .combo-chip.best{border-color:var(--accent-green);color:var(--accent-green);}
    </style>
</head>
<body>
<div class="input-bar">
    <label class="ui-label">n =</label>
    <input type="number" id="inp-n" value="25" min="1" max="200">
    <button onclick="loadCustom()">Compute</button>
    <button onclick="loadExample(0)">Ex 1: n=25</button>
    <button onclick="loadExample(1)">Ex 2: n=30</button>
    <button onclick="loadExample(2)">Ex 3: n=50</button>
</div>

<div class="visual-container">
    <div style="font-size:12px;color:var(--text-dim);font-family:monospace;text-transform:uppercase;margin-bottom:8px">
        Squares ≤ n
    </div>
    <div class="tiles-row" id="squares-row"></div>
    <div class="info-panel">
        <div class="info-cell"><div class="info-label">Target n</div><div class="info-value" id="n-val">—</div></div>
        <div class="info-cell"><div class="info-label">Current sum</div><div class="info-value" id="sum-val">0</div></div>
        <div class="info-cell"><div class="info-label">Remaining</div><div class="info-value" id="rem-val">—</div></div>
        <div class="info-cell"><div class="info-label">Min squares</div><div class="info-value" id="min-val" style="color:var(--accent-green)">—</div></div>
    </div>
    <div style="font-size:12px;color:var(--text-dim);font-family:monospace;text-transform:uppercase;margin:14px 0 6px">
        DP table dp[0..n] (min squares to represent i)
    </div>
    <div class="tiles-row" id="dp-row"></div>
    <div class="combos-box" id="combos-box"></div>
    <div class="result-display" id="result-display"></div>
</div>

<div class="action-panel" id="main-panel">Click <b>▶ Play</b> or <b>Next</b> to start.</div>
<div class="controls">
    <button onclick="reset()">↺ Reset</button>
    <button onclick="back()">← Back</button>
    <button onclick="togglePlay()" id="play-btn">▶ Play</button>
    <button onclick="next()">Next →</button>
    <span class="ui-label">Speed</span>
    <input type="range" id="speed-slider" min="0" max="2" value="1">
</div>
<div class="log-panel" id="log"></div>

<script>
    let steps=[], stepIdx=0, timer=null;
    const delays=[1400,700,350];

    function generateSteps(N) {
        steps=[];
        const add=(panel,log,color,extra={})=>steps.push({panel,log,logColor:color,...extra});

        const squares=[];
        for(let i=1;i*i<=N;i++) squares.push(i*i);

        add(`<b>Square Sum Representation</b>: Represent <b>${N}</b> as sum of minimum number of perfect squares.<br>Perfect squares ≤ ${N}: [${squares.join(', ')}]`,
            `n=${N}, squares=[${squares.join(',')}]`,'var(--text-dim)',
            {sq:squares,dp:[],active:[],highlight:-1});

        // DP
        const dp=new Array(N+1).fill(Infinity);
        const parent=new Array(N+1).fill(-1);
        dp[0]=0;
        add(`Initialize DP: dp[0]=0, all others = ∞`,`dp[0]=0`,'var(--text-dim)',
            {sq:squares,dp:[...dp.map(v=>v===Infinity?'∞':v)],active:[0],highlight:0});

        for(let i=1;i<=N;i++){
            for(const s of squares){
                if(s>i) break;
                if(dp[i-s]+1 < dp[i]){ dp[i]=dp[i-s]+1; parent[i]=i-s; }
            }
            const snap=[...dp.map(v=>v===Infinity?'∞':v)];
            add(`dp[${i}] = min over squares s≤${i}: dp[${i}-s]+1 = <b>${dp[i]}</b>`,
                `dp[${i}] = ${dp[i]}`,'var(--accent-blue)',
                {sq:squares,dp:snap,active:[i],highlight:i});
        }

        // Reconstruct
        const combo=[];
        let cur=N;
        while(cur>0){ const prev=parent[cur]; combo.push(cur-prev); cur=prev; }
        const minVal=dp[N];
        add(`<b>Reconstruction:</b> Trace back parents to find squares used: [${combo.join(', ')}]<br>Verification: ${combo.join(' + ')} = ${combo.reduce((a,b)=>a+b,0)}`,
            `Result: [${combo.join('+')}] = ${N}`,'var(--accent-green)',
            {sq:squares,dp:[...dp.map(v=>v===Infinity?'∞':v)],active:[N],highlight:N,combo,minVal});

        add(`<span style="color:var(--accent-green)">✅ ${N} = ${combo.join(' + ')}<br>Min squares needed: <b>${minVal}</b></span>`,
            `Answer: ${minVal} squares`,'var(--accent-green)',
            {sq:squares,dp:[...dp.map(v=>v===Infinity?'∞':v)],active:[N],highlight:N,combo,minVal,done:true});
    }

    function renderStep(idx) {
        const s=steps[idx];
        if(!s) return;
        // Squares
        const sqRow=document.getElementById('squares-row');
        sqRow.innerHTML='';
        (s.sq||[]).forEach(v=>{
            const t=document.createElement('div'); t.className='tile';
            if(s.combo&&s.combo.includes(v)) t.classList.add('used');
            t.innerHTML=`${v}<span class="tile-idx">√${Math.round(Math.sqrt(v))}²</span>`;
            sqRow.appendChild(t);
        });
        // DP row (show up to current highlight, max 30 tiles)
        const dpRow=document.getElementById('dp-row');
        dpRow.innerHTML='';
        const maxShow=Math.min((s.dp||[]).length, 31);
        for(let i=0;i<maxShow;i++){
            const v=s.dp[i];
            const t=document.createElement('div'); t.className='tile';
            if(s.active&&s.active.includes(i)) t.classList.add('candidate');
            if(i===0||v==='0') t.classList.add('checked');
            t.innerHTML=`${v}<span class="tile-idx">[${i}]</span>`;
            dpRow.appendChild(t);
        }
        // Info
        const n=s.sq&&s.sq.length>0?s.sq[s.sq.length-1]:0;
        document.getElementById('n-val').textContent=document.getElementById('inp-n').value||'—';
        document.getElementById('min-val').textContent=s.minVal!==undefined?s.minVal:'—';
        // Combos
        const combosBox=document.getElementById('combos-box');
        combosBox.innerHTML='';
        if(s.combo){
            const chip=document.createElement('div'); chip.className='combo-chip best';
            chip.textContent=s.combo.join(' + ')+' = '+s.combo.reduce((a,b)=>a+b,0);
            combosBox.appendChild(chip);
        }
        document.getElementById('result-display').innerHTML=s.done?`<span style="color:var(--accent-green)">Min squares: ${s.minVal}</span>`:'';
        document.getElementById('main-panel').innerHTML=s.panel;
        const log=document.getElementById('log');
        log.innerHTML='';
        for(let i=0;i<=idx;i++){
            if(!steps[i].log) continue;
            const line=document.createElement('div');
            line.style.color=steps[i].logColor||'var(--text-main)';
            line.textContent=steps[i].log;
            log.appendChild(line);
        }
        log.scrollTop=log.scrollHeight;
    }

    function next(){if(stepIdx<steps.length-1){stepIdx++;renderStep(stepIdx);}else pause();}
    function back(){if(stepIdx>0){stepIdx--;renderStep(stepIdx);}}
    function reset(){pause();stepIdx=0;renderStep(0);}
    function togglePlay(){
        const btn=document.getElementById('play-btn');
        if(timer) pause();
        else{btn.textContent='⏸ Pause';if(stepIdx>=steps.length-1)stepIdx=0;
            timer=setInterval(next,delays[parseInt(document.getElementById('speed-slider').value)]);}
    }
    function pause(){clearInterval(timer);timer=null;document.getElementById('play-btn').textContent='▶ Play';}
    function loadCustom(){
        const n=parseInt(document.getElementById('inp-n').value);
        if(isNaN(n)||n<1){alert('Enter a valid n≥1');return;}
        generateSteps(n);reset();
    }
    function loadExample(i){
        const ex=[25,30,50][i];
        document.getElementById('inp-n').value=ex;
        loadCustom();
    }
    window.onload=()=>loadExample(0);
</script>
</body>
</html>
