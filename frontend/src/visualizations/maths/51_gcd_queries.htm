<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCD Range Queries - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 220px;
            font-size: 13px;
        }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 60px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .equation-box {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: 600;
            background: var(--bg-surface);
            padding: 14px 28px;
            border-radius: 8px;
            border: 1px solid var(--border-main);
        }

        .array-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 920px;
            min-height: 80px;
        }

        .array-tile {
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            min-width: 40px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .array-tile.highlight { 
            border-color: var(--accent-orange); 
            color: var(--accent-orange); 
            transform: scale(1.08); 
            box-shadow: 0 0 15px rgba(227,179,65,0.5); 
        }

        .array-tile.result { 
            border-color: var(--accent-green); 
            color: var(--accent-green); 
            transform: scale(1.15); 
            box-shadow: 0 0 18px var(--accent-green); 
        }

        /* PANEL */
        .action-panel {
            margin-top: 30px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 16px 24px;
            width: 740px;
            text-align: center;
            font-family: monospace;
            min-height: 100px;
            font-size: 15px;
            line-height: 1.6;
        }

        /* INFO PANEL */
        .info-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info-cell {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 10px 18px;
            min-width: 130px;
            text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        /* RESULT */
        .result-display {
            margin-top: 20px;
            text-align: center;
        }
        #res-val {
            font-size: 24px;
            font-family: monospace;
            font-weight: bold;
            transition: all 0.4s;
        }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 30px !important; }
        .pop-false { animation: popAnim 500ms ease; color: var(--accent-red) !important; font-size: 30px !important; }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; }
        .controls {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: var(--text-dim);
        }

        .log-panel {
            margin-top: 20px;
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 14px 18px;
            width: 740px;
            max-width: 95%;
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="arr-input" value="[2,4,6,8,10]">
        <label class="ui-label">queries =</label>
        <input type="text" id="queries-input" value="[[0,2],[1,3],[2,4]]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([2,4,6,8,10], [[0,2],[1,3],[2,4]])">Ex 1</button>
        <button onclick="loadExample([7,14,21,28,35], [[0,1],[2,4],[0,4]])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="equation-box" id="equation-display">GCD queries on array [2,4,6,8,10]</div>
        <div class="array-wrapper" id="array-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Query</span>
            <span class="info-value" id="val-query" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running GCD</span>
            <span class="info-value" id="val-gcd" style="color:var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Final for Query</span>
            <span class="info-value" id="val-final" style="color:var(--text-main);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">All Query Results =</span><br>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px; font-size:11px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#2a1600;border:1px solid var(--accent-orange);border-radius:3px;"></span> Current i in range</div>
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#0f2a1a;border:1px solid var(--accent-green);border-radius:3px;"></span> Query Result</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [2, 4, 6, 8, 10];
        let queries = [[0, 2], [1, 3], [2, 4]];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            loadExample([2,4,6,8,10], [[0,2],[1,3],[2,4]]);
        }

        function loadExample(newArr, newQueries) {
            arr = newArr;
            queries = newQueries;
            document.getElementById('arr-input').value = JSON.stringify(arr);
            document.getElementById('queries-input').value = JSON.stringify(queries);
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const aStr = document.getElementById('arr-input').value.trim();
                const qStr = document.getElementById('queries-input').value.trim();
                const parsedArr = JSON.parse(aStr);
                const parsedQueries = JSON.parse(qStr);
                if (Array.isArray(parsedArr) && Array.isArray(parsedQueries)) {
                    loadExample(parsedArr, parsedQueries);
                } else {
                    alert("Invalid format. Use JSON arrays like [2,4,6,8,10] and [[0,2],[1,3]].");
                }
            } catch(e) {
                alert("Invalid JSON format.");
            }
        }

        function gcd(x, y) {
            x = Math.abs(x);
            y = Math.abs(y);
            while (y !== 0) {
                let t = y;
                y = x % y;
                x = t;
            }
            return x;
        }

        function generateSteps() {
            steps = [];
            document.getElementById('equation-display').innerText = `GCD queries on array ${JSON.stringify(arr)}`;

            // Init step
            steps.push({
                type: 'init',
                queryIdx: -1,
                i: '—',
                currentGCD: '—',
                panel: `Array: <b>${JSON.stringify(arr)}</b><br>Queries: <b>${JSON.stringify(queries)}</b><br>Processing each query independently`,
                statusText: `Starting GCD queries...`,
                log: `arr = ${JSON.stringify(arr)}\nqueries = ${JSON.stringify(queries)}\nFor each query, compute GCD of subarray`,
                logColor: 'var(--text-dim)'
            });

            let results = [];

            for (let qIdx = 0; qIdx < queries.length; qIdx++) {
                const [l, r] = queries[qIdx];
                let currentGCD = arr[l];

                steps.push({
                    type: 'new_query',
                    queryIdx: qIdx,
                    i: l,
                    currentGCD: currentGCD,
                    panel: `Query ${qIdx}: [${l}, ${r}] → values ${arr.slice(l, r+1)}`,
                    statusText: `Processing query [${l}, ${r}]`,
                    log: `\nQuery ${qIdx}: [${l}, ${r}]`,
                    logColor: 'var(--accent-purple)'
                });

                for (let i = l; i <= r; i++) {
                    const oldGCD = currentGCD;
                    currentGCD = gcd(currentGCD, arr[i]);

                    steps.push({
                        type: 'gcd_step',
                        queryIdx: qIdx,
                        i: i,
                        currentGCD: currentGCD,
                        panel: `i = <b>${i}</b><br>arr[${i}] = ${arr[i]}<br>gcd(${oldGCD}, ${arr[i]}) = <b>${currentGCD}</b>`,
                        statusText: `i=${i} → gcd = ${currentGCD}`,
                        log: `  i=${i} : gcd(${oldGCD}, ${arr[i]}) = ${currentGCD}`,
                        logColor: 'var(--accent-orange)'
                    });
                }

                results.push(currentGCD);

                steps.push({
                    type: 'query_result',
                    queryIdx: qIdx,
                    i: '—',
                    currentGCD: currentGCD,
                    panel: `Query [${l}, ${r}] complete.<br>GCD = <b>${currentGCD}</b>`,
                    statusText: `Query ${qIdx} result = ${currentGCD}`,
                    log: `Query ${qIdx} finished with GCD = ${currentGCD}`,
                    logColor: 'var(--accent-green)'
                });
            }

            // Final step
            steps.push({
                type: 'final',
                queryIdx: -1,
                i: '—',
                currentGCD: '—',
                panel: `All queries processed.<br>Results: <b>${JSON.stringify(results)}</b>`,
                statusText: `All queries done`,
                log: `Final results: ${JSON.stringify(results)}`,
                logColor: 'var(--accent-green)',
                isTrue: true,
                result: results
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('array-container');
            container.innerHTML = '';

            // Render array with highlights for current query range
            for (let i = 0; i < arr.length; i++) {
                const tile = document.createElement('div');
                tile.className = `array-tile ${step.queryIdx !== undefined && step.queryIdx >= 0 && i >= queries[step.queryIdx][0] && i <= queries[step.queryIdx][1] ? 'highlight' : ''}`;
                tile.innerHTML = arr[i];
                container.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-query').innerText = step.queryIdx !== undefined && step.queryIdx >= 0 ? `[${queries[step.queryIdx][0]}, ${queries[step.queryIdx][1]}]` : '—';
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-gcd').innerText = step.currentGCD !== undefined ? step.currentGCD : '—';
            document.getElementById('val-final').innerText = step.type === 'query_result' || step.type === 'final' ? step.currentGCD : '—';

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = JSON.stringify(step.result);
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
