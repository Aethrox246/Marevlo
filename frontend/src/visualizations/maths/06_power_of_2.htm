<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power of 2 Check - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 160px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; 
            max-width: 820px; min-height: 110px; 
        }

        .number-box {
            background: #21262d;
            border: 3px solid var(--accent-orange);
            border-radius: 12px;
            padding: 20px 40px;
            font-size: 38px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 160px;
            text-align: center;
        }

        .operation { font-size: 28px; color: var(--accent-blue); margin: 0 15px; }

        .remainder-box {
            background: #21262d;
            border: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px 30px;
            font-size: 32px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 100px;
            text-align: center;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; width: 700px; text-align: center;
            font-family: monospace; min-height: 85px; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin-top: 15px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 19px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 26px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 34px !important; text-shadow: 0 0 15px var(--accent-green); }
        .pop-false { animation: popAnim 500ms ease; color: var(--accent-red) !important; font-size: 34px !important; text-shadow: 0 0 15px var(--accent-red); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 700px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 92%; height: 145px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" placeholder="16" value="16">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(16)">Ex 1 (16)</button>
        <button onclick="loadExample(18)">Ex 2 (18)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Repeated division by 2 (checking remainder)</div>
        <div class="tiles-wrapper" id="visual"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current n</span>
            <span class="info-value" id="val-n" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">n % 2</span>
            <span class="info-value" id="val-rem" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Divisions Done</span>
            <span class="info-value" id="val-count" style="color:var(--accent-blue)">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">is power of 2? =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600; border:1px solid var(--accent-orange)"></span> Current Number</div>
        <div class="legend-item"><span class="dot" style="background:#0d2244; border:1px solid var(--accent-purple)"></span> Remainder</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputNumber = 16;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1500, 750, 350];

        function init() { loadExample(16); }

        function loadExample(newNum) {
            inputNumber = parseInt(newNum);
            document.getElementById('num-input').value = inputNumber;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val)) loadExample(val);
            else alert("Please enter a valid integer.");
        }

        function generateSteps() {
            steps = [];
            let n = inputNumber;
            let count = 0;

            steps.push({
                type: 'init',
                current: n,
                rem: '—',
                panel: `Checking if <b>${n}</b> is a power of 2.<br>Repeatedly divide by 2 and check remainder.`,
                statusText: `Starting with n = ${n}`,
                log: `n = ${n}`,
                logColor: 'var(--text-dim)'
            });

            if (n <= 0) {
                steps.push({
                    type: 'final',
                    current: n,
                    rem: '—',
                    panel: `<span style="color:var(--accent-red)">n ≤ 0 → Not a power of 2</span>`,
                    statusText: `Result: False`,
                    log: `n ≤ 0 → False`,
                    logColor: 'var(--accent-red)',
                    complete: true,
                    isPower: false
                });
                return;
            }

            while (n > 1) {
                const rem = n % 2;
                const prevN = n;
                n = Math.floor(n / 2);
                count++;

                steps.push({
                    type: 'divide',
                    current: n,
                    rem: rem,
                    panel: `Divide: <code>${prevN} % 2 = ${rem}</code><br>Next n = ${prevN} // 2 = <b>${n}</b>`,
                    statusText: `n = ${prevN} → remainder ${rem}`,
                    log: `${prevN} % 2 = ${rem} → n = ${n}`,
                    logColor: rem === 0 ? 'var(--accent-blue)' : 'var(--accent-red)'
                });

                if (rem !== 0) {
                    steps.push({
                        type: 'final',
                        current: n,
                        rem: rem,
                        panel: `<span style="color:var(--accent-red)">Remainder is not 0 → Not a power of 2</span>`,
                        statusText: `Result: False`,
                        log: `Odd number encountered → False`,
                        logColor: 'var(--accent-red)',
                        complete: true,
                        isPower: false
                    });
                    return;
                }
            }

            steps.push({
                type: 'final',
                current: n,
                rem: 0,
                panel: `<span style="color:var(--accent-green)">Reduced to 1 with all remainders 0 → Power of 2</span>`,
                statusText: `Result: True`,
                log: `Reached 1 with all even divisions → True`,
                logColor: 'var(--accent-green)',
                complete: true,
                isPower: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('visual');
            container.innerHTML = `
                <div class="number-box" style="border-color: ${step.type === 'final' ? (step.isPower ? 'var(--accent-green)' : 'var(--accent-red)') : 'var(--accent-orange)'}">
                    ${step.current}
                </div>
                <div class="operation">%</div>
                <div class="remainder-box">
                    ${step.rem}
                </div>
            `;

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-n').innerText = step.current;
            document.getElementById('val-rem').innerText = step.rem;
            document.getElementById('val-count').innerText = step.type === 'init' ? 0 : (idx);

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.isPower ? "True" : "False";
                resVal.className = step.isPower ? 'pop' : 'pop-false';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
