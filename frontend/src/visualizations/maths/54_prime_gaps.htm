<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Gaps - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 90px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 80px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 20px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.1); box-shadow: 0 0 12px var(--accent-green); z-index: 3; }
        .tile.idle { opacity: 0.9; }
        .tile.done { opacity: 0.5; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* ACTION PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        /* RESULT */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 20px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 26px !important; text-shadow: 0 0 12px var(--accent-green); }
        .pop-false { animation: popAnim 400ms ease; color: var(--accent-red) !important; font-size: 26px !important; text-shadow: 0 0 12px var(--accent-red); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">low =</label>
        <input type="number" id="low-input" value="10">
        <label class="ui-label">high =</label>
        <input type="number" id="high-input" value="30">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(10,30)">Ex 1 (→ 6)</button>
        <button onclick="loadExample(1,10)">Ex 2 (→ 2)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Numbers in range [low, high]:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current n</span>
            <span class="info-value" id="val-n" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Is Prime?</span>
            <span class="info-value" id="val-prime" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Prev Prime</span>
            <span class="info-value" id="val-prev" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max Gap</span>
            <span class="info-value" id="val-gap" style="color: var(--accent-purple);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Largest prime gap =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Checking</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Prime</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue); border:1px solid var(--accent-blue)"></span> Gap Update</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--border-main); opacity:0.5"></span> Processed</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let low = 10;
        let high = 30;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() {
            loadExample(10, 30);
        }

        function loadExample(newLow, newHigh) {
            low = parseInt(newLow);
            high = parseInt(newHigh);
            document.getElementById('low-input').value = low;
            document.getElementById('high-input').value = high;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const l = parseInt(document.getElementById('low-input').value);
            const h = parseInt(document.getElementById('high-input').value);
            if (!isNaN(l) && !isNaN(h) && l >= 1 && h >= l) {
                loadExample(l, h);
            } else {
                alert("Please enter valid low and high (low >= 1, high >= low).");
            }
        }

        function isPrime(n) {
            if (n <= 1) return false;
            if (n <= 3) return true;
            if (n % 2 === 0 || n % 3 === 0) return false;
            let i = 5;
            while (i * i <= n) {
                if (n % i === 0 || n % (i + 2) === 0) return false;
                i += 6;
            }
            return true;
        }

        function generateSteps() {
            steps = [];

            steps.push({
                type: 'init',
                n: '—',
                isPrimeVal: '—',
                prev: '—',
                gap: '—',
                maxGap: 0,
                digitsStates: Array(high - low + 1).fill('idle'),
                panel: `Range: [<b>${low}</b>, <b>${high}</b>]<br>Find largest gap between consecutive primes.`,
                statusText: `Starting prime gap calculation...`,
                log: `low = ${low}, high = ${high}\nInitialize max_gap = 0, prev_prime = None`,
                logColor: 'var(--text-dim)'
            });

            let prevPrime = null;
            let maxGap = 0;

            for (let num = low; num <= high; num++) {
                const prime = isPrime(num);

                steps.push({
                    type: prime ? 'winning' : 'candidate',
                    n: num,
                    isPrimeVal: prime,
                    prev: prevPrime,
                    gap: '—',
                    maxGap: maxGap,
                    digitsStates: Array(high - low + 1).fill('idle').map((_, idx) => {
                        const currentNum = low + idx;
                        if (currentNum === num) return prime ? 'winning' : 'candidate';
                        return 'idle';
                    }),
                    panel: `Checking number <b>${num}</b><br>${prime ? 'Prime!' : 'Not prime'}`,
                    statusText: `n=${num} → ${prime ? 'Prime' : 'Composite'}`,
                    log: `n = ${num}: ${prime ? 'Prime' : 'Not prime'}`,
                    logColor: prime ? 'var(--accent-green)' : 'var(--accent-orange)'
                });

                if (prime) {
                    if (prevPrime !== null) {
                        const currentGap = num - prevPrime;
                        if (currentGap > maxGap) {
                            maxGap = currentGap;
                        }

                        steps.push({
                            type: 'gap_update',
                            n: num,
                            isPrimeVal: true,
                            prev: prevPrime,
                            gap: currentGap,
                            maxGap: maxGap,
                            digitsStates: Array(high - low + 1).fill('idle').map((_, idx) => {
                                const currentNum = low + idx;
                                if (currentNum === num || currentNum === prevPrime) return 'winning';
                                return 'idle';
                            }),
                            panel: `Prime found: ${prevPrime} → <b>${num}</b><br>Gap = ${currentGap}<br>New max gap = ${maxGap}`,
                            statusText: `Gap = ${currentGap}, max_gap = ${maxGap}`,
                            log: `  Gap between ${prevPrime} and ${num} = ${currentGap}. Max gap updated to ${maxGap}.`,
                            logColor: 'var(--accent-green)'
                        });
                    }
                    prevPrime = num;
                }
            }

            steps.push({
                type: 'final',
                n: '—',
                isPrimeVal: '—',
                prev: prevPrime,
                gap: '—',
                maxGap: maxGap,
                digitsStates: Array(high - low + 1).fill('done'),
                panel: `Range [${low}, ${high}] processed.<br>Largest prime gap = <b>${maxGap}</b>`,
                complete: true,
                isTrue: true,
                statusText: `Done. Largest gap = ${maxGap}`,
                log: `Final largest gap between consecutive primes in range [${low}, ${high}] is ${maxGap}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const rangeSize = high - low + 1;
            step.digitsStates.forEach((state, pos) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.innerText = low + pos;

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${low + pos}]`;

                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-n').innerText = step.n;
            document.getElementById('val-prime').innerText = step.isPrimeVal === true ? 'Yes' : (step.isPrimeVal === false ? 'No' : '—');
            document.getElementById('val-prev').innerText = step.prev !== null ? step.prev : '—';
            document.getElementById('val-gap').innerText = step.maxGap;

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.maxGap;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
