<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Exponentiation Mod (Recurrence) - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; font-size: 13px; width: 160px;
        }
        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; 
            max-width: 900px; min-height: 130px; 
        }
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 20px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 15px var(--accent-green); }
        .tile.failed { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; text-align: center; 
            font-family: monospace; min-height: 90px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; }

        .result-display { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 26px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 32px !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px;}
        .controls { margin-top: 25px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        .legend { margin-top: 15px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        .log-panel {
            margin-top: 15px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 95%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="text" id="n-input" value="4">
        <label class="ui-label">a =</label>
        <input type="text" id="a-input" value="1">
        <label class="ui-label">b =</label>
        <input type="text" id="b-input" value="1">
        <label class="ui-label">m =</label>
        <input type="text" id="m-input" value="10">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (n=4,a=1,b=1,m=10)</button>
        <button onclick="loadExample(1)">Ex 2 (n=5,a=2,b=3,m=7)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Current n: <span id="current-n" style="color:var(--accent-orange)">—</span></div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">n</span>
            <span class="info-value" id="val-n" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">f(n-1)</span>
            <span class="info-value" id="val-fnm1" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">f(n-2)</span>
            <span class="info-value" id="val-fnm2" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Sum mod m</span>
            <span class="info-value" id="val-sum" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">f(n) mod m =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Computed Value</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nVal = 4;
        let aVal = 1;
        let bVal = 1;
        let mVal = 10;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            if (ex === 0) {
                nVal = 4; aVal = 1; bVal = 1; mVal = 10;
                document.getElementById('n-input').value = "4";
                document.getElementById('a-input').value = "1";
                document.getElementById('b-input').value = "1";
                document.getElementById('m-input').value = "10";
            } else {
                nVal = 5; aVal = 2; bVal = 3; mVal = 7;
                document.getElementById('n-input').value = "5";
                document.getElementById('a-input').value = "2";
                document.getElementById('b-input').value = "3";
                document.getElementById('m-input').value = "7";
            }
            generateSteps();
            reset();
        }

        function loadCustom() {
            nVal = parseInt(document.getElementById('n-input').value) || 4;
            aVal = parseInt(document.getElementById('a-input').value) || 1;
            bVal = parseInt(document.getElementById('b-input').value) || 1;
            mVal = parseInt(document.getElementById('m-input').value) || 10;
            generateSteps();
            reset();
        }

        function rec(n, a, b, m) {
            if (n < 0) return 0;
            if (n === 0) return a % m;
            if (n === 1) return b % m;
            return (rec(n-1, a, b, m) + rec(n-2, a, b, m)) % m;
        }

        function generateSteps() {
            steps = [];
            let memo = {};

            function compute(n) {
                if (n < 0) return 0;
                if (n === 0) return aVal % mVal;
                if (n === 1) return bVal % mVal;
                if (memo[n] !== undefined) return memo[n];

                const left = compute(n-1);
                const right = compute(n-2);
                const sum = (left + right) % mVal;
                memo[n] = sum;

                steps.push({
                    type: n === nVal ? 'winning' : 'candidate',
                    currentN: n,
                    fnm1: left,
                    fnm2: right,
                    sumMod: sum,
                    panel: `Computing f(${n}) = f(${n-1}) + f(${n-2}) mod ${mVal}<br>f(${n-1}) = ${left}<br>f(${n-2}) = ${right}<br>Sum = ${left} + ${right} = ${left+right}<br>(${left} + ${right}) mod ${mVal} = ${sum}`,
                    status: `f(${n}) = ${sum}`,
                    log: `f(${n}) ← f(${n-1})=${left} + f(${n-2})=${right} = ${sum} (mod ${mVal})`,
                    logColor: 'var(--accent-green)'
                });

                return sum;
            }

            steps.push({
                type: 'init',
                currentN: '—',
                fnm1: '—',
                fnm2: '—',
                sumMod: '—',
                panel: `Computing f(${nVal}) where f(0)=${aVal}, f(1)=${bVal}, modulo ${mVal}`,
                status: `Starting recursion for n=${nVal}`,
                log: `Recurrence: f(n) = f(n-1) + f(n-2)\nf(0)=${aVal}, f(1)=${bVal}\nModulo m=${mVal}`,
                logColor: 'var(--text-dim)'
            });

            const finalResult = compute(nVal);

            steps.push({
                type: 'final',
                currentN: nVal,
                fnm1: '—',
                fnm2: '—',
                sumMod: finalResult,
                panel: `Final Result<br>f(${nVal}) mod ${mVal} = <b>${finalResult}</b>`,
                status: `Done. f(${nVal}) mod ${mVal} = ${finalResult}`,
                log: `Final f(${nVal}) mod ${mVal} = ${finalResult}`,
                logColor: 'var(--accent-green)',
                complete: true,
                result: finalResult
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            if (step.currentN !== '—') {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${step.type === 'winning' ? 'winning' : 'candidate'}`;
                tile.innerText = step.currentN;
                const label = document.createElement('div');
                label.className = 'tile-index';
                label.innerText = 'n';
                wrapper.append(tile, label);
                container.appendChild(wrapper);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-n').innerText = step.currentN || '—';
            document.getElementById('val-fnm1').innerText = step.fnm1 !== '—' ? step.fnm1 : '—';
            document.getElementById('val-fnm2').innerText = step.fnm2 !== '—' ? step.fnm2 : '—';
            document.getElementById('val-sum').innerText = step.sumMod !== '—' ? step.sumMod : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.result;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.status || '';
            document.getElementById('current-n').innerText = step.currentN || '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
