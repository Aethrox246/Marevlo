<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCD Deletion - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 240px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 110px; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; font-size: 26px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.4s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.removed { opacity: 0.25; background: #2a0d0d; border-color: var(--accent-red); text-decoration: line-through; }
        .tile.active { border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 22px; width: 720px; text-align: center; font-family: monospace;
            min-height: 95px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 15px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 120px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 19px; font-weight: 700; }

        .result-display { margin-top: 18px; text-align: center; }
        #res-val { font-size: 32px; font-weight: bold; font-family: monospace; transition: all 0.4s; }
        .pop { animation: popAnim 600ms ease; color: var(--accent-green) !important; }

        @keyframes popAnim { 0%{transform:scale(0.7)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13.5px; color: var(--text-dim); height: 1.5em; text-align: center; width: 700px; }
        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 150px; }

        .legend { margin-top: 18px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; max-width: 95%; height: 150px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="num-input" placeholder="[4, 8, 6, 12]" value="[4, 8, 6, 12]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[4,8,6,12]')">Ex 1</button>
        <button onclick="loadExample('[3,9,15,27]')">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Array Elements (click Next to simulate removal)</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Removing Index</span>
            <span class="info-value" id="val-remove" style="color: var(--accent-red);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running GCD</span>
            <span class="info-value" id="val-gcd" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max GCD So Far</span>
            <span class="info-value" id="val-max" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Maximum GCD after deleting one element</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:6px; font-size:12px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-red);border-radius:4px;margin-right:8px;"></span>Removed</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-purple);border-radius:4px;margin-right:8px;"></span>Running GCD</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-green);border-radius:4px;margin-right:8px;"></span>New Max</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [4, 8, 6, 12];
        let n = 0;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1350, 700, 350];

        function init() {
            loadExample('[4,8,6,12]');
        }

        function loadExample(str) {
            try {
                arr = JSON.parse(str);
            } catch(e) {
                arr = [4, 8, 6, 12];
            }
            document.getElementById('num-input').value = JSON.stringify(arr);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('num-input').value.trim();
            if (val) loadExample(val);
        }

        function gcd(a, b) {
            a = Math.abs(a); b = Math.abs(b);
            while (b !== 0) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function generateSteps() {
            steps = [];
            n = arr.length;
            let maxGCD = 0;

            steps.push({
                type: 'init',
                removeIdx: -1,
                runningGCD: 0,
                maxSoFar: 0,
                panel: `Find <b>maximum GCD</b> after removing <b>exactly one</b> element from <b>[${arr.join(', ')}]</b>`,
                statusText: `Starting simulation...`,
                log: `Array = [${arr.join(', ')}]\nWe will try removing each element and compute GCD of the rest.\nMax GCD = 0`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n; i++) {
                let currentGCD = 0;
                let processed = [];

                // Select element to remove
                steps.push({
                    type: 'select',
                    removeIdx: i,
                    runningGCD: 0,
                    maxSoFar: maxGCD,
                    panel: `Removing index <b>${i}</b> (value <b>${arr[i]}</b>)`,
                    statusText: `Removing index ${i}`,
                    log: `\n--- Removing index ${i} (${arr[i]}) ---`,
                    logColor: 'var(--accent-red)'
                });

                // Compute GCD of remaining elements
                for (let j = 0; j < n; j++) {
                    if (j === i) continue;

                    const prev = currentGCD;
                    currentGCD = currentGCD === 0 ? arr[j] : gcd(currentGCD, arr[j]);

                    steps.push({
                        type: 'gcdstep',
                        removeIdx: i,
                        runningGCD: currentGCD,
                        maxSoFar: maxGCD,
                        currentJ: j,
                        panel: `GCD so far: gcd(${prev}, ${arr[j]}) = <b>${currentGCD}</b>`,
                        statusText: `Including ${arr[j]}`,
                        log: `  gcd(${prev}, ${arr[j]}) = ${currentGCD}`,
                        logColor: 'var(--accent-purple)'
                    });
                }

                if (currentGCD > maxGCD) maxGCD = currentGCD;

                steps.push({
                    type: 'result',
                    removeIdx: i,
                    runningGCD: currentGCD,
                    maxSoFar: maxGCD,
                    panel: `After removing index ${i}, GCD = <b>${currentGCD}</b><br>Max so far = <b>${maxGCD}</b>`,
                    statusText: `GCD after removal = ${currentGCD}`,
                    log: `  Final GCD for this removal = ${currentGCD} | Max = ${maxGCD}`,
                    logColor: currentGCD === maxGCD ? 'var(--accent-green)' : 'var(--text-main)'
                });
            }

            steps.push({
                type: 'final',
                removeIdx: -1,
                runningGCD: maxGCD,
                maxSoFar: maxGCD,
                panel: `Finished!<br><b>Maximum possible GCD after deleting one element is ${maxGCD}</b>`,
                statusText: `Done! Answer = ${maxGCD}`,
                log: `\nFinal Answer: ${maxGCD}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            for (let k = 0; k < n; k++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = arr[k];

                if (step.removeIdx === k) {
                    tile.classList.add('removed');
                } else if (step.type === 'gcdstep' && step.currentJ === k) {
                    tile.classList.add('active');
                }

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${k}]`;

                wrapper.appendChild(tile);
                wrapper.appendChild(idxLabel);
                container.appendChild(wrapper);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-remove').innerText = step.removeIdx >= 0 ? step.removeIdx : '—';
            document.getElementById('val-gcd').innerText = step.runningGCD || '—';
            document.getElementById('val-max').innerText = step.maxSoFar || '—';

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.maxSoFar;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
