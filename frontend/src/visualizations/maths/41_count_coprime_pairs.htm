<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Coprime Pairs - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 220px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; text-align: center; }
        .tiles-wrapper { 
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; 
            max-width: 920px; min-height: 140px; margin: 0 auto;
        }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 18px; font-weight: 600; font-family: monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
        }
        .tile-index { font-size: 11px; color: var(--text-dim); }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); }
        .tile.coprime { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 12px var(--accent-green); }
        .tile.not-coprime { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; width: 780px; min-height: 100px;
            font-family: monospace; font-size: 15px; line-height: 1.5; text-align: center;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 16px; min-width: 120px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .result-display { 
            margin-top: 16px; font-size: 22px; font-family: monospace; 
            color: var(--accent-green); font-weight: bold;
        }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); min-height: 22px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 780px; max-width: 96%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Array =</label>
        <input type="text" id="arr-input" value="[2, 3, 4, 5, 6]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[2, 3, 4, 5, 6]')">Example 1</button>
        <button onclick="loadExample('[1, 2, 3, 4]')">Example 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Count Coprime Pairs (gcd(i,j) == 1) using Brute Force</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to start checking pairs...</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Pair</span>
            <span class="info-value" id="val-pair" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">GCD</span>
            <span class="info-value" id="val-gcd" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Coprime Count</span>
            <span class="info-value" id="val-count" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">Coprime Pairs will appear here</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px; font-size:12px">Speed:</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Checking Pair</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:1px solid var(--accent-green)"></span> Coprime (gcd=1)</div>
        <div class="legend-item"><span class="dot" style="background:#2a0d0d;border:1px solid var(--accent-red)"></span> Not Coprime</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [2, 3, 4, 5, 6];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function loadExample(str) {
            try {
                arr = JSON.parse(str);
            } catch(e) {
                alert("Invalid array format");
                return;
            }
            document.getElementById('arr-input').value = str;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const str = document.getElementById('arr-input').value.trim();
            loadExample(str);
        }

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b !== 0) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function generateSteps() {
            steps = [];
            let n = arr.length;
            let count = 0;
            let pairsChecked = 0;

            steps.push({
                type: 'init',
                panel: `Counting coprime pairs in array [<b>${arr.join(', ')}</b>]<br>n = ${n}`,
                statusText: `Starting pair checking for ${n} elements`,
                log: `Array = [${arr.join(', ')}]\nTotal pairs = ${n*(n-1)/2}\nChecking pairs with i < j...`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n; i++) {
                for (let j = i + 1; j < n; j++) {
                    let g = gcd(arr[i], arr[j]);
                    pairsChecked++;

                    let isCoprime = (g === 1);
                    if (isCoprime) count++;

                    steps.push({
                        type: isCoprime ? 'coprime' : 'not-coprime',
                        i: i,
                        j: j,
                        g: g,
                        count: count,
                        panel: `Pair (${arr[i]}, ${arr[j]}) → gcd = <b>${g}</b> ${isCoprime ? '✓ Coprime' : '✗ Not coprime'}`,
                        statusText: `Pair (${i},${j}) gcd=${g}`,
                        log: `i=${i}, j=${j} | ${arr[i]}, ${arr[j]} | gcd=${g} → ${isCoprime ? 'Coprime' : 'Not coprime'}`,
                        logColor: isCoprime ? 'var(--accent-green)' : 'var(--accent-red)'
                    });
                }
            }

            steps.push({
                type: 'final',
                count: count,
                panel: `Finished!<br>Total coprime pairs = <b>${count}</b>`,
                complete: true,
                statusText: `Done. Coprime pairs: ${count}`,
                log: `\nTotal coprime pairs found: ${count}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show current pair as tiles
            if (!step.complete) {
                const unit1 = document.createElement('div');
                unit1.className = 'tile-unit';
                const tile1 = document.createElement('div');
                tile1.className = `tile ${step.type === 'coprime' ? 'coprime' : 'not-coprime'}`;
                tile1.textContent = arr[step.i];
                unit1.appendChild(tile1);
                const label1 = document.createElement('div');
                label1.className = 'tile-index';
                label1.textContent = `index ${step.i}`;
                unit1.appendChild(label1);
                container.appendChild(unit1);

                const unit2 = document.createElement('div');
                unit2.className = 'tile-unit';
                const tile2 = document.createElement('div');
                tile2.className = `tile ${step.type === 'coprime' ? 'coprime' : 'not-coprime'}`;
                tile2.textContent = arr[step.j];
                unit2.appendChild(tile2);
                const label2 = document.createElement('div');
                label2.className = 'tile-index';
                label2.textContent = `index ${step.j}`;
                unit2.appendChild(label2);
                container.appendChild(unit2);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-pair').textContent = step.i !== undefined ? `(${arr[step.i]}, ${arr[step.j]})` : '—';
            document.getElementById('val-gcd').textContent = step.g !== undefined ? step.g : '—';
            document.getElementById('val-count').textContent = step.count;

            const res = document.getElementById('res-val');
            if (step.complete) {
                res.innerHTML = `<b>Coprime Pairs:</b> ${step.count}`;
            } else {
                res.textContent = 'Checking pairs...';
            }

            document.getElementById('status-text').textContent = step.statusText;

            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const div = document.createElement('div');
                    div.style.color = steps[k].logColor || 'var(--text-main)';
                    if (steps[k].bold) div.style.fontWeight = 'bold';
                    div.textContent = steps[k].log;
                    logEl.appendChild(div);
                }
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = '❚❚ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        window.onload = () => loadExample('[2, 3, 4, 5, 6]');
    </script>
</body>
</html>
