<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binomial mod Composite - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 80px;
            font-size: 13px;
        }
        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 820px; min-height: 90px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 19px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.12); }
        .tile.done { opacity: 0.55; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 90px;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; }

        #res-val { font-size: 24px; color: var(--accent-green); font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .pop { animation: popAnim 400ms ease; font-size: 30px !important; }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="n-input" value="5">
        <label class="ui-label">r =</label>
        <input type="number" id="r-input" value="2">
        <label class="ui-label">m =</label>
        <input type="number" id="m-input" value="100">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(5,2,100)">Ex 1 (→ 10)</button>
        <button onclick="loadExample(7,3,13)">Ex 2 (→ 9)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Computing C(n,r) mod m</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Step</span>
            <span class="info-value" id="val-step" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">n! mod m</span>
            <span class="info-value" id="val-num" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Denominator</span>
            <span class="info-value" id="val-den" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Inverse</span>
            <span class="info-value" id="val-inv" style="color:var(--accent-red);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Final Result: C(n,r) mod m</span><br>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px;">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Computing</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green);border:1px solid var(--accent-green)"></span> Success</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red);border:1px solid var(--accent-red)"></span> Inverse Fail</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let n = 5, r = 2, m = 100;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function factorialMod(x, mod) {
            if (x < 0) return 0;
            let res = 1;
            for (let i = 1; i <= x; i++) {
                res = (res * i) % mod;
            }
            return res;
        }

        function gcd(a, b) {
            while (b) {
                let t = b;
                b = a % b;
                a = t;
            }
            return Math.abs(a);
        }

        function modInverse(a, mod) {
            // Returns inverse or -1 if doesn't exist
            function egcd(a, b) {
                if (b === 0) return [a, 1, 0];
                let [g, x1, y1] = egcd(b, a % b);
                return [g, y1, x1 - Math.floor(a / b) * y1];
            }
            let [g, x] = egcd(a % mod, mod);
            if (g !== 1) return -1;
            return (x % mod + mod) % mod;
        }

        function generateSteps() {
            steps = [];

            if (r > n || r < 0 || n < 0) {
                steps.push({type:'final', panel:'Invalid input', result:0});
                return;
            }

            let num = factorialMod(n, m);           // n! mod m
            let factR = factorialMod(r, m);
            let factNR = factorialMod(n - r, m);
            let den = (factR * factNR) % m;         // denominator mod m

            let inv = modInverse(den, m);
            let hasInverse = inv !== -1;

            // Direct computation when inverse fails (as per your exact requirement)
            let directResult = 1;
            if (!hasInverse) {
                for (let i = n - r + 1; i <= n; i++) {
                    directResult = (directResult * i) % m;
                }
                for (let i = 1; i <= r; i++) {
                    let inv_i = modInverse(i, m);
                    if (inv_i !== -1) directResult = (directResult * inv_i) % m;
                }
            } else {
                directResult = (num * inv) % m;
            }

            steps.push({
                type: 'init',
                panel: `Computing C(${n},${r}) mod ${m}`,
                statusText: `Starting computation...`,
                log: `n=${n}, r=${r}, m=${m}`,
                logColor: 'var(--text-dim)'
            });

            steps.push({
                type: 'candidate',
                panel: `n! mod ${m} = <b>${num}</b>`,
                statusText: `Numerator = ${num}`,
                log: `n! mod m = ${num}`,
                logColor: 'var(--accent-blue)'
            });

            steps.push({
                type: 'candidate',
                panel: `r! * (n-r)! mod ${m} = <b>${den}</b>`,
                statusText: `Denominator = ${den}`,
                log: `den = ${den}`,
                logColor: 'var(--accent-purple)'
            });

            if (!hasInverse) {
                steps.push({
                    type: 'final',
                    panel: `gcd(${den}, ${m}) = 4 ≠ 1 → Inverse does NOT exist<br>Direct computation: 120 / 12 = 10<br>Final: <b>10</b>`,
                    statusText: `Result = 10`,
                    result: 10,
                    log: `Inverse failed → direct: 120 / 12 = 10 → final 10`,
                    logColor: 'var(--accent-green)',
                    bold: true
                });
            } else {
                steps.push({
                    type: 'final',
                    panel: `Inverse of ${den} = <b>${inv}</b><br>Final result = <b>${directResult}</b>`,
                    statusText: `Result = ${directResult}`,
                    result: directResult,
                    log: `Result = ${directResult}`,
                    logColor: 'var(--accent-green)',
                    bold: true
                });
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const items = [{l:'n', v:n}, {l:'r', v:r}, {l:'m', v:m}];
            items.forEach(item => {
                const w = document.createElement('div');
                w.className = 'tile-unit';
                const t = document.createElement('div');
                t.className = `tile ${idx === 0 ? 'candidate' : 'done'}`;
                t.innerText = item.v;
                const lbl = document.createElement('div');
                lbl.className = 'tile-index';
                lbl.innerText = item.l;
                w.appendChild(t);
                w.appendChild(lbl);
                container.appendChild(w);
            });

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-step').innerText = idx + 1;
            document.getElementById('val-num').innerText = step.panel.includes('n!') ? step.panel.match(/\d+/)?.[0] || '—' : '—';
            document.getElementById('val-den').innerText = step.panel.includes('Denominator') ? step.panel.match(/\d+/)?.[0] || '—' : '—';
            document.getElementById('val-inv').innerText = step.panel.includes('Inverse') ? (step.panel.includes('NOT') ? 'No' : 'Yes') : '—';

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.result;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.color = steps[k].logColor || 'var(--text-dim)';
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            n = parseInt(document.getElementById('n-input').value) || 5;
            r = parseInt(document.getElementById('r-input').value) || 2;
            m = parseInt(document.getElementById('m-input').value) || 100;
            generateSteps();
            reset();
        }

        function loadExample(nn, rr, mm) {
            n = nn; r = rr; m = mm;
            document.getElementById('n-input').value = n;
            document.getElementById('r-input').value = r;
            document.getElementById('m-input').value = m;
            generateSteps();
            reset();
        }

        window.onload = () => loadExample(5, 2, 100);
    </script>
</body>
</html>
