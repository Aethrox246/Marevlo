<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discrete Root - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 100px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; 
            max-width: 920px; min-height: 110px; position: relative;
        }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
        .tile {
            min-width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 21px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); box-shadow: 0 0 14px rgba(227,179,65,0.5); z-index: 2; }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.1); box-shadow: 0 0 12px var(--accent-green); z-index: 3; }
        .tile.failed { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-red); }
        .tile.done { opacity: 0.55; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 26px; width: 760px; text-align: center; 
            font-family: monospace; min-height: 95px; line-height: 1.55;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 16px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 11px 20px; display: flex; flex-direction: column; align-items: center; 
            min-width: 135px; gap: 6px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        /* RESULT */
        .result-display { margin-top: 16px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 23px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 420ms ease; color: var(--accent-green) !important; font-size: 29px !important; text-shadow: 0 0 16px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 12px; font-size: 13px; color: var(--text-dim); height: 1.5em; text-align: center; width: 720px; }

        /* CONTROLS */
        .controls { margin-top: 30px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 18px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 13px; height: 13px; border-radius: 3px; margin-right: 8px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 22px; width: 780px; max-width: 95%; height: 150px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">a =</label>
        <input type="number" id="a-input" value="4" style="width:80px;">
        <label class="ui-label">k =</label>
        <input type="number" id="k-input" value="2" style="width:80px;">
        <label class="ui-label">p =</label>
        <input type="number" id="p-input" value="7" style="width:80px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(4,2,7)">Ex 1 (4,2,7)</button>
        <button onclick="loadExample(1,3,5)">Ex 2 (1,3,5)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force Search for x where x^k ≡ a (mod p)</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current x</span>
            <span class="info-value" id="val-x" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">x^k mod p</span>
            <span class="info-value" id="val-power" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Matches Found</span>
            <span class="info-value" id="val-matches" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Solutions =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:5px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Testing x</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Match Found</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red); border:1px solid var(--accent-red)"></span> No Match</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let a = 4;
        let k = 2;
        let p = 7;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(4, 2, 7); }

        function loadExample(newA, newK, newP) {
            a = parseInt(newA);
            k = parseInt(newK);
            p = parseInt(newP);
            document.getElementById('a-input').value = a;
            document.getElementById('k-input').value = k;
            document.getElementById('p-input').value = p;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const aVal = parseInt(document.getElementById('a-input').value);
            const kVal = parseInt(document.getElementById('k-input').value);
            const pVal = parseInt(document.getElementById('p-input').value);
            if (!isNaN(aVal) && !isNaN(kVal) && !isNaN(pVal) && pVal > 1) {
                a = aVal;
                k = kVal;
                p = pVal;
                generateSteps();
                reset();
            } else {
                alert("Please enter valid a, k, p (p > 1)");
            }
        }

        function generateSteps() {
            steps = [];
            let solutions = [];

            steps.push({
                type: 'init',
                panel: `Discrete Root: Find x such that x<sup>${k}</sup> ≡ ${a} (mod ${p})<br>Brute force check x from 0 to ${p-1}`,
                statusText: `Searching for solutions...`,
                log: `a=${a}, k=${k}, p=${p}\nIterating x=0 to ${p-1}`,
                logColor: 'var(--text-dim)',
                currentX: '—',
                power: '—',
                matches: '[]'
            });

            for (let x = 0; x < p; x++) {
                // Compute x^k mod p using pow
                let power = 1;
                let base = x % p;
                let exp = k;
                while (exp > 0) {
                    if (exp % 2 === 1) {
                        power = (power * base) % p;
                    }
                    base = (base * base) % p;
                    exp = Math.floor(exp / 2);
                }

                steps.push({
                    type: 'test',
                    panel: `x = <b>${x}</b><br>x<sup>${k}</sup> mod ${p} = <b>${power}</b>`,
                    statusText: `x=${x}, power=${power}`,
                    log: `x=${x} → ${x}^${k} mod ${p} = ${power}`,
                    logColor: power === a ? 'var(--accent-green)' : 'var(--text-main)',
                    currentX: x,
                    power: power,
                    matches: JSON.stringify(solutions)
                });

                if (power === a) {
                    solutions.push(x);
                    steps.push({
                        type: 'match',
                        panel: `<span style="color:var(--accent-green)">Match found! x = <b>${x}</b></span>`,
                        statusText: `Solution: ${x}`,
                        log: `✓ Found solution x=${x}`,
                        logColor: 'var(--accent-green)',
                        currentX: x,
                        power: power,
                        matches: JSON.stringify(solutions)
                    });
                }
            }

            steps.push({
                type: 'final',
                panel: `Search complete!<br>Solutions: <b>[${solutions.join(', ')}]</b>`,
                statusText: `Found ${solutions.length} solution(s)`,
                log: `Final solutions: [${solutions.join(', ')}]`,
                logColor: 'var(--accent-green)',
                bold: true,
                currentX: '—',
                power: '—',
                matches: JSON.stringify(solutions)
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show current x as main tile
            const wrapper = document.createElement('div');
            wrapper.className = 'tile-unit';

            const tile = document.createElement('div');
            tile.className = `tile ${step.type === 'match' || (step.type === 'final' && step.logColor.includes('green')) ? 'winning' : (step.type === 'test' ? 'candidate' : 'done')}`;
            tile.innerText = step.currentX !== undefined ? step.currentX : '?';

            const idxLabel = document.createElement('div');
            idxLabel.className = 'tile-index';
            idxLabel.innerText = `x = ${step.currentX !== undefined ? step.currentX : '?'}`;

            wrapper.append(tile, idxLabel);
            container.appendChild(wrapper);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-x').innerText = step.currentX !== undefined ? step.currentX : '—';
            document.getElementById('val-power').innerText = step.power !== undefined ? step.power : '—';
            document.getElementById('val-matches').innerText = step.matches || '[]';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.type === 'final' ? `[${step.matches.replace(/[\[\]]/g,'')}]` : '—';
            if (step.type === 'final') {
                resVal.className = 'pop';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
