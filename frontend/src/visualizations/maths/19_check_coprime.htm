<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Coprime - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 140px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 820px; min-height: 120px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 26px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 12px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.common { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(1.22); box-shadow: 0 0 18px var(--accent-red); }
        .tile.coprime { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.22); box-shadow: 0 0 18px var(--accent-green); }

        .action-panel {
            margin-top: 30px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 22px; width: 720px; text-align: center; font-family: monospace;
            min-height: 125px; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 16px; display: flex; flex-direction: column; align-items: center; min-width: 115px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .result-display { margin-top: 18px; text-align: center; }
        #res-val { font-size: 38px; font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop-true { color: var(--accent-green) !important; text-shadow: 0 0 20px var(--accent-green); animation: popAnim 600ms; }
        .pop-false { color: var(--accent-red) !important; text-shadow: 0 0 20px var(--accent-red); animation: popAnim 600ms; }

        @keyframes popAnim { 0%{transform:scale(0.6)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; width: 620px; text-align: center; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 14px; height: 14px; border-radius: 3px; margin-right: 7px; }

        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 740px; max-width: 95%; height: 155px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">a =</label>
        <input type="number" id="num-a" value="8">
        <label class="ui-label">b =</label>
        <input type="number" id="num-b" value="15">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(8,15)">Ex 1 (8,15)</button>
        <button onclick="loadExample(12,18)">Ex 2 (12,18)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Checking for common divisors from 2 to min(a,b)</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Number A</span>
            <span class="info-value" id="val-a" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Number B</span>
            <span class="info-value" id="val-b" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Checking i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Common Divisor?</span>
            <span class="info-value" id="val-status" style="color:var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="font-size:18px;">Are they Coprime? = </span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:2px solid var(--accent-orange)"></span> Checking i</div>
        <div class="legend-item"><span class="dot" style="background:#2a0d0d;border:2px solid var(--accent-red)"></span> Common Divisor Found</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:2px solid var(--accent-green)"></span> Coprime</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let numA = 8, numB = 15;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() { loadExample(8, 15); }

        function loadExample(a, b) {
            numA = a; numB = b;
            document.getElementById('num-a').value = numA;
            document.getElementById('num-b').value = numB;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const a = parseInt(document.getElementById('num-a').value);
            const b = parseInt(document.getElementById('num-b').value);
            if (!isNaN(a) && !isNaN(b) && a > 0 && b > 0) {
                loadExample(a, b);
            } else {
                alert("Please enter valid positive integers.");
            }
        }

        function generateSteps() {
            steps = [];
            let a = numA, b = numB;
            let minVal = Math.min(a, b);

            steps.push({
                type: 'init',
                a: a, b: b, i: '—', status: '—',
                panel: `Check if <b>${a}</b> and <b>${b}</b> are coprime.<br>Two numbers are coprime if they have no common divisor greater than 1.`,
                status: `Starting check for ${a} and ${b}`,
                log: `a = ${a}, b = ${b}\nmin = ${minVal}\nChecking from 2 to ${minVal}`
            });

            let isCoprime = true;
            for (let i = 2; i <= minVal; i++) {
                let remA = a % i;
                let remB = b % i;

                steps.push({
                    type: 'check',
                    a: a, b: b, i: i, status: (remA === 0 && remB === 0) ? 'Common' : 'No',
                    panel: `Checking i = <b>${i}</b><br>${a} % ${i} = ${remA}<br>${b} % ${i} = ${remB}`,
                    status: (remA === 0 && remB === 0) ? `Common divisor found: ${i}` : `No common divisor`,
                    log: `i=${i} | ${a}%${i}=${remA} | ${b}%${i}=${remB}`
                });

                if (remA === 0 && remB === 0) {
                    isCoprime = false;
                    steps.push({
                        type: 'final',
                        a: a, b: b, i: i, status: 'Not Coprime',
                        panel: `<span style="color:var(--accent-red)">Found common divisor <b>${i}</b></span><br><b>${a}</b> and <b>${b}</b> are NOT coprime.`,
                        status: `Result: False`,
                        log: `Final Result: False (common divisor = ${i})`,
                        isTrue: false
                    });
                    break;
                }
            }

            if (isCoprime) {
                steps.push({
                    type: 'final',
                    a: a, b: b, i: '—', status: 'Coprime',
                    panel: `<span style="color:var(--accent-green)">No common divisor found.</span><br><b>${a}</b> and <b>${b}</b> are coprime (GCD = 1).`,
                    status: `Result: True`,
                    log: `Final Result: True`,
                    isTrue: true
                });
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Tile for A
            const tileA = document.createElement('div');
            tileA.className = 'tile-unit';
            const divA = document.createElement('div');
            divA.className = `tile ${step.type === 'final' && step.status === 'Coprime' ? 'coprime' : 'candidate'}`;
            divA.innerText = step.a;
            const labelA = document.createElement('div');
            labelA.className = 'tile-index';
            labelA.innerText = 'A';
            tileA.append(divA, labelA);
            container.appendChild(tileA);

            // Tile for B
            const tileB = document.createElement('div');
            tileB.className = 'tile-unit';
            const divB = document.createElement('div');
            divB.className = `tile ${step.type === 'final' && step.status === 'Coprime' ? 'coprime' : 'candidate'}`;
            divB.innerText = step.b;
            const labelB = document.createElement('div');
            labelB.className = 'tile-index';
            labelB.innerText = 'B';
            tileB.append(divB, labelB);
            container.appendChild(tileB);

            // Checking i
            if (step.i !== '—') {
                const tileI = document.createElement('div');
                tileI.className = 'tile-unit';
                const divI = document.createElement('div');
                divI.className = `tile ${step.status === 'Common' ? 'common' : 'candidate'}`;
                divI.innerText = step.i;
                const labelI = document.createElement('div');
                labelI.className = 'tile-index';
                labelI.innerText = 'i';
                tileI.append(divI, labelI);
                container.appendChild(tileI);
            }

            document.getElementById('main-panel').innerHTML = step.panel;

            document.getElementById('val-a').innerText = step.a;
            document.getElementById('val-b').innerText = step.b;
            document.getElementById('val-i').innerText = step.i;
            document.getElementById('val-status').innerText = step.status;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.type === 'final' ? (step.isTrue ? "True" : "False") : "—";
            resVal.className = step.type === 'final' ? (step.isTrue ? 'pop-true' : 'pop-false') : '';

            document.getElementById('status-text').innerText = step.status;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    line.innerText = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // Navigation functions (same as previous)
        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
