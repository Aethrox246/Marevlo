<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subset GCD - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 220px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 100px; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 24px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* States */
        .tile.included { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 15px rgba(227, 179, 65, 0.5); }
        .tile.excluded { opacity: 0.25; }
        .tile.gcd-computing { border-color: var(--accent-purple); color: var(--accent-purple); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.2); box-shadow: 0 0 20px var(--accent-green); }

        /* Mask Display */
        .mask-display {
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .bit {
            width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--border-main); border-radius: 4px; background: #21262d;
        }
        .bit.active { background: var(--accent-orange); color: black; border-color: var(--accent-orange); }

        /* PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; text-align: center; font-family: monospace;
            min-height: 85px; font-size: 15px; line-height: 1.5;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 15px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 16px; display: flex; flex-direction: column; align-items: center; min-width: 110px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        /* RESULT */
        .result-display { margin-top: 15px; text-align: center; }
        #res-val { font-size: 28px; font-weight: bold; font-family: monospace; transition: all 0.4s; }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; }

        @keyframes popAnim { 0%{transform:scale(0.8)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* STATUS & CONTROLS */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 700px; }
        .controls { margin-top: 25px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 15px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 18px; width: 720px; max-width: 95%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="num-input" placeholder="[2, 3, 5]" value="[2, 3, 5]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample('[2,3,5]')">Ex 1</button>
        <button onclick="loadExample('[1,1,1]')">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Array Elements</div>
        <div class="tiles-wrapper" id="tiles-container"></div>

        <div class="ui-label" style="margin-top:10px;">Current Mask (Binary)</div>
        <div class="mask-display" id="mask-display"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Mask</span>
            <span class="info-value" id="val-mask" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Subset</span>
            <span class="info-value" id="val-subset" style="color: var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running GCD</span>
            <span class="info-value" id="val-gcd" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Count so far</span>
            <span class="info-value" id="val-count" style="color: var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Subsets with GCD = 1</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:5px; font-size:12px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-orange);border-radius:3px;margin-right:6px;"></span>Included in subset</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:3px;margin-right:6px;"></span>GCD being computed</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:3px;margin-right:6px;"></span>GCD = 1 (Valid)</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [2, 3, 5];
        let n = 0;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            loadExample('[2,3,5]');
        }

        function loadExample(str) {
            try {
                arr = JSON.parse(str);
            } catch(e) {
                arr = [2,3,5];
            }
            document.getElementById('num-input').value = JSON.stringify(arr);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('num-input').value.trim();
            if (val) loadExample(val);
        }

        function gcd(a, b) {
            while (b !== 0) {
                let t = b;
                b = a % b;
                a = t;
            }
            return Math.abs(a);
        }

        function generateSteps() {
            steps = [];
            n = arr.length;
            let totalCount = 0;

            // INIT
            steps.push({
                type: 'init',
                mask: -1,
                subset: [],
                currentGCD: 0,
                count: 0,
                panel: `Problem: Count non-empty subsets of <b>[${arr.join(', ')}]</b> with <b>GCD = 1</b>.<br>Total possible subsets = 2<sup>${n}</sup> = ${1<<n}.`,
                statusText: `Starting brute force enumeration using bitmasks...`,
                log: `Array = [${arr.join(', ')}]\nn = ${n}\nTotal masks = ${1<<n}\nCount = 0`,
                logColor: 'var(--text-dim)'
            });

            for (let mask = 0; mask < (1 << n); mask++) {
                let subset = [];
                let indices = [];
                for (let i = 0; i < n; i++) {
                    if (mask & (1 << i)) {
                        subset.push(arr[i]);
                        indices.push(i);
                    }
                }

                // Step: Select Mask
                steps.push({
                    type: 'select',
                    mask: mask,
                    subset: [...subset],
                    indices: indices,
                    currentGCD: 0,
                    count: totalCount,
                    panel: `Mask <b>${mask}</b> (binary: ${mask.toString(2).padStart(n, '0')})<br>Subset: <b>[${subset.join(', ')}]</b>`,
                    statusText: `Processing mask ${mask}`,
                    log: `\nMask ${mask} (${mask.toString(2).padStart(n,'0')}) → [${subset.join(', ')}]`,
                    logColor: 'var(--text-main)'
                });

                if (subset.length === 0) {
                    steps.push({
                        type: 'empty',
                        mask: mask,
                        subset: [],
                        currentGCD: 0,
                        count: totalCount,
                        panel: `Empty subset (mask 0). GCD undefined → skipped.`,
                        statusText: `Skipping empty subset`,
                        log: `  Empty → skipped`,
                        logColor: 'var(--text-dim)'
                    });
                    continue;
                }

                // Compute GCD step by step
                let runningGCD = 0;
                let gcdSteps = [];

                for (let i = 0; i < subset.length; i++) {
                    const prev = runningGCD;
                    runningGCD = gcd(runningGCD, subset[i]);
                    gcdSteps.push({
                        idx: indices[i],
                        val: subset[i],
                        prevGCD: prev,
                        newGCD: runningGCD
                    });
                }

                // GCD computation steps
                gcdSteps.forEach((gstep, idx) => {
                    steps.push({
                        type: 'gcd',
                        mask: mask,
                        subset: [...subset],
                        indices: indices,
                        currentGCD: gstep.newGCD,
                        count: totalCount,
                        panel: `Computing GCD:<br><code>gcd(${gstep.prevGCD}, ${gstep.val}) = ${gstep.newGCD}</code>`,
                        statusText: `GCD update: ${gstep.prevGCD} → ${gstep.newGCD}`,
                        log: `  gcd(${gstep.prevGCD}, ${gstep.val}) = ${gstep.newGCD}`,
                        logColor: 'var(--accent-purple)'
                    });
                });

                // Final decision
                if (runningGCD === 1) {
                    totalCount++;
                    steps.push({
                        type: 'valid',
                        mask: mask,
                        subset: [...subset],
                        currentGCD: 1,
                        count: totalCount,
                        panel: `<span style="color:var(--accent-green)">✓ GCD = 1 → Valid subset! Count increased to ${totalCount}</span>`,
                        statusText: `Valid! Count = ${totalCount}`,
                        log: `  → GCD=1 ✓ Count = ${totalCount}`,
                        logColor: 'var(--accent-green)'
                    });
                } else {
                    steps.push({
                        type: 'invalid',
                        mask: mask,
                        subset: [...subset],
                        currentGCD: runningGCD,
                        count: totalCount,
                        panel: `GCD = <b>${runningGCD}</b> ≠ 1 → Not counted`,
                        statusText: `GCD = ${runningGCD} → skipped`,
                        log: `  → GCD=${runningGCD} ✗`,
                        logColor: 'var(--accent-red)'
                    });
                }
            }

            // FINAL
            steps.push({
                type: 'final',
                mask: -1,
                subset: [],
                currentGCD: -1,
                count: totalCount,
                panel: `Enumeration complete.<br>Total subsets with <b>GCD = 1</b>: <b>${totalCount}</b>`,
                statusText: `Done. Final answer = ${totalCount}`,
                log: `\nFinal Result: ${totalCount}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render tiles
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            for (let i = 0; i < n; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = arr[i];

                if (step.indices && step.indices.includes(i)) {
                    tile.classList.add('included');
                } else if (step.mask !== -1) {
                    tile.classList.add('excluded');
                }

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `idx ${i}`;

                wrapper.appendChild(tile);
                wrapper.appendChild(idxLabel);
                container.appendChild(wrapper);
            }

            // Mask display
            const maskDiv = document.getElementById('mask-display');
            maskDiv.innerHTML = '';
            if (step.mask >= 0) {
                const bin = step.mask.toString(2).padStart(n, '0');
                for (let c of bin) {
                    const bit = document.createElement('div');
                    bit.className = 'bit';
                    bit.textContent = c;
                    if (c === '1') bit.classList.add('active');
                    maskDiv.appendChild(bit);
                }
            } else {
                maskDiv.innerHTML = '<span style="color:var(--text-dim)">—</span>';
            }

            // Panels
            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-mask').innerText = step.mask >= 0 ? step.mask : '—';
            document.getElementById('val-subset').innerText = step.subset.length ? `[${step.subset.join(', ')}]` : '—';
            document.getElementById('val-gcd').innerText = step.currentGCD >= 0 ? step.currentGCD : '—';
            document.getElementById('val-count').innerText = step.count;

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.count;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
