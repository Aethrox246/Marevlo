<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subarray GCD Count - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 180px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .equation-box {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: 600;
            background: var(--bg-surface);
            padding: 14px 28px;
            border-radius: 8px;
            border: 1px solid var(--border-main);
        }

        .array-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 920px;
            min-height: 80px;
        }

        .array-tile {
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 6px;
            padding: 10px 14px;
            font-family: 'Courier New', monospace;
            font-size: 17px;
            min-width: 48px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .array-tile.highlight { 
            border-color: var(--accent-orange); 
            color: var(--accent-orange); 
            transform: scale(1.08); 
            box-shadow: 0 0 15px rgba(227,179,65,0.5); 
        }

        /* PANEL */
        .action-panel {
            margin-top: 30px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 16px 24px;
            width: 740px;
            text-align: center;
            font-family: monospace;
            min-height: 110px;
            font-size: 15px;
            line-height: 1.6;
        }

        /* INFO PANEL */
        .info-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info-cell {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 10px 18px;
            min-width: 130px;
            text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        /* RESULT */
        .result-display {
            margin-top: 20px;
            text-align: center;
        }
        #res-val {
            font-size: 26px;
            font-family: monospace;
            font-weight: bold;
            transition: all 0.4s;
        }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 32px !important; }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; }
        .controls {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: var(--text-dim);
        }

        .log-panel {
            margin-top: 20px;
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 14px 18px;
            width: 740px;
            max-width: 95%;
            height: 160px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="arr-input" value="[4,2,6]">
        <label class="ui-label">k =</label>
        <input type="number" id="k-input" value="2">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([4,2,6],2)">Ex 1 (→ 4)</button>
        <button onclick="loadExample([1,2,3],1)">Ex 2 (→ 4)</button>
    </div>

    <div class="visual-container">
        <div class="equation-box" id="equation-display">Count subarrays with GCD = 2 in [4,2,6]</div>
        <div class="array-wrapper" id="array-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Start i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">End j</span>
            <span class="info-value" id="val-j" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running GCD</span>
            <span class="info-value" id="val-gcd" style="color:var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Total Count</span>
            <span class="info-value" id="val-count" style="color:var(--text-main);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Final Count of Subarrays with GCD = k =</span><br>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px; font-size:11px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#2a1600;border:1px solid var(--accent-orange);border-radius:3px;"></span> Current subarray [i..j]</div>
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#0f2a1a;border:1px solid var(--accent-green);border-radius:3px;"></span> GCD == k</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [4, 2, 6];
        let k = 2;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() {
            loadExample([4, 2, 6], 2);
        }

        function loadExample(newArr, newK) {
            arr = newArr;
            k = parseInt(newK);
            document.getElementById('arr-input').value = JSON.stringify(arr);
            document.getElementById('k-input').value = k;
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const aStr = document.getElementById('arr-input').value.trim();
                const parsedArr = JSON.parse(aStr);
                const parsedK = parseInt(document.getElementById('k-input').value);
                if (Array.isArray(parsedArr) && !isNaN(parsedK)) {
                    loadExample(parsedArr, parsedK);
                } else {
                    alert("Invalid input. Use array like [4,2,6] and k value.");
                }
            } catch(e) {
                alert("Invalid JSON for array.");
            }
        }

        function gcd(x, y) {
            x = Math.abs(x); y = Math.abs(y);
            while (y !== 0) {
                let t = y;
                y = x % y;
                x = t;
            }
            return x;
        }

        function generateSteps() {
            steps = [];
            document.getElementById('equation-display').innerText = `Count subarrays with GCD = ${k} in ${JSON.stringify(arr)}`;

            let totalCount = 0;

            steps.push({
                type: 'init',
                i: '—',
                j: '—',
                currentGCD: '—',
                count: 0,
                panel: `Array: <b>${JSON.stringify(arr)}</b><br>k = <b>${k}</b><br>Brute force: check every subarray [i..j]`,
                statusText: `Starting count of subarrays with GCD == ${k}`,
                log: `arr = ${JSON.stringify(arr)}\nk = ${k}\nInitialize count = 0`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < arr.length; i++) {
                let currentGCD = 0;

                steps.push({
                    type: 'new_start',
                    i: i,
                    j: i,
                    currentGCD: currentGCD,
                    count: totalCount,
                    panel: `New start i = <b>${i}</b><br>Reset running GCD`,
                    statusText: `Start subarrays at i=${i}`,
                    log: `\nStart i=${i}`,
                    logColor: 'var(--accent-purple)'
                });

                for (let j = i; j < arr.length; j++) {
                    currentGCD = gcd(currentGCD, arr[j]);

                    if (currentGCD === k) {
                        totalCount++;
                    }

                    steps.push({
                        type: 'extend',
                        i: i,
                        j: j,
                        currentGCD: currentGCD,
                        count: totalCount,
                        panel: `Subarray [${i}..${j}] = ${JSON.stringify(arr.slice(i,j+1))}<br>Running GCD = <b>${currentGCD}</b>`,
                        statusText: `[${i}..${j}] → GCD=${currentGCD} ${currentGCD===k ? '(match)' : ''}`,
                        log: `  [${i}..${j}] : GCD = ${currentGCD} ${currentGCD===k ? '✓ count=' + totalCount : ''}`,
                        logColor: currentGCD === k ? 'var(--accent-green)' : 'var(--accent-orange)'
                    });
                }
            }

            steps.push({
                type: 'final',
                i: '—',
                j: '—',
                currentGCD: '—',
                count: totalCount,
                panel: `All subarrays processed.<br>Total count = <b>${totalCount}</b>`,
                statusText: `Done. Total = ${totalCount}`,
                log: `\nFinal count of subarrays with GCD = ${k} is ${totalCount}`,
                logColor: 'var(--accent-green)',
                result: totalCount
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('array-container');
            container.innerHTML = '';

            for (let pos = 0; pos < arr.length; pos++) {
                const tile = document.createElement('div');
                tile.className = `array-tile ${step.i !== '—' && pos >= step.i && pos <= (step.j || step.i) ? 'highlight' : ''}`;
                tile.innerHTML = arr[pos];
                container.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== '—' ? step.i : '—';
            document.getElementById('val-j').innerText = step.j !== '—' ? step.j : '—';
            document.getElementById('val-gcd').innerText = step.currentGCD !== '—' ? step.currentGCD : '—';
            document.getElementById('val-count').innerText = step.count;

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.result;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
