<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Factorial Mod p^k - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; font-size: 13px; width: 120px;
        }
        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; 
            max-width: 900px; min-height: 130px; 
        }
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 20px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 15px var(--accent-green); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; text-align: center; 
            font-family: monospace; min-height: 90px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; }

        .result-display { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 30px !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px;}
        .controls { margin-top: 25px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        .legend { margin-top: 15px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        .log-panel {
            margin-top: 15px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 95%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="text" id="n-input" value="5">
        <label class="ui-label">p =</label>
        <input type="text" id="p-input" value="2">
        <label class="ui-label">k =</label>
        <input type="text" id="k-input" value="3">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (n=5, p=2, k=3)</button>
        <button onclick="loadExample(1)">Ex 2 (n=4, p=3, k=2)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Current i = <span id="current-i" style="color:var(--accent-orange)">—</span></div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Result</span>
            <span class="info-value" id="val-result" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Product mod p^k</span>
            <span class="info-value" id="val-mod" style="color: var(--accent-purple);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">n! mod p^k =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Final Result</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nVal = 5;
        let pVal = 2;
        let kVal = 3;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            if (ex === 0) {
                nVal = 5; pVal = 2; kVal = 3;
                document.getElementById('n-input').value = "5";
                document.getElementById('p-input').value = "2";
                document.getElementById('k-input').value = "3";
            } else {
                nVal = 4; pVal = 3; kVal = 2;
                document.getElementById('n-input').value = "4";
                document.getElementById('p-input').value = "3";
                document.getElementById('k-input').value = "2";
            }
            generateSteps();
            reset();
        }

        function loadCustom() {
            nVal = parseInt(document.getElementById('n-input').value) || 5;
            pVal = parseInt(document.getElementById('p-input').value) || 2;
            kVal = parseInt(document.getElementById('k-input').value) || 3;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let mod = Math.pow(pVal, kVal);
            let result = 1;

            steps.push({
                type: 'init',
                i: '—',
                currentResult: '1',
                modValue: '—',
                panel: `Computing ${nVal}! mod ${pVal}^${kVal} = ${nVal}! mod ${mod}`,
                status: `Starting factorial computation...`,
                log: `n = ${nVal}\np = ${pVal}, k = ${kVal}\nmod = ${mod}\nresult = 1`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 1; i <= nVal; i++) {
                let oldResult = result;
                result = (result * i) % mod;

                steps.push({
                    type: (i === nVal) ? 'winning' : 'candidate',
                    i: i,
                    currentResult: result,
                    modValue: `${oldResult} * ${i} = ${oldResult * i} mod ${mod} = ${result}`,
                    panel: `Multiplying by ${i}<br>result = (${oldResult} * ${i}) mod ${mod} = ${result}`,
                    status: `i=${i} → result = ${result}`,
                    log: `i=${i}: (${oldResult} * ${i}) mod ${mod} = ${result}`,
                    logColor: 'var(--accent-green)'
                });
            }

            steps.push({
                type: 'final',
                i: nVal,
                currentResult: result,
                modValue: `${result}`,
                panel: `Computation complete.<br>${nVal}! mod ${pVal}^${kVal} = <b>${result}</b>`,
                status: `Final result = ${result}`,
                log: `Final: ${nVal}! mod ${mod} = ${result}`,
                logColor: 'var(--accent-green)',
                complete: true,
                result: result
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            if (step.i !== '—') {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${step.type === 'winning' ? 'winning' : 'candidate'}`;
                tile.innerText = step.i;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = 'i';
                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-i').innerText = step.i || '—';
            document.getElementById('val-result').innerText = step.currentResult || '—';
            document.getElementById('val-mod').innerText = step.modValue || '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.result;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.status || '';
            document.getElementById('current-i').innerText = step.i || '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
