<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Number - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 160px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 10px; justify-content: center; align-items: center; 
            min-height: 110px; flex-wrap: wrap; max-width: 600px;
        }

        .digit-tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 28px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 2px solid var(--border-main); background: #21262d; color: var(--text-main);
            transition: all 0.4s ease;
        }

        .digit-tile.original { border-color: var(--accent-orange); }
        .digit-tile.reversed { border-color: var(--accent-green); }

        .arrow { font-size: 32px; color: var(--accent-blue); margin: 0 20px; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; width: 680px; text-align: center;
            font-family: monospace; min-height: 85px; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin-top: 15px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 20px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 26px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 34px !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 680px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 92%; height: 145px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" placeholder="123" value="123">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(123)">Ex 1 (123)</button>
        <button onclick="loadExample(-120)">Ex 2 (-120)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Reversing digits using mathematical iteration</div>
        <div class="tiles-wrapper" id="visual"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Original</span>
            <span class="info-value" id="val-orig" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Digit</span>
            <span class="info-value" id="val-digit" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Reversed So Far</span>
            <span class="info-value" id="val-rev" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Reversed number =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Remaining</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:1px solid var(--accent-green)"></span> Reversed</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputNumber = 123;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(123); }

        function loadExample(newNum) {
            inputNumber = parseInt(newNum);
            document.getElementById('num-input').value = inputNumber;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val)) loadExample(val);
            else alert("Please enter a valid integer.");
        }

        function generateSteps() {
            steps = [];
            let n = inputNumber;
            let reversed = 0;
            const isNegative = n < 0;
            let original = n;

            if (isNegative) n = Math.abs(n);

            // Step 0: Init
            steps.push({
                type: 'init',
                remaining: n,
                reversed: 0,
                panel: `Reversing digits of <b>${original}</b>.<br>Using mathematical iteration (modulo + division).`,
                statusText: `Starting with n = ${original}`,
                log: `Input: ${original}`,
                logColor: 'var(--text-dim)'
            });

            if (original === 0) {
                steps.push({
                    type: 'final',
                    remaining: 0,
                    reversed: 0,
                    panel: `<span style="color:var(--accent-green)">0 reversed is 0</span>`,
                    statusText: `Result: 0`,
                    log: `Special case: 0 → 0`,
                    logColor: 'var(--accent-green)',
                    complete: true
                });
                return;
            }

            while (n > 0) {
                const digit = n % 10;
                const prevReversed = reversed;
                reversed = reversed * 10 + digit;
                const prevN = n;
                n = Math.floor(n / 10);

                steps.push({
                    type: 'step',
                    remaining: n,
                    reversed: reversed,
                    digit: digit,
                    panel: `Extracted digit: <b>${digit}</b><br>Reversed so far: <code>${prevReversed} * 10 + ${digit} = ${reversed}</code>`,
                    statusText: `Digit ${digit} → reversed = ${reversed}`,
                    log: `digit = ${digit} | reversed = ${prevReversed}*10 + ${digit} = ${reversed}`,
                    logColor: 'var(--accent-blue)'
                });
            }

            if (isNegative) reversed = -reversed;

            steps.push({
                type: 'final',
                remaining: 0,
                reversed: reversed,
                panel: `All digits processed.<br>Final reversed number: <span style="color:var(--accent-green)"><b>${reversed}</b></span>`,
                statusText: `Done. Reversed = ${reversed}`,
                log: `Final Result: ${reversed}`,
                logColor: 'var(--accent-green)',
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('visual');
            container.innerHTML = `
                <div style="display:flex; align-items:center; gap:15px;">
                    <div style="text-align:center;">
                        <div style="font-size:12px; color:var(--text-dim); margin-bottom:4px;">REMAINING</div>
                        <div class="digit-tile original">${step.remaining}</div>
                    </div>
                    <div style="font-size:36px; color:var(--accent-blue);">→</div>
                    <div style="text-align:center;">
                        <div style="font-size:12px; color:var(--text-dim); margin-bottom:4px;">REVERSED</div>
                        <div class="digit-tile reversed">${step.reversed}</div>
                    </div>
                </div>
            `;

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-orig').innerText = inputNumber;
            document.getElementById('val-digit').innerText = step.digit !== undefined ? step.digit : '—';
            document.getElementById('val-rev').innerText = step.reversed;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.reversed;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
