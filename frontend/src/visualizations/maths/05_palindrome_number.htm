<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Number Check - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 160px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; 
            max-width: 800px; min-height: 100px; position: relative; 
        }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 24px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.match { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.1); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(1.15); }
        .tile.done { opacity: 0.45; background: #161b22; border-color: var(--border-main); }

        .action-panel {
            margin-top: 25px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; width: 700px; text-align: center;
            font-family: monospace; min-height: 85px; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 19px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 26px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 34px !important; text-shadow: 0 0 15px var(--accent-green); }
        .pop-false { animation: popAnim 500ms ease; color: var(--accent-red) !important; font-size: 34px !important; text-shadow: 0 0 15px var(--accent-red); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 700px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 92%; height: 145px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" placeholder="121" value="121">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(121)">Ex 1 (121)</button>
        <button onclick="loadExample(-121)">Ex 2 (-121)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Digits of n:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Left Pointer</span>
            <span class="info-value" id="val-left" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Right Pointer</span>
            <span class="info-value" id="val-right" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Left Digit</span>
            <span class="info-value" id="val-leftD" style="color: var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Right Digit</span>
            <span class="info-value" id="val-rightD" style="color: var(--text-main);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">is palindrome? =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600; border:1px solid var(--accent-orange)"></span> Comparing</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a; border:1px solid var(--accent-green)"></span> Match</div>
        <div class="legend-item"><span class="dot" style="background:#2a0d0d; border:1px solid var(--accent-red)"></span> Mismatch</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputNumber = 121;
        let digitsArr = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(121); }

        function loadExample(newNum) {
            inputNumber = parseInt(newNum);
            document.getElementById('num-input').value = inputNumber;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val)) loadExample(val);
            else alert("Please enter a valid integer.");
        }

        function generateSteps() {
            steps = [];
            const n = inputNumber;

            // Step 0: Init
            steps.push({
                type: 'init',
                left: '—', right: '—', valL: '—', valR: '—',
                digitsStates: [],
                panel: `Checking if <b>${n}</b> is a palindrome.`,
                statusText: `Input: ${n}`,
                log: `n = ${n}`,
                logColor: 'var(--text-dim)'
            });

            if (n < 0) {
                // Show digits including negative sign
                digitsArr = n.toString().split('');
                steps.push({
                    type: 'final',
                    left: '—', right: '—', valL: '—', valR: '—',
                    digitsStates: digitsArr.map(() => 'mismatch'),
                    panel: `<span style="color:var(--accent-red)">Negative number detected.</span><br>Palindromes cannot have a negative sign.`,
                    statusText: `Result: False`,
                    log: `n < 0 → Return False`,
                    logColor: 'var(--accent-red)',
                    complete: true,
                    isPalindrome: false
                });
                return;
            }

            // Positive number
            const nStr = n.toString();
            digitsArr = nStr.split('');
            const len = digitsArr.length;

            let left = 0;
            let right = len - 1;
            let isPalindrome = true;

            while (left < right) {
                const leftDigit = digitsArr[left];
                const rightDigit = digitsArr[right];

                steps.push({
                    type: 'compare',
                    left: left,
                    right: right,
                    valL: leftDigit,
                    valR: rightDigit,
                    digitsStates: digitsArr.map((_, i) => {
                        if (i === left || i === right) return 'candidate';
                        if (i < left || i > right) return 'done';
                        return 'idle';
                    }),
                    panel: `Compare digits at positions <b>${left}</b> and <b>${right}</b>:<br><code>'${leftDigit}' vs '${rightDigit}'</code>`,
                    statusText: `Comparing index ${left} and ${right}...`,
                    log: `Compare: digits[${left}]='${leftDigit}' vs digits[${right}]='${rightDigit}'`,
                    logColor: 'var(--text-main)'
                });

                if (leftDigit === rightDigit) {
                    steps.push({
                        type: 'match',
                        left: left,
                        right: right,
                        valL: leftDigit,
                        valR: rightDigit,
                        digitsStates: digitsArr.map((_, i) => (i === left || i === right) ? 'match' : (i < left || i > right ? 'done' : 'idle')),
                        panel: `<span style="color:var(--accent-green)">Digits match!</span><br>Moving pointers inward.`,
                        statusText: `Match found. Moving inward.`,
                        log: `Match → left++, right--`,
                        logColor: 'var(--accent-green)'
                    });
                    left++;
                    right--;
                } else {
                    isPalindrome = false;
                    steps.push({
                        type: 'mismatch',
                        left: left,
                        right: right,
                        valL: leftDigit,
                        valR: rightDigit,
                        digitsStates: digitsArr.map((_, i) => (i === left || i === right) ? 'mismatch' : 'done'),
                        panel: `<span style="color:var(--accent-red)">Mismatch found!</span><br>The number is NOT a palindrome.`,
                        statusText: `Mismatch! Not a palindrome.`,
                        log: `Mismatch → Return False`,
                        logColor: 'var(--accent-red)',
                        complete: true,
                        isPalindrome: false
                    });
                    break;
                }
            }

            if (isPalindrome) {
                steps.push({
                    type: 'final',
                    left: left,
                    right: right,
                    valL: '—',
                    valR: '—',
                    digitsStates: digitsArr.map(() => 'match'),
                    panel: `All pairs matched perfectly!<br><span style="color:var(--accent-green)">${n} is a palindrome.</span>`,
                    statusText: `All digits symmetric → True`,
                    log: `All pairs matched → Return True`,
                    logColor: 'var(--accent-green)',
                    complete: true,
                    isPalindrome: true
                });
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Always show digits (including for negative numbers)
            digitsArr.forEach((digit, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile ${step.digitsStates[i] || 'idle'}`;
                tile.innerText = digit;

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;

                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-left').innerText = step.left !== undefined ? step.left : '—';
            document.getElementById('val-right').innerText = step.right !== undefined ? step.right : '—';
            document.getElementById('val-leftD').innerText = step.valL !== undefined ? step.valL : '—';
            document.getElementById('val-rightD').innerText = step.valR !== undefined ? step.valR : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.isPalindrome ? "True" : "False";
                resVal.className = step.isPalindrome ? 'pop' : 'pop-false';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // Navigation functions (same as before)
        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
