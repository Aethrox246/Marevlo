<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discrete Log (Brute Force) - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 90px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .equation-box {
            font-family: 'Courier New', monospace;
            font-size: 26px;
            font-weight: 600;
            background: var(--bg-surface);
            padding: 14px 28px;
            border-radius: 8px;
            border: 1px solid var(--border-main);
        }

        .powers-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 920px;
            min-height: 140px;
        }

        .power-tile {
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            min-width: 100px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .power-tile.candidate {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
            transform: scale(1.08);
            box-shadow: 0 0 15px rgba(227, 179, 65, 0.5);
        }

        .power-tile.winning {
            border-color: var(--accent-green);
            color: var(--accent-green);
            transform: scale(1.15);
            box-shadow: 0 0 18px var(--accent-green);
        }

        .power-tile.failed {
            border-color: var(--accent-red);
            color: var(--accent-red);
            opacity: 0.65;
        }

        .action-panel {
            margin-top: 30px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 16px 24px;
            width: 740px;
            text-align: center;
            font-family: monospace;
            min-height: 95px;
            font-size: 15px;
            line-height: 1.6;
        }

        .info-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info-cell {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 10px 18px;
            min-width: 120px;
            text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .result-display {
            margin-top: 20px;
            text-align: center;
        }
        #res-val {
            font-size: 22px;
            font-family: monospace;
            font-weight: bold;
            transition: all 0.4s;
        }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 28px !important; }
        .pop-false { animation: popAnim 500ms ease; color: var(--accent-red) !important; font-size: 28px !important; }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; }
        .controls {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: var(--text-dim);
        }

        .log-panel {
            margin-top: 20px;
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 14px 18px;
            width: 740px;
            max-width: 95%;
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">a =</label>
        <input type="number" id="a-input" value="3">
        <label class="ui-label">b =</label>
        <input type="number" id="b-input" value="7">
        <label class="ui-label">m =</label>
        <input type="number" id="m-input" value="11">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(3,7,11)">Ex 1 (3^x ≡ 7 mod 11 → -1)</button>
        <button onclick="loadExample(5,4,7)">Ex 2 (5^x ≡ 4 mod 7 → 2)</button>
    </div>

    <div class="visual-container">
        <div class="equation-box" id="equation-display">3^x ≡ 7 (mod 11)</div>
        <div class="powers-wrapper" id="powers-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current x</span>
            <span class="info-value" id="val-x" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">a^x mod m</span>
            <span class="info-value" id="val-power" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Target b</span>
            <span class="info-value" id="val-b" style="color:var(--text-main);">7</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Steps</span>
            <span class="info-value" id="val-step" style="color:var(--accent-purple);">0</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Smallest x =</span><br>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px; font-size:11px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#2a1600;border:1px solid var(--accent-orange);border-radius:3px;"></span> Testing</div>
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#0f2a1a;border:1px solid var(--accent-green);border-radius:3px;"></span> Match Found</div>
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#2a0d0d;border:1px solid var(--accent-red);border-radius:3px;"></span> No Match</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let a = 3, b = 7, m = 11;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() {
            loadExample(3, 7, 11);
        }

        function loadExample(newA, newB, newM) {
            a = parseInt(newA);
            b = parseInt(newB);
            m = parseInt(newM);
            document.getElementById('a-input').value = a;
            document.getElementById('b-input').value = b;
            document.getElementById('m-input').value = m;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const na = parseInt(document.getElementById('a-input').value);
            const nb = parseInt(document.getElementById('b-input').value);
            const nm = parseInt(document.getElementById('m-input').value);
            if (!isNaN(na) && !isNaN(nb) && !isNaN(nm) && nm > 1) {
                loadExample(na, nb, nm);
            } else {
                alert("Please enter valid integers (m > 1).");
            }
        }

        function generateSteps() {
            steps = [];
            const eqStr = `${a}^x ≡ ${b} (mod ${m})`;
            document.getElementById('equation-display').innerText = eqStr;

            let currentPower = 1;
            let solutionX = -1;

            // Step 0: Initialization
            steps.push({
                type: 'init',
                x: 0,
                power: 1,
                panel: `Equation: <b>${eqStr}</b><br>Start with x = 0 → ${a}<sup>0</sup> ≡ 1 (mod ${m})`,
                statusText: `Starting brute-force search from x = 0 to ${m-1}...`,
                log: `Solving ${eqStr}\nInitialize: power = 1 (x=0)`,
                logColor: 'var(--text-dim)',
                isMatch: false
            });

            for (let x = 0; x < m; x++) {
                const isMatch = (currentPower === b);

                steps.push({
                    type: isMatch ? 'match' : 'test',
                    x: x,
                    power: currentPower,
                    panel: `x = <b>${x}</b><br>${a}<sup>${x}</sup> mod ${m} = <b>${currentPower}</b>${isMatch ? '<br><span style="color:var(--accent-green)">✓ MATCH FOUND</span>' : ''}`,
                    statusText: `x = ${x} → ${currentPower} ${isMatch ? '(Match!)' : ''}`,
                    log: `x=${x} : ${a}^${x} ≡ ${currentPower} (mod ${m}) ${isMatch ? '→ MATCH!' : ''}`,
                    logColor: isMatch ? 'var(--accent-green)' : 'var(--text-main)',
                    isMatch: isMatch
                });

                if (isMatch) {
                    solutionX = x;
                    break;
                }

                currentPower = (currentPower * a) % m;
            }

            // Final step
            const hasSolution = solutionX !== -1;
            steps.push({
                type: 'final',
                x: solutionX,
                power: hasSolution ? b : -1,
                panel: hasSolution 
                    ? `<span style="color:var(--accent-green)">Solution Found!</span><br>Smallest non-negative x = <b>${solutionX}</b>`
                    : `<span style="color:var(--accent-red)">No Solution Exists</span><br>${a}^x never equals ${b} modulo ${m} for x in [0, ${m-1}].<br>Return -1`,
                statusText: hasSolution ? `Solution: x = ${solutionX}` : `No solution found. Returning -1`,
                log: hasSolution ? `Final Result: x = ${solutionX}` : `Final Result: -1 (No solution)`,
                logColor: hasSolution ? 'var(--accent-green)' : 'var(--accent-red)',
                isTrue: hasSolution,
                solutionX: solutionX
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('powers-container');
            container.innerHTML = '';

            // Render tiles up to current progress
            for (let i = 1; i <= idx && i < steps.length; i++) {
                const s = steps[i];
                if (!s || s.type === 'init') continue;

                const tile = document.createElement('div');
                tile.className = `power-tile ${s.isMatch ? 'winning' : (i === idx && !s.isMatch ? 'candidate' : 'failed')}`;
                tile.innerHTML = `x=${s.x}<br>${s.power}`;
                container.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-x').innerText = step.x !== undefined ? step.x : '—';
            document.getElementById('val-power').innerText = step.power !== undefined ? step.power : '—';
            document.getElementById('val-b').innerText = b;
            document.getElementById('val-step').innerText = Math.min(idx, m);

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.isTrue ? step.solutionX : "-1";
                resVal.className = step.isTrue ? 'pop' : 'pop-false';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            // Accumulate log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
