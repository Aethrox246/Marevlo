<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Digits - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 160px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { 
            display: flex; gap: 12px; justify-content: center; align-items: center; 
            min-height: 110px; position: relative; 
        }

        .number-box {
            background: #21262d;
            border: 3px solid var(--accent-orange);
            border-radius: 12px;
            padding: 18px 36px;
            font-size: 42px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 200px;
            text-align: center;
            transition: all 0.4s ease;
        }

        .arrow { font-size: 32px; color: var(--text-dim); margin: 0 12px; }

        .count-box {
            background: #21262d;
            border: 3px solid var(--accent-blue);
            border-radius: 12px;
            padding: 18px 24px;
            font-size: 36px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 110px;
            text-align: center;
        }

        /* PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; width: 680px; text-align: center;
            font-family: monospace; min-height: 82px; font-size: 15px; line-height: 1.6;
        }

        /* INFO PANEL */
        .info-panel { margin-top: 15px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 19px; font-weight: 700; font-family: monospace; }

        /* RESULT */
        .result-display { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 32px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; width: 680px; }

        /* CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 92%; height: 138px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" placeholder="12345" value="12345">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(12345)">Ex 1 (12345)</button>
        <button onclick="loadExample(-987)">Ex 2 (-987)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Counting digits via repeated division by 10</div>
        <div class="tiles-wrapper" id="visual"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Number</span>
            <span class="info-value" id="val-current" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Digits Counted</span>
            <span class="info-value" id="val-count" style="color:var(--accent-blue)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Original n</span>
            <span class="info-value" id="val-orig" style="color:var(--text-main)">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Number of digits =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600; border:1px solid var(--accent-orange)"></span> Current number</div>
        <div class="legend-item"><span class="dot" style="background:#0d2244; border:1px solid var(--accent-blue)"></span> Digits counted</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputNumber = 12345;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1500, 750, 380];

        function init() { loadExample(12345); }

        function loadExample(newNum) {
            inputNumber = parseInt(newNum);
            document.getElementById('num-input').value = inputNumber;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val)) {
                loadExample(val);
            } else {
                alert("Please enter a valid integer.");
            }
        }

        function generateSteps() {
            steps = [];
            const original = inputNumber;
            let n = original;
            let count = 0;

            // Step 0: Init
            steps.push({
                type: 'init',
                current: n,
                count: 0,
                panel: `Counting digits in <b>${original}</b>.<br>We will repeatedly divide by 10 until the number becomes 0.`,
                statusText: `Starting with n = ${original}`,
                log: `Input n = ${original}`,
                logColor: 'var(--text-dim)'
            });

            // Special case for 0
            if (original === 0) {
                steps.push({
                    type: 'final',
                    current: 0,
                    count: 1,
                    panel: `<span style="color:var(--accent-green)">Special case: 0 has exactly 1 digit.</span>`,
                    statusText: `Result: 1 digit`,
                    log: `n = 0 → Return 1`,
                    logColor: 'var(--accent-green)',
                    complete: true
                });
                return;
            }

            // Take absolute value for negative numbers
            if (n < 0) {
                n = Math.abs(n);
                steps.push({
                    type: 'abs',
                    current: n,
                    count: 0,
                    panel: `Negative number detected.<br>Taking absolute value: <b>${n}</b>`,
                    statusText: `Using |${original}| = ${n}`,
                    log: `n < 0 → n = abs(n) = ${n}`,
                    logColor: 'var(--accent-purple)'
                });
            }

            // Iterative division loop
            while (n > 0) {
                const prevN = n;
                n = Math.floor(n / 10);
                count++;

                steps.push({
                    type: 'divide',
                    current: n,
                    count: count,
                    panel: `Divide by 10: <code>${prevN} // 10 = ${n}</code><br>Digits counted so far: <b>${count}</b>`,
                    statusText: `Divided → ${n} (count = ${count})`,
                    log: `${prevN} // 10 = ${n} → count = ${count}`,
                    logColor: 'var(--accent-blue)'
                });
            }

            // Final step
            steps.push({
                type: 'final',
                current: 0,
                count: count,
                panel: `Number reduced to 0.<br><span style="color:var(--accent-green)">Total digits = <b>${count}</b></span>`,
                statusText: `Done. ${original} has ${count} digits.`,
                log: `Final count = ${count}`,
                logColor: 'var(--accent-green)',
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('visual');
            container.innerHTML = `
                <div class="number-box" style="border-color: ${step.type === 'final' ? 'var(--accent-green)' : 'var(--accent-orange)'}">
                    ${step.current}
                </div>
                <div style="font-size:28px; color:var(--accent-blue);">÷10</div>
                <div class="count-box">
                    ${step.count}
                </div>
            `;

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-current').innerText = step.current;
            document.getElementById('val-count').innerText = step.count;
            document.getElementById('val-orig').innerText = inputNumber;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.count;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            // Log panel
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
