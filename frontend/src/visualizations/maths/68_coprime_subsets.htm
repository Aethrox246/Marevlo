<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coprime Subsets - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 180px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .array-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .num-tile {
            width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; font-size: 24px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 3px solid var(--border-main); background: #21262d; color: var(--text-main);
            transition: all 0.3s ease;
        }
        .num-tile.included { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); }
        .num-tile.excluded { opacity: 0.35; }

        .mask-display {
            margin-top: 10px; font-family: 'Courier New', monospace; font-size: 18px;
            background: var(--bg-surface); padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border-main);
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; width: 720px; text-align: center; font-family: monospace;
            min-height: 110px; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 15px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 110px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 19px; font-weight: 700; }

        .result-display { margin-top: 18px; text-align: center; }
        #res-val { font-size: 42px; font-weight: bold; font-family: monospace; transition: all 0.4s; }
        .pop { animation: popAnim 600ms ease; color: var(--accent-green) !important; }

        @keyframes popAnim { 0%{transform:scale(0.6)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13.5px; color: var(--text-dim); height: 1.6em; text-align: center; width: 700px; }
        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        input[type="range"] { accent-color: var(--accent-blue); width: 160px; }

        .legend { margin-top: 18px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: var(--text-dim); }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; max-width: 95%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Array =</label>
        <input type="text" id="arr-input" value="[2, 3, 5]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Array Elements</div>
        <div class="array-bar" id="array-bar"></div>
        <div class="mask-display" id="mask-display">Mask: —</div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Subset</span>
            <span class="info-value" id="val-subset" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Valid?</span>
            <span class="info-value" id="val-valid" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Total Count</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Coprime Subsets (including empty) =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div>
            <span class="ui-label" style="margin-right:6px; font-size:12px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-green);border-radius:4px;margin-right:8px;"></span>Included</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-red);border-radius:4px;margin-right:8px;"></span>Invalid Pair</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [2, 3, 5];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [950, 480, 240];

        const examples = [[2, 3, 5], [2, 4, 6]];

        function loadCustom() {
            try {
                arr = JSON.parse(document.getElementById('arr-input').value);
                if (!Array.isArray(arr)) arr = [];
                generateSteps();
                reset();
            } catch(e) {
                alert("Invalid array format. Use e.g. [2, 3, 5]");
            }
        }

        function loadExample(idx) {
            arr = examples[idx];
            document.getElementById('arr-input').value = JSON.stringify(arr);
            generateSteps();
            reset();
        }

        function gcd(a, b) {
            a = Math.abs(a); b = Math.abs(b);
            while (b !== 0) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function isCoprimeSubset(subset) {
            if (subset.length <= 1) return true;
            for (let i = 0; i < subset.length; i++) {
                for (let j = i + 1; j < subset.length; j++) {
                    if (gcd(subset[i], subset[j]) !== 1) return false;
                }
            }
            return true;
        }

        function generateSteps() {
            steps = [];
            let n = arr.length;
            let totalValid = 0;

            steps.push({
                type: 'init',
                mask: -1,
                subset: [],
                isValid: true,
                count: 0,
                panel: `Counting coprime subsets of [<b>${arr.join(', ')}</b>]<br>Total subsets: 2<sup>${n}</sup> = ${1<<n}`,
                statusText: `Starting bitmask enumeration...`,
                log: `Array: [${arr.join(', ')}]\nTotal subsets: ${1<<n}\nCount = 0`,
                logColor: 'var(--text-dim)'
            });

            for (let mask = 0; mask < (1 << n); mask++) {
                let subset = [];
                for (let i = 0; i < n; i++) {
                    if (mask & (1 << i)) subset.push(arr[i]);
                }

                let valid = isCoprimeSubset(subset);
                if (valid) totalValid++;

                let binary = mask.toString(2).padStart(n, '0');

                steps.push({
                    type: 'check',
                    mask: mask,
                    subset: subset,
                    isValid: valid,
                    count: totalValid,
                    panel: `Mask <b>${binary}</b> → [${subset.join(', ')}]<br>${valid ? '<span style="color:var(--accent-green)">Valid ✓</span>' : '<span style="color:var(--accent-red)">Invalid ✗</span>'}`,
                    statusText: `Checking mask ${binary}`,
                    log: `Mask ${binary} → [${subset.join(', ')}] → ${valid ? 'Valid' : 'Invalid'}`,
                    logColor: valid ? 'var(--accent-green)' : 'var(--accent-red)'
                });
            }

            steps.push({
                type: 'final',
                mask: -1,
                subset: [],
                isValid: true,
                count: totalValid,
                panel: `Enumeration complete!<br><b>Total coprime subsets = ${totalValid}</b>`,
                statusText: `Done! Answer = ${totalValid}`,
                log: `\nFinal Count = ${totalValid}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('array-bar');
            container.innerHTML = '';
            for (let i = 0; i < arr.length; i++) {
                const tile = document.createElement('div');
                tile.className = 'num-tile';
                tile.innerText = arr[i];
                if (step.mask !== -1 && (step.mask & (1 << i))) tile.classList.add('included');
                container.appendChild(tile);
            }

            document.getElementById('mask-display').innerText = step.mask !== -1 ? 
                `Mask: ${(step.mask >>> 0).toString(2).padStart(arr.length, '0')}` : 'Mask: —';

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-subset').innerText = `[${step.subset.join(', ')}]` || '—';
            document.getElementById('val-valid').innerText = step.isValid ? 'Yes ✓' : 'No ✗';
            document.getElementById('val-count').innerText = step.count;

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.count;
                resVal.classList.add('pop');
            } else {
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length-1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length-1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }
        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
