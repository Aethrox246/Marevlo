<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Factorization - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 140px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 820px; }
        .tiles-wrapper { 
            display: flex; gap: 16px; justify-content: center; align-items: center; 
            flex-wrap: wrap; min-height: 160px;
        }

        .number-box {
            background: #21262d;
            border: 3px solid var(--accent-orange);
            border-radius: 12px;
            padding: 20px 40px;
            font-size: 42px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 160px;
            text-align: center;
        }

        .factors-box {
            background: #21262d;
            border: 3px solid var(--accent-green);
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 28px;
            font-family: 'Courier New', monospace;
            min-width: 220px;
            text-align: center;
            line-height: 1.4;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 18px 24px; width: 720px; min-height: 92px;
            font-family: monospace; font-size: 15px; line-height: 1.6; text-align: center;
        }

        .info-panel { margin-top: 15px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 20px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 20px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 20px; font-size: 28px; font-family: monospace; }
        #res-val { color: var(--accent-green); font-weight: bold; transition: all 0.4s; }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.5em; text-align: center; width: 720px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; cursor: pointer; }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }

        .pop { animation: popAnim 600ms ease; }
        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" value="28">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(28)">Ex 1 (28)</button>
        <button onclick="loadExample(17)">Ex 2 (17)</button>
    </div>

    <div class="visual-container">
        <div class="tiles-wrapper" id="visual"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current n</span>
            <span class="info-value" id="val-n" style="color:var(--accent-blue)">—</span>
        </div>
    </div>

    <div class="result-display">
        Prime Factors = <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputNumber = 28;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(28); }

        function loadExample(n) {
            inputNumber = Math.max(1, parseInt(n));
            document.getElementById('num-input').value = inputNumber;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val) && val >= 1) loadExample(val);
            else alert("Please enter a positive integer >= 1.");
        }

        function generateSteps() {
            steps = [];
            let n = inputNumber;
            let factors = [];

            steps.push({
                type: 'init',
                i: '—',
                currentN: n,
                factors: [],
                panel: `Prime Factorization of <b>${n}</b><br>Using Trial Division`,
                statusText: `n = ${n}`,
                log: `Start: Factorize ${n}`,
                logColor: 'var(--text-dim)'
            });

            if (n === 1) {
                steps.push({
                    type: 'final',
                    i: '—',
                    currentN: 1,
                    factors: [],
                    panel: `1 has no prime factors`,
                    statusText: `Done. []`,
                    log: `[]`,
                    logColor: 'var(--accent-green)',
                    complete: true
                });
                return;
            }

            let i = 2;
            while (i * i <= n) {
                while (n % i === 0) {
                    factors.push(i);
                    steps.push({
                        type: 'divide',
                        i: i,
                        currentN: n,
                        factors: [...factors],
                        panel: `<code>${n} % ${i} == 0</code><br>Add ${i}, n = ${n} // ${i}`,
                        statusText: `i = ${i}, n = ${n}`,
                        log: `${n} ÷ ${i} → ${n/i}`,
                        logColor: 'var(--accent-blue)'
                    });
                    n = n / i;
                }
                i++;
            }

            if (n > 1) {
                factors.push(n);
                steps.push({
                    type: 'final-prime',
                    i: '—',
                    currentN: n,
                    factors: [...factors],
                    panel: `Remaining n = <b>${n}</b> is prime`,
                    statusText: `Add remaining prime ${n}`,
                    log: `Add ${n}`,
                    logColor: 'var(--accent-purple)'
                });
            }

            steps.push({
                type: 'final',
                i: '—',
                currentN: 1,
                factors: factors,
                panel: `Prime factors: <span style="color:var(--accent-green)"><b>[${factors.join(', ')}]</b></span>`,
                statusText: `Done`,
                log: `Final: [${factors.join(', ')}]`,
                logColor: 'var(--accent-green)',
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('visual');
            let html = `<div class="number-box">${step.currentN}</div>`;

            if (step.factors && step.factors.length > 0) {
                html += `<div class="factors-box">Factors: [${step.factors.join(', ')}]</div>`;
            }

            container.innerHTML = html;

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i;
            document.getElementById('val-n').innerText = step.currentN;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = `[${step.factors.join(', ')}]`;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
