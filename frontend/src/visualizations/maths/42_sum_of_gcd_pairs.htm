<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of GCD Pairs - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 100px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; text-align: center; }
        .tiles-wrapper { 
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; 
            max-width: 920px; min-height: 140px; margin: 0 auto;
        }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 18px; font-weight: 600; font-family: monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
        }
        .tile-index { font-size: 11px; color: var(--text-dim); }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); }
        .tile.gcd { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 12px var(--accent-green); }
        .tile.past { opacity: 0.4; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; width: 780px; min-height: 100px;
            font-family: monospace; font-size: 15px; line-height: 1.5; text-align: center;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 16px; min-width: 120px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .result-display { 
            margin-top: 16px; font-size: 22px; font-family: monospace; 
            color: var(--accent-green); font-weight: bold;
        }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); min-height: 22px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 780px; max-width: 96%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="n-input" value="2">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(2)">Example 1 (n=2)</button>
        <button onclick="loadExample(3)">Example 2 (n=3)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Sum of GCD(i,j) for all 1 ≤ i,j ≤ n (Brute Force Visualization)</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to start computing GCD pairs...</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current j</span>
            <span class="info-value" id="val-j" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">GCD</span>
            <span class="info-value" id="val-gcd" style="color:var(--accent-blue)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Sum</span>
            <span class="info-value" id="val-sum" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">Final sum will appear here</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px; font-size:12px">Speed:</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Processing Pair</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:1px solid var(--accent-green)"></span> Adding GCD</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let n = 2;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function loadExample(newN) {
            n = parseInt(newN);
            document.getElementById('n-input').value = n;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('n-input').value);
            if (val >= 1) {
                loadExample(val);
            } else {
                alert("Please enter n ≥ 1");
            }
        }

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b !== 0) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function generateSteps() {
            steps = [];
            let total = 0;

            steps.push({
                type: 'init',
                i: 1,
                j: 1,
                gcdVal: 0,
                sum: 0,
                panel: `Sum of gcd(i,j) for 1 ≤ i,j ≤ <b>${n}</b><br>Brute force double loop`,
                statusText: `Starting sum for n=${n}`,
                log: `n = ${n}\nTotal pairs = ${n*n}\nComputing sum of gcd(i,j)...`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= n; j++) {
                    let g = gcd(i, j);
                    total += g;

                    steps.push({
                        type: 'gcd',
                        i: i,
                        j: j,
                        gcdVal: g,
                        sum: total,
                        panel: `Pair (i=${i}, j=${j}) → gcd(<b>${i}</b>,<b>${j}</b>) = <b>${g}</b>`,
                        statusText: `Pair (${i},${j}) gcd=${g}`,
                        log: `i=${i}, j=${j} | gcd(${i},${j}) = ${g} → sum now = ${total}`,
                        logColor: 'var(--accent-green)'
                    });
                }
            }

            steps.push({
                type: 'final',
                i: n,
                j: n,
                gcdVal: gcd(n, n),
                sum: total,
                panel: `Finished!<br>Sum of all gcd(i,j) = <b>${total}</b>`,
                complete: true,
                statusText: `Computation complete`,
                log: `\nFinal Sum: ${total}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show current pair
            const unitI = document.createElement('div');
            unitI.className = 'tile-unit';
            const tileI = document.createElement('div');
            tileI.className = `tile ${step.type === 'gcd' ? 'gcd' : ''}`;
            tileI.textContent = step.i;
            unitI.appendChild(tileI);
            const labelI = document.createElement('div');
            labelI.className = 'tile-index';
            labelI.textContent = `i = ${step.i}`;
            unitI.appendChild(labelI);
            container.appendChild(unitI);

            const unitJ = document.createElement('div');
            unitJ.className = 'tile-unit';
            const tileJ = document.createElement('div');
            tileJ.className = `tile ${step.type === 'gcd' ? 'gcd' : ''}`;
            tileJ.textContent = step.j;
            unitJ.appendChild(tileJ);
            const labelJ = document.createElement('div');
            labelJ.className = 'tile-index';
            labelJ.textContent = `j = ${step.j}`;
            unitJ.appendChild(labelJ);
            container.appendChild(unitJ);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').textContent = step.i;
            document.getElementById('val-j').textContent = step.j;
            document.getElementById('val-gcd').textContent = step.gcdVal;
            document.getElementById('val-sum').textContent = step.sum;

            const res = document.getElementById('res-val');
            if (step.complete) {
                res.innerHTML = `<b>Final Sum:</b> ${step.sum}`;
            } else {
                res.textContent = 'Computing GCD pairs...';
            }

            document.getElementById('status-text').textContent = step.statusText;

            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const div = document.createElement('div');
                    div.style.color = steps[k].logColor || 'var(--text-main)';
                    if (steps[k].bold) div.style.fontWeight = 'bold';
                    div.textContent = steps[k].log;
                    logEl.appendChild(div);
                }
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = '❚❚ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        window.onload = () => loadExample(2);
    </script>
</body>
</html>
