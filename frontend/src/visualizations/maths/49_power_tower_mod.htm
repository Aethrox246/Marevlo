<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Tower Modulo m - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 70px;
            font-size: 13px;
        }
        #tower-input {
            width: 280px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .equation-box {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: 600;
            background: var(--bg-surface);
            padding: 14px 28px;
            border-radius: 8px;
            border: 1px solid var(--border-main);
        }

        .tower-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-width: 900px;
            min-height: 140px;
        }

        .tower-tile {
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 12px 18px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            min-width: 80px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .tower-tile.current { 
            border-color: var(--accent-orange); 
            color: var(--accent-orange); 
            transform: scale(1.1); 
            box-shadow: 0 0 15px rgba(227,179,65,0.5); 
        }
        .tower-tile.result { 
            border-color: var(--accent-green); 
            color: var(--accent-green); 
            transform: scale(1.15); 
            box-shadow: 0 0 18px var(--accent-green); 
        }

        /* PANEL */
        .action-panel {
            margin-top: 30px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 16px 24px;
            width: 740px;
            text-align: center;
            font-family: monospace;
            min-height: 100px;
            font-size: 15px;
            line-height: 1.6;
        }

        /* INFO PANEL */
        .info-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info-cell {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 10px 18px;
            min-width: 130px;
            text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        /* RESULT */
        .result-display {
            margin-top: 20px;
            text-align: center;
        }
        #res-val {
            font-size: 24px;
            font-family: monospace;
            font-weight: bold;
            transition: all 0.4s;
        }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 30px !important; }
        .pop-false { animation: popAnim 500ms ease; color: var(--accent-red) !important; font-size: 30px !important; }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; }
        .controls {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: var(--text-dim);
        }

        .log-panel {
            margin-top: 20px;
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 14px 18px;
            width: 740px;
            max-width: 95%;
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Tower =</label>
        <input type="text" id="tower-input" value="[2,3,2]" placeholder="[2,3,2]">
        <label class="ui-label">m =</label>
        <input type="number" id="m-input" value="10">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([2,3,2],10)">Ex 1 ([2,3,2] mod 10)</button>
        <button onclick="loadExample([3,2,1,4],7)">Ex 2 ([3,2,1,4] mod 7)</button>
    </div>

    <div class="visual-container">
        <div class="equation-box" id="equation-display">2^(3^2) mod 10</div>
        <div class="tower-wrapper" id="tower-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Level</span>
            <span class="info-value" id="val-level" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Base</span>
            <span class="info-value" id="val-base" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Exponent</span>
            <span class="info-value" id="val-exp" style="color:var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Result</span>
            <span class="info-value" id="val-result" style="color:var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Final result =</span><br>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px; font-size:11px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#2a1600;border:1px solid var(--accent-orange);border-radius:3px;"></span> Current computation</div>
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#0f2a1a;border:1px solid var(--accent-green);border-radius:3px;"></span> Final result</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let tower = [2, 3, 2];
        let m = 10;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() {
            loadExample([2,3,2], 10);
        }

        function loadExample(newTower, newM) {
            tower = newTower;
            m = newM;
            document.getElementById('tower-input').value = JSON.stringify(tower);
            document.getElementById('m-input').value = m;
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const tStr = document.getElementById('tower-input').value.trim();
                const parsedTower = JSON.parse(tStr);
                const nm = parseInt(document.getElementById('m-input').value);
                if (Array.isArray(parsedTower) && parsedTower.length > 0 && !isNaN(nm) && nm > 0) {
                    loadExample(parsedTower, nm);
                } else {
                    alert("Please enter a valid tower like [2,3,2] and m > 0.");
                }
            } catch(e) {
                alert("Invalid tower format. Use JSON array like [2,3,2]");
            }
        }

        function generateSteps() {
            steps = [];
            const eqStr = tower.map((v,i) => i === tower.length-1 ? v : v + "^").join("");
            document.getElementById('equation-display').innerText = eqStr + " mod " + m;

            // Step 0: Initialization
            steps.push({
                type: 'init',
                level: 0,
                base: '—',
                exp: '—',
                result: '—',
                panel: `Power tower: <b>${eqStr}</b> mod <b>${m}</b><br>Evaluating right-associatively (from the top)`,
                statusText: `Starting bottom-up evaluation...`,
                log: `Tower = ${JSON.stringify(tower)}\nm = ${m}\nRight-associative: ${eqStr}`,
                logColor: 'var(--text-dim)'
            });

            let currentResult = tower[tower.length - 1] % m;
            let currentLevel = tower.length - 1;

            steps.push({
                type: 'base',
                level: currentLevel,
                base: tower[currentLevel],
                exp: '—',
                result: currentResult,
                panel: `Innermost value: <b>${tower[currentLevel]}</b> mod ${m} = <b>${currentResult}</b>`,
                statusText: `Base case: tower[${currentLevel}] = ${currentResult}`,
                log: `Start with innermost: ${tower[currentLevel]} mod ${m} = ${currentResult}`,
                logColor: 'var(--accent-purple)'
            });

            for (let i = tower.length - 2; i >= 0; i--) {
                const baseVal = tower[i];
                const expVal = currentResult;

                // Compute base^exp mod m
                const newResult = modPow(baseVal, expVal, m);

                steps.push({
                    type: 'compute',
                    level: i,
                    base: baseVal,
                    exp: expVal,
                    result: newResult,
                    panel: `Compute <b>${baseVal}</b> ^ <b>${expVal}</b> mod ${m} = <b>${newResult}</b>`,
                    statusText: `${baseVal} ^ ${expVal} mod ${m} = ${newResult}`,
                    log: `Level ${i}: ${baseVal}^${expVal} ≡ ${newResult} (mod ${m})`,
                    logColor: 'var(--accent-orange)'
                });

                currentResult = newResult;
            }

            // Final step
            steps.push({
                type: 'final',
                level: 0,
                base: '—',
                exp: '—',
                result: currentResult,
                panel: `Final result: <b>${currentResult}</b>`,
                statusText: `Power tower evaluation complete.`,
                log: `Final Result: ${currentResult}`,
                logColor: 'var(--accent-green)',
                isTrue: true,
                finalValue: currentResult
            });
        }

        function modPow(base, exp, mod) {
            if (mod === 1) return 0;
            let result = 1;
            base = base % mod;
            while (exp > 0) {
                if (exp % 2 === 1) {
                    result = (result * base) % mod;
                }
                base = (base * base) % mod;
                exp = Math.floor(exp / 2);
            }
            return result;
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tower-container');
            container.innerHTML = '';

            // Render the tower elements with highlights
            for (let i = 0; i < tower.length; i++) {
                const tile = document.createElement('div');
                tile.className = `tower-tile ${i === step.level ? 'current' : (step.type === 'final' && i === 0 ? 'result' : '')}`;
                tile.innerHTML = tower[i];
                container.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-level').innerText = step.level !== undefined ? step.level : '—';
            document.getElementById('val-base').innerText = step.base !== undefined ? step.base : '—';
            document.getElementById('val-exp').innerText = step.exp !== undefined ? step.exp : '—';
            document.getElementById('val-result').innerText = step.result !== undefined ? step.result : '—';

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.finalValue;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
