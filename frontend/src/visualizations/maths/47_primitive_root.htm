<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primitive Root Modulo p - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 100px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUALIZATION */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .equation-box {
            font-family: 'Courier New', monospace;
            font-size: 26px;
            font-weight: 600;
            background: var(--bg-surface);
            padding: 14px 32px;
            border-radius: 8px;
            border: 1px solid var(--border-main);
        }

        .candidates-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-width: 900px;
            min-height: 160px;
        }

        .candidate-tile {
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 12px 18px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            min-width: 110px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .candidate-tile.candidate { 
            border-color: var(--accent-orange); 
            color: var(--accent-orange); 
            transform: scale(1.08); 
            box-shadow: 0 0 15px rgba(227,179,65,0.5); 
        }
        .candidate-tile.winning { 
            border-color: var(--accent-green); 
            color: var(--accent-green); 
            transform: scale(1.15); 
            box-shadow: 0 0 18px var(--accent-green); 
        }
        .candidate-tile.failed { 
            border-color: var(--accent-red); 
            color: var(--accent-red); 
            opacity: 0.65; 
        }

        /* PANEL */
        .action-panel {
            margin-top: 30px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 16px 24px;
            width: 740px;
            text-align: center;
            font-family: monospace;
            min-height: 100px;
            font-size: 15px;
            line-height: 1.6;
        }

        /* INFO PANEL */
        .info-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info-cell {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 10px 18px;
            min-width: 130px;
            text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        /* RESULT */
        .result-display {
            margin-top: 20px;
            text-align: center;
        }
        #res-val {
            font-size: 24px;
            font-family: monospace;
            font-weight: bold;
            transition: all 0.4s;
        }
        .pop { animation: popAnim 500ms ease; color: var(--accent-green) !important; font-size: 30px !important; }
        .pop-false { animation: popAnim 500ms ease; color: var(--accent-red) !important; font-size: 30px !important; }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; }
        .controls {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: var(--text-dim);
        }

        .log-panel {
            margin-top: 20px;
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 14px 18px;
            width: 740px;
            max-width: 95%;
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">p =</label>
        <input type="number" id="p-input" value="7">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(7)">Ex 1 (p=7 → 3)</button>
        <button onclick="loadExample(11)">Ex 2 (p=11 → 2)</button>
    </div>

    <div class="visual-container">
        <div class="equation-box" id="equation-display">Find smallest primitive root modulo 7</div>
        <div class="candidates-wrapper" id="candidates-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current g</span>
            <span class="info-value" id="val-g" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current k</span>
            <span class="info-value" id="val-k" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">g^k mod p</span>
            <span class="info-value" id="val-power" style="color:var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Status</span>
            <span class="info-value" id="val-status" style="color:var(--accent-purple);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Smallest primitive root =</span><br>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px; font-size:11px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#2a1600;border:1px solid var(--accent-orange);border-radius:3px;"></span> Testing g / k</div>
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#0f2a1a;border:1px solid var(--accent-green);border-radius:3px;"></span> Primitive Root Found</div>
        <div class="legend-item"><span style="display:inline-block;width:12px;height:12px;background:#2a0d0d;border:1px solid var(--accent-red);border-radius:3px;"></span> Fails (hits 1 early)</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let p = 7;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            loadExample(7);
        }

        function loadExample(newP) {
            p = parseInt(newP);
            document.getElementById('p-input').value = p;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const np = parseInt(document.getElementById('p-input').value);
            if (!isNaN(np) && np > 1) {
                loadExample(np);
            } else {
                alert("Please enter a valid prime p > 1.");
            }
        }

        function modPow(base, exp, mod) {
            let res = 1;
            base = base % mod;
            while (exp > 0) {
                if (exp % 2 === 1) res = (res * base) % mod;
                base = (base * base) % mod;
                exp = Math.floor(exp / 2);
            }
            return res;
        }

        function generateSteps() {
            steps = [];
            document.getElementById('equation-display').innerText = `Find smallest primitive root modulo ${p}`;

            // Step 0: Init
            steps.push({
                type: 'init',
                g: '—',
                k: '—',
                power: '—',
                panel: `p = <b>${p}</b> (prime)<br>Search for smallest g (2 ≤ g < p) such that g^k ≠ 1 (mod p) for all k = 1 to ${p-2}`,
                statusText: `Starting search for primitive root modulo ${p}...`,
                log: `Finding primitive root modulo ${p}\nA primitive root g satisfies: order(g) = p-1`,
                logColor: 'var(--text-dim)'
            });

            let found = false;
            let smallestG = -1;

            for (let g = 2; g < p; g++) {
                let isPrimitive = true;
                let failK = -1;
                let failPower = -1;

                // Test this g
                steps.push({
                    type: 'test_g',
                    g: g,
                    k: '—',
                    power: '—',
                    panel: `Testing candidate g = <b>${g}</b>`,
                    statusText: `Checking g = ${g} ...`,
                    log: `\nCandidate g = ${g}`,
                    logColor: 'var(--accent-orange)'
                });

                for (let k = 1; k <= p-2; k++) {
                    const power = modPow(g, k, p);

                    steps.push({
                        type: 'test_k',
                        g: g,
                        k: k,
                        power: power,
                        panel: `g = ${g}, k = ${k}<br>${g}<sup>${k}</sup> mod ${p} = <b>${power}</b>`,
                        statusText: `k = ${k} → ${power}`,
                        log: `  k=${k} : ${g}^${k} ≡ ${power} (mod ${p})`,
                        logColor: power === 1 ? 'var(--accent-red)' : 'var(--text-main)'
                    });

                    if (power === 1) {
                        isPrimitive = false;
                        failK = k;
                        failPower = power;
                        break;
                    }
                }

                if (isPrimitive) {
                    smallestG = g;
                    found = true;

                    steps.push({
                        type: 'success',
                        g: g,
                        k: '—',
                        power: '—',
                        panel: `<span style="color:var(--accent-green)">Primitive root found!</span><br>g = <b>${g}</b> is a primitive root modulo ${p}`,
                        statusText: `g = ${g} is primitive root!`,
                        log: `✓ g = ${g} is a primitive root (no early 1 found)`,
                        logColor: 'var(--accent-green)'
                    });
                    break;
                } else {
                    steps.push({
                        type: 'fail',
                        g: g,
                        k: failK,
                        power: failPower,
                        panel: `<span style="color:var(--accent-red)">g = ${g} fails</span><br>${g}<sup>${failK}</sup> ≡ 1 (mod ${p}) at k = ${failK} < ${p-1}`,
                        statusText: `g = ${g} fails at k=${failK}`,
                        log: `✗ g = ${g} fails (hits 1 at k=${failK})`,
                        logColor: 'var(--accent-red)'
                    });
                }
            }

            // Final step
            steps.push({
                type: 'final',
                g: smallestG,
                k: '—',
                power: '—',
                panel: found 
                    ? `Smallest primitive root modulo ${p} is <b>${smallestG}</b>`
                    : `No primitive root found (should not happen for prime p)`,
                statusText: found ? `Done. Primitive root = ${smallestG}` : `No primitive root found`,
                log: found ? `Final Result: ${smallestG}` : `Final Result: -1`,
                logColor: found ? 'var(--accent-green)' : 'var(--accent-red)',
                isTrue: found,
                result: smallestG
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('candidates-container');
            container.innerHTML = '';

            // Render all candidates tested so far with their status
            for (let i = 1; i < idx; i++) {
                const s = steps[i];
                if (s.type === 'test_g' || s.type === 'success' || s.type === 'fail') {
                    const tile = document.createElement('div');
                    tile.className = `candidate-tile ${s.type === 'success' ? 'winning' : (s.type === 'fail' ? 'failed' : 'candidate')}`;
                    tile.innerHTML = `g=${s.g}`;
                    container.appendChild(tile);
                }
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-g').innerText = step.g !== undefined ? step.g : '—';
            document.getElementById('val-k').innerText = step.k !== undefined ? step.k : '—';
            document.getElementById('val-power').innerText = step.power !== undefined ? step.power : '—';
            document.getElementById('val-status').innerText = step.type || '—';

            const resVal = document.getElementById('res-val');
            if (step.type === 'final') {
                resVal.innerText = step.isTrue ? step.result : "-1";
                resVal.className = step.isTrue ? 'pop' : 'pop-false';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
