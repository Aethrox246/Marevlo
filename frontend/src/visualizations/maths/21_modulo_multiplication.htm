<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo Multiplication - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 110px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 820px; min-height: 110px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 26px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 12px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); }
        .tile.product { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); }
        .tile.result { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.22); box-shadow: 0 0 18px var(--accent-green); }

        .action-panel {
            margin-top: 30px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 22px; width: 720px; text-align: center; font-family: monospace;
            min-height: 125px; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 16px; display: flex; flex-direction: column; align-items: center; min-width: 115px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .result-display { margin-top: 18px; text-align: center; }
        #res-val { font-size: 38px; font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { color: var(--accent-green) !important; text-shadow: 0 0 20px var(--accent-green); animation: popAnim 600ms; }

        @keyframes popAnim { 0%{transform:scale(0.6)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; width: 620px; text-align: center; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 14px; height: 14px; border-radius: 3px; margin-right: 7px; }

        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 740px; max-width: 95%; height: 155px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">a =</label>
        <input type="number" id="num-a" value="7">
        <label class="ui-label">b =</label>
        <input type="number" id="num-b" value="5">
        <label class="ui-label">m =</label>
        <input type="number" id="num-m" value="3">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(7,5,3)">Ex 1 (7*5)%3</button>
        <button onclick="loadExample(100,200,7)">Ex 2 (100*200)%7</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Compute (a * b) % m</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">a</span>
            <span class="info-value" id="val-a" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">b</span>
            <span class="info-value" id="val-b" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">a * b</span>
            <span class="info-value" id="val-product" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Result</span>
            <span class="info-value" id="val-result" style="color:var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="font-size:18px;">(a * b) % m = </span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:2px solid var(--accent-orange)"></span> Input Values</div>
        <div class="legend-item"><span class="dot" style="background:#1e1030;border:2px solid var(--accent-purple)"></span> Product</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:2px solid var(--accent-green)"></span> Final Result</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let numA = 7, numB = 5, numM = 3;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() { loadExample(7, 5, 3); }

        function loadExample(a, b, m) {
            numA = a; numB = b; numM = m;
            document.getElementById('num-a').value = numA;
            document.getElementById('num-b').value = numB;
            document.getElementById('num-m').value = numM;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const a = parseInt(document.getElementById('num-a').value);
            const b = parseInt(document.getElementById('num-b').value);
            const m = parseInt(document.getElementById('num-m').value);
            if (!isNaN(a) && !isNaN(b) && !isNaN(m) && m > 0) {
                loadExample(a, b, m);
            } else {
                alert("Please enter valid numbers (m > 0).");
            }
        }

        function generateSteps() {
            steps = [];
            let a = numA, b = numB, m = numM;
            let product = a * b;
            let result = product % m;

            steps.push({
                type: 'init',
                a: a, b: b, m: m,
                product: '—', result: '—',
                panel: `Compute <b>(${a} * ${b}) % ${m}</b><br>Step-by-step modular multiplication.`,
                status: `Starting: a=${a}, b=${b}, m=${m}`,
                log: `a = ${a}\nb = ${b}\nm = ${m}`
            });

            steps.push({
                type: 'multiply',
                a: a, b: b, m: m,
                product: product, result: '—',
                panel: `Step 1: Multiply the numbers<br><b>${a} * ${b} = ${product}</b>`,
                status: `Product = ${product}`,
                log: `Product = ${a} * ${b} = ${product}`
            });

            steps.push({
                type: 'mod',
                a: a, b: b, m: m,
                product: product, result: result,
                panel: `Step 2: Apply modulo<br><b>${product} % ${m} = ${result}</b>`,
                status: `Result = ${result}`,
                log: `${product} % ${m} = ${result}`
            });

            steps.push({
                type: 'final',
                a: a, b: b, m: m,
                product: product, result: result,
                panel: `Final Result:<br><b>(${a} * ${b}) % ${m} = ${result}</b>`,
                status: `Done → ${result}`,
                log: `Final Result: ${result}`,
                isTrue: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Tile A
            const tileA = document.createElement('div');
            tileA.className = 'tile-unit';
            const divA = document.createElement('div');
            divA.className = `tile ${step.type === 'final' ? 'result' : 'candidate'}`;
            divA.innerText = step.a;
            const labelA = document.createElement('div');
            labelA.className = 'tile-index';
            labelA.innerText = 'a';
            tileA.append(divA, labelA);
            container.appendChild(tileA);

            // Tile B
            const tileB = document.createElement('div');
            tileB.className = 'tile-unit';
            const divB = document.createElement('div');
            divB.className = `tile ${step.type === 'final' ? 'result' : 'candidate'}`;
            divB.innerText = step.b;
            const labelB = document.createElement('div');
            labelB.className = 'tile-index';
            labelB.innerText = 'b';
            tileB.append(divB, labelB);
            container.appendChild(tileB);

            // Product tile
            if (step.product !== '—') {
                const tileProd = document.createElement('div');
                tileProd.className = 'tile-unit';
                const divProd = document.createElement('div');
                divProd.className = `tile product`;
                divProd.innerText = step.product;
                const labelProd = document.createElement('div');
                labelProd.className = 'tile-index';
                labelProd.innerText = 'product';
                tileProd.append(divProd, labelProd);
                container.appendChild(tileProd);
            }

            // Result tile
            if (step.result !== '—') {
                const tileRes = document.createElement('div');
                tileRes.className = 'tile-unit';
                const divRes = document.createElement('div');
                divRes.className = `tile result`;
                divRes.innerText = step.result;
                const labelRes = document.createElement('div');
                labelRes.className = 'tile-index';
                labelRes.innerText = '% m';
                tileRes.append(divRes, labelRes);
                container.appendChild(tileRes);
            }

            document.getElementById('main-panel').innerHTML = step.panel;

            document.getElementById('val-a').innerText = step.a;
            document.getElementById('val-b').innerText = step.b;
            document.getElementById('val-product').innerText = step.product;
            document.getElementById('val-result').innerText = step.result;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.result !== '—' ? step.result : '—';
            if (step.type === 'final') resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.status;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    line.innerText = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
