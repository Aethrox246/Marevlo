<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nCr mod Prime - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 80px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; text-align: center; }
        .tiles-wrapper { 
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; 
            max-width: 920px; min-height: 140px; margin: 0 auto;
        }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 18px; font-weight: 600; font-family: monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
        }
        .tile-index { font-size: 11px; color: var(--text-dim); }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); }
        .tile.factor { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.18); box-shadow: 0 0 12px var(--accent-green); }
        .tile.past { opacity: 0.4; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; width: 780px; min-height: 100px;
            font-family: monospace; font-size: 15px; line-height: 1.5; text-align: center;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 16px; min-width: 120px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .result-display { 
            margin-top: 16px; font-size: 22px; font-family: monospace; 
            color: var(--accent-green); font-weight: bold;
        }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); min-height: 22px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 780px; max-width: 96%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="n-input" value="5">
        <label class="ui-label">r =</label>
        <input type="number" id="r-input" value="2">
        <label class="ui-label">p =</label>
        <input type="number" id="p-input" value="7">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(5,2,7)">Example 1 (5C2 mod 7)</button>
        <button onclick="loadExample(4,4,5)">Example 2 (4C4 mod 5)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">nCr mod Prime using Factorials + Modular Inverses (Fermat's Little Theorem)</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to start computation...</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Step</span>
            <span class="info-value" id="val-step" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">fact[n]</span>
            <span class="info-value" id="val-factn" style="color:var(--accent-blue)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">nCr mod p</span>
            <span class="info-value" id="val-result" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">Result will appear here</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:10px; font-size:12px">Speed:</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:1px solid var(--accent-orange)"></span> Processing</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:1px solid var(--accent-green)"></span> Final Result</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let n = 5, r = 2, p = 7;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function loadExample(newN, newR, newP) {
            n = parseInt(newN);
            r = parseInt(newR);
            p = parseInt(newP);
            document.getElementById('n-input').value = n;
            document.getElementById('r-input').value = r;
            document.getElementById('p-input').value = p;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valN = parseInt(document.getElementById('n-input').value);
            const valR = parseInt(document.getElementById('r-input').value);
            const valP = parseInt(document.getElementById('p-input').value);
            if (valN >= valR && valR >= 0 && valP > 1) {
                loadExample(valN, valR, valP);
            } else {
                alert("Invalid input: ensure n ≥ r ≥ 0 and p > 1");
            }
        }

        function modPow(base, exp, mod) {
            let result = 1;
            base %= mod;
            while (exp > 0) {
                if (exp % 2 === 1) result = (result * base) % mod;
                base = (base * base) % mod;
                exp = Math.floor(exp / 2);
            }
            return result;
        }

        function modInv(a, mod) {
            return modPow(a, mod - 2, mod);
        }

        function generateSteps() {
            steps = [];
            if (r > n || r < 0) {
                steps.push({
                    type: 'final',
                    result: 0,
                    panel: `Invalid: r > n<br>nCr = <b>0</b>`,
                    complete: true,
                    log: `r > n → nCr = 0`,
                    logColor: 'var(--accent-red)'
                });
                return;
            }

            let fact = new Array(n + 1).fill(1);
            for (let i = 1; i <= n; i++) {
                fact[i] = (fact[i - 1] * i) % p;
                steps.push({
                    type: 'fact',
                    i: i,
                    factVal: fact[i],
                    panel: `fact[${i}] = ${fact[i]} mod ${p}`,
                    statusText: `Computing factorial ${i}! mod ${p}`,
                    log: `fact[${i}] = (fact[${i-1}] * ${i}) % ${p} = ${fact[i]}`,
                    logColor: 'var(--accent-blue)'
                });
            }

            let invFactR = modInv(fact[r], p);
            let invFactNR = modInv(fact[n - r], p);

            steps.push({
                type: 'inv',
                panel: `inv(fact[${r}]) = ${invFactR}<br>inv(fact[${n-r}]) = ${invFactNR}`,
                statusText: `Computing modular inverses using Fermat`,
                log: `inv(fact[${r}]) = ${fact[r]}^(${p-2}) mod ${p} = ${invFactR}\ninv(fact[${n-r}]) = ${fact[n-r]}^(${p-2}) mod ${p} = ${invFactNR}`,
                logColor: 'var(--accent-purple)'
            });

            let result = (fact[n] * invFactR % p * invFactNR % p) % p;

            steps.push({
                type: 'final',
                result: result,
                panel: `Final Result:<br>nCr(${n}, ${r}) mod ${p} = <b>${result}</b>`,
                complete: true,
                statusText: `Computation complete`,
                log: `\n(fact[${n}] * inv(fact[${r}]) * inv(fact[${n-r}])) % ${p} = ${result}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show result as main tile when final
            if (step.complete) {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile factor`;
                tile.textContent = step.result;
                unit.appendChild(tile);
                const label = document.createElement('div');
                label.className = 'tile-index';
                label.textContent = `nCr mod p`;
                unit.appendChild(label);
                container.appendChild(unit);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-step').textContent = step.i !== undefined ? step.i : '—';
            document.getElementById('val-factn').textContent = step.factVal !== undefined ? step.factVal : '—';
            document.getElementById('val-result').textContent = step.result !== undefined ? step.result : '—';

            const res = document.getElementById('res-val');
            if (step.complete) {
                res.innerHTML = `<b>Result:</b> ${step.result}`;
            } else {
                res.textContent = 'Computing...';
            }

            document.getElementById('status-text').textContent = step.statusText;

            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const div = document.createElement('div');
                    div.style.color = steps[k].logColor || 'var(--text-main)';
                    if (steps[k].bold) div.style.fontWeight = 'bold';
                    div.textContent = steps[k].log;
                    logEl.appendChild(div);
                }
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = '❚❚ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        window.onload = () => loadExample(5, 2, 7);
    </script>
</body>
</html>
