<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or Odd Check - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            width: 140px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 20px; justify-content: center; align-items: center; min-height: 120px; }

        .number-box {
            background: #21262d;
            border: 3px solid var(--accent-orange);
            border-radius: 12px;
            padding: 20px 40px;
            font-size: 42px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 180px;
            text-align: center;
        }

        .operation {
            font-size: 28px;
            color: var(--text-dim);
        }

        .remainder-box {
            background: #21262d;
            border: 3px solid var(--accent-blue);
            border-radius: 12px;
            padding: 20px 30px;
            font-size: 32px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 100px;
            text-align: center;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; width: 680px; text-align: center;
            font-family: monospace; min-height: 80px; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin-top: 15px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 16px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 18px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 15px; font-size: 24px; font-weight: bold; }
        #res-val { transition: all 0.4s; }
        .pop { color: var(--accent-green); font-size: 32px; text-shadow: 0 0 15px var(--accent-green); }
        .pop-false { color: var(--accent-red); font-size: 32px; text-shadow: 0 0 15px var(--accent-red); }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); min-height: 24px; }

        .controls { margin-top: 25px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        .legend { margin-top: 15px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }

        .log-panel {
            margin-top: 20px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" placeholder="7" value="7">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(7)">Ex 1 (7)</button>
        <button onclick="loadExample(-4)">Ex 2 (-4)</button>
    </div>

    <div class="visual-container">
        <div class="tiles-wrapper" id="visual">
            <!-- Dynamically filled by JS -->
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Input Number</span>
            <span class="info-value" id="val-n" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">n % 2</span>
            <span class="info-value" id="val-rem" style="color:var(--accent-blue)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Result</span>
            <span class="info-value" id="val-result" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">is even or odd? =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="font-size:11px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item">🟠 Input Number</div>
        <div class="legend-item">🔵 Remainder (n % 2)</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputNumber = 7;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(7); }

        function loadExample(newNum) {
            inputNumber = parseInt(newNum);
            document.getElementById('num-input').value = inputNumber;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val)) loadExample(val);
            else alert("Please enter a valid integer.");
        }

        function generateSteps() {
            steps = [];
            const n = inputNumber;
            const rem = n % 2;
            const isEven = rem === 0;

            // Step 0: Init
            steps.push({
                type: 'init',
                panel: `Checking parity of <b>${n}</b><br>Using modulo 2 to determine even or odd.`,
                statusText: `Input: n = ${n}`,
                log: `Input n = ${n}`,
                logColor: 'var(--text-dim)'
            });

            // Step 1: Compute remainder
            steps.push({
                type: 'compute',
                rem: rem,
                panel: `Compute <code>${n} % 2</code><br>Remainder = <b>${rem}</b>`,
                statusText: `Calculating ${n} modulo 2...`,
                log: `Compute: ${n} % 2 = ${rem}`,
                logColor: 'var(--accent-blue)'
            });

            // Step 2: Final Result
            steps.push({
                type: 'final',
                isEven: isEven,
                panel: rem === 0 
                    ? `<span style="color:var(--accent-green)">Remainder is 0 → <b>EVEN</b></span>`
                    : `<span style="color:var(--accent-red)">Remainder is 1 → <b>ODD</b></span>`,
                statusText: `Result: ${isEven ? 'Even' : 'Odd'}`,
                log: `Final Result: ${isEven ? 'even' : 'odd'}`,
                logColor: isEven ? 'var(--accent-green)' : 'var(--accent-red)',
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('visual');
            container.innerHTML = `
                <div class="number-box" style="border-color: ${step.type === 'final' ? (step.isEven ? 'var(--accent-green)' : 'var(--accent-red)') : 'var(--accent-orange)'}">
                    ${inputNumber}
                </div>
                <div class="operation">%</div>
                <div class="remainder-box" style="border-color: var(--accent-blue)">
                    ${step.rem !== undefined ? step.rem : '?'}
                </div>
            `;

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-n').innerText = inputNumber;
            document.getElementById('val-rem').innerText = step.rem !== undefined ? step.rem : '—';
            document.getElementById('val-result').innerText = step.isEven !== undefined ? (step.isEven ? 'Even' : 'Odd') : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.isEven ? "even" : "odd";
                resVal.className = step.isEven ? 'pop' : 'pop-false';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
