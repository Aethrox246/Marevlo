<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Smallest Divisor - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 160px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 820px; min-height: 110px; position: relative; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 22px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 12px; color: var(--text-dim); font-family: monospace; }

        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.18); box-shadow: 0 0 15px rgba(227,179,65,0.5); }
        .tile.found { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.22); box-shadow: 0 0 18px var(--accent-green); }
        .tile.prime { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); }

        .action-panel {
            margin-top: 30px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 22px; width: 720px; text-align: center; font-family: monospace;
            min-height: 120px; font-size: 15px; line-height: 1.6;
        }

        .info-panel { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 16px; display: flex; flex-direction: column; align-items: center; min-width: 115px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .result-display { margin-top: 18px; text-align: center; }
        #res-val { font-size: 36px; font-family: monospace; font-weight: bold; transition: all 0.4s; }
        .pop { color: var(--accent-green) !important; text-shadow: 0 0 18px var(--accent-green); animation: popAnim 600ms; }

        @keyframes popAnim { 0%{transform:scale(0.6)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.4em; width: 620px; text-align: center; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 14px; height: 14px; border-radius: 3px; margin-right: 7px; }

        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 740px; max-width: 95%; height: 155px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.5px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="number" id="num-input" placeholder="12" value="12">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(12)">Ex 1 (12)</button>
        <button onclick="loadExample(17)">Ex 2 (17)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" id="arr-label">Checking divisors from 2 to √n</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current n</span>
            <span class="info-value" id="val-n" style="color:var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Checking i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">n % i</span>
            <span class="info-value" id="val-rem" style="color:var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">√n Limit</span>
            <span class="info-value" id="val-limit" style="color:var(--text-main);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="font-size:18px;">Smallest Divisor = </span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2a1600;border:2px solid var(--accent-orange)"></span> Checking</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a;border:2px solid var(--accent-green)"></span> Found Divisor</div>
        <div class="legend-item"><span class="dot" style="background:#1e1030;border:2px solid var(--accent-purple)"></span> Prime Number</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputNumber = 12;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 900, 450];

        function init() { loadExample(12); }

        function loadExample(newNum) {
            inputNumber = parseInt(newNum);
            document.getElementById('num-input').value = inputNumber;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('num-input').value);
            if (!isNaN(val) && val > 1) loadExample(val);
            else alert("Please enter a number greater than 1.");
        }

        function generateSteps() {
            steps = [];
            let n = inputNumber;
            let limit = Math.floor(Math.sqrt(n));

            steps.push({
                type: 'init',
                currentN: n,
                i: '—',
                rem: '—',
                limit: limit,
                panel: `Find smallest divisor of <b>${n}</b> (greater than 1).<br>We check from 2 to √${n} ≈ ${limit}.`,
                status: `Starting for n = ${n}`,
                log: `n = ${n}\nLimit = floor(√${n}) = ${limit}`
            });

            let found = false;
            for (let i = 2; i <= limit; i++) {
                let rem = n % i;
                steps.push({
                    type: 'check',
                    currentN: n,
                    i: i,
                    rem: rem,
                    limit: limit,
                    panel: `Checking i = <b>${i}</b><br>${n} % ${i} = <b>${rem}</b>`,
                    status: rem === 0 ? `Found divisor: ${i}` : `Not divisible`,
                    log: `i = ${i} → ${n} % ${i} = ${rem}`
                });

                if (rem === 0) {
                    found = true;
                    steps.push({
                        type: 'final',
                        currentN: n,
                        i: i,
                        rem: 0,
                        limit: limit,
                        panel: `<span style="color:var(--accent-green)">Smallest divisor found: <b>${i}</b></span>`,
                        status: `Result: ${i}`,
                        log: `Final Result: ${i}`,
                        isTrue: true
                    });
                    break;
                }
            }

            if (!found) {
                steps.push({
                    type: 'final',
                    currentN: n,
                    i: n,
                    rem: 0,
                    limit: limit,
                    panel: `<span style="color:var(--accent-purple)">No divisor found up to √n → <b>${n}</b> is prime.<br>Smallest divisor = ${n}</span>`,
                    status: `Result: ${n} (Prime)`,
                    log: `Final Result: ${n}`,
                    isTrue: true
                });
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Current n tile
            const nTile = document.createElement('div');
            nTile.className = 'tile-unit';
            const nDiv = document.createElement('div');
            nDiv.className = `tile ${step.type === 'final' && step.i === step.currentN ? 'prime' : 'candidate'}`;
            nDiv.innerText = step.currentN;
            const nLabel = document.createElement('div');
            nLabel.className = 'tile-index';
            nLabel.innerText = 'n';
            nTile.append(nDiv, nLabel);
            container.appendChild(nTile);

            // Checking i tile
            if (step.i !== '—') {
                const iTile = document.createElement('div');
                iTile.className = 'tile-unit';
                const iDiv = document.createElement('div');
                iDiv.className = `tile ${step.rem === 0 ? 'found' : 'candidate'}`;
                iDiv.innerText = step.i;
                const iLabel = document.createElement('div');
                iLabel.className = 'tile-index';
                iLabel.innerText = 'i';
                iTile.append(iDiv, iLabel);
                container.appendChild(iTile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;

            document.getElementById('val-n').innerText = step.currentN;
            document.getElementById('val-i').innerText = step.i;
            document.getElementById('val-rem').innerText = step.rem;
            document.getElementById('val-limit').innerText = step.limit;

            const resVal = document.getElementById('res-val');
            resVal.innerText = (step.type === 'final') ? step.i : '—';
            resVal.className = (step.type === 'final') ? 'pop' : '';

            document.getElementById('status-text').innerText = step.status;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    line.innerText = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
