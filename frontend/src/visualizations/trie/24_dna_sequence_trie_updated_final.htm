<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Sequence Trie</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --muted: #8b949e;
            --purple: #a371f7;
            --blue: #58a6ff;
            --green: #3fb950;
            --orange: #e3b341;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--purple); margin: 0 0 8px 0; }
        .subtitle { color: var(--muted); margin-bottom: 20px; }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }
        button {
            background: #21262d;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #30363d; }
        .main {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1350px;
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }
        .sequences-panel { width: 340px; }
        .trie-panel { width: 620px; }
        .label {
            color: var(--purple);
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        .array-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: #21262d;
            border-radius: 10px;
        }
        .tile {
            padding: 10px 18px;
            background: #30363d;
            border: 2px solid var(--orange);
            border-radius: 8px;
            font-family: monospace;
            font-size: 15px;
        }
        .trie {
            background: #21262d;
            border: 3px solid var(--blue);
            border-radius: 12px;
            padding: 20px;
            min-height: 480px;
            overflow: auto;
            font-family: monospace;
        }
        .trie-node {
            display: inline-block;
            background: #30363d;
            border: 3px solid #58a6ff;
            border-radius: 10px;
            padding: 14px 20px;
            margin: 12px 8px;
            text-align: center;
            position: relative;
        }
        .trie-node.current {
            border-color: var(--orange);
            box-shadow: 0 0 0 5px rgba(227,179,65,0.3);
        }
        .trie-node .label {
            font-size: 18px;
            font-weight: bold;
            color: var(--green);
        }
        .children {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
        }
        .info {
            margin: 20px 0;
            padding: 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: monospace;
            min-height: 140px;
        }
        .action {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            width: 100%;
            max-width: 1100px;
            margin: 20px 0;
            min-height: 110px;
            font-family: monospace;
        }
        .log {
            background: #000000;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            width: 100%;
            max-width: 1100px;
            height: 260px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>DNA Sequence Trie</h1>
    <p class="subtitle">Efficient Storage & Search using Trie (Array Children)</p>

    <div class="controls">
        <button onclick="loadExample(0)">Example 1: ACGT / TGCA</button>
        <button onclick="loadExample(1)">Example 2: AAA / CCC</button>
        <button onclick="resetViz()">Reset</button>
    </div>

    <div class="main">
        <div class="panel sequences-panel">
            <div class="label">Stored DNA Sequences</div>
            <div class="array-list" id="seq-list"></div>
        </div>

        <div class="panel trie-panel">
            <div class="label">DNA Trie (A=0, C=1, G=2, T=3)</div>
            <div class="trie" id="trie"></div>
        </div>
    </div>

    <div class="info">
        <strong>Operation:</strong> <span id="current-op" style="color:var(--orange)"></span><br>
        <strong>Current Seq:</strong> <span id="current-seq" style="color:var(--green)"></span><br>
        <strong>Result:</strong> <span id="result" style="font-size:22px;"></span>
    </div>

    <div class="action" id="action">Click an example to start visualization</div>

    <div class="controls">
        <button onclick="prevStep()">← Prev</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1" style="width:180px"></label>
    </div>

    <div class="log" id="log"></div>

    <script>
        let root = null;
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        let stored = [];

        class TrieNode {
            constructor() {
                this.children = new Array(4).fill(null);
                this.isEnd = false;
            }
        }

        function charToIdx(ch) {
            const map = {'A':0, 'C':1, 'G':2, 'T':3};
            return map[ch] !== undefined ? map[ch] : -1;
        }

        function createTrie() {
            return new TrieNode();
        }

        function insert(sequence) {
            let node = root;
            const path = [];
            for (let ch of sequence) {
                const idx = charToIdx(ch);
                path.push(ch);
                if (!node.children[idx]) {
                    node.children[idx] = new TrieNode();
                }
                node = node.children[idx];
            }
            node.isEnd = true;
            return path;
        }

        function search(sequence) {
            let node = root;
            const path = [];
            for (let ch of sequence) {
                const idx = charToIdx(ch);
                path.push(ch);
                if (!node || !node.children[idx]) {
                    return {found: false, path};
                }
                node = node.children[idx];
            }
            return {found: node && node.isEnd, path};
        }

        function generateSteps(sequences, searches) {
            stored = [];
            root = createTrie();
            steps = [];

            steps.push({
                action: "Initialize Trie",
                log: "Root node created",
                seq: "",
                result: "",
                highlight: [],
                op: "Init"
            });

            // Inserts
            for (let seq of sequences) {
                stored.push(seq);
                const path = insert(seq);
                steps.push({
                    action: `Insert "${seq}"`,
                    log: `Inserted ${seq}`,
                    seq: seq,
                    result: "Inserted",
                    highlight: path,
                    op: "Insert"
                });
            }

            // Searches
            for (let q of searches) {
                const res = search(q);
                steps.push({
                    action: `Search "${q}"`,
                    log: `Search "${q}" → ${res.found ? 'Found' : 'Not Found'}`,
                    seq: q,
                    result: res.found ? "✅ Found" : "❌ Not Found",
                    highlight: res.path,
                    op: "Search"
                });
            }
        }

        function buildTrieHTML(node, prefix = "", highlight = [], depth = 0) {
            if (!node) return '';
            const isHighlight = highlight.length > depth;
            let html = `<div class="trie-node ${isHighlight ? 'current' : ''}">`;
            html += `<div class="label">${prefix || 'ROOT'}</div>`;

            let hasChildren = false;
            let chHTML = '<div class="children">';
            for (let i = 0; i < 4; i++) {
                if (node.children[i]) {
                    hasChildren = true;
                    const ch = ['A','C','G','T'][i];
                    chHTML += buildTrieHTML(node.children[i], prefix + ch, highlight, depth + 1);
                }
            }
            chHTML += '</div>';

            if (hasChildren) html += chHTML;
            if (node.isEnd) html += `<div style="color:#3fb950; font-size:12px; margin-top:6px;">END</div>`;
            html += '</div>';
            return html;
        }

        function renderTrie(highlight = []) {
            document.getElementById('trie').innerHTML = buildTrieHTML(root, "", highlight);
        }

        function renderSequences() {
            const cont = document.getElementById('seq-list');
            cont.innerHTML = stored.map(s => `<div class="tile">${s}</div>`).join('');
        }

        function renderStep(idx) {
            stepIdx = Math.max(0, Math.min(idx, steps.length - 1));
            const step = steps[stepIdx];

            document.getElementById('current-op').textContent = step.op;
            document.getElementById('current-seq').textContent = step.seq || '—';
            document.getElementById('result').innerHTML = step.result || '—';
            document.getElementById('action').innerHTML = `<strong>${step.action}</strong>`;

            renderSequences();
            renderTrie(step.highlight || []);

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, stepIdx + 1).map(s => `<div>${s.log}</div>`).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                const speeds = [900, 450, 180];
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, speeds[parseInt(document.getElementById('speed').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function resetViz() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function loadExample(n) {
            let seqs = [], searches = [];
            if (n === 0) {
                seqs = ['ACGT', 'TGCA'];
                searches = ['ACGT'];
            } else {
                seqs = ['AAA', 'CCC'];
                searches = ['GGG'];
            }
            generateSteps(seqs, searches);
            resetViz();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
