<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replace Words in Sentence - Trie</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --muted: #8b949e;
            --purple: #a371f7;
            --blue: #58a6ff;
            --green: #3fb950;
            --orange: #e3b341;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--purple); margin: 0 0 8px 0; }
        .subtitle { color: var(--muted); margin-bottom: 20px; }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }
        button {
            background: #21262d;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #30363d; }
        .main {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1300px;
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }
        .words-panel { width: 360px; }
        .trie-panel { width: 620px; }
        .label {
            color: var(--purple);
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        .words-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: #21262d;
            border-radius: 10px;
            min-height: 160px;
        }
        .tile {
            padding: 8px 16px;
            background: #30363d;
            border: 2px solid var(--orange);
            border-radius: 8px;
            font-family: monospace;
        }
        .trie {
            background: #21262d;
            border: 3px solid var(--blue);
            border-radius: 12px;
            padding: 20px;
            min-height: 460px;
            overflow: auto;
            font-family: monospace;
        }
        .trie-node {
            display: inline-block;
            background: #30363d;
            border: 3px solid #58a6ff;
            border-radius: 10px;
            padding: 12px 18px;
            margin: 12px 8px;
            text-align: center;
            position: relative;
        }
        .trie-node.current {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(227,179,65,0.4);
        }
        .trie-node .end {
            color: var(--green);
            font-size: 13px;
            margin-top: 4px;
        }
        .children {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 14px;
        }
        .sentence {
            margin: 20px 0;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: monospace;
            min-height: 80px;
        }
        .action {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            width: 100%;
            max-width: 1100px;
            margin: 20px 0;
            min-height: 110px;
            font-family: monospace;
        }
        .log {
            background: #000000;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            width: 100%;
            max-width: 1100px;
            height: 240px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Replace Words in Sentence</h1>
    <p class="subtitle">Trie + Shortest Root Replacement</p>

    <div class="controls">
        <button onclick="loadExample(0)">Example 1: cattle → cat</button>
        <button onclick="loadExample(1)">Example 2: aadsfasf → a</button>
        <button onclick="resetViz()">Reset</button>
    </div>

    <div class="main">
        <div class="panel words-panel">
            <div class="label">Dictionary Roots</div>
            <div class="words-list" id="dict-words"></div>
        </div>

        <div class="panel trie-panel">
            <div class="label">Trie (Current Word Path)</div>
            <div class="trie" id="trie"></div>
        </div>
    </div>

    <div class="sentence">
        <strong>Original:</strong> <span id="orig-sentence"></span><br>
        <strong>Result:</strong> <span id="result-sentence" style="color:var(--green)"></span>
    </div>

    <div class="action" id="action">Click example to start</div>

    <div class="controls">
        <button onclick="prevStep()">← Prev</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log" id="log"></div>

    <script>
        let root = null;
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        let dict = [];
        let sentenceWords = [];
        let resultWords = [];

        class TrieNode {
            constructor() {
                this.children = new Array(26).fill(null);
                this.isEnd = false;
            }
        }

        function createTrie() {
            return new TrieNode();
        }

        function insert(word) {
            let node = root;
            const path = [];
            for (let ch of word) {
                const idx = ch.charCodeAt(0) - 97;
                path.push(ch);
                if (!node.children[idx]) node.children[idx] = new TrieNode();
                node = node.children[idx];
            }
            node.isEnd = true;
            return path;
        }

        function findShortestRoot(word) {
            let node = root;
            let prefix = '';
            const path = [];
            for (let ch of word) {
                const idx = ch.charCodeAt(0) - 97;
                path.push(ch);
                if (!node.children[idx]) break;
                node = node.children[idx];
                prefix += ch;
                if (node.isEnd) {
                    return {root: prefix, path};
                }
            }
            return {root: word, path: []};
        }

        function generateSteps(dictionary, sentence) {
            root = createTrie();
            dict = [...dictionary];
            sentenceWords = sentence.split(' ');
            resultWords = [];
            steps = [];

            // Init
            steps.push({
                action: "Initialize Trie",
                panel: "Trie ready",
                log: "Root created",
                highlight: [],
                resultSentence: sentence
            });

            // Insert dictionary
            for (let word of dictionary) {
                const path = insert(word);
                steps.push({
                    action: `Insert root "${word}"`,
                    panel: `Inserted "${word}"`,
                    log: `Path: ${path.join('')}`,
                    highlight: path,
                    resultSentence: sentence
                });
            }

            // Process sentence words
            let currentResult = [];
            for (let i = 0; i < sentenceWords.length; i++) {
                const word = sentenceWords[i];
                const {root: replacement, path} = findShortestRoot(word);
                currentResult.push(replacement);
                resultWords.push(replacement);

                steps.push({
                    action: `Process "${word}" → "${replacement}"`,
                    panel: `"${word}" replaced with <span style="color:var(--green)">"${replacement}"</span>`,
                    log: `Found root: ${replacement}`,
                    highlight: path,
                    resultSentence: currentResult.join(' ')
                });
            }

            // Final
            steps.push({
                action: "Complete",
                panel: `Final: <span style="color:var(--green)">${resultWords.join(' ')}</span>`,
                log: "Replacement finished",
                highlight: [],
                resultSentence: resultWords.join(' ')
            });
        }

        function renderDict() {
            const cont = document.getElementById('dict-words');
            cont.innerHTML = dict.map(w => `<div class="tile">"${w}"</div>`).join('');
        }

        function buildTrieHTML(node, prefix = "", highlight = []) {
            if (!node) return '';
            let html = `<div class="trie-node ${highlight.length && prefix.length <= highlight.length ? 'current' : ''}">`;
            html += `<div>${prefix || 'ROOT'}</div>`;
            if (node.isEnd) html += `<div class="end">ROOT</div>`;

            let chHtml = '<div class="children">';
            let has = false;
            for (let i = 0; i < 26; i++) {
                if (node.children[i]) {
                    has = true;
                    const ch = String.fromCharCode(97 + i);
                    chHtml += buildTrieHTML(node.children[i], prefix + ch, highlight);
                }
            }
            chHtml += '</div>';
            if (has) html += chHtml;
            html += '</div>';
            return html;
        }

        function renderTrie(highlight = []) {
            const cont = document.getElementById('trie');
            cont.innerHTML = buildTrieHTML(root, "", highlight);
        }

        function renderStep(idx) {
            stepIdx = Math.max(0, Math.min(idx, steps.length - 1));
            const step = steps[stepIdx];

            document.getElementById('action').innerHTML = step.panel;
            document.getElementById('orig-sentence').textContent = sentenceWords.join(' ');
            document.getElementById('result-sentence').textContent = step.resultSentence || '';

            renderDict();
            renderTrie(step.highlight || []);

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, stepIdx + 1).map(s => `<div>${s.log}</div>`).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                const speedMap = [1650, 850, 380];
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, speedMap[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function resetViz() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function loadExample(n) {
            const examples = [
                {
                    dict: ["cat", "bat", "rat"],
                    sentence: "the cattle was rattled by the battery"
                },
                {
                    dict: ["a", "b", "c"],
                    sentence: "aadsfasf absbs bbab cadsfafs"
                }
            ];
            const ex = examples[n];
            generateSteps(ex.dict, ex.sentence);
            resetViz();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
