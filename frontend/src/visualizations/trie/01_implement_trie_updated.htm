<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implement Trie (Prefix Tree)</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent-purple); margin: 0 0 8px 0; }

        .input-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid var(--border-main);
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .viz {
            display: flex;
            gap: 40px;
            width: 100%;
            max-width: 1200px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .words {
            text-align: center;
        }

        .label {
            color: var(--accent-purple);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .words-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background: #21262d;
            border-radius: 10px;
            max-width: 400px;
        }

        .tile {
            padding: 8px 14px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 15px;
            background: #21262d;
            border: 2px solid var(--accent-orange);
        }

        .trie-container {
            text-align: center;
        }

        .trie {
            background: #21262d;
            border: 3px solid var(--accent-blue);
            border-radius: 12px;
            padding: 20px;
            min-height: 380px;
            width: 520px;
            position: relative;
            overflow: auto;
        }

        .node {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 8px;
            background: #30363d;
            border: 2px solid #58a6ff;
            font-family: monospace;
            font-size: 14px;
            margin: 6px;
            text-align: center;
            position: relative;
        }

        .node.end { border-color: var(--accent-green); box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.3); }

        .children {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-top: 8px;
            font-size: 12px;
        }

        .child-slot {
            padding: 2px 6px;
            background: #21262d;
            border: 1px dashed #8b949e;
            border-radius: 4px;
        }

        .info {
            margin: 20px 0;
            text-align: center;
            font-family: monospace;
            font-size: 18px;
        }

        .action-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 18px;
            width: 100%;
            max-width: 1000px;
            min-height: 140px;
            margin: 20px 0;
            font-family: monospace;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-panel {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 16px;
            width: 100%;
            max-width: 1000px;
            height: 260px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Implement Trie (Prefix Tree)</h1>
    <p style="color:var(--text-dim);margin-bottom:20px;">Standard Array[26] Children</p>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetSim()">Reset</button>
    </div>

    <div class="viz">
        <div class="words">
            <div class="label">Inserted Words</div>
            <div class="words-list" id="words-vis"></div>
        </div>

        <div class="trie-container">
            <div class="label">Trie Structure</div>
            <div class="trie" id="trie-vis"></div>
        </div>
    </div>

    <div class="info" id="info">
        Result: <span id="result-val" style="color:var(--accent-green)">—</span>
    </div>

    <div class="action-panel" id="action">Click an example to begin</div>

    <div class="controls">
        <button onclick="prevStep()">← Prev</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let insertedWords = [];
        let root = null;
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        const delays = [1650, 850, 380];

        class TrieNode {
            constructor() {
                this.children = new Array(26).fill(null);
                this.isEnd = false;
            }
        }

        function createTrie() {
            return new TrieNode();
        }

        function insert(word) {
            let node = root;
            for (let char of word) {
                const idx = char.charCodeAt(0) - 97;
                if (!node.children[idx]) {
                    node.children[idx] = new TrieNode();
                }
                node = node.children[idx];
            }
            node.isEnd = true;
        }

        function search(word) {
            let node = root;
            for (let char of word) {
                const idx = char.charCodeAt(0) - 97;
                if (!node.children[idx]) return false;
                node = node.children[idx];
            }
            return node.isEnd;
        }

        function startsWith(prefix) {
            let node = root;
            for (let char of prefix) {
                const idx = char.charCodeAt(0) - 97;
                if (!node.children[idx]) return false;
                node = node.children[idx];
            }
            return true;
        }

        function generateSteps(example) {
            root = createTrie();
            insertedWords = [];
            steps = [];

            steps.push({
                action: "Initialize Trie",
                panel: "Root node created",
                log: "Trie initialized",
                words: [],
                result: null,
                highlightPath: []
            });

            const operations = example.operations || [];

            for (let op of operations) {
                if (op.type === 'insert') {
                    insert(op.word);
                    insertedWords.push(op.word);
                    steps.push({
                        action: `Insert "${op.word}"`,
                        panel: `Inserted "${op.word}"`,
                        log: `Insert "${op.word}"`,
                        words: [...insertedWords],
                        result: null,
                        highlightPath: op.word.split('')
                    });
                } else if (op.type === 'search') {
                    const res = search(op.word);
                    steps.push({
                        action: `Search "${op.word}"`,
                        panel: `Search "${op.word}" → <span style="color:${res?'#3fb950':'#f85149'}">${res}</span>`,
                        log: `Search "${op.word}" = ${res}`,
                        words: [...insertedWords],
                        result: res,
                        highlightPath: op.word.split('')
                    });
                } else if (op.type === 'startsWith') {
                    const res = startsWith(op.word);
                    steps.push({
                        action: `StartsWith "${op.word}"`,
                        panel: `StartsWith "${op.word}" → <span style="color:${res?'#3fb950':'#f85149'}">${res}</span>`,
                        log: `StartsWith "${op.word}" = ${res}`,
                        words: [...insertedWords],
                        result: res,
                        highlightPath: op.word.split('')
                    });
                }
            }
        }

        function renderWords(words) {
            const cont = document.getElementById('words-vis');
            cont.innerHTML = '';
            words.forEach(w => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = w;
                cont.appendChild(tile);
            });
        }

        function renderTrie(highlightPath = []) {
            const cont = document.getElementById('trie-vis');
            cont.innerHTML = '';

            function buildNode(node, depth = 0, path = '') {
                if (!node) return '';

                let html = `<div class="node ${node.isEnd ? 'end' : ''}" style="margin-left:${depth*20}px">`;
                html += `<strong>${path || 'ROOT'}</strong>`;

                let hasChildren = false;
                let childHtml = '<div class="children">';
                for (let i = 0; i < 26; i++) {
                    if (node.children[i]) {
                        hasChildren = true;
                        const ch = String.fromCharCode(97 + i);
                        childHtml += `<div class="child-slot">${ch}</div>`;
                    }
                }
                childHtml += '</div>';

                if (hasChildren) html += childHtml;
                html += '</div>';

                return html;
            }

            let html = buildNode(root);
            cont.innerHTML = html;
        }

        function renderStep(idx) {
            stepIdx = idx;
            const step = steps[idx];
            if (!step) return;

            document.getElementById('action').innerHTML = step.panel;
            renderWords(step.words);
            renderTrie(step.highlightPath);

            document.getElementById('result-val').textContent = step.result !== null ? step.result : '—';

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, idx + 1).map(s => 
                `<div style="margin:4px 0;">${s.log}</div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, delays[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function resetSim() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function loadExample(n) {
            const examples = [
                {
                    operations: [
                        {type:'insert', word:'apple'},
                        {type:'search', word:'apple'},
                        {type:'search', word:'app'},
                        {type:'startsWith', word:'app'},
                        {type:'insert', word:'app'},
                        {type:'search', word:'app'}
                    ]
                },
                {
                    operations: [
                        {type:'insert', word:'cat'},
                        {type:'insert', word:'car'},
                        {type:'insert', word:'card'},
                        {type:'search', word:'car'},
                        {type:'startsWith', word:'ca'},
                        {type:'search', word:'dog'},
                        {type:'startsWith', word:'d'}
                    ]
                }
            ];
            generateSteps(examples[n]);
            resetSim();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
