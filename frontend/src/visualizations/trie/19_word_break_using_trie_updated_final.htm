<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Break using Trie</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --muted: #8b949e;
            --purple: #a371f7;
            --blue: #58a6ff;
            --green: #3fb950;
            --orange: #e3b341;
            --red: #ff7b72;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--purple); margin: 0 0 8px 0; }
        .subtitle { color: var(--muted); margin-bottom: 20px; }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }
        button {
            background: #21262d;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #30363d; }
        .main {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1350px;
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }
        .dict-panel { width: 320px; }
        .string-panel { width: 520px; }
        .trie-panel { width: 620px; }
        .dp-panel { width: 100%; max-width: 1100px; margin-top: 20px; }
        .label {
            color: var(--purple);
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        .words-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background: #21262d;
            border-radius: 10px;
            min-height: 120px;
        }
        .tile {
            padding: 6px 14px;
            background: #30363d;
            border: 2px solid var(--orange);
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
        }
        .string-container {
            background: #21262d;
            border: 3px solid var(--blue);
            border-radius: 12px;
            padding: 20px;
            font-family: monospace;
            font-size: 22px;
            letter-spacing: 4px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .char {
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .char.current {
            background: var(--orange);
            color: #0d1117;
            font-weight: bold;
        }
        .char.valid {
            background: var(--green);
            color: #0d1117;
        }
        .trie {
            background: #21262d;
            border: 3px solid var(--blue);
            border-radius: 12px;
            padding: 20px;
            min-height: 420px;
            overflow: auto;
            font-family: monospace;
        }
        .trie-node {
            display: inline-block;
            background: #30363d;
            border: 3px solid #58a6ff;
            border-radius: 10px;
            padding: 10px 16px;
            margin: 10px 6px;
            text-align: center;
            position: relative;
        }
        .trie-node.current {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(227,179,65,0.4);
        }
        .trie-node .end {
            color: var(--green);
            font-size: 12px;
        }
        .children {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
        }
        .dp-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 12px 0;
            font-family: monospace;
        }
        .dp-cell {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: #21262d;
            font-weight: bold;
        }
        .dp-cell.true {
            background: var(--green);
            color: #0d1117;
            border-color: var(--green);
        }
        .action {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            width: 100%;
            max-width: 1100px;
            margin: 20px 0;
            min-height: 110px;
            font-family: monospace;
        }
        .log {
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            width: 100%;
            max-width: 1100px;
            height: 220px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Word Break using Trie</h1>
    <p class="subtitle">Trie + DP → Can the string be segmented?</p>

    <div class="controls">
        <button onclick="loadExample(0)">Example 1: leetcode</button>
        <button onclick="loadExample(1)">Example 2: applepenapple</button>
        <button onclick="resetViz()">Reset</button>
    </div>

    <div class="main">
        <div class="panel dict-panel">
            <div class="label">Dictionary</div>
            <div class="words-list" id="dict-words"></div>
        </div>

        <div class="panel string-panel">
            <div class="label">Input String</div>
            <div class="string-container" id="string-view"></div>
        </div>

        <div class="panel trie-panel">
            <div class="label">Trie (Dictionary)</div>
            <div class="trie" id="trie"></div>
        </div>
    </div>

    <div class="panel dp-panel">
        <div class="label">DP Array (True = segmentable up to this index)</div>
        <div class="dp-row" id="dp-row"></div>
    </div>

    <div class="action" id="action">Click example to start</div>

    <div class="controls">
        <button onclick="prevStep()">← Prev</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <label>Speed <input type="range" id="speed" min="0" max="2" value="1"></label>
    </div>

    <div class="log" id="log"></div>

    <script>
        let root = null;
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let isPlaying = false;
        let s = "";
        let dict = [];
        let dp = [];

        class TrieNode {
            constructor() {
                this.children = new Array(26).fill(null);
                this.isEnd = false;
            }
        }

        function createTrie() {
            return new TrieNode();
        }

        function insert(word) {
            let node = root;
            const path = [];
            for (let ch of word) {
                const idx = ch.charCodeAt(0) - 97;
                path.push(ch);
                if (!node.children[idx]) node.children[idx] = new TrieNode();
                node = node.children[idx];
            }
            node.isEnd = true;
            return path;
        }

        function buildTrie(words) {
            root = createTrie();
            for (let word of words) {
                insert(word);
            }
        }

        function generateSteps(inputStr, wordDict) {
            s = inputStr;
            dict = [...wordDict];
            buildTrie(dict);
            dp = new Array(s.length + 1).fill(false);
            dp[0] = true;

            steps = [];

            steps.push({
                action: "Initialize",
                panel: `String: <span style="color:var(--orange)">${s}</span> | DP[0] = true`,
                log: "Trie built + DP[0] = true (empty string)",
                highlight: [],
                currentPos: 0,
                dpState: [...dp],
                prefixPath: []
            });

            for (let i = 0; i <= s.length; i++) {
                if (!dp[i]) continue;

                let node = root;
                let path = [];
                for (let j = i; j < s.length; j++) {
                    const idx = s[j].charCodeAt(0) - 97;
                    path.push(s[j]);
                    if (!node.children[idx]) break;
                    node = node.children[idx];

                    if (node.isEnd) {
                        const end = j + 1;
                        if (!dp[end]) {
                            dp[end] = true;
                            steps.push({
                                action: `Found word "${path.join('')}" from ${i} → ${end}`,
                                panel: `Set dp[${end}] = true`,
                                log: `Valid segmentation: ${s.slice(i, end)}`,
                                highlight: path,
                                currentPos: end,
                                dpState: [...dp],
                                prefixPath: path
                            });
                        }
                    }
                }
            }

            const final = dp[s.length];
            steps.push({
                action: `Final Result: ${final}`,
                panel: final ? `<span style="color:var(--green)">✅ Can be segmented!</span>` : `<span style="color:var(--red)">❌ Cannot be segmented</span>`,
                log: `dp[${s.length}] = ${final}`,
                highlight: [],
                currentPos: s.length,
                dpState: [...dp],
                prefixPath: []
            });
        }

        function renderDict() {
            const cont = document.getElementById('dict-words');
            cont.innerHTML = dict.map(w => `<div class="tile">${w}</div>`).join('');
        }

        function renderString(pos = 0) {
            const cont = document.getElementById('string-view');
            let html = '';
            for (let i = 0; i < s.length; i++) {
                let cls = '';
                if (i === pos) cls = 'current';
                else if (dp[i + 1]) cls = 'valid';
                html += `<span class="char ${cls}">${s[i]}</span>`;
            }
            cont.innerHTML = html;
        }

        function buildTrieHTML(node, prefix = "", highlight = []) {
            if (!node) return '';
            let html = `<div class="trie-node ${highlight.length && prefix.length <= highlight.length ? 'current' : ''}">`;
            html += `<div>${prefix || 'ROOT'}</div>`;
            if (node.isEnd) html += `<div class="end">END</div>`;

            let chHtml = '<div class="children">';
            let has = false;
            for (let i = 0; i < 26; i++) {
                if (node.children[i]) {
                    has = true;
                    const ch = String.fromCharCode(97 + i);
                    chHtml += buildTrieHTML(node.children[i], prefix + ch, highlight);
                }
            }
            chHtml += '</div>';
            if (has) html += chHtml;
            html += '</div>';
            return html;
        }

        function renderTrie(highlight = []) {
            const cont = document.getElementById('trie');
            cont.innerHTML = buildTrieHTML(root, "", highlight);
        }

        function renderDP() {
            const cont = document.getElementById('dp-row');
            let html = '';
            for (let i = 0; i <= s.length; i++) {
                const val = dp[i] ? 'T' : 'F';
                const cls = dp[i] ? 'true' : '';
                html += `<div class="dp-cell ${cls}">${val}<br><small>${i}</small></div>`;
            }
            cont.innerHTML = html;
        }

        function renderStep(idx) {
            stepIdx = Math.max(0, Math.min(idx, steps.length - 1));
            const step = steps[stepIdx];

            document.getElementById('action').innerHTML = step.panel;
            renderString(step.currentPos || 0);
            renderTrie(step.prefixPath || []);
            renderDP();

            const logEl = document.getElementById('log');
            logEl.innerHTML = steps.slice(0, stepIdx + 1).map(s => `<div>${s.log}</div>`).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function nextStep() {
            if (stepIdx < steps.length - 1) renderStep(stepIdx + 1);
            else pause();
        }

        function prevStep() {
            if (stepIdx > 0) renderStep(stepIdx - 1);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                pause();
            } else {
                isPlaying = true;
                btn.textContent = '❚❚ Pause';
                const speedMap = [1400, 700, 350];
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) nextStep();
                    else pause();
                }, speedMap[document.getElementById('speed').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function resetViz() {
            pause();
            stepIdx = 0;
            renderStep(0);
        }

        function loadExample(n) {
            const examples = [
                {
                    s: "leetcode",
                    dict: ["leet", "code"]
                },
                {
                    s: "applepenapple",
                    dict: ["apple", "pen"]
                }
            ];
            const ex = examples[n];
            generateSteps(ex.s, ex.dict);
            resetViz();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
