<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Palindrome Pairs Visualization</title>

<style>

:root{
    --bg:#000000;
    --surface:#161b22;
    --border:#30363d;
    --text:#c9d1d9;
    --purple:#a371f7;
    --blue:#58a6ff;
    --green:#3fb950;
    --orange:#e3b341;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    color:var(--purple);
}

.subtitle{
    text-align:center;
    color:#8b949e;
    margin-bottom:20px;
}

.controls{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    background:#21262d;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#30363d;
}

.main{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
    justify-content:center;
}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
}

.words-panel{
    width:320px;
}

.result-panel{
    width:520px;
}

.label{
    color:var(--blue);
    margin-bottom:10px;
    font-weight:bold;
}

.word-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.tile{
    background:#30363d;
    border:2px solid var(--orange);
    padding:10px 18px;
    border-radius:8px;
    font-family:monospace;
}

.info{
    background:#21262d;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
    font-family:monospace;
}

.result{
    font-size:28px;
    color:var(--green);
    font-weight:bold;
}

.log{
    background:#0b0f14;
    border-radius:10px;
    padding:15px;
    height:320px;
    overflow:auto;
    font-family:monospace;
    line-height:1.8;
}

</style>
</head>

<body>

<h1>Palindrome Pairs</h1>

<div class="subtitle">
Find all palindrome index pairs
</div>

<div class="controls">

    <button onclick="loadExample1()">
        Example 1
    </button>

    <button onclick="loadExample2()">
        Example 2
    </button>

</div>

<div class="controls">

    <button onclick="prevStep()">
        ← Prev
    </button>

    <button onclick="togglePlay()"
            id="playBtn">
        ▶ Play
    </button>

    <button onclick="nextStep()">
        Next →
    </button>

</div>

<div class="main">

    <div class="panel words-panel">

        <div class="label">
            Words
        </div>

        <div id="words"
             class="word-list">
        </div>

    </div>

    <div class="panel result-panel">

        <div class="label">
            Current Step
        </div>

        <div id="stepInfo"
             class="info">
        </div>

        <br>

        <div class="label">
            Result
        </div>

        <div id="result"
             class="result">
        </div>

    </div>

</div>

<br>

<div class="panel">

    <div class="label">
        Execution Logs
    </div>

    <div id="logs"
         class="log">
    </div>

</div>

<script>

let steps = [];

let currentStep = 0;

let timer = null;

let isPlaying = false;

function renderWords(words){

    document.getElementById(
        "words"
    ).innerHTML =

        words.map(
            w =>
            `
            <div class="tile">
                ${w}
            </div>
            `
        ).join("");
}

function renderStep(){

    const step =
        steps[currentStep];

    document.getElementById(
        "stepInfo"
    ).innerHTML =
        step.info;

    document.getElementById(
        "result"
    ).innerHTML =
        step.result;

    document.getElementById(
        "logs"
    ).innerHTML =
        step.logs.join("<br>");
}

function nextStep(){

    if(currentStep < steps.length - 1){

        currentStep++;

        renderStep();
    }
    else{

        pausePlay();
    }
}

function prevStep(){

    if(currentStep > 0){

        currentStep--;

        renderStep();
    }
}

function togglePlay(){

    if(isPlaying){

        pausePlay();
    }
    else{

        startPlay();
    }
}

function startPlay(){

    isPlaying = true;

    document.getElementById(
        "playBtn"
    ).innerHTML =
        "⏸ Pause";

    timer = setInterval(() => {

        if(currentStep < steps.length - 1){

            nextStep();
        }
        else{

            pausePlay();
        }

    }, 1500);
}

function pausePlay(){

    clearInterval(timer);

    isPlaying = false;

    document.getElementById(
        "playBtn"
    ).innerHTML =
        "▶ Play";
}

function isPalindrome(str){

    return str ===
           str.split("")
              .reverse()
              .join("");
}

function generateSteps(words){

    steps = [];

    renderWords(words);

    let logs = [];

    let resultPairs = [];

    steps.push({

        info:
            `Initialize palindrome search`,

        result:
            `[]`,

        logs:
            ["Trie created with reversed words"]
    });

    for(let word of words){

        logs.push(
            `Inserted reversed "${word}"`
        );

        steps.push({

            info:
                `Insert reversed "${word}"`,

            result:
                JSON.stringify(resultPairs),

            logs:
                [...logs]
        });
    }

    for(let i = 0; i < words.length; i++){

        logs.push(
            `Checking word "${words[i]}"`
        );

        let foundPairs = [];

        for(let j = 0; j < words.length; j++){

            if(i === j) continue;

            const combined =
                words[i] + words[j];

            if(isPalindrome(combined)){

                const pair = [i,j];

                const exists =
                    resultPairs.some(
                        p =>
                        p[0] === i &&
                        p[1] === j
                    );

                if(!exists){

                    resultPairs.push(pair);

                    foundPairs.push(
                        `[${i},${j}]`
                    );

                    logs.push(
                        `
                        ${words[i]} + ${words[j]}
                        = ${combined}
                        → palindrome
                        `
                    );
                }
            }
        }

        if(foundPairs.length === 0){

            logs.push(
                `Found pair(s): none`
            );
        }
        else{

            logs.push(
                `
                Found pair(s):
                ${foundPairs.join(", ")}
                `
            );
        }

        steps.push({

            info:
                `
                Check pairs for
                "${words[i]}"
                `,

            result:
                JSON.stringify(resultPairs),

            logs:
                [...logs]
        });
    }

    logs.push(
        `
        Final result:
        ${JSON.stringify(resultPairs)}
        `
    );

    steps.push({

        info:
            `Completed palindrome search`,

        result:
            JSON.stringify(resultPairs),

        logs:
            [...logs]
    });

    currentStep = 0;

    renderStep();
}

function loadExample1(){

    generateSteps(
        ["bat","tab","cat"]
    );
}

function loadExample2(){

    generateSteps(
        ["a","b","c","aa"]
    );
}

loadExample1();

</script>

</body>
</html>
