<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trie Compression - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        button {
            height: 32px; border-radius: 6px; padding: 0 16px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container {
            margin-top: 30px;
            display: flex;
            gap: 40px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .trie-area {
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 15px;
            min-width: 420px;
        }
        .node {
            display: inline-block;
            padding: 8px 14px;
            margin: 4px;
            background: #21262d;
            border: 2px solid var(--accent-blue);
            border-radius: 6px;
            font-family: monospace;
            position: relative;
        }
        .node.end { border-color: var(--accent-green); }

        .result-area {
            background: var(--bg-surface);
            border: 2px solid var(--accent-green);
            border-radius: 8px;
            padding: 15px;
            width: 260px;
        }

        .action-panel {
            margin-top: 25px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 16px 22px;
            width: 860px;
            text-align: center;
            font-family: monospace;
            min-height: 90px;
            font-size: 15px;
            line-height: 1.5;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .log-panel {
            margin-top: 15px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 12px 16px;
            width: 860px;
            height: 160px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13.5px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetAll()">Reset</button>
    </div>

    <div class="visual-container">
        <!-- Trie Visualization -->
        <div class="trie-area">
            <div style="margin-bottom:8px; font-weight:bold; color:var(--accent-blue);">Trie Structure</div>
            <div id="trie-visual" style="font-family:monospace; line-height:1.6;"></div>
        </div>

        <!-- Current Operation -->
        <div style="text-align:center; min-width:320px;">
            <div style="color:var(--accent-orange); font-weight:bold; margin-bottom:12px;">Current Operation</div>
            <div id="current-op" style="font-size:22px; background:var(--bg-surface); padding:20px; border-radius:8px; border:2px solid var(--accent-orange); min-height:100px;"></div>
        </div>

        <!-- Result -->
        <div class="result-area">
            <h3 style="margin:0 0 12px 0; color:var(--accent-green);">Search Result</h3>
            <div id="result-value" style="font-size:48px; font-weight:bold; color:var(--accent-green); text-align:center; min-height:80px;"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">Click Play to start demonstration</div>

    <div class="controls">
        <button onclick="resetAll()">↺ Reset</button>
        <button onclick="backStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <span style="margin-left:20px; font-size:13px;">Speed:</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="log-panel" id="log-container"></div>

    <script>
        let trieNodes = {};
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1650, 950, 480];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            trieNodes = {};
            steps = [];
            document.getElementById('log-container').innerHTML = '';

            if (ex === 0) {
                addStep("Initialize empty Trie", true);
                insertStep("cat");
                searchStep("cat", true);
            } else {
                addStep("Initialize empty Trie", true);
                insertStep("car");
                searchStep("cat", false);
            }

            stepIndex = 0;
            renderStep(0);
        }

        function addStep(text) {
            steps.push({
                panel: text,
                log: text,
                trie: JSON.parse(JSON.stringify(trieNodes))
            });
        }

        function insertStep(word) {
            // Simulate insertion
            let current = trieNodes;
            for (let ch of word) {
                if (!(ch in current)) {
                    current[ch] = {};
                }
                current = current[ch];
            }
            current['is_end'] = true;
            addStep(`Insert <b>${word}</b> → Trie updated`);
        }

        function searchStep(word, found) {
            addStep(`Search <b>${word}</b> → <span style="color:${found ? 'var(--accent-green)' : 'var(--accent-red)'}">${found ? 'Found' : 'Not Found'}</span>`);
        }

        function renderTrie() {
            const container = document.getElementById('trie-visual');
            container.innerHTML = '<pre>' + JSON.stringify(trieNodes, null, 2) + '</pre>';
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderTrie();
            document.getElementById('current-op').innerHTML = step.panel;
            document.getElementById('main-panel').innerHTML = step.panel;

            const logDiv = document.getElementById('log-container');
            logDiv.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                const line = document.createElement('div');
                line.style.margin = '4px 0';
                line.innerHTML = steps[i].log;
                logDiv.appendChild(line);
            }
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function nextStep() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function backStep() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function resetAll() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(nextStep, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
