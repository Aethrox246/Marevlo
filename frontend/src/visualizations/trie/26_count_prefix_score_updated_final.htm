<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Count Words Starting With Current Word</title>

<style>

:root{
    --bg:#0d1117;
    --surface:#161b22;
    --border:#30363d;
    --text:#c9d1d9;
    --muted:#8b949e;
    --purple:#a371f7;
    --blue:#58a6ff;
    --green:#3fb950;
    --orange:#e3b341;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    color:var(--purple);
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:20px;
}

.controls{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    background:#21262d;
    color:var(--text);
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#30363d;
}

.main{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
    justify-content:center;
}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
}

.words-panel{
    width:320px;
}

.trie-panel{
    width:650px;
}

.label{
    color:var(--purple);
    font-weight:bold;
    margin-bottom:10px;
    text-align:center;
}

.array-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    background:#21262d;
    border-radius:10px;
    padding:12px;
}

.tile{
    padding:10px 16px;
    border:2px solid var(--orange);
    border-radius:8px;
    background:#30363d;
    font-family:monospace;
}

.trie{
    background:#21262d;
    border:3px solid var(--blue);
    border-radius:12px;
    min-height:450px;
    padding:20px;
    overflow:auto;
    font-family:monospace;
}

.trie-node{
    display:inline-block;
    background:#30363d;
    border:3px solid var(--blue);
    border-radius:10px;
    padding:12px 18px;
    margin:10px;
    text-align:center;
}

.trie-node.current{
    border-color:var(--orange);
    box-shadow:0 0 0 4px rgba(227,179,65,0.3);
}

.count{
    color:var(--green);
    margin-top:5px;
    font-size:13px;
}

.children{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:10px;
}

.info{
    margin-top:20px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    font-family:monospace;
}

.action{
    margin-top:20px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    font-family:monospace;
}

.log{
    margin-top:20px;
    background:#0b0f14;
    border:1px solid var(--border);
    border-radius:10px;
    padding:15px;
    height:260px;
    overflow:auto;
    font-family:monospace;
    line-height:1.7;
}

</style>
</head>

<body>

<h1>Count Words Starting With Current Word</h1>

<div class="subtitle">
For each word, count how many OTHER words start with it
</div>

<div class="controls">

    <button onclick="loadExample(0)">
        Example 1
    </button>

    <button onclick="loadExample(1)">
        Example 2
    </button>

    <button onclick="resetViz()">
        Reset
    </button>

</div>

<div class="main">

    <div class="panel words-panel">

        <div class="label">
            Words
        </div>

        <div class="array-list" id="words-list"></div>

    </div>

    <div class="panel trie-panel">

        <div class="label">
            Trie Structure
        </div>

        <div class="trie" id="trie"></div>

    </div>

</div>

<div class="info">

    <strong>Current Word:</strong>
    <span id="current-word"
          style="color:var(--orange)">
    </span>

    <br><br>

    <strong>Count:</strong>
    <span id="score"
          style="color:var(--green);
                 font-size:26px;">
    </span>

</div>

<div class="action" id="action">
    Click Example
</div>

<div class="controls">

    <button onclick="prevStep()">
        ← Prev
    </button>

    <button onclick="togglePlay()"
            id="play-btn">
        ▶ Play
    </button>

    <button onclick="nextStep()">
        Next →
    </button>

</div>

<div class="log" id="log"></div>

<script>

let root = null;

let steps = [];

let stepIdx = 0;

let timer = null;

let isPlaying = false;

let words = [];

class TrieNode{

    constructor(){

        this.children = {};
        this.count = 0;
    }
}

function createTrie(){

    return new TrieNode();
}

function insert(word){

    let node = root;

    let path = [];

    for(let ch of word){

        path.push(ch);

        if(!node.children[ch]){

            node.children[ch] =
                new TrieNode();
        }

        node =
            node.children[ch];

        node.count++;
    }

    return path;
}

function getPrefixCount(word){

    let count = 0;

    for(let other of words){

        if(other !== word &&
           other.startsWith(word)){

            count++;
        }
    }

    return {

        score: count,

        path: word.split("")
    };
}

function generateSteps(inputWords){

    words = [...inputWords];

    root = createTrie();

    steps = [];

    steps.push({

        action:
            "Initialize Trie",

        log:
            "Root node created",

        word: "",

        score: "",

        highlight: []
    });

    for(let word of words){

        const path =
            insert(word);

        steps.push({

            action:
                `Inserted "${word}"`,

            log:
                `Inserted "${word}"`,

            word: word,

            score: "—",

            highlight: path
        });
    }

    for(let word of words){

        const res =
            getPrefixCount(word);

        steps.push({

            action:
                `"${word}" count = ${res.score}`,

            log:
                `"${word}" has ${res.score} matching words`,

            word: word,

            score: res.score,

            highlight: res.path
        });
    }
}

function buildTrieHTML(
    node,
    prefix = "",
    highlight = [],
    depth = 0
){

    if(!node) return "";

    const isCurrent =
        highlight.length > depth;

    let html =
    `
    <div class="trie-node
        ${isCurrent ? 'current' : ''}">
    `;

    html +=
    `
    <div>
        ${prefix || 'ROOT'}
    </div>
    `;

    html +=
    `
    <div class="count">
        count: ${node.count}
    </div>
    `;

    let childrenHTML =
        `<div class="children">`;

    Object.keys(node.children)
          .sort()
          .forEach(ch => {

        childrenHTML +=
            buildTrieHTML(
                node.children[ch],
                prefix + ch,
                highlight,
                depth + 1
            );
    });

    childrenHTML += `</div>`;

    if(Object.keys(node.children).length){

        html += childrenHTML;
    }

    html += `</div>`;

    return html;
}

function renderTrie(highlight=[]){

    document.getElementById(
        "trie"
    ).innerHTML =
        buildTrieHTML(
            root,
            "",
            highlight
        );
}

function renderWords(){

    document.getElementById(
        "words-list"
    ).innerHTML =

        words.map(
            w =>
            `
            <div class="tile">
                ${w}
            </div>
            `
        ).join("");
}

function renderStep(idx){

    stepIdx =
        Math.max(
            0,
            Math.min(
                idx,
                steps.length - 1
            )
        );

    const step =
        steps[stepIdx];

    document.getElementById(
        "current-word"
    ).textContent =
        step.word || "—";

    document.getElementById(
        "score"
    ).textContent =
        step.score;

    document.getElementById(
        "action"
    ).innerHTML =
        `<strong>${step.action}</strong>`;

    renderWords();

    renderTrie(
        step.highlight || []
    );

    const logEl =
        document.getElementById(
            "log"
        );

    logEl.innerHTML =
        steps
        .slice(0, stepIdx + 1)
        .map(
            s => `<div>${s.log}</div>`
        )
        .join("");

    logEl.scrollTop =
        logEl.scrollHeight;
}

function nextStep(){

    if(stepIdx < steps.length - 1){

        renderStep(stepIdx + 1);
    }
    else{

        pause();
    }
}

function prevStep(){

    if(stepIdx > 0){

        renderStep(stepIdx - 1);
    }
}

function togglePlay(){

    const btn =
        document.getElementById(
            "play-btn"
        );

    if(isPlaying){

        pause();
    }
    else{

        isPlaying = true;

        btn.textContent =
            "❚❚ Pause";

        timer = setInterval(() => {

            if(stepIdx <
               steps.length - 1){

                nextStep();
            }
            else{

                pause();
            }

        }, 1200);
    }
}

function pause(){

    clearInterval(timer);

    isPlaying = false;

    document.getElementById(
        "play-btn"
    ).textContent =
        "▶ Play";
}

function resetViz(){

    pause();

    stepIdx = 0;

    renderStep(0);
}

function loadExample(n){

    const examples = [

        [
            "apple",
            "app",
            "apricot",
            "banana"
        ],

        [
            "cat",
            "caterpillar",
            "category",
            "dog"
        ]
    ];

    generateSteps(
        examples[n]
    );

    resetViz();
}

window.onload = () => {

    loadExample(0);
};

</script>

</body>
</html>
