<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Implement Trie II</title>

<style>

:root{
    --bg:#000000;
    --surface:#161b22;
    --border:#30363d;
    --text:#c9d1d9;
    --purple:#a371f7;
    --blue:#58a6ff;
    --green:#3fb950;
    --orange:#e3b341;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    color:var(--purple);
}

.subtitle{
    text-align:center;
    color:#8b949e;
    margin-bottom:20px;
}

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    background:#21262d;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#30363d;
}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.title{
    color:var(--blue);
    margin-bottom:10px;
    font-size:20px;
}

.result{
    color:var(--green);
    font-size:28px;
    font-weight:bold;
}

.log{
    background:#0b0f14;
    border-radius:10px;
    padding:15px;
    font-family:monospace;
    line-height:1.8;
    height:260px;
    overflow:auto;
}

.words{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.word{
    padding:10px 16px;
    border:2px solid var(--orange);
    border-radius:8px;
    background:#21262d;
    font-family:monospace;
}

</style>
</head>

<body>

<h1>Implement Trie II</h1>

<div class="subtitle">
insert • countWordsEqualTo • countWordsStartingWith
</div>

<div class="controls">

    <button onclick="loadExample1()">
        Example 1
    </button>

    <button onclick="loadExample2()">
        Example 2
    </button>

</div>

<div class="controls">

    <button onclick="prevStep()">
        ← Prev
    </button>

    <button onclick="togglePlay()"
            id="playBtn">
        ▶ Play
    </button>

    <button onclick="nextStep()">
        Next →
    </button>

</div>

<div class="panel">

    <div class="title">
        Inserted Words
    </div>

    <div id="words"
         class="words">
    </div>

</div>

<div class="panel">

    <div class="title">
        Current Operation
    </div>

    <div id="stepInfo"></div>

</div>

<div class="panel">

    <div class="title">
        Result
    </div>

    <div id="result"
         class="result">
    </div>

</div>

<div class="panel">

    <div class="title">
        Execution Logs
    </div>

    <div id="logs"
         class="log">
    </div>

</div>

<script>

let steps = [];

let currentStep = 0;

let timer = null;

let isPlaying = false;

let words = [];

function renderWords(){

    document.getElementById(
        "words"
    ).innerHTML =

        words.map(
            w =>
            `
            <div class="word">
                ${w}
            </div>
            `
        ).join("");
}

function renderStep(){

    const step =
        steps[currentStep];

    document.getElementById(
        "stepInfo"
    ).innerHTML =
        step.info;

    document.getElementById(
        "result"
    ).innerHTML =
        step.result;

    document.getElementById(
        "logs"
    ).innerHTML =
        step.logs;

    renderWords();
}

function nextStep(){

    if(currentStep < steps.length - 1){

        currentStep++;

        renderStep();
    }
    else{

        pausePlay();
    }
}

function prevStep(){

    if(currentStep > 0){

        currentStep--;

        renderStep();
    }
}

function togglePlay(){

    if(isPlaying){

        pausePlay();
    }
    else{

        startPlay();
    }
}

function startPlay(){

    isPlaying = true;

    document.getElementById(
        "playBtn"
    ).innerHTML =
        "⏸ Pause";

    timer = setInterval(() => {

        if(currentStep < steps.length - 1){

            nextStep();
        }
        else{

            pausePlay();
        }

    }, 1500);
}

function pausePlay(){

    clearInterval(timer);

    isPlaying = false;

    document.getElementById(
        "playBtn"
    ).innerHTML =
        "▶ Play";
}

function generateSteps(operations){

    steps = [];

    words = [];

    let logs = [];

    steps.push({

        info:
            "Initialize Trie",

        result:
            "—",

        logs:
            "Root created"
    });

    let freq = {};

    for(let op of operations){

        if(op.type === "insert"){

            words.push(op.word);

            freq[op.word] =
                (freq[op.word] || 0) + 1;

            logs.push(
                `
                Inserted "${op.word}"
                `
            );

            steps.push({

                info:
                    `
                    insert("${op.word}")
                    `,

                result:
                    "null",

                logs:
                    logs.join("<br>")
            });
        }

        else if(op.type === "equal"){

            let count =
                freq[op.word] || 0;

            logs.push(
                `
                countWordsEqualTo("${op.word}")
                = ${count}
                `
            );

            steps.push({

                info:
                    `
                    countWordsEqualTo("${op.word}")
                    `,

                result:
                    count,

                logs:
                    logs.join("<br>")
            });
        }

        else if(op.type === "starting"){

            let count = 0;

            for(let w of words){

                if(w.startsWith(op.word)){

                    count++;
                }
            }

            logs.push(
                `
                countWordsStartingWith("${op.word}")
                = ${count}
                `
            );

            steps.push({

                info:
                    `
                    countWordsStartingWith("${op.word}")
                    `,

                result:
                    count,

                logs:
                    logs.join("<br>")
            });
        }
    }

    currentStep = 0;

    renderStep();
}

function loadExample1(){

    generateSteps([

        {
            type:"insert",
            word:"apple"
        },

        {
            type:"insert",
            word:"app"
        },

        {
            type:"insert",
            word:"apple"
        },

        {
            type:"starting",
            word:"apple"
        },

        {
            type:"starting",
            word:"app"
        }

    ]);
}

function loadExample2(){

    generateSteps([

        {
            type:"insert",
            word:"cat"
        },

        {
            type:"insert",
            word:"car"
        },

        {
            type:"insert",
            word:"cat"
        },

        {
            type:"starting",
            word:"cat"
        },

        {
            type:"equal",
            word:"car"
        },

        {
            type:"starting",
            word:"ca"
        },

        {
            type:"starting",
            word:"c"
        }

    ]);
}

loadExample1();

</script>

</body>
</html>
