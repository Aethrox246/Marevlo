<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>K-th Smallest XOR</title>

<style>

:root{
    --bg:#0d1117;
    --surface:#161b22;
    --border:#30363d;
    --text:#c9d1d9;
    --purple:#a371f7;
    --blue:#58a6ff;
    --green:#3fb950;
    --orange:#e3b341;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    color:var(--purple);
}

.subtitle{
    text-align:center;
    color:#8b949e;
    margin-bottom:20px;
}

.controls{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    background:#21262d;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#30363d;
}

.main{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
    justify-content:center;
}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
}

.array-panel{
    width:320px;
}

.result-panel{
    width:520px;
}

.label{
    color:var(--blue);
    margin-bottom:10px;
    font-weight:bold;
}

.array-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.tile{
    background:#30363d;
    border:2px solid var(--orange);
    padding:10px 18px;
    border-radius:8px;
    font-family:monospace;
}

.info{
    background:#21262d;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
    font-family:monospace;
}

.result{
    font-size:32px;
    color:var(--green);
    font-weight:bold;
}

.log{
    background:#0b0f14;
    border-radius:10px;
    padding:15px;
    height:300px;
    overflow:auto;
    font-family:monospace;
    line-height:1.8;
}

</style>
</head>

<body>

<h1>K-th Smallest XOR</h1>

<div class="subtitle">
Find the k-th smallest XOR pair
</div>

<div class="controls">

    <button onclick="loadExample1()">
        Example 1
    </button>

    <button onclick="loadExample2()">
        Example 2
    </button>

</div>

<div class="controls">

    <button onclick="prevStep()">
        ← Prev
    </button>

    <button onclick="togglePlay()"
            id="playBtn">
        ▶ Play
    </button>

    <button onclick="nextStep()">
        Next →
    </button>

</div>

<div class="main">

    <div class="panel array-panel">

        <div class="label">
            Input Array
        </div>

        <div id="array"
             class="array-list">
        </div>

    </div>

    <div class="panel result-panel">

        <div class="label">
            Current Step
        </div>

        <div id="stepInfo"
             class="info">
        </div>

        <br>

        <div class="label">
            K-th Smallest XOR
        </div>

        <div id="result"
             class="result">
        </div>

    </div>

</div>

<br>

<div class="panel">

    <div class="label">
        Execution Logs
    </div>

    <div id="logs"
         class="log">
    </div>

</div>

<script>

let steps = [];

let currentStep = 0;

let timer = null;

let isPlaying = false;

let logs = [];

function renderArray(arr){

    document.getElementById(
        "array"
    ).innerHTML =

        arr.map(
            n =>
            `
            <div class="tile">
                ${n}
            </div>
            `
        ).join("");
}

function renderStep(){

    const step =
        steps[currentStep];

    document.getElementById(
        "stepInfo"
    ).innerHTML =
        step.info;

    document.getElementById(
        "result"
    ).innerHTML =
        step.result;

    document.getElementById(
        "logs"
    ).innerHTML =
        step.logs.join("<br>");
}

function nextStep(){

    if(currentStep < steps.length - 1){

        currentStep++;

        renderStep();
    }
    else{

        pausePlay();
    }
}

function prevStep(){

    if(currentStep > 0){

        currentStep--;

        renderStep();
    }
}

function togglePlay(){

    if(isPlaying){

        pausePlay();
    }
    else{

        startPlay();
    }
}

function startPlay(){

    isPlaying = true;

    document.getElementById(
        "playBtn"
    ).innerHTML =
        "⏸ Pause";

    timer = setInterval(() => {

        if(currentStep < steps.length - 1){

            nextStep();
        }
        else{

            pausePlay();
        }

    }, 1400);
}

function pausePlay(){

    clearInterval(timer);

    isPlaying = false;

    document.getElementById(
        "playBtn"
    ).innerHTML =
        "▶ Play";
}

function generateSteps(arr, k){

    steps = [];

    logs = [];

    renderArray(arr);

    let xorValues = [];

    steps.push({

        info:
            `
            Initialize XOR pair generation
            `,

        result:
            `—`,

        logs:
            ["Start processing"]
    });

    for(let i = 0; i < arr.length; i++){

        for(let j = i + 1; j < arr.length; j++){

            const xor =
                arr[i] ^ arr[j];

            xorValues.push(xor);

            logs.push(
                `
                (${arr[i]}, ${arr[j]})
                →
                ${arr[i]} ^ ${arr[j]}
                =
                ${xor}
                `
            );

            steps.push({

                info:
                    `
                    Generate XOR pair
                    (${arr[i]}, ${arr[j]})
                    `,

                result:
                    xor,

                logs:
                    [...logs]
            });
        }
    }

    logs.push(
        `
        XOR list:
        [${xorValues.join(", ")}]
        `
    );

    steps.push({

        info:
            `
            Store XOR values
            `,

        result:
            `[${xorValues.join(", ")}]`,

        logs:
            [...logs]
    });

    xorValues.sort((a,b)=>a-b);

    logs.push(
        `
        Sorted XOR list:
        [${xorValues.join(", ")}]
        `
    );

    steps.push({

        info:
            `
            Sort XOR values
            `,

        result:
            `[${xorValues.join(", ")}]`,

        logs:
            [...logs]
    });

    const answer =
        xorValues[k - 1];

    logs.push(
        `
        k = ${k}
        → k-th smallest XOR
        =
        ${answer}
        `
    );

    steps.push({

        info:
            `
            Select k-th smallest XOR
            `,

        result:
            answer,

        logs:
            [...logs]
    });

    currentStep = 0;

    renderStep();
}

function loadExample1(){

    generateSteps(
        [1,2,3],
        2
    );
}

function loadExample2(){

    generateSteps(
        [5,3,9],
        3
    );
}

loadExample1();

</script>

</body>
</html>
