<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concatenated Words - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        button {
            height: 32px; border-radius: 6px; padding: 0 16px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container {
            margin-top: 30px;
            display: flex;
            gap: 40px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .words-list {
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 15px;
            width: 280px;
        }
        .words-list h3 { margin: 0 0 10px 0; font-size: 15px; color: var(--accent-blue); }

        .current-word {
            background: var(--bg-surface);
            border: 2px solid var(--accent-orange);
            border-radius: 8px;
            padding: 20px;
            min-width: 420px;
            text-align: center;
        }
        .current-word-title { color: var(--accent-orange); margin-bottom: 12px; font-size: 15px; }

        .split-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }
        .split-part {
            padding: 10px 16px;
            background: #21262d;
            border: 2px solid var(--accent-purple);
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
        }

        .output-area {
            background: var(--bg-surface);
            border: 2px solid var(--accent-green);
            border-radius: 8px;
            padding: 15px;
            width: 280px;
        }

        .action-panel {
            margin-top: 25px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 16px 22px;
            width: 860px;
            text-align: center;
            font-family: monospace;
            min-height: 90px;
            font-size: 15px;
            line-height: 1.5;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .log-panel {
            margin-top: 15px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 12px 16px;
            width: 860px;
            height: 160px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13.5px;
        }

        .tile {
            padding: 8px 14px;
            background: #21262d;
            border: 2px solid var(--border-main);
            border-radius: 6px;
            margin: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <button onclick="loadExample(0)">Example 1</button>
        <button onclick="loadExample(1)">Example 2</button>
        <button onclick="resetAll()">Reset</button>
    </div>

    <div class="visual-container">
        <!-- All Words -->
        <div class="words-list">
            <h3>All Words</h3>
            <div id="all-words"></div>
        </div>

        <!-- Current Word Being Checked -->
        <div class="current-word">
            <div class="current-word-title">Current Word</div>
            <div id="current-word-display" style="font-size:28px; font-weight:bold; margin:15px 0;"></div>
            <div id="split-container" class="split-container"></div>
        </div>

        <!-- Result -->
        <div class="output-area">
            <h3 style="margin:0 0 12px 0; color:var(--accent-green);">Concatenated Words</h3>
            <div id="result-list"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">Click Play to start demonstration</div>

    <div class="controls">
        <button onclick="resetAll()">↺ Reset</button>
        <button onclick="backStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <span style="margin-left:20px; font-size:13px;">Speed:</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="log-panel" id="log-container"></div>

    <script>
        let words = [];
        let result = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1650, 950, 480];

        function init() {
            loadExample(0);
        }

        function loadExample(ex) {
            if (ex === 0) {
                words = ["cat", "cats", "catsdogcats", "dog", "dogcatsdog", "hippopotamuses", "rat", "ratcatdogcat"];
            } else {
                words = ["a", "aa", "aaa", "aaaa"];
            }
            result = [];
            steps = [];
            document.getElementById('log-container').innerHTML = '';

            // Simulate steps for the two examples
            addStep(`Processing words: [${words.join(', ')}]`, true);

            // For demo we hard-code the key steps from JSON examples
            if (ex === 0) {
                addStep("Sort by length → [\"cat\",\"dog\",\"rat\",\"cats\",\"catsdogcats\",\"dogcatsdog\",\"ratcatdogcat\",\"hippopotamuses\"]");
                addStep("Check \"cat\" → only itself → not concatenated");
                addStep("Check \"dog\" → only itself → not concatenated");
                addStep("Check \"rat\" → only itself → not concatenated");
                addStep("Check \"cats\" → \"cat\" + \"s\" (invalid) → not concatenated");
                addStep("Check \"catsdogcats\" → \"cats\" + \"dog\" + \"cats\" → <span style='color:var(--accent-green)'>Concatenated!</span>");
                result.push("catsdogcats");
                addStep("Check \"dogcatsdog\" → \"dog\" + \"cats\" + \"dog\" → <span style='color:var(--accent-green)'>Concatenated!</span>");
                result.push("dogcatsdog");
                addStep("Check \"ratcatdogcat\" → \"rat\" + \"cat\" + \"dog\" + \"cat\" → <span style='color:var(--accent-green)'>Concatenated!</span>");
                result.push("ratcatdogcat");
                addStep("Check \"hippopotamuses\" → no valid split → not concatenated");
            } else {
                addStep("Sort by length → [\"a\",\"aa\",\"aaa\",\"aaaa\"]");
                addStep("Check \"a\" → only itself → skipped");
                addStep("Check \"aa\" → \"a\" + \"a\" → <span style='color:var(--accent-green)'>Concatenated!</span>");
                result.push("aa");
                addStep("Check \"aaa\" → \"a\" + \"aa\" or \"aa\" + \"a\" → <span style='color:var(--accent-green)'>Concatenated!</span>");
                result.push("aaa");
                addStep("Check \"aaaa\" → multiple ways (a+aaa, aa+aa, etc.) → <span style='color:var(--accent-green)'>Concatenated!</span>");
                result.push("aaaa");
            }

            addStep(`Final Result: [${result.join(', ')}]`, true);

            stepIndex = 0;
            renderStep(0);
        }

        function addStep(text, isFinal = false) {
            steps.push({
                panel: text,
                result: [...result],
                log: text
            });
        }

        function renderWordsList() {
            const container = document.getElementById('all-words');
            container.innerHTML = '';
            words.forEach(w => {
                const div = document.createElement('div');
                div.className = 'tile';
                div.textContent = w;
                container.appendChild(div);
            });
        }

        function renderCurrentWord(text) {
            document.getElementById('current-word-display').innerHTML = text || '—';
        }

        function renderResult() {
            const container = document.getElementById('result-list');
            container.innerHTML = '';
            result.forEach(w => {
                const div = document.createElement('div');
                div.className = 'tile';
                div.style.borderColor = 'var(--accent-green)';
                div.style.color = 'var(--accent-green)';
                div.textContent = w;
                container.appendChild(div);
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderWordsList();
            renderCurrentWord(step.panel.includes("Check") ? step.panel.split("→")[0].replace("Check ", "") : "");
            renderResult();

            document.getElementById('main-panel').innerHTML = step.panel;

            const logDiv = document.getElementById('log-container');
            logDiv.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                const line = document.createElement('div');
                line.style.margin = '4px 0';
                line.innerHTML = steps[i].log;
                logDiv.appendChild(line);
            }
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function nextStep() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function backStep() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function resetAll() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(nextStep, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
