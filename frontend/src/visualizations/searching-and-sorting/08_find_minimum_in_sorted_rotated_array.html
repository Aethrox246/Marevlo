<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Minimum in Rotated Sorted Array - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"], input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arr-input { width: 320px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: ARRAY TILES */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 80px; position: relative;}
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 16px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        /* Highlight States */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.temp-match { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); border-style: dashed; z-index: 2;}
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-green); z-index: 3;}
        .tile.eliminated { opacity: 0.2; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* Pointers */
        .ptr-container { display: flex; flex-direction: column; align-items: center; position: absolute; bottom: -50px; gap: 2px; font-size: 11px; font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .ptr-low { color: var(--accent-purple); }
        .ptr-mid { color: var(--accent-orange); }
        .ptr-high { color: var(--accent-blue); }
        .ptr-arrow { font-size: 16px; line-height: 10px; margin-bottom: 2px; color: var(--text-dim); }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 90px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="arr-input" class="arr-input" placeholder="3, 4, 5, 1, 2">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([3, 4, 5, 1, 2])">Ex 1</button>
        <button onclick="loadExample([4, 5, 6, 7, 0, 1, 2])">Ex 2</button>
        <button onclick="loadExample([11, 13, 15, 17])">Sorted</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Rotated Sorted Array:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">low</span>
            <span class="info-value" id="val-low" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">mid</span>
            <span class="info-value" id="val-mid" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">high</span>
            <span class="info-value" id="val-high" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">ans (min)</span>
            <span class="info-value" id="val-ans" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">minimum element =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-blue)"></span> Search Space</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Midpoint</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px dashed var(--accent-green)"></span> Current Min</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Final Minimum</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--border-main); opacity:0.5"></span> Eliminated</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [3, 4, 5, 1, 2];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [2000, 1000, 500];

        function init() { loadExample([3, 4, 5, 1, 2]); }

        function loadExample(newArr) {
            // Do NOT sort! We are looking for the min in a *rotated* sorted array.
            arr = [...newArr];
            document.getElementById('arr-input').value = arr.join(', ');
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valStr = document.getElementById('arr-input').value;
            const parsedArr = valStr.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            
            if (parsedArr.length > 0) {
                loadExample(parsedArr.slice(0, 20)); // limit size for display
            } else {
                alert("Please enter a valid array of numbers.");
            }
        }

        function generateSteps() {
            steps = [];
            const n = arr.length;
            if (n === 0) return;

            let low = 0;
            let high = n - 1;
            let ans = Infinity;
            let ansIdx = -1;

            const getArrStates = (l, h, m, a_idx, isFinal = false) => {
                return arr.map((_, idx) => {
                    if (isFinal && idx === a_idx) return 'winning'; 
                    if (idx === m) return 'candidate';
                    if (idx === a_idx) return 'temp-match';
                    if (idx >= l && idx <= h) return 'search-space';
                    return 'eliminated';
                });
            };

            // STEP 0: INIT
            steps.push({
                type: 'init', low: low, high: high, mid: '—', ans: '∞',
                arrStates: getArrStates(low, high, -1, ansIdx),
                panel: `Initialize pointers for Binary Search:<br><code>low = 0</code>, <code>high = ${high}</code>. Initial min <code>ans = ∞</code>.`,
                statusText: `array=[${arr.join(', ')}]. Click Play to begin.`,
                log: `n=${n}. Finding Minimum in Rotated Sorted Array in O(log n).\nInitialize low=${low}, high=${high}, ans=∞.`,
                logColor: 'var(--text-dim)'
            });

            while (low <= high) {
                // Check if the current search space is fully sorted
                if (arr[low] <= arr[high]) {
                    if (arr[low] < ans) {
                        ans = arr[low];
                        ansIdx = low;
                    }
                    steps.push({
                        type: 'early-exit', low: low, high: high, mid: '—', ans: ans,
                        arrStates: getArrStates(low, high, -1, ansIdx),
                        panel: `The range <code>[low, high]</code> is fully sorted (<code>${arr[low]} <= ${arr[high]}</code>).<br>The minimum of this range is simply <code>arr[low]</code> (<b>${arr[low]}</b>).<br>Update <code>ans = min(ans, ${arr[low]}) = ${ans}</code>. We can terminate early!`,
                        statusText: `Current search space is completely sorted. Breaking early.`,
                        log: `\nRange [${low}, ${high}] is fully sorted. arr[${low}] <= arr[${high}].\n  Update ans = ${ans}. Terminate loop. ✓`,
                        logColor: 'var(--accent-green)'
                    });
                    break;
                }

                let mid = Math.floor((low + high) / 2);
                let valMid = arr[mid];
                let valLow = arr[low];

                // EVALUATE MID
                steps.push({
                    type: 'eval', low: low, high: high, mid: mid, ans: ans !== Infinity ? ans : '∞',
                    arrStates: getArrStates(low, high, mid, ansIdx),
                    panel: `Calculate midpoint: <code>mid = floor((${low} + ${high}) / 2) = ${mid}</code>.<br>Check if left half is sorted: <code>arr[low] <= arr[mid]</code> (<b>${valLow} <= ${valMid}</b>).`,
                    statusText: `Checking if left half [${low}...${mid}] is sorted...`,
                    log: `\nRange [${low}, ${high}]: Calculate mid=${mid}.\n  Is left half sorted? (arr[${low}] <= arr[${mid}]) -> (${valLow} <= ${valMid}).`,
                    logColor: 'var(--text-main)'
                });

                if (arr[low] <= arr[mid]) {
                    // Left is sorted
                    if (arr[low] < ans) {
                        ans = arr[low];
                        ansIdx = low;
                    }
                    let oldLow = low;
                    low = mid + 1;
                    
                    steps.push({
                        type: 'left-sorted', low: low, high: high, mid: mid, ans: ans,
                        arrStates: getArrStates(low, high, -1, ansIdx),
                        panel: `<span style="color:var(--accent-green)">Left half is sorted.</span><br>Minimum of left half is <code>arr[${oldLow}]</code> = <b>${arr[oldLow]}</b>.<br>Update <code>ans = min(ans, ${arr[oldLow]}) = ${ans}</code>. Now search the right half: <code>low = mid + 1 = ${low}</code>.`,
                        statusText: `Left half sorted. Updated ans. Moving low pointer to ${low}.`,
                        log: `  Yes, left half is sorted. Update ans = min(ans, ${arr[oldLow]}) = ${ans}.\n  Search right half: low = mid+1 = ${low}.`,
                        logColor: 'var(--accent-green)'
                    });
                } else {
                    // Right is sorted
                    if (arr[mid] < ans) {
                        ans = arr[mid];
                        ansIdx = mid;
                    }
                    let oldHigh = high;
                    high = mid - 1;
                    
                    steps.push({
                        type: 'right-sorted', low: low, high: high, mid: mid, ans: ans,
                        arrStates: getArrStates(low, high, -1, ansIdx),
                        panel: `<span style="color:var(--accent-purple)">Left half is NOT sorted</span>, meaning the <b>Right half is sorted</b>.<br>Minimum of right half is <code>arr[${mid}]</code> = <b>${arr[mid]}</b>.<br>Update <code>ans = min(ans, ${arr[mid]}) = ${ans}</code>. Now search the left half: <code>high = mid - 1 = ${high}</code>.`,
                        statusText: `Right half sorted. Updated ans. Moving high pointer to ${high}.`,
                        log: `  No, right half is sorted. Update ans = min(ans, ${arr[mid]}) = ${ans}.\n  Search left half: high = mid-1 = ${high}.`,
                        logColor: 'var(--accent-purple)'
                    });
                }
            }

            // FINAL STEP
            steps.push({
                type: 'final', low: low, high: high, mid: '—', ans: ans,
                arrStates: getArrStates(-1, -1, -1, ansIdx, true),
                panel: `Binary Search complete. The minimum element in the array is <b>${ans}</b>.`,
                complete: true,
                finalStr: ans.toString(),
                statusText: `Done. Returning ${ans}.`,
                log: `Binary Search complete.\nFinal Minimum Value: ${ans}`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            
            step.arrStates.forEach((state, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.innerText = arr[i];
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);

                // Add Pointers
                const ptrs = [];
                if (!step.complete) {
                    if (step.low === i && step.low <= step.high) ptrs.push('<div class="ptr-low">L</div>');
                    if (step.mid === i && step.mid !== '—') ptrs.push('<div class="ptr-mid">M</div>');
                    if (step.high === i && step.high >= 0) ptrs.push('<div class="ptr-high">H</div>');
                }

                if (ptrs.length > 0) {
                    const ptrContainer = document.createElement('div');
                    ptrContainer.className = 'ptr-container';
                    ptrContainer.innerHTML = '<div class="ptr-arrow">↑</div>' + ptrs.join('');
                    wrapper.appendChild(ptrContainer);
                }

                container.appendChild(wrapper);
            });

            if (!step.complete) {
                container.style.marginBottom = "45px";
            } else {
                container.style.marginBottom = "0px";
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-low').innerText = step.low;
            document.getElementById('val-mid').innerText = step.mid;
            document.getElementById('val-high').innerText = step.high;
            document.getElementById('val-ans').innerText = step.ans;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            
            if (step.complete) {
                resVal.className = 'pop';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
