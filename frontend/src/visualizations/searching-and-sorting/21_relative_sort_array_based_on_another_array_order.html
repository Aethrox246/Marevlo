<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Sort Array - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"], input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arr1-input { width: 320px; }
        .arr2-input { width: 220px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: ARRAY TILES */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 80px; position: relative;}
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 16px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        /* Highlight States */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-green); z-index: 3;}
        .tile.eliminated { opacity: 0.2; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* Pointers */
        .ptr-container { display: flex; flex-direction: column; align-items: center; position: absolute; bottom: -50px; gap: 2px; font-size: 11px; font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .ptr-low { color: var(--accent-purple); }
        .ptr-mid { color: var(--accent-orange); }
        .ptr-high { color: var(--accent-blue); }
        .ptr-arrow { font-size: 16px; line-height: 10px; margin-bottom: 2px; color: var(--text-dim); }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 90px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }
        .pop-false { animation: popAnim 400ms ease; color: var(--accent-red) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-red); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">array1 =</label>
        <input type="text" id="arr1-input" class="arr1-input" placeholder="2,3,1,3,2,4,6,7,9,2,19">
        <label class="ui-label">array2 =</label>
        <input type="text" id="arr2-input" class="arr2-input" placeholder="2,1,4,3,9,6">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([2,3,1,3,2,4,6,7,9,2,19], [2,1,4,3,9,6])">Ex 1</button>
        <button onclick="loadExample([5,8,5,3,2,1], [3,1,5])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Result Array (built step-by-step):</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">current order elem</span>
            <span class="info-value" id="val-order" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">freq</span>
            <span class="info-value" id="val-freq" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">remaining count</span>
            <span class="info-value" id="val-remaining" style="color: var(--accent-purple);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">final sorted array1 =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Added from array2 order</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange); border:1px solid var(--accent-orange)"></span> Processing current element</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--border-main); opacity:0.5"></span> Remaining (sorted at end)</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let array1 = [2,3,1,3,2,4,6,7,9,2,19];
        let array2 = [2,1,4,3,9,6];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([2,3,1,3,2,4,6,7,9,2,19], [2,1,4,3,9,6]); }

        function loadExample(newArray1, newArray2) {
            array1 = [...newArray1];
            array2 = [...newArray2];
            document.getElementById('arr1-input').value = array1.join(', ');
            document.getElementById('arr2-input').value = array2.join(', ');
            generateSteps();
            reset();
        }

        function loadCustom() {
            const arr1Str = document.getElementById('arr1-input').value;
            const arr2Str = document.getElementById('arr2-input').value;
            const parsedArray1 = arr1Str.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            const parsedArray2 = arr2Str.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            
            if (parsedArray1.length > 0) {
                loadExample(parsedArray1.slice(0, 20), parsedArray2.slice(0, 20));
            } else {
                alert("Please enter valid arrays.");
            }
        }

        function generateSteps() {
            steps = [];
            const n = array1.length;
            if (n === 0) return;

            // Build frequency map
            let freq = {};
            for (let num of array1) {
                freq[num] = (freq[num] || 0) + 1;
            }

            let result = [];

            // STEP 0: INIT
            steps.push({
                type: 'init',
                resultArr: [],
                currentOrderIdx: -1,
                panel: `array1 = <code>[${array1.join(', ')}]</code><br>array2 (order) = <code>[${array2.join(', ')}]</code><br>Frequency map built: <code>${JSON.stringify(freq)}</code>`,
                statusText: `Counting frequencies in array1...`,
                log: `n=${n}, m=${array2.length}. Starting Relative Sort using frequency counting.\nFrequency map: ${JSON.stringify(freq)}`,
                logColor: 'var(--text-dim)'
            });

            // Process each element in array2
            for (let i = 0; i < array2.length; i++) {
                let elem = array2[i];
                if (freq[elem] && freq[elem] > 0) {
                    // Add one instance at a time for smooth animation
                    for (let count = 0; count < freq[elem]; count++) {
                        result.push(elem);
                        steps.push({
                            type: 'add-from-order',
                            resultArr: [...result],
                            currentOrderIdx: i,
                            panel: `Processing <code>${elem}</code> from array2 (index ${i}).<br>Adding ${elem} (${freq[elem] - count} left)`,
                            statusText: `Added ${elem} from order array`,
                            log: `  Added ${elem} (from array2 order)`,
                            logColor: 'var(--accent-green)'
                        });
                    }
                    delete freq[elem];
                }
            }

            // Remaining elements (not in array2) - sorted ascending
            let remaining = Object.keys(freq).map(Number).sort((a, b) => a - b);
            steps.push({
                type: 'remaining-start',
                resultArr: [...result],
                currentOrderIdx: -1,
                panel: `All elements from array2 processed.<br>Remaining elements (not in array2): <code>${remaining.join(', ')}</code><br>Sorting them in ascending order...`,
                statusText: `Processing remaining elements...`,
                log: `Remaining keys: ${remaining.join(', ')} (will be sorted ascending)`,
                logColor: 'var(--accent-orange)'
            });

            for (let num of remaining) {
                for (let count = 0; count < freq[num]; count++) {
                    result.push(num);
                    steps.push({
                        type: 'add-remaining',
                        resultArr: [...result],
                        currentOrderIdx: -1,
                        panel: `Adding remaining element <code>${num}</code> (sorted)`,
                        statusText: `Added remaining ${num}`,
                        log: `  Added remaining ${num}`,
                        logColor: 'var(--accent-blue)'
                    });
                }
            }

            // FINAL STEP
            steps.push({
                type: 'final',
                resultArr: [...result],
                currentOrderIdx: -1,
                panel: `Relative Sort complete.<br>Elements from array2 appear in given order.<br>Remaining elements appended in ascending order.<br>Time: O(n + m)`,
                complete: true,
                finalStr: `[${result.join(', ')}]`,
                statusText: `Done. Final sorted array ready.`,
                log: `Final Result: [${result.join(', ')}]`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            
            // Tiles show the current result array being built
            step.resultArr.forEach((val, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${step.type === 'add-from-order' && i === step.resultArr.length - 1 ? 'winning' : 
                                     step.type === 'add-remaining' && i === step.resultArr.length - 1 ? 'candidate' : 'search-space'}`;
                tile.innerText = val;
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            // If result is empty (early steps), show placeholder
            if (step.resultArr.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.color = 'var(--text-dim)';
                emptyMsg.style.fontFamily = 'monospace';
                emptyMsg.style.fontSize = '13px';
                emptyMsg.innerText = '(result building...)';
                container.appendChild(emptyMsg);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            
            // Info panel updates
            document.getElementById('val-order').innerText = step.currentOrderIdx >= 0 ? array2[step.currentOrderIdx] : '—';
            document.getElementById('val-freq').innerText = step.currentOrderIdx >= 0 ? 
                (step.type === 'add-from-order' ? 'added' : '—') : '—';
            document.getElementById('val-remaining').innerText = step.type === 'remaining-start' || step.type === 'add-remaining' ? 
                'processing' : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            
            if (step.complete) {
                resVal.className = 'pop';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
