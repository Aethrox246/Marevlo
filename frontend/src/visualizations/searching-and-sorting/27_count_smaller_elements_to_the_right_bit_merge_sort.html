<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Smaller Elements to the Right - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arr-input { width: 380px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: ARRAY TILES */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 80px; position: relative;}
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 16px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        /* Highlight States */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-green); z-index: 3;}
        .tile.eliminated { opacity: 0.2; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }
        .tile.smaller { background: #3a1f2a; border-color: var(--accent-red); color: var(--accent-red); }

        /* Pointers */
        .ptr-container { display: flex; flex-direction: column; align-items: center; position: absolute; bottom: -50px; gap: 2px; font-size: 11px; font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .ptr-arrow { font-size: 16px; line-height: 10px; margin-bottom: 2px; color: var(--text-dim); }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 90px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .result-row { display: flex; gap: 12px; }
        .result-tile { min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 16px; font-weight: 600; font-family: 'Courier New', monospace;
            border: 2px solid var(--accent-green); background: #0f2a1a; color: var(--accent-green); }
        .result-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="arr-input" class="arr-input" placeholder="5, 2, 6, 1">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([5,2,6,1])">Ex 1</button>
        <button onclick="loadExample([1,2,3,4])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Array:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">i (current)</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">j (right)</span>
            <span class="info-value" id="val-j" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">pair</span>
            <span class="info-value" id="val-pair" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">smaller count for i</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">result =</span>
        <div class="result-row" id="result-row"></div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple); border:1px solid var(--accent-purple)"></span> Current i</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange); border:1px solid var(--accent-orange)"></span> Scanning j (right)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red); border:1px solid var(--accent-red)"></span> Smaller element found</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Count for current i</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [5, 2, 6, 1];
        let result = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([5, 2, 6, 1]); }

        function loadExample(newArr) {
            arr = [...newArr];
            document.getElementById('arr-input').value = arr.join(', ');
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valStr = document.getElementById('arr-input').value;
            const parsedArr = valStr.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            if (parsedArr.length > 0) {
                loadExample(parsedArr.slice(0, 20));
            } else {
                alert("Please enter valid numbers (comma-separated).");
            }
        }

        function generateSteps() {
            steps = [];
            const n = arr.length;
            result = new Array(n).fill(0);

            // STEP 0: INIT
            steps.push({
                type: 'init',
                arrStates: arr.map(() => 'search-space'),
                i: -1,
                j: -1,
                panel: `Array: <code>[${arr.join(', ')}]</code><br>Brute force: for each i, count how many j > i have arr[j] < arr[i]`,
                statusText: `Counting smaller elements to the right of each position.`,
                log: `n=${n}. Starting brute force count.`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n; i++) {
                let countForI = 0;

                steps.push({
                    type: 'start-i',
                    arrStates: arr.map((_, idx) => idx === i ? 'candidate' : 'search-space'),
                    i: i,
                    j: -1,
                    panel: `Processing position <b>i = ${i}</b> (value <b>${arr[i]}</b>)<br>Scanning elements to the right...`,
                    statusText: `i = ${i}, value = ${arr[i]}`,
                    log: `i=${i} (${arr[i]}): starting count for this position`,
                    logColor: 'var(--accent-purple)'
                });

                for (let j = i + 1; j < n; j++) {
                    let isSmaller = arr[j] < arr[i];

                    steps.push({
                        type: 'compare',
                        arrStates: arr.map((_, idx) => {
                            if (idx === i) return 'candidate';
                            if (idx === j) return 'candidate';
                            return 'search-space';
                        }),
                        i: i,
                        j: j,
                        panel: `Comparing arr[<b>${i}</b>] = <b>${arr[i]}</b> with arr[<b>${j}</b>] = <b>${arr[j]}</b>`,
                        statusText: `j = ${j}, arr[j] < arr[i] ?`,
                        log: `  j=${j}: ${arr[j]} < ${arr[i]} → ${isSmaller ? 'YES' : 'NO'}`,
                        logColor: isSmaller ? 'var(--accent-red)' : 'var(--text-main)'
                    });

                    if (isSmaller) {
                        countForI++;

                        steps.push({
                            type: 'smaller',
                            arrStates: arr.map((_, idx) => {
                                if (idx === i) return 'candidate';
                                if (idx === j) return 'smaller';
                                return 'search-space';
                            }),
                            i: i,
                            j: j,
                            panel: `<span style="color:var(--accent-red)">Smaller element found!</span><br>arr[${j}] < arr[${i}] → count for i = ${countForI}`,
                            statusText: `Smaller found. Count for i=${i} is now ${countForI}`,
                            log: `    → Smaller! Count for i=${i} is now ${countForI}`,
                            logColor: 'var(--accent-red)'
                        });
                    }
                }

                result[i] = countForI;

                steps.push({
                    type: 'end-i',
                    arrStates: arr.map((_, idx) => idx === i ? 'winning' : 'search-space'),
                    i: i,
                    j: -1,
                    panel: `Finished scanning for i = <b>${i}</b><br>Smaller elements to the right: <b>${countForI}</b>`,
                    statusText: `i = ${i} complete. Count = ${countForI}`,
                    log: `  Finished i=${i}. Count = ${countForI}`,
                    logColor: 'var(--accent-green)'
                });
            }

            // FINAL STEP
            steps.push({
                type: 'final',
                arrStates: arr.map(() => 'winning'),
                i: -1,
                j: -1,
                panel: `All positions processed.<br>Final result: <code>[${result.join(', ')}]</code>`,
                complete: true,
                finalStr: result.join(', '),
                statusText: `Done. Final result = [${result.join(', ')}]`,
                log: `Final Result: [${result.join(', ')}]`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            
            step.arrStates.forEach((state, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.innerText = arr[i];
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);

                if (!step.complete && (step.i === i || step.j === i)) {
                    const ptrContainer = document.createElement('div');
                    ptrContainer.className = 'ptr-container';
                    let label = '';
                    if (step.i === i) label += '<div class="ptr-arrow" style="color:var(--accent-purple)">↑ i</div>';
                    if (step.j === i) label += '<div class="ptr-arrow" style="color:var(--accent-orange)">↑ j</div>';
                    ptrContainer.innerHTML = label;
                    wrapper.appendChild(ptrContainer);
                }

                container.appendChild(wrapper);
            });

            if (!step.complete) {
                container.style.marginBottom = "45px";
            } else {
                container.style.marginBottom = "0px";
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== -1 ? step.i : '—';
            document.getElementById('val-j').innerText = step.j !== -1 ? step.j : '—';
            document.getElementById('val-pair').innerText = step.i !== -1 && step.j !== -1 ? `${arr[step.i]},${arr[step.j]}` : '—';
            document.getElementById('val-count').innerText = step.type === 'end-i' || step.type === 'smaller' || step.type === 'final' ? result[step.i] || '—' : '—';

            // Render final result row
            const resultRow = document.getElementById('result-row');
            resultRow.innerHTML = '';
            if (step.complete || step.type === 'end-i') {
                result.forEach((val, k) => {
                    const rt = document.createElement('div');
                    rt.className = 'result-tile';
                    rt.innerText = val;
                    if (k === step.i && !step.complete) rt.style.borderColor = 'var(--accent-orange)';
                    resultRow.appendChild(rt);
                });
            }

            const resVal = document.getElementById('result-row');
            if (step.complete) {
                resVal.style.animation = 'popAnim 400ms ease';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
