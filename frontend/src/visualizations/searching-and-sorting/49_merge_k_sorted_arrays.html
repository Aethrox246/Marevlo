<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge K Sorted Arrays - Min-Heap Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arrays-input { width: 420px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUAL CONTAINER */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 920px; }
        
        .array-row {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 8px;
            width: 100%;
        }
        .array-label {
            font-family: monospace;
            font-size: 12px;
            color: var(--text-dim);
            writing-mode: vertical-rl;
            text-orientation: mixed;
            padding: 0 4px;
        }
        .tile-unit { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 2px; 
            position: relative; 
        }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .tile-index { font-size: 9px; color: var(--text-dim); font-family: monospace; }
        
        /* STATES */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 18px var(--accent-green); }
        .tile.eliminated { opacity: 0.3; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }
        .tile.current { animation: pulse 700ms infinite; border-color: var(--accent-purple); box-shadow: 0 0 20px var(--accent-purple); }
        
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

        /* HEAP SECTION */
        .heap-section {
            margin-top: 10px;
            padding: 12px 20px;
            background: var(--bg-surface);
            border: 2px solid var(--accent-purple);
            border-radius: 8px;
            width: 100%;
        }
        .heap-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .heap-tile {
            min-width: 52px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 16px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 3px solid var(--accent-purple); background: #21262d; color: var(--accent-purple);
            box-shadow: 0 0 12px rgba(163, 113, 247, 0.4);
        }
        .heap-label { font-size: 10px; color: var(--text-dim); }

        /* INFO & RESULT */
        .info-panel { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--accent-green); }

        .result-display { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .result-bar {
            display: flex;
            gap: 6px;
            padding: 8px 16px;
            background: var(--bg-surface);
            border: 2px solid var(--accent-green);
            border-radius: 8px;
        }
        #res-val { font-size: 23px; color: var(--accent-green); font-family: monospace; font-weight: bold; }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; }

        /* CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        /* LEGEND */
        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 14px; height: 14px; border-radius: 4px; margin-right: 8px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 720px; max-width: 92%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arrays =</label>
        <input type="text" id="arrays-input" class="arrays-input" placeholder='[[1,4,7],[2,5,8],[3,6,9]]'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([[1,4,7],[2,5,8],[3,6,9]])">Ex 1</button>
        <button onclick="loadExample([[10,20],[15,25],[5,30]])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Input Arrays (pointers show current front):</div>
        <div id="arrays-container"></div>

        <div class="heap-section">
            <div class="ui-label" style="margin-bottom:8px">Min-Heap (current smallest candidates):</div>
            <div class="heap-container" id="heap-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel" style="width:720px; min-height:72px; font-size:14px; line-height:1.6">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Extracted</span>
            <span class="info-value" id="val-extracted" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">From Array</span>
            <span class="info-value" id="val-from-array" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Heap Size</span>
            <span class="info-value" id="val-heap-size" style="color: var(--accent-orange);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label">Merged Result (building...)</span>
        <div class="result-bar" id="result-bar"></div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left:12px; display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#0d2244; border:2px solid var(--accent-blue)"></span> Search space</div>
        <div class="legend-item"><span class="dot" style="background:#2a1600; border:2px solid var(--accent-orange)"></span> Current front</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a; border:2px solid var(--accent-green)"></span> Extracted</div>
        <div class="legend-item"><span class="dot" style="background:#161b22; border:2px solid var(--border-main)"></span> Eliminated</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arrays = [[1,4,7],[2,5,8],[3,6,9]];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() {
            loadExample([[1,4,7],[2,5,8],[3,6,9]]);
        }

        function parseArrays(str) {
            try {
                return JSON.parse(str);
            } catch(e) {
                return [[1,4,7],[2,5,8],[3,6,9]];
            }
        }

        function loadExample(newArrays) {
            arrays = newArrays.map(a => [...a]);
            document.getElementById('arrays-input').value = JSON.stringify(arrays);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const str = document.getElementById('arrays-input').value;
            const parsed = parseArrays(str);
            if (Array.isArray(parsed) && parsed.length > 0) {
                loadExample(parsed);
            } else {
                alert("Enter valid JSON like [[1,4,7],[2,5,8],[3,6,9]]");
            }
        }

        function generateSteps() {
            steps = [];
            const K = arrays.length;
            if (K === 0) return;

            let pointers = new Array(K).fill(0);
            let result = [];
            let heap = []; // simulate min-heap with array + sort

            // INIT
            steps.push({
                type: 'init',
                arraysStates: arrays.map(a => a.map(() => 'search-space')),
                pointers: [...pointers],
                heap: [],
                result: [],
                panel: `K = <b>${K}</b> sorted arrays → Min-heap merge starts`,
                statusText: `Initialize heap with first elements`,
                log: `Heap initialized with first element of each array`,
                logColor: 'var(--text-dim)'
            });

            // Push first element of each non-empty array
            for (let arrIdx = 0; arrIdx < K; arrIdx++) {
                if (arrays[arrIdx].length > 0) {
                    heap.push([arrays[arrIdx][0], arrIdx, 0]);
                }
            }
            // For visualization we sort every time
            heap.sort((a,b) => a[0] - b[0]);

            let initHeapStates = [...heap];
            steps.push({
                type: 'heap-init',
                arraysStates: arrays.map(a => a.map(() => 'search-space')),
                pointers: [...pointers],
                heap: initHeapStates,
                result: [],
                panel: `Heap ready with <b>${heap.length}</b> elements`,
                statusText: `Heap has ${heap.length} candidates`,
                log: `Initial heap: ${heap.map(h => h[0]).join(', ')}`,
                logColor: 'var(--accent-purple)'
            });

            while (heap.length > 0) {
                // Extract min
                const [val, arrIdx, elemIdx] = heap.shift();

                let arraysStates = arrays.map((arr, idx) => arr.map((_, i) => 
                    (i < pointers[idx]) ? 'eliminated' : 
                    (i === pointers[idx]) ? 'current' : 'search-space'
                ));

                arraysStates[arrIdx][elemIdx] = 'winning';

                result.push(val);

                steps.push({
                    type: 'extract',
                    arraysStates: arraysStates,
                    pointers: [...pointers],
                    heap: [...heap],
                    result: [...result],
                    panel: `Extracted <b>${val}</b> from array <b>#${arrIdx}</b>`,
                    statusText: `Extracted ${val}`,
                    log: `Popped ${val} from array ${arrIdx}`,
                    logColor: 'var(--accent-green)'
                });

                // Advance pointer
                pointers[arrIdx]++;

                // Push next element from same array if available
                if (pointers[arrIdx] < arrays[arrIdx].length) {
                    const nextVal = arrays[arrIdx][pointers[arrIdx]];
                    heap.push([nextVal, arrIdx, pointers[arrIdx]]);
                    heap.sort((a,b) => a[0] - b[0]);

                    steps.push({
                        type: 'push-next',
                        arraysStates: arraysStates,
                        pointers: [...pointers],
                        heap: [...heap],
                        result: [...result],
                        panel: `Pushed next from array <b>#${arrIdx}</b>: <b>${nextVal}</b>`,
                        statusText: `Added ${nextVal} to heap`,
                        log: `Next from array ${arrIdx}: ${nextVal}`,
                        logColor: 'var(--accent-orange)'
                    });
                }
            }

            // FINAL
            steps.push({
                type: 'final',
                arraysStates: arrays.map(arr => arr.map(() => 'eliminated')),
                pointers: pointers.map(() => 0),
                heap: [],
                result: [...result],
                panel: `<span style="color:var(--accent-green)">Complete! Merged array ready</span>`,
                complete: true,
                finalStr: `[${result.join(', ')}]`,
                statusText: `Merge finished`,
                log: `Final result: [${result.join(', ')}]`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render arrays
            const container = document.getElementById('arrays-container');
            container.innerHTML = '';
            step.arraysStates.forEach((states, arrIdx) => {
                const row = document.createElement('div');
                row.className = 'array-row';
                
                const label = document.createElement('div');
                label.className = 'array-label';
                label.textContent = `A${arrIdx}`;
                row.appendChild(label);

                states.forEach((state, i) => {
                    const unit = document.createElement('div');
                    unit.className = 'tile-unit';
                    const tile = document.createElement('div');
                    tile.className = `tile ${state}`;
                    tile.textContent = arrays[arrIdx][i];
                    const idxLabel = document.createElement('div');
                    idxLabel.className = 'tile-index';
                    idxLabel.textContent = `[${i}]`;
                    unit.append(tile, idxLabel);
                    row.appendChild(unit);
                });
                container.appendChild(row);
            });

            // Render heap
            const heapCont = document.getElementById('heap-container');
            heapCont.innerHTML = '';
            step.heap.forEach(([val, arrIdx, elemIdx]) => {
                const tile = document.createElement('div');
                tile.className = 'heap-tile';
                tile.innerHTML = `${val}<div class="heap-label">A${arrIdx}</div>`;
                heapCont.appendChild(tile);
            });

            // Main panel
            document.getElementById('main-panel').innerHTML = step.panel;

            // Info
            document.getElementById('val-extracted').innerText = step.result && step.result.length > 0 ? step.result[step.result.length-1] : '—';
            document.getElementById('val-from-array').innerText = step.heap && step.heap.length > 0 ? `A${step.heap[0][1]}` : '—';
            document.getElementById('val-heap-size').innerText = step.heap ? step.heap.length : 0;

            // Result bar
            const resultBar = document.getElementById('result-bar');
            resultBar.innerHTML = '';
            step.result.forEach(val => {
                const t = document.createElement('div');
                t.className = 'tile winning';
                t.style.minWidth = '42px';
                t.style.height = '42px';
                t.style.fontSize = '15px';
                t.textContent = val;
                resultBar.appendChild(t);
            });

            // Status
            document.getElementById('status-text').innerText = step.statusText;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
