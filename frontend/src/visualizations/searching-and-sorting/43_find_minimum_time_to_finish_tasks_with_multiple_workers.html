<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Minimum Time to Finish Tasks with Multiple Workers - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .tasks-input { width: 340px; }
        .k-input { width: 80px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUAL CONTAINER */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .matrix-wrapper {
            display: grid;
            gap: 6px;
            padding: 10px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 8px;
        }
        
        .tile-unit { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 2px; 
            position: relative; 
        }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 18px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .tile-index { font-size: 10px; color: var(--text-dim); font-family: monospace; margin-top: 2px; }
        
        /* STATES */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); box-shadow: 0 0 16px rgba(227, 179, 65, 0.6); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 18px var(--accent-green); }
        .tile.eliminated { opacity: 0.3; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }
        .tile.current { animation: pulse 800ms infinite; border-color: var(--accent-purple); box-shadow: 0 0 20px var(--accent-purple); }

        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

        /* PANELS */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 78px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 16px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; color: var(--accent-purple); }

        /* RESULT */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 28px !important; text-shadow: 0 0 18px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(0.9)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px; }

        /* CONTROLS */
        .controls { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 138px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">tasks =</label>
        <input type="text" id="tasks-input" class="tasks-input" placeholder="[3,5,2]">
        <label class="ui-label">k =</label>
        <input type="text" id="k-input" class="k-input" placeholder="2">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([3,5,2], 2)">Ex 1</button>
        <button onclick="loadExample([1,2,3,4], 3)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Tasks (duration):</div>
        <div class="matrix-wrapper" id="matrix-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">low (min possible time)</span>
            <span class="info-value" id="val-low" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">high (max possible time)</span>
            <span class="info-value" id="val-high" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">mid (candidate time)</span>
            <span class="info-value" id="val-mid" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">workers needed</span>
            <span class="info-value" id="val-workers" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">minimum time =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left:12px; display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#0d2244; border:2px solid var(--accent-blue)"></span> Search space</div>
        <div class="legend-item"><span class="dot" style="background:#2a1600; border:2px solid var(--accent-orange)"></span> Candidate time</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a; border:2px solid var(--accent-green)"></span> Assigned to current worker</div>
        <div class="legend-item"><span class="dot" style="background:#161b22; border:2px solid var(--border-main)"></span> Requires new worker</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let tasks = [3,5,2];
        let k = 2;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            loadExample([3,5,2], 2);
        }

        function parseArray(str) {
            try { return JSON.parse(str); } catch(e) { return [3,5,2]; }
        }

        function loadExample(newTasks, newK) {
            tasks = newTasks.map(v => v);
            k = newK;
            document.getElementById('tasks-input').value = JSON.stringify(tasks);
            document.getElementById('k-input').value = k;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const tasksStr = document.getElementById('tasks-input').value;
            const parsedTasks = parseArray(tasksStr);
            const parsedK = parseInt(document.getElementById('k-input').value);
            if (parsedTasks && parsedTasks.length && parsedK > 0) {
                loadExample(parsedTasks, parsedK);
            } else {
                alert("Enter valid tasks array and k ≥ 1");
            }
        }

        function generateSteps() {
            steps = [];
            if (tasks.length === 0) return;

            const maxTask = Math.max(...tasks);
            let total = tasks.reduce((a,b)=>a+b, 0);

            let low = maxTask;
            let high = total;
            let answer = -1;

            // INIT
            steps.push({
                type: 'init',
                gridStates: Array(tasks.length).fill('search-space'),
                low: low,
                high: high,
                mid: -1,
                workers: 0,
                panel: `Tasks = <b>[${tasks.join(', ')}]</b> • Workers = <b>${k}</b><br>Binary search on time: low = <b>${low}</b>, high = <b>${high}</b>`,
                statusText: `Searching for minimum time`,
                log: `low=${low}, high=${high}. Binary search begins.`,
                logColor: 'var(--text-dim)'
            });

            while (low <= high) {
                const mid = Math.floor((low + high) / 2);

                steps.push({
                    type: 'binary-search',
                    gridStates: Array(tasks.length).fill('search-space'),
                    low: low,
                    high: high,
                    mid: mid,
                    workers: 0,
                    panel: `Candidate time = <b>${mid}</b><br>Checking if all tasks can be done within <b>${mid}</b>`,
                    statusText: `mid = ${mid}`,
                    log: `mid = ${mid}. Feasibility check...`,
                    logColor: 'var(--accent-blue)'
                });

                // Feasibility simulation
                let currentLoad = 0;
                let workersNeeded = 1;
                let highlightStates = Array(tasks.length).fill('search-space');

                for (let i = 0; i < tasks.length; i++) {
                    if (currentLoad + tasks[i] <= mid) {
                        currentLoad += tasks[i];
                        highlightStates[i] = 'winning';
                    } else {
                        workersNeeded++;
                        currentLoad = tasks[i];
                        highlightStates[i] = 'winning';
                    }
                }

                steps.push({
                    type: 'feasibility-check',
                    gridStates: highlightStates,
                    low: low,
                    high: high,
                    mid: mid,
                    workers: workersNeeded,
                    panel: `Workers needed for time <b>${mid}</b> = <b>${workersNeeded}</b>`,
                    statusText: `Workers needed = ${workersNeeded}`,
                    log: `Workers needed = ${workersNeeded}`,
                    logColor: workersNeeded <= k ? 'var(--accent-green)' : 'var(--accent-red)'
                });

                if (workersNeeded <= k) {
                    answer = mid;
                    steps.push({
                        type: 'feasible',
                        gridStates: highlightStates,
                        low: low,
                        high: high,
                        mid: mid,
                        workers: workersNeeded,
                        panel: `<span style="color:var(--accent-green)">Feasible</span> → minimum time ≤ <b>${mid}</b><br>high = <b>${mid - 1}</b>`,
                        statusText: `Feasible → high = ${mid - 1}`,
                        log: `→ Feasible. high = ${mid - 1}`,
                        logColor: 'var(--accent-green)'
                    });
                    high = mid - 1;
                } else {
                    steps.push({
                        type: 'not-feasible',
                        gridStates: Array(tasks.length).fill('search-space'),
                        low: low,
                        high: high,
                        mid: mid,
                        workers: workersNeeded,
                        panel: `<span style="color:var(--accent-red)">Not feasible</span> → minimum time &gt; <b>${mid}</b><br>low = <b>${mid + 1}</b>`,
                        statusText: `Not feasible → low = ${mid + 1}`,
                        log: `→ Not feasible. low = ${mid + 1}`,
                        logColor: 'var(--accent-red)'
                    });
                    low = mid + 1;
                }
            }

            // FINAL
            steps.push({
                type: 'final',
                gridStates: Array(tasks.length).fill('winning'),
                low: answer,
                high: answer,
                mid: answer,
                workers: k,
                panel: `Binary search complete.<br>Minimum time = <b>${answer}</b>`,
                complete: true,
                finalStr: answer.toString(),
                statusText: `Done. Answer = ${answer}`,
                log: `Final minimum time: ${answer}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('matrix-container');
            container.style.gridTemplateColumns = `repeat(${tasks.length}, auto)`;
            container.innerHTML = '';

            step.gridStates.forEach((state, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.innerText = tasks[i];
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-low').innerText = step.low !== undefined ? step.low : '—';
            document.getElementById('val-high').innerText = step.high !== undefined ? step.high : '—';
            document.getElementById('val-mid').innerText = step.mid !== undefined ? step.mid : '—';
            document.getElementById('val-workers').innerText = step.workers !== undefined ? step.workers : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            resVal.className = step.complete ? 'pop' : '';

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    if (steps[i].logColor) line.style.color = steps[i].logColor;
                    if (steps[i].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
