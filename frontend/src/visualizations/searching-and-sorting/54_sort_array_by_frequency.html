<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Array by Frequency - HashMap + Sorting Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arr-input { width: 260px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUAL CONTAINER */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 920px; }
        
        .array-wrapper {
            display: flex;
            gap: 6px;
            padding: 10px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 8px;
            width: 100%;
        }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            position: relative;
        }
        .tile-index { font-size: 9px; color: var(--text-dim); font-family: monospace; position: absolute; bottom: -14px; }
        
        /* STATES */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 18px var(--accent-green); }
        .tile.eliminated { opacity: 0.3; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }
        .tile.current { animation: pulse 700ms infinite; border-color: var(--accent-purple); box-shadow: 0 0 20px var(--accent-purple); }
        
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

        /* FREQUENCY MAP */
        .freq-section {
            margin-top: 10px;
            padding: 12px 20px;
            background: var(--bg-surface);
            border: 2px solid var(--accent-purple);
            border-radius: 8px;
            width: 100%;
        }
        .freq-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .freq-tile {
            min-width: 60px; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 15px; font-weight: 700; font-family: 'Courier New', monospace;
            border: 3px solid var(--accent-purple); background: #21262d; color: var(--accent-purple);
            box-shadow: 0 0 12px rgba(163, 113, 247, 0.4);
        }

        /* RESULT */
        .result-display { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .result-bar {
            display: flex;
            gap: 6px;
            padding: 8px 16px;
            background: var(--bg-surface);
            border: 2px solid var(--accent-green);
            border-radius: 8px;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; }

        /* CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        /* LEGEND */
        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 14px; height: 14px; border-radius: 4px; margin-right: 8px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 720px; max-width: 92%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="arr-input" class="arr-input" placeholder='[4,2,2,8,3,3,1]'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([4,2,2,8,3,3,1])">Ex 1</button>
        <button onclick="loadExample([5,5,5,2,2,9])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Input Array</div>
        <div class="array-wrapper" id="input-container"></div>

        <div class="freq-section">
            <div class="ui-label" style="margin-bottom:8px">Frequency Map (after counting)</div>
            <div class="freq-container" id="freq-container"></div>
        </div>

        <div class="ui-label">Sorting by frequency (desc) + original index (asc)</div>
        <div class="array-wrapper" id="output-container"></div>
    </div>

    <div class="action-panel" id="main-panel" style="width:720px; min-height:72px; font-size:14px; line-height:1.6">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Unique Elements</span>
            <span class="info-value" id="val-unique" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max Freq</span>
            <span class="info-value" id="val-maxfreq" style="color: var(--accent-orange);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Final Sorted Array</span>
        <div class="result-bar" id="result-bar"></div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left:12px; display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#0d2244; border:2px solid var(--accent-blue)"></span> Search space</div>
        <div class="legend-item"><span class="dot" style="background:#2a1600; border:2px solid var(--accent-orange)"></span> Current element</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a; border:2px solid var(--accent-green)"></span> Placed (high freq)</div>
        <div class="legend-item"><span class="dot" style="background:#161b22; border:2px solid var(--border-main)"></span> Eliminated</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [4, 2, 2, 8, 3, 3, 1];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function generateSteps() {
            steps = [];
            const n = arr.length;
            if (n === 0) return;

            // Step 1: Count frequencies + first index
            let freqMap = {};
            let firstIndex = {};
            let inputStates = new Array(n).fill('search-space');

            steps.push({
                type: 'init',
                inputStates: [...inputStates],
                freqStates: {},
                panel: `Counting frequencies for <b>${n}</b> elements...`,
                statusText: `Building hashmap`,
                log: `Initialize empty frequency map`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n; i++) {
                const val = arr[i];
                if (!(val in freqMap)) {
                    freqMap[val] = 0;
                    firstIndex[val] = i;
                }
                freqMap[val]++;
                inputStates[i] = 'candidate';

                steps.push({
                    type: 'count',
                    inputStates: [...inputStates],
                    freqStates: {...freqMap},
                    panel: `Element <b>${val}</b> at index <b>${i}</b> → freq = <b>${freqMap[val]}</b>`,
                    statusText: `Updated count for ${val}`,
                    log: `val = ${val}, freq → ${freqMap[val]}`,
                    logColor: 'var(--accent-orange)'
                });
            }

            // Step 2: Create tuple list (value, firstIndex, freq)
            let tuples = [];
            Object.keys(freqMap).forEach(val => {
                tuples.push({val: Number(val) || val, idx: firstIndex[val], freq: freqMap[val]});
            });

            let tupleStates = tuples.map(() => 'search-space');

            steps.push({
                type: 'tuples',
                inputStates: new Array(n).fill('eliminated'),
                freqStates: {...freqMap},
                tupleStates: [...tupleStates],
                panel: `Created <b>${tuples.length}</b> tuples (value, first index, freq)`,
                statusText: `Preparing to sort`,
                log: `Tuples ready for custom sort`,
                logColor: 'var(--accent-purple)'
            });

            // Step 3: Custom sort (freq desc, index asc)
            // Simulate stable sort steps (bubble sort for visibility)
            for (let i = 0; i < tuples.length; i++) {
                for (let j = 0; j < tuples.length - i - 1; j++) {
                    const a = tuples[j];
                    const b = tuples[j + 1];
                    let swap = false;

                    if (a.freq < b.freq || (a.freq === b.freq && a.idx > b.idx)) {
                        swap = true;
                    }

                    tupleStates = new Array(tuples.length).fill('search-space');
                    tupleStates[j] = 'candidate';
                    tupleStates[j + 1] = 'candidate';

                    steps.push({
                        type: 'compare',
                        inputStates: new Array(n).fill('eliminated'),
                        freqStates: {...freqMap},
                        tupleStates: [...tupleStates],
                        panel: `Compare <b>${a.val}</b> (freq=${a.freq}, idx=${a.idx}) vs <b>${b.val}</b> (freq=${b.freq}, idx=${b.idx})`,
                        statusText: swap ? `Swap needed` : `No swap`,
                        log: swap ? `Swap: higher freq or earlier index` : `Keep order`,
                        logColor: swap ? 'var(--accent-green)' : 'var(--accent-orange)'
                    });

                    if (swap) {
                        [tuples[j], tuples[j + 1]] = [tuples[j + 1], tuples[j]];
                    }
                }
            }

            // Final reconstruction
            let result = [];
            let resultStates = new Array(n).fill('search-space');
            let pos = 0;
            for (let t of tuples) {
                for (let k = 0; k < t.freq; k++) {
                    result.push(t.val);
                    resultStates[pos] = 'winning';
                    steps.push({
                        type: 'place',
                        inputStates: new Array(n).fill('eliminated'),
                        freqStates: {...freqMap},
                        tupleStates: new Array(tuples.length).fill('eliminated'),
                        panel: `Place <b>${t.val}</b> (freq = <b>${t.freq}</b>) at position <b>${pos}</b>`,
                        statusText: `Building output`,
                        log: `Append ${t.val}`,
                        logColor: 'var(--accent-green)'
                    });
                    pos++;
                }
            }

            steps.push({
                type: 'final',
                inputStates: new Array(n).fill('eliminated'),
                freqStates: {...freqMap},
                tupleStates: new Array(tuples.length).fill('eliminated'),
                panel: `<span style="color:var(--accent-green)">Sorted by frequency!</span>`,
                statusText: `Final sorted array`,
                log: `Result: ${JSON.stringify(result)}`,
                logColor: 'var(--accent-green)',
                finalArr: result
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render input array
            const inputCont = document.getElementById('input-container');
            inputCont.innerHTML = '';
            step.inputStates.forEach((state, i) => {
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.textContent = arr[i];
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.textContent = `[${i}]`;
                tile.appendChild(idxLabel);
                inputCont.appendChild(tile);
            });

            // Render frequency map
            const freqCont = document.getElementById('freq-container');
            freqCont.innerHTML = '';
            Object.keys(step.freqStates || {}).forEach(key => {
                const tile = document.createElement('div');
                tile.className = 'freq-tile';
                tile.innerHTML = `<b>${key}</b><div style="font-size:9px;margin-top:2px">×${step.freqStates[key]}</div>`;
                freqCont.appendChild(tile);
            });

            // Render output / result tiles
            const outputCont = document.getElementById('output-container');
            outputCont.innerHTML = '';
            if (step.finalArr) {
                step.finalArr.forEach((val, i) => {
                    const tile = document.createElement('div');
                    tile.className = `tile winning`;
                    tile.textContent = val;
                    outputCont.appendChild(tile);
                });
            } else {
                // Placeholder during sorting
                new Array(arr.length).fill('search-space').forEach(() => {
                    const tile = document.createElement('div');
                    tile.className = `tile eliminated`;
                    tile.textContent = '?';
                    outputCont.appendChild(tile);
                });
            }

            // Main panel
            document.getElementById('main-panel').innerHTML = step.panel;

            // Info
            document.getElementById('val-unique').innerText = Object.keys(step.freqStates || {}).length || '—';
            const maxFreq = Math.max(...Object.values(step.freqStates || {0:0}));
            document.getElementById('val-maxfreq').innerText = maxFreq || '—';

            // Status
            document.getElementById('status-text').innerText = step.statusText;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.color = steps[k].logColor || 'var(--text-main)';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;

            // Result bar (final only)
            const resultBar = document.getElementById('result-bar');
            resultBar.innerHTML = '';
            if (step.finalArr) {
                step.finalArr.forEach(val => {
                    const t = document.createElement('div');
                    t.className = 'tile winning';
                    t.style.minWidth = '42px';
                    t.style.height = '42px';
                    t.style.fontSize = '15px';
                    t.textContent = val;
                    resultBar.appendChild(t);
                });
            }
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            const arrStr = document.getElementById('arr-input').value;
            try {
                arr = JSON.parse(arrStr);
                generateSteps();
                reset();
            } catch(e) {
                alert("Enter valid JSON array");
            }
        }

        function loadExample(newArr) {
            arr = [...newArr];
            document.getElementById('arr-input').value = JSON.stringify(arr);
            generateSteps();
            reset();
        }

        window.onload = () => {
            loadExample([4, 2, 2, 8, 3, 3, 1]);
        };
    </script>
</body>
</html>
