<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check if Array is Sorted and Rotated - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"], input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arr-input { width: 320px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: ARRAY TILES */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 80px; position: relative;}
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 16px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        /* Highlight States */
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.temp-match { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); border-style: dashed; z-index: 2;}
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-green); z-index: 3;}
        .tile.losing { background: #3a1010; border-color: var(--accent-red); color: var(--accent-red); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-red); z-index: 3;}
        .tile.eliminated { opacity: 0.5; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* Pointers */
        .ptr-container { display: flex; flex-direction: column; align-items: center; position: absolute; bottom: -50px; gap: 2px; font-size: 11px; font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .ptr-mid { color: var(--accent-orange); }
        .ptr-high { color: var(--accent-blue); }
        .ptr-arrow { font-size: 16px; line-height: 10px; margin-bottom: 2px; color: var(--text-dim); }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 90px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); text-align: center;}
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }
        .pop-false { animation: popAnim 400ms ease; color: var(--accent-red) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-red); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="arr-input" class="arr-input" placeholder="3, 4, 5, 1, 2">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([3, 4, 5, 1, 2])">Ex 1</button>
        <button onclick="loadExample([2, 1, 3, 4])">Ex 2</button>
        <button onclick="loadExample([1, 2, 3, 4, 5])">Sorted</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Array:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">index i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">index (i+1)%n</span>
            <span class="info-value" id="val-next" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">arr[i]</span>
            <span class="info-value" id="val-arri" style="color: var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">arr[(i+1)%n]</span>
            <span class="info-value" id="val-arrnext" style="color: var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Drops</span>
            <span class="info-value" id="val-drops" style="color: var(--accent-red);">0</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">is sorted and rotated =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Current Element</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px dashed var(--accent-blue)"></span> Next Element</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Array is Valid</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--border-main); opacity:0.5"></span> Unchecked / Ignored</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [3, 4, 5, 1, 2];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([3, 4, 5, 1, 2]); }

        function loadExample(newArr) {
            // Do NOT sort the array! We are testing its rotation status.
            arr = [...newArr];
            document.getElementById('arr-input').value = arr.join(', ');
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valStr = document.getElementById('arr-input').value;
            const parsedArr = valStr.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            
            if (parsedArr.length > 0) {
                loadExample(parsedArr.slice(0, 20)); // limit size for display
            } else {
                alert("Please enter a valid array of numbers.");
            }
        }

        function generateSteps() {
            steps = [];
            const n = arr.length;
            if (n === 0) return;

            let drops = 0;

            const getArrStates = (cur_i, nxt_i) => {
                return arr.map((_, idx) => {
                    if (idx === cur_i) return 'candidate';
                    if (idx === nxt_i) return 'temp-match';
                    return 'eliminated';
                });
            };

            // STEP 0: INIT
            steps.push({
                type: 'init', i: '—', next_i: '—', valI: '—', valNext: '—', drops: drops,
                arrStates: arr.map(() => 'eliminated'),
                panel: `We want to check if the array was originally sorted and then rotated.<br>We will count the "drops" where an element is strictly greater than the next element.`,
                statusText: `array=[${arr.join(', ')}]. Click Play to begin.`,
                log: `n=${n}. Checking if array is sorted and rotated.\nInitialize drops = 0.`,
                logColor: 'var(--text-dim)'
            });

            let earlyExit = false;

            for (let i = 0; i < n; i++) {
                let next_i = (i + 1) % n;
                let valI = arr[i];
                let valNext = arr[next_i];

                // EVALUATE
                steps.push({
                    type: 'eval', i: i, next_i: next_i, valI: valI, valNext: valNext, drops: drops,
                    arrStates: getArrStates(i, next_i),
                    panel: `Compare <code>arr[${i}]</code> (<b>${valI}</b>) with the next element <code>arr[${next_i}]</code> (<b>${valNext}</b>).<br><span style="font-size:12px;color:var(--text-dim)">(Note: The last element wraps around to compare with the first).</span>`,
                    statusText: `Comparing index ${i} with ${next_i}...`,
                    log: `\nChecking index ${i}: compare arr[${i}]=${valI} with arr[${next_i}]=${valNext}.`,
                    logColor: 'var(--text-main)'
                });

                if (valI > valNext) {
                    drops++;
                    steps.push({
                        type: 'violation', i: i, next_i: next_i, valI: valI, valNext: valNext, drops: drops,
                        arrStates: getArrStates(i, next_i),
                        panel: `<span style="color:var(--accent-red)">Drop found!</span> <code>${valI} > ${valNext}</code>.<br>Increment <code>drops</code> counter to <b>${drops}</b>.`,
                        statusText: `Drop detected at index ${i}. Drops count = ${drops}.`,
                        log: `  ${valI} > ${valNext}. Drop found! drops = ${drops}.`,
                        logColor: 'var(--accent-red)'
                    });

                    if (drops > 1) {
                        earlyExit = true;
                        steps.push({
                            type: 'early-exit', i: i, next_i: next_i, valI: valI, valNext: valNext, drops: drops,
                            arrStates: getArrStates(i, next_i),
                            panel: `<span style="color:var(--accent-red)">More than 1 drop found (drops = ${drops}).</span><br>A sorted and rotated array can have at most 1 drop. Terminating early.`,
                            statusText: `Multiple drops found. Array is not sorted and rotated.`,
                            log: `  drops > 1. Terminating loop early.`,
                            logColor: 'var(--accent-red)'
                        });
                        break;
                    }
                } else {
                    steps.push({
                        type: 'ok', i: i, next_i: next_i, valI: valI, valNext: valNext, drops: drops,
                        arrStates: getArrStates(i, next_i),
                        panel: `<span style="color:var(--accent-green)">Valid order.</span> <code>${valI} <= ${valNext}</code>.<br>Continue to next index.`,
                        statusText: `Valid ascending order.`,
                        log: `  ${valI} <= ${valNext}. Valid.`,
                        logColor: 'var(--accent-green)'
                    });
                }
            }

            let isSortedAndRotated = drops <= 1;

            // FINAL STEP
            steps.push({
                type: 'final', i: '—', next_i: '—', valI: '—', valNext: '—', drops: drops,
                arrStates: arr.map(() => isSortedAndRotated ? 'winning' : 'losing'),
                panel: isSortedAndRotated 
                    ? `Loop complete. Total drops = <b>${drops}</b> (≤ 1).<br>The array is correctly sorted and rotated.`
                    : `Total drops = <b>${drops}</b> (> 1).<br>The array is NOT a sorted and rotated array.`,
                complete: true,
                finalStr: isSortedAndRotated ? 'true' : 'false',
                statusText: `Done. Returning ${isSortedAndRotated}.`,
                log: `\nFinal Result: ${isSortedAndRotated}`,
                logColor: isSortedAndRotated ? 'var(--accent-green)' : 'var(--accent-red)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            
            step.arrStates.forEach((state, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.innerText = arr[i];
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);

                // Add Pointers
                const ptrs = [];
                if (!step.complete) {
                    if (step.i === i) ptrs.push('<div class="ptr-mid">i</div>');
                    // In case n=1, i and next_i might be the same. 
                    if (step.next_i === i && step.next_i !== step.i) ptrs.push('<div class="ptr-high">nxt</div>');
                    else if (step.next_i === i) ptrs.push('<div class="ptr-high">nxt</div>'); // stack them if same
                }

                if (ptrs.length > 0) {
                    const ptrContainer = document.createElement('div');
                    ptrContainer.className = 'ptr-container';
                    ptrContainer.innerHTML = '<div class="ptr-arrow">↑</div>' + ptrs.join('');
                    wrapper.appendChild(ptrContainer);
                }

                container.appendChild(wrapper);
            });

            if (!step.complete) {
                container.style.marginBottom = "45px";
            } else {
                container.style.marginBottom = "0px";
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i;
            document.getElementById('val-next').innerText = step.next_i;
            document.getElementById('val-arri').innerText = step.valI;
            document.getElementById('val-arrnext').innerText = step.valNext;
            document.getElementById('val-drops').innerText = step.drops;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            
            if (step.complete) {
                resVal.className = step.finalStr === 'true' ? 'pop' : 'pop-false';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
