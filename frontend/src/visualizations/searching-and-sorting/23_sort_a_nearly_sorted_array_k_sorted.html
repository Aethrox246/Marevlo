<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort a Nearly Sorted Array (k-sorted) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"], input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arr-input { width: 320px; }
        .k-input { width: 80px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: ARRAY TILES */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 80px; position: relative;}
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 16px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        /* Highlight States */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-green); z-index: 3;}
        .tile.eliminated { opacity: 0.2; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* Pointers */
        .ptr-container { display: flex; flex-direction: column; align-items: center; position: absolute; bottom: -50px; gap: 2px; font-size: 11px; font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .ptr-low { color: var(--accent-purple); }
        .ptr-mid { color: var(--accent-orange); }
        .ptr-high { color: var(--accent-blue); }
        .ptr-arrow { font-size: 16px; line-height: 10px; margin-bottom: 2px; color: var(--text-dim); }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 90px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }
        .pop-false { animation: popAnim 400ms ease; color: var(--accent-red) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-red); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="arr-input" class="arr-input" placeholder="6, 5, 3, 2, 8, 10, 9">
        <label class="ui-label">k =</label>
        <input type="number" id="k-input" class="k-input" placeholder="3" value="3">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([6, 5, 3, 2, 8, 10, 9], 3)">Ex 1</button>
        <button onclick="loadExample([10, 9, 8, 7, 4, 70, 60, 50], 4)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Current Array State:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">i (current)</span>
            <span class="info-value" id="val-i" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">temp</span>
            <span class="info-value" id="val-temp" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">compare range</span>
            <span class="info-value" id="val-range" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">k</span>
            <span class="info-value" id="val-k" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">final sorted array =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange); border:1px solid var(--accent-orange)"></span> Current element (i)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue); border:1px solid var(--accent-blue)"></span> Comparison range (max 0 to i-k)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Sorted / Inserted</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--border-main); opacity:0.5"></span> Not yet processed</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [6, 5, 3, 2, 8, 10, 9];
        let kVal = 3;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([6, 5, 3, 2, 8, 10, 9], 3); }

        function loadExample(newArr, newK) {
            arr = [...newArr];
            kVal = parseInt(newK);
            document.getElementById('arr-input').value = arr.join(', ');
            document.getElementById('k-input').value = kVal;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valStr = document.getElementById('arr-input').value;
            const kStr = document.getElementById('k-input').value;
            const parsedArr = valStr.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            const parsedK = parseInt(kStr);
            
            if (parsedArr.length > 0 && !isNaN(parsedK) && parsedK >= 0) {
                loadExample(parsedArr.slice(0, 20), parsedK);
            } else {
                alert("Please enter a valid array and k value (k ≥ 0).");
            }
        }

        function generateSteps() {
            steps = [];
            const n = arr.length;
            if (n === 0) return;

            let currentArr = [...arr];

            // STEP 0: INIT
            steps.push({
                type: 'init',
                arrStates: currentArr.map(() => 'search-space'),
                i: -1,
                temp: '—',
                rangeStart: '—',
                rangeEnd: '—',
                panel: `Array: <code>[${arr.join(', ')}]</code><br>k = <b>${kVal}</b><br>Each element is at most k positions away from its sorted position.<br>Starting optimized insertion sort...`,
                statusText: `Nearly sorted array (k=${kVal}). Click Play to begin.`,
                log: `n=${n}, k=${kVal}. Starting Optimized Insertion Sort for nearly sorted array.`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 1; i < n; i++) {
                let temp = currentArr[i];
                let j = i - 1;
                let rangeStart = Math.max(0, i - kVal);

                // STEP: START INSERTION FOR i
                steps.push({
                    type: 'start-insert',
                    arrStates: currentArr.map((_, idx) => (idx >= rangeStart && idx < i) ? 'search-space' : (idx === i ? 'candidate' : 'eliminated')),
                    i: i,
                    temp: temp,
                    rangeStart: rangeStart,
                    rangeEnd: i - 1,
                    panel: `i = <b>${i}</b>, temp = <b>${temp}</b><br>Compare with elements from index <b>${rangeStart}</b> to <b>${i-1}</b> (max k=${kVal} positions back).`,
                    statusText: `Inserting element at index ${i} (temp=${temp})`,
                    log: `\ni=${i}: temp=${temp}, compare range [${rangeStart}, ${i-1}]`,
                    logColor: 'var(--accent-orange)'
                });

                // Shifting phase
                while (j >= rangeStart && currentArr[j] > temp) {
                    // Shift step
                    currentArr[j + 1] = currentArr[j];
                    steps.push({
                        type: 'shift',
                        arrStates: currentArr.map((_, idx) => (idx === j + 1 ? 'candidate' : (idx >= rangeStart && idx <= i ? 'search-space' : 'eliminated'))),
                        i: i,
                        temp: temp,
                        rangeStart: rangeStart,
                        rangeEnd: i - 1,
                        panel: `Shift <b>${currentArr[j]}</b> (at j=${j}) right to position ${j+1}<br>temp=${temp} still waiting to be inserted.`,
                        statusText: `Shifted element at ${j} right`,
                        log: `  Shifted ${currentArr[j]} (j=${j}) → position ${j+1}`,
                        logColor: 'var(--accent-blue)'
                    });
                    j--;
                }

                // Insert temp at correct position
                currentArr[j + 1] = temp;
                steps.push({
                    type: 'insert',
                    arrStates: currentArr.map((_, idx) => (idx === j + 1 ? 'winning' : (idx >= rangeStart && idx < i ? 'search-space' : 'eliminated'))),
                    i: i,
                    temp: temp,
                    rangeStart: rangeStart,
                    rangeEnd: i - 1,
                    panel: `Inserted <b>${temp}</b> at index <b>${j+1}</b>.<br>Array after insertion: <code>[${currentArr.join(', ')}]</code>`,
                    statusText: `Inserted temp at position ${j+1}`,
                    log: `  Inserted ${temp} at position ${j+1}`,
                    logColor: 'var(--accent-green)'
                });
            }

            // FINAL STEP
            steps.push({
                type: 'final',
                arrStates: currentArr.map(() => 'winning'),
                i: -1,
                temp: '—',
                rangeStart: '—',
                rangeEnd: '—',
                panel: `Sorting complete in O(nk) time.<br>Final sorted array: <code>[${currentArr.join(', ')}]</code>`,
                complete: true,
                finalStr: `[${currentArr.join(', ')}]`,
                statusText: `Done. Array is now fully sorted.`,
                log: `Final Result: [${currentArr.join(', ')}]`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            
            step.arrStates.forEach((state, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.innerText = steps[0].arrStates[i] !== undefined ? steps[idx].arrStates[i] === 'eliminated' ? '—' : arr[i] : arr[i]; // use current state value
                
                // Use currentArr from step if available (but since we simulate currentArr, we use original arr for display)
                tile.innerText = arr[i]; // Show original numbers, highlight states indicate progress
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);

                // Pointers for current i and range
                if (!step.complete) {
                    const ptrs = [];
                    if (step.i === i) ptrs.push('<div class="ptr-mid">i</div>');
                    if (step.rangeStart !== '—' && i >= step.rangeStart && i < step.i) ptrs.push('<div class="ptr-low">R</div>');
                    if (ptrs.length > 0) {
                        const ptrContainer = document.createElement('div');
                        ptrContainer.className = 'ptr-container';
                        ptrContainer.innerHTML = '<div class="ptr-arrow">↑</div>' + ptrs.join('');
                        wrapper.appendChild(ptrContainer);
                    }
                }

                container.appendChild(wrapper);
            });

            if (!step.complete) {
                container.style.marginBottom = "45px";
            } else {
                container.style.marginBottom = "0px";
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== -1 ? step.i : '—';
            document.getElementById('val-temp').innerText = step.temp;
            document.getElementById('val-range').innerText = step.rangeStart !== '—' ? `[${step.rangeStart}..${step.rangeEnd}]` : '—';
            document.getElementById('val-k').innerText = kVal;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            
            if (step.complete) {
                resVal.className = 'pop';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
