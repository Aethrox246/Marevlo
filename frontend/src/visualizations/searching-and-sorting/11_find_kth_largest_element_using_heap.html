<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Kth Largest Element (Heap) - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"], input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arr-input { width: 320px; }
        .k-input { width: 60px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: ARRAY TILES */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 70px; position: relative;}
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 16px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        /* Highlight States */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.temp-match { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); border-style: dashed; z-index: 2;}
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-green); z-index: 3;}
        .tile.eliminated { opacity: 0.2; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* Pointers */
        .ptr-container { display: flex; flex-direction: column; align-items: center; position: absolute; bottom: -50px; gap: 2px; font-size: 11px; font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .ptr-mid { color: var(--accent-orange); }
        .ptr-arrow { font-size: 16px; line-height: 10px; margin-bottom: 2px; color: var(--text-dim); }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 50px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 90px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="arr-input" class="arr-input" placeholder="3, 2, 1, 5, 6, 4">
        <label class="ui-label">k =</label>
        <input type="number" id="k-input" class="k-input" placeholder="2">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([3, 2, 1, 5, 6, 4], 2)">Ex 1</button>
        <button onclick="loadExample([7, 10, 4, 3, 20, 15], 3)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Input Array:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
        
        <div class="ui-label" style="margin-top: 20px;">Min-Heap (Max Size = k):</div>
        <div class="tiles-wrapper" id="heap-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">index i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">arr[i]</span>
            <span class="info-value" id="val-arri" style="color: var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">k</span>
            <span class="info-value" id="val-k" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Heap Size</span>
            <span class="info-value" id="val-heapsize" style="color: var(--text-main);">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Heap Top (Min)</span>
            <span class="info-value" id="val-heaptop" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">kth largest element =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Current Array Element</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-blue)"></span> Heap Element</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px dashed var(--accent-green)"></span> Heap Root (Current Kth Largest)</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--border-main); opacity:0.5"></span> Processed Array Element</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [3, 2, 1, 5, 6, 4];
        let kVal = 2;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [2000, 1000, 500];

        // Simple Min-Heap Implementation for logic generation
        class MinHeap {
            constructor() { this.heap = []; }
            push(val) { 
                this.heap.push(val); 
                this.siftUp(this.heap.length - 1); 
            }
            pop() {
                if (this.heap.length === 0) return null;
                if (this.heap.length === 1) return this.heap.pop();
                const min = this.heap[0];
                this.heap[0] = this.heap.pop();
                this.siftDown(0);
                return min;
            }
            peek() { return this.heap.length > 0 ? this.heap[0] : null; }
            siftUp(i) {
                while (i > 0) {
                    let p = Math.floor((i - 1) / 2);
                    if (this.heap[p] > this.heap[i]) {
                        [this.heap[p], this.heap[i]] = [this.heap[i], this.heap[p]];
                        i = p;
                    } else break;
                }
            }
            siftDown(i) {
                let len = this.heap.length;
                while (true) {
                    let left = 2 * i + 1;
                    let right = 2 * i + 2;
                    let smallest = i;
                    if (left < len && this.heap[left] < this.heap[smallest]) smallest = left;
                    if (right < len && this.heap[right] < this.heap[smallest]) smallest = right;
                    if (smallest !== i) {
                        [this.heap[i], this.heap[smallest]] = [this.heap[smallest], this.heap[i]];
                        i = smallest;
                    } else break;
                }
            }
            getArray() { return [...this.heap]; }
        }

        function init() { loadExample([3, 2, 1, 5, 6, 4], 2); }

        function loadExample(newArr, newK) {
            arr = [...newArr];
            kVal = parseInt(newK);
            document.getElementById('arr-input').value = arr.join(', ');
            document.getElementById('k-input').value = kVal;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valStr = document.getElementById('arr-input').value;
            const kStr = document.getElementById('k-input').value;
            const parsedArr = valStr.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            const parsedK = parseInt(kStr);
            
            if (parsedArr.length > 0 && !isNaN(parsedK) && parsedK > 0 && parsedK <= parsedArr.length) {
                loadExample(parsedArr.slice(0, 20), parsedK); 
            } else {
                alert("Please enter a valid array and ensure 1 <= k <= array length.");
            }
        }

        function generateSteps() {
            steps = [];
            const n = arr.length;
            if (n === 0 || kVal <= 0 || kVal > n) return;

            let minHeap = new MinHeap();

            const getArrStates = (cur_i, isFinal = false) => {
                return arr.map((_, idx) => {
                    if (isFinal) return 'eliminated'; 
                    if (idx === cur_i) return 'candidate';
                    if (idx < cur_i) return 'eliminated'; // Processed
                    return 'search-space'; // Unprocessed
                });
            };

            // STEP 0: INIT
            steps.push({
                type: 'init', i: '—', valI: '—', k: kVal, heap: minHeap.getArray(),
                arrStates: getArrStates(-1),
                panel: `We will use a <b>Min-Heap</b> of size <code>k = ${kVal}</code>.<br>By keeping the <code>k</code> largest elements in the heap, the top (minimum) of the heap will always be the kth largest element overall.`,
                statusText: `Array length = ${n}, k = ${kVal}. Click Play to begin.`,
                log: `n=${n}, k=${kVal}. Finding Kth Largest Element using Min-Heap.\nInitialize empty Min-Heap. Max capacity = k.`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n; i++) {
                let val = arr[i];

                // EVALUATE
                steps.push({
                    type: 'eval', i: i, valI: val, k: kVal, heap: minHeap.getArray(),
                    arrStates: getArrStates(i),
                    panel: `Reading <code>arr[${i}]</code> = <b>${val}</b>.`,
                    statusText: `Processing element at index ${i}...`,
                    log: `\nIndex ${i}: Processing value ${val}.`,
                    logColor: 'var(--text-main)'
                });

                if (minHeap.getArray().length < kVal) {
                    minHeap.push(val);
                    steps.push({
                        type: 'push', i: i, valI: val, k: kVal, heap: minHeap.getArray(),
                        arrStates: getArrStates(i),
                        panel: `Heap size (${minHeap.getArray().length - 1}) < <code>k</code>.<br><span style="color:var(--accent-blue)">Push <b>${val}</b> into the heap.</span>`,
                        statusText: `Heap is not full. Inserted ${val}.`,
                        log: `  Heap size < k. Pushed ${val} to heap.`,
                        logColor: 'var(--accent-blue)'
                    });
                } else {
                    let top = minHeap.peek();
                    if (val > top) {
                        steps.push({
                            type: 'compare-greater', i: i, valI: val, k: kVal, heap: minHeap.getArray(),
                            arrStates: getArrStates(i),
                            panel: `Heap is full (size = ${kVal}). Compare current value <b>${val}</b> with heap top <b>${top}</b>.<br><span style="color:var(--accent-green)"><code>${val} > ${top}</code></span>, so ${val} is a candidate for the top k elements.`,
                            statusText: `${val} is greater than heap top ${top}.`,
                            log: `  Heap full. ${val} > heap top (${top}).`,
                            logColor: 'var(--accent-green)'
                        });

                        minHeap.pop();
                        minHeap.push(val);

                        steps.push({
                            type: 'replace', i: i, valI: val, k: kVal, heap: minHeap.getArray(),
                            arrStates: getArrStates(i),
                            panel: `Popped <b>${top}</b> from the heap, and <span style="color:var(--accent-blue)">Pushed <b>${val}</b></span>.<br>The new heap top (current ${kVal}th largest) is <b>${minHeap.peek()}</b>.`,
                            statusText: `Replaced heap top. New heap root is ${minHeap.peek()}.`,
                            log: `  Popped ${top}, Pushed ${val}. New heap top = ${minHeap.peek()}.`,
                            logColor: 'var(--accent-blue)'
                        });
                    } else {
                        steps.push({
                            type: 'ignore', i: i, valI: val, k: kVal, heap: minHeap.getArray(),
                            arrStates: getArrStates(i),
                            panel: `Heap is full (size = ${kVal}). Compare current value <b>${val}</b> with heap top <b>${top}</b>.<br><span style="color:var(--accent-red)"><code>${val} <= ${top}</code></span>, so ${val} cannot be among the top ${kVal} elements.<br>Ignored.`,
                            statusText: `${val} <= heap top. Ignored.`,
                            log: `  Heap full. ${val} <= heap top (${top}). Ignored.`,
                            logColor: 'var(--text-dim)'
                        });
                    }
                }
            }

            let finalAns = minHeap.peek();

            // FINAL STEP
            steps.push({
                type: 'final', i: '—', valI: '—', k: kVal, heap: minHeap.getArray(),
                arrStates: getArrStates(-1, true),
                panel: `Iteration complete. The heap now contains the <b>${kVal}</b> largest elements of the array.<br>The top of the heap is the ${kVal}th largest element: <b>${finalAns}</b>.`,
                complete: true,
                finalStr: finalAns.toString(),
                statusText: `Done. Returning ${finalAns}.`,
                log: `\nIteration complete. Min-Heap contains the top ${kVal} elements.\nFinal Result: ${kVal}th largest element is ${finalAns}`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const arrContainer = document.getElementById('tiles-container');
            arrContainer.innerHTML = '';
            
            step.arrStates.forEach((state, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.innerText = arr[i];
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);

                if (!step.complete && step.i === i) {
                    const ptrContainer = document.createElement('div');
                    ptrContainer.className = 'ptr-container';
                    ptrContainer.innerHTML = '<div class="ptr-arrow">↑</div><div class="ptr-mid">i</div>';
                    wrapper.appendChild(ptrContainer);
                }

                arrContainer.appendChild(wrapper);
            });

            // Render Heap Container
            const heapContainer = document.getElementById('heap-container');
            heapContainer.innerHTML = '';
            if (step.heap) {
                step.heap.forEach((val, i) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'tile-unit';
                    
                    let state = 'search-space'; // Default blueish
                    if (i === 0) {
                        state = step.complete ? 'winning' : 'temp-match'; // Highlight root
                    }
                    
                    const tile = document.createElement('div');
                    tile.className = `tile ${state}`;
                    tile.innerText = val;
                    
                    const idxLabel = document.createElement('div');
                    idxLabel.className = 'tile-index';
                    idxLabel.innerText = `idx ${i}`;
                    
                    wrapper.append(tile, idxLabel);

                    if (i === 0) {
                        const ptrContainer = document.createElement('div');
                        ptrContainer.className = 'ptr-container';
                        ptrContainer.innerHTML = '<div class="ptr-arrow">↑</div><div class="ptr-mid" style="color:var(--accent-green)">Top(Min)</div>';
                        wrapper.appendChild(ptrContainer);
                    }

                    heapContainer.appendChild(wrapper);
                });
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i;
            document.getElementById('val-arri').innerText = step.valI;
            document.getElementById('val-k').innerText = step.k;
            document.getElementById('val-heapsize').innerText = step.heap ? step.heap.length : 0;
            
            let topVal = step.heap && step.heap.length > 0 ? step.heap[0] : '—';
            document.getElementById('val-heaptop').innerText = topVal;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            
            if (step.complete) {
                resVal.className = 'pop';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
