<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Peak Element - Binary Search Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arr-input { width: 260px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUAL CONTAINER */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 920px; }
        
        .array-wrapper {
            display: flex;
            gap: 6px;
            padding: 10px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 8px;
            width: 100%;
        }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            position: relative;
        }
        .tile-index { font-size: 9px; color: var(--text-dim); font-family: monospace; position: absolute; bottom: -14px; }
        
        /* STATES */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 18px var(--accent-green); }
        .tile.eliminated { opacity: 0.3; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }
        .tile.current { animation: pulse 700ms infinite; border-color: var(--accent-purple); box-shadow: 0 0 20px var(--accent-purple); }
        
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

        /* POINTERS */
        .pointers {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 860px;
            margin-top: -8px;
            font-family: monospace;
            font-size: 13px;
        }
        .pointer { color: var(--accent-purple); }

        /* INFO PANEL */
        .info-panel { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 18px; font-weight: 700; }

        .result-display { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .result-bar {
            display: flex;
            gap: 12px;
            padding: 12px 24px;
            background: var(--bg-surface);
            border: 2px solid var(--accent-green);
            border-radius: 8px;
            font-size: 22px;
            font-weight: 700;
        }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.4em; text-align: center; }

        /* CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        /* LEGEND */
        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 14px; height: 14px; border-radius: 4px; margin-right: 8px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 18px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 20px; width: 720px; max-width: 92%; height: 148px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="arr-input" class="arr-input" placeholder='[1,2,3,1]'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([1,2,3,1])">Ex 1</button>
        <button onclick="loadExample([1,2,1,3,5,6,4])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Array (binary search for any peak)</div>
        <div class="array-wrapper" id="array-container"></div>

        <div class="pointers">
            <div><span class="pointer">low</span> <span id="low-val" class="info-value">0</span></div>
            <div><span class="pointer">mid</span> <span id="mid-val" class="info-value">—</span></div>
            <div><span class="pointer">high</span> <span id="high-val" class="info-value">—</span></div>
        </div>

        <div class="info-panel">
            <div class="info-cell">
                <span class="info-label">mid value</span>
                <span class="info-value" id="mid-value" style="color: var(--accent-orange);">—</span>
            </div>
            <div class="info-cell">
                <span class="info-label">next value</span>
                <span class="info-value" id="next-value" style="color: var(--accent-purple);">—</span>
            </div>
        </div>

        <div class="result-display">
            <span class="ui-label" style="margin-bottom: 4px;">Peak Index (any one)</span>
            <div class="result-bar" id="result-bar">
                <span id="peak-index" style="color:var(--accent-green)">—</span>
                <span style="color:var(--text-dim)"> (value </span>
                <span id="peak-value" style="color:var(--accent-green)">—</span>
                <span style="color:var(--text-dim)">)</span>
            </div>
        </div>

        <div class="status-bar" id="status-text"></div>

        <div class="controls">
            <button onclick="reset()">↺ Reset</button>
            <button onclick="back()">← Back</button>
            <button onclick="togglePlay()" id="play-btn">Play</button>
            <button onclick="next()">Next →</button>
            <div style="margin-left:12px; display:flex; align-items:center; gap:6px;">
                <span class="ui-label" style="font-size:11px">Speed</span>
                <input type="range" id="speed-slider" min="0" max="2" value="1">
            </div>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:#0d2244; border:2px solid var(--accent-blue)"></span> Search space</div>
            <div class="legend-item"><span class="dot" style="background:#2a1600; border:2px solid var(--accent-orange)"></span> Mid (current)</div>
            <div class="legend-item"><span class="dot" style="background:#0f2a1a; border:2px solid var(--accent-green)"></span> Peak found</div>
            <div class="legend-item"><span class="dot" style="background:#161b22; border:2px solid var(--border-main)"></span> Eliminated</div>
        </div>

        <div class="log-panel" id="log"></div>
    </div>

    <script>
        let arr = [1, 2, 3, 1];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function generateSteps() {
            steps = [];
            const n = arr.length;
            if (n === 0) return;

            let left = 0;
            let right = n - 1;
            let states = new Array(n).fill('search-space');

            // INIT
            steps.push({
                type: 'init',
                states: [...states],
                left: left,
                right: right,
                mid: null,
                panel: `Binary search for a <b>peak</b> in array of length <b>${n}</b>`,
                statusText: `left=${left}, right=${right}`,
                log: `Start binary search (treat boundaries as -∞)`,
                logColor: 'var(--text-dim)'
            });

            while (left < right) {
                const mid = Math.floor((left + right) / 2);
                states = new Array(n).fill('search-space');
                states[mid] = 'candidate';

                steps.push({
                    type: 'compare',
                    states: [...states],
                    left: left,
                    right: right,
                    mid: mid,
                    panel: `mid = <b>${mid}</b> (value = <b>${arr[mid]}</b>)`,
                    statusText: `Compare arr[${mid}] with arr[${mid + 1}]`,
                    log: `arr[${mid}] = ${arr[mid]} vs arr[${mid + 1}] = ${arr[mid + 1]}`,
                    logColor: 'var(--accent-orange)'
                });

                if (arr[mid] < arr[mid + 1]) {
                    // Peak must be in right half
                    left = mid + 1;
                    states[mid] = 'eliminated';
                    steps.push({
                        type: 'update',
                        states: [...states],
                        left: left,
                        right: right,
                        mid: mid,
                        panel: `arr[${mid}] &lt; arr[${mid+1}] → peak in <b>right half</b>`,
                        statusText: `Go right`,
                        log: `left ← ${left}`,
                        logColor: 'var(--accent-green)'
                    });
                } else {
                    // Peak must be in left half (including mid)
                    right = mid;
                    states[mid] = 'eliminated';
                    steps.push({
                        type: 'update',
                        states: [...states],
                        left: left,
                        right: right,
                        mid: mid,
                        panel: `arr[${mid}] ≥ arr[${mid+1}] → peak in <b>left half</b>`,
                        statusText: `Go left`,
                        log: `right ← ${right}`,
                        logColor: 'var(--accent-green)'
                    });
                }
            }

            // FINAL
            states = new Array(n).fill('eliminated');
            states[left] = 'winning';
            steps.push({
                type: 'final',
                states: [...states],
                left: left,
                right: right,
                mid: left,
                panel: `<span style="color:var(--accent-green)">Peak found at index <b>${left}</b> (value <b>${arr[left]}</b>)</span>`,
                statusText: `Peak index = ${left}`,
                log: `Final peak index ${left} (value ${arr[left]})`,
                logColor: 'var(--accent-green)',
                finalIndex: left,
                finalValue: arr[left]
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render array
            const container = document.getElementById('array-container');
            container.innerHTML = '';
            step.states.forEach((state, i) => {
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.textContent = arr[i];
                const idxDiv = document.createElement('div');
                idxDiv.className = 'tile-index';
                idxDiv.textContent = `[${i}]`;
                tile.appendChild(idxDiv);
                container.appendChild(tile);
            });

            // Pointers
            document.getElementById('low-val').textContent = step.left;
            document.getElementById('high-val').textContent = step.right;
            document.getElementById('mid-val').textContent = step.mid !== null ? step.mid : '—';

            // Mid value & next value
            if (step.mid !== null) {
                document.getElementById('mid-value').textContent = arr[step.mid];
                if (step.mid + 1 < arr.length) {
                    document.getElementById('next-value').textContent = arr[step.mid + 1];
                } else {
                    document.getElementById('next-value').textContent = '-∞';
                }
            } else {
                document.getElementById('mid-value').textContent = '—';
                document.getElementById('next-value').textContent = '—';
            }

            // Status
            document.getElementById('status-text').innerText = step.statusText;

            // Main panel
            document.getElementById('main-panel') ? document.getElementById('main-panel').innerHTML = step.panel : null;

            // Result bar (final only)
            const resultBar = document.getElementById('result-bar');
            if (step.finalIndex !== undefined) {
                document.getElementById('peak-index').textContent = step.finalIndex;
                document.getElementById('peak-value').textContent = step.finalValue;
            }

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let i = 0; i <= idx; i++) {
                if (steps[i].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.color = steps[i].logColor || 'var(--text-main)';
                    line.textContent = steps[i].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        function loadCustom() {
            const arrStr = document.getElementById('arr-input').value;
            try {
                arr = JSON.parse(arrStr);
                generateSteps();
                reset();
            } catch(e) {
                alert("Enter valid JSON array");
            }
        }

        function loadExample(newArr) {
            arr = [...newArr];
            document.getElementById('arr-input').value = JSON.stringify(arr);
            generateSteps();
            reset();
        }

        window.onload = () => {
            loadExample([1, 2, 3, 1]);
        };
    </script>
</body>
</html>
