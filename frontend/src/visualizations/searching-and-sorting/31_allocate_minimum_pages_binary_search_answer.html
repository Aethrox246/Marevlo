<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allocate Minimum Pages - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arr-input { width: 320px; }
        .k-input { width: 80px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: ARRAY TILES */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 80px; position: relative;}
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 16px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        /* Highlight States */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-green); z-index: 3;}
        .tile.eliminated { opacity: 0.2; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }
        .tile.group { background: #3a1f2a; border-color: var(--accent-red); color: var(--accent-red); }

        /* Pointers */
        .ptr-container { display: flex; flex-direction: column; align-items: center; position: absolute; bottom: -50px; gap: 2px; font-size: 11px; font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .ptr-arrow { font-size: 16px; line-height: 10px; margin-bottom: 2px; color: var(--text-dim); }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 90px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">pages =</label>
        <input type="text" id="arr-input" class="arr-input" placeholder="10, 20, 30, 40">
        <label class="ui-label">k =</label>
        <input type="text" id="k-input" class="k-input" placeholder="2" value="2">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([10,20,30,40], 2)">Ex 1</button>
        <button onclick="loadExample([12,34,67,90], 2)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Pages array:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">low (min possible max)</span>
            <span class="info-value" id="val-low" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">high (max possible max)</span>
            <span class="info-value" id="val-high" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">mid (current guess)</span>
            <span class="info-value" id="val-mid" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">students used</span>
            <span class="info-value" id="val-students" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">minimum possible max pages =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple); border:1px solid var(--accent-purple)"></span> Current binary search low</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange); border:1px solid var(--accent-orange)"></span> Current binary search high</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red); border:1px solid var(--accent-red)"></span> Current student group</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Feasible allocation</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [10, 20, 30, 40];
        let kVal = 2;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([10, 20, 30, 40], 2); }

        function loadExample(newArr, newK) {
            arr = [...newArr];
            kVal = parseInt(newK);
            document.getElementById('arr-input').value = arr.join(', ');
            document.getElementById('k-input').value = kVal;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valStr = document.getElementById('arr-input').value;
            const parsedArr = valStr.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            const parsedK = parseInt(document.getElementById('k-input').value);
            if (parsedArr.length > 1 && !isNaN(parsedK)) {
                loadExample(parsedArr.slice(0, 20), parsedK);
            } else {
                alert("Please enter valid pages and number of students (k).");
            }
        }

        function generateSteps() {
            steps = [];
            const n = arr.length;
            const totalSum = arr.reduce((a, b) => a + b, 0);
            const maxPage = Math.max(...arr);

            let low = maxPage;
            let high = totalSum;
            let answer = -1;

            // STEP 0: INIT
            steps.push({
                type: 'init',
                arrStates: arr.map(() => 'search-space'),
                low: low,
                high: high,
                mid: -1,
                panel: `Pages: <code>[${arr.join(', ')}]</code><br>Students (k) = <b>${kVal}</b><br>Binary search range: low = max page = <b>${low}</b>, high = total sum = <b>${high}</b>`,
                statusText: `Searching for minimum possible maximum pages.`,
                log: `low=${low}, high=${high}. Starting binary search on answer.`,
                logColor: 'var(--text-dim)'
            });

            while (low <= high) {
                const mid = Math.floor((low + high) / 2);

                steps.push({
                    type: 'binary-search',
                    arrStates: arr.map(() => 'search-space'),
                    low: low,
                    high: high,
                    mid: mid,
                    panel: `Current guess mid = <b>${mid}</b><br>Checking if we can allocate books to ${kVal} students with max pages ≤ <b>${mid}</b>`,
                    statusText: `Binary search mid = ${mid}`,
                    log: `mid = ${mid}. Checking feasibility...`,
                    logColor: 'var(--accent-blue)'
                });

                // Feasibility check sub-steps
                let studentsUsed = 1;
                let currentPages = 0;
                let allocationGroups = [];
                let currentGroup = [];

                for (let i = 0; i < n; i++) {
                    if (currentPages + arr[i] > mid) {
                        // Start new student
                        allocationGroups.push(currentGroup);
                        currentGroup = [arr[i]];
                        currentPages = arr[i];
                        studentsUsed++;
                    } else {
                        currentGroup.push(arr[i]);
                        currentPages += arr[i];
                    }
                }
                allocationGroups.push(currentGroup);

                steps.push({
                    type: 'feasibility-check',
                    arrStates: arr.map(() => 'search-space'),
                    low: low,
                    high: high,
                    mid: mid,
                    studentsUsed: studentsUsed,
                    panel: `Feasibility check for mid = <b>${mid}</b><br>Students used = <b>${studentsUsed}</b> (max allowed = <b>${kVal}</b>)`,
                    statusText: `Feasibility: ${studentsUsed} students used`,
                    log: `Greedy allocation used ${studentsUsed} students.`,
                    logColor: studentsUsed <= kVal ? 'var(--accent-green)' : 'var(--accent-red)'
                });

                if (studentsUsed <= kVal) {
                    // Feasible, try smaller maximum
                    answer = mid;
                    steps.push({
                        type: 'feasible',
                        arrStates: arr.map(() => 'winning'),
                        low: low,
                        high: high,
                        mid: mid,
                        panel: `<span style="color:var(--accent-green)">Feasible!</span> We can allocate with max pages <b>${mid}</b>.<br>Try smaller maximum → high = <b>${mid - 1}</b>`,
                        statusText: `Feasible. Setting high = ${mid - 1}`,
                        log: `→ Feasible! Updating answer = ${mid}, high = ${mid - 1}`,
                        logColor: 'var(--accent-green)'
                    });
                    high = mid - 1;
                } else {
                    // Not feasible, need larger maximum
                    steps.push({
                        type: 'not-feasible',
                        arrStates: arr.map(() => 'search-space'),
                        low: low,
                        high: high,
                        mid: mid,
                        panel: `<span style="color:var(--accent-red)">Not feasible!</span> Requires <b>${studentsUsed}</b> students > <b>${kVal}</b>.<br>Need larger maximum → low = <b>${mid + 1}</b>`,
                        statusText: `Not feasible. Setting low = ${mid + 1}`,
                        log: `→ Not feasible. low = ${mid + 1}`,
                        logColor: 'var(--accent-red)'
                    });
                    low = mid + 1;
                }
            }

            // FINAL STEP
            steps.push({
                type: 'final',
                arrStates: arr.map(() => 'winning'),
                low: answer,
                high: answer,
                mid: answer,
                panel: `Binary search complete.<br>Minimum possible maximum pages = <b>${answer}</b>`,
                complete: true,
                finalStr: answer.toString(),
                statusText: `Done. Answer = ${answer}`,
                log: `Final Result: ${answer}`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            
            step.arrStates.forEach((state, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.innerText = arr[i];
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            if (!step.complete) {
                container.style.marginBottom = "45px";
            } else {
                container.style.marginBottom = "0px";
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-low').innerText = step.low !== undefined ? step.low : '—';
            document.getElementById('val-high').innerText = step.high !== undefined ? step.high : '—';
            document.getElementById('val-mid').innerText = step.mid !== undefined ? step.mid : '—';
            document.getElementById('val-students').innerText = step.studentsUsed !== undefined ? step.studentsUsed : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            
            if (step.complete) {
                resVal.className = 'pop';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
