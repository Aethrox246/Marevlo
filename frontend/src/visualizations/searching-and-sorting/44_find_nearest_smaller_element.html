<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Nearest Smaller Element - Monotonic Stack Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .array-input { width: 420px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUAL CONTAINER */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .array-wrapper {
            display: grid;
            gap: 6px;
            padding: 10px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 8px;
        }
        
        .tile-unit { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 2px; 
            position: relative; 
        }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 18px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .tile-index { font-size: 10px; color: var(--text-dim); font-family: monospace; margin-top: 2px; }
        
        /* Highlight States */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); box-shadow: 0 0 16px rgba(227, 179, 65, 0.6); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 18px var(--accent-green); }
        .tile.eliminated { opacity: 0.25; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }
        .tile.current { animation: pulse 800ms infinite; border-color: var(--accent-purple); box-shadow: 0 0 20px var(--accent-purple); }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* STACK VISUALIZATION */
        .stack-container {
            margin-top: 12px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stack-title { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
        .stack-wrapper {
            display: flex;
            flex-direction: row;
            gap: 6px;
        }
        .stack-tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 16px; font-weight: 700; font-family: 'Courier New', monospace;
            background: #21262d; border: 2px solid var(--accent-purple); color: var(--accent-purple);
        }

        /* PANELS */
        .action-panel {
            margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 78px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 16px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; color: var(--accent-purple); }

        /* RESULT ROW */
        .result-row {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .result-wrapper {
            display: grid;
            gap: 6px;
            padding: 8px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 8px;
        }

        /* RESULT */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 28px !important; text-shadow: 0 0 18px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(0.9)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px; }

        /* CONTROLS */
        .controls { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 138px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="array-input" class="array-input" placeholder="[4,5,2,10,8]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([4,5,2,10,8])">Ex 1</button>
        <button onclick="loadExample([1,3,0,2,5])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Input Array:</div>
        <div class="array-wrapper" id="array-container"></div>

        <div class="stack-container">
            <div class="stack-title">Monotonic Stack (indices)</div>
            <div class="stack-wrapper" id="stack-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Index</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Value</span>
            <span class="info-value" id="val-val" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Stack Top Value</span>
            <span class="info-value" id="val-top" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Nearest Smaller</span>
            <span class="info-value" id="val-nearest" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Result Array:</span>
        <div class="result-wrapper" id="result-container"></div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left:12px; display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#0d2244; border:2px solid var(--accent-blue)"></span> Search space / Unprocessed</div>
        <div class="legend-item"><span class="dot" style="background:#2a1600; border:2px solid var(--accent-orange)"></span> Current element</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a; border:2px solid var(--accent-green)"></span> Nearest smaller found</div>
        <div class="legend-item"><span class="dot" style="background:#161b22; border:2px solid var(--border-main)"></span> Popped (larger element)</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [4, 5, 2, 10, 8];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            loadExample([4, 5, 2, 10, 8]);
        }

        function parseArray(str) {
            try { return JSON.parse(str); } catch(e) { return [4, 5, 2, 10, 8]; }
        }

        function loadExample(newArr) {
            arr = newArr.map(v => v);
            document.getElementById('array-input').value = JSON.stringify(arr);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const arrStr = document.getElementById('array-input').value;
            const parsed = parseArray(arrStr);
            if (parsed && parsed.length > 0) {
                loadExample(parsed);
            } else {
                alert("Please enter a valid array like [4,5,2,10,8]");
            }
        }

        function generateSteps() {
            steps = [];
            const n = arr.length;
            const result = new Array(n).fill(-1);
            const stack = []; // stores indices

            // INIT
            steps.push({
                type: 'init',
                gridStates: Array(n).fill('search-space'),
                stackStates: [],
                i: -1,
                current: -1,
                nearest: -1,
                panel: `Array: <b>[${arr.join(', ')}]</b><br>Monotonic Stack (increasing order)<br>Result initialized to [-1, -1, ...]`,
                statusText: `Starting monotonic stack algorithm`,
                log: `Initialize stack=[], result=[-1]*${n}`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n; i++) {
                const current = arr[i];

                // Show current element
                let gridStates = Array(n).fill('search-space');
                gridStates[i] = 'candidate';

                steps.push({
                    type: 'current',
                    gridStates: [...gridStates],
                    stackStates: [...stack],
                    i: i,
                    current: current,
                    nearest: -1,
                    panel: `Processing index <b>${i}</b> (value = <b>${current}</b>)<br>Stack = [${stack.map(idx => arr[idx]).join(', ')}]`,
                    statusText: `i = ${i}, value = ${current}`,
                    log: `Current element = ${current}`,
                    logColor: 'var(--accent-orange)'
                });

                // Pop larger or equal elements
                while (stack.length > 0 && arr[stack[stack.length - 1]] >= current) {
                    const poppedIdx = stack.pop();
                    gridStates[poppedIdx] = 'eliminated';

                    steps.push({
                        type: 'pop',
                        gridStates: [...gridStates],
                        stackStates: [...stack],
                        i: i,
                        current: current,
                        nearest: -1,
                        panel: `Popped index <b>${poppedIdx}</b> (value <b>${arr[poppedIdx]}</b> ≥ <b>${current}</b>)<br>Stack = [${stack.map(idx => arr[idx]).join(', ')}]`,
                        statusText: `Popped ${arr[poppedIdx]}`,
                        log: `Popped ${arr[poppedIdx]} (≥ current)`,
                        logColor: 'var(--accent-red)'
                    });
                }

                // Set nearest smaller
                let nearest = -1;
                if (stack.length > 0) {
                    nearest = arr[stack[stack.length - 1]];
                }

                result[i] = nearest;

                steps.push({
                    type: 'nearest-found',
                    gridStates: [...gridStates],
                    stackStates: [...stack],
                    i: i,
                    current: current,
                    nearest: nearest,
                    panel: `Nearest smaller for index <b>${i}</b> = <b>${nearest}</b><br>Stack = [${stack.map(idx => arr[idx]).join(', ')}]`,
                    statusText: `Nearest = ${nearest}`,
                    log: `Nearest smaller = ${nearest}`,
                    logColor: nearest === -1 ? 'var(--accent-red)' : 'var(--accent-green)'
                });

                // Push current index
                stack.push(i);
                gridStates[i] = 'winning';

                steps.push({
                    type: 'push',
                    gridStates: [...gridStates],
                    stackStates: [...stack],
                    i: i,
                    current: current,
                    nearest: nearest,
                    panel: `Pushed index <b>${i}</b> (value <b>${current}</b>) to stack<br>Stack = [${stack.map(idx => arr[idx]).join(', ')}]`,
                    statusText: `Pushed ${current}`,
                    log: `Pushed ${current}`,
                    logColor: 'var(--accent-purple)'
                });
            }

            // FINAL
            steps.push({
                type: 'final',
                gridStates: Array(n).fill('winning'),
                stackStates: [...stack],
                i: n,
                current: -1,
                nearest: -1,
                panel: `Algorithm complete!<br>Result = <b>[${result.join(', ')}]</b>`,
                complete: true,
                finalStr: `[${result.join(', ')}]`,
                statusText: `Done. Nearest smaller elements found.`,
                log: `Final result: [${result.join(', ')}]`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render array tiles
            const container = document.getElementById('array-container');
            container.style.gridTemplateColumns = `repeat(${arr.length}, auto)`;
            container.innerHTML = '';

            step.gridStates.forEach((state, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.innerText = arr[i];
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            // Render stack visualization
            const stackCont = document.getElementById('stack-container');
            stackCont.innerHTML = `<div class="stack-title">Monotonic Stack (indices)</div><div class="stack-wrapper" id="stack-inner"></div>`;
            const stackInner = document.getElementById('stack-inner');
            step.stackStates.forEach((stackIdx) => {
                const st = document.createElement('div');
                st.className = 'stack-tile';
                st.innerText = arr[stackIdx];
                stackInner.appendChild(st);
            });

            // Main panel
            document.getElementById('main-panel').innerHTML = step.panel;

            // Info panels
            document.getElementById('val-i').innerText = step.i !== undefined && step.i >= 0 ? step.i : '—';
            document.getElementById('val-val').innerText = step.current !== undefined && step.current >= 0 ? step.current : '—';
            document.getElementById('val-top').innerText = step.stackStates.length > 0 ? arr[step.stackStates[step.stackStates.length - 1]] : '—';
            document.getElementById('val-nearest').innerText = step.nearest !== undefined ? step.nearest : '—';

            // Result row
            const resContainer = document.getElementById('result-container');
            resContainer.style.gridTemplateColumns = `repeat(${arr.length}, auto)`;
            resContainer.innerHTML = '';
            if (step.finalStr) {
                const resArr = JSON.parse(step.finalStr.replace(/\[/, '[').replace(/\]/, ']'));
                resArr.forEach((val) => {
                    const resTile = document.createElement('div');
                    resTile.className = 'tile winning';
                    resTile.innerText = val;
                    resContainer.appendChild(resTile);
                });
            }

            // Status and result pop
            document.getElementById('status-text').innerText = step.statusText;
            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            resVal.className = step.complete ? 'pop' : '';

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
