<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Search vs Binary Search - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .array-input { width: 340px; }
        .target-input { width: 100px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUAL CONTAINER */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .array-wrapper {
            display: grid;
            gap: 6px;
            padding: 10px;
            background: var(--bg-surface);
            border: 2px solid var(--border-main);
            border-radius: 8px;
        }
        
        .tile-unit { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 2px; 
            position: relative; 
        }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 18px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .tile-index { font-size: 10px; color: var(--text-dim); font-family: monospace; margin-top: 2px; }
        
        /* STATES */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.12); box-shadow: 0 0 16px rgba(227, 179, 65, 0.6); }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 18px var(--accent-green); }
        .tile.eliminated { opacity: 0.25; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }
        .tile.current { animation: pulse 800ms infinite; border-color: var(--accent-purple); box-shadow: 0 0 20px var(--accent-purple); }

        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

        /* INFO PANELS */
        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 16px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; color: var(--accent-purple); }

        /* RESULT */
        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 22px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 28px !important; text-shadow: 0 0 18px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(0.9)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 700px; }

        /* CONTROLS */
        .controls { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 110px; cursor: pointer; }

        /* LEGEND */
        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        /* LOG */
        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 720px; max-width: 92%; height: 138px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr =</label>
        <input type="text" id="array-input" class="array-input" placeholder="[1,3,5,7,9,11]">
        <label class="ui-label">target =</label>
        <input type="text" id="target-input" class="target-input" placeholder="7">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([3,7,2,9,5], 9)">Ex 1</button>
        <button onclick="loadExample([1,4,6,8], 3)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Sorted Array (for Binary Search):</div>
        <div class="array-wrapper" id="array-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">left</span>
            <span class="info-value" id="val-left" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">right</span>
            <span class="info-value" id="val-right" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">mid</span>
            <span class="info-value" id="val-mid" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">comparison</span>
            <span class="info-value" id="val-comp" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Binary Search Index =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left:12px; display:flex; align-items:center; gap:6px;">
            <span class="ui-label" style="font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#0d2244; border:2px solid var(--accent-blue)"></span> Search space</div>
        <div class="legend-item"><span class="dot" style="background:#2a1600; border:2px solid var(--accent-orange)"></span> Mid candidate</div>
        <div class="legend-item"><span class="dot" style="background:#0f2a1a; border:2px solid var(--accent-green)"></span> Target found</div>
        <div class="legend-item"><span class="dot" style="background:#161b22; border:2px solid var(--border-main)"></span> Eliminated</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [3,7,2,9,5];
        let target = 9;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() {
            loadExample([3,7,2,9,5], 9);
        }

        function parseArray(str) {
            try { return JSON.parse(str); } catch(e) { return [3,7,2,9,5]; }
        }

        function loadExample(newArr, newTarget) {
            arr = newArr.map(v => v).sort((a,b)=>a-b); // ensure sorted for binary
            target = newTarget;
            document.getElementById('array-input').value = JSON.stringify(newArr);
            document.getElementById('target-input').value = target;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const arrStr = document.getElementById('array-input').value;
            const parsedArr = parseArray(arrStr);
            const parsedTarget = parseInt(document.getElementById('target-input').value);
            if (parsedArr && parsedArr.length > 0 && !isNaN(parsedTarget)) {
                loadExample(parsedArr, parsedTarget);
            } else {
                alert("Enter valid array and target");
            }
        }

        function generateSteps() {
            steps = [];
            const n = arr.length;

            // INIT
            steps.push({
                type: 'init',
                gridStates: Array(n).fill('search-space'),
                left: 0,
                right: n - 1,
                mid: -1,
                panel: `Binary Search on sorted array <b>[${arr.join(', ')}]</b><br>Target = <b>${target}</b><br>left=0, right=${n-1}`,
                statusText: `Binary search begins`,
                log: `Sorted array ready for binary search`,
                logColor: 'var(--text-dim)'
            });

            let left = 0;
            let right = n - 1;
            let foundIndex = -1;

            while (left <= right) {
                const mid = Math.floor((left + right) / 2);

                let gridStates = Array(n).fill('search-space');
                for (let i = left; i <= right; i++) gridStates[i] = 'search-space';
                gridStates[mid] = 'candidate';

                steps.push({
                    type: 'binary-search',
                    gridStates: [...gridStates],
                    left: left,
                    right: right,
                    mid: mid,
                    panel: `mid = <b>${mid}</b> (value <b>${arr[mid]}</b>)<br>Compare with target <b>${target}</b>`,
                    statusText: `mid = ${mid}`,
                    log: `mid = ${mid}, arr[mid] = ${arr[mid]}`,
                    logColor: 'var(--accent-blue)'
                });

                if (arr[mid] === target) {
                    gridStates[mid] = 'winning';
                    foundIndex = mid;
                    steps.push({
                        type: 'winning',
                        gridStates: [...gridStates],
                        left: left,
                        right: right,
                        mid: mid,
                        panel: `<span style="color:var(--accent-green)">Found target at index <b>${mid}</b></span>`,
                        statusText: `Found at ${mid}`,
                        log: `Target found at index ${mid}`,
                        logColor: 'var(--accent-green)'
                    });
                    break;
                } else if (arr[mid] < target) {
                    gridStates[mid] = 'eliminated';
                    steps.push({
                        type: 'not-feasible',
                        gridStates: [...gridStates],
                        left: left,
                        right: right,
                        mid: mid,
                        panel: `<span style="color:var(--accent-red)">Target > mid → search right half</span><br>left = <b>${mid + 1}</b>`,
                        statusText: `Target > mid → left = ${mid + 1}`,
                        log: `→ left = ${mid + 1}`,
                        logColor: 'var(--accent-red)'
                    });
                    left = mid + 1;
                } else {
                    gridStates[mid] = 'eliminated';
                    steps.push({
                        type: 'not-feasible',
                        gridStates: [...gridStates],
                        left: left,
                        right: right,
                        mid: mid,
                        panel: `<span style="color:var(--accent-red)">Target < mid → search left half</span><br>right = <b>${mid - 1}</b>`,
                        statusText: `Target < mid → right = ${mid - 1}`,
                        log: `→ right = ${mid - 1}`,
                        logColor: 'var(--accent-red)'
                    });
                    right = mid - 1;
                }
            }

            if (foundIndex === -1) {
                steps.push({
                    type: 'final',
                    gridStates: Array(n).fill('eliminated'),
                    left: left,
                    right: right,
                    mid: -1,
                    panel: `<span style="color:var(--accent-red)">Target not found</span>`,
                    complete: true,
                    finalStr: `-1`,
                    statusText: `Target not found`,
                    log: `Binary search ended: -1`,
                    logColor: 'var(--accent-red)',
                    bold: true
                });
            } else {
                steps.push({
                    type: 'final',
                    gridStates: Array(n).fill('winning'),
                    left: foundIndex,
                    right: foundIndex,
                    mid: foundIndex,
                    panel: `<span style="color:var(--accent-green)">Binary search complete. Index = <b>${foundIndex}</b></span>`,
                    complete: true,
                    finalStr: foundIndex.toString(),
                    statusText: `Found at index ${foundIndex}`,
                    log: `Binary search complete`,
                    logColor: 'var(--accent-green)',
                    bold: true
                });
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('array-container');
            container.style.gridTemplateColumns = `repeat(${arr.length}, auto)`;
            container.innerHTML = '';

            step.gridStates.forEach((state, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                tile.innerText = arr[i];
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);
                container.appendChild(wrapper);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-left').innerText = step.left !== undefined ? step.left : '—';
            document.getElementById('val-right').innerText = step.right !== undefined ? step.right : '—';
            document.getElementById('val-mid').innerText = step.mid !== undefined && step.mid >= 0 ? step.mid : '—';
            document.getElementById('val-comp').innerText = step.mid !== undefined && step.mid >= 0 ? (arr[step.mid] === target ? '==' : arr[step.mid] < target ? '<' : '>') : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            resVal.className = step.complete ? 'pop' : '';

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
