<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Array of Strings by Length - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arr-input { width: 380px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: ARRAY TILES */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 80px; position: relative;}
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 60px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 14px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main); padding: 0 12px; white-space: pre;
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        /* Highlight States */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.05); box-shadow: 0 0 8px var(--accent-green); z-index: 3;}
        .tile.eliminated { opacity: 0.4; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* Pointers */
        .ptr-container { display: flex; flex-direction: column; align-items: center; position: absolute; bottom: -50px; gap: 2px; font-size: 11px; font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .ptr-j { color: var(--accent-orange); }
        .ptr-arrow { font-size: 16px; line-height: 10px; margin-bottom: 2px; color: var(--text-dim); }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 90px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); text-align: center;}
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr (strings) =</label>
        <input type="text" id="arr-input" class="arr-input" placeholder="apple, kiwi, banana">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(['apple', 'kiwi', 'banana'])">Ex 1</button>
        <button onclick="loadExample(['cat', 'elephant', 'dog', 'ant'])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Array:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Pass (i)</span>
            <span class="info-value" id="val-pass" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Index j</span>
            <span class="info-value" id="val-j" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">arr[j].length</span>
            <span class="info-value" id="val-len1" style="color: var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">arr[j+1].length</span>
            <span class="info-value" id="val-len2" style="color: var(--text-main);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">status</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-blue)"></span> Unsorted Region</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Comparing Adjacent Elements</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Locked in Sorted Position</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = ['apple', 'kiwi', 'banana'];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample(['apple', 'kiwi', 'banana']); }

        function loadExample(newArr) {
            arr = [...newArr];
            document.getElementById('arr-input').value = arr.join(', ');
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valStr = document.getElementById('arr-input').value;
            // Split by comma and trim. Don't filter out empty strings because they are valid edge cases.
            const parsedArr = valStr.split(',').map(x => x.trim());
            
            if (parsedArr.length > 0 && valStr.trim() !== '') {
                loadExample(parsedArr.slice(0, 15)); // limit size for display
            } else {
                alert("Please enter a valid list of strings separated by commas.");
            }
        }

        function generateSteps() {
            steps = [];
            const n = arr.length;
            if (n === 0) return;

            let curArr = [...arr];

            const getArrStates = (currJ, sortedStart) => {
                return curArr.map((_, idx) => {
                    if (idx >= sortedStart) return 'winning';
                    if (idx === currJ || idx === currJ + 1) return 'candidate';
                    return 'search-space';
                });
            };

            // STEP 0: INIT
            steps.push({
                type: 'init', arr: [...curArr], pass: 0, j: '—', len1: '—', len2: '—',
                states: getArrStates(-1, n),
                panel: `<b>Sort Strings by Length (Bubble Sort)</b><br>We will compare adjacent strings and swap them if the left string is strictly longer than the right string.`,
                statusText: `array=[${curArr.map(s => `"${s}"`).join(', ')}]. Click Play to begin.`,
                log: `n=${n}. Starting Bubble Sort by length.\nInitial Array: [${curArr.map(s => `"${s}"`).join(', ')}]`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < n - 1; i++) {
                let swapped = false;
                for (let j = 0; j < n - i - 1; j++) {
                    let len1 = curArr[j].length;
                    let len2 = curArr[j+1].length;

                    // EVALUATE
                    steps.push({
                        type: 'eval', arr: [...curArr], pass: i + 1, j: j, len1: len1, len2: len2,
                        states: getArrStates(j, n - i),
                        panel: `Compare lengths of adjacent strings:<br><code>"${curArr[j]}"</code> (length <b>${len1}</b>) and <code>"${curArr[j+1]}"</code> (length <b>${len2}</b>).`,
                        statusText: `Comparing elements at index ${j} and ${j+1}...`,
                        log: `\nPass ${i+1}, index ${j}: Compare "${curArr[j]}" (len ${len1}) and "${curArr[j+1]}" (len ${len2}).`,
                        logColor: 'var(--text-main)'
                    });

                    if (len1 > len2) {
                        // Swap
                        let temp = curArr[j];
                        curArr[j] = curArr[j+1];
                        curArr[j+1] = temp;
                        swapped = true;

                        steps.push({
                            type: 'swap', arr: [...curArr], pass: i + 1, j: j, len1: len1, len2: len2,
                            states: getArrStates(j, n - i),
                            panel: `<span style="color:var(--accent-orange)"><code>${len1} > ${len2}</code></span>.<br>Left string is longer! Swap <code>"${curArr[j+1]}"</code> and <code>"${curArr[j]}"</code>.`,
                            statusText: `Swapped elements at ${j} and ${j+1}.`,
                            log: `  ${len1} > ${len2}. Swap them.`,
                            logColor: 'var(--accent-orange)'
                        });
                    } else {
                        steps.push({
                            type: 'no-swap', arr: [...curArr], pass: i + 1, j: j, len1: len1, len2: len2,
                            states: getArrStates(j, n - i),
                            panel: `<span style="color:var(--accent-green)"><code>${len1} <= ${len2}</code></span>.<br>They are in the correct relative order. No swap needed.`,
                            statusText: `No swap needed.`,
                            log: `  ${len1} <= ${len2}. No swap.`,
                            logColor: 'var(--accent-green)'
                        });
                    }
                }
                
                steps.push({
                    type: 'pass-done', arr: [...curArr], pass: i + 1, j: '—', len1: '—', len2: '—',
                    states: getArrStates(-1, n - i - 1),
                    panel: `Pass ${i+1} complete.<br>The longest string in the unsorted portion (<code>"${curArr[n-i-1]}"</code>) has bubbled to its final sorted position.`,
                    statusText: `Pass ${i+1} completed. Locked 1 element at the end.`,
                    log: `Pass ${i+1} complete. "${curArr[n-i-1]}" locked in place.`,
                    logColor: 'var(--accent-blue)'
                });

                if (!swapped) {
                    steps.push({
                        type: 'early-exit', arr: [...curArr], pass: i + 1, j: '—', len1: '—', len2: '—',
                        states: getArrStates(-1, 0),
                        panel: `<span style="color:var(--accent-green)">No swaps occurred during Pass ${i+1}.</span><br>This means the array is already fully sorted! Early termination.`,
                        statusText: `Array sorted early! Terminating loop.`,
                        log: `No swaps in Pass ${i+1}. Array is fully sorted. ✓`,
                        logColor: 'var(--accent-green)'
                    });
                    break;
                }
            }

            // FINAL STEP
            steps.push({
                type: 'final', arr: [...curArr], pass: '—', j: '—', len1: '—', len2: '—',
                states: getArrStates(-1, 0),
                panel: `<span style="color:var(--accent-green)">Sort Complete!</span><br>All strings are now ordered by their length in ascending order.`,
                complete: true,
                finalStr: 'Sorted',
                statusText: `Done.`,
                log: `\nFinal Result: [${curArr.map(s => `"${s}"`).join(', ')}]`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            
            step.states.forEach((state, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                // Render string and its length
                tile.innerHTML = `<div>"${step.arr[i]}"</div><div style="font-size:10px; color:var(--text-dim); margin-top:2px;">len: ${step.arr[i].length}</div>`;
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);

                // Add Pointers
                if (!step.complete && (step.j === i || step.j === i - 1)) {
                    const ptrContainer = document.createElement('div');
                    ptrContainer.className = 'ptr-container';
                    ptrContainer.innerHTML = `<div class="ptr-arrow">↑</div><div class="ptr-j">${step.j === i ? 'j' : 'j+1'}</div>`;
                    wrapper.appendChild(ptrContainer);
                }

                container.appendChild(wrapper);
            });

            if (!step.complete) {
                container.style.marginBottom = "45px";
            } else {
                container.style.marginBottom = "0px";
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-pass').innerText = step.pass;
            document.getElementById('val-j').innerText = step.j;
            document.getElementById('val-len1').innerText = step.len1;
            document.getElementById('val-len2').innerText = step.len2;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : 'In Progress';
            
            if (step.complete) {
                resVal.className = 'pop';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
