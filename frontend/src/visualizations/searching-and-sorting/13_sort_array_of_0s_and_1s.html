<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Array of 0s and 1s - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .arr-input { width: 320px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: ARRAY TILES */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .tiles-wrapper { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; min-height: 80px; position: relative;}
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 16px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        /* Highlight States */
        .tile.search-space { background: #0d2244; border-color: var(--accent-blue); }
        .tile.candidate { background: #2a1600; border-color: var(--accent-orange); color: var(--accent-orange); transform: scale(1.15); box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); z-index: 2; }
        .tile.temp-match { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); border-style: dashed; z-index: 2;}
        .tile.winning { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); transform: scale(1.15); box-shadow: 0 0 12px var(--accent-green); z-index: 3;}
        .tile.eliminated { opacity: 0.3; background: #161b22; border-color: var(--border-main); color: var(--text-dim); }

        /* Pointers */
        .ptr-container { display: flex; flex-direction: column; align-items: center; position: absolute; bottom: -50px; gap: 2px; font-size: 11px; font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .ptr-low { color: var(--accent-purple); }
        .ptr-high { color: var(--accent-blue); }
        .ptr-arrow { font-size: 16px; line-height: 10px; margin-bottom: 2px; color: var(--text-dim); }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 90px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); text-align: center;}
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">arr (0s and 1s) =</label>
        <input type="text" id="arr-input" class="arr-input" placeholder="1, 0, 1, 0, 1">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([1, 0, 1, 0, 1])">Ex 1</button>
        <button onclick="loadExample([0, 1, 0])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Array:</div>
        <div class="tiles-wrapper" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">left</span>
            <span class="info-value" id="val-low" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">right</span>
            <span class="info-value" id="val-high" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">arr[left]</span>
            <span class="info-value" id="val-arrlow" style="color: var(--text-main);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">arr[right]</span>
            <span class="info-value" id="val-arrhigh" style="color: var(--text-main);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">status</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px dashed var(--accent-green)"></span> Processed 0s (Left)</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-blue)"></span> Unprocessed Region</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--accent-orange)"></span> Current left/right</div>
        <div class="legend-item"><span class="dot" style="background:var(--bg-surface); border:1px solid var(--border-main); opacity:0.3"></span> Processed 1s (Right)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:1px solid var(--accent-green)"></span> Fully Sorted</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let arr = [1, 0, 1, 0, 1];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([1, 0, 1, 0, 1]); }

        function loadExample(newArr) {
            arr = [...newArr];
            document.getElementById('arr-input').value = arr.join(', ');
            generateSteps();
            reset();
        }

        function loadCustom() {
            const valStr = document.getElementById('arr-input').value;
            const parsedArr = valStr.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x) && [0,1].includes(x));
            
            if (parsedArr.length > 0) {
                loadExample(parsedArr.slice(0, 20)); // limit size for display
            } else {
                alert("Please enter a valid array containing ONLY 0s and 1s.");
            }
        }

        function generateSteps() {
            steps = [];
            const n = arr.length;
            if (n === 0) return;

            let left = 0;
            let right = n - 1;
            let curArr = [...arr];

            const getArrStates = (c_left, c_right, isFinal = false) => {
                return curArr.map((_, i) => {
                    if (isFinal) return 'winning';
                    if (i === c_left || i === c_right) return 'candidate'; 
                    
                    if (i < left) return 'temp-match'; // Placed 0s
                    if (i > right) return 'eliminated'; // Placed 1s
                    return 'search-space'; // Unprocessed
                });
            };

            // STEP 0: INIT
            steps.push({
                type: 'init', arr: [...curArr], left, right, valLeft: '—', valRight: '—',
                arrStates: getArrStates(-1, -1),
                panel: `<b>Two-Pointer In-Place Swap</b><br>Sort array of 0s and 1s efficiently in a single pass.<br>Initialize <code>left = 0</code>, <code>right = ${right}</code>.`,
                statusText: `array=[${curArr.join(', ')}]. Click Play to begin.`,
                log: `n=${n}. Starting Two-Pointer Sort.\nInitialize left=${left}, right=${right}.`,
                logColor: 'var(--text-dim)'
            });

            while (left <= right) {
                let valLeft = curArr[left];
                let valRight = curArr[right];

                // EVALUATE
                steps.push({
                    type: 'eval', arr: [...curArr], left, right, valLeft: valLeft, valRight: valRight,
                    arrStates: getArrStates(left, right),
                    panel: `Check elements at boundaries.<br><code>arr[left] == ${valLeft}</code>, <code>arr[right] == ${valRight}</code>.`,
                    statusText: `Evaluating arr[left] and arr[right]...`,
                    log: `\nEvaluate left=${left} (val ${valLeft}), right=${right} (val ${valRight}).`,
                    logColor: 'var(--text-main)'
                });

                if (valLeft === 1 && valRight === 0) {
                    let oldLeft = left;
                    let oldRight = right;
                    
                    // Swap
                    [curArr[left], curArr[right]] = [curArr[right], curArr[left]];
                    left++;
                    right--;

                    steps.push({
                        type: 'swap', arr: [...curArr], left, right, valLeft: '—', valRight: '—',
                        arrStates: getArrStates(oldLeft, oldRight), // keep highlighting the swapped indices
                        panel: `<code>arr[left] == 1</code> and <code>arr[right] == 0</code>.<br>Swap them to move 0 to the left and 1 to the right.<br>Increment <code>left</code> to <b>${left}</b> and decrement <code>right</code> to <b>${right}</b>.`,
                        statusText: `Swapped 1 and 0. Moving pointers inward.`,
                        log: `  Found 1 on left and 0 on right. Swap arr[${oldLeft}] and arr[${oldRight}].\n  Update left=${left}, right=${right}.`,
                        logColor: 'var(--accent-orange)'
                    });
                } else if (valLeft === 0) {
                    let oldLeft = left;
                    left++;
                    
                    steps.push({
                        type: 'skip-left', arr: [...curArr], left, right, valLeft: '—', valRight: '—',
                        arrStates: getArrStates(oldLeft, -1),
                        panel: `<code>arr[left] == 0</code>.<br>Element is in the correct position (left side).<br>Increment <code>left</code> to <b>${left}</b>.`,
                        statusText: `0 is correctly placed on the left. Incrementing left pointer.`,
                        log: `  arr[${oldLeft}] is 0. Correctly placed. left++.`,
                        logColor: 'var(--text-main)'
                    });
                } else if (valRight === 1) {
                    let oldRight = right;
                    right--;
                    
                    steps.push({
                        type: 'skip-right', arr: [...curArr], left, right, valLeft: '—', valRight: '—',
                        arrStates: getArrStates(-1, oldRight),
                        panel: `<code>arr[right] == 1</code>.<br>Element is in the correct position (right side).<br>Decrement <code>right</code> to <b>${right}</b>.`,
                        statusText: `1 is correctly placed on the right. Decrementing right pointer.`,
                        log: `  arr[${oldRight}] is 1. Correctly placed. right--.`,
                        logColor: 'var(--text-main)'
                    });
                }
            }

            // FINAL STEP
            steps.push({
                type: 'final', arr: [...curArr], left, right, valLeft: '—', valRight: '—',
                arrStates: getArrStates(-1, -1, true),
                panel: `<span style="color:var(--accent-green)"><code>left > right</code> (${left} > ${right}). Pointers crossed.</span><br>The array of 0s and 1s is now fully sorted!`,
                complete: true,
                finalStr: 'Sorted',
                statusText: `Sort complete.`,
                log: `\nLoop terminates (left > right). Sort complete in O(n) time. ✓`,
                logColor: 'var(--accent-green)', bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            
            step.arrStates.forEach((state, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${state}`;
                // Render from the step's specific array state
                tile.innerText = step.arr[i];
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                
                wrapper.append(tile, idxLabel);

                // Add Pointers
                const ptrs = [];
                if (!step.complete) {
                    if (step.left === i && step.left <= arr.length) ptrs.push('<div class="ptr-low">L</div>');
                    // In cases where left and right point to the same index, render them stacked
                    if (step.right === i && step.right >= -1 && step.right !== step.left) ptrs.push('<div class="ptr-high">R</div>');
                    else if (step.right === i) ptrs.push('<div class="ptr-high">R</div>'); 
                }

                if (ptrs.length > 0) {
                    const ptrContainer = document.createElement('div');
                    ptrContainer.className = 'ptr-container';
                    ptrContainer.innerHTML = '<div class="ptr-arrow">↑</div>' + ptrs.join('');
                    wrapper.appendChild(ptrContainer);
                }

                container.appendChild(wrapper);
            });

            if (!step.complete) {
                container.style.marginBottom = "45px";
            } else {
                container.style.marginBottom = "0px";
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-low').innerText = step.left;
            document.getElementById('val-high').innerText = step.right;
            document.getElementById('val-arrlow').innerText = step.valLeft;
            document.getElementById('val-arrhigh').innerText = step.valRight;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : 'In Progress';
            
            if (step.complete) {
                resVal.className = 'pop';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
