<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Occurrences of Many Patterns - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main); color: var(--text-main);
            height: 32px; border-radius: 6px; padding: 0 10px; font-size: 13px; width: 240px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 6px; justify-content: center; padding: 20px 0; flex-wrap: wrap; max-width: 920px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 17px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.18); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); opacity: 0.75; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 780px; text-align: center; font-family: monospace; min-height: 120px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 150px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 760px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 780px; max-width: 90%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }

        .patterns-list { margin-top: 10px; background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px; padding: 10px; width: 780px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Text =</label>
        <input type="text" id="text-input" placeholder="ababa" style="width:260px">
        <label class="ui-label">Patterns (comma-separated) =</label>
        <input type="text" id="patterns-input" placeholder="aba,b" style="width:240px">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 (ababa)</button>
        <button onclick="loadExample(2)">Ex 2 (hello)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Naive Multiple Linear Scans — Count Occurrences of Each Pattern</div>
        
        <div class="string-display" id="strings-display"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Pattern</span>
            <span class="info-value" id="val-pattern" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Window (i)</span>
            <span class="info-value" id="val-window" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Match Count So Far</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">0</span>
        </div>
    </div>

    <div class="patterns-list" id="patterns-list">Patterns &amp; Counts: —</div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Final Counts =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left:20px">
            <span class="ui-label" style="margin-right:6px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Pattern / Window</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Match</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> No Match</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentText = "ababa";
        let currentPatterns = ["aba", "b"];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentText = "ababa";
                currentPatterns = ["aba", "b"];
            } else {
                currentText = "hello";
                currentPatterns = ["he", "ll", "x"];
            }
            document.getElementById('text-input').value = currentText;
            document.getElementById('patterns-input').value = currentPatterns.join(",");
            generateSteps();
            reset();
        }

        function loadCustom() {
            const tVal = document.getElementById('text-input').value.trim();
            const pVal = document.getElementById('patterns-input').value.trim();
            if (tVal && pVal) {
                currentText = tVal;
                currentPatterns = pVal.split(",").map(p => p.trim()).filter(p => p);
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            const n = currentText.length;
            let allCounts = new Array(currentPatterns.length).fill(0);

            steps.push({
                type: 'init',
                patternIdx: -1,
                windowStart: -1,
                match: false,
                counts: [...allCounts],
                panel: `Text: <b>"${currentText}"</b><br>Patterns: <b>${JSON.stringify(currentPatterns)}</b><br>Multiple linear scans approach`,
                statusText: `Starting scans for ${currentPatterns.length} patterns`,
                log: `Text length = ${n}\nPatterns: ${currentPatterns.join(', ')}`
            });

            for (let pIdx = 0; pIdx < currentPatterns.length; pIdx++) {
                const pattern = currentPatterns[pIdx];
                const m = pattern.length;
                let count = 0;

                steps.push({
                    type: 'new_pattern',
                    patternIdx: pIdx,
                    windowStart: -1,
                    match: false,
                    counts: [...allCounts],
                    panel: `Processing pattern <b>"${pattern}"</b> (length ${m})`,
                    statusText: `Pattern "${pattern}"`,
                    log: `\n=== Pattern ${pIdx+1}: "${pattern}" ===`
                });

                if (m === 0 || m > n) {
                    steps.push({
                        type: 'pattern_done',
                        patternIdx: pIdx,
                        windowStart: -1,
                        match: false,
                        counts: [...allCounts],
                        panel: `Pattern "${pattern}" → count = 0 (invalid length)`,
                        statusText: `Count = 0`,
                        log: `  Count = 0`
                    });
                    continue;
                }

                for (let i = 0; i <= n - m; i++) {
                    let isMatch = true;
                    for (let j = 0; j < m; j++) {
                        if (currentText[i + j] !== pattern[j]) {
                            isMatch = false;
                            break;
                        }
                    }

                    steps.push({
                        type: 'window_check',
                        patternIdx: pIdx,
                        windowStart: i,
                        match: isMatch,
                        counts: [...allCounts],
                        panel: `Window [${i}:${i+m}] = "<b>${currentText.substring(i, i+m)}</b>" ${isMatch ? '== matches' : '!= no match'} pattern "${pattern}"`,
                        statusText: `i=${i} → ${isMatch ? 'MATCH' : 'no'}`,
                        log: `  i=${i}: "${currentText.substring(i, i+m)}" ${isMatch ? 'MATCH' : 'no'}`
                    });

                    if (isMatch) {
                        count++;
                        allCounts[pIdx] = count;
                    }
                }

                steps.push({
                    type: 'pattern_done',
                    patternIdx: pIdx,
                    windowStart: -1,
                    match: false,
                    counts: [...allCounts],
                    panel: `Finished pattern "${pattern}" → count = <b>${count}</b>`,
                    statusText: `Count for "${pattern}" = ${count}`,
                    log: `  Final count for "${pattern}" = ${count}`
                });
            }

            steps.push({
                type: 'final',
                patternIdx: -1,
                windowStart: -1,
                match: false,
                counts: [...allCounts],
                panel: `All patterns processed.<br>Final counts: <b>${JSON.stringify(allCounts)}</b>`,
                statusText: `Done → ${JSON.stringify(allCounts)}`,
                log: `\nFinal result: ${JSON.stringify(allCounts)}`,
                complete: true,
                finalResult: JSON.stringify(allCounts)
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render text tiles
            const container = document.getElementById('strings-display');
            container.innerHTML = '';
            for (let k = 0; k < currentText.length; k++) {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const idxTile = document.createElement('div');
                idxTile.className = 'tile';
                idxTile.style.fontSize = '11px';
                idxTile.style.height = '22px';
                idxTile.style.opacity = '0.6';
                idxTile.innerText = k;
                const chTile = document.createElement('div');
                chTile.className = 'tile';
                chTile.innerText = currentText[k];
                if (step.windowStart !== undefined && step.windowStart > -1) {
                    const pLen = currentPatterns[step.patternIdx] ? currentPatterns[step.patternIdx].length : 0;
                    if (k >= step.windowStart && k < step.windowStart + pLen) {
                        if (step.match) chTile.classList.add('valid-pal');
                        else chTile.classList.add('mismatch');
                    }
                }
                if (step.type === 'final') chTile.classList.add('valid-pal');
                unit.append(idxTile, chTile);
                container.appendChild(unit);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-pattern').innerText = step.patternIdx >= 0 ? `"${currentPatterns[step.patternIdx]}"` : '—';
            document.getElementById('val-window').innerText = step.windowStart >= 0 ? `[${step.windowStart}:${step.windowStart + (currentPatterns[step.patternIdx] ? currentPatterns[step.patternIdx].length : 0)}]` : '—';
            document.getElementById('val-count').innerText = step.counts ? step.counts[step.patternIdx] || 0 : 0;

            // Patterns list
            let listHTML = 'Patterns &amp; Counts: ';
            for (let p = 0; p < currentPatterns.length; p++) {
                listHTML += `<span style="margin-right:16px">"${currentPatterns[p]}": <b>${step.counts[p]}</b></span>`;
            }
            document.getElementById('patterns-list').innerHTML = listHTML;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
