<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Matching With One Wildcard '*' - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 220px; font-size: 14px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 860px; }
        .string-display {
            display: flex; gap: 6px; justify-content: center; padding: 20px;
            background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .tile {
            width: 48px; height: 58px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 6px;
            font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile .index { font-size: 9px; color: var(--text-dim); margin-top: 3px; }
        .tile.current { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.1); }
        .tile.match { border-color: var(--accent-green); background: #0f2a1a; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; min-height: 92px; font-family: monospace;
            font-size: 14.5px; line-height: 1.55; text-align: center;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 17px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 18px; font-size: 26px; font-family: monospace; color: var(--accent-green); }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 12.5px; color: var(--text-dim); }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">string =</label>
        <input type="text" id="str-input" value="hello">
        <label class="ui-label">pattern =</label>
        <input type="text" id="pat-input" value="he*lo">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (hello, he*lo)</button>
        <button onclick="loadExample(1)">Ex 2 (abc, a*c)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Pattern Matching with One Wildcard '*' (Split + Prefix/Suffix Check)</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Prefix</span>
            <span class="info-value" id="val-prefix" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Suffix</span>
            <span class="info-value" id="val-suffix" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Match Found</span>
            <span class="info-value" id="val-match" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Prefix Match</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-orange);border-radius:4px"></span> Suffix Match</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Full Match</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentString = "hello";
        let currentPattern = "he*lo";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1100, 550, 260];

        function loadExample(ex) {
            if (ex === 0) {
                currentString = "hello";
                currentPattern = "he*lo";
            } else {
                currentString = "abc";
                currentPattern = "a*c";
            }
            document.getElementById('str-input').value = currentString;
            document.getElementById('pat-input').value = currentPattern;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentString = document.getElementById('str-input').value.trim() || currentString;
            currentPattern = document.getElementById('pat-input').value.trim() || currentPattern;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let matchFound = false;
            let prefix = "";
            let suffix = "";

            steps.push({
                type: 'init',
                panel: `String: <b>"${currentString}"</b><br>Pattern: <b>"${currentPattern}"</b>`,
                statusText: 'Splitting pattern at wildcard...',
                log: 'Initialize matching',
                prefix: '',
                suffix: '',
                matchPos: -1
            });

            // Split pattern
            const starIdx = currentPattern.indexOf('*');
            if (starIdx === -1) {
                prefix = currentPattern;
                suffix = '';
            } else {
                prefix = currentPattern.substring(0, starIdx);
                suffix = currentPattern.substring(starIdx + 1);
            }

            steps.push({
                type: 'split',
                panel: `Split: Prefix = <b>"${prefix}"</b>, Suffix = <b>"${suffix}"</b>`,
                statusText: 'Pattern split complete',
                log: `Prefix="${prefix}", Suffix="${suffix}"`,
                prefix: prefix,
                suffix: suffix,
                matchPos: -1
            });

            const n = currentString.length;
            const preLen = prefix.length;
            const sufLen = suffix.length;

            if (n < preLen + sufLen) {
                steps.push({
                    type: 'final',
                    panel: `❌ Length too short for match`,
                    statusText: 'No match possible',
                    log: 'Length check failed',
                    prefix: prefix,
                    suffix: suffix,
                    matchPos: -1
                });
                return;
            }

            // Check prefix match from start
            let prefixMatches = true;
            for (let i = 0; i < preLen; i++) {
                if (currentString[i] !== prefix[i]) {
                    prefixMatches = false;
                    break;
                }
            }

            if (!prefixMatches) {
                steps.push({
                    type: 'final',
                    panel: `❌ Prefix does not match`,
                    statusText: 'Prefix mismatch',
                    log: 'Prefix check failed',
                    prefix: prefix,
                    suffix: suffix,
                    matchPos: -1
                });
                return;
            }

            steps.push({
                type: 'prefix',
                panel: `✅ Prefix <b>"${prefix}"</b> matches at start`,
                statusText: 'Prefix verified',
                log: `Prefix "${prefix}" matched`,
                prefix: prefix,
                suffix: suffix,
                matchPos: -1
            });

            // Check possible suffix positions
            const minStart = preLen;
            const maxStart = n - sufLen;

            for (let start = minStart; start <= maxStart; start++) {
                let suffixMatches = true;
                for (let j = 0; j < sufLen; j++) {
                    if (currentString[start + j] !== suffix[j]) {
                        suffixMatches = false;
                        break;
                    }
                }

                if (suffixMatches) {
                    matchFound = true;
                    steps.push({
                        type: 'suffix',
                        panel: `✅ Suffix <b>"${suffix}"</b> matches at position ${start}`,
                        statusText: `Suffix match at ${start}`,
                        log: `Found suffix match at ${start}`,
                        prefix: prefix,
                        suffix: suffix,
                        matchPos: start
                    });
                    break;
                }
            }

            if (matchFound) {
                steps.push({
                    type: 'final',
                    panel: `✅ Pattern matches the string`,
                    statusText: 'Full match found',
                    log: `Final result: True`,
                    prefix: prefix,
                    suffix: suffix,
                    matchPos: maxStart
                });
            } else {
                steps.push({
                    type: 'final',
                    panel: `❌ No suffix match found`,
                    statusText: 'No match',
                    log: `Final result: False`,
                    prefix: prefix,
                    suffix: suffix,
                    matchPos: -1
                });
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Tiles
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            for (let k = 0; k < currentString.length; k++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<span>${currentString[k]}</span><span class="index">${k}</span>`;
                if (step.matchPos !== -1 && step.matchPos !== undefined) {
                    if (k < step.prefix.length) tile.classList.add('match');
                    if (k >= step.matchPos) tile.classList.add('match');
                }
                container.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-prefix').innerText = step.prefix || '—';
            document.getElementById('val-suffix').innerText = step.suffix || '—';
            document.getElementById('val-match').innerText = step.matchPos !== undefined && step.matchPos !== -1 ? 'YES' : 'NO';

            document.getElementById('res-val').innerText = (step.matchPos !== undefined && step.matchPos !== -1) ? 'True' : 'False';

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const line = document.createElement('div');
                line.style.marginBottom = '4px';
                line.innerText = steps[k].log || '';
                logPanel.appendChild(line);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value | 0]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = () => { loadExample(0); };
    </script>
</body>
</html>
