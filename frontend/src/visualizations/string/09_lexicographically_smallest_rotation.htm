<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicographically Smallest Rotation - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 260px; font-size: 14px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 920px; }
        .string-display {
            display: flex; gap: 5px; justify-content: center; padding: 18px;
            background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border-main);
            flex-wrap: wrap; margin-bottom: 12px;
        }
        .tile {
            width: 46px; height: 58px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 6px;
            font-size: 19px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.25s ease; border: 2px solid var(--border-main);
            background: #21262d;
        }
        .tile .index { font-size: 9px; color: var(--text-dim); margin-top: 2px; }
        .tile.current { border-color: var(--accent-purple); background: #1e1030; transform: scale(1.08); }
        .tile.best { border-color: var(--accent-green); background: #0f2a1a; }

        .doubled-display {
            display: flex; gap: 4px; justify-content: center; padding: 14px;
            background: #1a1f29; border-radius: 8px; border: 1px dashed var(--accent-blue);
            flex-wrap: wrap; margin: 12px 0;
        }

        .action-panel {
            margin-top: 18px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; min-height: 92px; font-family: monospace;
            font-size: 14.5px; line-height: 1.6; text-align: center;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 20px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 18px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 22px; font-size: 28px; font-family: monospace; color: var(--accent-green); letter-spacing: 2px; }

        .controls { margin-top: 26px; display: flex; align-items: center; gap: 14px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 160px; }

        .legend { margin-top: 20px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: 13px; color: var(--text-dim); }
        .legend-item { display: flex; align-items: center; gap: 7px; }

        .log-panel {
            margin-top: 24px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 22px; width: 780px; height: 168px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13.2px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s = </label>
        <input type="text" id="str-input" value="cba">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("abcde")</button>
        <button onclick="loadExample(1)">Ex 2 ("cba")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" style="margin-bottom:8px">Brute Force → Duplicate & Scan (O(n²)) — Smallest Rotation</div>
        
        <div style="text-align:center; margin-bottom:8px; font-size:13px; color:var(--text-dim)" id="original-label">Original String</div>
        <div class="string-display" id="tiles-container"></div>

        <div style="text-align:center; margin:12px 0 6px; font-size:13px; color:var(--accent-blue)" id="doubled-label">Doubled String (s+s) for all rotations</div>
        <div class="doubled-display" id="doubled-container"></div>

        <div class="action-panel" id="main-panel">—</div>
    </div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Rotation i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Rotation</span>
            <span class="info-value" id="val-rot" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Best So Far</span>
            <span class="info-value" id="val-best" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text" style="margin-top:8px; font-size:13px; color:var(--text-dim); min-height:26px;"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-purple);border-radius:4px"></span> Current Rotation Start</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;background:var(--accent-green);border-radius:4px"></span> Best Rotation</div>
        <div class="legend-item"><span style="display:inline-block;width:16px;height:16px;border:2px solid var(--accent-blue);border-radius:4px"></span> Doubled String</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "cba";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1250, 620, 280];

        function loadExample(ex) {
            currentS = ex === 0 ? "abcde" : "cba";
            document.getElementById('str-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const input = document.getElementById('str-input').value.trim();
            if (input) currentS = input;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            const t = currentS + currentS; // doubled
            let bestStart = 0;
            let bestRot = currentS;

            // Init
            steps.push({
                type: 'init',
                i: -1,
                currentRot: currentS,
                bestStart: 0,
                panel: `String: <b>"${currentS}"</b> (n=${n})`,
                statusText: 'Building doubled string...',
                log: `Initialize: best = "${currentS}" at i=0`,
                doubled: t
            });

            for (let i = 0; i < n; i++) {
                const rotation = currentS.slice(i) + currentS.slice(0, i);
                let comparison = '';

                if (rotation < bestRot) {
                    comparison = `→ NEW BEST (smaller than "${bestRot}")`;
                    bestRot = rotation;
                    bestStart = i;
                } else if (rotation === bestRot) {
                    comparison = '→ equal to best';
                } else {
                    comparison = `→ larger than "${bestRot}"`;
                }

                steps.push({
                    type: 'compare',
                    i: i,
                    currentRot: rotation,
                    bestStart: bestStart,
                    panel: `i = ${i} → rotation = <b>"${rotation}"</b> ${comparison}`,
                    statusText: `Comparing rotation starting at ${i}`,
                    log: `i=${i} "${rotation}" vs best "${bestRot}"`,
                    doubled: t
                });
            }

            steps.push({
                type: 'final',
                i: bestStart,
                currentRot: bestRot,
                bestStart: bestStart,
                panel: `✅ Smallest rotation: <b>"${bestRot}"</b> (starts at index ${bestStart})`,
                statusText: 'Done',
                log: `\nFinal smallest: "${bestRot}"`,
                doubled: t
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Original tiles
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            for (let k = 0; k < currentS.length; k++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<span>${currentS[k]}</span><span class="index">${k}</span>`;
                if (step.i === k) tile.classList.add('current');
                if (step.bestStart === k) tile.classList.add('best');
                container.appendChild(tile);
            }

            // Doubled display
            const doubledCont = document.getElementById('doubled-container');
            doubledCont.innerHTML = '';
            for (let k = 0; k < step.doubled.length; k++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.style.fontSize = '15px';
                tile.style.width = '32px';
                tile.style.height = '42px';
                tile.innerHTML = `<span>${step.doubled[k]}</span>`;
                if (step.i !== undefined && k >= step.i && k < step.i + currentS.length) {
                    tile.style.borderColor = 'var(--accent-purple)';
                }
                doubledCont.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-rot').innerText = step.currentRot || '—';
            document.getElementById('val-best').innerText = steps[steps.length-1].currentRot || currentS;

            document.getElementById('res-val').innerText = steps[steps.length-1].currentRot || currentS;

            document.getElementById('status-text').innerText = step.statusText;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const entry = document.createElement('div');
                entry.style.marginBottom = '4px';
                entry.innerHTML = steps[k].log || '';
                logPanel.appendChild(entry);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = () => {
            loadExample(1); // default to second example "cba" → "acb"
        };
    </script>
</body>
</html>
