<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildcard Matching (?, *) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 260px; font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 880px; }
        .string-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
        .string-label { font-family: monospace; color: var(--text-dim); width: 40px; text-align: right; padding-top: 18px; font-size: 13px; }
        .tile {
            width: 46px; height: 56px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 6px;
            font-size: 19px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile .index { font-size: 9px; color: var(--text-dim); margin-top: 3px; }
        .tile.current { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.1); }
        .tile.match { background: #0f2a1a; border-color: var(--accent-green); }
        .tile.star { background: #2a1f0d; border-color: var(--accent-orange); }
        .tile.fail { background: #2a0d0d; border-color: var(--accent-red); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; min-height: 110px; font-family: monospace;
            font-size: 14.5px; line-height: 1.55; text-align: center;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 17px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 18px; font-size: 26px; font-family: monospace; color: var(--accent-green); }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); min-height: 24px; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 12.5px; color: var(--text-dim); }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; height: 165px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="s-input" value="adceb">
        <label class="ui-label">p =</label>
        <input type="text" id="p-input" value="*a*b">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Greedy Two-Pointer – Wildcard Matching (?, *)</div>
        <div id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">s_ptr</span>
            <span class="info-value" id="val-sptr" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">p_ptr</span>
            <span class="info-value" id="val-pptr" style="color:var(--accent-blue)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Star</span>
            <span class="info-value" id="val-star" style="color:var(--accent-orange)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> s_ptr</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-blue);border-radius:4px"></span> p_ptr</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-orange);border-radius:4px"></span> Star Position</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "adceb";
        let currentP = "*a*b";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1250, 650, 280];

        function loadExample(ex) {
            if (ex === 0) { currentS = "adceb"; currentP = "*a*b"; }
            else { currentS = "aa"; currentP = "a"; }
            document.getElementById('s-input').value = currentS;
            document.getElementById('p-input').value = currentP;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentS = document.getElementById('s-input').value.trim() || currentS;
            currentP = document.getElementById('p-input').value.trim() || currentP;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let s = currentS;
            let p = currentP;
            let n = s.length;
            let m = p.length;

            let s_ptr = 0, p_ptr = 0;
            let star_idx = -1, match_idx = -1;

            steps.push({
                type: 'init',
                s_ptr: 0, p_ptr: 0, star_idx: -1, match_idx: -1,
                panel: `s = <b>"${s}"</b><br>p = <b>"${p}"</b>`,
                statusText: 'Starting greedy two-pointer matching...',
                log: 'Initialize pointers',
                complete: false
            });

            while (s_ptr < n) {
                if (p_ptr < m && (p[p_ptr] === '?' || p[p_ptr] === s[s_ptr])) {
                    // Direct match or '?'
                    steps.push({
                        type: 'match',
                        s_ptr: s_ptr + 1, p_ptr: p_ptr + 1, star_idx, match_idx,
                        panel: `Match: s[${s_ptr}]='${s[s_ptr]}' == p[${p_ptr}]='${p[p_ptr]}'`,
                        statusText: `Matched characters`,
                        log: `Match → s_ptr=${s_ptr+1}, p_ptr=${p_ptr+1}`,
                        complete: false
                    });
                    s_ptr++; p_ptr++;
                } 
                else if (p_ptr < m && p[p_ptr] === '*') {
                    // Record star
                    steps.push({
                        type: 'star',
                        s_ptr, p_ptr: p_ptr + 1, star_idx: p_ptr, match_idx: s_ptr,
                        panel: `Found '*' at p[${p_ptr}], record and skip`,
                        statusText: `Star recorded`,
                        log: `* at ${p_ptr} → star_idx=${p_ptr}, match_idx=${s_ptr}`,
                        complete: false
                    });
                    star_idx = p_ptr;
                    match_idx = s_ptr;
                    p_ptr++;
                } 
                else if (star_idx !== -1) {
                    // Backtrack
                    match_idx++;
                    steps.push({
                        type: 'backtrack',
                        s_ptr: match_idx, p_ptr: star_idx + 1, star_idx, match_idx,
                        panel: `Mismatch → backtrack to last '*'`,
                        statusText: `Backtracked`,
                        log: `Backtrack: s_ptr=${match_idx}, p_ptr=${star_idx+1}`,
                        complete: false
                    });
                    s_ptr = match_idx;
                    p_ptr = star_idx + 1;
                } 
                else {
                    steps.push({
                        type: 'fail',
                        s_ptr, p_ptr, star_idx, match_idx,
                        panel: `No match possible`,
                        statusText: `Mismatch without star`,
                        log: `Fail at s[${s_ptr}], p[${p_ptr}]`,
                        complete: true
                    });
                    break;
                }
            }

            // Skip remaining '*' in pattern
            while (p_ptr < m && p[p_ptr] === '*') {
                steps.push({
                    type: 'skipstar',
                    s_ptr, p_ptr: p_ptr + 1, star_idx, match_idx,
                    panel: `Skip trailing '*' at p[${p_ptr}]`,
                    statusText: `Skipping trailing *`,
                    log: `Skip * at ${p_ptr}`,
                    complete: false
                });
                p_ptr++;
            }

            const success = p_ptr === m;
            steps.push({
                type: 'final',
                s_ptr, p_ptr, star_idx, match_idx,
                panel: success ? `✅ <b>Match Successful</b>` : `❌ <b>No Match</b>`,
                statusText: success ? 'Full match achieved!' : 'No match found.',
                log: success ? `\n✅ MATCH: true` : `\n❌ MATCH: false`,
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // String s row
            const sRow = document.createElement('div');
            sRow.className = 'string-row';
            const sLabel = document.createElement('div');
            sLabel.className = 'string-label';
            sLabel.textContent = 's:';
            sRow.appendChild(sLabel);

            currentS.split('').forEach((ch, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<span>${ch}</span><span class="index">[${i}]</span>`;
                if (i === step.s_ptr) tile.classList.add('current');
                if (step.type === 'match' && i === step.s_ptr - 1) tile.classList.add('match');
                container.appendChild(tile); // Wait, append to sRow
                sRow.appendChild(tile);
            });
            container.appendChild(sRow);

            // Pattern p row
            const pRow = document.createElement('div');
            pRow.className = 'string-row';
            const pLabel = document.createElement('div');
            pLabel.className = 'string-label';
            pLabel.textContent = 'p:';
            pRow.appendChild(pLabel);

            currentP.split('').forEach((ch, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<span>${ch}</span><span class="index">[${i}]</span>`;
                if (i === step.p_ptr) tile.classList.add('current');
                if (step.star_idx === i) tile.classList.add('star');
                pRow.appendChild(tile);
            });
            container.appendChild(pRow);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-sptr').innerText = step.s_ptr;
            document.getElementById('val-pptr').innerText = step.p_ptr;
            document.getElementById('val-star').innerText = step.star_idx >= 0 ? step.star_idx : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? (step.type === 'final' ? step.panel : '—') : '—';

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const line = document.createElement('div');
                line.style.marginBottom = '4px';
                line.innerText = steps[k].log || '';
                logPanel.appendChild(line);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value | 0]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = () => { loadExample(0); };
    </script>
</body>
</html>
