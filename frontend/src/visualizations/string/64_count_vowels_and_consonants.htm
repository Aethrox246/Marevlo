<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32 - Count Vowels and Consonants - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 320px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 26px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }

        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.12); }
        .tile.vowel { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.consonant { background: #2a1f0d; border-color: var(--accent-orange); color: var(--accent-orange); }
        .tile.idle { opacity: 0.85; }

        .string-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 60px;
            text-align: right;
        }

        .counters {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin: 20px 0;
        }
        .counter-box {
            text-align: center;
            background: var(--bg-surface);
            padding: 14px 28px;
            border-radius: 8px;
            border: 1px solid var(--border-main);
            min-width: 140px;
        }
        .counter-label { font-size: 13px; color: var(--text-dim); }
        .counter-value { font-size: 32px; font-weight: 700; font-family: monospace; margin: 4px 0; }

        .action-panel {
            margin-top: 10px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 720px; text-align: center; font-family: monospace; min-height: 82px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 16px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .result-display { margin-top: 16px; font-size: 18px; color: var(--accent-green); font-family: monospace; font-weight: bold; }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 720px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; }

        .legend { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); gap: 6px; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s = </label>
        <input type="text" id="str-input" placeholder='"hello"'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1: hello</button>
        <button onclick="loadExample(1)">Ex 2: algorithm</button>
    </div>

    <div class="visual-container">
        <div class="string-display" id="tiles-container"></div>
        
        <div class="counters">
            <div class="counter-box">
                <div class="counter-label" style="color:var(--accent-green)">VOWELS</div>
                <div class="counter-value" id="vowel-count">0</div>
            </div>
            <div class="counter-box">
                <div class="counter-label" style="color:var(--accent-orange)">CONSONANTS</div>
                <div class="counter-value" id="consonant-count">0</div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to start visualization</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Char</span>
            <span class="info-value" id="curr-char" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Type</span>
            <span class="info-value" id="curr-type" style="color:var(--accent-green)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Position</span>
            <span class="info-value" id="curr-pos">—</span>
        </div>
    </div>

    <div class="result-display" id="result-text"></div>
    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:20px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Vowel</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-orange);border-radius:4px"></span> Consonant</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Processing</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "hello";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1200, 600, 300];

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            const vowelsSet = new Set(['a','e','i','o','u']);

            // Initial step
            steps.push({
                type: 'init',
                vowels: 0,
                consonants: 0,
                i: -1,
                panel: `s = "<b>${currentS}</b>"`,
                status: 'Initializing counters and vowel set...',
                log: `vowels = 0, consonants = 0\nvowel_set = {'a','e','i','o','u'}`
            });

            let v = 0, c = 0;

            for (let i = 0; i < n; i++) {
                const ch = currentS[i];
                const isVowel = vowelsSet.has(ch);
                
                const newV = isVowel ? v + 1 : v;
                const newC = isVowel ? c : c + 1;

                steps.push({
                    type: isVowel ? 'vowel' : 'consonant',
                    vowels: newV,
                    consonants: newC,
                    i: i,
                    ch: ch,
                    isVowel: isVowel,
                    panel: `char = '<b>${ch}</b>' → ${isVowel ? 'VOWEL' : 'CONSONANT'}`,
                    status: `Processing index ${i}: '${ch}'`,
                    log: `char='${ch}' → ${isVowel ? 'vowel' : 'consonant'} → vowels=${newV}, consonants=${newC}`
                });

                if (isVowel) v = newV;
                else c = newC;
            }

            // Final step
            steps.push({
                type: 'final',
                vowels: v,
                consonants: c,
                i: n,
                panel: `<span style="color:var(--accent-green)">FINAL RESULT: (${v}, ${c})</span>`,
                status: `Completed! Vowels: ${v}, Consonants: ${c}`,
                log: `\n=== FINAL ===\nvowels = ${v}\nconsonants = ${c}`,
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const row = document.createElement('div');
            row.className = 'string-row';

            const label = document.createElement('div');
            label.className = 'string-label';
            label.textContent = 's';
            row.appendChild(label);

            currentS.split('').forEach((ch, i) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile ${i === step.i ? 'center' : (step.i > i ? (new Set(['a','e','i','o','u']).has(ch) ? 'vowel' : 'consonant') : 'idle')}`;
                tile.textContent = ch;

                const idxEl = document.createElement('div');
                idxEl.className = 'tile-index';
                idxEl.textContent = i;

                unit.appendChild(tile);
                unit.appendChild(idxEl);
                row.appendChild(unit);
            });

            container.appendChild(row);

            // Update counters
            document.getElementById('vowel-count').textContent = step.vowels;
            document.getElementById('consonant-count').textContent = step.consonants;

            // Main panel
            document.getElementById('main-panel').innerHTML = step.panel;

            // Info
            document.getElementById('curr-char').textContent = step.ch ? `'${step.ch}'` : '—';
            document.getElementById('curr-type').textContent = step.isVowel !== undefined ? (step.isVowel ? 'VOWEL' : 'CONSONANT') : '—';
            document.getElementById('curr-pos').textContent = step.i >= 0 ? step.i : '—';

            // Result
            const resEl = document.getElementById('result-text');
            if (step.complete) {
                resEl.innerHTML = `Result: <b>(${step.vowels}, ${step.consonants})</b>`;
            } else {
                resEl.textContent = '';
            }

            document.getElementById('status-text').textContent = step.status;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = steps.slice(0, idx + 1).map(s => `<div>${s.log}</div>`).join('');
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.textContent = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(idx) {
            currentS = idx === 0 ? "hello" : "algorithm";
            document.getElementById('str-input').value = `"${currentS}"`;
            generateSteps();
            reset();
        }

        function loadCustom() {
            let val = document.getElementById('str-input').value.trim();
            if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
            currentS = val || "hello";
            generateSteps();
            reset();
        }

        window.onload = () => {
            loadExample(0);
        };
    </script>
</body>
</html>
