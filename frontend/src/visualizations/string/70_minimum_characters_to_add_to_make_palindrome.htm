<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimum Characters to Add to Make Palindrome - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 220px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 8px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 700px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" placeholder="abcd">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 ("abcd")</button>
        <button onclick="loadExample(2)">Ex 2 ("aaba")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Finding Longest Palindromic Suffix</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Suffix Start (i)</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Longest Pal Suffix</span>
            <span class="info-value" id="val-longest" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Chars to Add</span>
            <span class="info-value" id="val-add" style="color: var(--accent-orange);">0</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">minimum characters to add =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Suffix Start</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Palindrome Suffix</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Mismatch</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Checking Pointers</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "abcd";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) currentS = "abcd";
            else currentS = "aaba";
            document.getElementById('str-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('str-input').value.trim();
            if (val) {
                currentS = val;
                generateSteps();
                reset();
            }
        }

        function isPalindrome(s, start, end) {
            while (start < end) {
                if (s[start] !== s[end]) return false;
                start++;
                end--;
            }
            return true;
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let minAdd = n; // worst case
            let bestI = 0;

            // INIT
            steps.push({
                type: 'init',
                i: -1,
                add: 0,
                longest: 0,
                states: Array(n).fill('idle'),
                panel: `String: <b>"${currentS}"</b> (length ${n})<br>Finding longest palindromic suffix...`,
                statusText: `Starting search for longest palindromic suffix`,
                log: `Problem: Minimum characters to add at front to make "${currentS}" a palindrome.`
            });

            for (let i = n-1; i >= 0; i--) {
                // Check if suffix s[i..n-1] is palindrome
                const isPal = isPalindrome(currentS, i, n-1);

                let states = Array(n).fill('idle');
                for (let k = i; k < n; k++) {
                    states[k] = isPal ? 'valid-pal' : 'mismatch';
                }
                states[i] = 'center'; // highlight start of suffix

                const currentAdd = i;

                steps.push({
                    type: 'check',
                    i: i,
                    add: currentAdd,
                    longest: n - i,
                    states: states,
                    panel: `Checking suffix starting at <b>i=${i}</b>: "${currentS.substring(i)}"<br>Is palindrome? <b>${isPal ? 'Yes' : 'No'}</b>`,
                    statusText: `Suffix [${i}:${n}) → ${isPal ? 'Palindrome!' : 'Not palindrome'}`,
                    log: `  i=${i} | suffix="${currentS.substring(i)}" → ${isPal ? '✓ Palindrome' : '✗ Not'}`
                });

                if (isPal) {
                    minAdd = currentAdd;
                    bestI = i;
                    steps.push({
                        type: 'found',
                        i: i,
                        add: minAdd,
                        longest: n - i,
                        states: states,
                        panel: `<span style="color:var(--accent-green)">Longest palindromic suffix found!</span><br>Start at i=${i}, length=${n-i}<br>Characters to add = <b>${minAdd}</b>`,
                        statusText: `Found longest palindromic suffix at i=${i}`,
                        log: `  → New best! Longest palindromic suffix length = ${n-i}, add ${minAdd} chars`
                    });
                    // We can break early in real code, but for visualization we continue to show all
                }
            }

            // Final
            const toAdd = currentS.substring(0, bestI).split('').reverse().join('');
            const resultStr = toAdd + currentS;

            steps.push({
                type: 'final',
                i: bestI,
                add: minAdd,
                longest: n - bestI,
                states: Array(n).fill('valid-pal'),
                panel: `Done.<br>Longest palindromic suffix starts at <b>i=${bestI}</b><br>Add <b>${minAdd}</b> characters: <b>"${toAdd}"</b><br>Result: <b>"${resultStr}"</b>`,
                statusText: `Minimum characters to add = ${minAdd}`,
                log: `\nFinal Result: Add ${minAdd} characters → "${resultStr}"`,
                complete: true,
                finalResult: minAdd
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            currentS.split('').forEach((char, k) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                
                const tile = document.createElement('div');
                tile.className = `tile ${step.states[k] || 'idle'}`;
                tile.innerText = char;
                
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${k}]`;
                
                unit.append(tile, idxLabel);
                container.appendChild(unit);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== -1 ? step.i : '—';
            document.getElementById('val-longest').innerText = step.longest || '—';
            document.getElementById('val-add').innerText = step.add;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
