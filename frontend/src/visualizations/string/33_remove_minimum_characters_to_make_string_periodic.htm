<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Minimum Characters to Make String Periodic - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 240px; font-size: 14px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 860px; }
        .string-display {
            display: flex; gap: 6px; justify-content: center; padding: 20px;
            background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .tile {
            width: 48px; height: 58px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 6px;
            font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile .index { font-size: 9px; color: var(--text-dim); margin-top: 3px; }
        .tile.current { border-color: var(--accent-purple); background: #1e1030; transform: scale(1.1); }
        .tile.mismatch { border-color: var(--accent-red); background: #2a0d0d; }

        .pattern-info {
            margin-top: 16px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 12px 20px; width: 720px; font-family: monospace;
            font-size: 13.5px;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; min-height: 92px; font-family: monospace;
            font-size: 14.5px; line-height: 1.55; text-align: center;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 17px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 18px; font-size: 26px; font-family: monospace; color: var(--accent-green); }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 12.5px; color: var(--text-dim); }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" value="ababab">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("ababab")</button>
        <button onclick="loadExample(1)">Ex 2 ("abcabcab")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force — Try All Pattern Lengths → Min Removals for Periodicity</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="pattern-info" id="pattern-info">
        <strong>Current Pattern Length:</strong> — | <strong>Removals:</strong> —
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Pattern Length</span>
            <span class="info-value" id="val-k" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Removals</span>
            <span class="info-value" id="val-rem" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Min Removals</span>
            <span class="info-value" id="val-min" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Current Pattern</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Match</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-red);border-radius:4px"></span> Mismatch (Removal)</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "ababab";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1250, 620, 280];

        function loadExample(ex) {
            currentS = ex === 0 ? "ababab" : "abcabcab";
            document.getElementById('str-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentS = document.getElementById('str-input').value.trim() || currentS;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let minRemovals = n;

            steps.push({
                type: 'init',
                patternLen: -1,
                removals: 0,
                minRemovals: n,
                panel: `String: <b>"${currentS}"</b> (n=${n})`,
                statusText: 'Trying pattern lengths...',
                log: 'Initialize min_removals = n',
                highlight: []
            });

            for (let L = 1; L <= n; L++) {
                const pattern = currentS.substring(0, L);
                let removals = 0;
                let mismatchPositions = [];

                for (let i = 0; i < n; i++) {
                    const expected = pattern[i % L];
                    if (currentS[i] !== expected) {
                        removals++;
                        mismatchPositions.push(i);
                    }
                }

                if (removals < minRemovals) minRemovals = removals;

                steps.push({
                    type: 'check',
                    patternLen: L,
                    removals: removals,
                    minRemovals: minRemovals,
                    panel: `Pattern length ${L} = <b>"${pattern}"</b> → removals = ${removals}`,
                    statusText: `Pattern length ${L}`,
                    log: `L=${L}, removals=${removals}, min so far=${minRemovals}`,
                    highlight: mismatchPositions
                });
            }

            steps.push({
                type: 'final',
                patternLen: -1,
                removals: minRemovals,
                minRemovals: minRemovals,
                panel: `✅ Minimum removals = <b>${minRemovals}</b>`,
                statusText: 'Completed',
                log: `Final min removals: ${minRemovals}`,
                highlight: []
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Tiles
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            for (let k = 0; k < currentS.length; k++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<span>${currentS[k]}</span><span class="index">${k}</span>`;
                if (step.highlight.includes(k)) {
                    tile.classList.add('mismatch');
                }
                container.appendChild(tile);
            }

            document.getElementById('pattern-info').innerHTML = `
                <strong>Current Pattern Length:</strong> ${step.patternLen === -1 ? '—' : step.patternLen} | 
                <strong>Removals:</strong> ${step.removals}
            `;

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-k').innerText = step.patternLen === -1 ? '—' : step.patternLen;
            document.getElementById('val-rem').innerText = step.removals;
            document.getElementById('val-min').innerText = step.minRemovals;

            document.getElementById('res-val').innerText = step.minRemovals;

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const line = document.createElement('div');
                line.style.marginBottom = '4px';
                line.innerText = steps[k].log || '';
                logPanel.appendChild(line);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value | 0]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = () => { loadExample(0); };
    </script>
</body>
</html>
