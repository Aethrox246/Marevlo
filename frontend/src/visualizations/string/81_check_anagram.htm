<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Anagram - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 180px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 16px; justify-content: center; position: relative; padding: 20px 0; }
        
        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 80px;
            text-align: right;
        }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 700px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="s-input" placeholder="anagram">
        <label class="ui-label">t =</label>
        <input type="text" id="t-input" placeholder="nagaram">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 ("anagram" vs "nagaram")</button>
        <button onclick="loadExample(2)">Ex 2 ("rat" vs "car")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Sorting-Based Anagram Check</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Sorted s</span>
            <span class="info-value" id="val-sorted-s" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Sorted t</span>
            <span class="info-value" id="val-sorted-t" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Match?</span>
            <span class="info-value" id="val-match" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">isAnagram =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Character Being Sorted</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Match / Sorted</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Mismatch</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "anagram";
        let currentT = "nagaram";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentS = "anagram";
                currentT = "nagaram";
            } else {
                currentS = "rat";
                currentT = "car";
            }
            document.getElementById('s-input').value = currentS;
            document.getElementById('t-input').value = currentT;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const sVal = document.getElementById('s-input').value.trim();
            const tVal = document.getElementById('t-input').value.trim();
            if (sVal && tVal) {
                currentS = sVal;
                currentT = tVal;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            const m = currentT.length;

            // INIT
            steps.push({
                type: 'init',
                sortedS: "",
                sortedT: "",
                match: false,
                statesS: Array(n).fill('idle'),
                statesT: Array(m).fill('idle'),
                panel: `Strings: s="<b>${currentS}</b>" (${n} chars), t="<b>${currentT}</b>" (${m} chars)<br>Checking if they are anagrams...`,
                statusText: `Starting anagram check`,
                log: `Check if "${currentS}" is anagram of "${currentT}"`
            });

            // Length check
            if (n !== m) {
                steps.push({
                    type: 'length-mismatch',
                    sortedS: currentS,
                    sortedT: currentT,
                    match: false,
                    statesS: Array(n).fill('mismatch'),
                    statesT: Array(m).fill('mismatch'),
                    panel: `<span style="color:var(--accent-red)">Lengths differ (${n} vs ${m})</span><br>Not anagrams`,
                    statusText: `Length mismatch → false`,
                    log: `Lengths differ (${n} ≠ ${m}) → false`,
                    complete: true,
                    finalResult: false
                });
                return;
            }

            // Sort s
            const sortedSChars = currentS.split('').sort();
            const sortedS = sortedSChars.join('');

            steps.push({
                type: 'sort-s',
                sortedS: sortedS,
                sortedT: "",
                match: false,
                statesS: Array(n).fill('valid-pal'),
                statesT: Array(m).fill('idle'),
                panel: `Sorted s: <b>"${sortedS}"</b>`,
                statusText: `Sorting s...`,
                log: `Sorted s: "${sortedS}"`
            });

            // Sort t
            const sortedTChars = currentT.split('').sort();
            const sortedT = sortedTChars.join('');

            steps.push({
                type: 'sort-t',
                sortedS: sortedS,
                sortedT: sortedT,
                match: false,
                statesS: Array(n).fill('valid-pal'),
                statesT: Array(m).fill('valid-pal'),
                panel: `Sorted t: <b>"${sortedT}"</b>`,
                statusText: `Sorting t...`,
                log: `Sorted t: "${sortedT}"`
            });

            // Compare
            const isAnagram = sortedS === sortedT;

            steps.push({
                type: 'compare',
                sortedS: sortedS,
                sortedT: sortedT,
                match: isAnagram,
                statesS: Array(n).fill(isAnagram ? 'valid-pal' : 'mismatch'),
                statesT: Array(m).fill(isAnagram ? 'valid-pal' : 'mismatch'),
                panel: `Compare sorted strings:<br>s: <b>"${sortedS}"</b><br>t: <b>"${sortedT}"</b><br>Result: <b>${isAnagram ? 'Anagrams ✓' : 'Not anagrams ✗'}</b>`,
                statusText: `Comparison complete → ${isAnagram}`,
                log: `Compare "${sortedS}" == "${sortedT}" → ${isAnagram}`,
                complete: true,
                finalResult: isAnagram
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Row for s
            const rowS = document.createElement('div');
            rowS.className = 'string-row';
            const labelS = document.createElement('div');
            labelS.className = 'string-label';
            labelS.innerText = 's';
            rowS.appendChild(labelS);

            currentS.split('').forEach((char, k) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${step.statesS[k] || 'idle'}`;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${k}]`;
                unit.append(tile, idxLabel);
                rowS.appendChild(unit);
            });
            container.appendChild(rowS);

            // Row for t
            const rowT = document.createElement('div');
            rowT.className = 'string-row';
            const labelT = document.createElement('div');
            labelT.className = 'string-label';
            labelT.innerText = 't';
            rowT.appendChild(labelT);

            currentT.split('').forEach((char, k) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${step.statesT[k] || 'idle'}`;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${k}]`;
                unit.append(tile, idxLabel);
                rowT.appendChild(unit);
            });
            container.appendChild(rowT);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-sorted-s').innerText = `"${step.sortedS || ''}"`;
            document.getElementById('val-sorted-t').innerText = `"${step.sortedT || ''}"`;
            document.getElementById('val-match').innerText = step.match ? 'Yes ✓' : 'No ✗';
            document.getElementById('val-match').style.color = step.match ? 'var(--accent-green)' : 'var(--accent-red)';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult ? 'true' : 'false';
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
