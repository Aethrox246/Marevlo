<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find All Occurrences of a Pattern (KMP-style) - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 480px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 110px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">params =</label>
        <input type="text" id="str-input" placeholder='{"text":"ABABDABACDABABCABAB","pattern":"ABABCABAB"}'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (ABABCABAB at 10)</button>
        <button onclick="loadExample(1)">Ex 2 (AA in AAAAA)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force Sliding Window + Early Mismatch (KMP-style insight shown)</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i (start)</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current j (offset)</span>
            <span class="info-value" id="val-j" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Matches Found</span>
            <span class="info-value" id="val-matches" style="color: var(--accent-green);">[]</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Status</span>
            <span class="info-value" id="val-status" style="color: var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">starting indices =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Starting Position i</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Current Comparison Window</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Full Match Found</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Mismatch (Early Break)</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentText = "ABABDABACDABABCABAB";
        let currentPattern = "ABABCABAB";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1200, 600, 300];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentText = "ABABDABACDABABCABAB";
                currentPattern = "ABABCABAB";
            } else {
                currentText = "AAAAA";
                currentPattern = "AA";
            }
            document.getElementById('str-input').value = JSON.stringify({
                text: currentText,
                pattern: currentPattern
            });
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const val = document.getElementById('str-input').value.trim();
                const parsed = JSON.parse(val);
                currentText = parsed.text || "";
                currentPattern = parsed.pattern || "";
                generateSteps();
                reset();
            } catch(e) {
                alert("Please enter valid JSON like {\"text\":\"ABABDABACDABABCABAB\",\"pattern\":\"ABABCABAB\"}");
            }
        }

        function generateSteps() {
            steps = [];
            const n = currentText.length;
            const m = currentPattern.length;
            let matches = [];

            // INIT
            steps.push({
                type: 'init',
                i: -1,
                j: -1,
                matches: [],
                panel: `text = "<b>${currentText}</b>" (len=${n})<br>pattern = "<b>${currentPattern}</b>" (len=${m})`,
                statusText: `Finding all occurrences of pattern in text...`,
                log: `Problem initialized.\ntext = "${currentText}"\npattern = "${currentPattern}"`,
                resultStr: "[]"
            });

            if (m === 0) {
                // Special case for empty pattern
                for (let i = 0; i <= n; i++) matches.push(i);
            } else if (m > n) {
                // No possible match
            } else {
                for (let i = 0; i <= n - m; i++) {
                    let j = 0;
                    let matchFound = true;

                    // Show current starting position
                    steps.push({
                        type: 'start-window',
                        i: i,
                        j: 0,
                        matches: [...matches],
                        panel: `Starting at index <b>${i}</b>`,
                        statusText: `Trying to match pattern starting at position ${i}...`,
                        log: `  i = ${i} (window start)`
                    });

                    while (j < m) {
                        const textChar = currentText[i + j];
                        const patChar = currentPattern[j];

                        steps.push({
                            type: 'compare',
                            i: i,
                            j: j,
                            matches: [...matches],
                            panel: `Comparing text[${i+j}] = '${textChar}' vs pattern[${j}] = '${patChar}'`,
                            statusText: `j=${j}: ${textChar} vs ${patChar}`,
                            log: `    j=${j}: text[${i+j}]='${textChar}' ${textChar===patChar?'==':'!='} pattern[${j}]='${patChar}'`
                        });

                        if (textChar !== patChar) {
                            matchFound = false;
                            break;
                        }
                        j++;
                    }

                    if (matchFound) {
                        matches.push(i);
                        steps.push({
                            type: 'match',
                            i: i,
                            j: m,
                            matches: [...matches],
                            panel: `<span style="color:var(--accent-green)">FULL MATCH!</span> Pattern found at index <b>${i}</b>`,
                            statusText: `Match found at ${i}`,
                            log: `  → MATCH! Added index ${i}`
                        });
                    } else {
                        steps.push({
                            type: 'mismatch',
                            i: i,
                            j: j,
                            matches: [...matches],
                            panel: `<span style="color:var(--accent-red)">Mismatch at offset ${j}</span>`,
                            statusText: `Mismatch → move to next starting position`,
                            log: `  → Mismatch at j=${j}, continue`
                        });
                    }
                }
            }

            // FINAL
            steps.push({
                type: 'final',
                i: n,
                j: m,
                matches: matches,
                panel: `All positions checked.<br>Starting indices = <b>${JSON.stringify(matches)}</b>`,
                complete: true,
                finalResult: JSON.stringify(matches),
                statusText: `Done. Found ${matches.length} occurrence(s)`,
                log: `\nFinal Result: ${JSON.stringify(matches)}`,
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Row 1: Text
            const row1 = document.createElement('div');
            row1.className = 'string-row';
            const label1 = document.createElement('div');
            label1.className = 'string-label';
            label1.innerText = 'Text';
            row1.appendChild(label1);
            currentText.split('').forEach((char, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'idle';
                if (step.i >= 0 && pos >= step.i && pos < step.i + currentPattern.length) {
                    cls = (step.j !== undefined && pos === step.i + step.j) ? 'center' : 'expanding';
                    if (step.type === 'match' && pos >= step.i && pos < step.i + currentPattern.length) cls = 'valid-pal';
                }
                tile.className = `tile ${cls}`;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${pos}]`;
                unit.append(tile, idxLabel);
                row1.appendChild(unit);
            });
            container.appendChild(row1);

            // Row 2: Pattern
            const row2 = document.createElement('div');
            row2.className = 'string-row';
            const label2 = document.createElement('div');
            label2.className = 'string-label';
            label2.innerText = 'Pattern';
            row2.appendChild(label2);
            currentPattern.split('').forEach((char, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${step.j !== undefined && pos === step.j ? 'center' : 'valid-pal'}`;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${pos}]`;
                unit.append(tile, idxLabel);
                row2.appendChild(unit);
            });
            container.appendChild(row2);

            document.getElementById('main-panel').innerHTML = step.panel || '—';

            document.getElementById('val-i').innerText = step.i >= 0 ? step.i : '—';
            document.getElementById('val-j').innerText = step.j !== undefined ? step.j : '—';
            document.getElementById('val-matches').innerText = JSON.stringify(step.matches || []);
            document.getElementById('val-status').innerText = step.type === 'match' ? 'MATCH ✓' : (step.type === 'mismatch' ? 'Mismatch' : '—');

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalResult : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
