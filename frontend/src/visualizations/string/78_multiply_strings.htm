<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiply Strings - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 180px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 8px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 700px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 150px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">num1 =</label>
        <input type="text" id="num1-input" placeholder="123">
        <label class="ui-label">num2 =</label>
        <input type="text" id="num2-input" placeholder="456">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 ("123" × "456")</button>
        <button onclick="loadExample(2)">Ex 2 ("999" × "999")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Simulating Manual Multiplication (Digit by Digit + Shifting + Addition)</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Digit (num2)</span>
            <span class="info-value" id="val-digit" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Partial Product</span>
            <span class="info-value" id="val-partial" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Running Total</span>
            <span class="info-value" id="val-total" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">product =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Digit from num2</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Partial Product / Final Result</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Running Total</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentNum1 = "123";
        let currentNum2 = "456";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentNum1 = "123";
                currentNum2 = "456";
            } else {
                currentNum1 = "999";
                currentNum2 = "999";
            }
            document.getElementById('num1-input').value = currentNum1;
            document.getElementById('num2-input').value = currentNum2;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const n1 = document.getElementById('num1-input').value.trim();
            const n2 = document.getElementById('num2-input').value.trim();
            if (n1 && n2) {
                currentNum1 = n1;
                currentNum2 = n2;
                generateSteps();
                reset();
            }
        }

        function addStrings(a, b) {
            let i = a.length - 1, j = b.length - 1;
            let carry = 0;
            let result = [];
            while (i >= 0 || j >= 0 || carry) {
                let sum = carry;
                if (i >= 0) sum += parseInt(a[i--]);
                if (j >= 0) sum += parseInt(b[j--]);
                result.push(sum % 10);
                carry = Math.floor(sum / 10);
            }
            return result.reverse().join('');
        }

        function generateSteps() {
            steps = [];
            let num1 = currentNum1;
            let num2 = currentNum2;

            if (num1 === '0' || num2 === '0') {
                steps.push({
                    type: 'final',
                    panel: `One number is zero.<br>Product = <b>0</b>`,
                    statusText: `Product = 0`,
                    log: `One input is 0 → Product = 0`,
                    complete: true,
                    finalResult: "0"
                });
                return;
            }

            let n1 = num1.length;
            let n2 = num2.length;

            steps.push({
                type: 'init',
                panel: `Multiplying <b>"${num1}"</b> × <b>"${num2}"</b><br>Simulating manual multiplication...`,
                statusText: `Starting multiplication`,
                log: `Multiply "${num1}" × "${num2}"`,
                result: "0"
            });

            let result = "0";
            let reversedNum2 = num2.split('').reverse().join('');

            for (let pos = 0; pos < n2; pos++) {
                let digit2 = parseInt(reversedNum2[pos]);
                let zeros = '0'.repeat(pos);

                // Multiply num1 by single digit
                let partial = [];
                let carry = 0;
                let reversedNum1 = num1.split('').reverse().join('');

                for (let d of reversedNum1) {
                    let prod = parseInt(d) * digit2 + carry;
                    partial.push(prod % 10);
                    carry = Math.floor(prod / 10);
                }
                if (carry > 0) partial.push(carry);

                let partialStr = partial.reverse().join('') + zeros;

                steps.push({
                    type: 'partial',
                    digit: digit2,
                    partial: partialStr,
                    currentResult: result,
                    panel: `Digit <b>${digit2}</b> from num2 (position ${pos})<br>Partial product: <b>"${partialStr}"</b>`,
                    statusText: `Multiplying by ${digit2} → partial = ${partialStr}`,
                    log: `  × ${digit2} (shift ${pos}) → "${partialStr}"`
                });

                // Add partial to result
                result = addStrings(result, partialStr);

                steps.push({
                    type: 'add',
                    partial: partialStr,
                    currentResult: result,
                    panel: `Add partial <b>"${partialStr}"</b> to running total<br>New total: <b>"${result}"</b>`,
                    statusText: `Adding partial → total = ${result}`,
                    log: `  Add "${partialStr}" → total = "${result}"`
                });
            }

            // Final
            steps.push({
                type: 'final',
                panel: `Multiplication complete.<br>Final product: <b>"${result}"</b>`,
                statusText: `Done. Product = ${result}`,
                log: `\nFinal Result: "${result}"`,
                complete: true,
                finalResult: result
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Show num1 and num2 with current digit highlighted
            const row1 = document.createElement('div');
            row1.className = 'string-row';
            const label1 = document.createElement('div');
            label1.className = 'string-label';
            label1.innerText = 'num1';
            row1.appendChild(label1);
            currentNum1.split('').forEach(char => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = 'tile idle';
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                unit.append(tile, idxLabel);
                row1.appendChild(unit);
            });
            container.appendChild(row1);

            const row2 = document.createElement('div');
            row2.className = 'string-row';
            const label2 = document.createElement('div');
            label2.className = 'string-label';
            label2.innerText = 'num2';
            row2.appendChild(label2);
            currentNum2.split('').forEach((char, k) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'tile idle';
                if (step.type === 'partial' && k === currentNum2.length - 1 - (step.digit !== undefined ? parseInt(step.digit) : -1)) cls = 'tile center'; // rough highlight
                tile.className = cls;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                unit.append(tile, idxLabel);
                row2.appendChild(unit);
            });
            container.appendChild(row2);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-digit').innerText = step.digit !== undefined ? step.digit : '—';
            document.getElementById('val-partial').innerText = `"${step.partial || ''}"`;
            document.getElementById('val-total').innerText = `"${step.currentResult || step.result || ''}"`;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = `"${step.finalResult}"`;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
