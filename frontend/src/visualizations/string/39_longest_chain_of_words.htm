<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Chain of Words - Backtracking Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-orange: #e3b341;
            --accent-red: #f85149;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg-page); color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0; padding: 20px 0; display: flex; flex-direction: column; align-items: center;
        }
        .input-bar {
            background: var(--bg-surface); padding: 12px 20px; border-radius: 8px;
            border: 1px solid var(--border-main); display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            margin-bottom: 24px;
        }
        input[type="text"] {
            background: #0d1117; border: 1px solid var(--border-main); color: var(--text-main);
            padding: 8px 12px; border-radius: 6px; width: 320px; font-family: monospace;
        }
        button {
            padding: 8px 16px; background: #21262d; border: 1px solid var(--border-main);
            color: var(--text-main); border-radius: 6px; cursor: pointer;
        }
        button:hover { background: #30363d; }

        .words-container {
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
            background: var(--bg-surface); padding: 20px; border-radius: 10px;
            border: 1px solid var(--border-main); margin-bottom: 20px;
        }
        .word-tile {
            padding: 12px 18px; background: #21262d; border: 2px solid var(--border-main);
            border-radius: 8px; font-family: monospace; font-size: 18px; min-width: 80px;
            text-align: center; transition: all 0.3s;
        }
        .word-tile.used { border-color: var(--accent-purple); background: #1e1030; }
        .word-tile.current { border-color: var(--accent-green); transform: scale(1.08); }

        .chain-display {
            background: var(--bg-surface); padding: 16px 24px; border-radius: 8px;
            border: 1px solid var(--border-main); margin: 20px 0; min-height: 58px;
            font-family: monospace; font-size: 17px; min-width: 600px;
        }

        .action-panel {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 24px; margin: 16px 0; min-height: 110px;
            font-family: monospace; line-height: 1.5;
        }

        .info-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 620px;
        }
        .info-box {
            background: var(--bg-surface); padding: 12px; border-radius: 6px;
            border: 1px solid var(--border-main); text-align: center;
        }

        .controls {
            margin: 24px 0; display: flex; gap: 12px; align-items: center;
        }
        input[type="range"] { width: 160px; accent-color: var(--accent-purple); }

        .log-panel {
            width: 720px; height: 180px; overflow-y: auto; background: #0d1117;
            border: 1px solid var(--border-main); border-radius: 8px; padding: 14px;
            font-family: monospace; font-size: 13px; line-height: 1.45;
        }
        .legend {
            display: flex; gap: 24px; margin: 20px 0; font-size: 13px; color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label>Words (comma separated):</label>
        <input type="text" id="input-words" value="a,ab,abc">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1: ["a","ab","abc"]</button>
        <button onclick="loadExample(1)">Ex 2: ["x","xy","yx"]</button>
    </div>

    <div style="font-family:monospace; color:var(--accent-purple); margin-bottom:12px;">
        Brute-Force Backtracking — Build Longest Subsequence Chain
    </div>

    <div class="words-container" id="words-container"></div>

    <div class="chain-display" id="chain-display">
        Current Chain: <span id="chain-text" style="color:var(--accent-green)"></span>
    </div>

    <div class="action-panel" id="action-panel">
        Click Play or Next to start backtracking exploration...
    </div>

    <div class="info-grid">
        <div class="info-box">
            <div style="font-size:11px;color:var(--text-dim)">Current Chain Length</div>
            <div id="curr-len" style="font-size:24px;font-weight:700;color:var(--accent-green)">0</div>
        </div>
        <div class="info-box">
            <div style="font-size:11px;color:var(--text-dim)">Max Chain Found</div>
            <div id="max-len" style="font-size:24px;font-weight:700;color:var(--accent-orange)">0</div>
        </div>
        <div class="info-box">
            <div style="font-size:11px;color:var(--text-dim)">Status</div>
            <div id="status" style="font-size:15px;color:var(--accent-purple)">Ready</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="resetViz()">Reset</button>
        <button onclick="stepBack()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="stepForward()">Next →</button>
        <span style="margin-left:20px;color:var(--text-dim)">Speed</span>
        <input type="range" id="speed" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div><span style="color:var(--accent-purple)">■</span> Used Word</div>
        <div><span style="color:var(--accent-green)">■</span> Current Chain</div>
        <div><span style="color:var(--accent-orange)">■</span> Max Updated</div>
    </div>

    <div class="log-panel" id="log-panel"></div>

    <script>
        let words = ["a", "ab", "abc"];
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        let delays = [1400, 700, 320];

        function isSubsequence(a, b) {
            let i = 0;
            for (let char of b) {
                if (i < a.length && a[i] === char) i++;
            }
            return i === a.length;
        }

        function generateSteps() {
            steps = [];
            let maxLen = 0;
            let used = new Array(words.length).fill(false);
            let chain = [];

            function backtrack(depth) {
                steps.push({
                    type: 'enter',
                    chain: [...chain],
                    used: [...used],
                    maxLen: maxLen,
                    panel: `Backtrack depth ${depth} | Chain: [${chain.join(' → ')}]`,
                    log: `Enter backtrack | Current chain length: ${chain.length} | Max so far: ${maxLen}`
                });

                if (chain.length > maxLen) {
                    maxLen = chain.length;
                    steps.push({
                        type: 'update',
                        chain: [...chain],
                        used: [...used],
                        maxLen: maxLen,
                        panel: `🔥 New max chain length = ${maxLen}`,
                        log: `Updated global max to ${maxLen}`
                    });
                }

                for (let i = 0; i < words.length; i++) {
                    if (used[i]) continue;
                    if (chain.length === 0 || isSubsequence(chain[chain.length-1], words[i])) {
                        used[i] = true;
                        chain.push(words[i]);

                        steps.push({
                            type: 'add',
                            chain: [...chain],
                            used: [...used],
                            maxLen: maxLen,
                            panel: `Add word "${words[i]}" (index ${i})`,
                            log: `Added "${words[i]}" → chain length ${chain.length}`
                        });

                        backtrack(depth + 1);

                        chain.pop();
                        used[i] = false;

                        steps.push({
                            type: 'back',
                            chain: [...chain],
                            used: [...used],
                            maxLen: maxLen,
                            panel: `Backtrack: Removed "${words[i]}"`,
                            log: `Backtracked from "${words[i]}"`
                        });
                    }
                }
            }

            steps.push({
                type: 'start',
                chain: [],
                used: new Array(words.length).fill(false),
                maxLen: 0,
                panel: `Start backtracking with empty chain`,
                log: `Begin exploration with ${words.length} words`
            });

            backtrack(0);

            steps.push({
                type: 'final',
                chain: [],
                used: new Array(words.length).fill(false),
                maxLen: maxLen,
                panel: `✅ Longest chain found: ${maxLen}`,
                log: `Exploration complete. Final answer = ${maxLen}`
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render word tiles
            const container = document.getElementById('words-container');
            container.innerHTML = '';
            words.forEach((w, i) => {
                const tile = document.createElement('div');
                tile.className = 'word-tile';
                tile.textContent = `"${w}"`;
                if (step.used[i]) tile.classList.add('used');
                if (step.chain.includes(w)) tile.classList.add('current');
                container.appendChild(tile);
            });

            // Current chain
            document.getElementById('chain-text').textContent = step.chain.length ? step.chain.join(' → ') : '(empty)';

            document.getElementById('action-panel').innerHTML = step.panel;
            document.getElementById('curr-len').textContent = step.chain.length;
            document.getElementById('max-len').textContent = step.maxLen;
            document.getElementById('status').textContent = step.type === 'final' ? 'DONE' : 'Exploring...';

            // Log
            const logEl = document.getElementById('log-panel');
            logEl.innerHTML = steps.slice(0, idx+1).map(s => `<div>${s.log}</div>`).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function loadExample(ex) {
            words = ex === 0 ? ["a", "ab", "abc"] : ["x", "xy", "yx"];
            document.getElementById('input-words').value = words.join(',');
            generateSteps();
            resetViz();
        }

        function loadCustom() {
            const input = document.getElementById('input-words').value.trim();
            if (input) {
                words = input.split(',').map(w => w.trim()).filter(Boolean);
                generateSteps();
                resetViz();
            }
        }

        function resetViz() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
            stepIdx = 0;
            renderStep(0);
        }

        function stepForward() {
            if (stepIdx < steps.length - 1) {
                stepIdx++;
                renderStep(stepIdx);
            }
        }

        function stepBack() {
            if (stepIdx > 0) {
                stepIdx--;
                renderStep(stepIdx);
            }
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                clearInterval(timer);
                timer = null;
                btn.textContent = '▶ Play';
            } else {
                btn.textContent = '⏸ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) {
                        stepIdx++;
                        renderStep(stepIdx);
                    } else {
                        clearInterval(timer);
                        timer = null;
                        btn.textContent = '▶ Play';
                    }
                }, delays[parseInt(document.getElementById('speed').value)]);
            }
        }

        window.onload = () => {
            loadExample(0);
        };
    </script>
</body>
</html>
