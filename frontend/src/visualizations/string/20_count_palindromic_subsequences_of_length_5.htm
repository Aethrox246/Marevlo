<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Palindromic Subsequences of Length 5 - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 520px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 130px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">params =</label>
        <input type="text" id="str-input" placeholder='{"s":"abcba"}'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("abcba")</button>
        <button onclick="loadExample(1)">Ex 2 ("aaaaa")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force: Nested 5 loops over indices i&lt;j&lt;k&lt;l&lt;m, check s[i]==s[m] &amp;&amp; s[j]==s[l]</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">j</span>
            <span class="info-value" id="val-j" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">k</span>
            <span class="info-value" id="val-k" style="color: #f0f0f0;">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">l</span>
            <span class="info-value" id="val-l" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">m</span>
            <span class="info-value" id="val-m" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Valid?</span>
            <span class="info-value" id="val-valid" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Total count =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Outer (i,m)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Inner (j,l)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid palindrome</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Invalid</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "abcba";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentS = "abcba";
            } else {
                currentS = "aaaaa";
            }
            document.getElementById('str-input').value = JSON.stringify({ s: currentS });
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const val = document.getElementById('str-input').value.trim();
                const parsed = JSON.parse(val);
                currentS = parsed.s || "";
                generateSteps();
                reset();
            } catch(e) {
                alert("Please enter valid JSON like {\"s\":\"abcba\"}");
            }
        }

        function isPalindrome5(i, j, k, l, m) {
            return currentS[i] === currentS[m] && currentS[j] === currentS[l];
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let count = 0;

            // INIT
            steps.push({
                type: 'init',
                i: -1, j: -1, k: -1, l: -1, m: -1,
                panel: `S = <b>"${currentS}"</b> (n = ${n})<br>Count palindromic subsequences of exactly length 5<br>Pattern: s[i] == s[m] && s[j] == s[l] (i &lt; j &lt; k &lt; l &lt; m)`,
                statusText: `Initializing brute-force enumeration with 5 nested loops`,
                log: `Problem initialized.\nS="${currentS}"\nWe will enumerate all combinations where i < j < k < l < m`,
                count: 0
            });

            if (n < 5) {
                steps.push({
                    type: 'final',
                    panel: `n < 5 → No possible subsequence of length 5.<br>Count = 0`,
                    complete: true,
                    finalCount: 0,
                    statusText: `Done. Count = 0`,
                    log: `\nFinal count: 0`,
                    count: 0
                });
                return;
            }

            for (let i = 0; i <= n - 5; i++) {
                for (let j = i + 1; j <= n - 4; j++) {
                    for (let k = j + 1; k <= n - 3; k++) {
                        for (let l = k + 1; l <= n - 2; l++) {
                            for (let m = l + 1; m < n; m++) {
                                const valid = isPalindrome5(i, j, k, l, m);
                                const subChars = currentS[i] + currentS[j] + currentS[k] + currentS[l] + currentS[m];

                                steps.push({
                                    type: valid ? 'valid' : 'invalid',
                                    i: i, j: j, k: k, l: l, m: m,
                                    panel: `Indices: <b>${i} &lt; ${j} &lt; ${k} &lt; ${l} &lt; ${m}</b><br>Chars: <b>"${subChars}"</b><br>${valid ? '<span style="color:var(--accent-green)">Valid palindrome (s[i]==s[m] && s[j]==s[l])</span>' : '<span style="color:var(--accent-red)">Invalid</span>'}`,
                                    statusText: `Checking i=${i}, j=${j}, k=${k}, l=${l}, m=${m}`,
                                    log: `  i=${i} j=${j} k=${k} l=${l} m=${m} → "${subChars}" ${valid ? '(valid)' : '(invalid)'}`
                                });

                                if (valid) {
                                    count++;
                                    steps.push({
                                        type: 'new-count',
                                        i: i, j: j, k: k, l: l, m: m,
                                        panel: `<span style="color:var(--accent-green)">Valid! Count increased to ${count}</span>`,
                                        statusText: `New valid subsequence found`,
                                        log: `    → Valid! Total count now = ${count}`,
                                        count: count
                                    });
                                }
                            }
                        }
                    }
                }
            }

            steps.push({
                type: 'final',
                panel: `All combinations checked.<br>Total palindromic subsequences of length 5: <b>${count}</b>`,
                complete: true,
                finalCount: count,
                statusText: `Done. Final count = ${count}`,
                log: `\nFinal total count: ${count}`,
                count: count,
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Full S row with highlights
            const rowFull = document.createElement('div');
            rowFull.className = 'string-row';
            const labelFull = document.createElement('div');
            labelFull.className = 'string-label';
            labelFull.innerText = 'S';
            rowFull.appendChild(labelFull);

            currentS.split('').forEach((ch, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'idle';

                if (step.i !== undefined && step.i >= 0) {
                    if (pos === step.i || pos === step.m) cls = 'center';
                    else if (pos === step.j || pos === step.l) cls = 'expanding';
                    else if (pos === step.k) cls = 'expanding';
                }

                if (step.type === 'valid' || step.type === 'new-count') {
                    if ((pos === step.i || pos === step.m) || (pos === step.j || pos === step.l)) {
                        cls = 'valid-pal';
                    }
                } else if (step.type === 'invalid') {
                    if ((pos === step.i || pos === step.m) || (pos === step.j || pos === step.l)) {
                        cls = 'mismatch';
                    }
                }

                tile.className = `tile ${cls}`;
                tile.innerText = ch;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = pos;
                unit.appendChild(tile);
                unit.appendChild(idxLabel);
                rowFull.appendChild(unit);
            });
            container.appendChild(rowFull);

            document.getElementById('main-panel').innerHTML = step.panel || '—';

            document.getElementById('val-i').innerText = step.i !== undefined && step.i >= 0 ? step.i : '—';
            document.getElementById('val-j').innerText = step.j !== undefined && step.j >= 0 ? step.j : '—';
            document.getElementById('val-k').innerText = step.k !== undefined && step.k >= 0 ? step.k : '—';
            document.getElementById('val-l').innerText = step.l !== undefined && step.l >= 0 ? step.l : '—';
            document.getElementById('val-m').innerText = step.m !== undefined && step.m >= 0 ? step.m : '—';
            document.getElementById('val-valid').innerText = (step.type === 'valid' || step.type === 'new-count') ? 'YES' : (step.type === 'invalid' ? 'NO' : '—');

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalCount;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = step.count !== undefined ? step.count : '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
