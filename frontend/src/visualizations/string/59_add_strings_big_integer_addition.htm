<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Strings (Big Integer Addition) - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 220px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 60px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 680px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 150px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">a =</label>
        <input type="text" id="a-input" placeholder='"123"'>
        <label class="ui-label">b =</label>
        <input type="text" id="b-input" placeholder='"456"'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("123"+"456")</button>
        <button onclick="loadExample(1)">Ex 2 ("999"+"1")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Manual Addition: Right-to-Left with Carry</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">i (a)</span>
            <span class="info-value" id="val-i" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">j (b)</span>
            <span class="info-value" id="val-j" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Carry</span>
            <span class="info-value" id="val-carry" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Sum</span>
            <span class="info-value" id="val-sum" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Sum =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> a Pointer</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> b Pointer</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Current Sum</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange)"></span> Carry</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentA = "";
        let currentB = "";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1200, 600, 300];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentA = "123";
                currentB = "456";
            } else {
                currentA = "999";
                currentB = "1";
            }
            document.getElementById('a-input').value = `"${currentA}"`;
            document.getElementById('b-input').value = `"${currentB}"`;
            generateSteps();
            reset();
        }

        function loadCustom() {
            let valA = document.getElementById('a-input').value.trim();
            if (valA.startsWith('"') && valA.endsWith('"')) valA = valA.slice(1, -1);
            currentA = valA || "123";
            
            let valB = document.getElementById('b-input').value.trim();
            if (valB.startsWith('"') && valB.endsWith('"')) valB = valB.slice(1, -1);
            currentB = valB || "456";
            
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let i = currentA.length - 1;
            let j = currentB.length - 1;
            let carry = 0;
            let resultDigits = [];

            // INIT
            steps.push({
                type: 'init',
                i: i,
                j: j,
                carry: carry,
                resultDigits: [],
                aStates: Array(currentA.length).fill('idle'),
                bStates: Array(currentB.length).fill('idle'),
                panel: `a = <b>"${currentA}"</b><br>b = <b>"${currentB}"</b>`,
                statusText: `Starting addition from right...`,
                log: `i=${i}, j=${j}, carry=${carry}`
            });

            while (i >= 0 || j >= 0 || carry > 0) {
                let aStates = Array(currentA.length).fill('idle');
                let bStates = Array(currentB.length).fill('idle');
                if (i >= 0) aStates[i] = 'center';
                if (j >= 0) bStates[j] = 'center';

                let digitA = i >= 0 ? parseInt(currentA[i]) : 0;
                let digitB = j >= 0 ? parseInt(currentB[j]) : 0;
                let total = digitA + digitB + carry;

                steps.push({
                    type: 'add',
                    i: i,
                    j: j,
                    carry: carry,
                    digitA: digitA,
                    digitB: digitB,
                    total: total,
                    aStates: aStates,
                    bStates: bStates,
                    panel: `digitA=${digitA}, digitB=${digitB}, carry=${carry} → total=${total}`,
                    statusText: `Adding digits...`,
                    log: `digitA=${digitA} + digitB=${digitB} + carry=${carry} = ${total}`
                });

                let newDigit = total % 10;
                carry = Math.floor(total / 10);
                resultDigits.push(newDigit);

                steps.push({
                    type: 'write',
                    i: i,
                    j: j,
                    carry: carry,
                    newDigit: newDigit,
                    aStates: aStates,
                    bStates: bStates,
                    panel: `Write ${newDigit}, new carry=${carry}`,
                    statusText: `Writing digit...`,
                    log: `result digit=${newDigit}, carry=${carry}`
                });

                if (i >= 0) i--;
                if (j >= 0) j--;
            }

            // FINAL
            let finalResult = resultDigits.reverse().join('');
            if (finalResult === '') finalResult = '0';

            steps.push({
                type: 'final',
                i: i,
                j: j,
                carry: carry,
                finalResult: finalResult,
                complete: true,
                panel: `<span style="color:var(--accent-green)">Final Sum: <b>"${finalResult}"</b></span>`,
                statusText: `Addition complete`,
                log: `\nFinal Result: "${finalResult}"`,
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Row for a
            let rowA = document.createElement('div');
            rowA.className = 'string-row';
            let labelA = document.createElement('div');
            labelA.className = 'string-label';
            labelA.innerText = 'a';
            rowA.appendChild(labelA);
            currentA.split('').forEach((ch, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${step.aStates ? step.aStates[pos] : 'idle'}`;
                tile.innerText = ch;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = pos;
                unit.append(tile, idxLabel);
                rowA.appendChild(unit);
            });
            container.appendChild(rowA);

            // Row for b
            let rowB = document.createElement('div');
            rowB.className = 'string-row';
            let labelB = document.createElement('div');
            labelB.className = 'string-label';
            labelB.innerText = 'b';
            rowB.appendChild(labelB);
            currentB.split('').forEach((ch, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${step.bStates ? step.bStates[pos] : 'idle'}`;
                tile.innerText = ch;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = pos;
                unit.append(tile, idxLabel);
                rowB.appendChild(unit);
            });
            container.appendChild(rowB);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-j').innerText = step.j !== undefined ? step.j : '—';
            document.getElementById('val-carry').innerText = step.carry !== undefined ? step.carry : '—';
            document.getElementById('val-sum').innerText = step.total !== undefined ? step.total : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = `"${step.finalResult}"`;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
