<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simplify Path (Unix Path) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 420px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 110px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">path =</label>
        <input type="text" id="str-input" placeholder='"/home//foo/../bar/./baz"'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("/home//foo/../bar/./baz")</button>
        <button onclick="loadExample(1)">Ex 2 ("/../")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Stack-Based Path Simplification (process tokens: ., .., empty, directory)</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Token</span>
            <span class="info-value" id="val-token" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Stack</span>
            <span class="info-value" id="val-stack" style="color: var(--accent-blue);">[]</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Action</span>
            <span class="info-value" id="val-action" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Result</span>
            <span class="info-value" id="val-result" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">simplified path =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Token</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Stack / Directory</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Directory Added</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> .. (Pop) or Ignore</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentPath = "/home//foo/../bar/./baz";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentPath = "/home//foo/../bar/./baz";
            } else {
                currentPath = "/../";
            }
            document.getElementById('str-input').value = JSON.stringify(currentPath);
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const val = document.getElementById('str-input').value.trim();
                currentPath = JSON.parse(val) || val; // support both string and JSON
                if (typeof currentPath !== 'string') currentPath = String(currentPath);
                generateSteps();
                reset();
            } catch(e) {
                alert("Please enter a valid path string like \"/home//foo/../bar/./baz\"");
            }
        }

        function generateSteps() {
            steps = [];
            const tokens = currentPath.split('/').filter(t => t !== ''); // we will process all including empty in visualization
            const allTokens = currentPath.split('/');
            let stack = [];
            let matches = []; // not used here

            // INIT
            steps.push({
                type: 'init',
                token: '',
                stack: [],
                panel: `Path: <b>"${currentPath}"</b><br>Tokens: <b>${JSON.stringify(allTokens)}</b>`,
                statusText: `Splitting path by '/' and processing tokens with stack...`,
                log: `Problem initialized.\nPath = "${currentPath}"\nTokens = ${JSON.stringify(allTokens)}`,
                resultStr: "/"
            });

            for (let k = 0; k < allTokens.length; k++) {
                const token = allTokens[k];

                steps.push({
                    type: 'process-token',
                    token: token,
                    stack: [...stack],
                    panel: `Current token: <b>"${token}"</b>`,
                    statusText: `Processing token "${token}"...`,
                    log: `  Token "${token}"`
                });

                if (token === '' || token === '.') {
                    steps.push({
                        type: 'ignore',
                        token: token,
                        stack: [...stack],
                        panel: `<span style="color:var(--accent-red)">Ignore</span> empty or "." token`,
                        statusText: `Ignored "${token}"`,
                        log: `    → Ignored (empty or '.')`
                    });
                    continue;
                }

                if (token === '..') {
                    if (stack.length > 0) {
                        const popped = stack.pop();
                        steps.push({
                            type: 'pop',
                            token: token,
                            stack: [...stack],
                            panel: `<span style="color:var(--accent-red)">".." → Pop</span> "${popped}"`,
                            statusText: `Popped "${popped}" due to ".."`,
                            log: `    → ".." : popped "${popped}"`
                        });
                    } else {
                        steps.push({
                            type: 'ignore',
                            token: token,
                            stack: [...stack],
                            panel: `<span style="color:var(--accent-red)">".." at root → Ignore</span>`,
                            statusText: `Ignored ".." (at root)`,
                            log: `    → ".." at root: ignored`
                        });
                    }
                    continue;
                }

                // Normal directory name
                stack.push(token);
                steps.push({
                    type: 'push',
                    token: token,
                    stack: [...stack],
                    panel: `<span style="color:var(--accent-green)">Push directory</span> <b>"${token}"</b>`,
                    statusText: `Pushed directory "${token}"`,
                    log: `    → Pushed "${token}"`
                });
            }

            // FINAL
            const finalPath = stack.length === 0 ? "/" : "/" + stack.join("/");
            steps.push({
                type: 'final',
                token: '',
                stack: [...stack],
                panel: `All tokens processed.<br>Simplified path = <b>"${finalPath}"</b>`,
                complete: true,
                finalResult: finalPath,
                statusText: `Done. Final simplified path: "${finalPath}"`,
                log: `\nFinal Result: "${finalPath}"`,
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Row 1: Original Path
            const row1 = document.createElement('div');
            row1.className = 'string-row';
            const label1 = document.createElement('div');
            label1.className = 'string-label';
            label1.innerText = 'Original Path';
            row1.appendChild(label1);
            currentPath.split('').forEach((char, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile idle`;
                tile.innerText = char === '/' ? '/' : char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${pos}]`;
                unit.append(tile, idxLabel);
                row1.appendChild(unit);
            });
            container.appendChild(row1);

            // Row 2: Current Token
            const row2 = document.createElement('div');
            row2.className = 'string-row';
            const label2 = document.createElement('div');
            label2.className = 'string-label';
            label2.innerText = 'Current Token';
            row2.appendChild(label2);
            if (step.token) {
                step.token.split('').forEach((char, pos) => {
                    const unit = document.createElement('div');
                    unit.className = 'tile-unit';
                    const tile = document.createElement('div');
                    tile.className = `tile ${step.type === 'push' ? 'valid-pal' : (step.type === 'pop' || step.type === 'ignore' ? 'mismatch' : 'center')}`;
                    tile.innerText = char;
                    const idxLabel = document.createElement('div');
                    idxLabel.className = 'tile-index';
                    idxLabel.innerText = `[${pos}]`;
                    unit.append(tile, idxLabel);
                    row2.appendChild(unit);
                });
            } else {
                const empty = document.createElement('div');
                empty.style.fontFamily = 'monospace';
                empty.style.color = 'var(--text-dim)';
                empty.innerText = '(none)';
                row2.appendChild(empty);
            }
            container.appendChild(row2);

            // Row 3: Stack
            const row3 = document.createElement('div');
            row3.className = 'string-row';
            const label3 = document.createElement('div');
            label3.className = 'string-label';
            label3.innerText = 'Stack';
            row3.appendChild(label3);
            if (step.stack && step.stack.length > 0) {
                step.stack.forEach((dir, pos) => {
                    const unit = document.createElement('div');
                    unit.className = 'tile-unit';
                    const tile = document.createElement('div');
                    tile.className = `tile valid-pal`;
                    tile.innerText = dir;
                    const idxLabel = document.createElement('div');
                    idxLabel.className = 'tile-index';
                    idxLabel.innerText = `[${pos}]`;
                    unit.append(tile, idxLabel);
                    row3.appendChild(unit);
                });
            } else {
                const empty = document.createElement('div');
                empty.style.fontFamily = 'monospace';
                empty.style.color = 'var(--text-dim)';
                empty.innerText = '(empty)';
                row3.appendChild(empty);
            }
            container.appendChild(row3);

            document.getElementById('main-panel').innerHTML = step.panel || '—';

            document.getElementById('val-token').innerText = `"${step.token || ''}"`;
            document.getElementById('val-stack').innerText = JSON.stringify(step.stack || []);
            document.getElementById('val-action').innerText = step.type === 'push' ? 'Push' : (step.type === 'pop' ? 'Pop' : (step.type === 'ignore' ? 'Ignore' : '—'));
            document.getElementById('val-result').innerText = step.resultStr || '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? `"${step.finalResult}"` : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
