<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Common Substring of K Strings - Brute Force Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --border-main: #30363d;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-orange: #e3b341;
            --accent-red: #f85149;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg-page); color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0; padding: 20px 0; display: flex; flex-direction: column; align-items: center;
        }
        .input-bar {
            background: var(--bg-surface); padding: 12px 20px; border-radius: 8px;
            border: 1px solid var(--border-main); display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            margin-bottom: 24px;
        }
        input[type="text"] {
            background: #0d1117; border: 1px solid var(--border-main); color: var(--text-main);
            padding: 8px 12px; border-radius: 6px; width: 420px; font-family: monospace;
        }
        button {
            padding: 8px 16px; background: #21262d; border: 1px solid var(--border-main);
            color: var(--text-main); border-radius: 6px; cursor: pointer;
        }
        button:hover { background: #30363d; }

        .strings-container {
            display: flex; flex-direction: column; gap: 16px; width: 720px;
        }
        .string-row {
            background: var(--bg-surface); padding: 12px 16px; border-radius: 8px;
            border: 1px solid var(--border-main);
        }
        .string-label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
        .tiles { display: flex; gap: 5px; flex-wrap: wrap; }
        .tile {
            width: 38px; height: 48px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 5px;
            font-size: 16px; font-weight: 700; font-family: monospace;
            transition: all 0.25s; border: 2px solid var(--border-main);
            background: #21262d;
        }
        .tile.current { border-color: var(--accent-purple); background: #1e1030; transform: scale(1.1); }
        .tile.common { border-color: var(--accent-green); }

        .action-panel {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 18px 24px; margin: 20px 0; min-height: 110px;
            font-family: monospace; line-height: 1.5; width: 720px;
        }

        .result-box {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 14px 20px; width: 720px; margin: 16px 0;
            font-family: monospace;
        }

        .controls {
            margin: 24px 0; display: flex; gap: 12px; align-items: center;
        }
        input[type="range"] { width: 160px; accent-color: var(--accent-purple); }

        .log-panel {
            width: 720px; height: 180px; overflow-y: auto; background: #0d1117;
            border: 1px solid var(--border-main); border-radius: 8px; padding: 14px;
            font-family: monospace; font-size: 13px; line-height: 1.45;
        }
        .legend {
            display: flex; gap: 24px; margin: 20px 0; font-size: 13px; color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label>Strings (comma separated):</label>
        <input type="text" id="input-strs" value="abcdef,abcfgh,abcxyz">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1</button>
        <button onclick="loadExample(1)">Ex 2</button>
    </div>

    <div style="font-family:monospace;color:var(--accent-purple);margin-bottom:12px;">
        Brute Force — Generate Substrings from Shortest → Check in All Others
    </div>

    <div class="strings-container" id="strings-container"></div>

    <div class="action-panel" id="action-panel">
        Click Play / Next to start...
    </div>

    <div class="result-box" id="result-box">
        <strong>Longest Common Substring:</strong> <span id="longest-result" style="color:var(--accent-green);font-size:18px"></span>
    </div>

    <div class="controls">
        <button onclick="resetViz()">Reset</button>
        <button onclick="stepBack()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="stepForward()">Next →</button>
        <span style="margin-left:20px;color:var(--text-dim)">Speed</span>
        <input type="range" id="speed" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div><span style="color:var(--accent-purple)">■</span> Current Substring Range</div>
        <div><span style="color:var(--accent-green)">■</span> Common Substring Found</div>
    </div>

    <div class="log-panel" id="log-panel"></div>

    <script>
        let strings = ["abcdef", "abcfgh", "abcxyz"];
        let steps = [];
        let stepIdx = 0;
        let timer = null;
        const delays = [1350, 680, 320];

        function generateSteps() {
            steps = [];
            if (strings.length === 0) return;

            // Find shortest
            let shortestIdx = 0;
            for (let i = 1; i < strings.length; i++) {
                if (strings[i].length < strings[shortestIdx].length) shortestIdx = i;
            }
            const shortest = strings[shortestIdx];
            const n = shortest.length;

            let maxLen = 0;
            let bestSub = "";

            steps.push({
                type: 'init',
                shortest: shortest,
                panel: `Shortest string: <b>"${shortest}"</b> (index ${shortestIdx})`,
                log: `Identified shortest string for generating candidates`,
                highlight: []
            });

            for (let len = n; len >= 1; len--) {
                for (let start = 0; start <= n - len; start++) {
                    const substr = shortest.substring(start, start + len);
                    let isCommon = true;

                    steps.push({
                        type: 'check',
                        substr: substr,
                        start: start,
                        len: len,
                        panel: `Candidate: "<b>${substr}</b>" (length ${len})`,
                        log: `Check substring "${substr}" from shortest`,
                        highlight: Array.from({length: len}, (_, k) => start + k),
                        commonCheck: null
                    });

                    for (let k = 0; k < strings.length; k++) {
                        if (k === shortestIdx) continue;
                        if (!strings[k].includes(substr)) {
                            isCommon = false;
                            break;
                        }
                    }

                    if (isCommon && len > maxLen) {
                        maxLen = len;
                        bestSub = substr;
                        steps.push({
                            type: 'found',
                            substr: substr,
                            panel: `✅ Found common substring "<b>${substr}</b>" (length ${len})`,
                            log: `Common to all strings! New max length = ${len}`,
                            highlight: Array.from({length: len}, (_, k) => start + k)
                        });
                    }
                }
            }

            steps.push({
                type: 'final',
                substr: bestSub,
                panel: `✅ Longest common substring: "<b>${bestSub}</b>" (length ${maxLen})`,
                log: `Exploration complete. Final answer = "${bestSub}"`
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render all strings with highlights on shortest
            const container = document.getElementById('strings-container');
            container.innerHTML = '';
            strings.forEach((str, k) => {
                const row = document.createElement('div');
                row.className = 'string-row';
                row.innerHTML = `<div class="string-label">String ${k} (<b>"${str}"</b>)</div><div class="tiles" id="tiles-${k}"></div>`;
                container.appendChild(row);

                const tilesDiv = document.getElementById(`tiles-${k}`);
                for (let pos = 0; pos < str.length; pos++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.textContent = str[pos];
                    if (k === 0 && step.highlight && step.highlight.includes(pos)) { // assuming shortest is index 0 for simplicity in viz
                        tile.classList.add('current');
                    }
                    tilesDiv.appendChild(tile);
                }
            });

            document.getElementById('action-panel').innerHTML = step.panel;
            document.getElementById('longest-result').textContent = step.substr || '—';

            const logEl = document.getElementById('log-panel');
            logEl.innerHTML = steps.slice(0, idx+1).map(s => `<div>${s.log}</div>`).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function loadExample(ex) {
            strings = ex === 0 ? ["abcdef", "abcfgh", "abcxyz"] : ["hello", "world", "python"];
            document.getElementById('input-strs').value = strings.join(',');
            generateSteps();
            resetViz();
        }

        function loadCustom() {
            const input = document.getElementById('input-strs').value.trim();
            if (input) {
                strings = input.split(',').map(s => s.trim()).filter(Boolean);
                generateSteps();
                resetViz();
            }
        }

        function resetViz() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
            stepIdx = 0;
            renderStep(0);
        }

        function stepForward() {
            if (stepIdx < steps.length - 1) {
                stepIdx++;
                renderStep(stepIdx);
            }
        }

        function stepBack() {
            if (stepIdx > 0) {
                stepIdx--;
                renderStep(stepIdx);
            }
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                clearInterval(timer);
                timer = null;
                btn.textContent = '▶ Play';
            } else {
                btn.textContent = '⏸ Pause';
                timer = setInterval(() => {
                    if (stepIdx < steps.length - 1) stepForward();
                    else {
                        clearInterval(timer);
                        timer = null;
                        btn.textContent = '▶ Play';
                    }
                }, delays[parseInt(document.getElementById('speed').value)]);
            }
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
