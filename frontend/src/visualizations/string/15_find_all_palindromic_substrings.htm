<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find All Palindromic Substrings - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 240px; font-size: 14px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 860px; }
        .string-display {
            display: flex; gap: 6px; justify-content: center; padding: 20px;
            background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .tile {
            width: 48px; height: 58px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 6px;
            font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile .index { font-size: 9px; color: var(--text-dim); margin-top: 3px; }
        .tile.current { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.12); }
        .tile.expanding { border-color: var(--accent-orange); }
        .tile.pal { border-color: var(--accent-green); background: #0f2a1a; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; min-height: 92px; font-family: monospace;
            font-size: 14.5px; line-height: 1.55; text-align: center;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 17px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 18px; font-size: 26px; font-family: monospace; color: var(--accent-green); }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 12.5px; color: var(--text-dim); }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" value="aba">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("abc")</button>
        <button onclick="loadExample(1)">Ex 2 ("aba")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Expand Around Center – Count All Palindromic Substrings</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Center</span>
            <span class="info-value" id="val-center" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Radius</span>
            <span class="info-value" id="val-radius" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Total Palindromes</span>
            <span class="info-value" id="val-count" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Current Center</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Palindrome Found</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;border:2px solid var(--accent-orange);border-radius:4px"></span> Expanding</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "aba";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1100, 520, 240];

        function loadExample(ex) {
            currentS = ex === 0 ? "abc" : "aba";
            document.getElementById('str-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentS = document.getElementById('str-input').value.trim() || currentS;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let total = 0;
            let centersProcessed = 0;

            steps.push({
                type: 'init',
                center: -1,
                left: -1,
                right: -1,
                panel: `String: <b>"${currentS}"</b> (n=${n})`,
                statusText: 'Starting expand around centers...',
                log: 'Initialize count = 0',
                count: 0
            });

            // 2n-1 centers: odd and even
            for (let c = 0; c < 2 * n - 1; c++) {
                let left, right;
                if (c % 2 === 0) {
                    // odd length center at character
                    left = right = c / 2;
                } else {
                    // even length center between characters
                    left = (c - 1) / 2;
                    right = left + 1;
                }

                const isOddCenter = c % 2 === 0;
                let radius = 0;

                steps.push({
                    type: 'center',
                    center: c,
                    left: left,
                    right: right,
                    panel: `${isOddCenter ? 'Odd' : 'Even'} center at ${c} → expanding...`,
                    statusText: `Center ${c} (${isOddCenter ? 'char' : 'gap'})`,
                    log: `Start center ${c} (left=${left}, right=${right})`,
                    count: total
                });

                // Expand
                while (left >= 0 && right < n && currentS[left] === currentS[right]) {
                    total++;
                    radius++;

                    steps.push({
                        type: 'expand',
                        center: c,
                        left: left,
                        right: right,
                        panel: `Match → palindrome from ${left} to ${right} ("${currentS.slice(left, right+1)}")`,
                        statusText: `Expanded to radius ${radius}`,
                        log: `Found "${currentS.slice(left, right+1)}"`,
                        count: total
                    });

                    left--;
                    right++;
                }
            }

            steps.push({
                type: 'final',
                center: -1,
                left: -1,
                right: -1,
                panel: `✅ Total palindromic substrings: <b>${total}</b>`,
                statusText: 'Completed',
                log: `\nFinal count: ${total}`,
                count: total
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Tiles
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            for (let k = 0; k < currentS.length; k++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<span>${currentS[k]}</span><span class="index">${k}</span>`;
                if (step.left !== undefined && k >= step.left && k <= step.right) {
                    tile.classList.add('pal');
                }
                if (step.center !== -1) {
                    if ((step.center % 2 === 0 && k === step.center / 2) ||
                        (step.center % 2 === 1 && (k === Math.floor(step.center / 2) || k === Math.floor(step.center / 2) + 1))) {
                        tile.classList.add('current');
                    }
                }
                container.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-center').innerText = step.center >= 0 ? step.center : '—';
            document.getElementById('val-radius').innerText = step.left >= 0 ? (step.right - step.left + 1) : '—';
            document.getElementById('val-count').innerText = step.count;

            document.getElementById('res-val').innerText = steps[steps.length-1].count;

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const line = document.createElement('div');
                line.style.marginBottom = '4px';
                line.innerText = steps[k].log || '';
                logPanel.appendChild(line);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value | 0]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = () => { loadExample(1); };
    </script>
</body>
</html>
