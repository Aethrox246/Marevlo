<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Unique Characters - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 320px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 80px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" placeholder='"abcde"'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("abcde")</button>
        <button onclick="loadExample(1)">Ex 2 ("hello")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force – Nested Loop Pairwise Comparison</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Outer i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Inner j</span>
            <span class="info-value" id="val-j" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Compare</span>
            <span class="info-value" id="val-compare" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Result</span>
            <span class="info-value" id="val-result" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">All Unique =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> i (Reference)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> j (Compare)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Different</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Duplicate Found</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            currentS = (exIndex === 0) ? "abcde" : "hello";
            document.getElementById('str-input').value = `"${currentS}"`;
            generateSteps();
            reset();
        }

        function loadCustom() {
            let val = document.getElementById('str-input').value.trim();
            if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
            currentS = val || "";
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;

            // INIT
            steps.push({
                type: 'init',
                i: -1,
                j: -1,
                states: Array(n).fill('idle'),
                panel: `String: <b>"${currentS}"</b><br>Length = <b>${n}</b>`,
                statusText: `Starting pairwise comparison...`,
                log: `Initialize:\ns = "${currentS}"\nChecking all pairs (i < j)`
            });

            let hasDuplicate = false;
            let duplicateI = -1;
            let duplicateJ = -1;

            for (let i = 0; i < n - 1; i++) {
                let states = Array(n).fill('idle');
                states[i] = 'center';

                steps.push({
                    type: 'outer',
                    i: i,
                    j: -1,
                    states: states,
                    panel: `i = <b>${i}</b> ('${currentS[i]}')`,
                    statusText: `Outer loop: checking character at ${i}`,
                    log: `  i=${i} ('${currentS[i]}')`
                });

                for (let j = i + 1; j < n; j++) {
                    states = Array(n).fill('idle');
                    states[i] = 'center';
                    states[j] = 'expanding';

                    steps.push({
                        type: 'inner',
                        i: i,
                        j: j,
                        states: states,
                        panel: `Comparing s[${i}]='${currentS[i]}' with s[${j}]='${currentS[j]}'`,
                        statusText: `Comparing positions ${i} and ${j}`,
                        log: `    j=${j}: '${currentS[i]}' vs '${currentS[j]}'`
                    });

                    if (currentS[i] === currentS[j]) {
                        hasDuplicate = true;
                        duplicateI = i;
                        duplicateJ = j;
                        states[i] = 'mismatch';
                        states[j] = 'mismatch';

                        steps.push({
                            type: 'mismatch',
                            i: i,
                            j: j,
                            states: states,
                            panel: `<span style="color:var(--accent-red)">Duplicate found: '${currentS[i]}' at positions ${i} and ${j}</span>`,
                            statusText: `Duplicate found!`,
                            log: `  → Duplicate '${currentS[i]}' at ${i} and ${j}`
                        });
                        break;
                    } else {
                        states[i] = 'valid-pal';
                        states[j] = 'valid-pal';

                        steps.push({
                            type: 'match',
                            i: i,
                            j: j,
                            states: states,
                            panel: `<span style="color:var(--accent-green)">Different → continue</span>`,
                            statusText: `Characters are different`,
                            log: `  → Different`
                        });
                    }
                }
                if (hasDuplicate) break;
            }

            // FINAL
            let finalStates = Array(n).fill('valid-pal');
            if (hasDuplicate) {
                finalStates[duplicateI] = 'mismatch';
                finalStates[duplicateJ] = 'mismatch';
            }

            steps.push({
                type: 'final',
                i: n-1,
                j: n-1,
                states: finalStates,
                complete: true,
                finalResult: !hasDuplicate,
                panel: !hasDuplicate ? 
                    `<span style="color:var(--accent-green)">All characters are unique.<br><b>YES</b></span>` : 
                    `<span style="color:var(--accent-red)">Duplicate characters found.<br><b>NO</b></span>`,
                statusText: `Finished. Result: ${!hasDuplicate ? 'YES' : 'NO'}`,
                log: `\nFinal Result: ${!hasDuplicate ? 'YES' : 'NO'}`,
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const rowDiv = document.createElement('div');
            rowDiv.className = 'string-row';

            const label = document.createElement('div');
            label.className = 'string-label';
            label.innerText = 's';
            rowDiv.appendChild(label);

            currentS.split('').forEach((char, colIdx) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile ${step.states[colIdx] || 'idle'}`;
                tile.innerText = char;

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${colIdx}]`;

                unit.append(tile, idxLabel);
                rowDiv.appendChild(unit);
            });

            container.appendChild(rowDiv);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-j').innerText = step.j !== undefined ? step.j : '—';
            document.getElementById('val-compare').innerText = (step.i !== undefined && step.j !== undefined && step.i >= 0 && step.j >= 0) ? 
                `'${currentS[step.i]}' vs '${currentS[step.j]}'` : '—';
            document.getElementById('val-result').innerText = step.complete ? (step.finalResult ? 'YES' : 'NO') : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult ? 'YES' : 'NO';
                resVal.style.color = step.finalResult ? 'var(--accent-green)' : 'var(--accent-red)';
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.style.color = 'var(--text-dim)';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
