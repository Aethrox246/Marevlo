<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Partitioning (Min Cuts) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 220px; font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 860px; }
        .string-display {
            display: flex; gap: 6px; justify-content: center; padding: 24px;
            background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .tile {
            width: 52px; height: 62px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 8px;
            font-size: 22px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile .index { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.1); }
        .tile.pal { background: #0f2a1a; border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.cut { background: #2a1f0d; border-color: var(--accent-orange); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; min-height: 110px; font-family: monospace;
            font-size: 14.5px; line-height: 1.55; text-align: center;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 140px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 18px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 18px; font-size: 26px; font-family: monospace; color: var(--accent-green); }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); min-height: 24px; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 12.5px; color: var(--text-dim); }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" value="aab">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("aab")</button>
        <button onclick="loadExample(1)">Ex 2 ("abc")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">DP + Expand-Around-Center – Min Palindrome Cuts</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Palindrome Range</span>
            <span class="info-value" id="val-range" style="color:var(--accent-green)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Min Cuts</span>
            <span class="info-value" id="val-cuts" style="color:var(--accent-orange)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Current Position</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Valid Palindrome</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-orange);border-radius:4px"></span> Cut Position</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "aab";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1350, 680, 310];

        function loadExample(ex) {
            currentS = ex === 0 ? "aab" : "abc";
            document.getElementById('str-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentS = document.getElementById('str-input').value.trim() || currentS;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let isPal = Array.from({length: n}, () => Array(n).fill(false));
            let minCuts = Array(n).fill(0);

            steps.push({
                type: 'init',
                panel: `String: <b>"${currentS}"</b> (n=${n})`,
                statusText: 'Initializing DP tables...',
                log: 'Start: Computing isPal table and minCuts',
                i: -1,
                range: '',
                cuts: ''
            });

            // Build isPal table
            for (let i = 0; i < n; i++) {
                isPal[i][i] = true;
                steps.push({
                    type: 'single',
                    panel: `Single char at ${i}: "${currentS[i]}" is palindrome`,
                    statusText: `isPal[${i}][${i}] = true`,
                    log: `Single: isPal[${i}][${i}] = true`,
                    i: i,
                    range: `${i}-${i}`,
                    cuts: ''
                });
            }

            // Length 2
            for (let i = 0; i < n-1; i++) {
                if (currentS[i] === currentS[i+1]) {
                    isPal[i][i+1] = true;
                    steps.push({
                        type: 'pal2',
                        panel: `Length 2: "${currentS.substring(i,i+2)}" is palindrome`,
                        statusText: `isPal[${i}][${i+1}] = true`,
                        log: `Length 2: isPal[${i}][${i+1}] = true`,
                        i: i,
                        range: `${i}-${i+1}`,
                        cuts: ''
                    });
                }
            }

            // Length >=3
            for (let len = 3; len <= n; len++) {
                for (let i = 0; i <= n-len; i++) {
                    let j = i + len - 1;
                    if (currentS[i] === currentS[j] && isPal[i+1][j-1]) {
                        isPal[i][j] = true;
                        steps.push({
                            type: 'pal',
                            panel: `Found palindrome "${currentS.substring(i,j+1)}"`,
                            statusText: `isPal[${i}][${j}] = true`,
                            log: `isPal[${i}][${j}] = true`,
                            i: i,
                            range: `${i}-${j}`,
                            cuts: ''
                        });
                    }
                }
            }

            // Min Cuts DP
            for (let i = 0; i < n; i++) minCuts[i] = i;

            for (let i = 0; i < n; i++) {
                for (let j = 0; j <= i; j++) {
                    if (isPal[j][i]) {
                        const newCuts = (j === 0 ? 0 : minCuts[j-1] + 1);
                        if (newCuts < minCuts[i]) {
                            minCuts[i] = newCuts;
                            steps.push({
                                type: 'cut',
                                panel: `Better cut: s[${j}:${i+1}] is palindrome → cuts[${i}] = ${newCuts}`,
                                statusText: `Updated minCuts[${i}] = ${newCuts}`,
                                log: `Update: minCuts[${i}] = ${newCuts}`,
                                i: i,
                                range: `${j}-${i}`,
                                cuts: minCuts.join(',')
                            });
                        }
                    }
                }
            }

            steps.push({
                type: 'final',
                panel: `Minimum cuts needed: <b>${minCuts[n-1]}</b>`,
                statusText: `Final answer: ${minCuts[n-1]}`,
                log: `\nDone! Minimum cuts = ${minCuts[n-1]}`,
                i: n-1,
                range: '',
                cuts: minCuts.join(','),
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            for (let k = 0; k < currentS.length; k++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<span>${currentS[k]}</span><span class="index">[${k}]</span>`;

                if (step.range) {
                    const [start, end] = step.range.split('-').map(Number);
                    if (k >= start && k <= end) {
                        if (step.type === 'pal' || step.type === 'pal2' || step.type === 'single') tile.classList.add('pal');
                        else if (step.type === 'cut') tile.classList.add('cut');
                    }
                }
                if (step.i === k) tile.classList.add('center');

                container.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-range').innerText = step.range || '—';
            document.getElementById('val-cuts').innerText = step.cuts || '—';

            const res = document.getElementById('res-val');
            res.innerText = step.complete ? `Min Cuts = ${step.cuts ? step.cuts.split(',').pop() : '—'}` : '—';

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const line = document.createElement('div');
                line.style.marginBottom = '4px';
                line.innerText = steps[k].log || '';
                logPanel.appendChild(line);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = '⏸ Pause';
                timer = setInterval(next, delays[document.getElementById('speed-slider').value | 0]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = () => { loadExample(0); };
    </script>
</body>
</html>
