<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Version Numbers - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 180px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 16px; justify-content: center; position: relative; padding: 20px 0; }
        
        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 80px;
            text-align: right;
        }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 700px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">v1 =</label>
        <input type="text" id="v1-input" placeholder="1.01">
        <label class="ui-label">v2 =</label>
        <input type="text" id="v2-input" placeholder="1.001">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 ("1.01" vs "1.001")</button>
        <button onclick="loadExample(2)">Ex 2 ("1.0" vs "1.0.0")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Split & Compare Revisions (missing = 0)</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Revision</span>
            <span class="info-value" id="val-rev" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">rev1 Value</span>
            <span class="info-value" id="val-rev1" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">rev2 Value</span>
            <span class="info-value" id="val-rev2" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Comparison</span>
            <span class="info-value" id="val-cmp" style="color: var(--accent-orange);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">compare(v1, v2) =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Revision Index</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Equal Revisions</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Difference Found</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentV1 = "1.01";
        let currentV2 = "1.001";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentV1 = "1.01";
                currentV2 = "1.001";
            } else {
                currentV1 = "1.0";
                currentV2 = "1.0.0";
            }
            document.getElementById('v1-input').value = currentV1;
            document.getElementById('v2-input').value = currentV2;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const v1Val = document.getElementById('v1-input').value.trim();
            const v2Val = document.getElementById('v2-input').value.trim();
            if (v1Val && v2Val) {
                currentV1 = v1Val;
                currentV2 = v2Val;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            const revs1 = currentV1.split('.');
            const revs2 = currentV2.split('.');
            const maxLen = Math.max(revs1.length, revs2.length);

            // INIT
            steps.push({
                type: 'init',
                revIndex: -1,
                rev1: '—',
                rev2: '—',
                cmp: 0,
                states1: Array(currentV1.length).fill('idle'),
                states2: Array(currentV2.length).fill('idle'),
                panel: `v1 = <b>"${currentV1}"</b> → revisions [${revs1.join(', ')}]<br>v2 = <b>"${currentV2}"</b> → revisions [${revs2.join(', ')}]<br>Comparing revision by revision...`,
                statusText: `Splitting versions and starting comparison`,
                log: `Compare "${currentV1}" and "${currentV2}"`
            });

            let result = 0;

            for (let i = 0; i < maxLen; i++) {
                const r1Str = i < revs1.length ? revs1[i] : "0";
                const r2Str = i < revs2.length ? revs2[i] : "0";
                const r1 = parseInt(r1Str);
                const r2 = parseInt(r2Str);

                let cmp = 0;
                if (r1 < r2) cmp = -1;
                else if (r1 > r2) cmp = 1;

                if (cmp !== 0) {
                    result = cmp;
                }

                let states1 = Array(currentV1.length).fill('idle');
                let states2 = Array(currentV2.length).fill('idle');

                // Rough highlighting of current revision parts
                if (i < revs1.length) {
                    let start = 0;
                    for (let k = 0; k < i; k++) start += revs1[k].length + 1;
                    for (let k = start; k < start + revs1[i].length; k++) {
                        if (k < states1.length) states1[k] = 'center';
                    }
                }
                if (i < revs2.length) {
                    let start = 0;
                    for (let k = 0; k < i; k++) start += revs2[k].length + 1;
                    for (let k = start; k < start + revs2[i].length; k++) {
                        if (k < states2.length) states2[k] = 'center';
                    }
                }

                steps.push({
                    type: 'compare',
                    revIndex: i,
                    rev1: r1,
                    rev2: r2,
                    cmp: cmp,
                    states1: states1,
                    states2: states2,
                    panel: `Revision <b>${i}</b><br>v1: <b>${r1}</b> (from "${r1Str}")<br>v2: <b>${r2}</b> (from "${r2Str}")<br>Comparison: <b>${cmp === 0 ? 'equal' : (cmp === 1 ? 'v1 > v2' : 'v1 < v2')}</b>`,
                    statusText: `Comparing revision ${i}: ${r1} vs ${r2}`,
                    log: `  Revision ${i}: ${r1} vs ${r2} → ${cmp === 0 ? 'equal' : (cmp === 1 ? 'v1 bigger' : 'v2 bigger')}`
                });

                if (cmp !== 0) break; // early stop in real code, but show all for visualization
            }

            // FINAL
            steps.push({
                type: 'final',
                revIndex: maxLen,
                rev1: '—',
                rev2: '—',
                cmp: result,
                states1: Array(currentV1.length).fill('valid-pal'),
                states2: Array(currentV2.length).fill('valid-pal'),
                panel: `All revisions compared.<br>Final result: <b>${result}</b>`,
                statusText: `Comparison complete → ${result}`,
                log: `\nFinal Result: ${result}`,
                complete: true,
                finalResult: result
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Row for v1
            const row1 = document.createElement('div');
            row1.className = 'string-row';
            const label1 = document.createElement('div');
            label1.className = 'string-label';
            label1.innerText = 'v1';
            row1.appendChild(label1);

            currentV1.split('').forEach((char, k) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${step.states1[k] || 'idle'}`;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${k}]`;
                unit.append(tile, idxLabel);
                row1.appendChild(unit);
            });
            container.appendChild(row1);

            // Row for v2
            const row2 = document.createElement('div');
            row2.className = 'string-row';
            const label2 = document.createElement('div');
            label2.className = 'string-label';
            label2.innerText = 'v2';
            row2.appendChild(label2);

            currentV2.split('').forEach((char, k) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${step.states2[k] || 'idle'}`;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${k}]`;
                unit.append(tile, idxLabel);
                row2.appendChild(unit);
            });
            container.appendChild(row2);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-rev').innerText = step.revIndex;
            document.getElementById('val-rev1').innerText = step.rev1;
            document.getElementById('val-rev2').innerText = step.rev2;
            document.getElementById('val-cmp').innerText = step.cmp;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
