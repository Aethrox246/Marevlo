<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Most Common Word (Ignore Punctuation) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 520px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 130px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">params =</label>
        <input type="text" id="str-input" placeholder='{"paragraph":"Bob hit a ball, the hit BALL flew far after it was hit.","banned":["hit"]}'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("Bob hit...")</button>
        <button onclick="loadExample(1)">Ex 2 ("a, a, a...")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force: Clean → Split → Count frequencies → Find most common (non-banned)</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Word</span>
            <span class="info-value" id="val-word" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Action</span>
            <span class="info-value" id="val-action" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Count</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max So Far</span>
            <span class="info-value" id="val-max" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">most common word =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Word</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Processing</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Count / Max</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Banned / Ignored</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentParagraph = "Bob hit a ball, the hit BALL flew far after it was hit.";
        let currentBanned = ["hit"];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1300, 650, 325];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentParagraph = "Bob hit a ball, the hit BALL flew far after it was hit.";
                currentBanned = ["hit"];
            } else {
                currentParagraph = "a, a, a, a, b,b,b,c, c";
                currentBanned = ["a"];
            }
            document.getElementById('str-input').value = JSON.stringify({
                paragraph: currentParagraph,
                banned: currentBanned
            });
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const val = document.getElementById('str-input').value.trim();
                const parsed = JSON.parse(val);
                currentParagraph = parsed.paragraph || "";
                currentBanned = parsed.banned || [];
                generateSteps();
                reset();
            } catch(e) {
                alert("Please enter valid JSON like {\"paragraph\":\"Bob hit a ball, the hit BALL flew far after it was hit.\",\"banned\":[\"hit\"]}");
            }
        }

        function cleanParagraph(paragraph) {
            // Convert to lowercase and replace punctuation with space
            let cleaned = paragraph.toLowerCase();
            cleaned = cleaned.replace(/[^a-z\s]/g, ' ');
            return cleaned.trim();
        }

        function getWords(paragraph) {
            const cleaned = cleanParagraph(paragraph);
            return cleaned.split(/\s+/).filter(w => w.length > 0);
        }

        function generateSteps() {
            steps = [];
            const words = getWords(currentParagraph);
            const bannedSet = new Set(currentBanned.map(w => w.toLowerCase()));
            let freq = {};
            let maxCount = 0;
            let resultWord = "";

            // INIT
            steps.push({
                type: 'init',
                word: '',
                count: 0,
                freq: {},
                panel: `Paragraph: <b>"${currentParagraph}"</b><br>Banned: <b>${JSON.stringify(currentBanned)}</b>`,
                statusText: `Cleaning paragraph and splitting into words...`,
                log: `Problem initialized.\nParagraph = "${currentParagraph}"\nBanned = ${JSON.stringify(currentBanned)}\nWords after clean/split: ${JSON.stringify(words)}`,
                resultStr: ""
            });

            // Process each word
            for (let i = 0; i < words.length; i++) {
                const word = words[i];

                steps.push({
                    type: 'process-word',
                    word: word,
                    count: 0,
                    freq: {...freq},
                    panel: `Current word: <b>"${word}"</b>`,
                    statusText: `Processing word "${word}"...`,
                    log: `  Word "${word}"`
                });

                if (bannedSet.has(word)) {
                    steps.push({
                        type: 'banned',
                        word: word,
                        count: 0,
                        freq: {...freq},
                        panel: `<span style="color:var(--accent-red)">Banned word → skip</span>`,
                        statusText: `"${word}" is banned`,
                        log: `    → Banned, skipped`
                    });
                    continue;
                }

                // Count how many times this word appears (brute force scan)
                let currentCount = 0;
                for (let j = 0; j < words.length; j++) {
                    if (words[j] === word) currentCount++;
                }

                freq[word] = (freq[word] || 0) + 1; // but for visualization we show full count

                steps.push({
                    type: 'count',
                    word: word,
                    count: currentCount,
                    freq: {...freq},
                    panel: `Count of "${word}": <b>${currentCount}</b>`,
                    statusText: `Full count of "${word}" = ${currentCount}`,
                    log: `    → Count = ${currentCount}`
                });

                if (currentCount > maxCount) {
                    maxCount = currentCount;
                    resultWord = word;
                    steps.push({
                        type: 'new-max',
                        word: word,
                        count: currentCount,
                        freq: {...freq},
                        panel: `<span style="color:var(--accent-green)">New max!</span> "${word}" with count <b>${currentCount}</b>`,
                        statusText: `New maximum: "${word}"`,
                        log: `    → New max! Updated result to "${word}"`
                    });
                }
            }

            // FINAL
            steps.push({
                type: 'final',
                word: resultWord,
                count: maxCount,
                freq: freq,
                panel: `All words processed.<br>Most common non-banned word = <b>"${resultWord}"</b> (count: ${maxCount})`,
                complete: true,
                finalResult: resultWord,
                statusText: `Done. Most common word: "${resultWord}"`,
                log: `\nFinal Result: "${resultWord}"`,
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Row 1: Original Paragraph (as text, not tiles)
            const row1 = document.createElement('div');
            row1.className = 'string-row';
            const label1 = document.createElement('div');
            label1.className = 'string-label';
            label1.innerText = 'Paragraph';
            row1.appendChild(label1);
            const paraDiv = document.createElement('div');
            paraDiv.style.fontFamily = 'monospace';
            paraDiv.style.color = 'var(--text-main)';
            paraDiv.style.padding = '8px 12px';
            paraDiv.style.border = '1px solid var(--border-main)';
            paraDiv.style.borderRadius = '6px';
            paraDiv.style.flex = '1';
            paraDiv.innerText = currentParagraph;
            row1.appendChild(paraDiv);
            container.appendChild(row1);

            // Row 2: Current Word being processed
            const row2 = document.createElement('div');
            row2.className = 'string-row';
            const label2 = document.createElement('div');
            label2.className = 'string-label';
            label2.innerText = 'Current Word';
            row2.appendChild(label2);
            const wordTileUnit = document.createElement('div');
            wordTileUnit.className = 'tile-unit';
            const wordTile = document.createElement('div');
            wordTile.className = `tile ${step.type === 'banned' ? 'mismatch' : (step.type === 'new-max' ? 'valid-pal' : 'center')}`;
            wordTile.innerText = step.word || '(none)';
            wordTileUnit.appendChild(wordTile);
            row2.appendChild(wordTileUnit);
            container.appendChild(row2);

            document.getElementById('main-panel').innerHTML = step.panel || '—';

            document.getElementById('val-word').innerText = `"${step.word || ''}"`;
            document.getElementById('val-action').innerText = step.type === 'banned' ? 'BANNED' : (step.type === 'new-max' ? 'NEW MAX' : 'Counted');
            document.getElementById('val-count').innerText = step.count !== undefined ? step.count : '—';
            document.getElementById('val-max').innerText = step.word ? `"${step.word}" (${step.count})` : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? `"${step.finalResult}"` : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
