<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valid Parentheses - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 520px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 130px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">params =</label>
        <input type="text" id="str-input" placeholder='{"s":"()[]{}"}'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("()[]{}")</button>
        <button onclick="loadExample(1)">Ex 2 ("([)]")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Stack-Based Validation: Push opening brackets, pop on matching closing</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Char</span>
            <span class="info-value" id="val-char" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Action</span>
            <span class="info-value" id="val-action" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Stack</span>
            <span class="info-value" id="val-stack" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Valid?</span>
            <span class="info-value" id="val-valid" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">is valid =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Char</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Push / Pop</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Match / Valid</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Mismatch</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "()[]{}";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1100, 550, 275];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentS = "()[]{}";
            } else {
                currentS = "([)]";
            }
            document.getElementById('str-input').value = JSON.stringify(currentS);
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const val = document.getElementById('str-input').value.trim();
                currentS = JSON.parse(val) || val;
                if (typeof currentS !== 'string') currentS = String(currentS);
                generateSteps();
                reset();
            } catch(e) {
                alert("Please enter a valid bracket string like \"()[]{}\".");
            }
        }

        function generateSteps() {
            steps = [];
            const mapping = {')': '(', ']': '[', '}': '{'};
            let stack = [];

            // INIT
            steps.push({
                type: 'init',
                char: '',
                stack: [],
                panel: `String: <b>"${currentS}"</b><br>Use stack to match brackets`,
                statusText: `Starting validation...`,
                log: `Start validation.\ns = "${currentS}"`,
                valid: false
            });

            for (let i = 0; i < currentS.length; i++) {
                const ch = currentS[i];

                steps.push({
                    type: 'process',
                    char: ch,
                    stack: [...stack],
                    panel: `Current character: <b>${ch}</b>`,
                    statusText: `Processing char '${ch}' at index ${i}`,
                    log: `  Char '${ch}'`
                });

                if (ch === '(' || ch === '[' || ch === '{') {
                    stack.push(ch);
                    steps.push({
                        type: 'push',
                        char: ch,
                        stack: [...stack],
                        panel: `Opening bracket <b>${ch}</b> → <span style="color:var(--accent-blue)">push to stack</span>`,
                        statusText: `Push opening bracket`,
                        log: `    → Push → stack: ${JSON.stringify(stack)}`
                    });
                } else {
                    // closing bracket
                    if (stack.length === 0 || stack[stack.length - 1] !== mapping[ch]) {
                        steps.push({
                            type: 'mismatch',
                            char: ch,
                            stack: [...stack],
                            panel: `<span style="color:var(--accent-red)">Mismatch!</span> Expected ${stack.length ? stack[stack.length-1] : 'nothing'} but got ${ch}`,
                            statusText: `Invalid closing bracket`,
                            log: `    → Mismatch → return false`,
                            valid: false
                        });
                        // Early final for mismatch
                        steps.push({
                            type: 'final',
                            panel: `Invalid sequence → return <b>false</b>`,
                            complete: true,
                            finalResult: false,
                            statusText: `Invalid: mismatch found`,
                            log: `\nResult: false`,
                            bold: true,
                            valid: false
                        });
                        return;
                    } else {
                        const popped = stack.pop();
                        steps.push({
                            type: 'pop',
                            char: ch,
                            stack: [...stack],
                            panel: `Closing bracket <b>${ch}</b> matches top <b>${popped}</b> → <span style="color:var(--accent-green)">pop</span>`,
                            statusText: `Matched and popped`,
                            log: `    → Match → pop → stack: ${JSON.stringify(stack)}`
                        });
                    }
                }
            }

            const isValid = stack.length === 0;
            steps.push({
                type: 'final',
                panel: isValid ? 
                    `Stack empty → all brackets matched → <b>true</b>` : 
                    `Stack not empty → unmatched openings → <b>false</b>`,
                complete: true,
                finalResult: isValid,
                statusText: `Finished. Valid: ${isValid}`,
                log: `\nResult: ${isValid}`,
                bold: true,
                valid: isValid
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Row 1: Original string with current position highlighted
            const row1 = document.createElement('div');
            row1.className = 'string-row';
            const label1 = document.createElement('div');
            label1.className = 'string-label';
            label1.innerText = 'String';
            row1.appendChild(label1);

            currentS.split('').forEach((ch, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'idle';
                if (step.char === ch && step.type === 'process') cls = 'center';
                if (step.type === 'pop' && currentS[pos] === step.char) cls = 'valid-pal';
                if (step.type === 'mismatch' && currentS[pos] === step.char) cls = 'mismatch';
                tile.className = `tile ${cls}`;
                tile.innerText = ch;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = pos;
                unit.appendChild(tile);
                unit.appendChild(idxLabel);
                row1.appendChild(unit);
            });
            container.appendChild(row1);

            // Row 2: Stack visualization
            const rowStack = document.createElement('div');
            rowStack.className = 'string-row';
            const labelStack = document.createElement('div');
            labelStack.className = 'string-label';
            labelStack.innerText = 'Stack';
            rowStack.appendChild(labelStack);

            const stackTiles = document.createElement('div');
            stackTiles.style.display = 'flex';
            stackTiles.style.gap = '6px';
            (step.stack || []).forEach((item, idx) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${idx === (step.stack.length - 1) ? 'center' : 'idle'}`;
                tile.innerText = item;
                unit.appendChild(tile);
                stackTiles.appendChild(unit);
            });
            if ((step.stack || []).length === 0) {
                const empty = document.createElement('div');
                empty.style.fontSize = '13px';
                empty.style.color = 'var(--text-dim)';
                empty.innerText = '(empty)';
                stackTiles.appendChild(empty);
            }
            rowStack.appendChild(stackTiles);
            container.appendChild(rowStack);

            document.getElementById('main-panel').innerHTML = step.panel || '—';

            document.getElementById('val-char').innerText = `"${step.char || ''}"`;
            document.getElementById('val-action').innerText = step.type === 'push' ? 'PUSH' : (step.type === 'pop' ? 'POP' : (step.type === 'mismatch' ? 'MISMATCH' : '—'));
            document.getElementById('val-stack').innerText = JSON.stringify(step.stack || []);
            document.getElementById('val-valid').innerText = step.valid !== undefined ? (step.valid ? 'YES' : 'NO') : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? (step.finalResult ? 'true' : 'false') : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
