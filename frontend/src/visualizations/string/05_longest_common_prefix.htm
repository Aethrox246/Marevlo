<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Common Prefix - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 320px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: VISUALIZATION TILES (now multi-row for multiple strings) */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        /* Highlight States (same as original) */
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        /* ROW for each string */
        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 80px;
            text-align: right;
        }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">strs =</label>
        <input type="text" id="str-input" placeholder='["flower","flow","flight"]'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (["flower","flow","flight"])</button>
        <button onclick="loadExample(1)">Ex 2 (["dog","racecar","car"])</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Vertical Scan – Character Position Comparison</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Position</span>
            <span class="info-value" id="val-pos" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Prefix</span>
            <span class="info-value" id="val-prefix" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Min Length</span>
            <span class="info-value" id="val-minlen" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Strings</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">0</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">longest common prefix =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Column</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Checking Position</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> All Match</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Mismatch (Stop)</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentStrs = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) currentStrs = ["flower", "flow", "flight"];
            else currentStrs = ["dog", "racecar", "car"];
            document.getElementById('str-input').value = JSON.stringify(currentStrs);
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const val = document.getElementById('str-input').value.trim();
                currentStrs = JSON.parse(val);
                if (!Array.isArray(currentStrs)) throw new Error();
                generateSteps();
                reset();
            } catch(e) {
                alert("Please enter a valid JSON array like [\"flower\",\"flow\",\"flight\"]");
            }
        }

        function generateSteps() {
            steps = [];
            if (!currentStrs || currentStrs.length === 0) {
                steps.push({
                    type: 'final',
                    prefix: '',
                    pos: 0,
                    complete: true,
                    finalResult: '',
                    panel: `No strings provided.<br>Longest common prefix = <b>""</b>`,
                    statusText: `Empty input → ""`,
                    log: `Input is empty. Result: ""`,
                    bold: true
                });
                return;
            }

            const n = currentStrs.length;
            let minLen = Math.min(...currentStrs.map(s => s.length));
            let prefix = '';

            // INIT
            steps.push({
                type: 'init',
                prefix: '',
                pos: -1,
                minLen: minLen,
                states: currentStrs.map(() => Array(minLen).fill('idle')),
                panel: `Strings: <b>${JSON.stringify(currentStrs)}</b><br>Shortest length: <b>${minLen}</b>`,
                statusText: `Starting vertical scan at position 0...`,
                log: `Problem initialized.\nStrings: ${JSON.stringify(currentStrs)}\nMin length: ${minLen}`
            });

            for (let pos = 0; pos < minLen; pos++) {
                // New position check
                const char0 = currentStrs[0][pos];
                let allMatch = true;

                steps.push({
                    type: 'check',
                    prefix: prefix,
                    pos: pos,
                    minLen: minLen,
                    states: currentStrs.map(str => {
                        const row = Array(minLen).fill('idle');
                        if (pos < str.length) row[pos] = 'center';
                        return row;
                    }),
                    panel: `Checking position <b>${pos}</b> (char '${char0}' from first string)`,
                    statusText: `Position ${pos}: comparing '${char0}' across all strings...`,
                    log: `  Pos ${pos}: checking '${char0}'`
                });

                // Check each string
                for (let i = 1; i < n; i++) {
                    if (pos >= currentStrs[i].length || currentStrs[i][pos] !== char0) {
                        allMatch = false;
                        break;
                    }
                }

                if (allMatch) {
                    prefix += char0;
                    steps.push({
                        type: 'match',
                        prefix: prefix,
                        pos: pos,
                        minLen: minLen,
                        states: currentStrs.map(str => {
                            const row = Array(minLen).fill('idle');
                            if (pos < str.length) row[pos] = 'valid-pal';
                            return row;
                        }),
                        panel: `<span style="color:var(--accent-green)">All match at pos ${pos} → prefix now "<b>${prefix}</b>"</span>`,
                        statusText: `All strings match '${char0}' at pos ${pos}`,
                        log: `  → Match! Prefix = "${prefix}"`
                    });
                } else {
                    steps.push({
                        type: 'mismatch',
                        prefix: prefix,
                        pos: pos,
                        minLen: minLen,
                        states: currentStrs.map(str => {
                            const row = Array(minLen).fill('idle');
                            if (pos < str.length) row[pos] = 'mismatch';
                            return row;
                        }),
                        panel: `<span style="color:var(--accent-red)">Mismatch at position ${pos}!</span><br>Stopping. Final prefix = "<b>${prefix}</b>"`,
                        statusText: `Mismatch found at pos ${pos} → stop`,
                        log: `  → Mismatch! Stop. Final prefix = "${prefix}"`
                    });
                    break;
                }
            }

            // FINAL
            steps.push({
                type: 'final',
                prefix: prefix,
                pos: minLen,
                complete: true,
                finalResult: prefix,
                panel: `All positions processed.<br>Longest common prefix = <b>"${prefix}"</b>`,
                statusText: `Done. Longest common prefix: "${prefix}"`,
                log: `\nFinal Result: "${prefix}"`,
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Render each string as a row
            currentStrs.forEach((str, rowIdx) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'string-row';

                // Label
                const label = document.createElement('div');
                label.className = 'string-label';
                label.innerText = `[${rowIdx}]`;
                rowDiv.appendChild(label);

                // Tiles for this string
                const rowStates = step.states ? step.states[rowIdx] : Array(str.length).fill('idle');
                str.split('').forEach((char, colIdx) => {
                    const unit = document.createElement('div');
                    unit.className = 'tile-unit';

                    const tile = document.createElement('div');
                    tile.className = `tile ${rowStates[colIdx] || 'idle'}`;
                    tile.innerText = char;

                    const idxLabel = document.createElement('div');
                    idxLabel.className = 'tile-index';
                    idxLabel.innerText = `[${colIdx}]`;

                    unit.append(tile, idxLabel);
                    rowDiv.appendChild(unit);
                });

                container.appendChild(rowDiv);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-pos').innerText = step.pos !== undefined ? step.pos : '—';
            document.getElementById('val-prefix').innerText = `"${step.prefix || ''}"`;
            document.getElementById('val-minlen').innerText = step.minLen || '—';
            document.getElementById('val-count').innerText = currentStrs.length;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? `"${step.finalResult}"` : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
