<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Prefix That Occurs at Least K Times - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-main);
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"], input[type="number"] {
            background: var(--bg-input); border: 1px solid var(--border-main); color: var(--text-main);
            height: 32px; border-radius: 6px; padding: 0 10px; font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 6px; justify-content: center; padding: 20px 0; flex-wrap: wrap; max-width: 900px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 17px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.prefix { background: #1e1030; border-color: var(--accent-purple); }
        .tile.center { transform: scale(1.15); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 780px; text-align: center; font-family: monospace; min-height: 140px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 140px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        #res-val { font-size: 32px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 760px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 780px; max-width: 90%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="s-input" placeholder="ababa" style="width:220px">
        <label class="ui-label">k =</label>
        <input type="number" id="k-input" value="2" min="1" style="width:80px">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 (ababa, k=2)</button>
        <button onclick="loadExample(2)">Ex 2 (aaaaa, k=3)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force — Longest Prefix Occurring at Least K Times (O(n³))</div>
        
        <div class="string-display" id="strings-display"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Prefix Length</span>
            <span class="info-value" id="val-len" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Position i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Occurrences</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">0</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Longest Valid Prefix =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left:20px">
            <span class="ui-label" style="margin-right:6px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Prefix</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Current Window</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Prefix</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "ababa";
        let currentK = 2;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentS = "ababa"; currentK = 2;
            } else {
                currentS = "aaaaa"; currentK = 3;
            }
            document.getElementById('s-input').value = currentS;
            document.getElementById('k-input').value = currentK;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('s-input').value.trim();
            const kVal = parseInt(document.getElementById('k-input').value) || 1;
            if (val) {
                currentS = val;
                currentK = kVal;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let found = false;
            let resultPrefix = "";

            steps.push({
                type: 'init',
                panel: `Input: s = <b>"${currentS}"</b>, k = ${currentK}<br>Brute Force: Check prefixes from longest to shortest`,
                statusText: `Checking prefixes from length ${n} down to 1...`,
                log: `s = "${currentS}"\nk = ${currentK}\nn = ${n}`
            });

            for (let len = n; len >= 1; len--) {
                const prefix = currentS.substring(0, len);
                let occ = 0;
                const m = len;

                steps.push({
                    type: 'check_prefix',
                    len: len,
                    prefix: prefix,
                    panel: `Checking prefix of length ${len}: <b>"${prefix}"</b>`,
                    statusText: `Prefix length = ${len}`,
                    log: `\nPrefix length ${len}: "${prefix}"`
                });

                for (let i = 0; i <= n - m; i++) {
                    let match = true;
                    steps.push({
                        type: 'compare',
                        len: len,
                        i: i,
                        panel: `Comparing window [${i}:${i+m}] with prefix "${prefix}"`,
                        statusText: `i = ${i}`,
                        log: `  i=${i}: comparing s[${i}:${i+m}]`
                    });

                    for (let j = 0; j < m; j++) {
                        if (currentS[i + j] !== prefix[j]) {
                            match = false;
                            break;
                        }
                    }

                    if (match) {
                        occ++;
                        steps.push({
                            type: 'match',
                            len: len,
                            i: i,
                            panel: `Match found at position ${i}! Current occurrences: ${occ}`,
                            statusText: `Match at ${i} (occ = ${occ})`,
                            log: `    Match at i=${i}, occ=${occ}`
                        });
                    } else {
                        steps.push({
                            type: 'no_match',
                            len: len,
                            i: i,
                            panel: `No match at position ${i}`,
                            statusText: `No match at ${i}`,
                            log: `    No match at i=${i}`
                        });
                    }
                }

                steps.push({
                    type: 'prefix_done',
                    len: len,
                    occ: occ,
                    panel: `Prefix "${prefix}" appears ${occ} times`,
                    statusText: `Occurrences = ${occ}`,
                    log: `  Total occurrences for length ${len}: ${occ}`
                });

                if (occ >= currentK) {
                    resultPrefix = prefix;
                    found = true;
                    steps.push({
                        type: 'found',
                        len: len,
                        prefix: prefix,
                        panel: `<b>Found valid prefix!</b><br>Length ${len}: "${prefix}" appears ${occ} ≥ ${currentK} times`,
                        statusText: `Valid prefix found: "${prefix}"`,
                        log: `\n→ Valid prefix of length ${len}: "${prefix}"`,
                        complete: true,
                        finalResult: prefix
                    });
                    break;
                }
            }

            if (!found) {
                steps.push({
                    type: 'not_found',
                    panel: `No prefix appears at least ${currentK} times.`,
                    statusText: `No valid prefix`,
                    complete: true,
                    finalResult: ""
                });
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('strings-display');
            container.innerHTML = '';
            for (let pos = 0; pos < currentS.length; pos++) {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const idxTile = document.createElement('div');
                idxTile.className = 'tile';
                idxTile.style.fontSize = '11px';
                idxTile.style.height = '24px';
                idxTile.style.opacity = '0.7';
                idxTile.innerText = pos;
                const chTile = document.createElement('div');
                chTile.className = 'tile';
                chTile.innerText = currentS[pos];

                if (step.len !== undefined) {
                    if (pos < step.len) chTile.classList.add('prefix');
                }
                if (step.i !== undefined && step.len !== undefined) {
                    if (pos >= step.i && pos < step.i + (step.len || 0)) chTile.classList.add('center');
                }
                if (step.type === 'found' || step.type === 'valid-pal') chTile.classList.add('valid-pal');

                unit.append(idxTile, chTile);
                container.appendChild(unit);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-len').innerText = step.len !== undefined ? step.len : '—';
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-count').innerText = step.occ !== undefined ? step.occ : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult || '""';
                resVal.classList.add('pop');
            } else {
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText || '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
