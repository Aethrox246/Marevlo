<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Repeating Character Replacement - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 220px;
            font-size: 13px;
        }
        input[type="number"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 80px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 8px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 700px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 150px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }

        .freq-container {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: 700px;
            justify-content: center;
        }
        .freq-tile {
            width: 40px;
            height: 50px;
            border: 1px solid var(--border-main);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-family: monospace;
        }
        .freq-char { font-size: 14px; font-weight: bold; }
        .freq-count { font-size: 11px; color: var(--accent-blue); }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="s-input" placeholder="AABABBA">
        <label class="ui-label">k =</label>
        <input type="number" id="k-input" placeholder="1" min="0" style="width:80px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 ("AABABBA", k=1)</button>
        <button onclick="loadExample(2)">Ex 2 ("ABCDE", k=2)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Sliding Window: Expand Right, Shrink Left When Replacements > k</div>
        <div class="string-display" id="tiles-container"></div>
        
        <div style="margin-top:20px; width:700px;">
            <div style="font-size:13px; color:var(--text-dim); margin-bottom:6px;">Frequency Array (A-Z)</div>
            <div class="freq-container" id="freq-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Left Pointer</span>
            <span class="info-value" id="val-left" style="color: var(--accent-blue);">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Right Pointer</span>
            <span class="info-value" id="val-right" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max Freq</span>
            <span class="info-value" id="val-maxfreq" style="color: var(--accent-green);">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Replacements Needed</span>
            <span class="info-value" id="val-repl" style="color: var(--accent-orange);">0</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">max length =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Window</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Window</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Invalid → Shrink</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "AABABBA";
        let currentK = 1;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1200, 600, 300];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentS = "AABABBA";
                currentK = 1;
            } else {
                currentS = "ABCDE";
                currentK = 2;
            }
            document.getElementById('s-input').value = currentS;
            document.getElementById('k-input').value = currentK;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const sVal = document.getElementById('s-input').value.trim();
            const kVal = parseInt(document.getElementById('k-input').value);
            if (sVal && !isNaN(kVal) && kVal >= 0) {
                currentS = sVal;
                currentK = kVal;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let left = 0;
            let maxLen = 0;
            let maxFreq = 0;
            let count = new Array(26).fill(0);

            // INIT
            steps.push({
                type: 'init',
                left: 0,
                right: -1,
                maxLen: 0,
                maxFreq: 0,
                count: [...count],
                panel: `String: <b>"${currentS}"</b>, k = <b>${currentK}</b><br>Sliding window to find longest substring that can be made uniform with ≤ k replacements.`,
                statusText: `Starting sliding window...`,
                log: `s="${currentS}", k=${currentK}`
            });

            for (let right = 0; right < n; right++) {
                const charIdx = currentS.charCodeAt(right) - 65; // A=0, B=1, ..., Z=25
                count[charIdx]++;
                maxFreq = Math.max(maxFreq, count[charIdx]);

                let states = Array(n).fill('idle');
                for (let p = left; p <= right; p++) {
                    states[p] = 'center';
                }

                let replacementsNeeded = (right - left + 1) - maxFreq;

                steps.push({
                    type: 'expand',
                    left: left,
                    right: right,
                    maxLen: maxLen,
                    maxFreq: maxFreq,
                    count: [...count],
                    replacementsNeeded: replacementsNeeded,
                    panel: `Expanded right to <b>${right}</b> (char '${currentS[right]}')<br>Window [${left},${right}], length=${right-left+1}, maxFreq=${maxFreq}, replacements needed=${replacementsNeeded}`,
                    statusText: `Window [${left},${right}], replacements=${replacementsNeeded}`,
                    log: `  right=${right} ('${currentS[right]}'), maxFreq=${maxFreq}, needed=${replacementsNeeded}`
                });

                while (replacementsNeeded > currentK && left <= right) {
                    const leftCharIdx = currentS.charCodeAt(left) - 65;
                    count[leftCharIdx]--;
                    left++;

                    // Recompute maxFreq only when necessary (in practice we keep historical max)
                    // For visualization, we keep the historical maxFreq as per optimized approach
                    replacementsNeeded = (right - left + 1) - maxFreq;

                    let statesShrink = Array(n).fill('idle');
                    for (let p = left; p <= right; p++) {
                        statesShrink[p] = 'center';
                    }

                    steps.push({
                        type: 'shrink',
                        left: left,
                        right: right,
                        maxLen: maxLen,
                        maxFreq: maxFreq,
                        count: [...count],
                        replacementsNeeded: replacementsNeeded,
                        panel: `<span style="color:var(--accent-red)">Invalid window</span> → Shrunk left to <b>${left}</b><br>Replacements now ${replacementsNeeded}`,
                        statusText: `Shrink left to ${left}, replacements=${replacementsNeeded}`,
                        log: `    Shrink left=${left}, needed=${replacementsNeeded}`
                    });
                }

                if (replacementsNeeded <= currentK) {
                    maxLen = Math.max(maxLen, right - left + 1);
                }

                steps.push({
                    type: 'update',
                    left: left,
                    right: right,
                    maxLen: maxLen,
                    maxFreq: maxFreq,
                    count: [...count],
                    replacementsNeeded: replacementsNeeded,
                    panel: `Window [${left},${right}] is valid.<br>Current max length = <b>${maxLen}</b>`,
                    statusText: `Valid window, maxLen = ${maxLen}`,
                    log: `  Valid → maxLen = ${maxLen}`
                });
            }

            // FINAL
            steps.push({
                type: 'final',
                left: left,
                right: n-1,
                maxLen: maxLen,
                maxFreq: maxFreq,
                count: [...count],
                panel: `All windows processed.<br>Longest substring length = <b>${maxLen}</b>`,
                statusText: `Done. Max length = ${maxLen}`,
                log: `\nFinal Result: ${maxLen}`,
                complete: true,
                finalResult: maxLen
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Render string tiles with window highlight
            currentS.split('').forEach((char, k) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'tile idle';
                if (k >= step.left && k <= step.right) cls = 'tile center';
                tile.className = cls;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${k}]`;
                unit.append(tile, idxLabel);
                container.appendChild(unit);
            });

            // Render frequency array
            const freqContainer = document.getElementById('freq-container');
            freqContainer.innerHTML = '';
            for (let i = 0; i < 26; i++) {
                const freqTile = document.createElement('div');
                freqTile.className = 'freq-tile';
                const char = String.fromCharCode(65 + i); // A to Z
                freqTile.innerHTML = `<span class="freq-char">${char}</span><span class="freq-count">${step.count[i]}</span>`;
                freqContainer.appendChild(freqTile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-left').innerText = step.left;
            document.getElementById('val-right').innerText = step.right;
            document.getElementById('val-maxfreq').innerText = step.maxFreq;
            document.getElementById('val-repl').innerText = step.replacementsNeeded;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
