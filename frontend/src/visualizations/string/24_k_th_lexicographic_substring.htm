<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-th Lexicographic Substring - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 180px; font-size: 14px;
        }
        input[type="number"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 80px; font-size: 14px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 920px; }
        .string-display {
            display: flex; gap: 6px; justify-content: center; padding: 20px;
            background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .tile {
            width: 48px; height: 58px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 6px;
            font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d;
        }
        .tile .index { font-size: 9px; color: var(--text-dim); margin-top: 3px; }
        .tile.current { border-color: var(--accent-purple); background: #1e1030; transform: scale(1.1); }

        .substrings-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 16px; width: 720px; min-height: 120px;
            font-family: monospace; font-size: 13.5px; overflow-y: auto; max-height: 180px;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; min-height: 88px; font-family: monospace;
            font-size: 14.5px; line-height: 1.55; text-align: center;
        }

        .result-display { margin-top: 22px; font-size: 28px; font-family: monospace; color: var(--accent-green); }

        .controls { margin-top: 26px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 12.5px; color: var(--text-dim); }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" value="abc">
        <label class="ui-label">k =</label>
        <input type="number" id="k-input" value="4" min="1">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (abc, k=4)</button>
        <button onclick="loadExample(1)">Ex 2 (ab, k=2)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force — Generate, Deduplicate, Sort → K-th Lexicographic Substring</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="substrings-panel" id="subs-panel">
        <strong>Generated Substrings:</strong> —
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel" style="margin-top:14px; display:flex; gap:14px; justify-content:center;">
        <div class="info-cell">
            <span class="info-label">Total Unique</span>
            <span class="info-value" id="val-total" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">K-th</span>
            <span class="info-value" id="val-kth" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text" style="margin-top:8px; font-size:13px; color:var(--text-dim);"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Current Substring Being Generated</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Final K-th Selected</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "abc";
        let currentK = 4;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1250, 620, 280];

        function loadExample(ex) {
            if (ex === 0) {
                currentS = "abc";
                currentK = 4;
            } else {
                currentS = "ab";
                currentK = 2;
            }
            document.getElementById('str-input').value = currentS;
            document.getElementById('k-input').value = currentK;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentS = document.getElementById('str-input').value.trim() || currentS;
            currentK = parseInt(document.getElementById('k-input').value) || currentK;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let substrings = [];

            steps.push({
                type: 'init',
                panel: `String: <b>"${currentS}"</b>, k=${currentK}`,
                statusText: 'Generating all substrings...',
                log: 'Initialize empty list',
                substrings: [],
                sorted: [],
                kth: ''
            });

            // Generate
            for (let i = 0; i < n; i++) {
                for (let j = i; j < n; j++) {
                    const sub = currentS.slice(i, j + 1);
                    substrings.push(sub);
                    steps.push({
                        type: 'generate',
                        panel: `Substring s[${i}:${j+1}] = <b>"${sub}"</b>`,
                        statusText: `Generated substring from ${i} to ${j}`,
                        log: `Add "${sub}"`,
                        substrings: [...substrings],
                        sorted: [],
                        kth: ''
                    });
                }
            }

            // Deduplicate
            const unique = [...new Set(substrings)];
            steps.push({
                type: 'dedup',
                panel: `Deduplicated: ${unique.length} unique substrings`,
                statusText: 'Removed duplicates',
                log: `Unique count: ${unique.length}`,
                substrings: unique,
                sorted: [],
                kth: ''
            });

            // Sort
            const sortedSubs = [...unique].sort();
            steps.push({
                type: 'sort',
                panel: `Sorted lexicographically`,
                statusText: 'Sorting complete',
                log: `Sorted: ${sortedSubs.join(', ')}`,
                substrings: unique,
                sorted: sortedSubs,
                kth: ''
            });

            // Select k-th
            let kth = '';
            if (currentK >= 1 && currentK <= sortedSubs.length) {
                kth = sortedSubs[currentK - 1];
            } else {
                kth = '(k out of range)';
            }

            steps.push({
                type: 'final',
                panel: `✅ K-th (${currentK}) = <b>"${kth}"</b>`,
                statusText: 'Done',
                log: `Result: "${kth}"`,
                substrings: unique,
                sorted: sortedSubs,
                kth: kth
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Tiles
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            for (let k = 0; k < currentS.length; k++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<span>${currentS[k]}</span><span class="index">${k}</span>`;
                container.appendChild(tile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;

            // Substrings panel
            const subsPanel = document.getElementById('subs-panel');
            let displayText = `<strong>Generated (${step.substrings.length}):</strong> `;
            if (step.sorted.length > 0) {
                displayText += `<strong>Sorted:</strong> ${step.sorted.join(', ')}`;
            } else {
                displayText += step.substrings.slice(0, 12).join(', ') + (step.substrings.length > 12 ? '...' : '');
            }
            subsPanel.innerHTML = displayText;

            document.getElementById('val-total').innerText = step.sorted.length || step.substrings.length || 0;
            document.getElementById('val-kth').innerText = step.kth || '—';

            document.getElementById('res-val').innerText = step.kth || '—';

            document.getElementById('status-text').innerText = step.statusText;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const line = document.createElement('div');
                line.style.marginBottom = '4px';
                line.innerText = steps[k].log || '';
                logPanel.appendChild(line);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value | 0]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = () => { loadExample(0); };
    </script>
</body>
</html>
