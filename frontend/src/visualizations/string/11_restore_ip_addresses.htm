<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restore IP Addresses - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 220px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 16px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row { display: flex; gap: 8px; align-items: center; }
        .string-label { font-family: monospace; font-size: 13px; color: var(--text-dim); min-width: 90px; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" placeholder="25525511135">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("25525511135")</button>
        <button onclick="loadExample(1)">Ex 2 ("0000")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Backtracking Segment Construction (4 segments required)</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Segment</span>
            <span class="info-value" id="val-segment" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Segments Built</span>
            <span class="info-value" id="val-built" style="color: var(--accent-blue);">0/4</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Valid IPs</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">0</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">valid IP addresses =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Segment</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Building</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Segment</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Invalid / Pruned</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "25525511135";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(0); }

        function loadExample(ex) {
            if (ex === 0) currentS = "25525511135";
            else currentS = "0000";
            document.getElementById('str-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentS = document.getElementById('str-input').value.trim();
            if (currentS) {
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            let results = [];

            // INIT
            steps.push({
                type: 'init',
                current: '',
                segments: [],
                panel: `String: <b>"${currentS}"</b> (length ${currentS.length})<br>Need exactly 4 segments (0-255, no leading zeros)`,
                statusText: `Starting backtracking at position 0...`,
                log: `Problem initialized for "${currentS}".`,
                count: 0
            });

            function backtrack(start, segments) {
                if (segments.length === 4) {
                    if (start === currentS.length) {
                        const ip = segments.join('.');
                        results.push(ip);
                        steps.push({
                            type: 'found',
                            current: currentS,
                            segments: [...segments],
                            panel: `<span style="color:var(--accent-green)">Valid IP Found: <b>${ip}</b></span>`,
                            statusText: `Found: ${ip}`,
                            log: `  → Valid: ${ip}`,
                            count: results.length
                        });
                    }
                    return;
                }

                for (let len = 1; len <= 3 && start + len <= currentS.length; len++) {
                    const segment = currentS.substring(start, start + len);
                    
                    // Validate
                    let valid = true;
                    if (segment.length > 1 && segment[0] === '0') valid = false;
                    else if (parseInt(segment) > 255) valid = false;

                    steps.push({
                        type: valid ? 'expanding' : 'mismatch',
                        current: currentS,
                        segments: [...segments, segment],
                        panel: `Trying segment <b>"${segment}"</b> from position ${start}`,
                        statusText: valid ? `Valid segment "${segment}"` : `Invalid segment "${segment}"`,
                        log: `  [${start}:${start+len}] "${segment}" → ${valid ? 'valid' : 'invalid'}`,
                        count: results.length
                    });

                    if (valid) {
                        backtrack(start + len, [...segments, segment]);
                    }
                }
            }

            backtrack(0, []);

            // FINAL
            steps.push({
                type: 'final',
                current: '',
                segments: [],
                panel: `Backtracking complete.<br>Found <b>${results.length}</b> valid IPs.`,
                complete: true,
                finalResult: results,
                statusText: `Done. ${results.length} valid IPs.`,
                log: `\nFinal Result: ${results.length} valid IPs.\n${results.join('\n')}`,
                bold: true,
                count: results.length
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Render the full string with segment highlights
            const row = document.createElement('div');
            row.className = 'string-row';

            const label = document.createElement('div');
            label.className = 'string-label';
            label.innerText = "s:";
            row.appendChild(label);

            currentS.split('').forEach((char, i) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let state = 'idle';
                if (step.segments && step.segments.length > 0) {
                    let pos = 0;
                    for (let seg of step.segments) {
                        if (i >= pos && i < pos + seg.length) {
                            state = step.type === 'found' ? 'valid-pal' : 'expanding';
                            break;
                        }
                        pos += seg.length;
                    }
                }
                tile.className = `tile ${state}`;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${i}]`;
                unit.append(tile, idxLabel);
                row.appendChild(unit);
            });
            container.appendChild(row);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-segment').innerText = step.segments ? step.segments.join(' | ') : '—';
            document.getElementById('val-built').innerText = `${step.segments ? step.segments.length : 0}/4`;
            document.getElementById('val-count').innerText = step.count;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerHTML = step.finalResult.map(ip => `<div>${ip}</div>`).join('');
            } else {
                resVal.innerText = '—';
            }
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
