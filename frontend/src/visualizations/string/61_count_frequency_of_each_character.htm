<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Frequency of Each Character - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 320px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 60px;
            text-align: right;
        }

        .freq-container {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 4px;
            background: var(--border-main);
            padding: 4px;
            border-radius: 6px;
            width: 680px;
        }
        .freq-cell {
            background: var(--bg-surface);
            padding: 6px;
            text-align: center;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        .freq-cell.active {
            background: var(--accent-purple);
            color: white;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; white-space: pre-wrap; text-align: center; max-width: 680px; }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 680px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" placeholder='"hello"'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("hello")</button>
        <button onclick="loadExample(1)">Ex 2 ("aaabbb")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Frequency Array (a-z) – O(n) Pass</div>
        <div class="string-display" id="tiles-container"></div>
        <div class="freq-container" id="freq-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Char</span>
            <span class="info-value" id="val-char" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Index in Array</span>
            <span class="info-value" id="val-idx" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">New Count</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Final Frequencies</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Character</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Updated Count</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1100, 550, 280];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentS = "hello";
            } else {
                currentS = "aaabbb";
            }
            document.getElementById('str-input').value = `"${currentS}"`;
            generateSteps();
            reset();
        }

        function loadCustom() {
            let val = document.getElementById('str-input').value.trim();
            if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
            currentS = val || "hello";
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let freq = new Array(26).fill(0);

            // INIT
            steps.push({
                type: 'init',
                freq: [...freq],
                i: -1,
                panel: `s = <b>"${currentS}"</b>`,
                statusText: `Initializing frequency array...`,
                log: `freq = [0]*26`
            });

            for (let i = 0; i < n; i++) {
                const ch = currentS[i];
                const idx = ch.charCodeAt(0) - 97; // 'a' = 97

                let currentFreq = [...freq];
                currentFreq[idx]++;

                steps.push({
                    type: 'count',
                    freq: currentFreq,
                    i: i,
                    ch: ch,
                    idx: idx,
                    panel: `char='${ch}' → index ${idx} (a=0)`,
                    statusText: `Processing character '${ch}'`,
                    log: `char='${ch}', index=${idx}, freq[${idx}] = ${freq[idx] + 1}`
                });

                freq[idx]++;
            }

            // FINAL
            let output = '';
            for (let k = 0; k < 26; k++) {
                output += String.fromCharCode(97 + k) + ':' + freq[k];
                if (k < 25) output += ', ';
            }

            steps.push({
                type: 'final',
                freq: [...freq],
                finalResult: output,
                complete: true,
                panel: `<span style="color:var(--accent-green)">Final Frequencies: <b>${output}</b></span>`,
                statusText: `Done. All frequencies calculated.`,
                log: `\nFinal: ${output}`,
                bold: true
            });
        }

        function createFreqDisplay(freq) {
            const container = document.getElementById('freq-container');
            container.innerHTML = '';

            for (let k = 0; k < 26; k++) {
                const cell = document.createElement('div');
                cell.className = 'freq-cell';
                const ch = String.fromCharCode(97 + k);
                cell.innerHTML = `${ch}<br><span style="font-size:18px">${freq[k]}</span>`;
                container.appendChild(cell);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const rowDiv = document.createElement('div');
            rowDiv.className = 'string-row';

            const label = document.createElement('div');
            label.className = 'string-label';
            label.innerText = 's';
            rowDiv.appendChild(label);

            currentS.split('').forEach((char, colIdx) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile ${step.i === colIdx ? 'center' : 'idle'}`;
                tile.innerText = char;

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = colIdx;

                unit.append(tile, idxLabel);
                rowDiv.appendChild(unit);
            });

            container.appendChild(rowDiv);

            createFreqDisplay(step.freq);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-char').innerText = step.ch !== undefined ? `'${step.ch}'` : '—';
            document.getElementById('val-idx').innerText = step.idx !== undefined ? step.idx : '—';
            document.getElementById('val-count').innerText = step.freq && step.idx !== undefined ? step.freq[step.idx] : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
