<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Break (Boolean) - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 280px; font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 880px; }
        .string-display {
            display: flex; gap: 5px; justify-content: center; padding: 20px;
            background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .tile {
            width: 48px; height: 58px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 6px;
            font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile .index { font-size: 9px; color: var(--text-dim); margin-top: 3px; }
        .tile.current { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.1); }
        .tile.valid { background: #0f2a1a; border-color: var(--accent-green); }
        .tile.fail { background: #2a0d0d; border-color: var(--accent-red); }

        .dp-row {
            display: flex; gap: 4px; justify-content: center; margin-top: 20px; padding: 12px;
            background: var(--bg-surface); border-radius: 6px; border: 1px solid var(--border-main);
        }
        .dp-tile {
            width: 38px; height: 48px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 4px;
            font-size: 14px; font-weight: 700; font-family: monospace;
            border: 1px solid var(--border-main); background: #21262d;
        }
        .dp-tile.true { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); }
        .dp-tile.false { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; min-height: 100px; font-family: monospace;
            font-size: 14.5px; line-height: 1.55; text-align: center;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 17px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 18px; font-size: 26px; font-family: monospace; color: var(--accent-green); }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); min-height: 24px; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 12.5px; color: var(--text-dim); }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="s-input" value="leetcode">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("leetcode")</button>
        <button onclick="loadExample(1)">Ex 2 ("applepenapple")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">DP Tabulation – Word Break (Can Segment?)</div>
        <div class="string-display" id="tiles-container"></div>
        <div class="dp-row" id="dp-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Split at j</span>
            <span class="info-value" id="val-j" style="color:var(--accent-blue)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Prefix</span>
            <span class="info-value" id="val-prefix" style="color:var(--accent-orange)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Current i</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Valid Segmentation</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-orange);border-radius:4px"></span> Checking Prefix</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "leetcode";
        let wordDict = ["leet", "code"];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1200, 600, 280];

        function loadExample(ex) {
            if (ex === 0) { currentS = "leetcode"; wordDict = ["leet", "code"]; }
            else { currentS = "applepenapple"; wordDict = ["apple", "pen"]; }
            document.getElementById('s-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentS = document.getElementById('s-input').value.trim() || currentS;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            const wordSet = new Set(wordDict);
            let dp = new Array(n + 1).fill(false);
            dp[0] = true;

            steps.push({
                type: 'init',
                dp: [...dp],
                panel: `s = <b>"${currentS}"</b><br>dict = ${JSON.stringify(wordDict)}`,
                statusText: 'Initializing DP array...',
                log: 'dp[0] = true (empty string)',
                i: 0,
                j: -1,
                prefix: '',
                complete: false
            });

            for (let i = 1; i <= n; i++) {
                for (let j = 0; j < i; j++) {
                    if (dp[j]) {
                        const prefix = currentS.substring(j, i);
                        steps.push({
                            type: 'check',
                            dp: [...dp],
                            panel: `Check s[${j}:${i}] = "${prefix}"`,
                            statusText: `Prefix "${prefix}"`,
                            log: `j=${j}, prefix="${prefix}" ${wordSet.has(prefix) ? '✓' : '✗'}`,
                            i: i,
                            j: j,
                            prefix: prefix,
                            complete: false
                        });

                        if (wordSet.has(prefix)) {
                            dp[i] = true;
                            steps.push({
                                type: 'update',
                                dp: [...dp],
                                panel: `✅ Found valid word "${prefix}" at j=${j}`,
                                statusText: `dp[${i}] = true`,
                                log: `Updated dp[${i}] = true`,
                                i: i,
                                j: j,
                                prefix: prefix,
                                complete: false
                            });
                            break;
                        }
                    }
                }
            }

            steps.push({
                type: 'final',
                dp: [...dp],
                panel: dp[n] ? `✅ <b>YES</b> - Can be segmented` : `❌ <b>NO</b> - Cannot be segmented`,
                statusText: `Final answer: ${dp[n] ? 'YES' : 'NO'}`,
                log: `\nResult: ${dp[n] ? 'YES' : 'NO'}`,
                i: n,
                j: -1,
                prefix: '',
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // String tiles
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            for (let k = 0; k < currentS.length; k++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<span>${currentS[k]}</span><span class="index">[${k}]</span>`;
                if (k < step.i) tile.classList.add('valid');
                if (step.j !== -1 && k >= step.j && k < step.i) tile.classList.add('current');
                container.appendChild(tile);
            }

            // DP tiles
            const dpContainer = document.getElementById('dp-container');
            dpContainer.innerHTML = '';
            for (let k = 0; k < step.dp.length; k++) {
                const dpTile = document.createElement('div');
                dpTile.className = `dp-tile ${step.dp[k] ? 'true' : 'false'}`;
                dpTile.innerHTML = `<span>${step.dp[k] ? 'T' : 'F'}</span><span class="index">${k}</span>`;
                dpContainer.appendChild(dpTile);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i;
            document.getElementById('val-j').innerText = step.j >= 0 ? step.j : '—';
            document.getElementById('val-prefix').innerText = step.prefix || '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? (step.dp[step.dp.length-1] ? 'YES' : 'NO') : '—';

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const line = document.createElement('div');
                line.style.marginBottom = '4px';
                line.innerText = steps[k].log || '';
                logPanel.appendChild(line);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value | 0]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = () => { loadExample(0); };
    </script>
</body>
</html>
