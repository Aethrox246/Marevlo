<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40 - One Edit Away - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface);
            padding: 12px 16px; display: flex; justify-content: center;
            align-items: center; gap: 8px; border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 180px; font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px;
            background: var(--btn-bg); border: 1px solid var(--border-main);
            color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container {
            margin-top: 30px; display: flex; flex-direction: column;
            align-items: center; gap: 24px; width: 100%; max-width: 820px;
        }

        .string-row {
            display: flex; gap: 8px; align-items: center;
        }
        .string-label {
            font-family: monospace; font-size: 13px;
            color: var(--text-dim); min-width: 60px; text-align: right;
        }
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center;
            justify-content: center; border-radius: 8px; font-size: 24px;
            font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.12); }
        .tile.match { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }
        .tile.idle { opacity: 0.9; }

        .action-panel {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 720px; min-height: 92px;
            text-align: center; font-family: monospace; font-size: 15px; line-height: 1.5;
        }

        .info-panel {
            display: flex; gap: 18px; justify-content: center; flex-wrap: wrap;
        }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 8px 18px; text-align: center; min-width: 120px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 18px; font-weight: 700; font-family: monospace; }

        .result-display {
            margin-top: 12px; font-size: 24px; font-family: monospace;
            color: var(--accent-green); font-weight: bold;
        }

        .status-bar {
            margin-top: 8px; font-size: 13px; color: var(--text-dim);
            height: 1.3em; text-align: center; width: 720px;
        }

        .controls {
            margin-top: 24px; display: flex; align-items: center; gap: 10px;
        }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend {
            margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap;
            justify-content: center; font-size: 12px; color: var(--text-dim);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%;
            height: 170px; overflow-y: auto; font-family: 'Courier New', monospace;
            font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s = </label>
        <input type="text" id="s1-input" value="cat">
        <label class="ui-label">t = </label>
        <input type="text" id="s2-input" value="bat">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1: cat → bat</button>
        <button onclick="loadExample(1)">Ex 2: dog → dogs</button>
    </div>

    <div class="visual-container">
        <div class="string-row" id="s1-row"></div>
        <div class="string-row" id="s2-row"></div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to start two-pointer comparison</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">i (s)</span>
            <span class="info-value" id="val-i" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">j (t)</span>
            <span class="info-value" id="val-j" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Mismatch</span>
            <span class="info-value" id="val-mismatch" style="color:var(--accent-red)">No</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Edit Used</span>
            <span class="info-value" id="val-edit" style="color:var(--accent-orange)">—</span>
        </div>
    </div>

    <div class="result-display" id="result-text"></div>
    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Current i/j</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Match</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-red);border-radius:4px"></span> Mismatch/Edit</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let s = "cat";
        let t = "bat";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1200, 600, 280];

        function generateSteps() {
            steps = [];
            const n = s.length;
            const m = t.length;

            if (Math.abs(n - m) > 1) {
                steps.push({
                    type: 'final',
                    i: 0, j: 0,
                    panel: `<span style="color:var(--accent-red)">Length difference > 1 → NO</span>`,
                    status: 'Impossible with one edit',
                    log: `|${n} - ${m}| > 1 → Return NO`,
                    complete: true,
                    result: 'NO'
                });
                return;
            }

            let i = 0, j = 0;
            let mismatch = false;

            steps.push({
                type: 'init',
                i: 0, j: 0,
                mismatch: false,
                panel: `s = "<b>${s}</b>" (${n}), t = "<b>${t}</b>" (${m})`,
                status: 'Starting two-pointer comparison',
                log: `i=0, j=0, mismatch=false`
            });

            while (i < n && j < m) {
                if (s[i] === t[j]) {
                    steps.push({
                        type: 'match',
                        i: i, j: j,
                        mismatch: mismatch,
                        panel: `s[${i}]='${s[i]}' == t[${j}]='${t[j]}' → match`,
                        status: `Characters match, advance both pointers`,
                        log: `i=${i}, j=${j} | '${s[i]}' == '${t[j]}'`
                    });
                    i++;
                    j++;
                } else {
                    if (mismatch) {
                        steps.push({
                            type: 'fail',
                            i: i, j: j,
                            mismatch: true,
                            panel: `<span style="color:var(--accent-red)">Second mismatch → NO</span>`,
                            status: 'More than one edit needed',
                            log: `Second mismatch at i=${i}, j=${j} → Return NO`,
                            complete: true,
                            result: 'NO'
                        });
                        return;
                    }

                    mismatch = true;

                    if (n === m) {
                        steps.push({
                            type: 'replace',
                            i: i, j: j,
                            mismatch: mismatch,
                            panel: `Replace: '${s[i]}' → '${t[j]}'`,
                            status: `Lengths equal → simulate replace`,
                            log: `Mismatch: replace, advance both`
                        });
                        i++;
                        j++;
                    } else if (n > m) {
                        steps.push({
                            type: 'delete',
                            i: i, j: j,
                            mismatch: mismatch,
                            panel: `Delete from s: '${s[i]}'`,
                            status: `s longer → simulate delete`,
                            log: `Mismatch: delete from s, advance i`
                        });
                        i++;
                    } else {
                        steps.push({
                            type: 'insert',
                            i: i, j: j,
                            mismatch: mismatch,
                            panel: `Insert into s: '${t[j]}'`,
                            status: `t longer → simulate insert`,
                            log: `Mismatch: insert into s, advance j`
                        });
                        j++;
                    }
                }
            }

            steps.push({
                type: 'final',
                i: i, j: j,
                mismatch: mismatch,
                panel: `<span style="color:var(--accent-green)">At most one edit needed → YES</span>`,
                status: 'Traversal complete with ≤1 mismatch',
                log: `i=${i}, j=${j}, mismatch=${mismatch} → Return YES`,
                complete: true,
                result: 'YES'
            });
        }

        function renderStrings(highlightI = -1, highlightJ = -1) {
            const renderRow = (id, str, highlight) => {
                const container = document.getElementById(id);
                container.innerHTML = `<div class="string-label">${id === 's1-row' ? 's' : 't'}</div>`;
                str.split('').forEach((ch, idx) => {
                    const unit = document.createElement('div');
                    unit.className = 'tile-unit';
                    const tile = document.createElement('div');
                    let cls = 'tile idle';
                    if (idx === highlight) cls = 'tile center';
                    tile.className = cls;
                    tile.textContent = ch;
                    const idxEl = document.createElement('div');
                    idxEl.style.fontSize = '10px';
                    idxEl.style.color = '#8b949e';
                    idxEl.textContent = idx;
                    unit.append(tile, idxEl);
                    container.appendChild(unit);
                });
            };
            renderRow('s1-row', s, highlightI);
            renderRow('s2-row', t, highlightJ);
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderStrings(step.i, step.j);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').textContent = step.i !== undefined ? step.i : '—';
            document.getElementById('val-j').textContent = step.j !== undefined ? step.j : '—';
            document.getElementById('val-mismatch').textContent = step.mismatch ? 'Yes' : 'No';
            document.getElementById('val-edit').textContent = step.type === 'replace' ? 'Replace' : (step.type === 'delete' ? 'Delete' : (step.type === 'insert' ? 'Insert' : '—'));

            const res = document.getElementById('result-text');
            if (step.complete) {
                res.innerHTML = `Result: <b>${step.result}</b>`;
            } else res.textContent = '';

            document.getElementById('status-text').textContent = step.status;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = steps.slice(0, idx + 1).map(s => `<div>${s.log}</div>`).join('');
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(idx) {
            if (idx === 0) {
                s = "cat";
                t = "bat";
            } else {
                s = "dog";
                t = "dogs";
            }
            document.getElementById('s1-input').value = s;
            document.getElementById('s2-input').value = t;
            generateSteps();
            reset();
        }

        function loadCustom() {
            s = document.getElementById('s1-input').value.trim() || "cat";
            t = document.getElementById('s2-input').value.trim() || "bat";
            generateSteps();
            reset();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
