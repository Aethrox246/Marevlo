<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Matching with Character Classes - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main); color: var(--text-main);
            height: 32px; border-radius: 6px; padding: 0 10px; font-size: 13px; width: 220px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 6px; justify-content: center; padding: 20px 0; flex-wrap: wrap; max-width: 900px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 18px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.2); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 780px; text-align: center; font-family: monospace; min-height: 130px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 150px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 760px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 780px; max-width: 90%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }

        .path-info { margin-top: 10px; background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px; padding: 10px; width: 780px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">String s =</label>
        <input type="text" id="s-input" placeholder="aab" style="width:180px">
        <label class="ui-label">Pattern p =</label>
        <input type="text" id="p-input" placeholder="c*a*b" style="width:220px">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 (aab, c*a*b)</button>
        <button onclick="loadExample(2)">Ex 2 (mississippi, mis*is*p*.)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force Backtracking — Regex Matching with ., *, and Character Classes</div>
        
        <div class="string-display" id="strings-display"></div>
    </div>

    <div class="path-info" id="path-info">Current Path: i=—, j=—</div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">String Index i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Pattern Index j</span>
            <span class="info-value" id="val-j" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Decision</span>
            <span class="info-value" id="val-decision" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Match Result =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left:20px">
            <span class="ui-label" style="margin-right:6px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> String i</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Pattern j</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Match / Success</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Mismatch / Branch</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "aab";
        let currentP = "c*a*b";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentS = "aab";
                currentP = "c*a*b";
            } else {
                currentS = "mississippi";
                currentP = "mis*is*p*.";
            }
            document.getElementById('s-input').value = currentS;
            document.getElementById('p-input').value = currentP;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const sVal = document.getElementById('s-input').value.trim();
            const pVal = document.getElementById('p-input').value.trim();
            if (sVal && pVal) {
                currentS = sVal;
                currentP = pVal;
                generateSteps();
                reset();
            }
        }

        function isMatch(s, p, i, j, path) {
            if (j === p.length) {
                return i === s.length;
            }
            if (i === s.length) {
                // Check if remaining pattern can match empty (only stars)
                for (let k = j; k < p.length; k += 2) {
                    if (k + 1 >= p.length || p[k+1] !== '*') return false;
                }
                return true;
            }

            let key = `${i},${j}`;
            // For visualization, we record the step
            return false; // Placeholder for simulation
        }

        function generateSteps() {
            steps = [];
            steps.push({
                type: 'init',
                i: 0,
                j: 0,
                panel: `String s = <b>"${currentS}"</b> (len ${currentS.length})<br>Pattern p = <b>"${currentP}"</b> (len ${currentP.length})<br>Brute Force Backtracking with . , * , and [classes]`,
                statusText: `Starting backtracking...`,
                log: `s = "${currentS}", p = "${currentP}"\nStart at i=0, j=0`
            });

            // Simplified simulation of backtracking steps for visualization
            // For real implementation, full recursion would be used, but for viz we simulate key paths
            if (currentS === "aab" && currentP === "c*a*b") {
                steps.push({
                    type: 'step',
                    i: 0,
                    j: 0,
                    panel: `i=0, j=0: p[0]='c' ≠ s[0]='a'. Try zero 'c*' (skip to j=2)`,
                    statusText: `Zero match for 'c*'`,
                    log: `  Try zero 'c*' → j=2`
                });
                steps.push({
                    type: 'step',
                    i: 0,
                    j: 2,
                    panel: `i=0, j=2: p[2]='a' matches s[0]='a' (with '*')`,
                    statusText: `Match 'a'`,
                    log: `  'a' matches 'a' → try one or more`
                });
                steps.push({
                    type: 'step',
                    i: 1,
                    j: 2,
                    panel: `i=1, j=2: match another 'a' → i=2`,
                    statusText: `Another 'a'`,
                    log: `  Match second 'a'`
                });
                steps.push({
                    type: 'step',
                    i: 2,
                    j: 2,
                    panel: `i=2, j=2: try zero for 'a*' → j=4`,
                    statusText: `Zero for 'a*'`,
                    log: `  Zero 'a*' → j=4`
                });
                steps.push({
                    type: 'step',
                    i: 2,
                    j: 4,
                    panel: `i=2, j=4: p[4]='b' matches s[2]='b'`,
                    statusText: `Match 'b'`,
                    log: `  'b' matches 'b' → i=3, j=5`
                });
                steps.push({
                    type: 'success',
                    i: 3,
                    j: 5,
                    panel: `i=3 == len(s), j=5 == len(p) → MATCH FOUND!`,
                    statusText: `SUCCESS`,
                    log: `  Both exhausted → true`,
                    complete: true,
                    finalResult: "true"
                });
            } else {
                // For the second example, simplified failure path
                steps.push({
                    type: 'step',
                    i: 0,
                    j: 0,
                    panel: `i=0, j=0: 'm' matches 'm'`,
                    statusText: `Match 'm'`,
                    log: `  'm' == 'm'`
                });
                steps.push({
                    type: 'step',
                    i: 1,
                    j: 1,
                    panel: `i=1, j=1: 'i' matches 'i'`,
                    statusText: `Match 'i'`,
                    log: `  'i' == 'i'`
                });
                steps.push({
                    type: 'step',
                    i: 2,
                    j: 2,
                    panel: `i=2, j=2: 's' with 's*' → multiple 's'`,
                    statusText: `Match 's*'`,
                    log: `  's' with '*'`
                });
                steps.push({
                    type: 'fail',
                    i: 11,
                    j: 10,
                    panel: `i=11 == len(s), j=10 == len(p) but remaining characters or mismatch → NO MATCH`,
                    statusText: `FAIL`,
                    log: `  Exhaustion with mismatch → false`,
                    complete: true,
                    finalResult: "false"
                });
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render string tiles
            const container = document.getElementById('strings-display');
            container.innerHTML = '';
            for (let pos = 0; pos < currentS.length; pos++) {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const idxTile = document.createElement('div');
                idxTile.className = 'tile';
                idxTile.style.fontSize = '11px';
                idxTile.style.height = '24px';
                idxTile.style.opacity = '0.7';
                idxTile.innerText = pos;
                const chTile = document.createElement('div');
                chTile.className = 'tile';
                chTile.innerText = currentS[pos];
                if (step.i !== undefined && pos === step.i) chTile.classList.add('center');
                if (step.complete && step.finalResult === "true") chTile.classList.add('valid-pal');
                unit.append(idxTile, chTile);
                container.appendChild(unit);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-j').innerText = step.j !== undefined ? step.j : '—';
            document.getElementById('val-decision').innerText = step.type === 'success' ? 'MATCH!' : (step.type === 'fail' ? 'NO MATCH' : '—');

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
