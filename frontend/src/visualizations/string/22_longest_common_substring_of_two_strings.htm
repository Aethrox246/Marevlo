<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Common Substring of Two Strings - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 520px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 130px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">params =</label>
        <input type="text" id="str-input" placeholder='{"A":"ABCD","B":"BCDE"}'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("ABCD" + "BCDE")</button>
        <button onclick="loadExample(1)">Ex 2 ("hello" + "world")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force: Generate all substrings of A, compare with all positions in B, track longest match</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">A start (i)</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">A end (j)</span>
            <span class="info-value" id="val-j" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">B start (k)</span>
            <span class="info-value" id="val-k" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Match len</span>
            <span class="info-value" id="val-len" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current longest</span>
            <span class="info-value" id="val-longest" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Longest common substring =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> A substring / B start</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Matching region</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid longer match</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Mismatch</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentA = "ABCD";
        let currentB = "BCDE";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentA = "ABCD";
                currentB = "BCDE";
            } else {
                currentA = "hello";
                currentB = "world";
            }
            document.getElementById('str-input').value = JSON.stringify({
                A: currentA,
                B: currentB
            });
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const val = document.getElementById('str-input').value.trim();
                const parsed = JSON.parse(val);
                currentA = parsed.A || "";
                currentB = parsed.B || "";
                generateSteps();
                reset();
            } catch(e) {
                alert("Please enter valid JSON like {\"A\":\"ABCD\",\"B\":\"BCDE\"}");
            }
        }

        function findLongestCommonSubstring() {
            let longest = "";
            const stepsLocal = [];

            stepsLocal.push({
                type: 'init',
                panel: `A = <b>"${currentA}"</b> (len=${currentA.length})<br>B = <b>"${currentB}"</b> (len=${currentB.length})<br>Brute force: check all substrings of A against positions in B`,
                statusText: `Starting brute-force search for longest common substring`,
                log: `Problem initialized.\nA="${currentA}"\nB="${currentB}"`,
                longest: ""
            });

            for (let i = 0; i < currentA.length; i++) {
                for (let j = i; j < currentA.length; j++) {
                    const subA = currentA.substring(i, j + 1);
                    let found = false;

                    for (let k = 0; k <= currentB.length - subA.length; k++) {
                        let match = true;
                        for (let l = 0; l < subA.length; l++) {
                            if (currentB[k + l] !== subA[l]) {
                                match = false;
                                break;
                            }
                        }
                        if (match) {
                            found = true;
                            if (subA.length > longest.length) {
                                longest = subA;
                                stepsLocal.push({
                                    type: 'new-longest',
                                    i: i, j: j, k: k,
                                    panel: `<span style="color:var(--accent-green)">New longest: "${subA}" (length ${subA.length})</span>`,
                                    statusText: `Found longer match "${subA}"`,
                                    log: `    Found "${subA}" at A[${i}:${j+1}] and B[${k}:${k+subA.length}] → new longest`,
                                    longest: longest
                                });
                            } else {
                                stepsLocal.push({
                                    type: 'match',
                                    i: i, j: j, k: k,
                                    panel: `Match found: "${subA}" at A[${i}:${j+1}] and B[${k}:${k+subA.length}]`,
                                    statusText: `Match of length ${subA.length}`,
                                    log: `    Match "${subA}" (not longer)`,
                                    longest: longest
                                });
                            }
                            break;
                        }
                    }

                    if (!found && subA.length > 0) {
                        stepsLocal.push({
                            type: 'no-match',
                            i: i, j: j,
                            panel: `No match for A[${i}:${j+1}] = "${subA}"`,
                            statusText: `No match for "${subA}"`,
                            log: `  No match for "${subA}"`,
                            longest: longest
                        });
                    }
                }
            }

            stepsLocal.push({
                type: 'final',
                panel: `All substrings checked.<br>Longest common substring: <b>"${longest}"</b>`,
                complete: true,
                finalResult: longest,
                statusText: `Done. Longest = "${longest}"`,
                log: `\nFinal longest common substring: "${longest}"`,
                bold: true,
                longest: longest
            });

            return stepsLocal;
        }

        function generateSteps() {
            steps = findLongestCommonSubstring();
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Row 1: String A
            const rowA = document.createElement('div');
            rowA.className = 'string-row';
            const labelA = document.createElement('div');
            labelA.className = 'string-label';
            labelA.innerText = 'A';
            rowA.appendChild(labelA);

            currentA.split('').forEach((ch, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'idle';
                if (step.i !== undefined && pos >= step.i && pos <= step.j) cls = 'expanding';
                if (step.i !== undefined && pos === step.i) cls = 'center';
                if (step.type === 'new-longest' && pos >= step.i && pos <= step.j) cls = 'valid-pal';
                tile.className = `tile ${cls}`;
                tile.innerText = ch;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = pos;
                unit.appendChild(tile);
                unit.appendChild(idxLabel);
                rowA.appendChild(unit);
            });
            container.appendChild(rowA);

            // Row 2: String B
            const rowB = document.createElement('div');
            rowB.className = 'string-row';
            const labelB = document.createElement('div');
            labelB.className = 'string-label';
            labelB.innerText = 'B';
            rowB.appendChild(labelB);

            currentB.split('').forEach((ch, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'idle';
                if (step.k !== undefined && pos >= step.k && pos < step.k + (step.j - step.i + 1 || 0)) cls = 'expanding';
                if (step.type === 'new-longest' && step.k !== undefined && pos >= step.k && pos < step.k + (step.j - step.i + 1 || 0)) cls = 'valid-pal';
                tile.className = `tile ${cls}`;
                tile.innerText = ch;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = pos;
                unit.appendChild(tile);
                unit.appendChild(idxLabel);
                rowB.appendChild(unit);
            });
            container.appendChild(rowB);

            document.getElementById('main-panel').innerHTML = step.panel || '—';

            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-j').innerText = step.j !== undefined ? step.j : '—';
            document.getElementById('val-k').innerText = step.k !== undefined ? step.k : '—';
            document.getElementById('val-len').innerText = step.longest ? step.longest.length : '—';
            document.getElementById('val-longest').innerText = `"${step.longest || ''}"`;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.finalResult !== undefined ? `"${step.finalResult}"` : (step.longest || '—');
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
