<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normalize & Deduplicate Usernames - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 340px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 16px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row { display: flex; gap: 8px; align-items: center; }
        .string-label { font-family: monospace; font-size: 13px; color: var(--text-dim); min-width: 90px; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">usernames =</label>
        <input type="text" id="str-input" placeholder='["a.b+c", "ab", "A.B"]'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (["a.b+c","ab","A.B"])</button>
        <button onclick="loadExample(1)">Ex 2 (test.email...)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Normalization & Deduplication Process</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Username</span>
            <span class="info-value" id="val-current" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Normalized</span>
            <span class="info-value" id="val-norm" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Unique Count</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">0</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">unique normalized usernames =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Char</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Processing</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> New Unique</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Duplicate</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentUsernames = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(0); }

        function loadExample(ex) {
            if (ex === 0) currentUsernames = ["a.b+c", "ab", "A.B"];
            else currentUsernames = ["test.email+alex@leetcode.com", "test.e.mail+bob.cathy@leetcode.com", "testemail+david@lee.tcode.com"];
            document.getElementById('str-input').value = JSON.stringify(currentUsernames);
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const val = document.getElementById('str-input').value.trim();
                currentUsernames = JSON.parse(val);
                if (!Array.isArray(currentUsernames)) throw "";
                generateSteps();
                reset();
            } catch(e) {
                alert("Enter valid JSON array e.g. [\"a.b+c\", \"ab\"]");
            }
        }

        function generateSteps() {
            steps = [];
            let seen = new Set();
            let uniqueCount = 0;

            steps.push({
                type: 'init',
                current: '',
                normalized: '',
                uniqueCount: 0,
                panel: `Input: <b>${JSON.stringify(currentUsernames)}</b><br>Normalizing (lowercase, remove ., ignore after +)`,
                statusText: `Starting normalization & deduplication...`,
                log: `Problem initialized with ${currentUsernames.length} usernames.`,
                states: []
            });

            for (let i = 0; i < currentUsernames.length; i++) {
                const original = currentUsernames[i];
                let norm = '';
                let stepLog = `Processing "${original}": `;

                steps.push({
                    type: 'start',
                    current: original,
                    normalized: '',
                    uniqueCount: uniqueCount,
                    panel: `Processing username <b>${i+1}</b>: "${original}"`,
                    statusText: `Normalizing "${original}"...`,
                    log: stepLog,
                    states: []
                });

                // Build normalized step by step
                for (let j = 0; j < original.length; j++) {
                    let ch = original[j];
                    let displayCh = ch;

                    if (ch === '+') {
                        steps.push({
                            type: 'stop',
                            current: original,
                            normalized: norm,
                            uniqueCount: uniqueCount,
                            panel: `Found '+' → stop processing (ignore rest)`,
                            statusText: `Truncating at '+'`,
                            log: `  + Found '+' → stop`,
                            states: []
                        });
                        break;
                    }

                    if (ch === '.') {
                        steps.push({
                            type: 'skip',
                            current: original,
                            normalized: norm,
                            uniqueCount: uniqueCount,
                            panel: `Skipping '.'`,
                            statusText: `Removing dot`,
                            log: `  . Skipping '.'`,
                            states: []
                        });
                        continue;
                    }

                    // Lowercase
                    if (ch >= 'A' && ch <= 'Z') {
                        ch = ch.toLowerCase();
                        steps.push({
                            type: 'lower',
                            current: original,
                            normalized: norm + ch,
                            uniqueCount: uniqueCount,
                            panel: `Converting uppercase '${displayCh}' → '${ch}'`,
                            statusText: `Lowercasing`,
                            log: `  Lower: '${displayCh}' → '${ch}'`,
                            states: []
                        });
                    } else {
                        steps.push({
                            type: 'add',
                            current: original,
                            normalized: norm + ch,
                            uniqueCount: uniqueCount,
                            panel: `Adding character '${ch}'`,
                            statusText: `Adding '${ch}'`,
                            log: `  + Adding '${ch}'`,
                            states: []
                        });
                    }
                    norm += ch;
                }

                // Final normalized
                const isNew = !seen.has(norm);
                if (isNew) {
                    seen.add(norm);
                    uniqueCount++;
                    steps.push({
                        type: 'new',
                        current: original,
                        normalized: norm,
                        uniqueCount: uniqueCount,
                        panel: `<span style="color:var(--accent-green)">New unique: <b>"${norm}"</b></span>`,
                        statusText: `New unique! Count = ${uniqueCount}`,
                        log: `  → NEW UNIQUE "${norm}"`,
                        states: []
                    });
                } else {
                    steps.push({
                        type: 'duplicate',
                        current: original,
                        normalized: norm,
                        uniqueCount: uniqueCount,
                        panel: `<span style="color:var(--accent-red)">Duplicate: "${norm}" already seen</span>`,
                        statusText: `Duplicate → skipped`,
                        log: `  → Duplicate "${norm}"`,
                        states: []
                    });
                }
            }

            steps.push({
                type: 'final',
                current: '',
                normalized: '',
                uniqueCount: uniqueCount,
                complete: true,
                finalResult: uniqueCount,
                panel: `All usernames processed.<br>Unique normalized usernames: <b>${uniqueCount}</b>`,
                statusText: `Done. Final unique count: ${uniqueCount}`,
                log: `\nFinal Result: ${uniqueCount} unique normalized usernames.`,
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            if (step.current) {
                const row = document.createElement('div');
                row.className = 'string-row';

                const label = document.createElement('div');
                label.className = 'string-label';
                label.innerText = "Current:";
                row.appendChild(label);

                step.current.split('').forEach((char, i) => {
                    const unit = document.createElement('div');
                    unit.className = 'tile-unit';
                    const tile = document.createElement('div');
                    tile.className = `tile ${step.type === 'stop' && i >= step.normalized.length ? 'mismatch' : 'idle'}`;
                    tile.innerText = char;
                    const idxLabel = document.createElement('div');
                    idxLabel.className = 'tile-index';
                    idxLabel.innerText = `[${i}]`;
                    unit.append(tile, idxLabel);
                    row.appendChild(unit);
                });
                container.appendChild(row);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-current').innerText = step.current || '—';
            document.getElementById('val-norm').innerText = `"${step.normalized || ''}"`;
            document.getElementById('val-count').innerText = step.uniqueCount;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalResult : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
