<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check if String Can Be Rearranged to Form Palindrome - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 240px; font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 860px; }
        .string-display {
            display: flex; gap: 6px; justify-content: center; padding: 20px;
            background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .tile {
            width: 48px; height: 58px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 6px;
            font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile .index { font-size: 9px; color: var(--text-dim); margin-top: 3px; }
        .tile.current { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.1); }
        .tile.odd { background: #2a0d0d; border-color: var(--accent-red); }
        .tile.even { background: #0f2a1a; border-color: var(--accent-green); }

        .freq-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 16px; width: 720px;
        }
        .freq-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
        .freq-item {
            background: #21262d; border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 60px;
        }
        .freq-char { font-size: 18px; font-weight: 700; }
        .freq-count { font-size: 13px; color: var(--text-dim); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; min-height: 90px; font-family: monospace;
            font-size: 14.5px; line-height: 1.55; text-align: center;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 17px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 18px; font-size: 26px; font-family: monospace; color: var(--accent-green); }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); min-height: 24px; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 12.5px; color: var(--text-dim); }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" value="aabb">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("aabb")</button>
        <button onclick="loadExample(1)">Ex 2 ("aabc")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">HashMap Odd Count Check – Palindrome Rearrangement</div>
        <div class="string-display" id="tiles-container"></div>
        <div class="freq-panel" id="freq-panel"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Char</span>
            <span class="info-value" id="val-char" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Odd Counts</span>
            <span class="info-value" id="val-odd" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Status</span>
            <span class="info-value" id="val-status" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Current Char</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Even Count</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-red);border-radius:4px"></span> Odd Count</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "aabb";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1100, 550, 260];

        function loadExample(ex) {
            if (ex === 0) currentS = "aabb";
            else currentS = "aabc";
            document.getElementById('str-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentS = document.getElementById('str-input').value.trim() || currentS;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let freq = {};
            let oddCount = 0;
            let processed = new Set();

            steps.push({
                type: 'init',
                freq: {},
                oddCount: 0,
                panel: `String: <b>"${currentS}"</b>`,
                statusText: 'Starting frequency count...',
                log: 'Initialize frequency map',
                char: '',
                count: 0,
                complete: false
            });

            for (let i = 0; i < currentS.length; i++) {
                const ch = currentS[i];
                if (!freq[ch]) freq[ch] = 0;
                freq[ch]++;
                const isOdd = freq[ch] % 2 === 1;
                const prevOdd = (freq[ch] - 1) % 2 === 1;

                steps.push({
                    type: 'count',
                    freq: {...freq},
                    oddCount: Object.values(freq).filter(c => c % 2 === 1).length,
                    panel: `Count '${ch}' → ${freq[ch]}`,
                    statusText: `Updated frequency of '${ch}'`,
                    log: `Char '${ch}' count = ${freq[ch]} (${isOdd ? 'odd' : 'even'})`,
                    char: ch,
                    count: freq[ch],
                    complete: false
                });
            }

            const finalOdd = Object.values(freq).filter(c => c % 2 === 1).length;
            steps.push({
                type: 'final',
                freq: {...freq},
                oddCount: finalOdd,
                panel: finalOdd <= 1 ? `✅ <b>YES</b> (odd counts: ${finalOdd})` : `❌ <b>NO</b> (odd counts: ${finalOdd})`,
                statusText: finalOdd <= 1 ? 'Can form palindrome' : 'Cannot form palindrome',
                log: `\nFinal odd counts: ${finalOdd} → ${finalOdd <= 1 ? 'YES' : 'NO'}`,
                char: '',
                count: 0,
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // String tiles
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            for (let k = 0; k < currentS.length; k++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<span>${currentS[k]}</span><span class="index">[${k}]</span>`;
                if (step.char === currentS[k]) tile.classList.add('current');
                container.appendChild(tile);
            }

            // Frequency panel
            const freqPanel = document.getElementById('freq-panel');
            freqPanel.innerHTML = '<div class="freq-row">';
            Object.keys(step.freq || {}).sort().forEach(ch => {
                const count = step.freq[ch];
                const isOdd = count % 2 === 1;
                const item = document.createElement('div');
                item.className = `freq-item ${isOdd ? 'odd' : 'even'}`;
                item.innerHTML = `
                    <div class="freq-char">${ch}</div>
                    <div class="freq-count">${count} ${isOdd ? '(odd)' : '(even)'}</div>
                `;
                freqPanel.appendChild(item);
            });
            freqPanel.innerHTML += '</div>';

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-char').innerText = step.char || '—';
            document.getElementById('val-odd').innerText = step.oddCount || '0';
            document.getElementById('val-status').innerText = step.complete ? (step.oddCount <= 1 ? 'YES' : 'NO') : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? (step.oddCount <= 1 ? 'YES' : 'NO') : '—';

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const line = document.createElement('div');
                line.style.marginBottom = '3px';
                line.innerText = steps[k].log || '';
                logPanel.appendChild(line);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value | 0]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = () => { loadExample(0); };
    </script>
</body>
</html>
