<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>34 - Longest Common Substring - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface);
            padding: 12px 16px; display: flex; justify-content: center;
            align-items: center; gap: 8px; border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 240px; font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px;
            background: var(--btn-bg); border: 1px solid var(--border-main);
            color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container {
            margin-top: 30px; display: flex; flex-direction: column;
            align-items: center; gap: 24px; width: 100%; max-width: 980px;
        }

        .string-row {
            display: flex; gap: 8px; align-items: center;
        }
        .string-label {
            font-family: monospace; font-size: 13px;
            color: var(--text-dim); min-width: 42px; text-align: right;
        }
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .tile {
            min-width: 42px; height: 42px; display: flex; align-items: center;
            justify-content: center; border-radius: 6px; font-size: 20px;
            font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.12); }
        .tile.match { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }
        .tile.idle { opacity: 0.85; }

        .dp-container {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 8px; padding: 12px; overflow-x: auto;
        }
        .dp-grid {
            display: grid; gap: 2px; background: #21262d; padding: 2px;
            border-radius: 6px;
        }
        .dp-cell {
            width: 38px; height: 38px; display: flex; align-items: center;
            justify-content: center; font-family: monospace; font-size: 14px;
            font-weight: 700; background: #161b22; color: var(--text-main);
            transition: all 0.2s ease;
        }
        .dp-cell.header { background: #21262d; color: var(--text-dim); font-size: 11px; }
        .dp-cell.current { background: #1e1030; border: 2px solid var(--accent-purple); color: var(--accent-purple); transform: scale(1.1); }
        .dp-cell.match { background: #0f2a1a; color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        .action-panel {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 720px; min-height: 88px;
            text-align: center; font-family: monospace; font-size: 15px; line-height: 1.5;
        }

        .info-panel {
            display: flex; gap: 18px; justify-content: center; flex-wrap: wrap;
        }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 8px 18px; text-align: center; min-width: 110px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 18px; font-weight: 700; font-family: monospace; }

        .result-display {
            margin-top: 10px; font-size: 22px; font-family: monospace;
            color: var(--accent-green); font-weight: bold;
        }

        .status-bar {
            margin-top: 8px; font-size: 13px; color: var(--text-dim);
            height: 1.3em; text-align: center; width: 720px;
        }

        .controls {
            margin-top: 20px; display: flex; align-items: center; gap: 10px;
        }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend {
            margin-top: 12px; display: flex; gap: 20px; flex-wrap: wrap;
            justify-content: center; font-size: 12px; color: var(--text-dim);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%;
            height: 160px; overflow-y: auto; font-family: 'Courier New', monospace;
            font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s1 = </label>
        <input type="text" id="s1-input" value="abcdxyz">
        <label class="ui-label">s2 = </label>
        <input type="text" id="s2-input" value="xyzabcd">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (abcdxyz, xyzabcd)</button>
        <button onclick="loadExample(1)">Ex 2 (hello, world)</button>
    </div>

    <div class="visual-container">
        <!-- s1 row -->
        <div class="string-row" id="s1-row"></div>
        <!-- s2 row -->
        <div class="string-row" id="s2-row"></div>

        <!-- DP table -->
        <div class="dp-container">
            <div class="dp-grid" id="dp-grid"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to begin DP filling</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">i (s1)</span>
            <span class="info-value" id="val-i" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">j (s2)</span>
            <span class="info-value" id="val-j" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Length</span>
            <span class="info-value" id="val-curr" style="color:var(--accent-green)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max Length</span>
            <span class="info-value" id="val-max" style="color:var(--accent-green)">0</span>
        </div>
    </div>

    <div class="result-display" id="result-text"></div>
    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Current cell (i,j)</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Match → extend length</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-red);border-radius:4px"></span> Mismatch → reset to 0</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let s1 = "", s2 = "";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1100, 580, 280];

        function generateSteps() {
            steps = [];
            const n = s1.length;
            const m = s2.length;

            // Initialize
            let dp = Array(n + 1).fill().map(() => Array(m + 1).fill(0));
            let maxLen = 0;

            steps.push({
                type: 'init',
                dp: dp.map(row => [...row]),
                i: 0, j: 0,
                panel: `s1 = "<b>${s1}</b>"<br>s2 = "<b>${s2}</b>"`,
                status: 'Initializing DP table (n+1)×(m+1) with zeros',
                log: `dp = [[0]*${m+1} for _ in range(${n+1})]\nmax_len = 0`
            });

            // Fill table
            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= m; j++) {
                    const oldDp = dp.map(row => [...row]);
                    let currLen = 0;

                    if (s1[i-1] === s2[j-1]) {
                        currLen = dp[i-1][j-1] + 1;
                        dp[i][j] = currLen;
                        if (currLen > maxLen) maxLen = currLen;
                    } else {
                        dp[i][j] = 0;
                    }

                    steps.push({
                        type: s1[i-1] === s2[j-1] ? 'match' : 'mismatch',
                        dp: dp.map(row => [...row]),
                        i: i, j: j,
                        currLen: currLen,
                        maxLen: maxLen,
                        ch1: s1[i-1],
                        ch2: s2[j-1],
                        panel: `s1[${i-1}]='${s1[i-1]}' vs s2[${j-1}]='${s2[j-1]}'`,
                        status: s1[i-1] === s2[j-1] 
                            ? `MATCH → dp[${i}][${j}] = ${currLen} (new max = ${maxLen})`
                            : `MISMATCH → dp[${i}][${j}] = 0`,
                        log: `i=${i}, j=${j} | '${s1[i-1]}' ${s1[i-1]===s2[j-1]?'==':'≠'} '${s2[j-1]}' → dp[${i}][${j}]=${dp[i][j]} | max=${maxLen}`
                    });
                }
            }

            // Final
            steps.push({
                type: 'final',
                dp: dp.map(row => [...row]),
                i: n+1, j: m+1,
                maxLen: maxLen,
                panel: `<span style="color:var(--accent-green)">LONGEST COMMON SUBSTRING LENGTH = <b>${maxLen}</b></span>`,
                status: `Completed! Longest common substring length = ${maxLen}`,
                log: `\n=== FINAL RESULT ===\nLongest common substring length = ${maxLen}`,
                complete: true
            });
        }

        function renderStrings() {
            const renderRow = (containerId, str, highlightI = -1) => {
                const container = document.getElementById(containerId);
                container.innerHTML = `<div class="string-label">${containerId === 's1-row' ? 's1' : 's2'}</div>`;
                str.split('').forEach((ch, idx) => {
                    const unit = document.createElement('div');
                    unit.className = 'tile-unit';
                    const tile = document.createElement('div');
                    tile.className = `tile ${idx === highlightI ? 'center' : 'idle'}`;
                    tile.textContent = ch;
                    const idxEl = document.createElement('div');
                    idxEl.style.fontSize = '10px';
                    idxEl.style.color = '#8b949e';
                    idxEl.textContent = idx;
                    unit.append(tile, idxEl);
                    container.appendChild(unit);
                });
            };
            renderRow('s1-row', s1);
            renderRow('s2-row', s2);
        }

        function renderDP(step) {
            const grid = document.getElementById('dp-grid');
            grid.style.gridTemplateColumns = `repeat(${s2.length + 2}, 38px)`;
            grid.innerHTML = '';

            // Header row
            const headerRow = document.createElement('div');
            headerRow.style.display = 'contents';
            const empty = document.createElement('div'); empty.className = 'dp-cell header'; empty.textContent = ' ';
            grid.appendChild(empty);
            for (let j = 0; j <= s2.length; j++) {
                const cell = document.createElement('div');
                cell.className = 'dp-cell header';
                cell.textContent = j === 0 ? ' ' : s2[j-1];
                grid.appendChild(cell);
            }

            // Data rows
            for (let i = 0; i <= s1.length; i++) {
                // Row label
                const label = document.createElement('div');
                label.className = 'dp-cell header';
                label.textContent = i === 0 ? ' ' : s1[i-1];
                grid.appendChild(label);

                for (let j = 0; j <= s2.length; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'dp-cell';
                    cell.textContent = step.dp[i][j];
                    if (i === step.i && j === step.j) cell.classList.add('current');
                    if (step.type === 'match' && i === step.i && j === step.j) cell.classList.add('match');
                    grid.appendChild(cell);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render string highlights
            const s1Container = document.getElementById('s1-row');
            const s2Container = document.getElementById('s2-row');
            renderStrings(); // reset first
            if (step.i > 0 && step.i <= s1.length) {
                const tiles = s1Container.querySelectorAll('.tile');
                if (tiles[step.i - 1]) tiles[step.i - 1].classList.add('center');
            }
            if (step.j > 0 && step.j <= s2.length) {
                const tiles = s2Container.querySelectorAll('.tile');
                if (tiles[step.j - 1]) tiles[step.j - 1].classList.add('center');
            }

            // DP grid
            renderDP(step);

            // Panel
            document.getElementById('main-panel').innerHTML = step.panel;

            // Info
            document.getElementById('val-i').textContent = step.i || '—';
            document.getElementById('val-j').textContent = step.j || '—';
            document.getElementById('val-curr').textContent = step.currLen !== undefined ? step.currLen : '—';
            document.getElementById('val-max').textContent = step.maxLen || 0;

            // Result
            const res = document.getElementById('result-text');
            if (step.complete) {
                res.innerHTML = `Longest Common Substring Length = <b>${step.maxLen}</b>`;
            } else res.textContent = '';

            document.getElementById('status-text').textContent = step.status;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = steps.slice(0, idx + 1).map(s => `<div>${s.log}</div>`).join('');
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(idx) {
            if (idx === 0) {
                s1 = "abcdxyz";
                s2 = "xyzabcd";
            } else {
                s1 = "hello";
                s2 = "world";
            }
            document.getElementById('s1-input').value = s1;
            document.getElementById('s2-input').value = s2;
            generateSteps();
            reset();
        }

        function loadCustom() {
            s1 = document.getElementById('s1-input').value.trim() || "abcdxyz";
            s2 = document.getElementById('s2-input').value.trim() || "xyzabcd";
            generateSteps();
            reset();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
