<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Isomorphic Strings - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 180px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 8px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 110px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 700px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }

        .map-panel {
            margin-top: 15px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 10px; width: 700px; font-family: monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s1 =</label>
        <input type="text" id="s1-input" placeholder="egg">
        <label class="ui-label">s2 =</label>
        <input type="text" id="s2-input" placeholder="add">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 ("egg", "add" → True)</button>
        <button onclick="loadExample(2)">Ex 2 ("foo", "bar" → False)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Two HashMap: Forward + Reverse Mapping Check</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">s1 char</span>
            <span class="info-value" id="val-s1char" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">s2 char</span>
            <span class="info-value" id="val-s2char" style="color: var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="map-panel" id="map-panel">
        map_s1→s2: {}<br>
        map_s2→s1: {}
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Isomorphic =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Position</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Mapping</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Conflict → False</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS1 = "egg";
        let currentS2 = "add";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentS1 = "egg";
                currentS2 = "add";
            } else {
                currentS1 = "foo";
                currentS2 = "bar";
            }
            document.getElementById('s1-input').value = currentS1;
            document.getElementById('s2-input').value = currentS2;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const s1Val = document.getElementById('s1-input').value.trim();
            const s2Val = document.getElementById('s2-input').value.trim();
            if (s1Val && s2Val) {
                currentS1 = s1Val;
                currentS2 = s2Val;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            const n1 = currentS1.length;
            const n2 = currentS2.length;

            // INIT
            steps.push({
                type: 'init',
                i: -1,
                s1char: '—',
                s2char: '—',
                mapS1: {},
                mapS2: {},
                panel: `s1 = <b>"${currentS1}"</b> (length ${n1})<br>s2 = <b>"${currentS2}"</b> (length ${n2})<br>Checking bidirectional one-to-one mapping.`,
                statusText: `Starting isomorphic check...`,
                log: `s1="${currentS1}", s2="${currentS2}"`
            });

            if (n1 !== n2) {
                steps.push({
                    type: 'final',
                    i: 0,
                    s1char: '—',
                    s2char: '—',
                    mapS1: {},
                    mapS2: {},
                    panel: `Lengths differ (${n1} ≠ ${n2}) → <span style="color:var(--accent-red)">False</span>`,
                    statusText: `Lengths unequal → False`,
                    log: `Lengths differ → False`,
                    complete: true,
                    finalResult: false
                });
                return;
            }

            const mapS1toS2 = {};
            const mapS2toS1 = {};

            let valid = true;

            for (let i = 0; i < n1; i++) {
                const c1 = currentS1[i];
                const c2 = currentS2[i];

                let states1 = Array(n1).fill('idle');
                let states2 = Array(n2).fill('idle');
                states1[i] = 'center';
                states2[i] = 'center';

                steps.push({
                    type: 'check',
                    i: i,
                    s1char: c1,
                    s2char: c2,
                    mapS1: {...mapS1toS2},
                    mapS2: {...mapS2toS1},
                    panel: `i = <b>${i}</b><br>s1 char: <b>'${c1}'</b><br>s2 char: <b>'${c2}'</b>`,
                    statusText: `Checking pair ('${c1}', '${c2}')`,
                    log: `  i=${i}: '${c1}' ↔ '${c2}'`
                });

                if (c1 in mapS1toS2) {
                    if (mapS1toS2[c1] !== c2) {
                        valid = false;
                        steps.push({
                            type: 'conflict',
                            i: i,
                            s1char: c1,
                            s2char: c2,
                            mapS1: {...mapS1toS2},
                            mapS2: {...mapS2toS1},
                            panel: `<span style="color:var(--accent-red)">Conflict!</span> '${c1}' was mapped to '${mapS1toS2[c1]}' but now trying to map to '${c2}'`,
                            statusText: `Conflict → False`,
                            log: `    Conflict! Return False`,
                            complete: true,
                            finalResult: false
                        });
                        break;
                    }
                } else {
                    if (c2 in mapS2toS1) {
                        valid = false;
                        steps.push({
                            type: 'conflict',
                            i: i,
                            s1char: c1,
                            s2char: c2,
                            mapS1: {...mapS1toS2},
                            mapS2: {...mapS2toS1},
                            panel: `<span style="color:var(--accent-red)">Conflict!</span> '${c2}' already mapped from another character`,
                            statusText: `Conflict → False`,
                            log: `    Conflict! Return False`,
                            complete: true,
                            finalResult: false
                        });
                        break;
                    }
                    mapS1toS2[c1] = c2;
                    mapS2toS1[c2] = c1;
                }
            }

            if (valid) {
                steps.push({
                    type: 'final',
                    i: n1,
                    s1char: '—',
                    s2char: '—',
                    mapS1: {...mapS1toS2},
                    mapS2: {...mapS2toS1},
                    panel: `All characters checked successfully.<br>No conflicts → <span style="color:var(--accent-green)">True</span>`,
                    statusText: `All mappings consistent → True`,
                    log: `\nNo conflicts → True`,
                    complete: true,
                    finalResult: true
                });
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Row 1: s1
            const row1 = document.createElement('div');
            row1.className = 'string-row';
            const label1 = document.createElement('div');
            label1.className = 'string-label';
            label1.innerText = 's1';
            row1.appendChild(label1);

            currentS1.split('').forEach((char, k) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'tile idle';
                if (step.i >= 0 && k === step.i) cls = 'tile center';
                tile.className = cls;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${k}]`;
                unit.append(tile, idxLabel);
                row1.appendChild(unit);
            });
            container.appendChild(row1);

            // Row 2: s2
            const row2 = document.createElement('div');
            row2.className = 'string-row';
            const label2 = document.createElement('div');
            label2.className = 'string-label';
            label2.innerText = 's2';
            row2.appendChild(label2);

            currentS2.split('').forEach((char, k) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'tile idle';
                if (step.i >= 0 && k === step.i) cls = 'tile center';
                tile.className = cls;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${k}]`;
                unit.append(tile, idxLabel);
                row2.appendChild(unit);
            });
            container.appendChild(row2);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i >= 0 ? step.i : '—';
            document.getElementById('val-s1char').innerText = step.s1char || '—';
            document.getElementById('val-s2char').innerText = step.s2char || '—';

            const mapPanel = document.getElementById('map-panel');
            mapPanel.innerHTML = `map_s1→s2: ${JSON.stringify(step.mapS1 || {})}<br>map_s2→s1: ${JSON.stringify(step.mapS2 || {})}`;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult ? 'True' : 'False';
                resVal.style.color = step.finalResult ? 'var(--accent-green)' : 'var(--accent-red)';
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.style.color = '';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
