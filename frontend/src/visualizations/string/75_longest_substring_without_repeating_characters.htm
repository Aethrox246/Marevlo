<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>38 - Longest Substring Without Repeating Characters - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface);
            padding: 12px 16px; display: flex; justify-content: center;
            align-items: center; gap: 8px; border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 240px; font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px;
            background: var(--btn-bg); border: 1px solid var(--border-main);
            color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container {
            margin-top: 30px; display: flex; flex-direction: column;
            align-items: center; gap: 24px; width: 100%; max-width: 860px;
        }

        .string-row {
            display: flex; gap: 8px; align-items: center;
        }
        .string-label {
            font-family: monospace; font-size: 13px;
            color: var(--text-dim); min-width: 60px; text-align: right;
        }
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 46px; height: 46px; display: flex; align-items: center;
            justify-content: center; border-radius: 8px; font-size: 22px;
            font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.12); }
        .tile.in-window { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); }
        .tile.duplicate { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }
        .tile.idle { opacity: 0.85; }

        .action-panel {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 720px; min-height: 88px;
            text-align: center; font-family: monospace; font-size: 15px; line-height: 1.5;
        }

        .info-panel {
            display: flex; gap: 18px; justify-content: center; flex-wrap: wrap;
        }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 8px 18px; text-align: center; min-width: 120px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 18px; font-weight: 700; font-family: monospace; }

        .result-display {
            margin-top: 12px; font-size: 22px; font-family: monospace;
            color: var(--accent-green); font-weight: bold;
        }

        .status-bar {
            margin-top: 8px; font-size: 13px; color: var(--text-dim);
            height: 1.3em; text-align: center; width: 720px;
        }

        .controls {
            margin-top: 24px; display: flex; align-items: center; gap: 10px;
        }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend {
            margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap;
            justify-content: center; font-size: 12px; color: var(--text-dim);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%;
            height: 170px; overflow-y: auto; font-family: 'Courier New', monospace;
            font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s = </label>
        <input type="text" id="str-input" value="abcabcbb">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1: abcabcbb</button>
        <button onclick="loadExample(1)">Ex 2: bbbbb</button>
    </div>

    <div class="visual-container">
        <div class="string-row" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to start sliding window</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Left</span>
            <span class="info-value" id="val-left" style="color:var(--accent-blue)">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Right</span>
            <span class="info-value" id="val-right" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Window</span>
            <span class="info-value" id="val-window" style="color:var(--accent-green)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max Length</span>
            <span class="info-value" id="val-max" style="color:var(--accent-green)">0</span>
        </div>
    </div>

    <div class="result-display" id="result-text"></div>
    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Current Window</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Right Pointer</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-blue);border-radius:4px"></span> Left Pointer</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-red);border-radius:4px"></span> Duplicate</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "abcabcbb";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1100, 550, 280];

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let left = 0;
            let maxLen = 0;
            let charSet = new Set();
            let windowStart = 0;

            steps.push({
                type: 'init',
                left: 0, right: -1,
                maxLen: 0,
                panel: `s = "<b>${currentS}</b>"`,
                status: 'Starting sliding window... left=0, right=-1',
                log: `left=0, maxLen=0, set={}`
            });

            for (let right = 0; right < n; right++) {
                const ch = currentS[right];

                // Shrink window while duplicate
                while (charSet.has(ch)) {
                    charSet.delete(currentS[left]);
                    left++;
                    steps.push({
                        type: 'shrink',
                        left: left, right: right,
                        ch: ch,
                        maxLen: maxLen,
                        panel: `Duplicate '${ch}' found → shrink left to ${left}`,
                        status: `Removing '${currentS[left-1]}' to resolve duplicate`,
                        log: `Duplicate '${ch}' → left moved to ${left}`
                    });
                }

                charSet.add(ch);

                const currLen = right - left + 1;
                if (currLen > maxLen) maxLen = currLen;

                steps.push({
                    type: 'expand',
                    left: left, right: right,
                    ch: ch,
                    maxLen: maxLen,
                    panel: `Added '${ch}' → window = s[${left}:${right+1}]`,
                    status: `Window size = ${currLen}, max so far = ${maxLen}`,
                    log: `right=${right}, char='${ch}', window_size=${currLen}, maxLen=${maxLen}`
                });
            }

            steps.push({
                type: 'final',
                left: left, right: n-1,
                maxLen: maxLen,
                panel: `<span style="color:var(--accent-green)">FINAL RESULT: Longest substring length = <b>${maxLen}</b></span>`,
                status: `Completed! Longest unique substring length = ${maxLen}`,
                log: `\n=== FINAL ===\nLongest substring without repeating characters length = ${maxLen}`,
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = `<div class="string-label">s</div>`;

            currentS.split('').forEach((ch, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';

                const tile = document.createElement('div');
                let cls = 'tile idle';
                if (pos === step.right) cls = 'tile center';
                else if (pos >= step.left && pos <= step.right) cls = 'tile in-window';
                else if (step.type === 'shrink' && pos === step.left - 1) cls = 'tile duplicate';
                tile.className = cls;
                tile.textContent = ch;

                const idxEl = document.createElement('div');
                idxEl.style.fontSize = '10px';
                idxEl.style.color = '#8b949e';
                idxEl.textContent = pos;

                unit.append(tile, idxEl);
                container.appendChild(unit);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-left').textContent = step.left;
            document.getElementById('val-right').textContent = step.right !== undefined ? step.right : '—';
            document.getElementById('val-window').textContent = step.left !== undefined && step.right !== undefined ? `${step.right - step.left + 1}` : '—';
            document.getElementById('val-max').textContent = step.maxLen || 0;

            const res = document.getElementById('result-text');
            if (step.complete) {
                res.innerHTML = `Longest length = <b>${step.maxLen}</b>`;
            } else res.textContent = '';

            document.getElementById('status-text').textContent = step.status;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = steps.slice(0, idx + 1).map(s => `<div>${s.log}</div>`).join('');
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(idx) {
            currentS = idx === 0 ? "abcabcbb" : "bbbbb";
            document.getElementById('str-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentS = document.getElementById('str-input').value.trim() || "abcabcbb";
            generateSteps();
            reset();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
