<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimum Window Subsequence - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 520px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 130px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 90px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">params =</label>
        <input type="text" id="str-input" placeholder='{"S":"abcdebdde","T":"bde"}'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("abcdebdde" + "bde")</button>
        <button onclick="loadExample(1)">Ex 2 ("jmeqksfrsdcmsiwvaovztaqenprpvnbstl" + "m")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force: Check all substrings of S, verify T as subsequence, track shortest</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Start i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">End j</span>
            <span class="info-value" id="val-j" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Subseq Match?</span>
            <span class="info-value" id="val-match" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Shortest So Far</span>
            <span class="info-value" id="val-short" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">min window =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Start i</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Current End j</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Window / New Min</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Not Valid</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "abcdebdde";
        let currentT = "bde";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1300, 650, 325];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentS = "abcdebdde";
                currentT = "bde";
            } else {
                currentS = "jmeqksfrsdcmsiwvaovztaqenprpvnbstl";
                currentT = "m";
            }
            document.getElementById('str-input').value = JSON.stringify({
                S: currentS,
                T: currentT
            });
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const val = document.getElementById('str-input').value.trim();
                const parsed = JSON.parse(val);
                currentS = parsed.S || "";
                currentT = parsed.T || "";
                generateSteps();
                reset();
            } catch(e) {
                alert("Please enter valid JSON like {\"S\":\"abcdebdde\",\"T\":\"bde\"}");
            }
        }

        function isSubsequence(S_sub, T) {
            let j = 0;
            for (let i = 0; i < S_sub.length && j < T.length; i++) {
                if (S_sub[i] === T[j]) {
                    j++;
                }
            }
            return j === T.length;
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let minLen = Infinity;
            let minStart = -1;
            let minEnd = -1;

            // INIT
            steps.push({
                type: 'init',
                i: 0,
                j: 0,
                panel: `S: <b>"${currentS}"</b> (n=${n})<br>T: <b>"${currentT}"</b> (m=${currentT.length})<br>Check all substrings S[i:j+1] for T as subsequence`,
                statusText: `Starting brute-force enumeration...`,
                log: `Problem initialized.\nS="${currentS}"\nT="${currentT}"`,
                minWindow: ""
            });

            for (let i = 0; i < n; i++) {
                for (let j = i; j < n; j++) {
                    const sub = currentS.substring(i, j + 1);
                    const isValid = isSubsequence(sub, currentT);

                    steps.push({
                        type: isValid ? 'valid' : 'invalid',
                        i: i,
                        j: j,
                        panel: `Substring S[${i}:${j+1}] = <b>"${sub}"</b> → ${isValid ? '<span style="color:var(--accent-green)">valid subsequence</span>' : '<span style="color:var(--accent-red)">invalid</span>'}`,
                        statusText: `i=${i}, j=${j}: "${sub}"`,
                        log: `  i=${i}, j=${j}: "${sub}" ${isValid ? '(valid)' : '(invalid)'}`
                    });

                    if (isValid && (j - i + 1) < minLen) {
                        minLen = j - i + 1;
                        minStart = i;
                        minEnd = j;
                        steps.push({
                            type: 'new-min',
                            i: i,
                            j: j,
                            panel: `<span style="color:var(--accent-green)">New minimum window!</span> "${sub}" (length ${minLen})`,
                            statusText: `New min length ${minLen}`,
                            log: `    → New min window "${sub}"`
                        });
                    }
                }
            }

            const minWindow = minStart !== -1 ? currentS.substring(minStart, minEnd + 1) : "";

            steps.push({
                type: 'final',
                panel: minStart !== -1 ? 
                    `All substrings checked.<br>Shortest window containing T as subsequence: <b>"${minWindow}"</b>` : 
                    `No valid window found → return <b>""</b>`,
                complete: true,
                finalResult: minWindow,
                statusText: `Done. Min window: "${minWindow}"`,
                log: `\nFinal: "${minWindow}"`,
                bold: true,
                minWindow: minWindow
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Row 1: Full S
            const rowFull = document.createElement('div');
            rowFull.className = 'string-row';
            const labelFull = document.createElement('div');
            labelFull.className = 'string-label';
            labelFull.innerText = 'S';
            rowFull.appendChild(labelFull);

            currentS.split('').forEach((ch, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'idle';
                if (step.i !== undefined && pos >= step.i && pos <= step.j) cls = 'expanding';
                if (step.i !== undefined && pos === step.i) cls = 'center';
                if (step.type === 'new-min' && pos >= step.i && pos <= step.j) cls = 'valid-pal';
                tile.className = `tile ${cls}`;
                tile.innerText = ch;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = pos;
                unit.appendChild(tile);
                unit.appendChild(idxLabel);
                rowFull.appendChild(unit);
            });
            container.appendChild(rowFull);

            // Row 2: T
            const rowT = document.createElement('div');
            rowT.className = 'string-row';
            const labelT = document.createElement('div');
            labelT.className = 'string-label';
            labelT.innerText = 'T';
            rowT.appendChild(labelT);

            currentT.split('').forEach((ch) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile ${step.type === 'valid' || step.type === 'new-min' ? 'valid-pal' : 'idle'}`;
                tile.innerText = ch;
                unit.appendChild(tile);
                rowT.appendChild(unit);
            });
            container.appendChild(rowT);

            document.getElementById('main-panel').innerHTML = step.panel || '—';

            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-j').innerText = step.j !== undefined ? step.j : '—';
            document.getElementById('val-match').innerText = step.type === 'valid' || step.type === 'new-min' ? 'YES' : (step.type === 'invalid' ? 'NO' : '—');
            document.getElementById('val-short').innerText = step.minWindow !== undefined ? `"${step.minWindow}"` : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? `"${step.finalResult}"` : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
