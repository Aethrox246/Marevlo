<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decode Ways - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 180px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 110px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 140px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" placeholder='"226"'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("226")</button>
        <button onclick="loadExample(1)">Ex 2 ("12")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Recursive Decoding with Memoization (1-digit or 2-digit choices)</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Index i</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Single Digit</span>
            <span class="info-value" id="val-single" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Two Digits</span>
            <span class="info-value" id="val-two" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Ways from Here</span>
            <span class="info-value" id="val-ways" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">total ways =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Index i</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Single / Two-Digit Choice</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Ways</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Invalid (0)</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "226";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentS = "226";
            } else {
                currentS = "12";
            }
            document.getElementById('str-input').value = JSON.stringify(currentS);
            generateSteps();
            reset();
        }

        function loadCustom() {
            try {
                const val = document.getElementById('str-input').value.trim();
                currentS = JSON.parse(val) || val;
                if (typeof currentS !== 'string') currentS = String(currentS);
                generateSteps();
                reset();
            } catch(e) {
                alert("Please enter a valid digit string like \"226\"");
            }
        }

        function isValidSingle(i) {
            return i < currentS.length && currentS[i] !== '0';
        }

        function isValidTwo(i) {
            if (i + 1 >= currentS.length) return false;
            const two = parseInt(currentS.substring(i, i+2));
            return two >= 10 && two <= 26;
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let memo = {};

            // INIT
            steps.push({
                type: 'init',
                i: 0,
                panel: `String: <b>"${currentS}"</b> (length ${n})<br>Count ways to decode using 1 or 2 digits`,
                statusText: `Starting recursion from index 0...`,
                log: `Problem initialized.\ns = "${currentS}"`,
                ways: 0
            });

            function dfs(i) {
                if (i in memo) {
                    steps.push({
                        type: 'memo-hit',
                        i: i,
                        panel: `Memo hit at index <b>${i}</b> → return ${memo[i]}`,
                        statusText: `Cached result for i=${i}`,
                        log: `  Memo hit i=${i} → ${memo[i]}`,
                        ways: memo[i]
                    });
                    return memo[i];
                }

                if (i === n) {
                    steps.push({
                        type: 'base-case',
                        i: i,
                        panel: `Base case: i == n → return <b>1</b>`,
                        statusText: `Reached end of string`,
                        log: `  Base: i=${i} == n → 1`,
                        ways: 1
                    });
                    memo[i] = 1;
                    return 1;
                }

                let ways = 0;

                // Single digit
                if (isValidSingle(i)) {
                    steps.push({
                        type: 'single',
                        i: i,
                        panel: `Single digit <b>${currentS[i]}</b> → recurse to i+1`,
                        statusText: `Trying single digit at i=${i}`,
                        log: `  Single: ${currentS[i]} → dfs(${i+1})`,
                        ways: 0
                    });
                    ways += dfs(i + 1);
                } else if (currentS[i] === '0') {
                    steps.push({
                        type: 'invalid-single',
                        i: i,
                        panel: `<span style="color:var(--accent-red)">Invalid single digit '0'</span>`,
                        statusText: `Cannot decode '0' alone`,
                        log: `  Invalid single '0' at i=${i}`,
                        ways: 0
                    });
                }

                // Two digits
                if (isValidTwo(i)) {
                    const two = currentS.substring(i, i+2);
                    steps.push({
                        type: 'two',
                        i: i,
                        panel: `Two digits <b>${two}</b> (valid) → recurse to i+2`,
                        statusText: `Trying two digits at i=${i}`,
                        log: `  Two: ${two} → dfs(${i+2})`,
                        ways: ways
                    });
                    ways += dfs(i + 2);
                }

                memo[i] = ways;
                steps.push({
                    type: 'return',
                    i: i,
                    panel: `Ways from index <b>${i}</b>: <b>${ways}</b>`,
                    statusText: `Computed ways(${i}) = ${ways}`,
                    log: `  Return ways(${i}) = ${ways}`,
                    ways: ways
                });
                return ways;
            }

            const total = dfs(0);

            // FINAL
            steps.push({
                type: 'final',
                i: n,
                panel: `All decodings processed.<br>Total ways = <b>${total}</b>`,
                complete: true,
                finalResult: total,
                statusText: `Done. Total ways: ${total}`,
                log: `\nFinal Result: ${total}`,
                bold: true,
                ways: total
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            // Row 1: Digits string
            const row1 = document.createElement('div');
            row1.className = 'string-row';
            const label1 = document.createElement('div');
            label1.className = 'string-label';
            label1.innerText = 'Digits';
            row1.appendChild(label1);
            currentS.split('').forEach((char, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'idle';
                if (step.i === pos) cls = 'center';
                else if (step.i !== undefined && pos >= step.i) cls = 'expanding';
                tile.className = `tile ${cls}`;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${pos}]`;
                unit.append(tile, idxLabel);
                row1.appendChild(unit);
            });
            container.appendChild(row1);

            document.getElementById('main-panel').innerHTML = step.panel || '—';

            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-single').innerText = step.type === 'single' ? 'Valid' : (step.type === 'invalid-single' ? 'Invalid' : '—');
            document.getElementById('val-two').innerText = step.type === 'two' ? 'Valid' : '—';
            document.getElementById('val-ways').innerText = step.ways !== undefined ? step.ways : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalResult : '—';
            if (step.complete) resVal.classList.add('pop');
            else resVal.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
