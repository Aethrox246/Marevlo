<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimum Window Substring - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 380px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 80px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" placeholder='"ADOBECODEBANC"'>
        <label class="ui-label">t =</label>
        <input type="text" id="t-input" value='"ABC"' style="width:120px;">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 (ADOBECODEBANC, ABC)</button>
        <button onclick="loadExample(1)">Ex 2 (a, a)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Sliding Window – Expand & Contract to Find Minimum Window</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Left Pointer</span>
            <span class="info-value" id="val-left" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Right Pointer</span>
            <span class="info-value" id="val-right" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Window</span>
            <span class="info-value" id="val-window" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Min Window</span>
            <span class="info-value" id="val-min" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">smallest window =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Left Pointer</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Right Pointer</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Window</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Invalid / Shrink</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "";
        let currentT = "";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentS = "ADOBECODEBANC";
                currentT = "ABC";
            } else {
                currentS = "a";
                currentT = "a";
            }
            document.getElementById('str-input').value = `"${currentS}"`;
            document.getElementById('t-input').value = `"${currentT}"`;
            generateSteps();
            reset();
        }

        function loadCustom() {
            let valS = document.getElementById('str-input').value.trim();
            if (valS.startsWith('"') && valS.endsWith('"')) valS = valS.slice(1, -1);
            currentS = valS || "";
            
            let valT = document.getElementById('t-input').value.trim();
            if (valT.startsWith('"') && valT.endsWith('"')) valT = valT.slice(1, -1);
            currentT = valT || "";
            
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            const tCount = {};
            for (let char of currentT) {
                tCount[char] = (tCount[char] || 0) + 1;
            }
            const required = Object.keys(tCount).length;

            let left = 0;
            let formed = 0;
            let windowCount = {};
            let minLen = Infinity;
            let minStart = 0;

            // INIT
            steps.push({
                type: 'init',
                left: 0,
                right: -1,
                states: Array(n).fill('idle'),
                panel: `s = <b>"${currentS}"</b><br>t = <b>"${currentT}"</b>`,
                statusText: `Starting sliding window...`,
                log: `Initialize:\ns = "${currentS}"\nt = "${currentT}"\nrequired = ${required}`
            });

            for (let right = 0; right < n; right++) {
                let char = currentS[right];
                windowCount[char] = (windowCount[char] || 0) + 1;

                let states = Array(n).fill('idle');
                for (let k = left; k <= right; k++) states[k] = 'expanding';
                states[right] = 'center';

                steps.push({
                    type: 'expand',
                    left: left,
                    right: right,
                    states: states,
                    panel: `Expand right to <b>${right}</b> ('${char}')`,
                    statusText: `Expanding window...`,
                    log: `  right=${right}: '${char}'`
                });

                if (tCount[char] && windowCount[char] === tCount[char]) {
                    formed++;
                }

                while (formed === required && left <= right) {
                    let curLen = right - left + 1;
                    if (curLen < minLen) {
                        minLen = curLen;
                        minStart = left;
                    }

                    let leftChar = currentS[left];
                    windowCount[leftChar]--;
                    if (tCount[leftChar] && windowCount[leftChar] < tCount[leftChar]) {
                        formed--;
                    }

                    states = Array(n).fill('idle');
                    for (let k = left; k <= right; k++) states[k] = 'valid-pal';
                    states[left] = 'mismatch';

                    steps.push({
                        type: 'contract',
                        left: left,
                        right: right,
                        states: states,
                        panel: `<span style="color:var(--accent-blue)">Contract left from <b>${left}</b> ('${leftChar}')</span>`,
                        statusText: `Shrinking window...`,
                        log: `  → Contract left=${left}`
                    });

                    left++;
                }
            }

            // FINAL
            let result = minLen === Infinity ? "" : currentS.substring(minStart, minStart + minLen);
            let finalStates = Array(n).fill('idle');
            if (minLen !== Infinity) {
                for (let k = minStart; k < minStart + minLen; k++) finalStates[k] = 'valid-pal';
            }

            steps.push({
                type: 'final',
                left: minStart,
                right: minStart + minLen - 1,
                states: finalStates,
                complete: true,
                finalResult: result,
                panel: result ? 
                    `<span style="color:var(--accent-green)">Minimum window found: <b>"${result}"</b> (length ${minLen})</span>` : 
                    `<span style="color:var(--accent-red)">No valid window found</span>`,
                statusText: `Done. Result: "${result}"`,
                log: `\nFinal Result: "${result}"`,
                bold: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const rowDiv = document.createElement('div');
            rowDiv.className = 'string-row';

            const label = document.createElement('div');
            label.className = 'string-label';
            label.innerText = 's';
            rowDiv.appendChild(label);

            currentS.split('').forEach((char, colIdx) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';

                const tile = document.createElement('div');
                tile.className = `tile ${step.states[colIdx] || 'idle'}`;
                tile.innerText = char;

                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${colIdx}]`;

                unit.append(tile, idxLabel);
                rowDiv.appendChild(unit);
            });

            container.appendChild(rowDiv);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-left').innerText = step.left !== undefined ? step.left : '—';
            document.getElementById('val-right').innerText = step.right !== undefined ? step.right : '—';
            document.getElementById('val-window').innerText = step.left !== undefined && step.right !== undefined ? 
                `"${currentS.substring(step.left, step.right + 1)}"` : '—';
            document.getElementById('val-min').innerText = step.finalResult ? `"${step.finalResult}"` : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = `"${step.finalResult}"`;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
