<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortest Common Superstring of A, B, C - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main); color: var(--text-main);
            height: 32px; border-radius: 6px; padding: 0 10px; font-size: 13px; width: 180px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 12px; justify-content: center; padding: 20px 0; flex-wrap: wrap; max-width: 800px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 20px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.15); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); opacity: 0.7; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 110px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 140px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 700px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">A =</label>
        <input type="text" id="a-input" placeholder="ab" style="width:140px">
        <label class="ui-label">B =</label>
        <input type="text" id="b-input" placeholder="bc" style="width:140px">
        <label class="ui-label">C =</label>
        <input type="text" id="c-input" placeholder="cd" style="width:140px">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 (ab,bc,cd)</button>
        <button onclick="loadExample(2)">Ex 2 (a,aa,aaa)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force Permutations: Find Shortest Superstring Containing A, B, C</div>
        
        <div class="string-display" id="strings-display"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Permutation</span>
            <span class="info-value" id="val-perm" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Merge Step</span>
            <span class="info-value" id="val-merge" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Shortest So Far</span>
            <span class="info-value" id="val-shortest" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Shortest Superstring =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Permutation</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Overlap Match</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentA = "ab";
        let currentB = "bc";
        let currentC = "cd";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentA = "ab";
                currentB = "bc";
                currentC = "cd";
            } else {
                currentA = "a";
                currentB = "aa";
                currentC = "aaa";
            }
            document.getElementById('a-input').value = currentA;
            document.getElementById('b-input').value = currentB;
            document.getElementById('c-input').value = currentC;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const aVal = document.getElementById('a-input').value.trim();
            const bVal = document.getElementById('b-input').value.trim();
            const cVal = document.getElementById('c-input').value.trim();
            if (aVal && bVal && cVal) {
                currentA = aVal;
                currentB = bVal;
                currentC = cVal;
                generateSteps();
                reset();
            }
        }

        function computeOverlap(s1, s2) {
            const minLen = Math.min(s1.length, s2.length);
            for (let k = minLen; k >= 0; k--) {
                if (s1.endsWith(s2.substring(0, k))) {
                    return k;
                }
            }
            return 0;
        }

        function merge(s1, s2, overlap) {
            return s1 + s2.substring(overlap);
        }

        function generateSteps() {
            steps = [];
            const strings = [currentA, currentB, currentC];
            const labels = ["A", "B", "C"];
            let shortest = "";
            let shortestLen = Infinity;
            let shortestPerm = "";

            // All permutations of indices
            const perms = [
                [0,1,2], [0,2,1],
                [1,0,2], [1,2,0],
                [2,0,1], [2,1,0]
            ];

            steps.push({
                type: 'init',
                perm: [],
                mergeStep: 0,
                shortest: "",
                panel: `Input: A="<b>${currentA}</b>", B="<b>${currentB}</b>", C="<b>${currentC}</b>"<br>Checking all 6 permutations with maximum overlap merges.`,
                statusText: `Generating all permutations...`,
                log: `A="${currentA}", B="${currentB}", C="${currentC}"\n6 permutations to check.`
            });

            for (let pIdx = 0; pIdx < perms.length; pIdx++) {
                const order = perms[pIdx];
                let current = strings[order[0]];
                let mergeLog = labels[order[0]];

                steps.push({
                    type: 'perm_start',
                    perm: order,
                    mergeStep: 0,
                    shortest: shortest,
                    panel: `Permutation ${pIdx+1}: <b>${labels[order[0]]} → ${labels[order[1]]} → ${labels[order[2]]}</b><br>Start with ${labels[order[0]]} = "<b>${current}</b>"`,
                    statusText: `Processing permutation ${pIdx+1}`,
                    log: `\nPermutation ${pIdx+1}: ${labels[order[0]]} → ${labels[order[1]]} → ${labels[order[2]]}\nCurrent: "${current}"`
                });

                for (let m = 1; m < 3; m++) {
                    const nextStr = strings[order[m]];
                    const nextLabel = labels[order[m]];
                    const overlap = computeOverlap(current, nextStr);
                    const merged = merge(current, nextStr, overlap);

                    steps.push({
                        type: 'merge_step',
                        perm: order,
                        mergeStep: m,
                        shortest: shortest,
                        panel: `Merge ${mergeLog} + ${nextLabel}: overlap = <b>${overlap}</b><br>Result: <b>"${merged}"</b>`,
                        statusText: `Overlap ${overlap} → "${merged}"`,
                        log: `  Merge ${mergeLog} + ${nextLabel}: overlap=${overlap} → "${merged}"`
                    });

                    current = merged;
                    mergeLog += ` → ${nextLabel}`;
                }

                if (current.length < shortestLen) {
                    shortest = current;
                    shortestLen = current.length;
                    shortestPerm = `Perm ${pIdx+1}`;

                    steps.push({
                        type: 'new_shortest',
                        perm: order,
                        mergeStep: 3,
                        shortest: shortest,
                        panel: `New shortest found: <b>"${shortest}"</b> (length ${shortestLen}) from permutation ${pIdx+1}`,
                        statusText: `New shortest: "${shortest}"`,
                        log: `  New shortest! "${shortest}" (len ${shortestLen})`
                    });
                }
            }

            steps.push({
                type: 'final',
                perm: [],
                mergeStep: 0,
                shortest: shortest,
                panel: `All permutations processed.<br>Shortest superstring: <b>"${shortest}"</b>`,
                statusText: `Done → "${shortest}"`,
                log: `\nFinal shortest superstring: "${shortest}"`,
                complete: true,
                finalResult: shortest
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Display current strings
            const container = document.getElementById('strings-display');
            container.innerHTML = '';
            const labels = ['A', 'B', 'C'];
            const vals = [currentA, currentB, currentC];
            for (let k = 0; k < 3; k++) {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const labelTile = document.createElement('div');
                labelTile.className = 'tile';
                labelTile.style.fontSize = '14px';
                labelTile.style.height = '28px';
                labelTile.innerText = labels[k];
                const strTile = document.createElement('div');
                strTile.className = 'tile';
                strTile.innerText = vals[k];
                unit.append(labelTile, strTile);
                container.appendChild(unit);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-perm').innerText = step.perm.length ? step.perm.map(i => ['A','B','C'][i]).join(' → ') : '—';
            document.getElementById('val-merge').innerText = step.mergeStep ? `Merge step ${step.mergeStep}` : '—';
            document.getElementById('val-shortest').innerText = step.shortest || '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = `"${step.finalResult}"`;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
