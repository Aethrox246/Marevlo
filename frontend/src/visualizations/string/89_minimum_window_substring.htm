<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimum Window Substring - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 240px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 8px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 110px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 130px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 700px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }

        .freq-panel {
            margin-top: 15px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 10px; width: 700px; font-family: monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="s-input" placeholder="ADOBECODEBANC">
        <label class="ui-label">t =</label>
        <input type="text" id="t-input" placeholder="ABC">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 ("ADOBECODEBANC", "ABC" → "BANC")</button>
        <button onclick="loadExample(2)">Ex 2 ("a", "aa" → "")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Sliding Window: Expand Right, Contract Left When Valid</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Left</span>
            <span class="info-value" id="val-left" style="color: var(--accent-blue);">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Right</span>
            <span class="info-value" id="val-right" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Formed / Required</span>
            <span class="info-value" id="val-formed" style="color: var(--accent-green);">0 / —</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Min Length</span>
            <span class="info-value" id="val-minlen" style="color: var(--accent-orange);">∞</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Minimum Window =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Window</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Window</div>
    </div>

    <div class="freq-panel" id="freq-panel">Need: {} | Window: {} | Formed: 0</div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "ADOBECODEBANC";
        let currentT = "ABC";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentS = "ADOBECODEBANC";
                currentT = "ABC";
            } else {
                currentS = "a";
                currentT = "aa";
            }
            document.getElementById('s-input').value = currentS;
            document.getElementById('t-input').value = currentT;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const sVal = document.getElementById('s-input').value.trim();
            const tVal = document.getElementById('t-input').value.trim();
            if (sVal && tVal) {
                currentS = sVal;
                currentT = tVal;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            const need = {};
            for (let char of currentT) {
                need[char] = (need[char] || 0) + 1;
            }
            const required = Object.keys(need).length;

            let left = 0;
            let minLen = Infinity;
            let minStart = -1;
            let windowCount = {};
            let formed = 0;

            // INIT
            steps.push({
                type: 'init',
                left: 0,
                right: -1,
                minLen: Infinity,
                minStart: -1,
                formed: 0,
                panel: `s = <b>"${currentS}"</b><br>t = <b>"${currentT}"</b><br>Need: ${JSON.stringify(need)}<br>Sliding window to find smallest substring containing all chars from t.`,
                statusText: `Starting sliding window...`,
                log: `s="${currentS}", t="${currentT}"`
            });

            for (let right = 0; right < n; right++) {
                const char = currentS[right];
                if (char in need) {
                    windowCount[char] = (windowCount[char] || 0) + 1;
                    if (windowCount[char] === need[char]) {
                        formed++;
                    }
                }

                let states = Array(n).fill('idle');
                for (let p = left; p <= right; p++) {
                    states[p] = 'center';
                }

                steps.push({
                    type: 'expand',
                    left: left,
                    right: right,
                    formed: formed,
                    minLen: minLen,
                    minStart: minStart,
                    panel: `Expanded right to <b>${right}</b> (char '${char}')<br>Window [${left},${right}], formed = ${formed}/${required}`,
                    statusText: `Window [${left},${right}], formed=${formed}`,
                    log: `  right=${right} ('${char}'), formed=${formed}`
                });

                while (formed === required && left <= right) {
                    const currLen = right - left + 1;
                    if (currLen < minLen) {
                        minLen = currLen;
                        minStart = left;
                    }

                    const leftChar = currentS[left];
                    if (leftChar in need) {
                        windowCount[leftChar]--;
                        if (windowCount[leftChar] < need[leftChar]) {
                            formed--;
                        }
                    }

                    let shrinkStates = Array(n).fill('idle');
                    for (let p = left + 1; p <= right; p++) {
                        shrinkStates[p] = 'center';
                    }

                    steps.push({
                        type: 'contract',
                        left: left + 1,
                        right: right,
                        formed: formed,
                        minLen: minLen,
                        minStart: minStart,
                        panel: `<span style="color:var(--accent-green)">Valid window</span> length ${currLen} → shrink left to <b>${left+1}</b>`,
                        statusText: `Contract left to ${left+1}, minLen=${minLen}`,
                        log: `    Contract left=${left}, minLen=${minLen}`
                    });

                    left++;
                }
            }

            // FINAL
            const result = minStart !== -1 ? currentS.substring(minStart, minStart + minLen) : "";
            steps.push({
                type: 'final',
                left: left,
                right: n-1,
                minLen: minLen,
                minStart: minStart,
                panel: `All positions processed.<br>Smallest window = <b>"${result}"</b> (length ${minLen})`,
                statusText: `Final minimum window: "${result}"`,
                log: `\nFinal Result: "${result}"`,
                complete: true,
                finalResult: result
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            currentS.split('').forEach((char, k) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'tile idle';
                if (step.left >= 0 && k >= step.left && k <= step.right) cls = 'tile center';
                tile.className = cls;
                tile.innerText = char;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'tile-index';
                idxLabel.innerText = `[${k}]`;
                unit.append(tile, idxLabel);
                container.appendChild(unit);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-left').innerText = step.left;
            document.getElementById('val-right').innerText = step.right;
            document.getElementById('val-formed').innerText = `${step.formed} / ${Object.keys(step.need || {}).length || '—'}`;
            document.getElementById('val-minlen').innerText = step.minLen === Infinity ? '∞' : step.minLen;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = `"${step.finalResult}"`;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
