<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Cost String Transformation - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 380px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.12); }
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }
        .tile.idle { opacity: 0.95; }

        .string-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 90px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 760px; min-height: 110px;
            text-align: center; font-family: monospace; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 16px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 28px; color: var(--accent-green); font-family: monospace; transition: all 0.4s; font-weight: bold; }
        .pop { animation: popAnim 420ms ease; color: var(--accent-green) !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 45%{transform:scale(1.28)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 620px;}

        .controls { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 760px; max-width: 92%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
        .log-line { margin-bottom: 3px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Start =</label>
        <input type="text" id="start-input" value="abc" placeholder="start string">
        <label class="ui-label">Target =</label>
        <input type="text" id="target-input" value="xyz" placeholder="target string">
        <button onclick="runBruteForce()">Run Brute Force Backtracking</button>
        <button onclick="resetViz()">Reset</button>
        <button onclick="loadExample1()">Example 1: abc → xyz</button>
        <button onclick="loadExample2()">Example 2: aa → bb</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" style="margin-bottom:8px">Minimal Cost String Transformation — Brute Force Backtracking Visualization</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">Ready — Click "Run Brute Force" to explore rule applications with backtracking</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current String</span>
            <span class="info-value" id="val-current" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Cost</span>
            <span class="info-value" id="val-cost" style="color:var(--accent-orange)">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Best</span>
            <span class="info-value" id="val-best" style="color:var(--accent-green)">∞</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom:6px">Minimal transformation cost =</span>
        <span id="res-val">∞</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="resetViz()">↺ Reset</button>
        <button onclick="backStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <span class="ui-label" style="margin-left:12px;font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current string state</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Reached target</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-orange)"></span> Rule application</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let startStr = "abc";
        let targetStr = "xyz";
        let rules = [
            {pattern: "ab", replacement: "xy", cost: 2},
            {pattern: "bc", replacement: "yz", cost: 3},
            {pattern: "c", replacement: "z", cost: 1}
        ];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 320];
        let globalBest = Infinity;

        function resetViz() {
            pause();
            steps = [];
            stepIndex = 0;
            globalBest = Infinity;
            renderTiles(startStr);
            document.getElementById('main-panel').innerHTML = 'Ready — Click Run Brute Force';
            document.getElementById('log').innerHTML = '';
            document.getElementById('res-val').innerText = '∞';
            document.getElementById('val-current').innerText = `"${startStr}"`;
            document.getElementById('val-cost').innerText = '0';
            document.getElementById('val-best').innerText = '∞';
            document.getElementById('status-text').innerText = '';
        }

        function renderTiles(current = startStr) {
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const row = document.createElement('div');
            row.className = 'string-row';
            const label = document.createElement('div');
            label.className = 'string-label';
            label.innerText = 'Current';
            row.appendChild(label);

            current.split('').forEach((ch, idx) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                tile.className = `tile valid-pal`;
                tile.innerText = ch;
                const idxEl = document.createElement('div');
                idxEl.className = 'tile-index';
                idxEl.innerText = idx;
                unit.appendChild(tile);
                unit.appendChild(idxEl);
                row.appendChild(unit);
            });
            container.appendChild(row);
        }

        function generateSteps() {
            steps = [];
            let visited = new Set();
            let best = Infinity;

            function backtrack(curr, cost, path) {
                if (cost >= best) return;
                if (curr === targetStr) {
                    best = cost;
                    steps.push({
                        type: 'found',
                        current: curr,
                        cost: cost,
                        panel: `Found target "<b>${curr}</b>" with cost <b>${cost}</b>!`,
                        statusText: `Target reached with cost ${cost}`,
                        log: `✓ Reached "${curr}" with cost ${cost} (new best!)`,
                        best: best
                    });
                    return;
                }

                if (visited.has(curr)) return;
                visited.add(curr);

                steps.push({
                    type: 'explore',
                    current: curr,
                    cost: cost,
                    panel: `Exploring "<b>${curr}</b>" with current cost <b>${cost}</b>`,
                    statusText: `Current: "${curr}", cost=${cost}`,
                    log: `Exploring "${curr}" (cost=${cost})`,
                    best: best
                });

                for (let r of rules) {
                    let idx = 0;
                    while ((idx = curr.indexOf(r.pattern, idx)) !== -1) {
                        let newStr = curr.substring(0, idx) + r.replacement + curr.substring(idx + r.pattern.length);
                        let newCost = cost + r.cost;

                        steps.push({
                            type: 'apply',
                            current: curr,
                            newStr: newStr,
                            cost: newCost,
                            panel: `Apply rule "<b>${r.pattern}</b>" → "<b>${r.replacement}</b>" (cost +${r.cost})<br>New string: "<b>${newStr}</b>"`,
                            statusText: `Applied rule at pos ${idx}, new cost ${newCost}`,
                            log: `  Applied "${r.pattern}"→"${r.replacement}" at ${idx} → "${newStr}" (cost ${newCost})`,
                            best: best
                        });

                        backtrack(newStr, newCost, path + " → " + newStr);
                        idx += 1;
                    }
                }
            }

            steps.push({
                type: 'init',
                current: startStr,
                cost: 0,
                panel: `Start: "<b>${startStr}</b>" → Target: "<b>${targetStr}</b>"<br>Rules: ${rules.map(r => `"${r.pattern}"→"${r.replacement}"(${r.cost})`).join(', ')}`,
                statusText: `Exploring from "${startStr}"`,
                log: `Start exploration from "${startStr}"`,
                best: best
            });

            backtrack(startStr, 0, startStr);

            steps.push({
                type: 'final',
                current: targetStr,
                cost: best,
                panel: `Search complete!<br>Minimum cost to transform "<b>${startStr}</b>" to "<b>${targetStr}</b>" is <b>${best === Infinity ? 'Impossible' : best}</b>`,
                statusText: `Final answer: ${best === Infinity ? 'Impossible' : best}`,
                log: `\n=== FINAL RESULT ===\nMin cost = ${best === Infinity ? 'Impossible' : best}`,
                best: best,
                bold: true
            });
        }

        function renderStep(idx) {
            if (idx < 0 || idx >= steps.length) return;
            const step = steps[idx];

            renderTiles(step.current || startStr);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-current').innerText = `"${step.current || startStr}"`;
            document.getElementById('val-cost').innerText = step.cost !== undefined ? step.cost : '—';
            document.getElementById('val-best').innerText = step.best !== undefined && step.best !== Infinity ? step.best : '∞';

            const resEl = document.getElementById('res-val');
            resEl.innerText = step.best !== undefined && step.best !== Infinity ? step.best : '∞';
            if (step.type === 'found' || step.type === 'final') resEl.classList.add('pop');
            else resEl.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.className = 'log-line';
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    if (steps[k].type === 'found') line.style.color = 'var(--accent-green)';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function nextStep() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function backStep() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = '❚❚ Pause';
                if (stepIndex >= steps.length - 1 && steps.length > 0) stepIndex = 0;
                timer = setInterval(() => {
                    if (stepIndex < steps.length - 1) {
                        stepIndex++;
                        renderStep(stepIndex);
                    } else {
                        pause();
                    }
                }, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        function runBruteForce() {
            startStr = document.getElementById('start-input').value.trim() || "abc";
            targetStr = document.getElementById('target-input').value.trim() || "xyz";
            rules = [
                {pattern: "ab", replacement: "xy", cost: 2},
                {pattern: "bc", replacement: "yz", cost: 3},
                {pattern: "c", replacement: "z", cost: 1}
            ];

            pause();
            generateSteps();
            stepIndex = 0;
            renderStep(0);
        }

        function loadExample1() {
            document.getElementById('start-input').value = "abc";
            document.getElementById('target-input').value = "xyz";
            runBruteForce();
        }

        function loadExample2() {
            document.getElementById('start-input').value = "aa";
            document.getElementById('target-input').value = "bb";
            rules = [
                {pattern: "a", replacement: "b", cost: 5},
                {pattern: "aa", replacement: "bb", cost: 8}
            ];
            runBruteForce();
        }

        window.onload = () => {
            renderTiles();
            document.getElementById('log').innerHTML = '<div class="log-line">Click "Run Brute Force" to explore backtracking through rule applications.</div>';
        };
    </script>
</body>
</html>
