<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smallest Superstring - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main); color: var(--text-main);
            height: 32px; border-radius: 6px; padding: 0 10px; font-size: 13px; width: 240px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 8px; justify-content: center; padding: 20px 0; flex-wrap: wrap; max-width: 920px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 18px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.15); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); opacity: 0.8; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 800px; text-align: center; font-family: monospace; min-height: 130px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 160px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 780px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 800px; max-width: 90%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }

        .permutation-info { margin-top: 10px; background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px; padding: 10px; width: 800px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Strings (comma-separated) =</label>
        <input type="text" id="strings-input" placeholder="catg,ctaagt,gcta,ttca,atgcatc" style="width:380px">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1</button>
        <button onclick="loadExample(2)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force Permutations — Merge with Overlap, Find Shortest Superstring</div>
        
        <div class="string-display" id="strings-display"></div>
    </div>

    <div class="permutation-info" id="perm-info">Current Permutation &amp; Merge: —</div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Perm</span>
            <span class="info-value" id="val-perm" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Merge</span>
            <span class="info-value" id="val-merge" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Shortest So Far</span>
            <span class="info-value" id="val-shortest" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Shortest Superstring =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left:20px">
            <span class="ui-label" style="margin-right:6px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Permutation</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Overlap Match</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> No Overlap</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentStrings = ["catg", "ctaagt", "gcta", "ttca", "atgcatc"];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentStrings = ["catg", "ctaagt", "gcta", "ttca", "atgcatc"];
            } else {
                currentStrings = ["alex", "lexa", "xander"];
            }
            document.getElementById('strings-input').value = currentStrings.join(",");
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('strings-input').value.trim();
            if (val) {
                currentStrings = val.split(",").map(s => s.trim()).filter(s => s);
                generateSteps();
                reset();
            }
        }

        function computeOverlap(s1, s2) {
            const minLen = Math.min(s1.length, s2.length);
            for (let k = minLen; k >= 0; k--) {
                if (s1.endsWith(s2.substring(0, k))) {
                    return k;
                }
            }
            return 0;
        }

        function merge(s1, s2, overlap) {
            return s1 + s2.substring(overlap);
        }

        function generateSteps() {
            steps = [];
            const n = currentStrings.length;
            let shortest = "";
            let shortestLen = Infinity;
            let bestPerm = [];

            // Generate all permutations (for n<=5 it's fine)
            function getPermutations(arr) {
                if (arr.length === 0) return [[]];
                let result = [];
                for (let i = 0; i < arr.length; i++) {
                    let current = arr[i];
                    let rest = arr.slice(0, i).concat(arr.slice(i+1));
                    let perms = getPermutations(rest);
                    for (let p of perms) {
                        result.push([current].concat(p));
                    }
                }
                return result;
            }

            const perms = getPermutations(currentStrings);

            steps.push({
                type: 'init',
                perm: [],
                panel: `Input strings: <b>${JSON.stringify(currentStrings)}</b><br>Brute Force: Trying all ${perms.length} permutations with maximum overlap merges`,
                statusText: `Generating permutations...`,
                log: `n = ${n}, ${perms.length} permutations to evaluate`
            });

            for (let pIdx = 0; pIdx < perms.length; pIdx++) {
                const perm = perms[pIdx];
                let current = perm[0];
                let currentLen = current.length;

                steps.push({
                    type: 'perm_start',
                    perm: perm,
                    panel: `Permutation ${pIdx+1}: <b>${perm.join(' → ')}</b><br>Start with "${current}" (len ${currentLen})`,
                    statusText: `Processing perm ${pIdx+1}`,
                    log: `\nPerm ${pIdx+1}: ${perm.join(' → ')}\nCurrent: "${current}"`
                });

                for (let m = 1; m < n; m++) {
                    const nextStr = perm[m];
                    const overlap = computeOverlap(current, nextStr);
                    const merged = merge(current, nextStr, overlap);
                    const added = merged.length - currentLen;

                    steps.push({
                        type: 'merge_step',
                        perm: perm,
                        panel: `Merge "${current}" + "${nextStr}" → overlap ${overlap}<br>Result: "${merged}" (added ${added} chars)`,
                        statusText: `Merge with overlap ${overlap}`,
                        log: `  Merge "${current}" + "${nextStr}" overlap=${overlap} → "${merged}"`
                    });

                    current = merged;
                    currentLen = merged.length;
                }

                if (currentLen < shortestLen) {
                    shortest = current;
                    shortestLen = currentLen;
                    bestPerm = perm;

                    steps.push({
                        type: 'new_shortest',
                        perm: perm,
                        panel: `New shortest found: <b>"${shortest}"</b> (length ${shortestLen}) from this permutation`,
                        statusText: `New shortest len ${shortestLen}`,
                        log: `  New shortest! "${shortest}" (len ${shortestLen})`
                    });
                }
            }

            steps.push({
                type: 'final',
                perm: bestPerm,
                panel: `All permutations processed.<br>Shortest superstring: <b>"${shortest}"</b> (length ${shortestLen})`,
                statusText: `Done → "${shortest}"`,
                log: `\nFinal shortest superstring: "${shortest}" (len ${shortestLen})`,
                complete: true,
                finalResult: shortest
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render input strings as tiles
            const container = document.getElementById('strings-display');
            container.innerHTML = '';
            for (let str of currentStrings) {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const labelTile = document.createElement('div');
                labelTile.className = 'tile';
                labelTile.style.fontSize = '12px';
                labelTile.style.height = '26px';
                labelTile.innerText = str;
                unit.append(labelTile);
                container.appendChild(unit);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-perm').innerText = step.perm.length ? step.perm.join(' → ') : '—';
            document.getElementById('val-merge').innerText = step.type === 'merge_step' ? 'Merging...' : '—';
            document.getElementById('val-shortest').innerText = step.shortest || '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = `"${step.finalResult}"`;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
