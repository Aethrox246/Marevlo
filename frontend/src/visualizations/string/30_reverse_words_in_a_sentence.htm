<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Words in a Sentence - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 320px; font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px;
            cursor: pointer; transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; width: 100%; max-width: 860px; }
        .string-display {
            display: flex; gap: 5px; justify-content: center; padding: 24px;
            background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border-main);
            flex-wrap: wrap; min-height: 80px;
        }
        .tile {
            width: 48px; height: 58px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 6px;
            font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile .index { font-size: 9px; color: var(--text-dim); margin-top: 3px; }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.08); }
        .tile.word { background: #0f2a1a; border-color: var(--accent-green); }
        .tile.reversed { background: #2a1f0d; border-color: var(--accent-orange); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 16px 24px; min-height: 110px; font-family: monospace;
            font-size: 14.5px; line-height: 1.55; text-align: center;
        }

        .info-panel { margin-top: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 10px 18px; min-width: 130px; text-align: center;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 17px; font-weight: 700; font-family: monospace; }

        .result-display { margin-top: 18px; font-size: 24px; font-family: monospace; color: var(--accent-green); }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); min-height: 24px; }

        .controls { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 12.5px; color: var(--text-dim); }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 22px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 720px; height: 165px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="str-input" value="hello world">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("hello world")</button>
        <button onclick="loadExample(1)">Ex 2 ("the sky is blue")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Two-Pointer In-Place – Reverse Words</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Phase</span>
            <span class="info-value" id="val-phase" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Word</span>
            <span class="info-value" id="val-word" style="color:var(--accent-green)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Pointers</span>
            <span class="info-value" id="val-pointers" style="color:var(--accent-orange)">—</span>
        </div>
    </div>

    <div class="result-display" id="res-val">—</div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Full Reverse</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Word Reverse</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-orange);border-radius:4px"></span> Pointers</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "hello world";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1250, 650, 280];

        function loadExample(ex) {
            currentS = ex === 0 ? "hello world" : "the sky is blue";
            document.getElementById('str-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentS = document.getElementById('str-input').value.trim() || currentS;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let arr = currentS.split('');

            steps.push({
                type: 'init',
                arr: [...arr],
                panel: `Input: <b>"${currentS}"</b>`,
                statusText: 'Starting two-pointer in-place reversal...',
                log: 'Phase 0: Original string',
                phase: 'Init',
                pointers: '',
                word: ''
            });

            // Phase 1: Reverse entire string
            let left = 0, right = arr.length - 1;
            while (left < right) {
                [arr[left], arr[right]] = [arr[right], arr[left]];
                steps.push({
                    type: 'fullrev',
                    arr: [...arr],
                    panel: `Full reverse: swap indices ${left} & ${right}`,
                    statusText: `Swapped ${arr[left]} ↔ ${arr[right]}`,
                    log: `Full reverse: swap [${left}]↔[${right}]`,
                    phase: 'Full Reverse',
                    pointers: `${left}-${right}`,
                    word: ''
                });
                left++; right--;
            }

            steps.push({
                type: 'fullrev_done',
                arr: [...arr],
                panel: `Full string reversed: <b>"${arr.join('')}"</b>`,
                statusText: 'Full reversal complete. Now reversing individual words...',
                log: 'Full reversal done → now reverse each word',
                phase: 'Full Reverse Done',
                pointers: '',
                word: ''
            });

            // Phase 2: Reverse each word
            let start = 0;
            for (let i = 0; i <= arr.length; i++) {
                if (i === arr.length || arr[i] === ' ') {
                    // Reverse word from start to i-1
                    let l = start, r = i - 1;
                    while (l < r) {
                        [arr[l], arr[r]] = [arr[r], arr[l]];
                        steps.push({
                            type: 'wordrev',
                            arr: [...arr],
                            panel: `Reversing word from ${l} to ${r}`,
                            statusText: `Word reverse swap`,
                            log: `Reverse word: swap [${l}]↔[${r}]`,
                            phase: 'Word Reverse',
                            pointers: `${l}-${r}`,
                            word: arr.slice(start, i).join('')
                        });
                        l++; r--;
                    }
                    start = i + 1;
                }
            }

            steps.push({
                type: 'final',
                arr: [...arr],
                panel: `Final result: <b>"${arr.join('')}"</b>`,
                statusText: `Done! Reversed words: "${arr.join('')}"`,
                log: `\nFinal: "${arr.join('')}"`,
                phase: 'Complete',
                pointers: '',
                word: '',
                complete: true
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            step.arr.forEach((ch, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<span>${ch === ' ' ? '␣' : ch}</span><span class="index">[${i}]</span>`;

                if (step.pointers) {
                    const [l, r] = step.pointers.split('-').map(Number);
                    if (i === l || i === r) tile.classList.add('center');
                }
                if (step.type === 'wordrev' || step.type === 'fullrev') tile.classList.add('word');
                if (step.complete) tile.classList.add('reversed');

                container.appendChild(tile);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-phase').innerText = step.phase;
            document.getElementById('val-word').innerText = step.word || '—';
            document.getElementById('val-pointers').innerText = step.pointers || '—';

            const res = document.getElementById('res-val');
            res.innerText = step.complete ? `"${step.arr.join('')}"` : '—';

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                const line = document.createElement('div');
                line.style.marginBottom = '3px';
                line.innerText = steps[k].log || '';
                logPanel.appendChild(line);
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value | 0]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        window.onload = () => { loadExample(0); };
    </script>
</body>
</html>
