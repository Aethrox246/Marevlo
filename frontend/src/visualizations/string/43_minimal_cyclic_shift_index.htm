<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Cyclic Shift Index - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-main);
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main); color: var(--text-main);
            height: 32px; border-radius: 6px; padding: 0 10px; font-size: 13px; width: 220px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 6px; justify-content: center; padding: 20px 0; flex-wrap: wrap; max-width: 900px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 18px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.2); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 780px; text-align: center; font-family: monospace; min-height: 120px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 150px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        #res-val { font-size: 32px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 760px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 780px; max-width: 90%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }

        .doubled-display { margin-top: 15px; background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px; padding: 10px; width: 780px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Input String s =</label>
        <input type="text" id="s-input" placeholder="cba" style="width:240px">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 (cba)</button>
        <button onclick="loadExample(2)">Ex 2 (abab)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Duplicate String + Scan O(n) — Find Minimal Cyclic Shift Index</div>
        
        <div class="string-display" id="strings-display"></div>
    </div>

    <div class="doubled-display" id="doubled-display">Doubled string: —</div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">i (scan)</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">j (candidate)</span>
            <span class="info-value" id="val-j" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">k (match length)</span>
            <span class="info-value" id="val-k" style="color: var(--accent-green);">0</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Minimal Rotation Index =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left:20px">
            <span class="ui-label" style="margin-right:6px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> i (scan pointer)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> j (candidate)</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Match</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Mismatch (update)</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "cba";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            currentS = exIndex === 1 ? "cba" : "abab";
            document.getElementById('s-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('s-input').value.trim();
            if (val) {
                currentS = val;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            const doubled = currentS + currentS;

            steps.push({
                type: 'init',
                i: 0,
                j: 1,
                k: 0,
                panel: `Input: <b>"${currentS}"</b><br>Doubled: <b>"${doubled}"</b><br>Duplicate String + Scan O(n)`,
                statusText: `Building doubled string...`,
                log: `s = "${currentS}" (n=${n})\nT = "${doubled}" (2n=${2*n})`
            });

            let i = 0;
            let j = 1;
            let k = 0;

            while (i < n && j < n) {
                steps.push({
                    type: 'compare',
                    i: i,
                    j: j,
                    k: k,
                    panel: `Comparing at offset k=${k}: T[${i + k}]='${doubled[i + k]}' vs T[${j + k}]='${doubled[j + k]}'`,
                    statusText: `i=${i}, j=${j}, k=${k}`,
                    log: `i=${i}, j=${j}, k=${k}: compare '${doubled[i + k]}' vs '${doubled[j + k]}'`
                });

                let match = doubled[i + k] === doubled[j + k];

                if (match) {
                    k++;
                    if (k === n) break;
                    steps.push({
                        type: 'match_extend',
                        i: i,
                        j: j,
                        k: k,
                        panel: `Characters match → extend k to ${k}`,
                        statusText: `Match, k=${k}`,
                        log: `  Match → k=${k}`
                    });
                } else {
                    if (doubled[i + k] < doubled[j + k]) {
                        // current i is better
                        j = j + k + 1;
                        steps.push({
                            type: 'update_j',
                            i: i,
                            j: j,
                            k: k,
                            panel: `T[${i + k}]='${doubled[i + k]}' < T[${j + k}]='${doubled[j + k]}' → advance j to ${j}`,
                            statusText: `i better → j=${j}`,
                            log: `  i better → j=${j}`
                        });
                    } else {
                        // j is better
                        i = i + k + 1;
                        if (i === j) j++;
                        steps.push({
                            type: 'update_i',
                            i: i,
                            j: j,
                            k: k,
                            panel: `T[${i + k}]='${doubled[i + k]}' > T[${j + k}]='${doubled[j + k]}' → update i to ${i}`,
                            statusText: `j better → i=${i}`,
                            log: `  j better → i=${i}`
                        });
                    }
                    k = 0;
                }
            }

            const minIndex = Math.min(i, j);

            steps.push({
                type: 'final',
                i: i,
                j: j,
                k: k,
                panel: `Scan complete.<br>Minimal rotation starts at index <b>${minIndex}</b><br>Rotation: <b>"${currentS.substring(minIndex) + currentS.substring(0, minIndex)}"</b>`,
                statusText: `Minimal index = ${minIndex}`,
                log: `\nFinal minimal index = ${minIndex}`,
                complete: true,
                finalResult: minIndex
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render original string tiles
            const container = document.getElementById('strings-display');
            container.innerHTML = '';
            for (let pos = 0; pos < currentS.length; pos++) {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const idxTile = document.createElement('div');
                idxTile.className = 'tile';
                idxTile.style.fontSize = '11px';
                idxTile.style.height = '24px';
                idxTile.style.opacity = '0.7';
                idxTile.innerText = pos;
                const chTile = document.createElement('div');
                chTile.className = 'tile';
                chTile.innerText = currentS[pos];
                if (step.type === 'final' && pos === step.finalResult) chTile.classList.add('valid-pal');
                unit.append(idxTile, chTile);
                container.appendChild(unit);
            }

            // Doubled display
            document.getElementById('doubled-display').innerHTML = `Doubled string: <b>"${currentS + currentS}"</b>`;

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-j').innerText = step.j !== undefined ? step.j : '—';
            document.getElementById('val-k').innerText = step.k !== undefined ? step.k : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
