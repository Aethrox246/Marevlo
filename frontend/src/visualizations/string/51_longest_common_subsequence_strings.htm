<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Common Subsequence - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 320px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .string-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 80px;
            text-align: right;
        }

        .dp-table {
            display: grid;
            gap: 2px;
            background: var(--border-main);
            padding: 2px;
            border-radius: 6px;
        }

        .dp-cell {
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            background: #21262d; font-family: monospace; font-size: 16px; font-weight: 600;
            transition: all 0.3s ease; border: 1px solid var(--border-main);
        }

        .dp-cell.header { background: #161b22; font-size: 12px; color: var(--text-dim); }
        .dp-cell.current { background: var(--accent-purple); color: white; transform: scale(1.1); }
        .dp-cell.computed { background: var(--accent-green); color: white; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 80px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="s-input" placeholder='"ABC"'>
        <label class="ui-label">t =</label>
        <input type="text" id="t-input" placeholder='"AC"'>
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1 ("ABC", "AC")</button>
        <button onclick="loadExample(1)">Ex 2 ("AGGTAB", "GXTXAYB")</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">DP Table – Bottom-Up LCS Computation</div>
        <div id="dp-table" class="dp-table"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">i (s)</span>
            <span class="info-value" id="val-i" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">j (t)</span>
            <span class="info-value" id="val-j" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Cell</span>
            <span class="info-value" id="val-cell" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">LCS Length</span>
            <span class="info-value" id="val-lcs" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">LCS Length =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Cell</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Computed</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Match</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Mismatch</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "";
        let currentT = "";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1200, 600, 300];

        function init() { loadExample(0); }

        function loadExample(exIndex) {
            if (exIndex === 0) {
                currentS = "ABC";
                currentT = "AC";
            } else {
                currentS = "AGGTAB";
                currentT = "GXTXAYB";
            }
            document.getElementById('s-input').value = `"${currentS}"`;
            document.getElementById('t-input').value = `"${currentT}"`;
            generateSteps();
            reset();
        }

        function loadCustom() {
            let valS = document.getElementById('s-input').value.trim();
            if (valS.startsWith('"') && valS.endsWith('"')) valS = valS.slice(1, -1);
            currentS = valS || "";
            
            let valT = document.getElementById('t-input').value.trim();
            if (valT.startsWith('"') && valT.endsWith('"')) valT = valT.slice(1, -1);
            currentT = valT || "";
            
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            const m = currentT.length;
            let dp = Array(n+1).fill().map(() => Array(m+1).fill(0));

            // INIT
            steps.push({
                type: 'init',
                dp: dp.map(row => [...row]),
                i: 0,
                j: 0,
                panel: `s = <b>"${currentS}"</b> (len=${n})<br>t = <b>"${currentT}"</b> (len=${m})`,
                statusText: `Initializing DP table...`,
                log: `Initialize DP table (size ${(n+1)}x${(m+1)})`
            });

            // Fill table
            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= m; j++) {
                    let states = dp.map(row => [...row]);
                    states[i][j] = 'computing';

                    steps.push({
                        type: 'compute',
                        dp: states,
                        i: i,
                        j: j,
                        panel: `Computing dp[${i}][${j}]<br>s[${i-1}]='${currentS[i-1]}', t[${j-1}]='${currentT[j-1]}'`,
                        statusText: `Filling cell (${i},${j})`,
                        log: `  dp[${i}][${j}]: comparing '${currentS[i-1]}' and '${currentT[j-1]}'`
                    });

                    if (currentS[i-1] === currentT[j-1]) {
                        dp[i][j] = dp[i-1][j-1] + 1;
                        states = dp.map(row => [...row]);
                        states[i][j] = 'valid-pal';

                        steps.push({
                            type: 'match',
                            dp: states,
                            i: i,
                            j: j,
                            panel: `<span style="color:var(--accent-green)">Match! dp[${i}][${j}] = dp[${i-1}][${j-1}] + 1 = ${dp[i][j]}</span>`,
                            statusText: `Characters match`,
                            log: `    → Match, value = ${dp[i][j]}`
                        });
                    } else {
                        dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
                        states = dp.map(row => [...row]);
                        states[i][j] = 'valid-pal';

                        steps.push({
                            type: 'mismatch',
                            dp: states,
                            i: i,
                            j: j,
                            panel: `<span style="color:var(--accent-blue)">Mismatch → dp[${i}][${j}] = max(dp[${i-1}][${j}], dp[${i}][${j-1}]) = ${dp[i][j]}</span>`,
                            statusText: `Characters mismatch`,
                            log: `    → Mismatch, value = ${dp[i][j]}`
                        });
                    }
                }
            }

            // FINAL
            steps.push({
                type: 'final',
                dp: dp.map(row => [...row]),
                i: n,
                j: m,
                states: dp.map(row => row.map(() => 'valid-pal')),
                complete: true,
                finalResult: dp[n][m],
                panel: `<span style="color:var(--accent-green)">LCS Length = <b>${dp[n][m]}</b></span>`,
                statusText: `Done. LCS Length = ${dp[n][m]}`,
                log: `\nFinal LCS Length: ${dp[n][m]}`,
                bold: true
            });
        }

        function createDPTable(dp, highlightI = -1, highlightJ = -1) {
            const container = document.getElementById('dp-table');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${dp[0].length}, 1fr)`;

            // Headers
            const headerEmpty = document.createElement('div');
            headerEmpty.className = 'dp-cell header';
            headerEmpty.innerText = '';
            container.appendChild(headerEmpty);

            for (let j = 0; j < dp[0].length - 1; j++) {
                const cell = document.createElement('div');
                cell.className = 'dp-cell header';
                cell.innerText = currentT[j] || '';
                container.appendChild(cell);
            }

            for (let i = 0; i < dp.length; i++) {
                // Row header
                const rowHeader = document.createElement('div');
                rowHeader.className = 'dp-cell header';
                rowHeader.innerText = i === 0 ? '' : currentS[i-1] || '';
                container.appendChild(rowHeader);

                for (let j = 0; j < dp[i].length; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'dp-cell';
                    cell.innerText = dp[i][j];

                    if (i === highlightI && j === highlightJ) {
                        cell.classList.add('current');
                    } else if (i > 0 && j > 0) {
                        cell.classList.add('computed');
                    }

                    container.appendChild(cell);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            createDPTable(step.dp, step.i, step.j);

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').innerText = step.i !== undefined ? step.i : '—';
            document.getElementById('val-j').innerText = step.j !== undefined ? step.j : '—';
            document.getElementById('val-cell').innerText = step.i !== undefined && step.j !== undefined ? dp[step.i][step.j] : '—';
            document.getElementById('val-lcs').innerText = step.finalResult !== undefined ? step.finalResult : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.finalResult;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() { if (stepIndex < steps.length - 1) { stepIndex++; renderStep(stepIndex); } else pause(); }
        function back() { if (stepIndex > 0) { stepIndex--; renderStep(stepIndex); } }
        function reset() { pause(); stepIndex = 0; renderStep(0); }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
