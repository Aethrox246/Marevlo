<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36 - First Non-Repeating Character - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --accent-blue: #388bfd;
            --accent-orange: #e3b341;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface);
            padding: 12px 16px; display: flex; justify-content: center;
            align-items: center; gap: 8px; border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        .ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main);
            color: var(--text-main); height: 32px; border-radius: 6px;
            padding: 0 10px; width: 280px; font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px;
            background: var(--btn-bg); border: 1px solid var(--border-main);
            color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container {
            margin-top: 30px; display: flex; flex-direction: column;
            align-items: center; gap: 20px; width: 100%; max-width: 820px;
        }

        .string-row {
            display: flex; gap: 8px; align-items: center;
        }
        .string-label {
            font-family: monospace; font-size: 13px;
            color: var(--text-dim); min-width: 60px; text-align: right;
        }
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center;
            justify-content: center; border-radius: 8px; font-size: 24px;
            font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main);
            background: #21262d; color: var(--text-main);
        }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.15); }
        .tile.checking { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.duplicate { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }
        .tile.unique { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.idle { opacity: 0.9; }

        .action-panel {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 720px; min-height: 92px;
            text-align: center; font-family: monospace; font-size: 15px; line-height: 1.5;
        }

        .info-panel {
            display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
        }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 10px 18px; text-align: center; min-width: 130px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-size: 19px; font-weight: 700; font-family: monospace; }

        .result-display {
            margin-top: 12px; font-size: 24px; font-family: monospace;
            color: var(--accent-green); font-weight: bold;
        }

        .status-bar {
            margin-top: 8px; font-size: 13px; color: var(--text-dim);
            height: 1.3em; text-align: center; width: 720px;
        }

        .controls {
            margin-top: 24px; display: flex; align-items: center; gap: 10px;
        }
        input[type="range"] { accent-color: var(--accent-blue); width: 130px; }

        .legend {
            margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap;
            justify-content: center; font-size: 12px; color: var(--text-dim);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%;
            height: 170px; overflow-y: auto; font-family: 'Courier New', monospace;
            font-size: 13px; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s = </label>
        <input type="text" id="str-input" value="leetcode">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(0)">Ex 1: leetcode</button>
        <button onclick="loadExample(1)">Ex 2: aabb</button>
    </div>

    <div class="visual-container">
        <div class="string-row" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">Click Play or Next to start</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Outer i</span>
            <span class="info-value" id="val-i" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Inner j</span>
            <span class="info-value" id="val-j" style="color:var(--accent-blue)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Char</span>
            <span class="info-value" id="val-char" style="color:var(--accent-orange)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Status</span>
            <span class="info-value" id="val-status" style="color:var(--accent-green)">—</span>
        </div>
    </div>

    <div class="result-display" id="result-text"></div>
    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="next()">Next →</button>
        <span class="ui-label" style="margin-left:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-purple);border-radius:4px"></span> Outer i (candidate)</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-blue);border-radius:4px"></span> Inner j (checking)</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-red);border-radius:4px"></span> Duplicate found</div>
        <div class="legend-item"><span style="display:inline-block;width:14px;height:14px;background:var(--accent-green);border-radius:4px"></span> Unique!</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "leetcode";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1200, 600, 280];

        function generateSteps() {
            steps = [];
            const n = currentS.length;

            steps.push({
                type: 'init',
                i: -1, j: -1,
                panel: `s = "<b>${currentS}</b>"`,
                status: 'Starting brute force search...',
                log: `n = ${n}\nLooking for first char with no duplicates`
            });

            for (let i = 0; i < n; i++) {
                let isUnique = true;
                let duplicateAt = -1;

                steps.push({
                    type: 'outer',
                    i: i, j: -1,
                    ch: currentS[i],
                    panel: `Candidate: s[${i}] = '<b>${currentS[i]}</b>'`,
                    status: `Checking character '${currentS[i]}' at position ${i}`,
                    log: `i=${i}, char='${currentS[i]}' → checking for duplicates...`
                });

                for (let j = 0; j < n; j++) {
                    if (i === j) continue;

                    steps.push({
                        type: currentS[i] === currentS[j] ? 'duplicate' : 'checking',
                        i: i, j: j,
                        ch: currentS[i],
                        panel: `Compare s[${i}]='${currentS[i]}' with s[${j}]='${currentS[j]}'`,
                        status: currentS[i] === currentS[j] 
                            ? `Duplicate found at j=${j}!` 
                            : `No match at j=${j}`,
                        log: `j=${j} | '${currentS[i]}' ${currentS[i]===currentS[j] ? '==' : '!='} '${currentS[j]}'`
                    });

                    if (currentS[i] === currentS[j]) {
                        isUnique = false;
                        duplicateAt = j;
                        break;
                    }
                }

                if (isUnique) {
                    steps.push({
                        type: 'unique',
                        i: i, j: -1,
                        ch: currentS[i],
                        panel: `<span style="color:var(--accent-green)">FOUND! First non-repeating character = '<b>${currentS[i]}</b>'</span>`,
                        status: `Character '${currentS[i]}' appears only once → return it`,
                        log: `No duplicates found for '${currentS[i]}' → RESULT = '${currentS[i]}'`,
                        complete: true,
                        result: currentS[i]
                    });
                    return; // stop generating further steps
                }
            }

            // No unique found
            steps.push({
                type: 'none',
                i: n, j: -1,
                panel: `<span style="color:var(--accent-red)">No non-repeating character found → return -1</span>`,
                status: 'All characters have duplicates',
                log: `No unique character found after checking all positions → RESULT = -1`,
                complete: true,
                result: -1
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = `<div class="string-label">s</div>`;

            currentS.split('').forEach((ch, pos) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';

                const tile = document.createElement('div');
                let cls = 'tile idle';
                if (pos === step.i) cls = 'tile center';
                else if (step.j !== undefined && pos === step.j) cls = 'tile checking';
                else if (step.type === 'duplicate' && pos === step.j) cls = 'tile duplicate';
                else if (step.type === 'unique' && pos === step.i) cls = 'tile unique';
                tile.className = cls;
                tile.textContent = ch;

                const idxEl = document.createElement('div');
                idxEl.style.fontSize = '10px';
                idxEl.style.color = '#8b949e';
                idxEl.textContent = pos;

                unit.append(tile, idxEl);
                container.appendChild(unit);
            });

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-i').textContent = step.i !== undefined ? step.i : '—';
            document.getElementById('val-j').textContent = step.j !== undefined ? step.j : '—';
            document.getElementById('val-char').textContent = step.ch ? `'${step.ch}'` : '—';
            document.getElementById('val-status').textContent = step.type === 'unique' ? 'UNIQUE!' : (step.type === 'duplicate' ? 'DUPLICATE' : '—');

            const res = document.getElementById('result-text');
            if (step.complete) {
                res.innerHTML = step.result === -1 
                    ? `Result: <b style="color:var(--accent-red)">-1</b>` 
                    : `Result: <b>'${step.result}'</b>`;
            } else res.textContent = '';

            document.getElementById('status-text').textContent = step.status;

            // Log
            const logPanel = document.getElementById('log');
            logPanel.innerHTML = steps.slice(0, idx + 1).map(s => `<div>${s.log}</div>`).join('');
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.textContent = '⏸ Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            if (timer) clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').textContent = '▶ Play';
        }

        function loadExample(idx) {
            currentS = idx === 0 ? "leetcode" : "aabb";
            document.getElementById('str-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            currentS = document.getElementById('str-input').value.trim() || "leetcode";
            generateSteps();
            reset();
        }

        window.onload = () => loadExample(0);
    </script>
</body>
</html>
