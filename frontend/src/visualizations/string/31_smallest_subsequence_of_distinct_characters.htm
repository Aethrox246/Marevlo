<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smallest Subsequence of Distinct Characters - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-main);
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main); color: var(--text-main);
            height: 32px; border-radius: 6px; padding: 0 10px; font-size: 13px; width: 220px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 6px; justify-content: center; padding: 20px 0; flex-wrap: wrap; max-width: 900px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 18px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); transform: scale(1.2); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 20px; width: 760px; text-align: center; font-family: monospace; min-height: 120px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 160px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; color: var(--accent-blue); }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 32px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 740px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 140px; }

        .legend { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 760px; max-width: 90%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.4;
        }

        .map-panel {
            margin-top: 10px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 10px; width: 760px; font-family: monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">Input String s =</label>
        <input type="text" id="s-input" placeholder="bcabc" style="width:240px">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 (bcabc)</button>
        <button onclick="loadExample(2)">Ex 2 (cbacdcbc)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Greedy Stack O(n) — Lexicographically Smallest Subsequence with Distinct Characters</div>
        
        <div class="string-display" id="strings-display"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Char (Index)</span>
            <span class="info-value" id="val-char" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Stack</span>
            <span class="info-value" id="val-stack" style="color: var(--accent-blue);">[]</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Visited</span>
            <span class="info-value" id="val-visited" style="color: var(--accent-green);">{} </span>
        </div>
    </div>

    <div class="map-panel" id="freq-panel">Frequency: —</div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 6px;">Smallest Subsequence =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div style="margin-left:20px">
            <span class="ui-label" style="margin-right:6px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Character</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Push / Valid</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Pop</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "bcabc";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            currentS = exIndex === 1 ? "bcabc" : "cbacdcbc";
            document.getElementById('s-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = document.getElementById('s-input').value.trim();
            if (val) {
                currentS = val;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let freq = {};
            for (let ch of currentS) freq[ch] = (freq[ch] || 0) + 1;

            let stack = [];
            let visited = new Set();
            let best = "";

            steps.push({
                type: 'init',
                i: -1,
                char: '',
                stack: [],
                visited: [],
                freq: {...freq},
                panel: `Input: <b>"${currentS}"</b><br>Greedy Stack Approach (O(n))`,
                statusText: `Building frequency map...`,
                log: `s = "${currentS}"\nFrequency map built.`
            });

            for (let i = 0; i < n; i++) {
                const ch = currentS[i];
                freq[ch]--;

                steps.push({
                    type: 'process',
                    i: i,
                    char: ch,
                    stack: [...stack],
                    visited: Array.from(visited),
                    freq: {...freq},
                    panel: `Processing char <b>'${ch}'</b> at index <b>${i}</b><br>Remaining freq['${ch}'] = ${freq[ch]}`,
                    statusText: `char='${ch}' (idx ${i}), freq=${freq[ch]}`,
                    log: `i=${i}, char='${ch}', remaining freq=${freq[ch]}`
                });

                if (visited.has(ch)) {
                    steps.push({
                        type: 'skip',
                        i: i,
                        char: ch,
                        stack: [...stack],
                        visited: Array.from(visited),
                        freq: {...freq},
                        panel: `Char '${ch}' already visited → skip`,
                        statusText: `Already visited → skip`,
                        log: `  Already in visited → skip`
                    });
                    continue;
                }

                // Pop loop
                let popped = false;
                while (stack.length > 0 && ch < stack[stack.length-1] && freq[stack[stack.length-1]] > 0) {
                    const top = stack.pop();
                    visited.delete(top);
                    popped = true;

                    steps.push({
                        type: 'pop',
                        i: i,
                        char: ch,
                        stack: [...stack],
                        visited: Array.from(visited),
                        freq: {...freq},
                        panel: `Popped <b>'${top}'</b> (larger than '${ch}' and appears later)`,
                        statusText: `Pop '${top}'`,
                        log: `  Pop '${top}' (can appear later)`
                    });
                }

                // Push
                stack.push(ch);
                visited.add(ch);

                steps.push({
                    type: 'push',
                    i: i,
                    char: ch,
                    stack: [...stack],
                    visited: Array.from(visited),
                    freq: {...freq},
                    panel: `Pushed <b>'${ch}'</b> → stack = <b>${JSON.stringify(stack)}</b>`,
                    statusText: `Push '${ch}'`,
                    log: `  Push '${ch}' → stack = ${JSON.stringify(stack)}`
                });
            }

            best = stack.join('');

            steps.push({
                type: 'final',
                i: n,
                char: '',
                stack: [...stack],
                visited: Array.from(visited),
                freq: {...freq},
                panel: `Processing complete.<br>Result stack: <b>${JSON.stringify(stack)}</b><br>Smallest subsequence: <b>"${best}"</b>`,
                statusText: `Done → "${best}"`,
                log: `\nFinal result: "${best}"`,
                complete: true,
                finalResult: best
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render string tiles
            const container = document.getElementById('strings-display');
            container.innerHTML = '';
            for (let k = 0; k < currentS.length; k++) {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const idxTile = document.createElement('div');
                idxTile.className = 'tile';
                idxTile.style.fontSize = '11px';
                idxTile.style.height = '24px';
                idxTile.style.opacity = '0.7';
                idxTile.innerText = k;
                const chTile = document.createElement('div');
                chTile.className = 'tile';
                chTile.innerText = currentS[k];
                if (k === step.i) chTile.classList.add('center');
                else if (step.type === 'final') chTile.classList.add('valid-pal');
                unit.append(idxTile, chTile);
                container.appendChild(unit);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-char').innerText = step.char ? `'${step.char}' (idx ${step.i})` : '—';
            document.getElementById('val-stack').innerText = JSON.stringify(step.stack || []);
            document.getElementById('val-visited').innerText = '{' + (step.visited || []).join(', ') + '}';

            // Frequency panel
            let freqHTML = 'Frequency remaining: ';
            for (let [ch, cnt] of Object.entries(step.freq || {})) {
                freqHTML += `<span style="margin-right:12px">${ch}:${cnt}</span>`;
            }
            document.getElementById('freq-panel').innerHTML = freqHTML;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = `"${step.finalResult}"`;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '5px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
