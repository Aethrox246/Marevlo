<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate All Valid Parentheses - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 180px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 8px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); z-index: 2; transform: scale(1.1);}
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); transform: scale(0.95); opacity: 0.8; }
        .tile.idle { opacity: 0.9; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 110px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 24px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 130px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">n =</label>
        <input type="text" id="str-input" placeholder="2">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 (n=1)</button>
        <button onclick="loadExample(2)">Ex 2 (n=2)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Current Backtracking Path:</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Open Count</span>
            <span class="info-value" id="val-open" style="color: var(--accent-purple);">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Close Count</span>
            <span class="info-value" id="val-close" style="color: var(--accent-blue);">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Length</span>
            <span class="info-value" id="val-len" style="color: var(--accent-blue);">0</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Valid Found</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">0</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">All Valid Parentheses =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Path</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-blue)"></span> Adding '(' / ')'</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid Complete</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Invalid / Pruned</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentN = 2;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1600, 800, 400];

        function init() { loadExample(2); }

        function loadExample(newN) {
            currentN = newN;
            document.getElementById('str-input').value = currentN;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const val = parseInt(document.getElementById('str-input').value.trim());
            if (!isNaN(val) && val >= 0) loadExample(val);
        }

        function generateSteps() {
            steps = [];
            let validResults = [];
            const targetLen = 2 * currentN;

            // INIT
            steps.push({
                type: 'init',
                current: '',
                open: 0,
                close: 0,
                states: [],
                panel: `Target: <b>${currentN}</b> pairs (length ${targetLen})<br>Backtracking to generate all valid parentheses.`,
                statusText: `Starting backtracking for n=${currentN}...`,
                log: `Problem initialized for n=${currentN}. Target length: ${targetLen}`,
                count: 0
            });

            function bt(current, open, close, path) {
                const len = current.length;

                // Record step for current state
                steps.push({
                    type: 'current',
                    current: current,
                    open: open,
                    close: close,
                    states: current.split('').map(c => c === '(' ? 'expanding' : 'valid-pal'),
                    panel: `Current: <b>"${current}"</b> | Open: ${open} | Close: ${close}`,
                    statusText: `Building... Length ${len}/${targetLen}`,
                    log: `  [Depth ${len}] "${current}" (open=${open}, close=${close})`,
                    count: validResults.length
                });

                if (len === targetLen) {
                    if (open === close) {
                        validResults.push(current);
                        steps.push({
                            type: 'found',
                            current: current,
                            open: open,
                            close: close,
                            states: current.split('').map(() => 'valid-pal'),
                            panel: `<span style="color:var(--accent-green)">Valid Complete: <b>"${current}"</b></span>`,
                            statusText: `Found valid: "${current}"`,
                            log: `  → Valid! Added "${current}". Total valid: ${validResults.length}`,
                            count: validResults.length
                        });
                    }
                    return;
                }

                // Try adding '('
                if (open < currentN) {
                    steps.push({
                        type: 'expanding',
                        current: current + '(',
                        open: open + 1,
                        close: close,
                        states: (current + '(').split('').map((c,i) => i === len ? 'center' : (c==='('?'expanding':'valid-pal')),
                        panel: `Trying to add <b>'('</b> → "${current}("`,
                        statusText: `Adding '(' (open ${open} → ${open+1})`,
                        log: `  Trying '(': "${current}("`,
                        count: validResults.length
                    });
                    bt(current + '(', open + 1, close, path + 1);
                }

                // Try adding ')'
                if (close < open) {
                    steps.push({
                        type: 'expanding',
                        current: current + ')',
                        open: open,
                        close: close + 1,
                        states: (current + ')').split('').map((c,i) => i === len ? 'center' : (c==='('?'expanding':'valid-pal')),
                        panel: `Trying to add <b>')'</b> → "${current})"`,
                        statusText: `Adding ')' (close ${close} → ${close+1})`,
                        log: `  Trying ')': "${current})"`,
                        count: validResults.length
                    });
                    bt(current + ')', open, close + 1, path + 1);
                }
            }

            bt('', 0, 0, 0);

            // FINAL
            steps.push({
                type: 'final',
                current: '',
                open: currentN,
                close: currentN,
                states: [],
                panel: `Backtracking complete.<br>Total valid parentheses: <b>${validResults.length}</b>`,
                complete: true,
                finalResult: validResults,
                statusText: `Done. Found ${validResults.length} valid strings.`,
                log: `\nFinal Result: ${validResults.length} valid parentheses strings.\n${validResults.join(', ')}`,
                bold: true,
                count: validResults.length
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            if (step.current) {
                step.current.split('').forEach((char, i) => {
                    const unit = document.createElement('div');
                    unit.className = 'tile-unit';
                    
                    const tile = document.createElement('div');
                    tile.className = `tile ${step.states[i] || 'idle'}`;
                    tile.innerText = char;
                    
                    const idxLabel = document.createElement('div');
                    idxLabel.className = 'tile-index';
                    idxLabel.innerText = `[${i}]`;
                    
                    unit.append(tile, idxLabel);
                    container.appendChild(unit);
                });
            } else {
                const empty = document.createElement('div');
                empty.style.fontFamily = 'monospace';
                empty.style.color = 'var(--text-dim)';
                empty.innerText = "(empty string)";
                container.appendChild(empty);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-open').innerText = step.open;
            document.getElementById('val-close').innerText = step.close;
            document.getElementById('val-len').innerText = step.current ? step.current.length : 0;
            document.getElementById('val-count').innerText = step.count;

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = JSON.stringify(step.finalResult);
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '2px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].bold && k === idx) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
