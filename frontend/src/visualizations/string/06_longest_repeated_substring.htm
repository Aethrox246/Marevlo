<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Repeated Substring - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%; background-color: var(--bg-surface); padding: 12px 16px;
            display: flex; justify-content: center; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-main); flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input); border: 1px solid var(--border-main); color: var(--text-main);
            height: 32px; border-radius: 6px; padding: 0 10px; font-size: 13px; width: 320px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; gap: 6px; justify-content: center; padding: 20px 0; flex-wrap: wrap; max-width: 800px; }

        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tile {
            min-width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 20px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.15); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); opacity: 0.7; }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 720px; text-align: center; font-family: monospace; min-height: 110px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 140px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 16px; font-weight: 700; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 28px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 700px; }

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 720px; max-width: 90%; height: 160px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="s-input" placeholder="ababa" style="width:320px">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1 (ababa)</button>
        <button onclick="loadExample(2)">Ex 2 (aaaa)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Brute Force: Check Substrings from Longest to Shortest for Duplicates</div>
        
        <div class="string-display" id="s-tiles"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Current Length L</span>
            <span class="info-value" id="val-l" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">i / j</span>
            <span class="info-value" id="val-ij" style="color: var(--accent-blue);">— / —</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Current Longest</span>
            <span class="info-value" id="val-longest" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">Longest Repeated Substring =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current Substring Being Checked</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Duplicate Found</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> No Match</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "ababa";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1400, 700, 350];

        function init() { loadExample(1); }

        function loadExample(exIndex) {
            if (exIndex === 1) {
                currentS = "ababa";
            } else {
                currentS = "aaaa";
            }
            document.getElementById('s-input').value = currentS;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const sVal = document.getElementById('s-input').value.trim();
            if (sVal) {
                currentS = sVal;
                generateSteps();
                reset();
            }
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let foundLongest = "";
            let foundStart = -1;

            steps.push({
                type: 'init',
                l: 0,
                i: 0,
                j: 0,
                longest: "",
                panel: `Input: s = <b>"${currentS}"</b><br>Checking substrings from longest to shortest for duplicates.`,
                statusText: `Starting search for longest repeated substring...`,
                log: `s = "${currentS}"`
            });

            for (let L = n-1; L >= 1; L--) {
                steps.push({
                    type: 'start_length',
                    l: L,
                    i: 0,
                    j: 0,
                    longest: foundLongest,
                    panel: `Checking substrings of length <b>${L}</b>`,
                    statusText: `Length L=${L}`,
                    log: `\nLength ${L}`
                });

                let duplicateFound = false;
                for (let i = 0; i <= n - L; i++) {
                    const sub = currentS.substring(i, i + L);

                    steps.push({
                        type: 'check_sub',
                        l: L,
                        i: i,
                        j: 0,
                        longest: foundLongest,
                        panel: `Substring s[${i}:${i+L}] = <b>"${sub}"</b>`,
                        statusText: `Checking substring starting at ${i}`,
                        log: `  i=${i}: "${sub}"`
                    });

                    for (let j = i + 1; j <= n - L; j++) {
                        const other = currentS.substring(j, j + L);

                        steps.push({
                            type: 'compare',
                            l: L,
                            i: i,
                            j: j,
                            longest: foundLongest,
                            panel: `Compare with s[${j}:${j+L}] = <b>"${other}"</b>`,
                            statusText: `Comparing with position ${j}`,
                            log: `    j=${j}: "${other}"`
                        });

                        if (sub === other) {
                            foundLongest = sub;
                            foundStart = i;
                            duplicateFound = true;
                            steps.push({
                                type: 'duplicate',
                                l: L,
                                i: i,
                                j: j,
                                longest: foundLongest,
                                panel: `Duplicate found at positions <b>${i}</b> and <b>${j}</b>!<br>Longest = <b>"${sub}"</b>`,
                                statusText: `Duplicate found! "${sub}"`,
                                log: `    Duplicate found! Length ${L} at ${i} and ${j}`
                            });
                            break;
                        }
                    }
                    if (duplicateFound) break;
                }
                if (duplicateFound) break;
            }

            steps.push({
                type: 'final',
                l: 0,
                i: foundStart,
                j: 0,
                longest: foundLongest,
                panel: `Search complete.<br>Longest repeated substring: <b>"${foundLongest}"</b>`,
                statusText: `Done → "${foundLongest}"`,
                log: `\nFinal longest repeated substring: "${foundLongest}"`,
                complete: true,
                finalResult: foundLongest
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            // Render s tiles
            const container = document.getElementById('s-tiles');
            container.innerHTML = '';
            for (let k = 0; k < currentS.length; k++) {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'tile';
                if (k >= step.i && k < step.i + step.l && step.type === 'duplicate') cls += ' valid-pal';
                else if (k === step.i) cls += ' center';
                tile.className = cls;
                tile.innerText = currentS[k];
                unit.appendChild(tile);
                container.appendChild(unit);
            }

            document.getElementById('main-panel').innerHTML = step.panel;
            document.getElementById('val-l').innerText = step.l || '—';
            document.getElementById('val-ij').innerText = `${step.i} / ${step.j}`;
            document.getElementById('val-longest').innerText = step.longest || '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = `"${step.finalResult}"`;
                resVal.classList.add('pop');
            } else {
                resVal.innerText = '—';
                resVal.classList.remove('pop');
            }

            document.getElementById('status-text').innerText = step.statusText;

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '4px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].complete) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
