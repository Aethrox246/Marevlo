<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find All Minimal Periods of a String - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            width: 380px;
            font-size: 13px;
        }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .string-display { display: flex; flex-direction: column; gap: 12px; justify-content: center; position: relative; padding: 20px 0; }
        
        .tile-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .tile {
            min-width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 22px; font-weight: 600; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 2px solid var(--border-main); background: #21262d;
            color: var(--text-main);
        }
        .tile-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .tile.center { background: #1e1030; border-color: var(--accent-purple); color: var(--accent-purple); transform: scale(1.12); }
        .tile.expanding { background: #0d2244; border-color: var(--accent-blue); color: var(--accent-blue); }
        .tile.valid-pal { background: #0f2a1a; border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .tile.mismatch { background: #2a0d0d; border-color: var(--accent-red); color: var(--accent-red); }
        .tile.idle { opacity: 0.95; }

        .string-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .string-label {
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
            min-width: 90px;
            text-align: right;
        }

        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 24px; width: 760px; min-height: 110px;
            text-align: center; font-family: monospace; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 16px; display: flex; flex-direction: column; align-items: center; min-width: 120px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 17px; font-weight: 700; }

        .result-display { margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 28px; color: var(--accent-green); font-family: monospace; transition: all 0.4s; font-weight: bold; }
        .pop { animation: popAnim 420ms ease; color: var(--accent-green) !important; text-shadow: 0 0 15px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 45%{transform:scale(1.28)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 10px; font-size: 13px; color: var(--text-dim); height: 1.3em; text-align: center; width: 620px;}

        .controls { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 120px; cursor: pointer; }

        .legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
        .legend-item { display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim); }
        .dot { width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; display: inline-block; }

        .log-panel {
            margin-top: 16px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 14px 18px; width: 760px; max-width: 92%; height: 170px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
        }
        .log-line { margin-bottom: 3px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">s =</label>
        <input type="text" id="s-input" value="ababab" placeholder="string">
        <button onclick="runBruteForce()">Run Brute Force</button>
        <button onclick="resetViz()">Reset</button>
        <button onclick="loadExample1()">Example 1: ababab</button>
        <button onclick="loadExample2()">Example 2: aaaa</button>
    </div>

    <div class="visual-container">
        <div class="ui-label" style="margin-bottom:8px">Find All Minimal Periods of a String — Brute Force Visualization</div>
        <div class="string-display" id="tiles-container"></div>
    </div>

    <div class="action-panel" id="main-panel">Ready — Click "Run Brute Force" to simulate checking candidate periods p and block comparisons</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">Period p</span>
            <span class="info-value" id="val-p" style="color:var(--accent-purple)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Valid?</span>
            <span class="info-value" id="val-valid" style="color:var(--accent-green)">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">Max Periods</span>
            <span class="info-value" id="val-max" style="color:var(--accent-orange)">0</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom:6px">Minimal periods =</span>
        <span id="res-val">[]</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="resetViz()">↺ Reset</button>
        <button onclick="backStep()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button onclick="nextStep()">Next →</button>
        <span class="ui-label" style="margin-left:12px;font-size:12px">Speed</span>
        <input type="range" id="speed-slider" min="0" max="2" value="1">
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent-purple)"></span> Current period p</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Valid period</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-red)"></span> Invalid period</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let currentS = "ababab";
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1300, 650, 320];
        let currentPeriods = [];

        function resetViz() {
            pause();
            steps = [];
            stepIndex = 0;
            currentPeriods = [];
            renderTiles();
            document.getElementById('main-panel').innerHTML = 'Ready — Click Run Brute Force';
            document.getElementById('log').innerHTML = '';
            document.getElementById('res-val').innerText = '[]';
            document.getElementById('val-p').innerText = '—';
            document.getElementById('val-valid').innerText = '—';
            document.getElementById('val-max').innerText = '0';
            document.getElementById('status-text').innerText = '';
        }

        function renderTiles(p = -1) {
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';

            const row = document.createElement('div');
            row.className = 'string-row';
            const label = document.createElement('div');
            label.className = 'string-label';
            label.innerText = 's';
            row.appendChild(label);

            currentS.split('').forEach((ch, idx) => {
                const unit = document.createElement('div');
                unit.className = 'tile-unit';
                const tile = document.createElement('div');
                let cls = 'idle';
                if (p !== -1 && idx % p === 0) cls = 'center';
                tile.className = `tile ${cls}`;
                tile.innerText = ch;
                const idxEl = document.createElement('div');
                idxEl.className = 'tile-index';
                idxEl.innerText = idx;
                unit.appendChild(tile);
                unit.appendChild(idxEl);
                row.appendChild(unit);
            });
            container.appendChild(row);
        }

        function generateSteps() {
            steps = [];
            const n = currentS.length;
            let periods = [];

            steps.push({
                type: 'init',
                panel: `Brute force checking candidate periods for s="<b>${currentS}</b>" (n=${n})`,
                statusText: `Checking p from 1 to ${Math.floor(n/2)}`,
                log: `Initialize periods = []`,
                periods: []
            });

            for (let p = 1; p <= Math.floor(n / 2); p++) {
                if (n % p !== 0) {
                    steps.push({
                        type: 'invalid',
                        p: p,
                        panel: `p=${p}: n % p != 0 → invalid period`,
                        statusText: `p=${p} not divisor`,
                        log: `p=${p}: not divisor, skip`,
                        periods: periods
                    });
                    continue;
                }

                let valid = true;
                let mismatch_pos = -1;

                for (let i = p; i < n; i += p) {
                    if (currentS.substring(i, i + p) !== currentS.substring(0, p)) {
                        valid = false;
                        mismatch_pos = i;
                        break;
                    }
                }

                if (valid) {
                    periods.push(p);
                }

                steps.push({
                    type: valid ? 'valid' : 'invalid',
                    p: p,
                    panel: `p=${p}: ${valid ? 'VALID' : 'invalid'} (block comparison ${valid ? 'passed' : `failed at block starting at ${mismatch_pos}`})`,
                    statusText: `p=${p} ${valid ? 'valid' : 'invalid'}`,
                    log: `p=${p}: ${valid ? '✓ valid' : `✗ invalid`}`,
                    periods: periods
                });
            }

            steps.push({
                type: 'final',
                panel: `Found minimal periods: <b>${periods.length ? periods.join(', ') : 'none'}</b>`,
                statusText: `Result: ${periods}`,
                log: `\n=== FINAL RESULT ===\nMinimal periods: ${periods}`,
                periods: periods,
                bold: true
            });
        }

        function renderStep(idx) {
            if (idx < 0 || idx >= steps.length) return;
            const step = steps[idx];

            renderTiles(step.p !== undefined ? step.p : -1);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-p').innerText = step.p !== undefined ? step.p : '—';
            document.getElementById('val-valid').innerText = step.type === 'valid' ? 'YES' : (step.type === 'invalid' ? 'NO' : '—');
            document.getElementById('val-max').innerText = step.periods !== undefined ? step.periods.length : '0';

            const resEl = document.getElementById('res-val');
            resEl.innerText = step.periods !== undefined ? (step.periods.length ? `[${step.periods.join(', ')}]` : '[]') : '[]';
            if (step.type === 'final') resEl.classList.add('pop');
            else resEl.classList.remove('pop');

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.className = 'log-line';
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    if (steps[k].type === 'valid') line.style.color = 'var(--accent-green)';
                    if (steps[k].type === 'invalid') line.style.color = 'var(--accent-red)';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function nextStep() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else {
                pause();
            }
        }

        function backStep() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) {
                pause();
            } else {
                btn.innerText = '❚❚ Pause';
                if (stepIndex >= steps.length - 1 && steps.length > 0) stepIndex = 0;
                timer = setInterval(() => {
                    if (stepIndex < steps.length - 1) {
                        stepIndex++;
                        renderStep(stepIndex);
                    } else {
                        pause();
                    }
                }, delays[parseInt(document.getElementById('speed-slider').value)]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = '▶ Play';
        }

        function runBruteForce() {
            currentS = document.getElementById('s-input').value.trim() || "ababab";

            pause();
            generateSteps();
            stepIndex = 0;
            renderStep(0);
        }

        function loadExample1() {
            document.getElementById('s-input').value = "ababab";
            runBruteForce();
        }

        function loadExample2() {
            document.getElementById('s-input').value = "aaaa";
            runBruteForce();
        }

        window.onload = () => {
            renderTiles();
            document.getElementById('log').innerHTML = '<div class="log-line">Click "Run Brute Force" to simulate checking candidate periods and block comparisons for minimal periods.</div>';
        };
    </script>
</body>
</html>
