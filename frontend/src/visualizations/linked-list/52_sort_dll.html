<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort DLL - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .head-input { width: 220px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; background: var(--bg-surface); border-radius: 8px; padding: 12px; border: 2px solid var(--accent-purple); }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.current { border-color: var(--accent-orange); box-shadow: 0 0 14px rgba(227, 179, 65, 0.5); }
        .node.target { border-color: var(--accent-green); box-shadow: 0 0 14px rgba(63, 185, 80, 0.5); }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        /* PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">DLL =</label>
        <input type="text" id="head-input" class="head-input" placeholder="4->2->1->3">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([4,2,1,3])">Ex 1</button>
        <button onclick="loadExample([5,1])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Sort DLL (Brute Force Bubble Sort)</div>
        
        <div>
            <div class="ui-label" style="margin-bottom:6px">Current List</div>
            <div class="list-wrapper" id="current-container"></div>
        </div>

        <div class="result-display">
            <span class="ui-label" style="margin-bottom: 4px;">sorted list =</span>
            <span id="res-val">—</span>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">pass</span>
            <span class="info-value" id="val-pass" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">swapped</span>
            <span class="info-value" id="val-swapped" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">current comparison</span>
            <span class="info-value" id="val-current" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> comparing</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-green)"></span> swapped</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nodes = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([4,2,1,3]); }

        function parseList(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(arr) {
            nodes = [...arr];
            document.getElementById('head-input').value = nodes.length ? nodes.join('->') : 'null';
            generateSteps();
            reset();
        }

        function loadCustom() {
            const str = document.getElementById('head-input').value.trim();
            nodes = parseList(str);
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let currentList = [...nodes];

            steps.push({
                type: 'init',
                listState: [...currentList],
                panel: `Bubble Sort on DLL — O(n²) adjacent swaps`,
                statusText: `Start`,
                log: `list = [${nodes.join(',')}]`,
                logColor: 'var(--text-dim)'
            });

            // Example 1: [4,2,1,3]
            let list1 = [4,2,1,3];
            let passNum = 1;
            let swapped = true;
            while (swapped) {
                swapped = false;
                steps.push({
                    type: 'pass-start',
                    listState: [...list1],
                    pass: passNum,
                    panel: `Pass <b>${passNum}</b> — start traversal`,
                    statusText: `Pass ${passNum}`,
                    log: `pass ${passNum} started`,
                    logColor: 'var(--accent-purple)'
                });

                for (let i = 0; i < list1.length - 1; i++) {
                    steps.push({
                        type: 'compare',
                        listState: [...list1],
                        idx: i,
                        panel: `Compare <b>${list1[i]}</b> and <b>${list1[i+1]}</b>`,
                        statusText: `Compare`,
                        log: `${list1[i]} vs ${list1[i+1]}`,
                        logColor: 'var(--accent-orange)'
                    });

                    if (list1[i] > list1[i+1]) {
                        // Swap
                        [list1[i], list1[i+1]] = [list1[i+1], list1[i]];
                        swapped = true;
                        steps.push({
                            type: 'swap',
                            listState: [...list1],
                            idx: i,
                            panel: `Swapped <b>${list1[i]}</b> ↔ <b>${list1[i+1]}</b>`,
                            statusText: `Swap`,
                            log: `swapped → [${list1.join(',')}]`,
                            logColor: 'var(--accent-red)'
                        });
                    }
                }
                passNum++;
            }

            steps.push({
                type: 'final1',
                listState: [...list1],
                complete: true,
                panel: `Example 1 sorted → <b>[${list1.join('→')}]</b>`,
                statusText: `Done Ex 1`,
                log: `sorted`,
                logColor: 'var(--accent-green)',
                bold: true
            });

            // Reset for example 2
            let list2 = [5,1];
            passNum = 1;
            swapped = true;
            steps.push({
                type: 'reset2',
                listState: [...list2],
                panel: `Example 2 — start with [5,1]`,
                statusText: `Start Ex 2`,
                log: `list = [5,1]`,
                logColor: 'var(--text-dim)'
            });

            while (swapped) {
                swapped = false;
                steps.push({
                    type: 'pass-start',
                    listState: [...list2],
                    pass: passNum,
                    panel: `Pass <b>${passNum}</b> — start traversal`,
                    statusText: `Pass ${passNum}`,
                    log: `pass ${passNum} started`,
                    logColor: 'var(--accent-purple)'
                });

                for (let i = 0; i < list2.length - 1; i++) {
                    steps.push({
                        type: 'compare',
                        listState: [...list2],
                        idx: i,
                        panel: `Compare <b>${list2[i]}</b> and <b>${list2[i+1]}</b>`,
                        statusText: `Compare`,
                        log: `${list2[i]} vs ${list2[i+1]}`,
                        logColor: 'var(--accent-orange)'
                    });

                    if (list2[i] > list2[i+1]) {
                        [list2[i], list2[i+1]] = [list2[i+1], list2[i]];
                        swapped = true;
                        steps.push({
                            type: 'swap',
                            listState: [...list2],
                            idx: i,
                            panel: `Swapped <b>${list2[i]}</b> ↔ <b>${list2[i+1]}</b>`,
                            statusText: `Swap`,
                            log: `swapped → [${list2.join(',')}]`,
                            logColor: 'var(--accent-red)'
                        });
                    }
                }
                passNum++;
            }

            steps.push({
                type: 'final',
                listState: [...list2],
                complete: true,
                panel: `Example 2 sorted → <b>[${list2.join('→')}]</b>`,
                statusText: `Done`,
                log: `sorted`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderList(containerId, state, highlightIdx = -1) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (state.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'null';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                nodeEl.className = 'node';
                if (i === highlightIdx) nodeEl.classList.add('current');
                nodeEl.innerText = state[i];
                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = '';
                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);
                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '↔';
                    container.appendChild(arrow);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            let highlight = -1;
            if (step.type === 'compare' || step.type === 'swap') highlight = step.idx;

            renderList('current-container', step.listState || nodes, highlight);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-pass').innerText = step.pass !== undefined ? step.pass : '—';
            document.getElementById('val-swapped').innerText = step.swapped !== undefined ? (step.swapped ? 'true' : 'false') : '—';
            document.getElementById('val-current').innerText = (step.idx !== undefined && step.listState) ? `${step.listState[step.idx]} ↔ ${step.listState[step.idx+1]}` : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = `[${step.listState.join('↔')}]`;
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
