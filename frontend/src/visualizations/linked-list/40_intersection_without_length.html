<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intersection without length - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .list-input { width: 280px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.current { border-color: var(--accent-orange); box-shadow: 0 0 14px rgba(227, 179, 65, 0.5); }
        .node.match { border-color: var(--accent-green); box-shadow: 0 0 14px rgba(63, 185, 80, 0.5); }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">List A =</label>
        <input type="text" id="listA-input" class="list-input" placeholder="1->2->3->4" value="1->2->3->4">
        <label class="ui-label">List B =</label>
        <input type="text" id="listB-input" class="list-input" placeholder="9->3->4" value="9->3->4">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1</button>
        <button onclick="loadExample(2)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Intersection without length (Brute Force O(n²))</div>
        
        <div style="display:flex; gap:60px; align-items:flex-start; width:100%; max-width:1100px; justify-content:center;">
            <div>
                <div class="ui-label" style="margin-bottom:6px">List A</div>
                <div class="list-wrapper" id="listA-container"></div>
            </div>
            
            <div>
                <div class="ui-label" style="margin-bottom:6px">List B</div>
                <div class="list-wrapper" id="listB-container"></div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">pointer A node</span>
            <span class="info-value" id="val-pa" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">pointer B node</span>
            <span class="info-value" id="val-pb" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">match found?</span>
            <span class="info-value" id="val-match" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">intersection node =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> pointer A</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-purple)"></span> pointer B</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-green)"></span> match</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--border-main); opacity:0.4"></span> node</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let listA = [];
        let listB = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample(1); }

        function parseList(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(exId) {
            if (exId === 1) {
                listA = [1,2,3,4];
                listB = [9,3,4];
            } else if (exId === 2) {
                listA = [5,6,7];
                listB = [8,9];
            }
            document.getElementById('listA-input').value = listA.join('->');
            document.getElementById('listB-input').value = listB.join('->');
            generateSteps();
            reset();
        }

        function loadCustom() {
            listA = parseList(document.getElementById('listA-input').value);
            listB = parseList(document.getElementById('listB-input').value);
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            steps.push({
                type: 'init',
                listAState: [...listA],
                listBState: [...listB],
                paIdx: -1,
                pbIdx: -1,
                panel: `Brute force O(n²): For each node in A, check every node in B`,
                statusText: `Start`,
                log: `List A: [${listA.join(',')}], List B: [${listB.join(',')}]`,
                logColor: 'var(--text-dim)'
            });

            let found = false;
            let intersectionNode = null;

            for (let i = 0; i < listA.length; i++) {
                steps.push({
                    type: 'outer',
                    listAState: [...listA],
                    listBState: [...listB],
                    paIdx: i,
                    pbIdx: -1,
                    panel: `Pointer A at <b>${listA[i]}</b>`,
                    statusText: `Outer loop`,
                    log: `A[${i}] = ${listA[i]}`,
                    logColor: 'var(--accent-orange)'
                });

                for (let j = 0; j < listB.length; j++) {
                    steps.push({
                        type: 'inner',
                        listAState: [...listA],
                        listBState: [...listB],
                        paIdx: i,
                        pbIdx: j,
                        panel: `Compare A[<b>${i}</b>] = ${listA[i]} with B[<b>${j}</b>] = ${listB[j]}`,
                        statusText: `Inner loop`,
                        log: `compare ${listA[i]} == ${listB[j]}`,
                        logColor: 'var(--accent-purple)'
                    });

                    if (listA[i] === listB[j]) {  // In real problem this would be node reference equality, but for viz we use value as per examples
                        found = true;
                        intersectionNode = listA[i];
                        steps.push({
                            type: 'match',
                            listAState: [...listA],
                            listBState: [...listB],
                            paIdx: i,
                            pbIdx: j,
                            panel: `MATCH found! Intersection at <b>${intersectionNode}</b>`,
                            statusText: `Intersection found`,
                            log: `intersection = ${intersectionNode}`,
                            logColor: 'var(--accent-green)',
                            bold: true
                        });
                        break;
                    }
                }
                if (found) break;
            }

            if (!found) {
                steps.push({
                    type: 'final',
                    listAState: [...listA],
                    listBState: [...listB],
                    paIdx: -1,
                    pbIdx: -1,
                    complete: true,
                    finalStr: 'null',
                    panel: `No intersection found`,
                    statusText: `Done`,
                    log: `no intersection`,
                    logColor: 'var(--accent-red)',
                    bold: true
                });
            } else {
                steps.push({
                    type: 'final',
                    listAState: [...listA],
                    listBState: [...listB],
                    paIdx: -1,
                    pbIdx: -1,
                    complete: true,
                    finalStr: intersectionNode.toString(),
                    panel: `Intersection node: <b>${intersectionNode}</b>`,
                    statusText: `Done`,
                    log: `intersection = ${intersectionNode}`,
                    logColor: 'var(--accent-green)',
                    bold: true
                });
            }
        }

        function renderList(containerId, state, highlightIdx) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (state.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'null';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                let cls = 'node';
                if (i === highlightIdx) cls += ' current';
                nodeEl.className = cls;
                nodeEl.innerText = state[i];
                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = '';
                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);
                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderList('listA-container', step.listAState || listA, step.paIdx);
            renderList('listB-container', step.listBState || listB, step.pbIdx);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-pa').innerText = step.paIdx !== undefined && step.paIdx >= 0 ? listA[step.paIdx] : '—';
            document.getElementById('val-pb').innerText = step.pbIdx !== undefined && step.pbIdx >= 0 ? listB[step.pbIdx] : '—';
            document.getElementById('val-match').innerText = step.type === 'match' ? 'YES' : 'no';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
