<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse between m-n - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .head-input { width: 320px; }
        .m-input, .n-input { width: 60px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.current { border-color: var(--accent-orange); box-shadow: 0 0 14px rgba(227, 179, 65, 0.5); }
        .node.reversed { border-color: var(--accent-green); box-shadow: 0 0 14px rgba(63, 185, 80, 0.5); }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        /* ARRAY VIEW */
        .array-container {
            background: var(--bg-surface);
            border: 2px solid var(--accent-purple);
            border-radius: 8px;
            padding: 12px;
            min-width: 420px;
            text-align: center;
        }
        .array-title { font-size: 13px; color: var(--accent-purple); margin-bottom: 8px; }
        .array-content { font-family: monospace; font-size: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .array-element { padding: 6px 12px; background: #21262d; border: 1px solid var(--border-main); border-radius: 6px; }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">list =</label>
        <input type="text" id="head-input" class="head-input" placeholder="1->2->3->4->5">
        <label class="ui-label">m =</label>
        <input type="text" id="m-input" class="m-input" placeholder="2" value="2">
        <label class="ui-label">n =</label>
        <input type="text" id="n-input" class="n-input" placeholder="4" value="4">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([1,2,3,4,5], 2, 4)">Ex 1</button>
        <button onclick="loadExample([5], 1, 1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Reverse between m-n (Brute Force Array Copy)</div>
        
        <div>
            <div class="ui-label" style="margin-bottom:6px">Original List</div>
            <div class="list-wrapper" id="original-container"></div>
        </div>

        <div class="array-container">
            <div class="array-title">Array [1-based indices] — Reverse m to n</div>
            <div class="array-content" id="array-content"></div>
        </div>

        <div>
            <div class="ui-label" style="margin-bottom:6px">Final Reversed List</div>
            <div class="list-wrapper" id="result-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">m (1-based)</span>
            <span class="info-value" id="val-m" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">n (1-based)</span>
            <span class="info-value" id="val-n" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">segment length</span>
            <span class="info-value" id="val-length" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">final list =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> current node</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-green)"></span> reversed segment</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--border-main); opacity:0.4"></span> node</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nodes = [];
        let mValue = 2;
        let nValue = 4;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([1,2,3,4,5], 2, 4); }

        function parseList(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(arr, m, n) {
            nodes = [...arr];
            mValue = m;
            nValue = n;
            document.getElementById('head-input').value = nodes.length ? nodes.join('->') : 'null';
            document.getElementById('m-input').value = mValue;
            document.getElementById('n-input').value = nValue;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const str = document.getElementById('head-input').value.trim();
            const mStr = document.getElementById('m-input').value.trim();
            const nStr = document.getElementById('n-input').value.trim();
            nodes = parseList(str);
            mValue = mStr ? parseInt(mStr) : 1;
            nValue = nStr ? parseInt(nStr) : nodes.length;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let arr = [...nodes];

            steps.push({
                type: 'init',
                listState: [...nodes],
                arrayState: [...arr],
                panel: `Brute force array copy:<br>Collect values → Reverse segment m to n (1-based) → Reassign to nodes`,
                statusText: `Start`,
                log: `list = [${nodes.join(',')}], m=${mValue}, n=${nValue}`,
                logColor: 'var(--text-dim)'
            });

            // Collect phase
            steps.push({
                type: 'collect',
                listState: [...nodes],
                arrayState: [...arr],
                panel: `Collected array: <b>[${arr.join(',')}]</b>`,
                statusText: `Collected`,
                log: `array = [${arr.join(',')}]`,
                logColor: 'var(--accent-purple)'
            });

            // Reverse phase
            let start = mValue - 1;
            let end = nValue - 1;
            let segment = arr.slice(start, end + 1);

            steps.push({
                type: 'start-reverse',
                listState: [...nodes],
                arrayState: [...arr],
                panel: `Reverse segment [${start+1} to ${end+1}]: <b>[${segment.join(',')}]</b>`,
                statusText: `Reversing`,
                log: `segment [${segment.join(',')}]`,
                logColor: 'var(--accent-orange)'
            });

            // Reverse the segment
            let left = start;
            let right = end;
            while (left < right) {
                let temp = arr[left];
                arr[left] = arr[right];
                arr[right] = temp;
                left++;
                right--;
                steps.push({
                    type: 'swap',
                    listState: [...nodes],
                    arrayState: [...arr],
                    panel: `Swap indices <b>${left}</b> and <b>${right+1}</b>`,
                    statusText: `Swap`,
                    log: `swapped ${arr[left]} ↔ ${arr[right+1]}`,
                    logColor: 'var(--accent-green)'
                });
            }

            steps.push({
                type: 'reversed',
                listState: [...nodes],
                arrayState: [...arr],
                panel: `Reversed segment → <b>[${arr.slice(start, end+1).join(',')}]</b>`,
                statusText: `Reversed`,
                log: `reversed segment`,
                logColor: 'var(--accent-green)'
            });

            steps.push({
                type: 'final',
                listState: [...nodes],
                arrayState: [...arr],
                complete: true,
                finalStr: arr.length ? arr.join('→') : 'null',
                panel: `Final array: <b>[${arr.join(',')}]</b><br>Rebuilt list: <b>${arr.join('→')}</b>`,
                statusText: `Done`,
                log: `final list = [${arr.join(',')}]`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderList(containerId, state, highlightStart, highlightEnd) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (state.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'null';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                let cls = 'node';
                if (highlightStart !== undefined && highlightEnd !== undefined && i >= highlightStart && i <= highlightEnd) cls += ' reversed';
                nodeEl.className = cls;
                nodeEl.innerText = state[i];
                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = '';
                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);
                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderArray(arr, highlightStart, highlightEnd) {
            const container = document.getElementById('array-content');
            container.innerHTML = '';
            for (let i = 0; i < arr.length; i++) {
                const el = document.createElement('div');
                el.className = 'array-element';
                if (highlightStart !== undefined && highlightEnd !== undefined && i >= highlightStart && i <= highlightEnd) {
                    el.style.borderColor = 'var(--accent-green)';
                    el.style.background = '#21262d';
                }
                el.innerText = arr[i];
                container.appendChild(el);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderList('original-container', step.listState || nodes, -1, -1);
            renderArray(step.arrayState || nodes, step.startIdx, step.endIdx);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-m').innerText = mValue;
            document.getElementById('val-n').innerText = nValue;
            document.getElementById('val-length').innerText = step.segmentLength !== undefined ? step.segmentLength : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
