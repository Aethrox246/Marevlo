<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge k Sorted Lists - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .lists-input { width: 420px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .lists-row { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .single-list { text-align: center; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 280px; min-height: 90px; position: relative; }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.current { border-color: var(--accent-orange); box-shadow: 0 0 14px rgba(227, 179, 65, 0.5); }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        /* COLLECTED + SORTED + RESULT */
        .array-box {
            background: var(--bg-surface);
            border: 2px solid var(--accent-purple);
            border-radius: 8px;
            padding: 12px;
            min-width: 320px;
            text-align: center;
        }
        .array-title { font-size: 13px; color: var(--accent-purple); margin-bottom: 8px; }
        .array-content { font-family: monospace; font-size: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">lists =</label>
        <input type="text" id="lists-input" class="lists-input" placeholder="[[1,4,5],[1,3,4],[2,6]]">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([[1,4,5],[1,3,4],[2,6]])">Ex 1</button>
        <button onclick="loadExample([[], [1,2,3], []])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Merge k Sorted Lists (Brute Force: Collect → Sort → Rebuild)</div>
        
        <div class="lists-row" id="input-lists-container"></div>

        <div style="display:flex; gap:40px; align-items:flex-start; width:100%; max-width:1100px; justify-content:center;">
            <div class="array-box">
                <div class="array-title">Collected Values</div>
                <div class="array-content" id="collected-array"></div>
            </div>
            
            <div class="array-box">
                <div class="array-title">Sorted Array</div>
                <div class="array-content" id="sorted-array"></div>
            </div>
            
            <div>
                <div class="ui-label" style="margin-bottom:6px">Merged List</div>
                <div class="list-wrapper" id="result-container"></div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">total elements</span>
            <span class="info-value" id="val-total" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">current list</span>
            <span class="info-value" id="val-list" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">sorted?</span>
            <span class="info-value" id="val-sorted" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">final merged list =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> current node</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-purple)"></span> being collected</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-green)"></span> sorted</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--border-main); opacity:0.4"></span> node</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let inputLists = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([[1,4,5],[1,3,4],[2,6]]); }

        function parseLists(str) {
            try {
                return JSON.parse(str.replace(/'/g, '"'));
            } catch(e) {
                return [];
            }
        }

        function loadExample(lists) {
            inputLists = lists.map(list => [...list]);
            document.getElementById('lists-input').value = JSON.stringify(lists);
            generateSteps();
            reset();
        }

        function loadCustom() {
            const str = document.getElementById('lists-input').value.trim();
            inputLists = parseLists(str);
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let allVals = [];

            steps.push({
                type: 'init',
                inputLists: JSON.parse(JSON.stringify(inputLists)),
                collected: [],
                sorted: [],
                result: [],
                panel: `Brute force: Collect all elements from ${inputLists.length} lists, sort, rebuild linked list`,
                statusText: `Starting`,
                log: `k = ${inputLists.length}`,
                logColor: 'var(--text-dim)'
            });

            // Collect phase
            for (let listIdx = 0; listIdx < inputLists.length; listIdx++) {
                let list = inputLists[listIdx];
                if (list.length === 0) continue;
                steps.push({
                    type: 'collect-list',
                    inputLists: JSON.parse(JSON.stringify(inputLists)),
                    collected: [...allVals],
                    sorted: [],
                    result: [],
                    listIdx: listIdx,
                    panel: `Collecting from list <b>${listIdx}</b>: [${list.join(',')}]`,
                    statusText: `Collecting list ${listIdx}`,
                    log: `list ${listIdx} → added ${list.length} values`,
                    logColor: 'var(--accent-purple)'
                });
                allVals = allVals.concat(list);
            }

            steps.push({
                type: 'collected',
                inputLists: JSON.parse(JSON.stringify(inputLists)),
                collected: [...allVals],
                sorted: [],
                result: [],
                panel: `Collected <b>${allVals.length}</b> elements: [${allVals.join(',')}]`,
                statusText: `Collected`,
                log: `all_vals = [${allVals.join(',')}]`,
                logColor: 'var(--accent-green)'
            });

            // Sort phase
            let sortedVals = [...allVals].sort((a,b) => a - b);
            steps.push({
                type: 'sort',
                inputLists: JSON.parse(JSON.stringify(inputLists)),
                collected: [...allVals],
                sorted: [...sortedVals],
                result: [],
                panel: `Sorted array: <b>[${sortedVals.join(',')}]</b>`,
                statusText: `Sorted`,
                log: `sorted = [${sortedVals.join(',')}]`,
                logColor: 'var(--accent-blue)'
            });

            // Rebuild phase
            let result = [];
            steps.push({
                type: 'rebuild-start',
                inputLists: JSON.parse(JSON.stringify(inputLists)),
                collected: [...allVals],
                sorted: [...sortedVals],
                result: [],
                panel: `Rebuilding linked list...`,
                statusText: `Rebuilding`,
                log: `building result`,
                logColor: 'var(--accent-green)'
            });

            for (let i = 0; i < sortedVals.length; i++) {
                result.push(sortedVals[i]);
                steps.push({
                    type: 'add-node',
                    inputLists: JSON.parse(JSON.stringify(inputLists)),
                    collected: [...allVals],
                    sorted: [...sortedVals],
                    result: [...result],
                    panel: `Add node <b>${sortedVals[i]}</b>`,
                    statusText: `Adding`,
                    log: `added ${sortedVals[i]}`,
                    logColor: 'var(--accent-green)'
                });
            }

            steps.push({
                type: 'final',
                inputLists: JSON.parse(JSON.stringify(inputLists)),
                collected: [...allVals],
                sorted: [...sortedVals],
                result: [...result],
                complete: true,
                finalStr: result.length ? result.join('→') : 'null',
                panel: `Final merged list: <b>${result.join('→')}</b>`,
                statusText: `Done`,
                log: `merged = [${result.join(',')}]`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderLists(lists) {
            const container = document.getElementById('input-lists-container');
            container.innerHTML = '';
            lists.forEach((list, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'single-list';
                const label = document.createElement('div');
                label.style.fontSize = '12px';
                label.style.color = 'var(--accent-purple)';
                label.style.marginBottom = '4px';
                label.innerText = `List ${idx}`;
                wrapper.appendChild(label);
                const listWrapper = document.createElement('div');
                listWrapper.className = 'list-wrapper';
                if (list.length === 0) {
                    const empty = document.createElement('div');
                    empty.style.color = 'var(--text-dim)';
                    empty.style.fontFamily = 'monospace';
                    empty.innerText = '[]';
                    listWrapper.appendChild(empty);
                } else {
                    for (let i = 0; i < list.length; i++) {
                        const unit = document.createElement('div');
                        unit.className = 'node-unit';
                        const nodeEl = document.createElement('div');
                        nodeEl.className = 'node';
                        nodeEl.innerText = list[i];
                        const idxLabel = document.createElement('div');
                        idxLabel.className = 'node-index';
                        idxLabel.innerText = '';
                        unit.append(nodeEl, idxLabel);
                        listWrapper.appendChild(unit);
                        if (i < list.length - 1) {
                            const arrow = document.createElement('div');
                            arrow.className = 'arrow';
                            arrow.innerText = '→';
                            listWrapper.appendChild(arrow);
                        }
                    }
                }
                wrapper.appendChild(listWrapper);
                container.appendChild(wrapper);
            });
        }

        function renderArray(containerId, arr) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (arr.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontStyle = 'italic';
                empty.innerText = 'empty';
                container.appendChild(empty);
                return;
            }
            arr.forEach(val => {
                const el = document.createElement('div');
                el.style.background = '#21262d';
                el.style.border = '1px solid var(--border-main)';
                el.style.padding = '4px 10px';
                el.style.borderRadius = '4px';
                el.style.fontFamily = 'monospace';
                el.innerText = val;
                container.appendChild(el);
            });
        }

        function renderResult(result) {
            const container = document.getElementById('result-container');
            container.innerHTML = '';
            if (result.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'null';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < result.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                nodeEl.className = 'node';
                nodeEl.innerText = result[i];
                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = '';
                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);
                if (i < result.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderLists(step.inputLists);
            renderArray('collected-array', step.collected || []);
            renderArray('sorted-array', step.sorted || []);
            renderResult(step.result || []);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-total').innerText = (step.collected || []).length;
            document.getElementById('val-list').innerText = step.listIdx !== undefined ? step.listIdx : '—';
            document.getElementById('val-sorted').innerText = step.sorted && step.sorted.length ? 'YES' : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
