<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Nth Node From End - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .head-input { width: 220px; }
        .n-input { width: 80px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: LINKED LIST VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.current { border-color: var(--accent-purple); box-shadow: 0 0 14px rgba(163, 113, 247, 0.5); }
        .node.pred { border-color: var(--accent-orange); }
        .node.to-remove { border-color: var(--accent-red); box-shadow: 0 0 14px rgba(248, 81, 73, 0.6); animation: flash 800ms infinite alternate; }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        @keyframes flash { from { opacity: 1; } to { opacity: 0.4; } }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">head =</label>
        <input type="text" id="head-input" class="head-input" placeholder="1->2->3->4->5">
        <label class="ui-label">n =</label>
        <input type="text" id="n-input" class="n-input" value="2">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([1,2,3,4,5], 2)">Ex 1</button>
        <button onclick="loadExample([1], 1)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Remove Nth Node From End (Two-Pass Length Calculation Approach):</div>
        <div class="list-wrapper" id="list-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">length</span>
            <span class="info-value" id="val-length" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">pos (target)</span>
            <span class="info-value" id="val-pos" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">pred</span>
            <span class="info-value" id="val-pred" style="color: var(--accent-purple);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">result =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-green)"></span> Length pass</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-purple)"></span> Second pass (pred)</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-red)"></span> Node to remove</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--border-main); opacity:0.4"></span> Node</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nodes = [];
        let nValue = 2;
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([1,2,3,4,5], 2); }

        function parseHead(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(arr, n) {
            nodes = [...arr];
            nValue = n;
            document.getElementById('head-input').value = nodes.length ? nodes.join('->') : 'null';
            document.getElementById('n-input').value = n;
            generateSteps();
            reset();
        }

        function loadCustom() {
            const headStr = document.getElementById('head-input').value.trim();
            const parsedNodes = parseHead(headStr);
            const n = parseInt(document.getElementById('n-input').value) || 1;
            nodes = parsedNodes;
            nValue = n;
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const originalNodes = [...nodes];
            const len = originalNodes.length;

            if (len === 0 || nValue < 1 || nValue > len) {
                steps.push({
                    type: 'init',
                    current: null,
                    length: 0,
                    pos: null,
                    pred: null,
                    removeIdx: null,
                    listState: [...originalNodes],
                    panel: `Invalid input or empty list.<br>No node removed.`,
                    statusText: `No change`,
                    log: `n out of range`,
                    logColor: 'var(--accent-red)',
                    complete: true,
                    finalStr: originalNodes.length ? originalNodes.join('→') : 'null'
                });
                return;
            }

            // STEP 0: INIT
            steps.push({
                type: 'init',
                current: null,
                length: 0,
                pos: null,
                pred: null,
                removeIdx: null,
                listState: [...originalNodes],
                panel: `Start Two-Pass Approach.<br>First pass: compute length.`,
                statusText: `First pass started`,
                log: `length = 0`,
                logColor: 'var(--text-dim)'
            });

            // FIRST PASS: compute length
            let length = 0;
            for (let i = 0; i < len; i++) {
                length++;
                steps.push({
                    type: 'length-pass',
                    current: i,
                    length: length,
                    pos: null,
                    pred: null,
                    removeIdx: null,
                    listState: [...originalNodes],
                    panel: `First pass: visited node <b>${originalNodes[i]}</b><br>length now = ${length}`,
                    statusText: `Counting nodes`,
                    log: `node ${originalNodes[i]} → length = ${length}`,
                    logColor: 'var(--accent-green)'
                });
            }

            // Calculate pos
            const pos = length - nValue; // 0-based index of target node
            steps.push({
                type: 'calc-pos',
                current: null,
                length: length,
                pos: pos,
                pred: null,
                removeIdx: null,
                listState: [...originalNodes],
                panel: `Length = ${length}<br>Target position (0-based) = ${pos}`,
                statusText: `Position calculated`,
                log: `pos = length - n = ${pos}`,
                logColor: 'var(--accent-orange)'
            });

            // If pos == 0 → remove head
            if (pos === 0) {
                steps.push({
                    type: 'remove-head',
                    current: null,
                    length: length,
                    pos: pos,
                    pred: null,
                    removeIdx: 0,
                    listState: [...originalNodes],
                    panel: `pos = 0 → removing head (node <b>${originalNodes[0]}</b>)`,
                    statusText: `Head removal`,
                    log: `remove head`,
                    logColor: 'var(--accent-red)'
                });
                const resultNodes = originalNodes.slice(1);
                steps.push({
                    type: 'final',
                    current: null,
                    length: length,
                    pos: pos,
                    pred: null,
                    removeIdx: null,
                    listState: resultNodes,
                    complete: true,
                    finalStr: resultNodes.length ? resultNodes.join('→') : 'null',
                    panel: `Head removed.<br>New list: <b>${resultNodes.length ? resultNodes.join('→') : 'null'}</b>`,
                    statusText: `Done`,
                    log: `Final result`,
                    logColor: 'var(--accent-green)',
                    bold: true
                });
                return;
            }

            // SECOND PASS: find predecessor at position (pos - 1)
            let predIdx = 0;
            steps.push({
                type: 'second-pass-start',
                current: 0,
                length: length,
                pos: pos,
                pred: null,
                removeIdx: null,
                listState: [...originalNodes],
                panel: `Second pass: find predecessor at index ${pos - 1}`,
                statusText: `Second pass`,
                log: `start second pass`,
                logColor: 'var(--text-dim)'
            });

            for (let i = 0; i < pos - 1; i++) {
                predIdx = i + 1;
                steps.push({
                    type: 'second-pass',
                    current: predIdx,
                    length: length,
                    pos: pos,
                    pred: null,
                    removeIdx: null,
                    listState: [...originalNodes],
                    panel: `Second pass: moved to node <b>${originalNodes[predIdx]}</b>`,
                    statusText: `Finding predecessor`,
                    log: `pred candidate → ${originalNodes[predIdx]}`,
                    logColor: 'var(--accent-purple)'
                });
            }

            // Now predIdx is the predecessor
            const removeIdx = pos;
            steps.push({
                type: 'remove',
                current: predIdx,
                length: length,
                pos: pos,
                pred: predIdx,
                removeIdx: removeIdx,
                listState: [...originalNodes],
                panel: `Predecessor found at index <b>${predIdx}</b> (node <b>${originalNodes[predIdx]}</b>)<br>Remove node at <b>${removeIdx}</b> (value <b>${originalNodes[removeIdx]}</b>)`,
                statusText: `Removing node`,
                log: `remove node(${originalNodes[removeIdx]})`,
                logColor: 'var(--accent-red)'
            });

            // Build final result
            const resultNodes = [...originalNodes];
            resultNodes.splice(removeIdx, 1);

            steps.push({
                type: 'final',
                current: null,
                length: length,
                pos: pos,
                pred: null,
                removeIdx: null,
                listState: resultNodes,
                complete: true,
                finalStr: resultNodes.length ? resultNodes.join('→') : 'null',
                panel: `Node removed successfully.<br>New list: <b>${resultNodes.join('→')}</b>`,
                statusText: `Done`,
                log: `Final result`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderList(state, currentIdx, predIdx, removeIdx) {
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';

                const nodeEl = document.createElement('div');
                let cls = 'node';
                if (i === currentIdx) cls += ' current';
                if (i === predIdx) cls += ' pred';
                if (i === removeIdx) cls += ' to-remove';
                nodeEl.className = cls;
                nodeEl.innerText = state[i];

                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = i === 0 ? 'head' : '';

                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);

                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderList(step.listState, step.current, step.pred, step.removeIdx);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-length').innerText = step.length !== undefined ? step.length : '—';
            document.getElementById('val-pos').innerText = step.pos !== null ? step.pos : '—';
            document.getElementById('val-pred').innerText = step.pred !== null ? step.pred : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
