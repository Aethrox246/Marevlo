<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split circular list - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .head-input { width: 220px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; background: var(--bg-surface); border-radius: 8px; padding: 12px; border: 2px solid var(--accent-purple); }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.current { border-color: var(--accent-orange); box-shadow: 0 0 14px rgba(227, 179, 65, 0.5); }
        .node.target { border-color: var(--accent-green); box-shadow: 0 0 14px rgba(63, 185, 80, 0.5); }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }
        .circular-note { font-size: 11px; color: var(--accent-purple); margin-top: 4px; font-family: monospace; }

        /* PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
        .result-half { text-align: center; }
        .result-half .ui-label { font-size: 12px; color: var(--text-dim); }

        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">circular list =</label>
        <input type="text" id="head-input" class="head-input" placeholder="1->2->3->4->5">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([1,2,3,4,5])">Ex 1</button>
        <button onclick="loadExample([10,20,30,40])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Split circular list into two halves (Brute Force Count + Split)</div>
        
        <div>
            <div class="ui-label" style="margin-bottom:6px">Original Circular List</div>
            <div class="list-wrapper" id="current-container"></div>
        </div>

        <div class="result-display">
            <div class="result-half">
                <div class="ui-label">First half</div>
                <div class="list-wrapper" id="first-container" style="border-color: var(--accent-green); min-height:70px;"></div>
            </div>
            <div class="result-half">
                <div class="ui-label">Second half</div>
                <div class="list-wrapper" id="second-container" style="border-color: var(--accent-green); min-height:70px;"></div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">total nodes</span>
            <span class="info-value" id="val-length" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">split at</span>
            <span class="info-value" id="val-split" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">current node</span>
            <span class="info-value" id="val-current" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> counting</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-green)"></span> split point</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nodes = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([1,2,3,4,5]); }

        function parseList(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(arr) {
            nodes = [...arr];
            document.getElementById('head-input').value = nodes.length ? nodes.join('->') : 'null';
            generateSteps();
            reset();
        }

        function loadCustom() {
            const str = document.getElementById('head-input').value.trim();
            nodes = parseList(str);
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let currentList = [...nodes];

            steps.push({
                type: 'init',
                listState: [...currentList],
                panel: `Brute Force: Count nodes (circular) → Split into two halves`,
                statusText: `Start`,
                log: `circular list = [${nodes.join(',')}]`,
                logColor: 'var(--text-dim)'
            });

            // Pass 1: Count nodes in circular list
            let length = 0;
            for (let i = 0; i < currentList.length; i++) {
                length++;
                steps.push({
                    type: 'count',
                    listState: [...currentList],
                    currentIdx: i,
                    panel: `Counting nodes... current = <b>${length}</b>`,
                    statusText: `Count`,
                    log: `node ${currentList[i]}, length=${length}`,
                    logColor: 'var(--accent-orange)'
                });
            }

            steps.push({
                type: 'length',
                listState: [...currentList],
                length: length,
                panel: `Total nodes = <b>${length}</b>`,
                statusText: `Length`,
                log: `length = ${length}`,
                logColor: 'var(--accent-purple)'
            });

            // Calculate split
            let splitIdx = Math.ceil(length / 2);
            steps.push({
                type: 'calculate',
                listState: [...currentList],
                length: length,
                splitIdx: splitIdx,
                panel: `Split index = <b>ceil(${length}/2) = ${splitIdx}</b>`,
                statusText: `Calculate`,
                log: `first half size = ${splitIdx}`,
                logColor: 'var(--accent-green)'
            });

            // Traverse to split point
            for (let i = 0; i < splitIdx - 1; i++) {
                steps.push({
                    type: 'traverse',
                    listState: [...currentList],
                    currentIdx: i,
                    panel: `Finding split point... position <b>${i+1}</b>`,
                    statusText: `Traverse`,
                    log: `moved to pos ${i}`,
                    logColor: 'var(--accent-blue)'
                });
            }

            // Final split
            let firstHalf = currentList.slice(0, splitIdx);
            let secondHalf = currentList.slice(splitIdx);

            steps.push({
                type: 'final',
                listState: [...currentList],
                firstHalf: firstHalf,
                secondHalf: secondHalf,
                complete: true,
                panel: `Split complete!<br>First half: <b>[${firstHalf.join('→')}]</b><br>Second half: <b>[${secondHalf.join('→')}]</b>`,
                statusText: `Done`,
                log: `first: [${firstHalf.join(',')}], second: [${secondHalf.join(',')}]`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderList(containerId, state, highlightIdx = -1) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (state.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'null';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                nodeEl.className = 'node';
                if (i === highlightIdx) nodeEl.classList.add('current');
                nodeEl.innerText = state[i];
                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = '';
                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);
                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            let highlight = -1;
            if (step.type === 'count') highlight = step.currentIdx || 0;
            if (step.type === 'traverse') highlight = step.currentIdx || 0;

            renderList('current-container', step.listState || nodes, highlight);

            // Render result halves when complete
            if (step.complete) {
                renderList('first-container', step.firstHalf || []);
                renderList('second-container', step.secondHalf || []);
            } else {
                renderList('first-container', []);
                renderList('second-container', []);
            }

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-length').innerText = step.length !== undefined ? step.length : '—';
            document.getElementById('val-split').innerText = step.splitIdx !== undefined ? step.splitIdx : '—';
            document.getElementById('val-current').innerText = step.type === 'traverse' || step.type === 'count' ? (step.listState[step.currentIdx] || '—') : '—';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
