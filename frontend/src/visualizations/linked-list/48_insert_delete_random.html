<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Delete Random - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .array-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 110px; position: relative; background: var(--bg-surface); border-radius: 8px; padding: 12px; border: 2px solid var(--accent-purple); }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 78px; height: 78px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 13px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative; text-align: center; line-height: 1.2;
        }
        .node.current { border-color: var(--accent-orange); box-shadow: 0 0 14px rgba(227, 179, 65, 0.5); }
        .node.deleted { border-color: var(--accent-red); opacity: 0.4; }
        .node.kept { border-color: var(--accent-green); box-shadow: 0 0 14px rgba(63, 185, 80, 0.5); }
        .node-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

        .hashmap-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 110px; position: relative; background: var(--bg-surface); border-radius: 8px; padding: 12px; border: 2px solid var(--accent-blue); }
        
        .hash-node { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .hash-entry {
            min-width: 78px; height: 78px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 13px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative; text-align: center; line-height: 1.2;
        }

        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        /* PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <button onclick="loadExample(1)">Ex 1</button>
        <button onclick="loadExample(2)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Insert Delete Random (Array + HashMap O(1))</div>
        
        <div>
            <div class="ui-label" style="margin-bottom:6px">Array State</div>
            <div class="array-wrapper" id="array-container"></div>
        </div>

        <div>
            <div class="ui-label" style="margin-bottom:6px">HashMap (val → index)</div>
            <div class="hashmap-wrapper" id="hashmap-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">operation</span>
            <span class="info-value" id="val-op" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">array length</span>
            <span class="info-value" id="val-len" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">random index</span>
            <span class="info-value" id="val-random" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">return value =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> current operation</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-green)"></span> updated / kept</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let array = [];
        let hashmap = {};
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        const example1 = [
            {op: 'insert', val:1},
            {op: 'insert', val:2},
            {op: 'remove', val:1},
            {op: 'getRandom'}
        ];

        const example2 = [
            {op: 'insert', val:1},
            {op: 'insert', val:1},
            {op: 'remove', val:2},
            {op: 'getRandom'}
        ];

        function init() { loadExample(1); }

        function loadExample(exId) {
            array = [];
            hashmap = {};
            const ops = exId === 1 ? example1 : example2;
            generateSteps(ops);
            reset();
        }

        function generateSteps(ops) {
            steps = [];
            array = [];
            hashmap = {};

            steps.push({
                type: 'init',
                arrayState: [],
                hashmapState: {},
                panel: `RandomizedSet (Array + HashMap O(1))`,
                statusText: `Initialized`,
                log: `array = [], hashmap = {}`,
                logColor: 'var(--text-dim)'
            });

            for (let op of ops) {
                let result = null;

                if (op.op === 'insert') {
                    if (!(op.val in hashmap)) {
                        array.push(op.val);
                        hashmap[op.val] = array.length - 1;
                        result = true;
                    } else {
                        result = false;
                    }
                } else if (op.op === 'remove') {
                    if (op.val in hashmap) {
                        let idx = hashmap[op.val];
                        let lastVal = array[array.length - 1];
                        array[idx] = lastVal;
                        hashmap[lastVal] = idx;
                        array.pop();
                        delete hashmap[op.val];
                        result = true;
                    } else {
                        result = false;
                    }
                } else if (op.op === 'getRandom') {
                    if (array.length === 0) {
                        result = 'error';
                    } else {
                        let idx = Math.floor(Math.random() * array.length);
                        result = array[idx];
                    }
                }

                steps.push({
                    type: op.op,
                    arrayState: [...array],
                    hashmapState: {...hashmap},
                    panel: `${op.op.toUpperCase()}(${op.val !== undefined ? op.val : ''}) → ${result}`,
                    statusText: op.op.toUpperCase(),
                    log: `${op.op}(${op.val !== undefined ? op.val : ''}) = ${result}`,
                    logColor: op.op === 'getRandom' ? 'var(--accent-blue)' : (result === true ? 'var(--accent-green)' : 'var(--accent-red)')
                });
            }

            steps.push({
                type: 'final',
                arrayState: [...array],
                hashmapState: {...hashmap},
                complete: true,
                finalStr: array.join(', '),
                panel: `Final array: <b>[${array.join(', ')}]</b>`,
                statusText: `Done`,
                log: `final array`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderArray(state) {
            const container = document.getElementById('array-container');
            container.innerHTML = '';
            if (state.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'empty';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                nodeEl.className = 'node';
                nodeEl.innerHTML = `<div>${state[i]}</div><div style="font-size:9px;color:var(--text-dim)">idx:${i}</div>`;
                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-label';
                idxLabel.innerText = '';
                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);
                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderHashmap(state) {
            const container = document.getElementById('hashmap-container');
            container.innerHTML = '';
            if (Object.keys(state).length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'empty';
                container.appendChild(empty);
                return;
            }
            Object.keys(state).forEach(key => {
                const unit = document.createElement('div');
                unit.className = 'hash-node';
                const entryEl = document.createElement('div');
                entryEl.className = 'hash-entry';
                entryEl.innerHTML = `<div>${key} → ${state[key]}</div>`;
                unit.appendChild(entryEl);
                container.appendChild(unit);
            });
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderArray(step.arrayState || []);
            renderHashmap(step.hashmapState || {});

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-op').innerText = step.type || '—';
            document.getElementById('val-len').innerText = step.arrayState ? step.arrayState.length : 0;
            document.getElementById('val-random').innerText = step.type === 'getRandom' ? step.log.split('=')[1] || '—' : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
