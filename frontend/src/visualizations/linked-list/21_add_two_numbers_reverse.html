<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Two Numbers (reverse) - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .head-input { width: 220px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.curr { border-color: var(--accent-purple); box-shadow: 0 0 14px rgba(163, 113, 247, 0.5); }
        .node.from-l1 { border-color: var(--accent-orange); }
        .node.from-l2 { border-color: var(--accent-blue); }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 20px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">l1 =</label>
        <input type="text" id="l1-input" class="head-input" placeholder="2->4->3">
        <label class="ui-label">l2 =</label>
        <input type="text" id="l2-input" class="head-input" placeholder="5->6->4">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([2,4,3], [5,6,4])">Ex 1</button>
        <button onclick="loadExample([0], [0])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Add Two Numbers (reverse) — Brute Force via Integer Conversion:</div>
        <div style="display:flex; gap:40px; align-items:center; width:100%; max-width:900px; justify-content:center;">
            <div>
                <div class="ui-label" style="margin-bottom:6px">l1 (reversed digits)</div>
                <div class="list-wrapper" id="list1-container"></div>
            </div>
            <div style="font-size:28px; color:var(--accent-blue)">+</div>
            <div>
                <div class="ui-label" style="margin-bottom:6px">l2 (reversed digits)</div>
                <div class="list-wrapper" id="list2-container"></div>
            </div>
            <div style="font-size:28px; color:var(--accent-green)">→</div>
            <div>
                <div class="ui-label" style="margin-bottom:6px">result (reversed digits)</div>
                <div class="list-wrapper" id="result-container"></div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">num1</span>
            <span class="info-value" id="val-num1" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">num2</span>
            <span class="info-value" id="val-num2" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">sum</span>
            <span class="info-value" id="val-sum" style="color: var(--accent-purple);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">final sum list</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> l1 conversion</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-blue)"></span> l2 conversion</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-purple)"></span> sum → result</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--border-main); opacity:0.4"></span> Node</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let l1Nodes = [];
        let l2Nodes = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([2,4,3], [5,6,4]); }

        function parseList(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(arr1, arr2) {
            l1Nodes = [...arr1];
            l2Nodes = [...arr2];
            document.getElementById('l1-input').value = l1Nodes.length ? l1Nodes.join('->') : 'null';
            document.getElementById('l2-input').value = l2Nodes.length ? l2Nodes.join('->') : 'null';
            generateSteps();
            reset();
        }

        function loadCustom() {
            const l1Str = document.getElementById('l1-input').value.trim();
            const l2Str = document.getElementById('l2-input').value.trim();
            l1Nodes = parseList(l1Str);
            l2Nodes = parseList(l2Str);
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const m = l1Nodes.length;
            const n = l2Nodes.length;

            // STEP 0: INIT
            steps.push({
                type: 'init',
                num1: 0,
                num2: 0,
                sum: 0,
                l1State: [...l1Nodes],
                l2State: [...l2Nodes],
                resultState: [],
                panel: `Start brute-force conversion.<br>Convert l1 and l2 to integers using reversed digits.`,
                statusText: `Conversion started`,
                log: `num1 = 0, num2 = 0`,
                logColor: 'var(--text-dim)'
            });

            // Convert l1 to num1
            let num1 = 0;
            let mult = 1;
            for (let i = 0; i < m; i++) {
                num1 += l1Nodes[i] * mult;
                steps.push({
                    type: 'convert-l1',
                    num1: num1,
                    num2: 0,
                    sum: 0,
                    l1State: [...l1Nodes],
                    l2State: [...l2Nodes],
                    resultState: [],
                    panel: `l1 node <b>${l1Nodes[i]}</b> × ${mult} added to num1`,
                    statusText: `Converting l1`,
                    log: `num1 += ${l1Nodes[i]} × ${mult} → ${num1}`,
                    logColor: 'var(--accent-orange)'
                });
                mult *= 10;
            }

            // Convert l2 to num2
            let num2 = 0;
            mult = 1;
            for (let i = 0; i < n; i++) {
                num2 += l2Nodes[i] * mult;
                steps.push({
                    type: 'convert-l2',
                    num1: num1,
                    num2: num2,
                    sum: 0,
                    l1State: [...l1Nodes],
                    l2State: [...l2Nodes],
                    resultState: [],
                    panel: `l2 node <b>${l2Nodes[i]}</b> × ${mult} added to num2`,
                    statusText: `Converting l2`,
                    log: `num2 += ${l2Nodes[i]} × ${mult} → ${num2}`,
                    logColor: 'var(--accent-blue)'
                });
                mult *= 10;
            }

            // Add
            const total = num1 + num2;
            steps.push({
                type: 'add',
                num1: num1,
                num2: num2,
                sum: total,
                l1State: [...l1Nodes],
                l2State: [...l2Nodes],
                resultState: [],
                panel: `num1 = ${num1}<br>num2 = ${num2}<br>sum = ${total}`,
                statusText: `Adding integers`,
                log: `total = ${num1} + ${num2} = ${total}`,
                logColor: 'var(--accent-purple)'
            });

            // Convert total back to reversed list
            let resultNodes = [];
            let temp = total;
            if (temp === 0) {
                resultNodes = [0];
                steps.push({
                    type: 'build-result',
                    num1: num1,
                    num2: num2,
                    sum: total,
                    l1State: [...l1Nodes],
                    l2State: [...l2Nodes],
                    resultState: [0],
                    panel: `total = 0 → single node 0`,
                    statusText: `Building result`,
                    log: `result = [0]`,
                    logColor: 'var(--accent-green)'
                });
            } else {
                while (temp > 0) {
                    const digit = temp % 10;
                    resultNodes.push(digit);
                    steps.push({
                        type: 'build-result',
                        num1: num1,
                        num2: num2,
                        sum: total,
                        l1State: [...l1Nodes],
                        l2State: [...l2Nodes],
                        resultState: [...resultNodes],
                        panel: `digit = ${digit} (from ${temp} % 10)<br>remaining = ${Math.floor(temp / 10)}`,
                        statusText: `Building result`,
                        log: `digit ${digit} appended`,
                        logColor: 'var(--accent-green)'
                    });
                    temp = Math.floor(temp / 10);
                }
            }

            // FINAL
            steps.push({
                type: 'final',
                num1: num1,
                num2: num2,
                sum: total,
                l1State: [...l1Nodes],
                l2State: [...l2Nodes],
                resultState: [...resultNodes],
                complete: true,
                finalStr: resultNodes.join('→'),
                panel: `Conversion complete.<br>Result list: <b>${resultNodes.join('→')}</b>`,
                statusText: `Done`,
                log: `Final result: ${resultNodes.join('→')}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderList(containerId, state, highlightIdx) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (state.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'null';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                let cls = 'node';
                if (i === highlightIdx) cls += ' curr';
                nodeEl.className = cls;
                nodeEl.innerText = state[i];
                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = i === 0 ? 'head' : '';
                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);
                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderList('list1-container', step.l1State, step.type === 'convert-l1' ? step.l1State.length - 1 : null);
            renderList('list2-container', step.l2State, step.type === 'convert-l2' ? step.l2State.length - 1 : null);
            renderList('result-container', step.resultState, step.type === 'build-result' ? step.resultState.length - 1 : null);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-num1').innerText = step.num1 !== undefined ? step.num1 : '—';
            document.getElementById('val-num2').innerText = step.num2 !== undefined ? step.num2 : '—';
            document.getElementById('val-sum').innerText = step.sum !== undefined ? step.sum : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
