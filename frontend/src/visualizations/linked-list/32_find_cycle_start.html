<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Cycle Start - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .head-input { width: 360px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.current { border-color: var(--accent-orange); box-shadow: 0 0 14px rgba(227, 179, 65, 0.5); }
        .node.duplicate { border-color: var(--accent-red); box-shadow: 0 0 14px rgba(248, 81, 73, 0.8); animation: flash 600ms ease; }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }
        .cycle-arrow { color: var(--accent-red); font-size: 18px; }

        @keyframes flash { 0%{opacity:1} 50%{opacity:0.4} 100%{opacity:1} }

        /* VISITED SET */
        .visited-set {
            background: var(--bg-surface);
            border: 2px solid var(--accent-purple);
            border-radius: 8px;
            padding: 12px;
            min-width: 220px;
            text-align: center;
        }
        .set-title { font-size: 13px; color: var(--accent-purple); margin-bottom: 8px; }
        .set-content { font-family: monospace; font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">list =</label>
        <input type="text" id="head-input" class="head-input" placeholder="1->2->3->4->5->3">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([1,2,3,4,5,3], 2)">Ex 1 (cycle)</button>
        <button onclick="loadExample([1,2,3,4,5], null)">Ex 2 (no cycle)</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Find Cycle Start (Brute Force HashSet Approach)</div>
        
        <div style="display:flex; gap:40px; align-items:center; width:100%; max-width:1000px; justify-content:center;">
            <div>
                <div class="ui-label" style="margin-bottom:6px">Linked List</div>
                <div class="list-wrapper" id="list-container"></div>
            </div>
            
            <div class="visited-set">
                <div class="set-title">Visited Set</div>
                <div class="set-content" id="visited-set"></div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">current node</span>
            <span class="info-value" id="val-current" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">set size</span>
            <span class="info-value" id="val-setsize" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">duplicate found?</span>
            <span class="info-value" id="val-duplicate" style="color: var(--accent-red);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">cycle start =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> current node</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-red)"></span> cycle start</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-purple)"></span> in visited set</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--border-main); opacity:0.4"></span> node</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nodes = [];
        let cycleIndex = null; // index where cycle points back (for demo)
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([1,2,3,4,5,3], 2); }

        function parseList(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(arr, cycleAt) {
            nodes = [...arr];
            cycleIndex = cycleAt;
            document.getElementById('head-input').value = nodes.length ? nodes.join('->') : 'null';
            generateSteps();
            reset();
        }

        function loadCustom() {
            const str = document.getElementById('head-input').value.trim();
            nodes = parseList(str);
            cycleIndex = null; // Custom has no cycle
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let visited = new Set();
            let hasCycle = false;
            let cycleStartValue = null;

            steps.push({
                type: 'init',
                listState: [...nodes],
                visited: [],
                currentIdx: -1,
                panel: `Brute force HashSet approach:<br>Traverse list and store visited nodes.<br>First duplicate = cycle start.`,
                statusText: `Starting`,
                log: `List length = ${nodes.length}`,
                logColor: 'var(--text-dim)'
            });

            let i = 0;
            while (i < nodes.length) {
                let val = nodes[i];

                if (visited.has(val)) {
                    hasCycle = true;
                    cycleStartValue = val;
                    steps.push({
                        type: 'duplicate',
                        listState: [...nodes],
                        visited: Array.from(visited),
                        currentIdx: i,
                        panel: `Duplicate found: <b>${val}</b> → Cycle start!`,
                        statusText: `Cycle detected`,
                        log: `duplicate ${val} - cycle start`,
                        logColor: 'var(--accent-red)'
                    });
                    break;
                }

                visited.add(val);

                steps.push({
                    type: 'visit',
                    listState: [...nodes],
                    visited: Array.from(visited),
                    currentIdx: i,
                    panel: `Visit node <b>${val}</b> → Add to set`,
                    statusText: `Visiting`,
                    log: `added ${val}`,
                    logColor: 'var(--accent-green)'
                });

                i++;
            }

            if (!hasCycle) {
                steps.push({
                    type: 'no-cycle',
                    listState: [...nodes],
                    visited: Array.from(visited),
                    currentIdx: -1,
                    panel: `Reached end of list without duplicates → <b>No cycle</b>`,
                    statusText: `No cycle`,
                    log: `no cycle found`,
                    logColor: 'var(--accent-blue)'
                });
            }

            steps.push({
                type: 'final',
                listState: [...nodes],
                visited: Array.from(visited),
                currentIdx: -1,
                complete: true,
                finalStr: hasCycle ? cycleStartValue : 'null',
                panel: hasCycle ? `Cycle starts at node <b>${cycleStartValue}</b>` : `<b>No cycle</b>`,
                statusText: `Done`,
                log: hasCycle ? `cycle start = ${cycleStartValue}` : `no cycle`,
                logColor: hasCycle ? 'var(--accent-red)' : 'var(--accent-blue)',
                bold: true
            });
        }

        function renderList(state, currentIdx) {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            if (state.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'null';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                let cls = 'node';
                if (i === currentIdx) cls += ' current';
                nodeEl.className = cls;
                nodeEl.innerText = state[i];
                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = i === 0 ? 'head' : '';
                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);
                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
            if (cycleIndex !== null && cycleIndex < state.length) {
                const cycleArrow = document.createElement('div');
                cycleArrow.className = 'cycle-arrow';
                cycleArrow.innerText = '↩';
                container.appendChild(cycleArrow);
            }
        }

        function renderVisitedSet(visited) {
            const container = document.getElementById('visited-set');
            container.innerHTML = '';
            visited.forEach(val => {
                const el = document.createElement('div');
                el.style.background = 'var(--accent-purple)';
                el.style.color = 'white';
                el.style.padding = '2px 8px';
                el.style.borderRadius = '12px';
                el.style.fontSize = '13px';
                el.innerText = val;
                container.appendChild(el);
            });
            if (visited.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontStyle = 'italic';
                empty.innerText = 'empty';
                container.appendChild(empty);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderList(step.listState, step.currentIdx);
            renderVisitedSet(step.visited || []);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-current').innerText = step.currentIdx !== -1 ? step.listState[step.currentIdx] : '—';
            document.getElementById('val-setsize').innerText = (step.visited || []).length;
            document.getElementById('val-duplicate').innerText = step.type === 'duplicate' ? 'YES' : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
