<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy with Random Pointer - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .head-input { width: 280px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: VISUAL (original + copy side by side) */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.curr { border-color: var(--accent-purple); box-shadow: 0 0 14px rgba(163, 113, 247, 0.5); }
        .node.from-orig { border-color: var(--accent-orange); }
        .node.random-target { border-color: var(--accent-red); }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">original list =</label>
        <input type="text" id="head-input" class="head-input" placeholder="1->2->3">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([1,2,3])">Ex 1</button>
        <button onclick="loadExample([5])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Copy Linked List with Random Pointers (Brute Force Position Matching):</div>
        <div style="display:flex; gap:40px; align-items:center; width:100%; max-width:900px; justify-content:center;">
            <div>
                <div class="ui-label" style="margin-bottom:6px">Original List</div>
                <div class="list-wrapper" id="original-container"></div>
            </div>
            <div style="font-size:28px; color:var(--accent-green)">→</div>
            <div>
                <div class="ui-label" style="margin-bottom:6px">New Copy List</div>
                <div class="list-wrapper" id="copy-container"></div>
            </div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">orig position</span>
            <span class="info-value" id="val-orig-pos" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">copy position</span>
            <span class="info-value" id="val-copy-pos" style="color: var(--accent-blue);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">random target</span>
            <span class="info-value" id="val-random" style="color: var(--accent-purple);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">copied list =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> Original node</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-blue)"></span> Copy node</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-purple)"></span> Random pointer set</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--border-main); opacity:0.4"></span> Node</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let originalNodes = [];
        let copyNodes = [];
        let randomMap = new Map(); // original value → random target value for demo
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([1,2,3]); }

        function parseList(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(arr) {
            originalNodes = [...arr];
            // Set demo random for the examples
            if (arr.length === 3 && arr[0] === 1) {
                randomMap.set(1, 3);
                randomMap.set(2, 1);
                randomMap.set(3, 2);
            } else if (arr.length === 1) {
                randomMap.set(5, null);
            }
            document.getElementById('head-input').value = originalNodes.length ? originalNodes.join('->') : 'null';
            generateSteps();
            reset();
        }

        function loadCustom() {
            const headStr = document.getElementById('head-input').value.trim();
            originalNodes = parseList(headStr);
            // For custom, random is not supported in input, so set all null for demo
            randomMap.clear();
            originalNodes.forEach(val => randomMap.set(val, null));
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            const n = originalNodes.length;

            // STEP 0: INIT
            steps.push({
                type: 'init',
                currentOrig: null,
                currentCopy: null,
                listOrigState: [...originalNodes],
                listCopyState: [],
                panel: `Start brute-force copy.<br>First: copy values and next pointers. Second: set random by position.`,
                statusText: `Starting copy`,
                log: `Original length = ${n}`,
                logColor: 'var(--text-dim)'
            });

            // PASS 1: Create copy list with next pointers
            let copyList = [];
            for (let i = 0; i < n; i++) {
                copyList.push(originalNodes[i]);
                steps.push({
                    type: 'copy-next',
                    currentOrig: i,
                    currentCopy: i,
                    listOrigState: [...originalNodes],
                    listCopyState: [...copyList],
                    panel: `Copy node <b>${originalNodes[i]}</b> (position ${i})`,
                    statusText: `Building copy list`,
                    log: `new node = ${originalNodes[i]}`,
                    logColor: 'var(--accent-green)'
                });
            }

            // PASS 2: Set random pointers by position matching
            for (let i = 0; i < n; i++) {
                const targetVal = randomMap.get(originalNodes[i]);
                if (targetVal === null) {
                    steps.push({
                        type: 'set-random',
                        currentOrig: i,
                        currentCopy: i,
                        listOrigState: [...originalNodes],
                        listCopyState: [...copyList],
                        panel: `Node <b>${originalNodes[i]}</b> random = null`,
                        statusText: `Setting random`,
                        log: `random = null`,
                        logColor: 'var(--accent-purple)'
                    });
                    continue;
                }

                // Find position of target in original
                let targetPos = -1;
                for (let j = 0; j < n; j++) {
                    if (originalNodes[j] === targetVal) {
                        targetPos = j;
                        break;
                    }
                }

                steps.push({
                    type: 'find-position',
                    currentOrig: i,
                    currentCopy: i,
                    listOrigState: [...originalNodes],
                    listCopyState: [...copyList],
                    panel: `Find random target <b>${targetVal}</b> at position <b>${targetPos}</b>`,
                    statusText: `Position matching`,
                    log: `target position = ${targetPos}`,
                    logColor: 'var(--accent-orange)'
                });

                // Set in copy
                steps.push({
                    type: 'set-random',
                    currentOrig: i,
                    currentCopy: i,
                    listOrigState: [...originalNodes],
                    listCopyState: [...copyList],
                    panel: `Set copy node <b>${copyList[i]}</b>.random = copy node at pos <b>${targetPos}</b>`,
                    statusText: `Random set`,
                    log: `copy random = ${targetVal}`,
                    logColor: 'var(--accent-purple)'
                });
            }

            // FINAL
            steps.push({
                type: 'final',
                currentOrig: null,
                currentCopy: null,
                listOrigState: [...originalNodes],
                listCopyState: [...copyList],
                complete: true,
                finalStr: copyList.join('→'),
                panel: `Copy complete.<br>New list: <b>${copyList.join('→')}</b> with correct random pointers.`,
                statusText: `Done`,
                log: `Final copied list`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderList(containerId, state, highlightIdx, isOriginal) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (state.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'null';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                let cls = 'node';
                if (i === highlightIdx) cls += isOriginal ? ' from-orig' : '';
                nodeEl.className = cls;
                nodeEl.innerText = state[i];
                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = i === 0 ? 'head' : '';
                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);
                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderList('original-container', step.listOrigState, step.currentOrig, true);
            renderList('copy-container', step.listCopyState, step.currentCopy, false);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-orig-pos').innerText = step.currentOrig !== null ? step.currentOrig : '—';
            document.getElementById('val-copy-pos').innerText = step.currentCopy !== null ? step.currentCopy : '—';
            document.getElementById('val-random').innerText = step.randomTarget !== undefined ? step.randomTarget : '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
