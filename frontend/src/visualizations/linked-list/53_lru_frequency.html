<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRU + frequency - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .head-input { width: 220px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; background: var(--bg-surface); border-radius: 8px; padding: 12px; border: 2px solid var(--accent-purple); }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 78px; height: 78px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 13px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative; text-align: center; line-height: 1.2;
        }
        .node.current { border-color: var(--accent-orange); box-shadow: 0 0 14px rgba(227, 179, 65, 0.5); }
        .node.target { border-color: var(--accent-green); box-shadow: 0 0 14px rgba(63, 185, 80, 0.5); }
        .node-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        /* PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <button onclick="loadExample(1)">Ex 1</button>
        <button onclick="loadExample(2)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">LRU + frequency (Brute Force O(n) scan for getMostFrequent)</div>
        
        <div>
            <div class="ui-label" style="margin-bottom:6px">LRU Doubly Linked List (head = MRU, tail = LRU)</div>
            <div class="list-wrapper" id="lru-container"></div>
        </div>

        <div>
            <div class="ui-label" style="margin-bottom:6px">Frequency Map</div>
            <div class="list-wrapper" id="freq-container" style="border-color: var(--accent-blue);"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">capacity</span>
            <span class="info-value" id="val-capacity" style="color: var(--accent-orange);">2</span>
        </div>
        <div class="info-cell">
            <span class="info-label">current size</span>
            <span class="info-value" id="val-size" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">most frequent value</span>
            <span class="info-value" id="val-freq" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">getMostFrequent() =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> current / accessed</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-green)"></span> most frequent</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let capacity = 2;
        let cacheMap = new Map(); // key -> {value, node, freq}
        let lruHead = null;
        let lruTail = null;
        let nodesList = []; // for visualization
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        class Node {
            constructor(key, value) {
                this.key = key;
                this.value = value;
                this.freq = 1;
                this.prev = null;
                this.next = null;
            }
        }

        function init() { loadExample(1); }

        function loadExample(exId) {
            capacity = 2;
            cacheMap.clear();
            lruHead = null;
            lruTail = null;
            nodesList = [];
            generateSteps(exId);
            reset();
        }

        function generateSteps(exId) {
            steps = [];
            cacheMap.clear();
            lruHead = null;
            lruTail = null;

            const ops = exId === 1 ? [
                {type: 'put', key: 1, val: 10},
                {type: 'put', key: 2, val: 20},
                {type: 'get', key: 1},
                {type: 'put', key: 3, val: 30},
                {type: 'getMostFrequent'}
            ] : [
                {type: 'put', key: 1, val: 5},
                {type: 'put', key: 2, val: 5},
                {type: 'get', key: 1},
                {type: 'get', key: 2},
                {type: 'get', key: 1},
                {type: 'getMostFrequent'}
            ];

            steps.push({
                type: 'init',
                panel: `LRU Cache (capacity = ${capacity})`,
                statusText: `Initialized`,
                log: `capacity=${capacity}, empty`,
                logColor: 'var(--text-dim)'
            });

            for (let op of ops) {
                let result = null;

                if (op.type === 'put') {
                    // Simulate put
                    if (cacheMap.has(op.key)) {
                        // Update existing
                        const entry = cacheMap.get(op.key);
                        entry.value = op.val;
                        entry.freq++;
                        moveToHead(entry.node);
                    } else {
                        if (cacheMap.size === capacity) {
                            // Evict tail
                            const evictedKey = lruTail.key;
                            cacheMap.delete(evictedKey);
                            removeNode(lruTail);
                        }
                        const newNode = new Node(op.key, op.val);
                        addToHead(newNode);
                        cacheMap.set(op.key, newNode);
                    }
                    result = true;
                } else if (op.type === 'get') {
                    if (cacheMap.has(op.key)) {
                        const entry = cacheMap.get(op.key);
                        entry.freq++;
                        moveToHead(entry.node);
                        result = entry.value;
                    } else {
                        result = -1;
                    }
                } else if (op.type === 'getMostFrequent') {
                    let maxFreq = 0;
                    let maxVal = null;
                    for (let [key, entry] of cacheMap) {
                        if (entry.freq > maxFreq) {
                            maxFreq = entry.freq;
                            maxVal = entry.value;
                        }
                    }
                    result = maxVal;
                }

                steps.push({
                    type: op.type,
                    key: op.key,
                    val: op.val,
                    result: result,
                    panel: `${op.type.toUpperCase()}(${op.key}${op.val !== undefined ? `,${op.val}` : ''}) → ${result}`,
                    statusText: op.type.toUpperCase(),
                    log: `${op.type}(${op.key}${op.val !== undefined ? `,${op.val}` : ''}) = ${result}`,
                    logColor: op.type === 'getMostFrequent' ? 'var(--accent-blue)' : (result === true || result !== -1 ? 'var(--accent-green)' : 'var(--accent-red)')
                });
            }

            steps.push({
                type: 'final',
                complete: true,
                panel: `Final LRU list and frequencies shown`,
                statusText: `Done`,
                log: `final state`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function addToHead(node) {
            if (!lruHead) {
                lruHead = node;
                lruTail = node;
            } else {
                node.next = lruHead;
                lruHead.prev = node;
                lruHead = node;
            }
            nodesList = getCurrentList();
        }

        function removeNode(node) {
            if (node.prev) node.prev.next = node.next;
            if (node.next) node.next.prev = node.prev;
            if (node === lruHead) lruHead = node.next;
            if (node === lruTail) lruTail = node.prev;
            nodesList = getCurrentList();
        }

        function moveToHead(node) {
            removeNode(node);
            addToHead(node);
        }

        function getCurrentList() {
            const list = [];
            let curr = lruHead;
            while (curr) {
                list.push(curr);
                curr = curr.next;
            }
            return list;
        }

        function renderLRU() {
            const container = document.getElementById('lru-container');
            container.innerHTML = '';
            const list = getCurrentList();
            if (list.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'empty';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < list.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                nodeEl.className = 'node';
                const entry = cacheMap.get(list[i].key);
                nodeEl.innerHTML = `<div>${list[i].key}:${list[i].value}</div><div style="font-size:9px;color:var(--text-dim)">freq:${entry.freq}</div>`;
                unit.appendChild(nodeEl);
                container.appendChild(unit);
                if (i < list.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '↔';
                    container.appendChild(arrow);
                }
            }
        }

        function renderFreqMap() {
            const container = document.getElementById('freq-container');
            container.innerHTML = '';
            if (cacheMap.size === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'empty';
                container.appendChild(empty);
                return;
            }
            for (let [key, entry] of cacheMap) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const entryEl = document.createElement('div');
                entryEl.className = 'node';
                entryEl.innerHTML = `<div>${key}:${entry.value}</div><div style="font-size:9px;color:var(--text-dim)">f:${entry.freq}</div>`;
                unit.appendChild(entryEl);
                container.appendChild(unit);
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderLRU();
            renderFreqMap();

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-capacity').innerText = capacity;
            document.getElementById('val-size').innerText = cacheMap.size;
            document.getElementById('val-freq').innerText = step.result !== undefined && step.type === 'getMostFrequent' ? step.result : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.result !== undefined ? step.result : '—';
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
