<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skip list - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .head-input { width: 220px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; background: var(--bg-surface); border-radius: 8px; padding: 12px; border: 2px solid var(--accent-purple); }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.current { border-color: var(--accent-orange); box-shadow: 0 0 14px rgba(227, 179, 65, 0.5); }
        .node.target { border-color: var(--accent-green); box-shadow: 0 0 14px rgba(63, 185, 80, 0.5); }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        /* PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">sorted list =</label>
        <input type="text" id="head-input" class="head-input" placeholder="1->3->5">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([1,3,5])">Ex 1</button>
        <button onclick="loadExample([])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Skip list (Baseline: Sorted Linked List)</div>
        
        <div>
            <div class="ui-label" style="margin-bottom:6px">Current Sorted List</div>
            <div class="list-wrapper" id="current-container"></div>
        </div>

        <div class="result-display">
            <span class="ui-label" style="margin-bottom: 4px;">operation result =</span>
            <span id="res-val">—</span>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">list length</span>
            <span class="info-value" id="val-length" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">current node</span>
            <span class="info-value" id="val-current" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> current / traversal</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-green)"></span> found / inserted</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nodes = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([1,3,5]); }

        function parseList(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(arr) {
            nodes = [...arr];
            document.getElementById('head-input').value = nodes.length ? nodes.join('->') : 'null';
            generateSteps();
            reset();
        }

        function loadCustom() {
            const str = document.getElementById('head-input').value.trim();
            nodes = parseList(str);
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];
            let currentList = [...nodes];

            steps.push({
                type: 'init',
                listState: [...currentList],
                panel: `Sorted Linked List Baseline (Naive O(n) Skip List demo)`,
                statusText: `Start`,
                log: `list = [${nodes.join(',')}]`,
                logColor: 'var(--text-dim)'
            });

            // Example 1 operations
            // insert(4)
            let insertVal = 4;
            let insertPos = currentList.findIndex(v => v > insertVal);
            if (insertPos === -1) insertPos = currentList.length;
            for (let i = 0; i < insertPos; i++) {
                steps.push({
                    type: 'insert-traverse',
                    listState: [...currentList],
                    currentIdx: i,
                    panel: `Insert ${insertVal} — traversing position <b>${i}</b>`,
                    statusText: `Insert`,
                    log: `node ${currentList[i]} < ${insertVal}`,
                    logColor: 'var(--accent-orange)'
                });
            }
            currentList.splice(insertPos, 0, insertVal);
            steps.push({
                type: 'insert',
                listState: [...currentList],
                panel: `Inserted ${insertVal} at position <b>${insertPos}</b>`,
                statusText: `Insert`,
                log: `list = [${currentList.join(',')}]`,
                logColor: 'var(--accent-green)'
            });

            // search(3)
            let searchVal = 3;
            for (let i = 0; i < currentList.length; i++) {
                steps.push({
                    type: 'search-traverse',
                    listState: [...currentList],
                    currentIdx: i,
                    panel: `Search ${searchVal} — checking position <b>${i}</b>`,
                    statusText: `Search`,
                    log: `node ${currentList[i]}`,
                    logColor: currentList[i] === searchVal ? 'var(--accent-green)' : 'var(--accent-blue)'
                });
                if (currentList[i] === searchVal) break;
            }
            steps.push({
                type: 'search-result',
                listState: [...currentList],
                found: currentList.includes(searchVal),
                panel: `Search ${searchVal} = <b>${currentList.includes(searchVal)}</b>`,
                statusText: `Search`,
                log: `search(${searchVal}) = ${currentList.includes(searchVal)}`,
                logColor: 'var(--accent-green)'
            });

            // delete(1)
            let deleteVal = 1;
            let deletePos = currentList.indexOf(deleteVal);
            if (deletePos !== -1) {
                for (let i = 0; i <= deletePos; i++) {
                    steps.push({
                        type: 'delete-traverse',
                        listState: [...currentList],
                        currentIdx: i,
                        panel: `Delete ${deleteVal} — checking position <b>${i}</b>`,
                        statusText: `Delete`,
                        log: `node ${currentList[i]}`,
                        logColor: 'var(--accent-blue)'
                    });
                }
                currentList.splice(deletePos, 1);
                steps.push({
                    type: 'delete',
                    listState: [...currentList],
                    panel: `Deleted ${deleteVal}`,
                    statusText: `Delete`,
                    log: `list = [${currentList.join(',')}]`,
                    logColor: 'var(--accent-red)'
                });
            }

            // Final for example 1
            steps.push({
                type: 'final1',
                listState: [...currentList],
                complete: true,
                panel: `Example 1 complete — list = <b>[${currentList.join('→')}]</b>`,
                statusText: `Done`,
                log: `final list`,
                logColor: 'var(--accent-green)',
                bold: true
            });

            // Reset for example 2
            currentList = [];
            steps.push({
                type: 'reset2',
                listState: [],
                panel: `Example 2 — start with empty list`,
                statusText: `Start Ex 2`,
                log: `empty list`,
                logColor: 'var(--text-dim)'
            });

            // insert(5)
            currentList = [5];
            steps.push({
                type: 'insert5',
                listState: [5],
                panel: `Insert 5 — list empty, set head = 5`,
                statusText: `Insert`,
                log: `list = [5]`,
                logColor: 'var(--accent-green)'
            });

            // insert(2)
            currentList = [2,5];
            steps.push({
                type: 'insert2',
                listState: [2,5],
                panel: `Insert 2 — inserted before head`,
                statusText: `Insert`,
                log: `list = [2,5]`,
                logColor: 'var(--accent-green)'
            });

            // insert(8)
            currentList = [2,5,8];
            steps.push({
                type: 'insert8',
                listState: [2,5,8],
                panel: `Insert 8 — appended at end`,
                statusText: `Insert`,
                log: `list = [2,5,8]`,
                logColor: 'var(--accent-green)'
            });

            // search(5)
            steps.push({
                type: 'search5',
                listState: [2,5,8],
                panel: `Search 5 — found at position 1`,
                statusText: `Search`,
                log: `search(5) = true`,
                logColor: 'var(--accent-green)'
            });

            // delete(2)
            currentList = [5,8];
            steps.push({
                type: 'delete2',
                listState: [5,8],
                panel: `Delete 2 — removed head`,
                statusText: `Delete`,
                log: `list = [5,8]`,
                logColor: 'var(--accent-red)'
            });

            steps.push({
                type: 'final',
                listState: [5,8],
                complete: true,
                panel: `Example 2 complete — list = <b>[5→8]</b>`,
                statusText: `Done`,
                log: `final list`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderList(containerId, state, highlightIdx = -1) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (state.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'null';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                nodeEl.className = 'node';
                if (i === highlightIdx) nodeEl.classList.add('current');
                nodeEl.innerText = state[i];
                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = '';
                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);
                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            let highlight = -1;
            if (step.type.includes('traverse') || step.type.includes('insert') || step.type.includes('search') || step.type.includes('delete')) {
                highlight = step.currentIdx !== undefined ? step.currentIdx : 0;
            }

            renderList('current-container', step.listState || nodes, highlight);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-length').innerText = step.listState ? step.listState.length : 0;
            document.getElementById('val-current').innerText = (step.currentIdx !== undefined && step.listState) ? step.listState[step.currentIdx] : '—';

            const resVal = document.getElementById('res-val');
            if (step.complete) {
                resVal.innerText = step.listState ? `[${step.listState.join('→')}]` : '—';
                resVal.className = 'pop';
            } else {
                resVal.innerText = '—';
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
