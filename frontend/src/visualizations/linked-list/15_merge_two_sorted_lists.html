<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Two Sorted Lists - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .list-input { width: 220px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: LINKED LIST VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.current { border-color: var(--accent-purple); box-shadow: 0 0 14px rgba(163, 113, 247, 0.5); }
        .node.dummy { border-color: var(--accent-orange); background: #2a1600; color: var(--accent-orange); }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">l1 =</label>
        <input type="text" id="l1-input" class="list-input" placeholder="1->3->5">
        <label class="ui-label">l2 =</label>
        <input type="text" id="l2-input" class="list-input" placeholder="2->4->6">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([1,3,5], [2,4,6])">Ex 1</button>
        <button onclick="loadExample([], [0])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Merged Sorted List (Iterative Two-Pointer Approach):</div>
        <div class="list-wrapper" id="list-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">l1 current</span>
            <span class="info-value" id="val-l1" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">l2 current</span>
            <span class="info-value" id="val-l2" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">dummy / curr</span>
            <span class="info-value" id="val-curr" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">merged list =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> l1 pointer</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-purple)"></span> l2 pointer</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-green)"></span> Merged current</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-blue); opacity:0.4"></span> Dummy</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let l1Nodes = [];
        let l2Nodes = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([1,3,5], [2,4,6]); }

        function parseList(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(arr1, arr2) {
            l1Nodes = [...arr1];
            l2Nodes = [...arr2];
            document.getElementById('l1-input').value = l1Nodes.join('->');
            document.getElementById('l2-input').value = l2Nodes.join('->');
            generateSteps();
            reset();
        }

        function loadCustom() {
            const l1Str = document.getElementById('l1-input').value.trim();
            const l2Str = document.getElementById('l2-input').value.trim();
            const parsed1 = parseList(l1Str);
            const parsed2 = parseList(l2Str);
            loadExample(parsed1, parsed2);
        }

        function generateSteps() {
            steps = [];
            const merged = [];
            let i = 0, j = 0;

            // STEP 0: INIT
            steps.push({
                type: 'init',
                l1Idx: l1Nodes.length ? 0 : null,
                l2Idx: l2Nodes.length ? 0 : null,
                currIdx: -1,
                mergedState: [],
                panel: `Initialize: dummy node created.<br>l1 = [${l1Nodes.join(', ')}], l2 = [${l2Nodes.join(', ')}]`,
                statusText: `Starting Iterative Two-Pointer Merge`,
                log: `dummy created\nl1 pointer at head\nl2 pointer at head`,
                logColor: 'var(--text-dim)'
            });

            while (i < l1Nodes.length && j < l2Nodes.length) {
                const val1 = l1Nodes[i];
                const val2 = l2Nodes[j];

                if (val1 <= val2) {
                    merged.push(val1);
                    steps.push({
                        type: 'choose-l1',
                        l1Idx: i,
                        l2Idx: j,
                        currIdx: merged.length - 1,
                        mergedState: [...merged],
                        panel: `<b>${val1}</b> ≤ <b>${val2}</b> → append from l1`,
                        statusText: `Choosing from l1`,
                        log: `l1.val = ${val1} ≤ l2.val = ${val2}\nappend ${val1}`,
                        logColor: 'var(--accent-orange)'
                    });
                    i++;
                } else {
                    merged.push(val2);
                    steps.push({
                        type: 'choose-l2',
                        l1Idx: i,
                        l2Idx: j,
                        currIdx: merged.length - 1,
                        mergedState: [...merged],
                        panel: `<b>${val2}</b> < <b>${val1}</b> → append from l2`,
                        statusText: `Choosing from l2`,
                        log: `l2.val = ${val2} < l1.val = ${val1}\nappend ${val2}`,
                        logColor: 'var(--accent-purple)'
                    });
                    j++;
                }
            }

            // Remaining nodes from l1
            while (i < l1Nodes.length) {
                merged.push(l1Nodes[i]);
                steps.push({
                    type: 'append-l1',
                    l1Idx: i,
                    l2Idx: null,
                    currIdx: merged.length - 1,
                    mergedState: [...merged],
                    panel: `l2 exhausted → append remaining from l1: <b>${l1Nodes[i]}</b>`,
                    statusText: `Appending remaining l1`,
                    log: `append remaining l1: ${l1Nodes[i]}`,
                    logColor: 'var(--accent-orange)'
                });
                i++;
            }

            // Remaining nodes from l2
            while (j < l2Nodes.length) {
                merged.push(l2Nodes[j]);
                steps.push({
                    type: 'append-l2',
                    l1Idx: null,
                    l2Idx: j,
                    currIdx: merged.length - 1,
                    mergedState: [...merged],
                    panel: `l1 exhausted → append remaining from l2: <b>${l2Nodes[j]}</b>`,
                    statusText: `Appending remaining l2`,
                    log: `append remaining l2: ${l2Nodes[j]}`,
                    logColor: 'var(--accent-purple)'
                });
                j++;
            }

            // FINAL
            steps.push({
                type: 'final',
                l1Idx: null,
                l2Idx: null,
                currIdx: null,
                mergedState: [...merged],
                complete: true,
                finalStr: merged.join('→'),
                panel: `Merge complete in <b>O(m+n)</b> time.<br>Final list: <b>${merged.join('→')}</b>`,
                statusText: `Done.`,
                log: `Final Result: ${merged.join('→')}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderList(state) {
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            if (state.length === 0) {
                const empty = document.createElement('div');
                empty.style.fontFamily = 'monospace';
                empty.style.fontSize = '15px';
                empty.style.color = 'var(--accent-green)';
                empty.style.padding = '12px 20px';
                empty.style.border = '2px dashed var(--accent-green)';
                empty.style.borderRadius = '8px';
                empty.innerText = 'null';
                container.appendChild(empty);
                return;
            }

            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';

                const nodeEl = document.createElement('div');
                nodeEl.className = `node`;
                nodeEl.innerText = state[i];

                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = i === 0 ? 'head' : '';

                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);

                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderList(step.mergedState);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-l1').innerText = step.l1Idx !== null ? l1Nodes[step.l1Idx] : '—';
            document.getElementById('val-l2').innerText = step.l2Idx !== null ? l2Nodes[step.l2Idx] : '—';
            document.getElementById('val-curr').innerText = step.currIdx !== null && step.currIdx >= 0 ? step.mergedState[step.currIdx] : 'dummy';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
