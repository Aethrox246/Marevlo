<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Numbers Forward - Visualization</title>
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #0d1117;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .list-input { width: 280px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.current { border-color: var(--accent-orange); box-shadow: 0 0 14px rgba(227, 179, 65, 0.5); }
        .node.reversed { border-color: var(--accent-purple); box-shadow: 0 0 14px rgba(163, 113, 247, 0.5); }
        .node.added { border-color: var(--accent-green); box-shadow: 0 0 14px rgba(63, 185, 80, 0.5); }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">List1 =</label>
        <input type="text" id="list1-input" class="list-input" placeholder="1->2->3" value="1->2->3">
        <label class="ui-label">List2 =</label>
        <input type="text" id="list2-input" class="list-input" placeholder="4->5" value="4->5">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample(1)">Ex 1</button>
        <button onclick="loadExample(2)">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Add Numbers Forward (Reverse + Add + Reverse)</div>
        
        <div style="display:flex; gap:40px; align-items:flex-start; width:100%; max-width:1100px; justify-content:center;">
            <div>
                <div class="ui-label" style="margin-bottom:6px">Original List1</div>
                <div class="list-wrapper" id="list1-container"></div>
            </div>
            
            <div>
                <div class="ui-label" style="margin-bottom:6px">Original List2</div>
                <div class="list-wrapper" id="list2-container"></div>
            </div>
        </div>

        <div style="display:flex; gap:40px; align-items:flex-start; width:100%; max-width:1100px; justify-content:center;">
            <div>
                <div class="ui-label" style="margin-bottom:6px">Reversed List1</div>
                <div class="list-wrapper" id="rev1-container"></div>
            </div>
            
            <div>
                <div class="ui-label" style="margin-bottom:6px">Reversed List2</div>
                <div class="list-wrapper" id="rev2-container"></div>
            </div>
        </div>

        <div class="list-wrapper" id="addition-container" style="margin-top:20px; border:2px dashed var(--accent-blue); padding:12px; border-radius:12px; max-width:900px;">
            <!-- Addition steps will be rendered here -->
        </div>

        <div>
            <div class="ui-label" style="margin-bottom:6px">Final Reversed Result</div>
            <div class="list-wrapper" id="result-container"></div>
        </div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">carry</span>
            <span class="info-value" id="val-carry" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">current digit</span>
            <span class="info-value" id="val-digit" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">step</span>
            <span class="info-value" id="val-step" style="color: var(--accent-green);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">final sum =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> original</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-purple)"></span> reversed</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-green)"></span> result</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let list1 = [];
        let list2 = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample(1); }

        function parseList(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(exId) {
            if (exId === 1) {
                list1 = [1,2,3];
                list2 = [4,5];
            } else if (exId === 2) {
                list1 = [9,9];
                list2 = [1];
            }
            document.getElementById('list1-input').value = list1.join('->');
            document.getElementById('list2-input').value = list2.join('->');
            generateSteps();
            reset();
        }

        function loadCustom() {
            list1 = parseList(document.getElementById('list1-input').value);
            list2 = parseList(document.getElementById('list2-input').value);
            generateSteps();
            reset();
        }

        function generateSteps() {
            steps = [];

            // Step 0: Init
            steps.push({
                type: 'init',
                list1State: [...list1],
                list2State: [...list2],
                rev1State: [],
                rev2State: [],
                addState: [],
                panel: `Reverse + Add + Reverse:<br>1. Reverse both lists<br>2. Add reversed lists<br>3. Reverse result`,
                statusText: `Start`,
                log: `List1: [${list1.join(',')}], List2: [${list2.join(',')}]`,
                logColor: 'var(--text-dim)'
            });

            // Step 1: Reverse lists
            let rev1 = [...list1].reverse();
            let rev2 = [...list2].reverse();

            steps.push({
                type: 'reverse',
                list1State: [...list1],
                list2State: [...list2],
                rev1State: [...rev1],
                rev2State: [...rev2],
                panel: `Reversed List1: <b>${rev1.join('→')}</b><br>Reversed List2: <b>${rev2.join('→')}</b>`,
                statusText: `Reversed`,
                log: `reversed lists`,
                logColor: 'var(--accent-purple)'
            });

            // Step 2: Addition
            let addResult = [];
            let carry = 0;
            let i = 0;
            let j = 0;

            while (i < rev1.length || j < rev2.length || carry > 0) {
                let d1 = i < rev1.length ? rev1[i] : 0;
                let d2 = j < rev2.length ? rev2[j] : 0;
                let sum = d1 + d2 + carry;
                let digit = sum % 10;
                carry = Math.floor(sum / 10);
                addResult.unshift(digit); // build in forward order by prepending
                steps.push({
                    type: 'add',
                    list1State: [...list1],
                    list2State: [...list2],
                    rev1State: [...rev1],
                    rev2State: [...rev2],
                    addState: [...addResult],
                    carry: carry,
                    panel: `Digits: <b>${d1}</b> + <b>${d2}</b> + carry <b>${carry - (sum >= 10 ? 1 : 0)}</b> = <b>${digit}</b>`,
                    statusText: `Adding`,
                    log: `digit ${digit}, carry ${carry}`,
                    logColor: 'var(--accent-green)'
                });
                i++;
                j++;
            }

            // Final result
            steps.push({
                type: 'final',
                list1State: [...list1],
                list2State: [...list2],
                rev1State: [...rev1],
                rev2State: [...rev2],
                addState: [...addResult],
                complete: true,
                finalStr: addResult.join('→'),
                panel: `Final sum: <b>${addResult.join('→')}</b>`,
                statusText: `Done`,
                log: `final sum`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderList(containerId, state) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (state.length === 0) {
                const empty = document.createElement('div');
                empty.style.color = 'var(--text-dim)';
                empty.style.fontFamily = 'monospace';
                empty.innerText = 'null';
                container.appendChild(empty);
                return;
            }
            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';
                const nodeEl = document.createElement('div');
                nodeEl.className = 'node';
                nodeEl.innerText = state[i];
                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = '';
                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);
                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderList('list1-container', step.list1State || []);
            renderList('list2-container', step.list2State || []);
            renderList('rev1-container', step.rev1State || []);
            renderList('rev2-container', step.rev2State || []);
            renderList('result-container', step.addState || []);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-carry').innerText = step.carry !== undefined ? step.carry : '—';
            document.getElementById('val-digit').innerText = step.addState && step.addState.length ? step.addState[0] : '—';
            document.getElementById('val-step').innerText = step.type || '—';

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) resVal.className = 'pop';
            else resVal.className = '';

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
