<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Last Node - Visualization</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-surface: #161b22;
            --bg-input: #000000;
            --border-main: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #2d333b;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-log: #58a6ff;
            --accent-orange: #e3b341;
            --accent-blue: #388bfd;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ROW 1: INPUT BAR */
        .input-bar {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-main);
            flex-wrap: wrap;
        }
        label.ui-label { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-dim); }
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            height: 32px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }
        .head-input { width: 280px; }

        button {
            height: 32px; border-radius: 6px; padding: 0 14px; background: var(--btn-bg);
            border: 1px solid var(--border-main); color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--btn-hover); }

        /* ROW 2: LINKED LIST VISUAL */
        .visual-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .list-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: center; max-width: 900px; min-height: 90px; position: relative; }
        
        .node-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
        .node {
            min-width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace;
            transition: all 0.3s ease; border: 3px solid var(--border-main); background: #21262d;
            color: var(--text-main); position: relative;
        }
        .node.current { border-color: var(--accent-purple); box-shadow: 0 0 14px rgba(163, 113, 247, 0.5); }
        .node.prev { border-color: var(--accent-orange); box-shadow: 0 0 14px rgba(227, 179, 65, 0.5); }
        .node.deleted { opacity: 0.25; text-decoration: line-through; }
        .node-index { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        
        .arrow { font-size: 24px; color: var(--accent-blue); font-weight: bold; line-height: 1; padding: 0 6px; }
        .arrow.bypass { color: var(--accent-green); animation: linkAnim 800ms ease; }

        /* Pointers */
        .ptr-container { display: flex; flex-direction: column; align-items: center; position: absolute; bottom: -52px; gap: 2px; font-size: 12px; font-family: monospace; font-weight: bold; transition: all 0.3s; }
        .ptr-prev { color: var(--accent-orange); }
        .ptr-current { color: var(--accent-purple); }
        .ptr-arrow { font-size: 18px; line-height: 10px; margin-bottom: 2px; color: var(--text-dim); }

        /* ROW 3: PANEL */
        .action-panel {
            margin-top: 40px; background: var(--bg-surface); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 20px; width: 680px; text-align: center; font-family: monospace; min-height: 72px;
            display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 1.5;
        }

        /* ROW 4: INFO PANEL */
        .info-panel { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .info-cell {
            background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px;
            padding: 8px 14px; display: flex; flex-direction: column; align-items: center; min-width: 92px; gap: 4px;
        }
        .info-label { font-size: 11px; color: var(--text-dim); }
        .info-value { font-family: monospace; font-size: 15px; font-weight: 700; text-align: center; }

        /* ROW 5: RESULT DISPLAY */
        .result-display { margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        #res-val { font-size: 18px; color: var(--text-dim); font-family: monospace; transition: all 0.3s; font-weight: bold; }
        .pop { animation: popAnim 400ms ease; color: var(--accent-green) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-green); }
        .pop-false { animation: popAnim 400ms ease; color: var(--accent-red) !important; font-size: 24px !important; text-shadow: 0 0 12px var(--accent-red); }

        @keyframes popAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }
        @keyframes linkAnim { 0%{opacity:0; transform:translateX(-8px)} 100%{opacity:1; transform:translateX(0)} }

        /* ROW 6: STATUS BAR */
        .status-bar { margin-top: 8px; font-size: 13px; color: var(--text-dim); height: 1.2em; text-align: center; width: 600px;}

        /* ROW 7: CONTROLS */
        .controls { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { accent-color: var(--accent-blue); width: 100px; cursor: pointer; }

        /* ROW 8: LEGEND */
        .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        /* ROW 9: LOG PANEL */
        .log-panel {
            margin-top: 12px; background: var(--bg-page); border: 1px solid var(--border-main);
            border-radius: 6px; padding: 12px 16px; width: 700px; max-width: 90%; height: 120px;
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="input-bar">
        <label class="ui-label">head =</label>
        <input type="text" id="head-input" class="head-input" placeholder="1->2->3->4">
        <button onclick="loadCustom()">Load</button>
        <button onclick="loadExample([1,2,3,4])">Ex 1</button>
        <button onclick="loadExample([5])">Ex 2</button>
    </div>

    <div class="visual-container">
        <div class="ui-label">Singly Linked List (Delete Last Node):</div>
        <div class="list-wrapper" id="list-container"></div>
    </div>

    <div class="action-panel" id="main-panel">—</div>

    <div class="info-panel">
        <div class="info-cell">
            <span class="info-label">prev</span>
            <span class="info-value" id="val-prev" style="color: var(--accent-orange);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">current</span>
            <span class="info-value" id="val-current" style="color: var(--accent-purple);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">count</span>
            <span class="info-value" id="val-count" style="color: var(--accent-green);">—</span>
        </div>
        <div class="info-cell">
            <span class="info-label">head</span>
            <span class="info-value" id="val-head" style="color: var(--accent-blue);">—</span>
        </div>
    </div>

    <div class="result-display">
        <span class="ui-label" style="margin-bottom: 4px;">final list =</span>
        <span id="res-val">—</span>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="controls">
        <button onclick="reset()">↺ Reset</button>
        <button onclick="back()">← Back</button>
        <button onclick="togglePlay()" id="play-btn">Play</button>
        <button onclick="next()">Next →</button>
        <div class="controls" style="margin-top:0">
            <span class="ui-label" style="margin-right:4px; font-size:11px">Speed</span>
            <input type="range" id="speed-slider" min="0" max="2" value="1">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-orange)"></span> Prev pointer</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--accent-purple)"></span> Current pointer</div>
        <div class="legend-item"><span class="dot" style="background:var(--accent-green); border:3px solid var(--accent-green)"></span> Counted node</div>
        <div class="legend-item"><span class="dot" style="background:#21262d; border:3px solid var(--border-main); opacity:0.4"></span> Existing node</div>
    </div>

    <div class="log-panel" id="log"></div>

    <script>
        let nodes = [];
        let steps = [];
        let stepIndex = 0;
        let timer = null;
        const delays = [1800, 900, 450];

        function init() { loadExample([1,2,3,4]); }

        function parseHead(str) {
            if (!str || str.trim() === "") return [];
            return str.split('->').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }

        function loadExample(arr) {
            nodes = [...arr];
            document.getElementById('head-input').value = nodes.length ? nodes.join('->') : 'null';
            generateSteps();
            reset();
        }

        function loadCustom() {
            const headStr = document.getElementById('head-input').value.trim();
            const parsedNodes = parseHead(headStr);
            loadExample(parsedNodes);
        }

        function generateSteps() {
            steps = [];
            const n = nodes.length;

            // STEP 0: INIT
            steps.push({
                type: 'init',
                prev: null,
                current: null,
                count: 0,
                headVal: nodes.length ? nodes[0] : 'null',
                listState: [...nodes],
                panel: `Initialize: Check if head is null or single node.<br>List = ${nodes.length ? nodes.join('→') : 'null'}`,
                statusText: `Starting Delete Last Node.`,
                log: `Initialize\nhead = ${nodes.length ? nodes.join('→') : 'null'}`,
                logColor: 'var(--text-dim)'
            });

            if (n === 0 || n === 1) {
                // Edge case: empty or single node
                steps.push({
                    type: 'edge',
                    prev: null,
                    current: null,
                    count: 0,
                    headVal: 'null',
                    listState: [],
                    panel: n === 0 
                        ? `<span style="color:var(--accent-green)">head == null</span><br>Empty list, return null.`
                        : `<span style="color:var(--accent-green)">head.next == null</span><br>Single node, return null.`,
                    statusText: `Edge case: ${n === 0 ? 'empty' : 'single node'} → return null`,
                    log: n === 0 
                        ? `head == null → return null`
                        : `head.next == null → return null`,
                    logColor: 'var(--accent-green)'
                });
            } else {
                // First traversal: count nodes
                steps.push({
                    type: 'count-start',
                    prev: null,
                    current: 0,
                    count: 0,
                    headVal: nodes[0],
                    listState: [...nodes],
                    panel: `First traversal: Count total nodes.<br>current = head (node ${nodes[0]})`,
                    statusText: `Starting count traversal`,
                    log: `First pass: count nodes`,
                    logColor: 'var(--accent-purple)'
                });

                for (let i = 0; i < n; i++) {
                    steps.push({
                        type: 'count',
                        prev: null,
                        current: i,
                        count: i + 1,
                        headVal: nodes[0],
                        listState: [...nodes],
                        panel: `current = <b>${nodes[i]}</b><br>count = ${i+1}, move forward`,
                        statusText: `Counting node ${nodes[i]}`,
                        log: `current = ${nodes[i]}\ncount = ${i+1}`,
                        logColor: 'var(--accent-green)'
                    });
                }

                // Second traversal: find second-last
                steps.push({
                    type: 'second-start',
                    prev: null,
                    current: 0,
                    count: n,
                    headVal: nodes[0],
                    listState: [...nodes],
                    panel: `Count = ${n}. Reset current = head.<br>Move ${n-2} steps to reach second-to-last.`,
                    statusText: `Second pass: Find second-to-last`,
                    log: `Reset current = head\nMove ${n-2} steps`,
                    logColor: 'var(--accent-purple)'
                });

                for (let i = 0; i < n - 2; i++) {
                    steps.push({
                        type: 'second-move',
                        prev: i,
                        current: i + 1,
                        count: n,
                        headVal: nodes[0],
                        listState: [...nodes],
                        panel: `Move ${i+1} of ${n-2}<br>current = <b>${nodes[i+1]}</b>`,
                        statusText: `Moving to second-to-last`,
                        log: `current = ${nodes[i+1]}`,
                        logColor: 'var(--accent-orange)'
                    });
                }

                // Delete step
                steps.push({
                    type: 'delete',
                    prev: n - 2,
                    current: n - 1,
                    count: n,
                    headVal: nodes[0],
                    listState: nodes.slice(0, -1),
                    panel: `<span style="color:var(--accent-green)">Reached second-to-last</span><br>Set <code>prev.next = null</code>`,
                    statusText: `Deleting last node`,
                    log: `prev.next = null\nLast node removed`,
                    logColor: 'var(--accent-green)'
                });
            }

            // FINAL
            const finalList = n <= 1 ? [] : nodes.slice(0, -1);
            steps.push({
                type: 'final',
                prev: null,
                current: null,
                count: n,
                headVal: finalList.length ? finalList[0] : 'null',
                listState: finalList,
                complete: true,
                finalStr: finalList.length ? finalList.join('→') : 'null',
                panel: `Deletion complete in <b>O(n)</b> time.<br>Final list: <b>${finalList.length ? finalList.join('→') : 'null'}</b>`,
                statusText: `Done.`,
                log: `Final Result: ${finalList.length ? finalList.join('→') : 'null'}`,
                logColor: 'var(--accent-green)',
                bold: true
            });
        }

        function renderList(state, prevIdx, currentIdx) {
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            for (let i = 0; i < state.length; i++) {
                const unit = document.createElement('div');
                unit.className = 'node-unit';

                const nodeEl = document.createElement('div');
                let cls = 'node';
                if (i === prevIdx) cls += ' prev';
                if (i === currentIdx) cls += ' current';
                nodeEl.className = cls;
                nodeEl.innerText = state[i];

                const idxLabel = document.createElement('div');
                idxLabel.className = 'node-index';
                idxLabel.innerText = i === 0 ? 'head' : '';

                unit.append(nodeEl, idxLabel);
                container.appendChild(unit);

                if (i < state.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.innerText = '→';
                    container.appendChild(arrow);
                }
            }
        }

        function renderStep(idx) {
            const step = steps[idx];
            if (!step) return;

            renderList(step.listState, step.prev, step.current);

            document.getElementById('main-panel').innerHTML = step.panel || '—';
            document.getElementById('val-prev').innerText = step.prev !== null ? step.prev : '—';
            document.getElementById('val-current').innerText = step.current !== null ? step.current : '—';
            document.getElementById('val-count').innerText = step.count || '—';
            document.getElementById('val-head').innerText = step.headVal;

            const resVal = document.getElementById('res-val');
            resVal.innerText = step.complete ? step.finalStr : '—';
            if (step.complete) {
                resVal.className = step.finalStr !== 'null' ? 'pop' : 'pop-false';
            } else {
                resVal.className = '';
            }

            document.getElementById('status-text').innerText = step.statusText || '';

            const logPanel = document.getElementById('log');
            logPanel.innerHTML = '';
            for (let k = 0; k <= idx; k++) {
                if (steps[k].log) {
                    const line = document.createElement('div');
                    line.style.marginBottom = '3px';
                    line.style.whiteSpace = 'pre-wrap';
                    if (steps[k].logColor) line.style.color = steps[k].logColor;
                    if (steps[k].bold) line.style.fontWeight = 'bold';
                    line.innerText = steps[k].log;
                    logPanel.appendChild(line);
                }
            }
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function next() {
            if (stepIndex < steps.length - 1) {
                stepIndex++;
                renderStep(stepIndex);
            } else pause();
        }

        function back() {
            if (stepIndex > 0) {
                stepIndex--;
                renderStep(stepIndex);
            }
        }

        function reset() {
            pause();
            stepIndex = 0;
            renderStep(0);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (timer) pause();
            else {
                btn.innerText = 'Pause';
                if (stepIndex >= steps.length - 1) stepIndex = 0;
                timer = setInterval(next, delays[document.getElementById('speed-slider').value]);
            }
        }

        function pause() {
            clearInterval(timer);
            timer = null;
            document.getElementById('play-btn').innerText = 'Play';
        }

        window.onload = init;
    </script>
</body>
</html>
